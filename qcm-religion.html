<script type="application/json" id="quizdata">[{"q":"Que dit la preuve ontologique de l’existence de Dieu ?","a":["Dieu, l’être le plus grand qu’on puisse penser, doit exister","Tout a une cause, donc il existe nécessairement une cause première","Le monde est trop bien ordonné pour venir du hasard","Il est plus prudent de parier que Dieu existe"],"e":"Partie de la seule définition de Dieu, c’est une preuve a priori, proposée par Anselme. Kant lui objecte que l’existence n’ajoute rien à une idée."},{"q":"Qui réfute la preuve par le dessein (la nature trop bien organisée) ?","a":["Darwin, par la sélection naturelle","Kant, avec l’exemple des cent euros possibles","Diderot, avec l’imam","Nietzsche, avec la mort de Dieu"],"e":"La sélection naturelle explique des organes très adaptés, comme l’œil, sans que personne les ait conçus."},{"q":"Quelle objection Diderot fait-il au pari de Pascal ?","a":["Le pari ne dit pas sur quel Dieu parier","Le pari est trop risqué pour un homme raisonnable","Pascal ne croyait pas vraiment","Le pari prouve que Dieu n’existe pas"],"e":"Toute religion promettant une récompense infinie peut tenir le même raisonnement : « un imam en peut dire tout autant »."},{"q":"Pour Pascal, qu’est-ce que la foi ?","a":["Dieu sensible au cœur","Le résultat d’une démonstration","Une habitude transmise par la société","Une illusion qui console les pauvres"],"e":"La foi n’est pas un don de raisonnement : c’est le cœur qui sent Dieu, et non la raison."},{"q":"Qu’est-ce que le souverain bien, chez Kant ?","a":["L’accord de la vertu et d’un bonheur qui lui soit proportionné","Le plaisir le plus intense qu’un homme puisse éprouver","L’obéissance aux lois de l’État","La connaissance de Dieu par la raison"],"e":"Le devoir nous ordonne de poursuivre le souverain bien ; or rien, dans ce monde, ne garantit que la vertu sera récompensée par le bonheur."},{"q":"Pourquoi, selon Kant, faut-il admettre l’existence de Dieu ?","a":["Pour que le souverain bien soit possible","Parce que la raison théorique le démontre","Parce que la nature est trop bien faite","Parce que la religion nous console"],"e":"Dieu est un postulat de la raison pratique : « il est moralement nécessaire d’admettre l’existence de Dieu »."},{"q":"Que veut dire Marx quand il écrit que la religion est « l’opium du peuple » ?","a":["Elle console par un bonheur illusoire","Elle rend les hommes plus forts et plus lucides sur leur sort","Elle est la cause de toute la misère","Elle doit être imposée à tous"],"e":"La religion est « le soupir de la créature opprimée » : elle exprime la détresse et proteste contre elle, mais console par l’illusion."},{"q":"Pour Marx, que faut-il faire de la critique de la religion ?","a":["La prolonger en critique de la société","L’abandonner, car la religion reste utile au peuple","La réserver aux théologiens","La remplacer par une nouvelle religion"],"e":"Critiquer la religion, c’est critiquer le monde qui a besoin d’illusions."},{"q":"Selon Nietzsche, qu’entraîne la mort de Dieu ?","a":["La fin de l’égalité devant Dieu","Le retour de la religion sous une autre forme","La preuve logique que Dieu n’a jamais existé","L’égalité de tous les hommes"],"e":"« Dieu est mort : maintenant nous voulons que le surhomme vive. »"},{"q":"Kant refuse la preuve ontologique, mais admet l’existence de Dieu. Comment est-ce possible ?","a":["Dieu se postule, sans se démontrer","Kant change simplement d’avis entre ses deux textes","Kant pense que Dieu se voit dans la nature","Kant accepte finalement la preuve ontologique"],"e":"Pour Kant, la raison ne peut pas prouver Dieu ; elle peut seulement le postuler. Il parle de « foi rationnelle », non de savoir."},{"q":"Quel point commun relie Pascal et Kant ?","a":["La raison ne démontre pas Dieu, mais croire reste sensé","Tous deux prouvent l’existence de Dieu par la cause première","Tous deux pensent que la religion est une illusion","Tous deux refusent toute foi"],"e":"Pascal parie et en appelle au cœur ; Kant postule Dieu au nom de la morale. Aucun ne prétend le démontrer."},{"q":"Quelle objection commune peut-on faire au pari de Pascal et à la preuve morale de Kant ?","a":["Avoir besoin ou intérêt à croire ne prouve pas que Dieu existe","Ils reposent tous deux sur l’observation de la nature","Ils confondent le cœur et les sens","Ils oublient que tout a une cause"],"e":"C’est l’objection de Feuerbach : passer de « nous avons besoin que Dieu existe » à « Dieu existe », c’est prendre son désir pour la réalité."},{"q":"Quel point commun relie Marx et Nietzsche ?","a":["Ils jugent la religion par ses effets","Ils prouvent tous deux l’existence de Dieu par la raison","Ils défendent l’égalité devant Dieu","Ils voient dans la religion la source de la vraie liberté"],"e":"Marx y voit une consolation illusoire face à la misère ; Nietzsche, une morale de l’égalité qui retient l’homme supérieur."},{"q":"Si aucune preuve de l’existence de Dieu ne réussit, que devient la croyance en Dieu, d’après le cours ?","a":["Une foi","Une connaissance certaine","Une erreur","Une superstition"],"e":"Prouvée, la croyance deviendrait connaissance ; sans preuve, elle reste croyance, ou plutôt foi."},{"q":"Pourquoi définit-on la religion par une « instance non sensible » plutôt que par « Dieu » ?","a":["Pour inclure les religions sans divinité","Parce que toutes les religions ont un Dieu unique et créateur","Pour exclure le culte des ancêtres","Parce que Dieu est mort, selon Nietzsche"],"e":"Aucun critère, ni Dieu, ni la prière, ni les rites, ne convient à toutes les religions : la définition doit rester assez large."}]</script>
