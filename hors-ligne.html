<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Hors connexion · La philosophie en terminale</title>
<meta name="theme-color" content="#1E1A16">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
  --bg:#F1F5F4;--surface:#FFFFFF;--ink:#10262B;--muted:#4A6064;--line:#D0DCDA;--focus:#0B6E6D;
  --display:Georgia,"Times New Roman",serif;--text:system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0C1719;--surface:#142427;--ink:#E6F0EF;--muted:#9DB5B4;--line:#24393C;--focus:#4FD1C5}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0C1719;--surface:#142427;--ink:#E6F0EF;--muted:#9DB5B4;--line:#24393C;--focus:#4FD1C5}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.06rem/1.6 var(--text)}
main{max-width:46rem;margin:0 auto;padding:2.5rem max(16px,env(safe-area-inset-left,0px)) 3rem max(16px,env(safe-area-inset-right,0px))}
h1{font:700 clamp(1.7rem,5vw,2.4rem)/1.15 var(--display);margin:0 0 .8rem}
p{margin:0 0 1rem}
.muted{color:var(--muted)}
ul{list-style:none;margin:1.2rem 0 0;padding:0;display:grid;gap:.5rem}
li a{display:block;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.75rem 1rem;color:inherit;text-decoration:none;font-weight:600}
li a:hover{border-color:var(--ink)}
a:focus-visible,button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.btn{font:inherit;font-weight:600;background:none;color:inherit;border:1.5px solid currentColor;border-radius:999px;padding:.5rem 1.1rem;cursor:pointer}
</style>
</head>
<body>
<main>
<h1>Pas de connexion</h1>
<p>Cette page n’est pas disponible sans connexion. Les pages ci-dessous, elles, peuvent se lire sans connexion.</p>
<p><button type="button" class="btn" id="re">Réessayer</button></p>
<ul id="liste"></ul>
<p class="muted" id="vide" hidden>Aucune page n’est encore enregistrée. Pour lire les fiches sans connexion, utilisez « Lire les fiches sans connexion » dans le menu, quand vous avez du réseau.</p>
</main>
<script>
document.getElementById('re').onclick=function(){location.reload()};
(function(){var ul=document.getElementById('liste'),vide=document.getElementById('vide');
if(!window.caches){vide.hidden=false;return}
caches.open('philo-pages').then(function(c){return c.keys().then(function(ks){
  ks=ks.filter(function(k){return /\.html$/.test(new URL(k.url).pathname)&&!/hors-ligne\.html$/.test(k.url)});
  if(!ks.length){vide.hidden=false;return}
  return Promise.all(ks.map(function(k){return c.match(k).then(function(r){var t0=+r.headers.get('X-Telecharge');if(t0&&Date.now()-t0>20*24*3600*1000){c.delete(k);return null}return r.text()}).then(function(t){if(t===null)return null;var m=t.match(/<title>([^<]*)<\/title>/);var d=document.createElement('textarea');d.innerHTML=m?m[1]:k.url;return {u:k.url,t:d.value.replace(/ · La philosophie en terminale$/,'')}})})).then(function(L){
    L=L.filter(Boolean);if(!L.length){vide.hidden=false;return}
    L.sort(function(a,b){return a.t.localeCompare(b.t,'fr')});
    L.forEach(function(x){var li=document.createElement('li'),a=document.createElement('a');a.href=x.u;a.textContent=x.t;li.appendChild(a);ul.appendChild(li)});
  });
})}).catch(function(){vide.hidden=false});})();
</script>
</body>
</html>
