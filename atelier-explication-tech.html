  if(Array.isArray(m)){const o={}; m.forEach(n=>o[n]=0); m=store.mine[store.tid]=o;}
  if(store.col==null) store.col=0;
  const body=t.lignes.map((l,i)=>{const n=i+1;
    return `<div class="ln${m[n]!=null?" mine c"+m[n]:""}" data-n="${n}"><span class="no">${n%5===0||n===1?n:""}</span><span class="t">${esc(l)}</span></div>`;}).join("");
  const head=`<div class="ph"><b>${esc(t.auteur)}</b>, <i>${esc(t.oeuvre)}</i><small>Choisissez une couleur, puis cliquez sur une ligne pour la surligner (re-cliquez pour l’enlever). <a href="${esc(t.fiche)}">Voir la fiche</a></small>${palette()}</div>`;
  $("#panel").innerHTML=head+`<div class="txtbody">${body}</div>`;
  $("#mobtx").innerHTML=`<summary>Le texte : ${esc(t.auteur)}</summary>${palette()}<div class="txtbody">${body}</div>`;
}
function setFocus(a,b){
  $$(".ln").forEach(el=>{const n=+el.dataset.n; el.classList.toggle("focus", a!=null&&n>=a&&n<=b);});
  if(a!=null){ const el=$("#panel .ln[data-n='"+a+"']"); const p=$("#panel");
    if(el&&p&&p.offsetParent){ p.scrollTo({top:Math.max(0,el.offsetTop-80),behavior:"smooth"}); } }
}
function corrA(t,a){
  const e=t.etapes[a.e], pv=t.etapes[a.e-1];
  return part("Où se situe le passage ? "+lnk(a.l),`<p>Il appartient à l'étape ${a.e+1} du texte (${lr(e.l)}) ${lnk(e.l)}, dont l'idée est : ${e.idee}</p>`)+
    part("Ce qu'il faut expliquer",`<p>${e.args}</p>`)+
    part("Avec ce qui précède et ce qui suit",`<p>${pv?"Ce qui précède : "+pv.idee+" ":"Le passage se trouve au début du texte. "}${e.lien}</p>`);
}
function corrC(t,c){
  return part("1. Courte introduction",`<p>Reformulez la question avec vos mots, dites pourquoi elle se pose à propos de ce texte, en quoi elle est intéressante et pourquoi la réponse n'est pas évidente.</p>`)+
    part("2. Première partie : le texte",`<p>Répondez à la manière de l'auteur : ${t.th}</p>${ul(t.etapes.map(e=>e.idee))}`)+
    part("3. Seconde partie : votre avis",`<p>Indiquez une limite du raisonnement, confrontez le texte à une autre thèse philosophique, ou trouvez d'autres arguments qui le soutiennent. Point d'appui : ${c.c||c.q}</p><p>Mobilisez votre cours : exemples, repères conceptuels, références philosophiques.</p>`)+
    part("4. Conclusion",`<p>Un court bilan (une à deux phrases) qui répond de manière claire à la question, en tenant ensemble ce que le texte apporte et ce qui reste discutable.</p>`);
}
function renderStep(i=store.step, root=$("#sheet"), lect=false){
  const t=cur(), S=STEPS[i], d=D();
  if(!lect) $("#tabs").innerHTML=STEPS.map((s,j)=>`<button data-go="${j}" class="${j<i?"done":""}" ${j===i?'aria-current="step"':""}><span class="n">${j<i?"✓":j+1}</span>${s.lbl}</button>`).join("");
  let h=`<div class="eyebrow">Partie ${i+1} sur ${STEPS.length} · ${S.g}</div><h2>${S.lbl}</h2><p class="consigne">${S.consigne}</p>`;
  if(S.k==="lire"){
    h+=box("À faire au brouillon",
      field("l_obj","Auteur et œuvre. De quoi parle le texte ?","(son objet, son thème principal)",2)+
      field("l_not","La ou les notions du programme auxquelles il se rattache","",1)+
      field("l_voc","Concepts importants et termes de liaison","",2)+
      field("l_dif","Difficultés repérées","",3)+
      corr("lire",part("Notion du programme",`<p>${t.notion}.</p>`)+part("L'objet du texte",`<p>${t.q}</p>`)+part("Concepts à éclaircir",ul(t.concepts.map(c=>`<b>${c.c}.</b> ${c.s}`)))));
  }
  if(S.k==="A"){
    t.A.forEach((a,j)=>{
      h+=box(`<span class="tagq">Question A${j+1}</span>Expliquez ce passage (${lr(a.l)})`,
        `<p class="quote">« ${esc(a.q).replace(/ \/ /g," / ")} » ${lnk(a.l)}</p>`+field("a"+j,"Votre réponse","(précise et développée, en tenant compte du contexte)",7)+corr("A"+j,corrA(t,a)),a.l);
    });
  }
  if(S.k==="B"){
    h+=box(`<span class="tagq">Question B1</span>La question du texte`,
      `<p class="quote">À quelle question l'auteur tente-t-il de répondre ? Autrement dit, à quelle question ce texte pourrait-il apporter une réponse ?</p>`+field("b1","Votre réponse","",3)+
      corr("B1",`<p>${t.q}</p>`+(t.opinion?part("L'opinion que le texte remet en cause",`<p>${t.opinion}</p>`):"")+(t.enjeu?part("L'enjeu",`<p>${t.enjeu}</p>`):"")));
    h+=box(`<span class="tagq">Question B2</span>La structure argumentative`,
      `<p class="quote">Quels arguments l'auteur utilise-t-il, et comment sont-ils agencés ? Identifiez les grandes parties du texte (en général 3), indiquez leurs lignes et décrivez les arguments de chacune, en indiquant les liens logiques.</p>`+field("b2","Votre réponse","(partie 1, lignes … : …)",9)+
      corr("B2",t.etapes.map((e,j)=>part(`Partie ${j+1} (${lr(e.l)}) ${lnk(e.l)}`,`<p><b>Idée.</b> ${e.idee}</p><p><b>Arguments.</b> ${e.args}</p><p><b>Lien.</b> ${e.lien}</p>`)).join("")));
    h+=box(`<span class="tagq">Question B3</span>L'idée principale, ou thèse de l'auteur`,
      `<p class="quote">Quelle réponse l'auteur donne-t-il à la question qu'il se pose ? Les arguments identifiés en B2 doivent éclairer cette thèse, la préciser.</p>`+field("b3","Votre réponse","",4)+
      corr("B3",`<p>${t.th}</p><p>Vérifiez que chaque argument de B2 éclaire cette thèse ou la précise.</p>`));
  }
  if(S.k==="C"){
    t.CQ.forEach((c,j)=>{
      h+=box(`<span class="tagq">Question C${j+1}</span>${esc(c.q)}`,
        (c.c?`<p class="muted" style="margin:0 0 10px">${esc(c.c)}</p>`:"")+
        field("c"+j+"i","1. Courte introduction","(enjeux de la question : pourquoi elle se pose, pourquoi la réponse n'est pas évidente)",3)+
        field("c"+j+"t","2. Première partie : le texte","(répondre à la manière de l'auteur, à partir de ses arguments)",5)+
        field("c"+j+"a","3. Seconde partie : votre avis","(limites du raisonnement, autre thèse philosophique, autres arguments ; utilisez votre cours)",5)+
        field("c"+j+"k","4. Conclusion","(une à deux phrases qui répondent clairement à la question)",2)+
        corr("C"+j,corrC(t,c)));
    });
  }
  if(S.k==="bilan"){
    const ck=d.red||[];
    h+=box("Les conseils",TIPS.map((b,j)=>`<label class="checkrow"><input type="checkbox" data-red="${j}" ${ck[j]?"checked":""}> ${b}</label>`).join("")+
      `<p class="muted" style="margin:10px 0 0">L'épreuve dure quatre heures : consacrez environ la moitié du temps au choix du sujet et au brouillon, l'autre moitié à la rédaction.</p>`+
      `<p class="bilan-links" style="margin:14px 0 10px"><a href="methode-explication-de-texte.html">Relire la méthode</a> · <a href="auto-evaluation-explication-tech.html">Auto-évaluation</a></p><div class="actions"><button class="btn" type="button" data-pdf="1">Enregistrer en PDF</button><a class="btn primary depot" href="https://framaforms.org/explication-de-texte-1792421291" target="_blank" rel="noopener noreferrer">Déposer mon travail ↗</a></div><p class="depot-note">Pour rendre votre travail, et ce uniquement si vous souhaitez que je vous corrige : enregistrez-le en PDF, puis cliquez sur « Déposer mon travail ». N’oubliez pas d’indiquer votre prénom et nom sur le Framaform.</p>`);
  }
  const last=i===STEPS.length-1;
  if(!lect) h+=`<div class="actions">${i>0?`<button class="btn" data-go="${i-1}">← Précédent</button>`:""}<span class="spacer"></span>${last?"":`<button class="btn primary" data-go="${i+1}">Étape suivante →</button>`}</div>`;
  root.innerHTML=h;
}
function renderLecture(){
  const z=$("#lecture"); z.innerHTML="";
  STEPS.forEach((_,i)=>{ const sec=document.createElement("section"); sec.className="sheet lsec"; z.appendChild(sec); renderStep(i,sec,true); });
}
function rerender(){ document.documentElement.classList.contains("lect")?renderLecture():renderStep(); }
const HW = [278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];
const WIN = {"’":0x92,"‘":0x91,"“":0x93,"”":0x94,"…":0x85,"–":0x96,"—":0x97,"œ":0x9C,"Œ":0x8C,"€":0x80,"•":0x95};
function pdfChar(ch){
  if(WIN[ch]) return WIN[ch];
  const c = ch.charCodeAt(0);
  if(c>=32 && c<127) return c;
  if(c>=0xA0 && c<=0xFF) return c;
  return 63;
}
function pdfWidth(code){
  if(code>=32 && code<127) return HW[code-32];
  if(code===0x92||code===0x91) return 222;
  if(code===0x93||code===0x94||code===0xAB||code===0xBB) return 333;
  if(code===0x85) return 1000;
  if(code===0x96) return 556;
  if(code===0x97) return 1000;
  if(code===0x9C) return 944;
  if(code===0x8C) return 1000;
  if(code>=0xC0 && code<=0xFF){
    const base = String.fromCharCode(code).normalize("NFD").charAt(0).charCodeAt(0);
    if(base>=32 && base<127) return HW[base-32];
  }
  return 556;
}
function toWin(str){ return Array.from(str.normalize("NFC")).map(pdfChar); }
function wrapLine(codes, size, maxW, bold){
  const k = size/1000*(bold?1.06:1), words = []; let cur = [];
  codes.forEach(c=>{ if(c===32){ words.push(cur); cur=[]; } else cur.push(c); }); words.push(cur);
  const lines = []; let line = [], w = 0;
  words.forEach(wd=>{
    const ww = wd.reduce((a,c)=>a+pdfWidth(c)*k,0), sp = pdfWidth(32)*k;
    if(line.length && w+sp+ww>maxW){ lines.push(line); line=[]; w=0; }
    if(line.length){ line = line.concat([32]); w+=sp; }
    line = line.concat(wd); w+=ww;
  });
  lines.push(line); return lines;
}
function buildPdf(blocks){
  /* blocks : [{t:texte, size, bold, before}] ; texte avec \n = paragraphes */
  const W=595, H=842, M=56, maxW=W-2*M, pages=[]; let ops=[], y=H-M;
  const newPage=()=>{ pages.push(ops.join("\n")); ops=[]; y=H-M; };
  const esc1=codes=>codes.map(c=>(c===40||c===41||c===92)?"\\"+String.fromCharCode(c):(c<32?"?":String.fromCharCode(c))).join("");
  blocks.forEach(bl=>{
    const lead = bl.size*1.4; y -= (bl.before||0);
    bl.t.split("\n").forEach(par=>{
      wrapLine(toWin(par), bl.size, maxW, bl.bold).forEach(line=>{
        if(y-lead < M) newPage();
        y -= lead;
        if(line.length) ops.push(`BT /${bl.bold?"F2":"F1"} ${bl.size} Tf ${M} ${y.toFixed(1)} Td (${esc1(line)}) Tj ET`);
      });
    });
  });
  pages.push(ops.join("\n"));
  const objs = [];
  const n = pages.length;
  objs[1] = "<< /Type /Catalog /Pages 2 0 R >>";
  objs[2] = `<< /Type /Pages /Kids [${pages.map((_,i)=>(5+i*2)+" 0 R").join(" ")}] /Count ${n} >>`;
  objs[3] = "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>";
  objs[4] = "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>";
  pages.forEach((c,i)=>{
    objs[5+i*2] = `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${6+i*2} 0 R >>`;
    objs[6+i*2] = `<< /Length ${c.length} >>\nstream\n${c}\nendstream`;
  });
  let out = "%PDF-1.4\n"; const off = [];
  for(let i=1;i<objs.length;i++){ off[i]=out.length; out += `${i} 0 obj\n${objs[i]}\nendobj\n`; }
  const xr = out.length;
  out += `xref\n0 ${objs.length}\n0000000000 65535 f \n` + off.slice(1).map(o=>String(o).padStart(10,"0")+" 00000 n \n").join("") + `trailer\n<< /Size ${objs.length} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`;
  const u = new Uint8Array(out.length); for(let i=0;i<out.length;i++) u[i]=out.charCodeAt(i)&255;
  return u;
}


function pdfBlocks(){
  const t=cur(), d=D(), g=k=>(d[k]||"").trim()||"(non rempli)";
  const bl=[{t:"Explication de texte (séries technologiques)", size:19, bold:true},{t:"Texte : "+t.auteur+(t.oeuvre?", "+t.oeuvre:""), size:12, bold:true, before:10}];
  const H=x=>bl.push({t:x, size:13, bold:true, before:14}), P=x=>bl.push({t:x, size:11, before:3}), S=x=>bl.push({t:x, size:11, bold:true, before:8});
  H("Lire le texte");
  P("Objet : "+g("l_obj")); P("Notion du programme : "+g("l_not")); P("Concepts et termes de liaison : "+g("l_voc")); P("Difficultés : "+g("l_dif"));
  H("A. Éléments d'analyse");
  t.A.forEach((a,j)=>{ S("A"+(j+1)+". Expliquez : « "+a.q+" » ("+lr(a.l)+")"); P(g("a"+j)); });
  H("B. Éléments de synthèse");
  S("B1. La question du texte"); P(g("b1")); S("B2. La structure argumentative"); P(g("b2")); S("B3. L'idée principale, ou thèse de l'auteur"); P(g("b3"));
  H("C. Commentaire");
  t.CQ.forEach((c,j)=>{ S("C"+(j+1)+". "+c.q); P("Introduction : "+g("c"+j+"i")); P("Première partie (le texte) : "+g("c"+j+"t")); P("Seconde partie (mon avis) : "+g("c"+j+"a")); P("Conclusion : "+g("c"+j+"k")); });
  return bl;
}
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,2600); }
function savePdf(){
  try{
    const bytes=buildPdf(pdfBlocks());
    const url=URL.createObjectURL(new Blob([bytes],{type:"application/pdf"}));
    const a=document.createElement("a"); a.href=url; a.download="explication-de-texte-technologique.pdf";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    toast("PDF enregistré");
  }catch(e){ toast("Impossible de créer le PDF ici"); }
}
function init(){
  try{ const h=decodeURIComponent((location.hash||"").slice(1)); if(h && TEXTS.some(t=>t.id===h)){ store.tid=h; store.step=0; } }catch(e){}
  if(!TEXTS.some(t=>t.id===store.tid)) store.tid=TEXTS[0].id;
  const groups=[]; TEXTS.forEach(t=>{ let g=groups.find(x=>x.n===t.theme); if(!g){g={n:t.theme,l:[]};groups.push(g);} g.l.push(t); });
  $("#pick").innerHTML=groups.map(g=>`<optgroup label="${esc(g.n)}">`+g.l.map(t=>`<option value="${t.id}" ${t.id===store.tid?"selected":""}>${esc(t.label)}</option>`).join("")+`</optgroup>`).join("");
  $("#pick").addEventListener("change",e=>{store.tid=e.target.value;store.step=0;shown.clear();save();renderText();rerender();setFocus(null);});
  document.addEventListener("input",e=>{ const k=e.target.dataset&&e.target.dataset.k; if(k){D()[k]=e.target.value;save();} });
  document.addEventListener("change",e=>{ const x=e.target.dataset||{}; const d=D(); if(x.red!=null){d.red=d.red||[];d.red[+x.red]=e.target.checked;save();} });
  document.addEventListener("focusin",e=>{ const q=e.target.closest&&e.target.closest("[data-l]"); if(q){const [a,b]=q.dataset.l.split("-").map(Number);setFocus(a,b);} });
  document.addEventListener("click",e=>{
    if(e.target.closest("[data-pdf]")){ savePdf(); return; }
    const g=e.target.closest("[data-go]"); if(g){store.step=+g.dataset.go;save();renderStep();setFocus(null);window.scrollTo({top:0,behavior:"smooth"});return;}
    const c=e.target.closest("[data-corr]"); if(c){const id=c.dataset.corr; shown.has(id)?shown.delete(id):shown.add(id); const y=window.scrollY; rerender(); window.scrollTo(0,y); return;}
    const h=e.target.closest("[data-hl]"); if(h){const [a,b]=h.dataset.hl.split("-").map(Number);setFocus(a,b);const m=$("#mobtx"); if(m&&m.offsetParent){m.open=true;} return;}
    const sw=e.target.closest("[data-col]"); if(sw){store.col=+sw.dataset.col; $$(".sw").forEach(x=>{const on=+x.dataset.col===store.col; x.classList.toggle("on",on); x.setAttribute("aria-pressed",on);}); save(); return;}
    const ln=e.target.closest(".ln"); if(ln){const n=+ln.dataset.n; let m=store.mine[store.tid]; if(!m||Array.isArray(m)) m=store.mine[store.tid]={}; const on=m[n]===store.col; if(on) delete m[n]; else m[n]=store.col; $$(".ln[data-n='"+n+"']").forEach(el=>{el.className=el.className.replace(/\s*\b(mine|c\d)\b/g,""); if(!on) el.classList.add("mine","c"+store.col);}); save();}
  });
  renderText(); renderStep();
}
init();

/* ---------- Accessibilité : page d'origine / mode lecture ---------- */
(function(){
  const btn=$("#a11y-btn"), menu=$("#a11y-menu"), opts=menu.querySelectorAll(".a11y-opt"), r=document.documentElement, K="atelier-lecture";
  function set(m){
    const on=m==="lect", was=r.classList.contains("lect");
    opts.forEach(o=>o.setAttribute("aria-checked",o.dataset.mode===m?"true":"false"));
    if(on===was) return;
    r.classList.toggle("lect",on);
    if(on){ $("#sheet").innerHTML=""; renderLecture(); const m=$("#mobtx"); if(m) m.open=true; } else { $("#lecture").innerHTML=""; renderStep(); }
    try{localStorage.setItem(K,on?"1":"0")}catch(e){}
  }
  function open(on){ menu.hidden=!on; btn.setAttribute("aria-expanded",on?"true":"false"); }
  btn.addEventListener("click",e=>{ e.stopPropagation(); open(menu.hidden); });
  opts.forEach(o=>o.addEventListener("click",()=>{ set(o.dataset.mode); open(false); btn.focus(); }));
  document.addEventListener("click",e=>{ if(!menu.hidden && !menu.contains(e.target) && e.target!==btn) open(false); });
  document.addEventListener("keydown",e=>{ if(e.key==="Escape" && !menu.hidden){ open(false); btn.focus(); } });
  let v=false; try{v=localStorage.getItem(K)==="1"}catch(e){}
  if(v) set("lect");
})();
