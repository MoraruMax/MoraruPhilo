phie est écrite dans cet immense livre qui", "se tient toujours ouvert devant nos yeux, je veux dire", "l’Univers, mais on ne peut le comprendre si l’on ne", "s’applique pas d’abord à en comprendre la langue et à", "connaître les caractères avec lesquels il est écrit.", "Il est écrit dans la langue mathématique et ses", "caractères sont des triangles, des cercles et autres", "figures géométriques, sans le moyen desquels il est", "humainement impossible d’en comprendre un mot. Sans", "eux, c’est une errance vaine dans un labyrinthe", "obscur."], "notion": "La nature", "q": "Comment connaître la nature ?", "opinion": "Que l’on connaîtrait la nature en lisant les livres des philosophes, ou qu’elle resterait incompréhensible.", "enjeu": "Cette thèse repose sur une métaphore : il faut expliquer en quel sens la nature est un « livre » et pourquoi sa langue est mathématique.", "th": "La nature est intelligible, car elle est écrite en langue mathématique. Sans la géométrie, il est impossible d’y comprendre quoi que ce soit.", "etapes": [{"l": "1-5", "idee": "Un livre toujours ouvert ; Il faut d’abord apprendre la langue.", "args": "La philosophie est écrite dans l’Univers, « immense livre » qui se tient sans cesse devant nos yeux : la nature est accessible à tous. On ne peut comprendre ce livre sans s’appliquer à en comprendre la langue et les caractères.", "lien": "Après avoir comparé l’univers à un livre toujours ouvert, Galilée dit qu’il faut en apprendre la langue."}, {"l": "6-9", "idee": "Cette langue est mathématique.", "args": "Ses caractères sont des triangles, des cercles et d’autres figures géométriques : la nature a une structure mathématique.", "lien": "Cette langue est celle des mathématiques ; sans elle, on ne peut rien comprendre à la nature."}, {"l": "9-11", "idee": "Sans les mathématiques, aucune compréhension ; Une errance dans un labyrinthe.", "args": "Sans eux, il est « humainement impossible » d’en comprendre un mot. Se passer des mathématiques revient à errer en vain dans un labyrinthe obscur.", "lien": "Sans les mathématiques, on erre dans un labyrinthe : c’est la thèse."}], "concepts": [{"c": "Métaphore du livre", "s": "L’Univers est comparé à un livre : il a un sens qu’on peut déchiffrer."}, {"c": "Langue mathématique", "s": "Les relations entre les phénomènes s’expriment par des figures et des quantités, non par des qualités sensibles."}, {"c": "Philosophie (naturelle)", "s": "Au XVIIe siècle, ce mot désigne la connaissance de la nature, c’est-à-dire ce que l’on appellera la physique."}], "A": [{"q": "La philosophie est écrite dans cet immense livre qui se tient toujours ouvert devant nos yeux, je veux dire l’Univers", "l": "1-3", "e": 0}, {"q": "Il est écrit dans la langue mathématique", "l": "6-6", "e": 1}, {"q": "Sans eux, c’est une errance vaine dans un labyrinthe obscur", "l": "9-11", "e": 2}], "CQ": [{"q": "La nature est-elle vraiment mathématique ?", "c": "Les mathématiques sont-elles dans la nature, ou une manière dont l’esprit la décrit ? Que devient alors ce que l’on ne peut pas mesurer ?"}, {"q": "Une science qui exclut le qualitatif. Si seul le mathématique compte, que dire des couleurs, des odeurs, de la beauté ? (À comparer avec Jacob, sur l’explication scientifique.)", "c": ""}], "theme": "La nature"}, {"id": "nature-genese", "label": "Genèse : la domination de l’homme sur la nature", "auteur": "La Bible", "oeuvre": "Genèse, chapitre 1", "fiche": "nature-genese.html", "lignes": ["Puis Dieu dit : Faisons l'homme à notre image, selon", "notre ressemblance, et qu'il domine sur les poissons", "de la mer, sur les oiseaux du ciel, sur le bétail, sur", "toute la terre, et sur tous les reptiles qui rampent", "sur la terre.", "Dieu créa l'homme à son image, il le créa à l'image de", "Dieu, il créa l'homme et la femme.", "Dieu les bénit, et Dieu leur dit : Soyez féconds,", "multipliez, remplissez la terre, et l'assujettissez ;", "et dominez sur les poissons de la mer, sur les oiseaux", "du ciel, et sur tout animal qui se meut sur la terre."], "notion": "La nature", "q": "L’homme a-t-il une place particulière dans la nature, et quel pouvoir en découle ?", "opinion": "Que l’homme ne serait qu’un animal parmi d’autres, sans place particulière dans la nature.", "enjeu": "Cette thèse n’est pas évidente : que signifie être créé « à l’image » de Dieu, et pourquoi un pouvoir en découlerait-il ?", "th": "Créé « à l’image » de Dieu, l’homme se distingue des autres créatures. Cette ressemblance divine fonde sa domination sur les animaux et sur la terre entière.", "etapes": [{"l": "1-7", "idee": "Dieu décide de créer l’homme à sa ressemblance ; La ressemblance divine s’accompagne d’une domination ; L’homme et la femme sont tous deux créés à cette image.", "args": "Avant même de le créer, Dieu annonce son projet : « Faisons l’homme à notre image, selon notre ressemblance ». L’homme est présenté comme une créature singulière. La même phrase ajoute qu’il « domine » sur les poissons, les oiseaux, le bétail, la terre et les reptiles. Être à l’image de Dieu, c’est partager quelque chose de son pouvoir. Le verset 27 répète trois fois le verbe créer. La ressemblance concerne l’humanité entière, « l’homme et la femme ».", "lien": "Après avoir décidé de créer l’homme à sa ressemblance, Dieu le crée, homme et femme, à son image : cette ressemblance le distingue."}, {"l": "8-11", "idee": "La bénédiction est un commandement ; Le pouvoir s’étend à tout animal.", "args": "Dieu les bénit et leur dit d’être féconds, de remplir la terre et de « l’assujettir ». La domination est confiée à l’humanité comme une mission. La domination est répétée : elle porte sur les poissons, les oiseaux et « tout animal qui se meut sur la terre ». Aucune espèce n’est exclue.", "lien": "La bénédiction est un commandement : l’homme doit remplir la terre et l’assujettir, ce qui étend son pouvoir à tout animal."}], "concepts": [{"c": "Image et ressemblance", "s": "L’homme est dit semblable à Dieu : il se distingue par là des autres créatures, qui ne reçoivent pas cette marque."}, {"c": "Créer", "s": "Faire exister à partir de rien, par un acte de volonté. La nature est ici une œuvre, non un principe autonome."}, {"c": "Dominer / assujettir", "s": "Exercer un pouvoir sur quelque chose et le soumettre. Le texte emploie deux verbes pour dire que la nature est soumise à l’homme."}], "A": [{"q": "Faisons l'homme à notre image, selon notre ressemblance", "l": "1-2", "e": 0}, {"q": "qu'il domine sur les poissons de la mer, sur les oiseaux du ciel", "l": "2-3", "e": 0}, {"q": "remplissez la terre, et l'assujettissez", "l": "9-9", "e": 1}], "CQ": [{"q": "Un droit ou une responsabilité ?", "c": "Dominer, est-ce exploiter, ou prendre soin ? Le texte n’emploie que des verbes de pouvoir, mais certains lecteurs y voient une charge de gardien. Qu’en pensez-vous ? (À comparer avec Descola.)"}, {"q": "Le fondement religieux de la maîtrise. Si le pouvoir sur la nature vient de Dieu, que devient-il lorsqu’on cesse d’y croire ? Descartes le reformule autrement, au nom de la science.", "c": ""}], "theme": "La nature"}, {"id": "nature-jacob", "label": "Jacob : le refus de la finalité comme principe explicatif", "auteur": "Jacob", "oeuvre": "Le Jeu des possibles", "fiche": "nature-jacob.html", "lignes": ["Il a sans cesse fallu lutter, dans les sciences de la", "nature, pour se débarrasser de l’anthropomorphisme,", "pour éviter d’attribuer des qualités humaines à des", "entités variées.", "En particulier, la finalité qui caractérise beaucoup", "d’activités humaines a longtemps servi de modèle", "universel pour expliquer tout ce qui, dans la nature,", "paraît orienté vers un but. C’est le cas notamment des", "êtres vivants dont toutes les structures, les", "propriétés, le comportement semblent à l’évidence", "répondre à un dessein. Le monde vivant a donc", "constitué la cible favorite des causes finales. De", "fait, la principale « preuve » de l’existence de Dieu", "a longtemps été « l’argument d’intention ». Développé", "notamment par Paley [pasteur anglican et théologien]", "dans sa Théologie naturelle [1802], publiée quelques", "années seulement avant l’Origine des Espèces [Darwin,", "1859], cet argument est le suivant. Si vous trouvez", "une montre, vous ne doutez pas qu’elle a été fabriquée", "par un horloger. De même, si vous considérez un", "organisme un peu complexe, avec l’évidente finalité de", "tous ses organes, comment ne pas conclure qu’il a été", "produit par la volonté d’un Créateur ? Car il serait", "simplement absurde, dit Paley, de supposer que l’œil", "d’un mammifère, par exemple, avec la précision de son", "optique et sa géométrie, aurait pu se former par pur", "hasard.", "Il y a deux niveaux d’explication, bien distincts mais", "trop souvent confondus, pour rendre compte de", "l’apparente finalité dans le monde vivant.", "Le premier correspond à l’individu, à l’organisme dont", "la plupart des propriétés, tant de structure que de", "fonctions ou de comportement, semblent bien dirigées", "vers un but. C’est le cas, par exemple, des", "différentes phases de la reproduction, du", "développement embryonnaire, de la respiration, de la", "digestion, de la recherche de nourriture, de la fuite", "devant le prédateur, de la migration, etc. Ce genre de", "dessein préétabli, qui se manifeste dans chaque être", "vivant, ne se retrouve pas dans le monde inanimé.", "D’où, pendant longtemps, le recours à un agent", "particulier, à une force vitale échappant aux lois de", "la physique. C’est seulement au cours de ce siècle [20", "ème] qu’à disparu l’opposition entre, d’un côté,", "l’interprétation mécaniste donnée aux activités d’un", "être vivant et, de l’autre, ses propriétés et son", "comportement. En particulier, le paradoxe s’est résolu", "quand la biologie moléculaire a emprunté à la théorie", "de l’information le concept et le terme de programme", "pour désigner l’information génétique d’un organisme.", "Selon cette manière de voir, les chromosomes d’un œuf", "fécondé contiennent, inscrits dans l’ADN, les plans", "qui régissent le développement du futur organisme, ses", "activités, son comportement.", "Le second niveau d’explication correspond, non plus à", "l’organisme, mais à l’ensemble du monde vivant. C’est", "là qu’a été détruite par Darwin l’idée de création", "particulière, l’idée que chaque espèce a été", "individuellement conçue et exécutée par un créateur.", "Contre l’argument d’intention, Darwin montra que la", "combinaison de certains mécanismes simples peut", "simuler un dessein préétabli. Trois conditions doivent", "être remplies : il faut que les structures varient ;", "que ces variations soient héréditaires ; que la", "reproduction de certains variants soit favorisée par", "les conditions de milieu. A l’époque de Darwin, les", "mécanismes qui sous-tendent l’hérédité étaient encore", "inconnus. Depuis lors, la génétique classique, puis la", "biologie moléculaire ont donné des bases génétiques et", "biochimiques à la reproduction et à la variation. Peu", "à peu, les biologistes ont ainsi élaboré une", "représentation raisonnable, quoiqu’encore incomplète,", "de ce qui est considéré comme le principal moteur de", "l’évolution du vivant : la sélection naturelle."], "notion": "La nature", "q": "Comment expliquer scientifiquement l’apparente finalité du vivant ?", "opinion": "Que la finalité du vivant prouverait un dessein : un Créateur ou une force vitale.", "enjeu": "Cette thèse n’est pas évidente : comment expliquer sans dessein ce qui semble si bien conçu ?", "th": "L’apparente finalité du vivant ne suppose ni force vitale ni Créateur. Elle s’explique par le programme génétique de l’organisme et par la sélection naturelle, qui simule un dessein préétabli.", "etapes": [{"l": "1-27", "idee": "Se débarrasser de l’anthropomorphisme ; Le vivant, cible des causes finales.", "args": "Les sciences de la nature ont dû éviter d’attribuer des qualités humaines à des entités variées. La finalité humaine servait de modèle universel. Les êtres vivants paraissent répondre à un dessein. De là l’« argument d’intention » de Paley : la montre suppose un horloger, l’organisme un Créateur.", "lien": "Après avoir montré pourquoi le vivant a été la cible favorite des causes finales (l’argument de la montre de Paley), Jacob distingue deux niveaux d’explication : l’organisme d’abord."}, {"l": "28-54", "idee": "Premier niveau : l’organisme.", "args": "Reproduction, développement, digestion semblent poursuivre un but. On a longtemps invoqué une force vitale. La biologie moléculaire résout le paradoxe avec le concept de programme génétique.", "lien": "Le programme génétique explique la finalité de l’organisme ; reste à expliquer celle de l’ensemble du monde vivant."}, {"l": "55-74", "idee": "Second niveau : l’ensemble du monde vivant ; Trois conditions de la sélection naturelle.", "args": "Darwin détruit l’idée de création particulière de chaque espèce, en montrant que des mécanismes simples peuvent simuler un dessein. Il faut que les structures varient, que ces variations soient héréditaires, et que la reproduction de certains variants soit favorisée par le milieu.", "lien": "Au second niveau, la sélection naturelle (Darwin) simule un dessein : sans force vitale ni Créateur."}], "concepts": [{"c": "Anthropomorphisme", "s": "Fait d’attribuer des caractères humains à ce qui n’est pas humain."}, {"c": "Cause finale", "s": "Explication d’un phénomène par le but qu’il poursuit, et non par ce qui le produit."}, {"c": "Programme génétique", "s": "Information inscrite dans l’ADN, qui règle le développement et le comportement de l’organisme."}], "A": [{"q": "Si vous trouvez une montre, vous ne doutez pas qu’elle a été fabriquée par un horloger", "l": "18-20", "e": 0}, {"q": "les chromosomes d’un œuf fécondé contiennent, inscrits dans l’ADN, les plans qui régissent le développement du futur organisme", "l": "51-53", "e": 1}, {"q": "Contre l’argument d’intention, Darwin montra que la combinaison de certains mécanismes simples peut simuler un dessein préétabli", "l": "60-62", "e": 2}], "CQ": [{"q": "Le vivant a-t-il un sens ?", "c": "Si la finalité n’est qu’apparente, que reste-t-il de l’idée de fonction ou de but dans le vivant ? Est-ce une simple métaphore ?"}, {"q": "La notion de programme. Jacob emprunte le terme à l’informatique. Est-ce un retour déguisé de la finalité ? (À comparer avec Aristote.)", "c": ""}], "theme": "La nature"}, {"id": "nature-mill", "label": "Mill : faut-il suivre la nature ?", "auteur": "Mill", "oeuvre": "La Nature", "fiche": "nature-mill.html", "lignes": ["Le mot Nature a deux sens principaux : il désigne soit", "le système entier des choses, avec l’ensemble de leurs", "propriétés, soit les choses telles qu’elles seraient", "en l’absence d’intervention humaine.", "Dans le premier sens, la doctrine selon laquelle", "l’homme devrait suivre la nature est absurde, car", "l’homme ne peut rien faire d’autre que suivre la", "nature, puisque toutes ses actions reposent sur une ou", "plusieurs lois naturelles physiques ou mentales, et", "obéissent à ces lois.", "Dans le second sens du mot, la doctrine selon laquelle", "l’homme devrait suivre la nature ou, en d’autres", "termes, devrait prendre le cours spontané des choses", "pour modèle de ses actions volontaires, est à la fois", "immorale et irrationnelle.", "Irrationnelle, parce que toute action humaine consiste", "à altérer le cours spontané de la nature, et toute", "action utile à l’améliorer.", "Immorale, parce que le cours des phénomènes naturels", "étant rempli de tous les événements qui, lorsqu’ils", "résultent de l’action humaine méritent le plus", "d’inspirer la répulsion, quiconque s’efforcerait par", "ses actes d’imiter le cours naturel des choses serait", "universellement considéré comme le plus mauvais des", "hommes.", "Le plan de la Nature, considéré dans son ensemble, ne", "peut avoir eu pour seul, ni même pour principal objet", "le bien des humains ou des autres êtres sensibles. Le", "bien qu’il leur procure résulte principalement de", "leurs propres efforts. Tout ce qui dans la nature", "indique une intention tournée vers le bien, prouve que", "cette bonté n’est armée que d’un pouvoir limité.", "Le devoir de l’homme est de coopérer avec les pouvoirs", "bienfaisants, non pas en imitant le cours de la", "nature, mais en s’efforçant sans cesse de le corriger,", "et de rendre cette part de la nature sur laquelle il", "peut exercer un contrôle plus conforme à une norme", "élevée de justice et de bonté."], "notion": "La nature", "q": "L’homme doit-il prendre la nature pour modèle ?", "opinion": "Qu’il faudrait suivre la nature, la prendre pour modèle de conduite.", "enjeu": "Cette thèse repose sur une distinction : il faut identifier les deux sens du mot « nature » pour comprendre pourquoi la maxime est rejetée dans les deux cas.", "th": "Suivre la nature est une maxime absurde si la nature est le tout, et irrationnelle et immorale si elle est le cours spontané des choses. L’homme doit corriger la nature, selon une norme de justice et de bonté.", "etapes": [{"l": "1-10", "idee": "Deux sens du mot « nature » ; Premier sens : une maxime absurde.", "args": "Le système entier des choses avec leurs propriétés, ou les choses telles qu’elles seraient sans intervention humaine. Si la nature est le tout, l’homme ne peut rien faire d’autre que la suivre, car toutes ses actions obéissent à des lois naturelles.", "lien": "Après avoir distingué deux sens du mot « nature », Mill examine le premier : si la nature est le tout, suivre la nature est une maxime absurde."}, {"l": "11-32", "idee": "Second sens : irrationnelle ; Second sens : immorale.", "args": "Toute action humaine altère le cours spontané de la nature, et toute action utile l’améliore. Prendre ce cours pour modèle contredit l’action. Le cours naturel est rempli d’événements qui, venant de l’homme, inspireraient la répulsion. Imiter la nature ferait de lui le plus mauvais des hommes.", "lien": "Dans le second sens (le cours spontané des choses), la maxime est irrationnelle et immorale."}, {"l": "33-38", "idee": "Un devoir de correction.", "args": "Le plan de la nature ne vise pas seulement le bien des êtres sensibles. L’homme doit corriger la part de la nature qu’il contrôle, selon une norme élevée de justice et de bonté.", "lien": "Si la nature ne peut servir de modèle, l’homme doit la corriger : c’est son devoir."}], "concepts": [{"c": "Nature (premier sens)", "s": "Le système entier des choses et de leurs propriétés, y compris l’homme et ses actions."}, {"c": "Nature (second sens)", "s": "Ce qui arrive sans intervention humaine : le cours spontané des choses."}, {"c": "Irrationnel / immoral", "s": "Irrationnel : contraire à la raison, car agir c’est modifier. Immoral : contraire au bien, car la nature est cruelle."}], "A": [{"q": "Le mot Nature a deux sens principaux", "l": "1-1", "e": 0}, {"q": "Irrationnelle, parce que toute action humaine consiste à altérer le cours spontané de la nature", "l": "16-17", "e": 1}, {"q": "non pas en imitant le cours de la nature, mais en s’efforçant sans cesse de le corriger", "l": "34-35", "e": 2}], "CQ": [{"q": "La nature est-elle une norme ?", "c": "Mill refuse que la nature fonde le bien. Faut-il alors admettre que la morale vient de l’homme seul ? (À comparer avec Aristote.)"}, {"q": "Jusqu’où corriger ?", "c": "Corriger la nature, est-ce une raison de la dominer sans limite ? Mill parle de justice et de bonté, non de maîtrise. Quelle différence avec Descartes ?"}], "theme": "La nature"}, {"id": "nature-pascal", "label": "Pascal : ruches et hommes", "auteur": "Pascal", "oeuvre": "Préface du Traité du vide", "fiche": "nature-pascal.html", "lignes": ["Les ruches des abeilles étaient aussi bien mesurées il", "y a mille ans qu’aujourd’hui, et chacune d’elle forme", "cet hexagone aussi exactement la première fois que la", "dernière. Il en est de même de tout ce que les animaux", "produisent par ce mouvement occulte. La nature les", "instruit à mesure que la nécessité les presse ; mais", "cette science fragile se perd avec les besoins qu’ils", "en ont : comme ils la reçoivent sans étude, ils n’ont", "pas le bonheur de la conserver ; et toutes les fois", "qu’elle leur est donnée, elle leur est nouvelle,", "puisque, la nature n’ayant pour objet que de maintenir", "les animaux dans un ordre de perfection bornée, elle", "leur inspire cette science nécessaire, toujours égale,", "de peur qu’ils ne tombent dans le dépérissement, et ne", "permet pas qu’ils y ajoutent, de peur qu’ils ne", "passent les limites qu’elle leur a prescrites.", "Il n’en est pas de même de l’homme, qui n’est produit", "que pour l’infinité. Il est dans l’ignorance au", "premier âge de sa vie ; mais il s’instruit sans cesse", "dans son progrès : car il tire avantage non seulement", "de sa propre expérience, mais encore de celle de ses", "prédécesseurs, parce qu’il garde toujours dans sa", "mémoire les connaissances qu’il s’est une fois", "acquises, et que celle des anciens lui sont toujours", "présentes dans les livres qu’ils en ont laissés."], "notion": "La nature", "q": "Qu’est-ce qui distingue l’homme de l’animal ?", "opinion": "Que l’homme et l’animal seraient semblables, ou que l’animal progresserait comme l’homme.", "enjeu": "Cette thèse n’est pas évidente : l’animal instruit par la nature n’est-il pas parfait, et l’homme, ignorant à sa naissance, plus démuni ?", "th": "L’animal est limité par la nature, qui l’instruit sans lui permettre de progresser. L’homme, produit pour l’infinité, s’instruit par sa propre expérience et par celle de ses prédécesseurs.", "etapes": [{"l": "1-16", "idee": "Les ruches sont toujours les mêmes ; Un savoir reçu sans étude, et perdu ; Une perfection bornée.", "args": "Elles étaient aussi bien mesurées il y a mille ans qu’aujourd’hui : chacune forme son hexagone aussi exactement la première fois que la dernière. La nature instruit l’animal selon ses besoins. Comme il reçoit ce savoir sans étude, il n’a pas le bonheur de le conserver. La nature veut maintenir les animaux dans un ordre de perfection bornée : elle ne les laisse ni dépérir, ni progresser.", "lien": "Après avoir montré que l’animal reste toujours le même, borné par la nature qui l’instruit, Pascal passe à l’homme."}, {"l": "17-25", "idee": "L’homme, lui, est « produit pour l’infinité » ; Une mémoire des savoirs.", "args": "Ignorant au premier âge, il s’instruit sans cesse. Il n’est pas limité par un instinct. Il tire avantage de sa propre expérience et de celle de ses prédécesseurs, qu’il garde en mémoire et dans les livres des anciens.", "lien": "L’homme, lui, est produit pour l’infinité : il s’instruit par sa propre expérience et par celle de ses prédécesseurs."}], "concepts": [{"c": "Instinct", "s": "Savoir inné, identique chez tous les individus d’une espèce, qui ne varie pas. Pascal parle d’un « mouvement occulte »."}, {"c": "Perfection bornée", "s": "L’animal est parfait dans ce qu’il fait, mais il ne peut pas aller au-delà."}, {"c": "Progrès", "s": "Amélioration continue des connaissances. Il suppose la mémoire et la transmission."}], "A": [{"q": "Les ruches des abeilles étaient aussi bien mesurées il y a mille ans qu’aujourd’hui", "l": "1-2", "e": 0}, {"q": "la nature n’ayant pour objet que de maintenir les animaux dans un ordre de perfection bornée", "l": "11-12", "e": 0}, {"q": "l’homme, qui n’est produit que pour l’infinité", "l": "17-18", "e": 1}], "CQ": [{"q": "L’homme est-il tout à fait sans instinct ?", "c": "Pascal oppose un animal fixe à un homme perfectible. Les sciences contemporaines nuancent-elles cette idée ?"}, {"q": "Un progrès sans fin ?", "c": "Si l’homme est fait pour l’infini, rien n’arrête ses progrès ? Le progrès des savoirs est-il toujours un bien ? (À comparer avec Descartes.)"}], "theme": "La nature"}, {"id": "religion-kant", "label": "Kant : l’existence de Dieu comme nécessité morale", "auteur": "Kant", "oeuvre": "Critique de la raison pratique", "fiche": "religion-kant.html", "lignes": ["Le bonheur est l’état dans le monde d’un être", "raisonnable, à qui, dans tout le cours de son", "existence, tout arrive suivant son souhait et sa", "volonté ; il repose donc sur l’accord de la nature", "avec le but tout entier qu’il poursuit, et aussi avec", "le principe essentiel de détermination de sa volonté.", "Or la loi morale, comme une loi de la liberté, ordonne", "par des principes déterminants qui doivent être tout à", "fait indépendants de la nature et de l’accord de cette", "dernière avec notre faculté de désirer (comme", "mobiles). Mais l’être raisonnable, qui agit dans le", "monde, n’est pas cependant en même temps cause du", "monde et de la nature elle-même. Donc, dans la loi", "morale, il n’y a pas le moindre principe pour une", "connexion nécessaire entre la moralité et le bonheur", "qui lui est proportionné, chez un être appartenant", "comme partie au monde et par conséquent en dépendant,", "qui justement pour cela, ne peut, par sa volonté, être", "cause de cette nature et ne peut, quant à son bonheur,", "la mettre par ses propres forces complètement d’accord", "avec ses principes pratiques.", "Cependant dans le problème pratique de la raison pure,", "c’est-à-dire dans la poursuite nécessaire du souverain", "bien, on postule une telle connexion comme nécessaire", ": nous devons chercher à réaliser le souverain bien", "(qui doit donc être possible). Ainsi on postule aussi", "l’existence d’une cause de toute la nature, distincte", "de la nature et contenant le principe de cette", "connexion, c’est-à-dire de l’harmonie exacte du", "bonheur et de la moralité. Mais cette cause suprême", "doit renfermer le principe de l’accord de la nature,", "non seulement avec une loi de la volonté des êtres", "raisonnables, mais aussi avec la représentation de", "cette loi en tant que ceux-ci en font le principe", "suprême de détermination de leur volonté ; partant non", "seulement avec les mœurs d’après la forme, mais aussi", "avec leur moralité comme principe déterminant, c’est-", "à-dire avec leur intention morale.", "Le souverain bien n’est donc possible dans le monde", "qu’en tant qu’on admet une cause suprême de la nature", "qui a une causalité conforme à l’intention morale. Or", "un être qui est capable d’agir d’après la", "représentation de lois est une intelligence (un être", "raisonnable), et la causalité d’un tel être, d’après", "cette représentation des lois, est sa volonté. Donc la", "cause suprême de la nature, en tant qu’elle doit être", "supposée pour le souverain bien, est un être qui, par", "l’entendement et la volonté, est la cause, partant", "l’auteur de la nature, c’est-à-dire Dieu. Par", "conséquent le postulat de la possibilité du souverain", "bien dérivé (du meilleur monde) est en même temps le", "postulat de la réalité d’un souverain bien primitif, à", "savoir de l’existence de Dieu.", "Or, c’était un devoir pour nous de réaliser le", "souverain bien, partant non seulement un droit, mais", "aussi une nécessité liée comme besoin avec le devoir,", "de supposer la possibilité de ce souverain bien, qui,", "puisqu’il n’est possible que sous la condition de", "l’existence de Dieu, lie inséparablement la", "supposition de cette existence avec le devoir, c’est-", "à-dire qu’il est moralement nécessaire d’admettre", "l’existence de Dieu."], "notion": "La religion", "q": "Comment l’existence de Dieu peut-elle être exigée par la morale, et non démontrée par la théorie ?", "opinion": "Que l’existence de Dieu devrait se démontrer par la raison théorique, ou qu’elle ne serait qu’une croyance arbitraire.", "enjeu": "Cette thèse n’est pas évidente : comment une exigence morale peut-elle fonder la croyance en Dieu sans prétendre le démontrer ?", "th": "La loi morale ne garantit pas l’accord entre moralité et bonheur. Or nous devons réaliser le souverain bien. Il faut donc postuler une cause suprême de la nature, c’est-à-dire Dieu, comme condition de sa possibilité.", "etapes": [{"l": "1-21", "idee": "Bonheur et loi morale sont distincts ; Aucun lien nécessaire dans la loi morale.", "args": "Le bonheur suppose l’accord de la nature avec nos souhaits. La loi morale, elle, est une loi de la liberté, indépendante de la nature. L’être raisonnable n’est pas cause de la nature : rien dans la loi morale ne garantit un bonheur proportionné à la moralité.", "lien": "Après avoir distingué le bonheur de la loi morale (aucun lien nécessaire), Kant rappelle que nous devons pourtant poursuivre le souverain bien, qui les unit."}, {"l": "22-41", "idee": "Pourtant, nous devons poursuivre le souverain bien ; Il faut postuler une cause suprême.", "args": "La raison pratique exige de réaliser le souverain bien, harmonie de la moralité et du bonheur. Il doit donc être possible. Cette connexion suppose une cause de la nature, distincte d’elle, qui accorde le bonheur à l’intention morale.", "lien": "Si nous devons réaliser le souverain bien, il faut en postuler la possibilité, donc une cause suprême de la nature."}, {"l": "41-62", "idee": "Cette cause est Dieu.", "args": "Cette cause est une intelligence et une volonté, auteur de la nature. Il est donc moralement nécessaire d’admettre l’existence de Dieu.", "lien": "Cette cause suprême est Dieu : c’est le postulat de la raison pratique."}], "concepts": [{"c": "Souverain bien", "s": "Accord parfait de la vertu et du bonheur, que le devoir nous demande de réaliser."}, {"c": "Postulat", "s": "Proposition qu’on admet comme condition nécessaire à la pratique morale, sans pouvoir la démontrer."}, {"c": "Raison pratique", "s": "Raison en tant qu’elle détermine la volonté et l’action."}], "A": [{"q": "il n’y a pas le moindre principe pour une connexion nécessaire entre la moralité et le bonheur qui lui est proportionné", "l": "14-16", "e": 0}, {"q": "dans la poursuite nécessaire du souverain bien, on postule une telle connexion comme nécessaire", "l": "23-24", "e": 1}, {"q": "il est moralement nécessaire d’admettre l’existence de Dieu", "l": "61-62", "e": 2}], "CQ": [{"q": "Une preuve ou une exigence ?", "c": "Kant ne prouve pas Dieu : il le postule. Est-ce une raison suffisante de croire ? (À comparer avec Nietzsche.)"}, {"q": "Morale sans religion ?", "c": "Si la morale ne dépend pas de Dieu, pourquoi Dieu devient-il nécessaire ? La morale peut-elle se passer d’espoir ?"}], "theme": "La religion"}, {"id": "religion-marx", "label": "Marx : la religion est l’opium du peuple", "auteur": "Marx", "oeuvre": "Critique de la philosophie du droit de Hegel", "fiche": "religion-marx.html", "lignes": ["La religion est la théorie générale de ce monde, sa", "somme encyclopédique, sa logique sous forme populaire,", "son point d’honneur spirituel, son enthousiasme, sa", "sanction morale, son complément solennel, sa", "consolation et sa justification universelles. Elle est", "la réalisation fantasmagorique de l’essence humaine,", "parce que l’essence humaine ne possède pas de vraie", "réalité. Lutter contre la religion, c’est donc", "indirectement lutter contre ce monde-là dont la", "religion est l’arôme spirituel.", "La détresse religieuse est, pour une part,", "l’expression de la détresse réelle, et, pour une", "autre, la protestation contre la détresse réelle. La", "religion est le soupir de la créature opprimée, l’âme", "d’un monde sans cœur, comme elle est l’esprit de", "conditions sociales d’où l’esprit est exclu. Elle est", "l’opium du peuple.", "L’abolition de la religion en tant que bonheur", "illusoire du peuple est l’exigence que formule son", "bonheur réel. Exiger qu’il renonce aux illusions sur", "sa situation, c’est exiger qu’il renonce à une", "situation qui a besoin d’illusions. La critique de la", "religion est donc en germe la critique de cette vallée", "de larmes dont la religion est l’auréole."], "notion": "La religion", "q": "Quelle est la fonction de la religion dans un monde de détresse ?", "opinion": "Que la religion ne serait qu’une erreur ou une superstition, sans fonction.", "enjeu": "Cette thèse est ambivalente : la religion est à la fois l’expression de la détresse, une consolation illusoire et une protestation.", "th": "La religion est à la fois expression et protestation contre la détresse réelle ; consolation, elle procure un bonheur illusoire. Sa critique est le germe de la critique du monde social qui a besoin d’illusions.", "etapes": [{"l": "1-10", "idee": "La religion, théorie de ce monde ; Une réalisation fantasmagorique de l’homme.", "args": "Elle est sa théorie générale, sa logique populaire, sa consolation et sa justification universelles. Elle réalise de façon illusoire l’essence humaine, parce que celle-ci ne possède pas de vraie réalité.", "lien": "Après avoir défini la religion comme théorie de ce monde et réalisation illusoire de l’essence humaine, Marx dit ce qu’elle exprime : la détresse réelle, et la protestation contre elle."}, {"l": "11-17", "idee": "Détresse exprimée et contestée ; Soupir, âme, opium.", "args": "La détresse religieuse exprime la détresse réelle, et en est aussi la protestation. La religion est le soupir de la créature opprimée, l’âme d’un monde sans cœur, l’opium du peuple : elle soulage sans guérir.", "lien": "Si la religion est un soupir mais aussi un opium, il faut en tirer la conséquence : renoncer aux illusions, c’est exiger de changer la situation."}, {"l": "18-24", "idee": "Renoncer aux illusions, changer la situation.", "args": "Abolir le bonheur illusoire, c’est exiger le bonheur réel : renoncer aux illusions, c’est renoncer à une situation qui en a besoin.", "lien": "La critique de la religion est ainsi le germe de la critique du monde social qui a besoin d’illusions."}], "concepts": [{"c": "Opium", "s": "Drogue qui calme la douleur sans soigner. Image d’un remède qui anesthésie."}, {"c": "Illusion", "s": "Croyance fausse qui console. Elle masque la réalité de l’oppression."}, {"c": "Détresse réelle", "s": "La misère sociale et matérielle dont la religion est le reflet."}], "A": [{"q": "Elle est la réalisation fantasmagorique de l’essence humaine", "l": "5-6", "e": 0}, {"q": "La religion est le soupir de la créature opprimée, l’âme d’un monde sans cœur", "l": "13-15", "e": 1}, {"q": "La critique de la religion est donc en germe la critique de cette vallée de larmes", "l": "22-24", "e": 2}], "CQ": [{"q": "Une critique de la religion ou du monde ?", "c": "Marx vise surtout la société qui rend la religion nécessaire. La croyance disparaît-elle avec la misère ? (À comparer avec Nietzsche.)"}, {"q": "L’opium, un jugement dévalorisant ?", "c": "La religion peut aussi soutenir les opprimés dans l’action. Marx le reconnaît partiellement : elle est protestation."}], "theme": "La religion"}, {"id": "religion-nietzsche", "label": "Nietzsche : la mort de Dieu", "auteur": "Nietzsche", "oeuvre": "Ainsi parlait Zarathoustra", "fiche": "religion-nietzsche.html", "lignes": ["Hommes supérieurs, apprenez de moi ceci : sur la place", "publique personne ne croit à l’homme supérieur. Et si", "vous voulez parler sur la place publique, à votre", "guise ! Mais la populace cligne de l’œil : « Nous", "sommes tous égaux. »", "« Hommes supérieurs, – ainsi cligne de l’œil la", "populace, – il n’y a pas d’hommes supérieurs, nous", "sommes tous égaux, un homme vaut un homme, devant Dieu", "– nous sommes tous égaux ! »", "Devant Dieu ! – Mais maintenant ce Dieu est mort.", "Devant la populace, cependant, nous ne voulons pas", "être égaux. Hommes supérieurs, éloignez-vous de la", "place publique !", "Devant Dieu ! – Mais maintenant ce Dieu est mort !", "Hommes supérieurs, ce Dieu a été votre plus grand", "danger.", "Vous n’êtes ressuscites que depuis qu’il gît dans la", "tombe. C’est maintenant seulement que revient le grand", "Midi, maintenant l’homme supérieur devient – maître !", "Avez-vous compris cette parole, ô mes frères ? Vous", "êtes effrayés : votre cœur est-il pris de vertige ?", "L’abîme s’ouvre-t-il ici pour vous ? Le chien de", "l’enfer aboie-t-il contre vous ?", "Eh bien ! Allons ! Hommes supérieurs ! Maintenant", "seulement la montagne de l’avenir humain va enfanter.", "Dieu est mort : maintenant nous voulons – que le", "surhomme vive."], "notion": "La religion", "q": "Quelles conséquences la mort de Dieu a-t-elle pour l’homme ?", "opinion": "Que Dieu garantirait l’égalité et le sens, et que sa disparition serait une perte.", "enjeu": "Cette thèse est paradoxale : comment la mort de Dieu peut-elle être une libération, et pas seulement un vertige ?", "th": "Dieu est mort : l’égalité « devant Dieu » ne tient plus, et l’homme supérieur est libéré d’un danger. La mort de Dieu ouvre l’avenir du surhomme.", "etapes": [{"l": "1-9", "idee": "L’homme supérieur n’est pas reconnu ; L’égalité devant Dieu.", "args": "Sur la place publique, personne ne croit à l’homme supérieur. La populace clignote : « nous sommes tous égaux ». Cette égalité est fondée sur Dieu : « un homme vaut un homme, devant Dieu ».", "lien": "Après avoir montré que la populace invoque l’égalité devant Dieu, Nietzsche rappelle que ce Dieu est mort."}, {"l": "10-19", "idee": "Mais ce Dieu est mort ; Dieu était le plus grand danger.", "args": "Devant la populace, nous ne voulons pas être égaux. Le Dieu qui garantissait l’égalité est mort. Les hommes supérieurs ne sont « ressuscités » que depuis qu’il gît dans la tombe. Vient le grand Midi.", "lien": "Si Dieu est mort, il n’est plus un danger pour l’homme supérieur : c’est lui qui le tenait enchaîné."}, {"l": "20-27", "idee": "Un vertige et une promesse.", "args": "La parole effraie : l’abîme s’ouvre. Mais maintenant la montagne de l’avenir humain va enfanter : « que le surhomme vive ».", "lien": "Cette libération est à la fois un vertige et une promesse : la montagne de l’avenir humain va enfanter."}], "concepts": [{"c": "Mort de Dieu", "s": "Fin de la croyance au Dieu chrétien comme fondement des valeurs, constat historique plus que simple athéisme."}, {"c": "Homme supérieur", "s": "Celui qui cherche à se dépasser et refuse le nivellement de la foule."}, {"c": "Surhomme", "s": "Figure de l’homme qui crée ses propres valeurs après la mort de Dieu."}], "A": [{"q": "sur la place publique personne ne croit à l’homme supérieur", "l": "1-2", "e": 0}, {"q": "ce Dieu a été votre plus grand danger", "l": "15-16", "e": 1}, {"q": "Dieu est mort : maintenant nous voulons – que le surhomme vive", "l": "26-27", "e": 2}], "CQ": [{"q": "Un constat ou un souhait ?", "c": "Nietzsche constate la mort de Dieu et appelle le surhomme. Y a-t-il de l’espoir ou de l’élitisme dans ce texte ? (À comparer avec Kant.)"}, {"q": "Qu’advient-il de la morale ?", "c": "Si Dieu est mort, qui fonde les valeurs ? Peut-on se passer de toute transcendance ?"}], "theme": "La religion"}, {"id": "technique-arendt", "label": "Arendt : animal laborans et homo faber", "auteur": "Hannah Arendt", "oeuvre": "Condition de l’homme moderne", "fiche": "technique-arendt.html", "lignes": ["Au point de vue de l'homo faber, qui compte", "entièrement sur les outils primordiaux de ses mains,", "l'homme, comme disait Benjamin Franklin, est un", "fabricant d'outils. Les mêmes instruments qui ne font", "qu'alléger le fardeau et mécaniser le travail de", "l'animal laborans, l'homo faber les invente et les", "destine à l'édification d'un monde d'objets, et leur", "commodité, leur précision sont dictées par les buts «", "objectifs » qu'il invente à son gré, plutôt que par", "des désirs et besoins subjectifs. Outils et", "instruments sont si bien objets du monde qu'ils", "peuvent servir de critères pour classer des", "civilisations entières. Mais leur caractère d'objets", "du monde n'est jamais plus manifeste que lorsqu'on les", "emploie dans les processus du travail, où ils sont", "vraiment tout ce qui survit de tangible au travail", "comme au processus de consommation. Ainsi pour", "l'animal laborans, en tant que soumis et constamment", "occupé aux processus dévorants de la vie, la", "durabilité, la stabilité du monde sont représentées", "avant tout par les outils et instruments dont il se", "sert, et dans une société de travailleurs, les outils", "risquent fort d'acquérir des caractères ou des", "fonctions qui dépassent la simple instrumentalité. On", "déplore souvent la perversion des fins et des moyens", "dans la société moderne, où les hommes deviennent les", "esclaves des machines qu'ils ont inventées et «", "s'adaptent » aux exigences de ces machines au lieu de", "les mettre au service des besoins humains : c'est se", "plaindre de la situation de fait de l'activité de", "travail. Dans cette situation, où la production", "consiste avant tout en une préparation à la", "consommation, la distinction même de la fin et des", "moyens, si nettement caractéristique des activités de", "l'homo faber, n'a tout simplement aucun sens ; et les", "instruments que l'homo faber a inventés et avec", "lesquels il vient en aide au travail de l'animal", "laborans perdent ainsi leur caractère instrumental dès", "que ce dernier les emploie. Au sein du processus", "vital, dont l'activité de travail fait intégralement", "partie et qu'elle ne transcende jamais, il est vain de", "soulever les questions qui supposent la catégorie de", "la fin et des moyens, comme de savoir si les hommes", "vivent et consomment afin d'avoir la force de", "travailler, ou s'ils travaillent afin d'avoir les", "moyens de consommer."], "notion": "La technique", "q": "Pourquoi, dans la société moderne, les hommes paraissent-ils devenir « esclaves des machines » ? La faute en revient-elle aux outils ?", "opinion": "", "enjeu": "", "th": "Ce n’est pas l’outil qui pervertit les fins et les moyens, mais la situation de l’animal laborans, enfermé dans le cycle de la vie : produire pour consommer, consommer pour pouvoir produire.", "etapes": [{"l": "1-12", "idee": "L’homo faber fabrique des outils pour édifier un monde d’objets.", "args": "Il les invente pour des buts objectifs, non pour des désirs subjectifs ; ils servent aussi à alléger et mécaniser le travail de l’animal laborans.", "lien": "Ces mêmes outils, entre les mains de l’animal laborans, changent de statut."}, {"l": "13-24", "idee": "Pour l’animal laborans, les outils représentent la durabilité du monde ; dans une société de travailleurs, ils dépassent la simple instrumentalité.", "args": "Soumis aux processus dévorants de la vie, il trouve dans les outils la stabilité du monde ; ils risquent d’acquérir des fonctions qui dépassent le simple moyen.", "lien": "Ce constat rend compte de ce que l’on déplore ordinairement : la perversion des fins et des moyens."}, {"l": "25-46", "idee": "La plainte contre les machines vise en réalité la situation du travail, où fin et moyen se confondent.", "args": "On déplore que les hommes soient les esclaves des machines ; mais dans le cycle de la vie (produire pour consommer), la distinction entre fin et moyens n’a plus de sens.", "lien": "Le diagnostic est la thèse : ce n’est pas l’outil qui est en cause, mais le cycle dans lequel le travail enferme."}], "concepts": [{"c": "Homo faber", "s": "L’homme qui fabrique : il produit des objets durables, qui composent un monde stable, en choisissant des fins et en employant des moyens."}, {"c": "Animal laborans", "s": "L’homme en tant que travailleur soumis aux besoins de la vie : il produit pour consommer, dans un cycle qui recommence sans cesse."}, {"c": "Instrumentalité", "s": "Le fait d’être un moyen au service d’une fin. L’outil est instrumental tant qu’il sert un but extérieur à lui."}], "A": [{"q": "Les mêmes instruments qui ne font qu'alléger le fardeau et mécaniser le travail de l'animal laborans, l'homo faber les invente et les destine à l'édification d'un monde d'objets", "l": "4-7", "e": 0}, {"q": "dans une société de travailleurs, les outils risquent fort d'acquérir des caractères ou des fonctions qui dépassent la simple instrumentalité", "l": "22-24", "e": 1}, {"q": "c'est se plaindre de la situation de fait de l'activité de travail", "l": "29-31", "e": 2}], "CQ": [{"q": "Une défense de la technique ?", "c": "Arendt n’accuse pas l’outil : elle replace le problème dans le mode de vie. Cela rejoint-il l’idée que la technique est « neutre » et que tout dépend de l’usage ?"}, {"q": "Le lien avec la fiche sur le travail. La distinction travail / œuvre éclaire la question de l’aliénation : un travail réduit à la reproduction de la vie est-il émancipateur ?", "c": ""}], "theme": "La technique"}, {"id": "technique-bacon", "label": "Bacon : vaincre la nature en lui obéissant", "auteur": "Francis Bacon", "oeuvre": "Novum organum", "fiche": "technique-bacon.html", "lignes": ["L’homme, interprète et ministre de la nature, n’étend", "ses connaissances et son action qu’à mesure qu’il", "découvre l’ordre naturel des choses, soit par", "l’observation, soit par la réflexion ; il ne sait et", "ne peut rien de plus.", "La main seule et l’entendement abandonné à lui-même", "n’ont qu’un pouvoir très limité ; ce sont les", "instruments et les autres genres de secours qui font", "presque tout, secours et instruments non moins", "nécessaires à l’esprit qu’à la main ; et de même que", "les instruments de la main excitent ou règlent son", "mouvement, les instruments de l’esprit l’aident à", "saisir la vérité ou à éviter l’erreur.", "La science et la puissance humaine se correspondent", "dans tous les points et vont au même but ; c’est", "l’ignorance où nous sommes de la cause qui nous prive", "de l’effet ; car on ne peut vaincre la nature qu’en", "lui obéissant et ce qui était principe, effet ou cause", "dans la théorie, devient règle, but ou moyen dans la", "pratique."], "notion": "La technique", "q": "Qu’est-ce qui donne à l’homme son pouvoir sur la nature, et quel rapport a-t-il avec elle ?", "opinion": "", "enjeu": "", "th": "Le pouvoir de l’homme est borné par sa connaissance de l’ordre naturel. Savoir les causes, c’est pouvoir produire les effets : la science est la source de la technique.", "etapes": [{"l": "1-5", "idee": "L’homme ne peut que découvrir l’ordre naturel : il est « ministre et interprète de la nature ».", "args": "Son savoir et son action ne s’étendent qu’à mesure qu’il découvre l’ordre naturel, par l’observation ou la réflexion.", "lien": "Si son pouvoir dépend de cette découverte, il faut dire par quoi il l’exerce : les instruments."}, {"l": "5-13", "idee": "La main seule et l’esprit seul sont faibles : les instruments font presque tout.", "args": "Instruments de la main et de l’esprit : les uns règlent le mouvement, les autres aident à saisir la vérité ou à éviter l’erreur.", "lien": "On peut alors énoncer le lien entre savoir et pouvoir."}, {"l": "14-20", "idee": "Science et puissance coïncident : on ne vainc la nature qu’en lui obéissant.", "args": "Ignorer la cause prive de l’effet ; ce qui était cause dans la théorie devient règle ou moyen dans la pratique.", "lien": "Cette étape conclut le texte : la maîtrise de la nature passe par l’obéissance à ses lois."}], "concepts": [{"c": "Ministre et interprète de la nature", "s": "Le ministre est un serviteur, l’interprète est celui qui lit et traduit. L’homme ne commande pas à la nature : il la lit et la sert pour agir."}, {"c": "Instrument", "s": "Ce qui prolonge ou règle l’action de la main (outil) ou de l’esprit (méthode, expérience, raisonnement bien conduit)."}, {"c": "Cause et effet", "s": "La cause explique l’effet. Connaître la cause permet de la reproduire, donc de produire l’effet voulu : c’est le cœur de la technique fondée sur la science."}], "A": [{"q": "L’homme, interprète et ministre de la nature, n’étend ses connaissances et son action qu’à mesure qu’il découvre l’ordre naturel des choses", "l": "1-3", "e": 0}, {"q": "les instruments de l’esprit l’aident à saisir la vérité ou à éviter l’erreur", "l": "12-13", "e": 1}, {"q": "on ne peut vaincre la nature qu’en lui obéissant", "l": "17-18", "e": 2}], "CQ": [{"q": "Une maîtrise sans limite ?", "c": "Si le pouvoir croît avec le savoir, rien ne l’arrête. Faut-il en conclure que tout ce que la science permet est souhaitable ? (À comparer avec Heidegger et Lévinas.)"}, {"q": "La nature comme adversaire. Le mot « vaincre » présente la nature comme quelque chose à soumettre. Heidegger discutera cette vision : la nature n’y devient-elle pas une simple ressource ?", "c": ""}], "theme": "La technique"}, {"id": "technique-heidegger", "label": "Heidegger : le Rhin, de fleuve à ressource", "auteur": "Martin Heidegger", "oeuvre": "La question de la technique", "fiche": "technique-heidegger.html", "lignes": ["La centrale électrique est mise en place dans le Rhin.", "Elle le somme de livrer sa pression hydraulique, qui", "somme à son tour les turbines de tourner. Ce mouvement", "fait tourner la machine dont le mécanisme produit le", "courant électrique, pour lequel la centrale régionale", "et son réseau sont commis aux fins de transmission.", "Dans le domaine de ces conséquences s’enchaînant l’une", "à l’autre à partir de la mise en place de l’énergie", "électrique, le fleuve du Rhin apparaît, lui aussi,", "comme quelque chose de commis. La centrale n’est pas", "construite dans le courant du Rhin comme le vieux pont", "de bois qui depuis des siècles unit une rive à", "l’autre. C’est bien plutôt le fleuve qui est muré dans", "la centrale. Ce qu’il est aujourd’hui comme fleuve, à", "savoir fournisseur de pression hydraulique, il l’est", "par l’essence de la centrale. Afin de voir et de", "mesurer, ne fût-ce que de loin, l’élément monstrueux", "qui domine ici, arrêtons-nous un instant sur", "l’opposition qui apparaît entre les deux intitulés : «", "Le Rhin », muré dans l’usine d’énergie, et « Le Rhin", "», tiré de cette œuvre d’art qu’est un hymne de", "Hölderlin. Mais le Rhin, répondra-t-on, demeure de", "toute façon le fleuve du paysage. Soit, mais comment", "le demeure-t-il ? Pas autrement que comme un objet", "pour lequel on passe une commande, l’objet d’une", "visite organisée par une agence de voyage, laquelle a", "constitué là-bas une industrie de vacances."], "notion": "La technique", "q": "Que change la technique moderne dans notre rapport à la nature ? Est-elle seulement un ensemble d’outils neutres ?", "opinion": "", "enjeu": "", "th": "La technique moderne n’est pas qu’un moyen : elle est une manière de considérer le réel, qui réduit la nature à un stock d’énergie disponible, « commis » à la production.", "etapes": [{"l": "1-10", "idee": "La centrale « met en place » le Rhin : tout s’enchaîne pour produire de l’énergie.", "args": "Elle somme le fleuve de livrer sa pression hydraulique, qui fait tourner les turbines, puis la machine, puis le courant ; le fleuve apparaît lui aussi comme « commis ».", "lien": "L’image est opposée à celle du vieux pont de bois."}, {"l": "10-16", "idee": "Le vieux pont s’insère dans le Rhin ; la centrale, elle, y « mure » le fleuve.", "args": "Le pont relie les rives depuis des siècles ; c’est le fleuve qui est « muré dans la centrale » et n’est plus que fournisseur de pression hydraulique.", "lien": "Il reste à mesurer la différence entre deux manières de parler du Rhin."}, {"l": "17-27", "idee": "Deux « Rhin » : celui de l’hymne de Hölderlin et celui de l’usine ; même le paysage est commandé.", "args": "Le Rhin de l’œuvre d’art s’oppose à celui de l’usine ; même comme paysage, le fleuve est objet de commande (visite organisée, industrie de vacances).", "lien": "Cette étape étend la thèse : la technique transforme jusqu’à notre regard sur la nature."}], "concepts": [{"c": "Commis, mise en demeure", "s": "Le fleuve est « sommé » de livrer de l’énergie. Il est mis à disposition et dépend d’une commande, comme un produit qu’on exige."}, {"c": "Arraisonnement", "s": "Notion que Heidegger développe dans le même essai (hors de cet extrait) : la technique moderne place le réel devant l’homme comme un stock à exploiter. L’extrait en offre l’illustration."}, {"c": "Technique ancienne et moderne", "s": "Le pont de bois s’accorde au fleuve ; la centrale le soumet à sa logique. La différence tient moins aux outils qu’au rapport à la nature."}], "A": [{"q": "Elle le somme de livrer sa pression hydraulique", "l": "2-2", "e": 0}, {"q": "C’est bien plutôt le fleuve qui est muré dans la centrale", "l": "13-14", "e": 1}, {"q": "Pas autrement que comme un objet pour lequel on passe une commande", "l": "24-25", "e": 2}], "CQ": [{"q": "Nostalgie ?", "c": "Heidegger oppose un ancien rapport à la nature à la technique moderne. N’idéalise-t-il pas le passé ? Lévinas lui reproche en substance d’être attaché à l’enracinement."}, {"q": "La nature peut-elle être autre chose qu’une ressource ?", "c": "Après Bacon (obéir pour vaincre), que reste-t-il de la nature elle-même ? La question rejoint les enjeux écologiques actuels."}], "theme": "La technique"}, {"id": "technique-levinas", "label": "Lévinas : défendre l’homme contre la technique ?", "auteur": "Emmanuel Lévinas", "oeuvre": "Difficile liberté", "fiche": "technique-levinas.html", "lignes": ["Il serait urgent de défendre l'homme contre la", "technologie de notre siècle. L'homme y aurait perdu", "son identité pour entrer comme un rouage dans une", "immense machinerie où tournent choses et êtres.", "Désormais, exister équivaudrait à exploiter la nature", "; mais dans le tourbillon de cette entreprise qui se", "dévore elle-même, ne se maintiendrait aucun point", "fixe. Le promeneur solitaire qui flâne à la campagne", "avec la certitude de s'appartenir ne serait, en fait,", "que le client d'une industrie hôtelière et touristique", "livré, à son insu, aux calculs, aux statistiques, aux", "planifications. Personne n'existerait pour soi. Il y a", "du vrai dans cette déclamation. La technique est", "dangereuse. Elle ne menace pas seulement l'identité", "des personnes. Elle risque de faire éclater la", "planète. Mais les ennemis de la société industrielle", "sont la plupart du temps des réactionnaires. Ils", "oublient ou détestent les grands espoirs de notre", "époque. Car jamais la foi en la libération de l'homme", "n'était plus forte dans les âmes. Elle ne tient pas", "aux facilités que les machines et les sources", "nouvelles d'énergie offrent à l'enfantin instinct de", "la vitesse ; elle ne tient pas aux beaux jouets", "mécaniques qui tentent la puérilité éternelle des", "adultes. Elle ne fait qu'un avec l'ébranlement des", "civilisations sédentaires, avec l'effritement des", "lourdes épaisseurs du passé, avec le palissement des", "couleurs locales, avec les fissures qui lézardent", "toujours ces choses encombrantes et obtuses auxquelles", "s'adossent les particularismes humains. Il faut être", "sous-développé pour les revendiquer comme raisons", "d'être et lutter en leur nom pour une place dans le", "monde moderne. Le développement de la technique n'est", "pas la cause - il est déjà l'effet de cet allègement", "de la substance humaine, se vidant de ses nocturnes", "pesanteurs."], "notion": "La technique", "q": "La technique menace-t-elle l’identité de l’homme ? Faut-il s’y opposer au nom d’un monde plus authentique ?", "opinion": "", "enjeu": "", "th": "La technique est réellement dangereuse, mais la dénoncer au nom des racines et des particularismes oublie ce qu’elle apporte : une libération de l’homme, allégé des « pesanteurs » du passé.", "etapes": [{"l": "1-12", "idee": "Le discours que rapporte l’auteur : l’homme perdrait son identité dans la machinerie technique.", "args": "Exister, ce serait exploiter la nature ; même le promeneur serait le client d’une industrie touristique : « personne n’existerait pour soi ».", "lien": "Lévinas ne reprend pas ce discours à son compte sans réserve : il en reconnaît la part de vérité, puis le critique."}, {"l": "12-19", "idee": "Une part de vérité, mais un procès suspect : ces critiques viennent de réactionnaires.", "args": "La technique est dangereuse (identité des personnes, planète) ; mais ses ennemis oublient ou détestent les grands espoirs de l’époque.", "lien": "Ces espoirs, il faut maintenant dire d’où ils viennent."}, {"l": "20-36", "idee": "La foi en la libération de l’homme s’appuie sur l’effritement du passé ; la technique est l’effet, non la cause, de cet allègement.", "args": "Elle ne tient ni aux commodités ni aux jouets mécaniques, mais à l’ébranlement des civilisations sédentaires ; revendiquer les particularismes, c’est être sous-développé.", "lien": "Cette étape livre la thèse : la technique prolonge un mouvement de libération qu’elle n’a pas créé."}], "concepts": [{"c": "Réactionnaire", "s": "Qui s’oppose au changement au nom d’un passé idéalisé. Lévinas range ici dans cette catégorie bien des critiques de la technique."}, {"c": "Civilisations sédentaires", "s": "Les cultures liées à un sol, à des racines, à des couleurs locales. Lévinas y voit des « pesanteurs » dont la technique libère."}, {"c": "Allègement de la substance humaine", "s": "L’homme s’allège de ce qui le fixait : lieux, traditions, particularismes. La technique prolonge ce mouvement plus qu’elle ne le provoque."}], "A": [{"q": "L'homme y aurait perdu son identité pour entrer comme un rouage dans une immense machinerie", "l": "2-4", "e": 0}, {"q": "Mais les ennemis de la société industrielle sont la plupart du temps des réactionnaires", "l": "16-17", "e": 1}, {"q": "Le développement de la technique n'est pas la cause - il est déjà l'effet de cet allègement de la substance humaine", "l": "33-35", "e": 2}], "CQ": [{"q": "Une position ambiguë. Lévinas reconnaît le danger de la technique tout en rejetant ses critiques. Peut-on tenir ensemble les deux ?", "c": ""}, {"q": "Objection. Défendre un lieu, une culture, un paysage est-il toujours « réactionnaire » ? Des enjeux écologiques suggèrent que non.", "c": ""}], "theme": "La technique"}, {"id": "verite-hume", "label": "Hume : croyance raisonnable", "auteur": "David Hume", "oeuvre": "Enquête sur l’entendement humain", "fiche": "verite-hume.html", "lignes": ["Le soleil ne se lèvera pas demain, cette proposition", "n'est pas moins intelligible et elle n'implique pas", "plus contradiction que l'affirmation : il se lèvera.", "Nous tenterions donc en vain d'en démontrer la", "fausseté. Si elle était démonstrativement fausse, elle", "impliquerait contradiction et l'esprit ne pourrait", "jamais la concevoir distinctement.", "C'est donc peut-être un sujet digne d'éveiller la", "curiosité que de rechercher quelle est la nature de", "cette évidence qui nous assure de la réalité d'une", "existence et d'un fait au-delà du témoignage actuel de", "nos sens ou des rapports de notre mémoire. […]", "Tous les raisonnements sur les faits paraissent se", "fonder sur la relation de la cause à l'effet. C'est au", "moyen de cette seule relation que nous dépassons", "l'évidence de notre mémoire et de nos sens. Si vous", "demandiez à quelqu'un pourquoi il croit à la réalité", "d'un fait qu'il ne constate pas effectivement, par", "exemple que son ami est à la campagne ou en France, il", "vous donnerait une raison ; cette raison serait un", "autre fait : une lettre qu'il a reçue ou la", "connaissance de ses résolutions antérieures et de ses", "promesses. […]", "Si donc nous désirons nous satisfaire au sujet de la", "nature de l'évidence qui nous donne la certitude des", "faits, il faut que nous recherchions comment nous", "arrivons à la connaissance de la cause et de l'effet.", "J'oserai affirmer, comme une proposition générale qui", "n'admet pas d'exception, que la connaissance de cette", "relation ne s'obtient, en aucun cas, par des", "raisonnements a priori ; mais qu'elle naît entièrement", "de l'expérience quand nous trouvons que des objets", "particuliers sont en conjonction constante l'un avec", "l'autre."], "notion": "La vérité", "q": "Sur quoi se fonde notre certitude des faits qui dépassent ce que nous percevons ou ce dont nous nous souvenons ?", "opinion": "", "enjeu": "", "th": "Tous les raisonnements sur les faits reposent sur la relation de cause à effet, et celle-ci ne s’obtient jamais a priori : elle naît de l’expérience, de la conjonction constante des objets.", "etapes": [{"l": "1-12", "idee": "Un fait futur n’est pas contradictoire : on ne peut en démontrer la fausseté, d’où la question de la nature de l’évidence.", "args": "« Le soleil ne se lèvera pas demain » est aussi intelligible que « il se lèvera » ; si cette proposition était démonstrativement fausse, elle impliquerait contradiction. Reste donc à chercher ce qui nous assure de la réalité d’un fait au-delà des sens et de la mémoire.", "lien": "On passe de ce constat négatif (la certitude des faits n’est pas démontrable) à la recherche de son fondement : sur quoi repose cette certitude ?"}, {"l": "13-27", "idee": "Tous les raisonnements sur les faits se fondent sur la relation de cause à effet.", "args": "On croit à un fait que l’on ne constate pas (l’ami à la campagne) parce qu’on s’appuie sur un autre fait : une lettre, des promesses. Il faut donc chercher comment nous connaissons la cause et l’effet.", "lien": "Si tout repose sur la relation de cause à effet, il reste à dire d’où nous tenons cette relation."}, {"l": "28-34", "idee": "Cette relation ne naît jamais de raisonnements a priori, mais de l’expérience.", "args": "Sans exception, la connaissance de la cause et de l’effet vient de l’expérience, de la conjonction constante entre des objets particuliers.", "lien": "Cette étape apporte la thèse : notre croyance dans les faits non constatés repose sur l’habitude de voir des objets toujours associés."}], "concepts": [{"c": "Contradiction", "s": "Une proposition contradictoire ne peut pas être conçue clairement (un cercle carré). Les faits, eux, sont toujours pensables autrement : leur contraire n’est pas contradictoire."}, {"c": "A priori / expérience", "s": "Connaissance a priori : indépendante de l’expérience, par la seule raison. Hume soutient que la relation de cause à effet vient de l’expérience."}, {"c": "Conjonction constante", "s": "Deux objets toujours observés ensemble (feu et chaleur). C’est ce qui fait croire que l’un est la cause de l’autre."}], "A": [{"q": "cette proposition n'est pas moins intelligible et elle n'implique pas plus contradiction que l'affirmation : il se lèvera", "l": "1-3", "e": 0}, {"q": "Tous les raisonnements sur les faits paraissent se fonder sur la relation de la cause à l'effet", "l": "13-14", "e": 1}, {"q": "elle naît entièrement de l'expérience quand nous trouvons que des objets particuliers sont en conjonction constante l'un avec l'autre", "l": "31-34", "e": 2}], "CQ": [{"q": "Un scepticisme ?", "c": "Si l’on ne peut démontrer ce que sera demain, que vaut la science ? Hume ne nie pas nos croyances : il montre leur nature."}, {"q": "Faut-il croire, comme Bacon, qu’il suffit de connaître la cause pour produire l’effet ?", "c": "Pour Bacon, connaître la cause permet de produire l’effet. Hume demande d’où nous savons qu’il y a une cause : de l’expérience seule."}], "theme": "La vérité"}, {"id": "verite-kant", "label": "Kant : mensonge et devoir", "auteur": "Emmanuel Kant", "oeuvre": "Sur un prétendu droit de mentir par humanité", "fiche": "verite-kant.html", "lignes": ["Si tu as, par exemple, empêché d'agir par un mensonge", "quelqu'un qui se trouvait avoir alors des intentions", "meurtrières, tu es responsable d'un point de vue", "juridique de toutes les conséquences qui pourraient en", "résulter. Mais si tu t'en es tenu strictement à la", "vérité, la justice publique ne peut rien te faire", "quelles que soient les conséquences imprévues. Il peut", "toutefois se produire qu'après que tu as honnêtement", "répondu oui au meurtrier qui te demandait si celui", "qu'il voulait tuer était chez toi, celui-ci soit", "cependant sorti sans être remarqué et qu'ainsi il ait", "échappé au meurtrier, que le crime alors n'ait pas eu", "lieu ; mais supposons que tu aies menti et dit qu'il", "n'était pas chez toi, et qu'il soit réellement sorti", "(bien qu'à ton insu) ; si le meurtrier le rencontrant", "en train de sortir, accomplissait son crime, tu peux", "alors être à bon droit accusé d'être la cause de sa", "mort. (...). Par conséquent celui qui ment, quelque", "bien intentionné qu'il puisse être, doit répondre des", "conséquences de son mensonge (...) et en payer le", "prix, quel que soit leur caractère imprévisible. Car", "dire la vérité constitue un devoir qui doit être", "considéré comme la base de tous les devoirs qui sont à", "fonder sur un contrat, et dont la loi, si on y tolère", "ne serait-ce que la plus petite exception, est rendue", "chancelante et vaine."], "notion": "La vérité", "q": "Existe-t-il des circonstances où mentir est permis, voire obligatoire, par exemple pour sauver une vie ?", "opinion": "", "enjeu": "", "th": "Dire la vérité est un devoir sans exception. Celui qui ment, même avec de bonnes intentions, répond de toutes les conséquences de son mensonge, y compris imprévisibles.", "etapes": [{"l": "1-7", "idee": "Mentir fait de soi la cause juridique des conséquences ; s’en tenir à la vérité met à l’abri.", "args": "Celui qui a empêché un meurtrier d’agir par un mensonge est responsable de toutes les conséquences ; celui qui dit la vérité ne peut être inquiété, quelles que soient les conséquences imprévues.", "lien": "Pour le montrer, Kant va confronter les deux conduites dans un exemple précis."}, {"l": "7-17", "idee": "Deux scénarios opposent la réponse véridique et le mensonge.", "args": "Si tu dis la vérité (« oui »), la victime a pu sortir et échapper au meurtrier. Si tu mens (« non »), elle sort à ton insu, croise le meurtrier et meurt : tu peux être accusé d’être la cause de sa mort.", "lien": "L’exemple permet de conclure : l’intention de bien faire ne protège pas du résultat."}, {"l": "18-26", "idee": "Le menteur répond des conséquences ; la vérité est le fondement de tous les devoirs contractuels.", "args": "Même bien intentionné, celui qui ment doit « en payer le prix », même si les conséquences sont imprévisibles ; tolérer « la plus petite exception » rend la loi « chancelante et vaine ».", "lien": "Cette dernière étape donne la raison de fond de la thèse : sans véracité, aucun contrat n’est possible."}], "concepts": [{"c": "Devoir absolu", "s": "Un devoir qui vaut sans exception, quelles que soient les circonstances et les intentions : c’est l’idée de Kant (voir la fiche « Le devoir »)."}, {"c": "Responsabilité juridique", "s": "Être tenu de répondre devant la justice des conséquences de ses actes. Kant l’invoque pour distinguer celui qui ment de celui qui dit la vérité."}, {"c": "Contrat", "s": "Engagement entre personnes, qui suppose qu’on puisse se fier à la parole donnée. Sans exigence de vérité, aucun contrat n’est possible."}], "A": [{"q": "tu es responsable d'un point de vue juridique de toutes les conséquences qui pourraient en résulter", "l": "3-5", "e": 0}, {"q": "tu peux alors être à bon droit accusé d'être la cause de sa mort", "l": "16-18", "e": 1}, {"q": "dire la vérité constitue un devoir qui doit être considéré comme la base de tous les devoirs qui sont à fonder sur un contrat", "l": "22-24", "e": 2}], "CQ": [{"q": "Objection. Faut-il vraiment dire à un meurtrier où se trouve sa victime ? Ce cas, jugé extrême, est le plus discuté de la philosophie morale.", "c": ""}, {"q": "Faut-il juger un mensonge selon l’intention de celui qui ment, ou selon ses conséquences ?", "c": "Rousseau distingue plusieurs formes de mensonge selon l’intention et le préjudice. Kant juge sans égard pour l’intention."}], "theme": "La vérité"}, {"id": "verite-platon", "label": "Platon : le mythe de la caverne", "auteur": "Platon", "oeuvre": "La République, livre VII", "fiche": "verite-platon.html", "lignes": ["Socrate. - Apprends à découvrir dans la nature des", "choses qui vont être dites une vue sur l'essence de la", "formation et sur celle de la non-formation qui", "ensemble concernent le fondement de la condition", "humaine. Considère ceci : des hommes séjournant sous", "terre dans une demeure en forme de caverne.", "Celle-ci possède en guise d'entrée un
