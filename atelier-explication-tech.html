}

.sujet-pick{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1 1 360px;max-width:560px}

select,input[type=text]{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--rule-strong);border-radius:6px;padding:9px 10px;width:100%}
.sujet-box{grid-column:1/-1;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:18px 22px;display:flex;flex-wrap:wrap;gap:10px 24px;align-items:baseline;justify-content:space-between}

.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-start;align-content:flex-start}

nav.steps{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);align-self:start}

nav.steps button{all:unset;cursor:pointer;display:grid;grid-template-columns:28px 1fr;align-items:center;gap:8px;width:100%;padding:8px 10px;border-radius:8px;color:var(--ink-soft);box-sizing:border-box}

.side-note{margin-top:18px;font-size:13.5px;color:var(--ink-soft);border-top:1px solid var(--line);padding-top:14px}
main{min-width:0}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:26px clamp(16px,3vw,34px) 30px}
.sheet h2{font-family:var(--f-display);font-size:26px;margin:0 0 6px;font-weight:700}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--blue)}
.consigne{color:var(--ink-soft);max-width:66ch;margin:4px 0 22px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:16px;min-width:0}
.field>label,.field>.lab{font-weight:700;font-size:14.5px}
.field .hint{font-size:13px;color:var(--ink-soft);font-weight:400}
textarea{font:inherit;font-size:16px;color:var(--ink);width:100%;resize:vertical;border:0;border-left:2px solid var(--red);
  background-color:var(--paper);background-image:linear-gradient(to bottom,transparent calc(var(--lh) - 1px),var(--rule) calc(var(--lh) - 1px));
  background-size:100% var(--lh);background-attachment:local;line-height:var(--lh);padding:0 10px 0 14px;min-height:calc(var(--lh)*2)}
textarea:focus{outline:2px solid var(--blue);outline-offset:2px;border-radius:2px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 22px}
.term{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr);gap:8px 16px;align-items:start;margin-bottom:14px}
.term input{font-weight:700}
.frame{font-family:var(--f-display);font-size:18px;font-style:italic;color:var(--ink-soft);margin:6px 0}
.part{border:1px solid var(--line);border-radius:8px;margin-bottom:14px;background:var(--paper)}
.part>summary{cursor:pointer;padding:12px 16px;font-weight:700;display:flex;gap:10px;align-items:baseline;list-style:none}
.part>summary::-webkit-details-marker{display:none}
.part>summary::before{content:"▸";color:var(--blue);transition:transform .15s}
.part[open]>summary::before{transform:rotate(90deg)}
.part>summary .num{font-family:var(--f-display);color:var(--blue);font-size:19px}
.part .inner{padding:4px 16px 12px}
.sub{border-top:1px dashed var(--rule-strong);padding-top:12px;margin-top:6px}
.sub h4{margin:0 0 8px;font-size:14px;color:var(--ink-soft);letter-spacing:.04em}
.sub.opt h4::after{content:" (facultative)";font-weight:400}
.trans{background:var(--paper-2);border-radius:6px;padding:12px 14px 2px;margin-top:10px}
.trans textarea{background-color:var(--paper-2)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;align-items:center}
.btn{font:inherit;font-weight:700;font-size:15px;border-radius:8px;padding:10px 16px;cursor:pointer;border:1.5px solid var(--blue);background:var(--paper);color:var(--blue)}
.btn.primary{background:var(--blue);color:var(--paper)}
.btn.red{border-color:var(--red);color:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn.ghost{border-color:transparent;color:var(--ink-soft);padding-inline:8px}
.liens{grid-column:1/-1;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 22px}
.liens summary{cursor:pointer;font-weight:700;color:var(--blue)}
.liens-aide{margin:10px 0 6px;font-size:14px;color:var(--ink-soft)}
.liens ul{margin:6px 0 4px;padding-left:20px}
.liens li{margin:4px 0}
.liens a{color:var(--blue)}
.btn.depot{display:inline-block;text-decoration:none;line-height:1.2}
.depot-note{margin:12px 0 0;font-size:14px;color:var(--ink-soft)}
.spacer{flex:1}
.pen{margin-top:22px;border-left:3px solid var(--red);background:var(--red-soft);border-radius:0 8px 8px 0;padding:14px 18px}
.pen .who{font-family:var(--f-hand);color:var(--red);font-size:21px;font-weight:700;line-height:1.2;margin-bottom:6px}
.pen p{margin:0 0 10px;max-width:68ch}
.pen ul{margin:0 0 10px;padding-left:20px}
.pen li{margin-bottom:4px}
.pen .muted{color:var(--ink-soft);font-size:14px}
.model{margin-top:22px;border:1.5px solid var(--red);border-radius:8px;padding:16px 20px;background:var(--paper)}
.model .who{font-family:var(--f-hand);color:var(--red);font-size:21px;font-weight:700}
.model .warn{font-size:13.5px;color:var(--ink-soft);margin:0 0 10px}
.model p{max-width:68ch}
.model .mpart{margin:14px 0 6px;font-family:var(--f-display);font-weight:700;font-size:17.5px}
.model .msub{margin:8px 0 8px 14px;font-size:15px}
.model .msub b{color:var(--ink)}
.model dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:2px 12px;margin:4px 0 0}
.model dt{color:var(--ink-soft);font-size:13.5px}
.model dd{margin:0}
.model .mtrans{background:var(--paper-2);border-radius:6px;padding:8px 12px;margin:10px 0 0 14px;font-size:15px}
.grille{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.palier{border:1px solid var(--line);border-radius:8px;padding:12px 16px;display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px}
.palier .lvl{font-family:var(--f-display);font-weight:700;font-size:17px;color:var(--ink-soft);font-variant-numeric:tabular-nums;line-height:1.25}
.palier.reached{border-color:var(--ok)}
.palier.reached .lvl{color:var(--ok)}
.palier label{display:flex;gap:9px;align-items:flex-start;font-size:15px;margin-bottom:5px;cursor:pointer}
.palier input{margin-top:4px;accent-color:var(--blue);width:17px;height:17px;flex:none}
.verdict{margin-top:16px;padding:14px 18px;border-radius:8px;background:var(--blue-soft);color:var(--ink);font-size:16px}
.verdict b{font-family:var(--f-display);font-size:20px;color:var(--blue)}
.valorise{font-size:14.5px;color:var(--ink-soft);max-width:70ch;margin:0 0 14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-weight:700;font-size:14px}
.conseil{margin:18px 0 -6px;font-size:14px;color:var(--ink-soft)}
.copy-fallback{width:100%;min-height:160px;margin-top:10px;font-size:13px;background-image:none;border:1px solid var(--line)}

body{padding-block:20px 48px}

const TEXTS = [{"id": "art-arendt", "label": "Arendt : l’œuvre d’art", "auteur": "Arendt", "oeuvre": "La crise de la culture", "fiche": "art-arendt.html", "lignes": ["Parmi les choses qu'on ne rencontre pas dans la", "nature, mais seulement dans le monde fabriqué par", "l'homme, on distingue entre objets d'usage et œuvres", "d'art ; tous deux possèdent une certaine permanence", "qui va de la durée ordinaire à une immortalité", "potentielle dans le cas de l'œuvre d'art. […]. Du", "point de vue de la durée pure, les œuvres d'art sont", "clairement supérieures à toutes les autres choses ;", "comme elles durent plus longtemps au monde que", "n'importe quoi d'autre, elles sont les plus mondaines", "des choses. Davantage, elles sont les seules choses à", "n'avoir aucune fonction dans le processus vital de la", "société ; à proprement parler, elles ne sont pas", "fabriquées pour les hommes, mais pour le monde, qui", "est destiné à survivre à la vie limitée des mortels,", "au va-et-vient des générations.", "Non seulement elles ne sont pas consommées comme des", "biens de consommation, ni usées comme des objets", "d'usage : mais elles sont délibérément écartées des", "procès de consommation et d'utilisation, et isolées", "loin de la sphère des nécessités de la vie humaine.", "[…] [On n’a affaire à] un monde, au sens propre du", "terme, que lorsque la totalité des objets fabriqués", "est organisée au point de résister au procès de", "consommation nécessaire à la vie des gens qui y", "demeurent, et, ainsi, de leur survivre. C’est", "seulement là où une telle subsistance est assurée que", "nous parlons de culture ; c’est seulement là où nous", "sommes confrontés à des choses qui existent", "indépendamment de toute référence utilitaire et", "fonctionnelle, et dont la qualité demeure toujours", "semblable à elle-même, que nous parlons d’œuvre d’art."], "notion": "L’art", "q": "Qu’est-ce qui fait la spécificité de l’œuvre d’art ?", "opinion": "Que l’œuvre d’art serait un objet de consommation comme un autre, ou qu’elle se justifierait par son utilité.", "enjeu": "Cette thèse n’est pas évidente : comment un objet sans aucune utilité peut-il être ce qui fonde la culture ?", "th": "L’œuvre d’art est l’objet fabriqué qui dure le plus et n’a aucune fonction utilitaire. Elle est écartée de la consommation pour appartenir au monde, qui survit aux mortels : c’est là que naît la culture.", "etapes": [{"l": "1-16", "idee": "Dans le monde fabriqué ; Les plus durables ; Sans fonction vitale.", "args": "Parmi les choses fabriquées par l’homme, on distingue objets d’usage et œuvres d’art. Tous deux ont une certaine permanence. Les œuvres d’art ont une immortalité potentielle : elles sont supérieures par la durée, les plus mondaines des choses. Elles n’ont aucune fonction dans le processus vital de la société : elles sont faites pour le monde, qui survit aux mortels.", "lien": "De la durée et de l’inutilité des œuvres, on passe à leur place dans le monde : puisqu’elles ne servent à rien, elles ne sont pas consommées."}, {"l": "17-21", "idee": "Écartées de la consommation.", "args": "Ni consommées, ni usées : isolées de la sphère des nécessités de la vie humaine.", "lien": "Si les œuvres échappent à la consommation, elles appartiennent à un monde stable, qui survit aux mortels : on peut en conclure que la culture naît là."}, {"l": "22-32", "idee": "Monde et culture.", "args": "Un monde existe quand les objets résistent à la consommation et survivent. La culture et l’œuvre d’art apparaissent quand des choses existent indépendamment de toute référence utilitaire.", "lien": "Cette dernière étape donne la thèse : l’œuvre d’art, durable et inutile, est ce qui fonde un monde commun, donc la culture."}], "concepts": [{"c": "Objet d’usage", "s": "Chose fabriquée pour servir, qui s’use."}, {"c": "Œuvre d’art", "s": "Chose fabriquée pour durer, sans fonction utilitaire."}, {"c": "Monde", "s": "Ensemble d’objets durables qui survivent à la vie des mortels."}], "A": [{"q": "elles sont les plus mondaines des choses", "l": "10-11", "e": 0}, {"q": "elles sont délibérément écartées des procès de consommation et d'utilisation", "l": "19-20", "e": 1}, {"q": "C’est seulement là où une telle subsistance est assurée que nous parlons de culture", "l": "26-28", "e": 2}], "CQ": [{"q": "L’art est-il inutile ?", "c": "Si l’art n’a aucune fonction, pourquoi nous importe-t-il ? (À comparer avec Bourdieu.)"}, {"q": "L’art et le marché. Quand les œuvres deviennent des marchandises, perdent-elles leur caractère ?", "c": ""}], "theme": "L’art"}, {"id": "art-bourdieu", "label": "Bourdieu : l’idéologie charismatique", "auteur": "Bourdieu", "oeuvre": "Encyclopædia universalis, « Art – Consommation culturelle »", "fiche": "art-bourdieu.html", "lignes": ["Contre l’idéologie charismatique qui tient les goûts", "en matière de culture légitime pour un don de la", "nature, l’observation scientifique montre que les", "besoins culturels sont le produit de l’éducation :", "l’enquête établit que toutes les pratiques culturelles", "(fréquentation des musées, des concerts, des", "expositions, lecture, etc.) et les préférences", "correspondantes (écrivains, peintres ou musiciens", "préférés par exemple) sont étroitement liés au niveau", "d’instruction (évalué d’après le titre scolaire ou le", "nombre d’années d’étude) et, secondairement, à", "l’origine sociale. Le poids relatif de l’éducation", "proprement scolaire (dont l’efficacité et la durée", "dépendent étroitement de l’origine sociale) et de", "l’éducation familiale varie selon le degré auquel les", "différentes pratiques culturelles sont reconnues et", "préparées par le système scolaire, l’influence de", "l’origine sociale n’étant jamais aussi forte, toutes", "choses étant égales par ailleurs, qu’en matière de «", "culture libre » ou de culture d’avant-garde. À la", "hiérarchie socialement reconnue des arts et, à", "l’intérieur de chacun d’eux, des genres, des écoles ou", "des époques, correspond la hiérarchie sociale des", "consommateurs."], "notion": "L’art", "q": "Les goûts en matière de culture sont-ils naturels ou sociaux ?", "opinion": "Que le goût serait un don naturel, une sensibilité innée.", "enjeu": "Cette thèse n’est pas évidente : comment un goût que l’on éprouve comme personnel et spontané peut-il dépendre de l’origine sociale ?", "th": "Le goût n’est pas un don de la nature : les pratiques et préférences culturelles sont liées au niveau d’instruction et à l’origine sociale. À la hiérarchie des arts correspond la hiérarchie sociale des consommateurs.", "etapes": [{"l": "1-12", "idee": "Contre l’idéologie charismatique.", "args": "Elle tient les goûts de culture légitime pour un don de la nature. La science montre que ce sont des produits de l’éducation.", "lien": "Après avoir écarté l’idée d’un don naturel, il faut établir ce qui détermine réellement les goûts : l’enquête le montre."}, {"l": "12-20", "idee": "Une enquête ; École et famille ; La culture libre dépend plus de l’origine sociale.", "args": "Toutes les pratiques culturelles (musées, concerts, lecture) et les préférences sont liées au niveau d’instruction et, secondairement, à l’origine sociale. Le poids de l’éducation scolaire et familiale varie selon que les pratiques sont reconnues et préparées par l’école. L’influence de l’origine sociale est la plus forte pour la culture libre ou d’avant-garde.", "lien": "Si l’école et la famille déterminent les pratiques, on peut généraliser : les hiérarchies culturelles recoupent les hiérarchies sociales."}, {"l": "20-24", "idee": "Deux hiérarchies.", "args": "À la hiérarchie des arts correspond la hiérarchie sociale des consommateurs.", "lien": "Cette correspondance confirme la thèse : le goût n’est pas un don de la nature, il est social."}], "concepts": [{"c": "Idéologie charismatique", "s": "Croyance au don naturel, qui masque l’origine sociale des goûts."}, {"c": "Culture légitime", "s": "Culture reconnue comme supérieure par la société."}, {"c": "Origine sociale", "s": "Milieu familial d’un individu, qui influence son accès à la culture."}], "A": [{"q": "l’idéologie charismatique qui tient les goûts en matière de culture légitime pour un don de la nature", "l": "1-3", "e": 0}, {"q": "l’influence de l’origine sociale", "l": "17-18", "e": 1}, {"q": "la hiérarchie sociale des consommateurs", "l": "23-24", "e": 2}], "CQ": [{"q": "Le goût est-il libre ?", "c": "Si nos goûts sont socialement déterminés, que reste-t-il de la liberté d’aimer ? (À comparer avec Kant et Hume.)"}, {"q": "Démocratiser la culture. L’école peut-elle corriger les inégalités culturelles ?", "c": ""}], "theme": "L’art"}, {"id": "art-hume-delicatesse", "label": "Hume : la délicatesse du goût", "auteur": "Hume", "oeuvre": "Essais esthétiques", "fiche": "art-hume-delicatesse.html", "lignes": ["Deux de mes parents furent une fois appelés pour", "donner leur opinion au sujet d’un fût de vin, supposé", "excellent parce que vieux et de bonne vinée. L’un deux", "le goûte et le juge, et après mûre réflexion, énonce", "que le vin serait bon, n’était-ce ce petit goût de", "cuir qu’il perçoit en lui. L’autre, après avoir pris", "les mêmes précautions, rend aussi un verdict favorable", "au vin, mais sous la réserve d’un goût de fer, qu’il", "pouvait aisément distinguer. Vous ne pouvez imaginer à", "quel point tous deux furent tournées en ridicule pour", "leur jugement. Mais qui rit à la fin ? En vidant le", "tonneau, on trouve en son fond une vieille clé,", "attachée à une courroie de cuir.", "Cervantès, Don Quichotte (cité par Hume dans Essais", "esthétiques)", "Un juge véritable en matière de beaux-arts est un", "caractère si rare, même durant les époques les plus", "policées : un sens fort, uni à un sentiment délicat,", "amélioré par la pratique, rendu parfait par la", "comparaison, et clarifié de tout préjugé, peut seul", "conférer à un critique ce caractère inestimable. Et", "les verdicts réunis de tels hommes, où qu’on puisse", "les trouver, constituent la véritable norme du goût et", "de la beauté."], "notion": "L’art", "q": "Existe-t-il une norme du goût ?", "opinion": "Que le goût serait purement personnel : à chacun ses goûts, et l’on ne discute pas des goûts.", "enjeu": "Cette thèse n’est pas évidente : si le goût repose sur un sentiment, comment une norme est-elle possible ?", "th": "Un vrai juge en matière de beaux-arts est rare : il réunit un sens fort, un sentiment délicat, la pratique, la comparaison et l’absence de préjugé. Les verdicts de tels hommes constituent la norme du goût.", "etapes": [{"l": "1-13", "idee": "L’histoire du fût de vin ; On se moque d’eux ; Le fond du tonneau.", "args": "Deux parents goûtent un vin réputé excellent. L’un perçoit un petit goût de cuir, l’autre de fer. On les ridiculise pour leur jugement. Mais qui rit à la fin ? On y trouve une vieille clé attachée à une courroie de cuir : ils avaient raison.", "lien": "L’anecdote montre qu’un goût fin existe ; reste à dire qui en est capable, et à quelles conditions."}, {"l": "14-21", "idee": "Un juge véritable est rare.", "args": "Il faut un sens fort, un sentiment délicat, amélioré par la pratique, perfectionné par la comparaison, et libre de préjugé.", "lien": "Si les vrais juges sont rares, le goût ne peut pas être n’importe lequel : c’est l’accord de leurs verdicts qui fait la norme."}, {"l": "21-24", "idee": "Une norme collective.", "args": "Les verdicts réunis de tels hommes constituent la véritable norme du goût et de la beauté.", "lien": "La norme du goût n’est pas dans l’objet mais dans l’accord des meilleurs juges : c’est la réponse à la question."}], "concepts": [{"c": "Délicatesse", "s": "Aptitude à percevoir les moindres nuances."}, {"c": "Norme du goût", "s": "Critère partagé auquel on se réfère pour juger les œuvres."}, {"c": "Préjugé", "s": "Opinion adoptée sans examen, qui fausse le jugement."}], "A": [{"q": "Mais qui rit à la fin ?", "l": "11-11", "e": 0}, {"q": "un sens fort, uni à un sentiment délicat, amélioré par la pratique, rendu parfait par la comparaison, et clarifié de tout préjugé", "l": "18-20", "e": 1}, {"q": "constituent la véritable norme du goût et de la beauté", "l": "23-24", "e": 2}], "CQ": [{"q": "Une norme fondée sur des experts ?", "c": "Qui désigne les bons juges ? Y a-t-il un risque de cercle ? (À comparer avec Bourdieu.)"}, {"q": "Hume se contredit-il ?", "c": "Après avoir dit que tous les sentiments sont justes, il parle d’une norme. Comment concilier ?"}], "theme": "L’art"}, {"id": "art-hume-sentiment", "label": "Hume : opinion et sentiment", "auteur": "Hume", "oeuvre": "Essais esthétiques", "fiche": "art-hume-sentiment.html", "lignes": ["Parmi un millier d’opinions différentes que des hommes", "divers entretiennent sur le même sujet, il y en a une,", "et une seulement, qui est juste et vraie. Et la seule", "difficulté est de la déterminer et de la rendre", "certaine. Au contraire, un millier de sentiments", "différents, excités par le même objet, sont justes,", "parce qu’aucun sentiment ne représente ce qui est", "réellement dans l’objet. [...] La beauté n’est pas une", "qualité inhérente aux choses elles-mêmes, elle existe", "seulement dans l’esprit qui la contemple, et chaque", "esprit perçoit une beauté différente. Une personne", "peut même percevoir de la difformité là où un autre", "perçoit de la beauté. Et tout individu devrait être", "d’accord avec son propre sentiment, sans prétendre", "régler ceux des autres."], "notion": "L’art", "q": "Les jugements de goût peuvent-ils être vrais ou faux ?", "opinion": "Que « c’est beau » serait un jugement vrai ou faux, comme un jugement sur un fait.", "enjeu": "Cette thèse n’est pas évidente : si tous les sentiments sont justes, peut-on encore discuter de la beauté ?", "th": "Un sentiment n’est ni vrai ni faux : il exprime l’esprit qui contemple, non une propriété de l’objet. Chacun devrait s’en tenir à son propre sentiment sans prétendre régler celui des autres.", "etapes": [{"l": "1-5", "idee": "Une seule opinion est vraie.", "args": "Parmi mille opinions sur un même sujet, une seule est vraie : la difficulté est de la déterminer.", "lien": "Après avoir montré qu’une opinion peut être vraie ou fausse, Hume oppose le sentiment : tous sont justes, car aucun ne se rapporte à l’objet."}, {"l": "5-11", "idee": "Tous les sentiments sont justes ; La beauté est dans l’esprit.", "args": "Parmi mille sentiments excités par le même objet, tous sont justes, car aucun ne représente ce qui est dans l’objet. Elle n’est pas une qualité des choses : elle existe seulement dans l’esprit qui la contemple.", "lien": "Si le sentiment exprime l’esprit et non l’objet, chaque esprit perçoit une beauté différente : d’où la conclusion pratique."}, {"l": "11-15", "idee": "Chaque esprit perçoit une beauté différente ; Respecter le sentiment d’autrui.", "args": "Une personne peut voir de la difformité là où un autre voit de la beauté. Chacun devrait s’accorder avec son propre sentiment, sans prétendre régler ceux des autres.", "lien": "Cette conclusion (s’en tenir à son sentiment) confirme la thèse : le goût n’est ni vrai ni faux."}], "concepts": [{"c": "Opinion", "s": "Jugement sur un fait, qui peut être vrai ou faux."}, {"c": "Sentiment", "s": "Réaction affective d’un esprit, ni vraie ni fausse."}, {"c": "Qualité inhérente", "s": "Propriété qui appartient à l’objet lui-même."}], "A": [{"q": "il y en a une, et une seulement, qui est juste et vraie", "l": "2-3", "e": 0}, {"q": "La beauté n’est pas une qualité inhérente aux choses elles-mêmes", "l": "8-9", "e": 1}, {"q": "sans prétendre régler ceux des autres", "l": "14-15", "e": 2}], "CQ": [{"q": "Tous les goûts se valent-ils ?", "c": "Si tous les sentiments sont justes, la critique d’art a-t-elle un sens ? Hume y répond dans le texte suivant. (À comparer avec Kant.)"}, {"q": "La beauté est-elle dans l’objet ?", "c": "Si elle n’est que dans l’esprit, qu’est-ce qui rend une œuvre meilleure qu’une autre ?"}], "theme": "L’art"}, {"id": "art-kant", "label": "Kant : le jugement de goût", "auteur": "Kant", "oeuvre": "Critique de la faculté de juger", "fiche": "art-kant.html", "lignes": ["Kant, Critique de la faculté de juger", "Le goût est la faculté de juger et d’apprécier un", "objet ou un mode de représentation par une", "satisfaction ou un déplaisir, indépendamment de tout", "intérêt. On appelle beau l’objet d’une telle", "satisfaction.", "L’un aime le son des instruments à vent, l’autre celui", "des instruments à cordes. Discuter là-dessus avec", "l’intention de dénoncer l’erreur du jugement d’autrui", "qui diffère du nôtre, comme s’il lui était logiquement", "opposé, serait pure folie ; le principe : à chacun son", "goût (s’agissant des sens) vaut dans le domaine de", "l’agréable.", "Il serait (tout au contraire) ridicule que quelqu’un", "qui se flatterait d’avoir du goût songeât à en donner", "la preuve en disant : cet objet (l’édifice que nous", "voyons, le vêtement que porte celui-ci, le concert que", "nous entendons, le poème qui est soumis à notre", "appréciation) est beau pour moi. Car ce qui lui plaît", "à lui simplement, il ne doit pas le qualifier de beau.", "[...] Lorsqu’il donne une chose pour belle, il", "attribue aux autres la même satisfaction, il ne juge", "pas simplement pour lui, mais pour quiconque et parle", "alors de la beauté comme si c’était une propriété des", "choses. Aussi dit-il : la chose est belle ; et en", "jugeant de la satisfaction il ne compte pas sur", "l’adhésion d’autrui parce qu’il l’a obtenue en maintes", "occasions, mais il exige d’eux cette adhésion.", "[Le beau est] ce qui plaît universellement sans", "concept.", "[Le beau est] l’objet d’une finalité sans fin.", "[Le jugement de goût doit] donc posséder un principe", "subjectif qui détermine uniquement par sentiment, et", "non par des concepts, mais cependant d’une manière", "universellement valide, ce qui plaît ou déplaît. [...]", "Ce n’est donc qu’à travers la supposition qu’il existe", "un sens commun (par quoi, toutefois, nous n’entendons", "pas un sens externe, mais l’effet résultant du libre", "jeu de nos facultés de connaître), ce n’est, dis-je,", "qu’à travers la supposition d’un tel sens commun que", "le jugement de goût peut être porté."], "notion": "L’art", "q": "Le jugement sur le beau est-il purement subjectif ?", "opinion": "Que le beau serait affaire de goût personnel, comme l’agréable.", "enjeu": "Cette thèse est paradoxale : un jugement fondé sur le sentiment peut-il prétendre à l’accord de tous ?", "th": "Le jugement de goût est subjectif, car il repose sur le sentiment, mais il exige l’accord de tous, et suppose un sens commun. Il se distingue de l’agréable, qui reste affaire de goût personnel.", "etapes": [{"l": "1-6", "idee": "Le goût est désintéressé.", "args": "Le goût juge un objet par une satisfaction ou un déplaisir, indépendamment de tout intérêt. Le beau est l’objet d’une telle satisfaction.", "lien": "Le goût étant désintéressé, il faut le distinguer de l’agréable, qui reste affaire de goût personnel."}, {"l": "7-28", "idee": "L’agréable : à chacun son goût ; Mais on ne dit pas « beau pour moi ».", "args": "L’un aime les instruments à vent, l’autre les cordes. Discuter serait folie : dans l’agréable, chacun a son goût. Celui qui juge un objet beau lui attribue la beauté comme une propriété et attend l’adhésion de tous. Il l’exige.", "lien": "De cette distinction, on déduit que le jugement sur le beau exige l’accord de tous : il suppose donc un principe commun."}, {"l": "29-41", "idee": "Le beau plaît universellement sans concept ; Un sens commun.", "args": "Le beau est ce qui plaît universellement sans concept, et l’objet d’une finalité sans fin. Un tel jugement, fondé sur le sentiment mais valable pour tous, suppose un sens commun : l’effet du libre jeu de nos facultés de connaître.", "lien": "Le sens commun fonde cette prétention à l’universalité : le jugement de goût est subjectif sans être purement personnel."}], "concepts": [{"c": "Désintéressement", "s": "Satisfaction qui ne dépend d’aucun intérêt pour l’existence de l’objet."}, {"c": "Agréable", "s": "Ce qui plaît aux sens : affaire de goût personnel."}, {"c": "Universalité sans concept", "s": "Le beau prétend valoir pour tous, sans qu’on puisse le démontrer par des concepts."}], "A": [{"q": "indépendamment de tout intérêt", "l": "4-5", "e": 0}, {"q": "il ne juge pas simplement pour lui, mais pour quiconque", "l": "22-23", "e": 1}, {"q": "ce qui plaît universellement sans concept", "l": "29-30", "e": 2}], "CQ": [{"q": "L’universel sans preuve ?", "c": "Kant exige l’accord de tous, mais sans possibilité de le prouver. Comment justifier cette exigence ? (À comparer avec Hume.)"}, {"q": "Beauté et culture. Si le beau plaît universellement, pourquoi nos goûts diffèrent-ils ? (À comparer avec Bourdieu.)", "c": ""}], "theme": "L’art"}, {"id": "justice-hobbes", "label": "Hobbes : qu’est-ce qu’une bonne loi ?", "auteur": "Hobbes", "oeuvre": "Léviathan", "fiche": "justice-hobbes.html", "lignes": ["Qu’est-ce qu’une bonne loi ? Par bonne loi, je", "n’entends pas une loi juste, car aucune loi ne peut", "être injuste. La loi est faite par le pouvoir", "souverain, et tout ce qui est fait par ce pouvoir est", "approuvé et reconnu pour sien par chaque membre du", "peuple : et ce que chacun veut ne saurait être dit", "injuste par personne. Il en est des lois de la", "République comme des lois des jeux : ce sur quoi les", "joueurs se sont accordés n’est pour aucun d’eux une", "injustice. Une bonne loi se caractérise par le fait", "qu’elle est, en même temps, nécessaire au bien du", "peuple et claire. En effet, le rôle des lois, qui ne", "sont que des règles revêtues d’une autorité, n’est pas", "d’entraver toute action volontaire, mais seulement de", "diriger et de contenir les mouvements des gens, de", "manière à éviter qu’emportés par la violence de leurs", "désirs, leur précipitation ou leur manque de", "discernement, ils ne se fassent de mal : ce sont comme", "des haies disposées non pour arrêter les voyageurs,", "mais pour les maintenir sur le chemin.", "C’est pourquoi si une loi n’est pas nécessaire et que", "la vraie fin de toute loi lui fasse défaut, elle n’est", "pas bonne. On peut croire qu’une loi est bonne quand", "elle apporte un avantage au souverain sans pourtant", "être nécessaire au peuple ; mais cela n’est pas. En", "effet, le bien du souverain et celui du peuple ne", "sauraient être séparés."], "notion": "La justice", "q": "Qu’est-ce qui fait la qualité d’une loi : sa justice, ou son utilité ?", "opinion": "Qu’une bonne loi serait avant tout une loi juste.", "enjeu": "Cette thèse n’est pas évidente : si aucune loi n’est injuste, comment juger qu’une loi est bonne ?", "th": "Aucune loi ne peut être injuste puisque chacun l’a approuvée. Une bonne loi est celle qui est nécessaire au bien du peuple et claire : elle dirige les hommes sans les entraver, comme des haies le long d’un chemin.", "etapes": [{"l": "1-10", "idee": "Aucune loi n’est injuste ; Comme les lois d’un jeu.", "args": "La loi est faite par le souverain, et ce qu’il fait est reconnu pour sien par chaque membre du peuple. Ce sur quoi les joueurs se sont accordés n’est une injustice pour aucun d’eux.", "lien": "Après avoir posé qu’aucune loi n’est injuste puisque chacun l’a approuvée, Hobbes définit ce qu’est une bonne loi : nécessaire et claire."}, {"l": "10-20", "idee": "Une bonne loi est nécessaire et claire ; Le rôle des lois : des haies.", "args": "Elle sert le bien du peuple, et elle est compréhensible. Elles n’entravent pas l’action volontaire, mais contiennent les gens pour qu’ils ne se fassent pas de mal : « des haies disposées non pour arrêter les voyageurs, mais pour les maintenir sur le chemin ».", "lien": "Si la loi sert à diriger les hommes sans les entraver, il faut conclure que le bien du souverain et celui du peuple ne sont pas séparés."}, {"l": "21-27", "idee": "Pas de bien du souverain séparé.", "args": "Une loi qui avantage le souverain sans être nécessaire au peuple n’est pas bonne : leurs biens ne sont pas séparables.", "lien": "Cette dernière étape précise le critère de la bonne loi : elle sert le bien du peuple."}], "concepts": [{"c": "Souverain", "s": "Pouvoir qui fait les lois, auquel chacun a consenti."}, {"c": "Bonne loi", "s": "Loi nécessaire au bien du peuple et claire, qui accomplit la fin de toute loi."}, {"c": "Justice légale", "s": "Chez Hobbes, est juste ce qui est conforme à la loi établie par le souverain."}], "A": [{"q": "aucune loi ne peut être injuste", "l": "2-3", "e": 0}, {"q": "des haies disposées non pour arrêter les voyageurs, mais pour les maintenir sur le chemin", "l": "19-20", "e": 1}, {"q": "le bien du souverain et celui du peuple ne sauraient être séparés", "l": "26-27", "e": 2}], "CQ": [{"q": "Une loi peut-elle être injuste ?", "c": "Pour Hobbes, non. Mais l’histoire montre des lois iniques. Une loi est-elle juste parce qu’elle est la loi ? (À comparer avec Platon.)"}, {"q": "Les lois : contrainte ou liberté ?", "c": "Les haies protègent ou enferment ? Les lois limitent-elles la liberté ?"}], "theme": "La justice"}, {"id": "justice-platon-gyges", "label": "Platon : le mythe de l’anneau de Gygès", "auteur": "Platon", "oeuvre": "La République", "fiche": "justice-platon-gyges.html", "lignes": ["Cet homme [Gygès] était berger au service du roi qui", "gouvernait alors la Lydie. Un jour, au cours d'un", "violent orage accompagné d'un séisme, le sol se fendit", "et il se forma une ouverture béante près de l'endroit", "où il faisait paître son troupeau. Plein d'étonnement,", "il y descendit, et, entre autres merveilles que la", "fable énumère, il vit un cheval d'airain creux, percé", "de petites portes ; s'étant penché vers l'intérieur,", "il y aperçut un cadavre de taille plus grande,", "semblait-il, que celle d'un homme, et qui avait à la", "main un anneau d'or, dont il s'empara ; puis il partit", "sans prendre autre chose. Or, à l'assemblée habituelle", "des bergers qui se tenait chaque mois pour informer le", "roi de l'état de ses troupeaux, il se rendit portant", "au doigt cet anneau.", "Ayant pris place au milieu des autres, il tourna par", "hasard le chaton de la bague vers l'intérieur de sa", "main ; aussitôt il devint invisible à ses voisins qui", "parlèrent de lui comme s'il était parti. Etonné, il", "mania de nouveau la bague en tâtonnant, tourna le", "chaton en dehors et, ce faisant, redevint visible.", "S'étant rendu compte de cela, il répéta l'expérience", "pour voir si l'anneau avait bien ce pouvoir ; le même", "prodige se reproduisit : en tournant le chaton en", "dedans il devenait invisible, en dehors visible. Dès", "qu'il fut sûr de son fait, il fit en sorte d'être au", "nombre des messagers qui se rendaient auprès du roi.", "Arrivé au palais, il séduisit la reine, complota avec", "elle la mort du roi, le tua, et obtint ainsi le", "pouvoir."], "notion": "La justice", "q": "Les hommes sont-ils justes par choix ou par crainte d’être punis ?", "opinion": "Que les hommes seraient justes par choix, pour le bien lui-même.", "enjeu": "Le texte est un récit : il faut dégager la question qu’il pose (que ferait-on sans risque d’être puni ?) et la réponse qu’il suggère.", "th": "Le mythe pose une épreuve : celui qui peut agir sans être vu, et sans risquer de sanction, que fait-il ? Gygès use de l’impunité pour commettre l’injustice et satisfaire son ambition.", "etapes": [{"l": "1-15", "idee": "Un berger et un séisme ; La découverte de l’anneau.", "args": "Gygès, berger du roi de Lydie, descend dans une ouverture ouverte dans le sol après un orage et un séisme. Il y voit un cheval d’airain et un cadavre qui porte un anneau d’or. Il le prend et s’en va.", "lien": "Après avoir raconté comment Gygès découvre l’anneau, le récit en montre le pouvoir : l’invisibilité."}, {"l": "16-27", "idee": "Le pouvoir de l’anneau ; Il vérifie, puis il agit.", "args": "Lors de l’assemblée des bergers, il tourne par hasard le chaton vers l’intérieur : il devient invisible. Il répète l’expérience pour en être sûr, puis il se fait envoyer comme messager auprès du roi.", "lien": "Dès qu’il est sûr de son pouvoir, Gygès passe à l’acte : séduction de la reine, complot, prise du pouvoir."}, {"l": "28-30", "idee": "L’usage de l’impunité.", "args": "Arrivé au palais, il séduit la reine, complote avec elle la mort du roi, le tue et prend le pouvoir.", "lien": "L’usage de l’impunité confirme l’épreuve : celui qui peut agir sans être vu commet l’injustice."}], "concepts": [{"c": "Impunité", "s": "Fait de ne pas risquer de sanction. L’anneau supprime la crainte d’être vu et puni."}, {"c": "Justice par crainte", "s": "Idée que l’on est juste par peur du châtiment ou de la réputation, non par conviction."}, {"c": "Invisibilité", "s": "Pouvoir d’agir sans témoin : épreuve des motifs réels d’une action."}], "A": [{"q": "un anneau d'or, dont il s'empara", "l": "11-11", "e": 0}, {"q": "aussitôt il devint invisible à ses voisins", "l": "18-18", "e": 1}, {"q": "il séduisit la reine, complota avec elle la mort du roi, le tua, et obtint ainsi le pouvoir", "l": "28-30", "e": 2}], "CQ": [{"q": "Qui serait juste sans témoin ?", "c": "Ce mythe est raconté par Glaucon, qui veut montrer que personne n’est juste volontairement. Est-ce convaincant ? (À comparer avec Hobbes.)"}, {"q": "La justice, un bien en soi ?", "c": "Platon veut montrer que le juste est heureux même invisible. La justice vaut-elle par elle-même ou par ses effets ?"}], "theme": "La justice"}, {"id": "justice-platon-lois", "label": "Platon : pourquoi avoir des lois ?", "auteur": "Platon", "oeuvre": "Les Lois", "fiche": "justice-platon-lois.html", "lignes": ["Il est nécessaire aux hommes de se donner des lois et", "de vivre conformément à ces lois, sous peine de ne", "différer en rien des bêtes les plus sauvages. Voici", "quelle en est la raison : aucun homme ne naît avec une", "aptitude naturelle à savoir ce qui est profitable pour", "la vie humaine en société et, même s’il le savait, à", "pouvoir toujours faire et souhaiter le meilleur. Car", "en premier lieu il est difficile de comprendre que", "l’art politique véritable doit prendre soin, non du", "bien particulier, mais du bien général – car le bien", "général rassemble, tandis que le bien particulier", "déchire les sociétés ; et le bien commun tout autant", "que le bien particulier gagnent même tous les deux à", "ce que le premier plutôt que le second soit assuré de", "façon convenable.", "En second lieu, même si l’on était assez habile pour", "se rendre compte que telle est la nature des choses,", "et qu’on ait à gouverner un État avec un pouvoir", "absolu et sans rendre aucun compte, on ne pourrait pas", "rester fidèle à ce principe et faire passer pendant", "toute sa vie le bien commun de la société au premier", "rang et le bien particulier au deuxième. En fait la", "nature mortelle de l’homme le portera toujours à", "vouloir plus que les autres et à s’occuper de son bien", "particulier, parce qu’elle fuit la douleur et poursuit", "le plaisir sans tenir compte de la raison, qu’elle les", "fera passer l’une et l’autre avant le plus juste et le", "meilleur, et, s’aveuglant elle-même, elle finira par", "se remplir, elle et toute la société, de toutes sortes", "de maux."], "notion": "La justice", "q": "Pourquoi les hommes ont-ils besoin de lois ?", "opinion": "Que l’on pourrait vivre sans lois, chacun suivant le bien qu’il connaît.", "enjeu": "Cette thèse n’est pas évidente : si l’on connaissait le bien, pourquoi aurait-on encore besoin de lois ?", "th": "Sans lois, les hommes ne différeraient pas des bêtes sauvages. Nul ne connaît naturellement le bien commun, et même s’il le connaissait, sa nature mortelle le porterait à préférer son intérêt particulier.", "etapes": [{"l": "1-7", "idee": "Les lois sont nécessaires ; Personne ne sait naturellement ce qui est bon.", "args": "Sans elles, les hommes ne diffèrent en rien des bêtes les plus sauvages. Aucun homme n’a une aptitude naturelle à savoir ce qui est profitable à la vie en société, ni à toujours le vouloir.", "lien": "Après avoir posé que les lois sont nécessaires parce que personne ne sait naturellement ce qui est bon, Platon avance que le bien général passe avant le bien particulier."}, {"l": "7-22", "idee": "Le bien général passe avant le bien particulier ; Même le plus habile faillirait.", "args": "L’art politique véritable doit prendre soin du bien général, qui rassemble, plutôt que du bien particulier, qui déchire. Même qui gouvernerait avec un pouvoir absolu ne resterait pas fidèle à ce principe.", "lien": "Même celui qui connaîtrait le bien commun ne le suivrait pas toujours : sa nature l’en détournerait."}, {"l": "22-30", "idee": "La nature mortelle de l’homme.", "args": "Elle fuit la douleur et poursuit le plaisir, veut toujours plus que les autres, et remplit la société de maux.", "lien": "La nature mortelle de l’homme donne la raison dernière : les lois sont nécessaires."}], "concepts": [{"c": "Bien général / particulier", "s": "Le bien de tous contre le bien d’un seul. Le premier unit, le second divise."}, {"c": "Art politique", "s": "Savoir de gouverner, qui vise le bien commun."}, {"c": "Pouvoir absolu", "s": "Pouvoir sans contrôle. Même lui ne garantit pas la vertu."}], "A": [{"q": "sous peine de ne différer en rien des bêtes les plus sauvages", "l": "2-3", "e": 0}, {"q": "le bien général rassemble, tandis que le bien particulier déchire les sociétés", "l": "10-12", "e": 1}, {"q": "la nature mortelle de l’homme le portera toujours à vouloir plus que les autres", "l": "22-24", "e": 2}], "CQ": [{"q": "Un gouvernant éclairé suffit-il ?", "c": "Platon, ailleurs, rêve du philosophe-roi. Ici il doute de tout pouvoir absolu. Pourquoi ? (À comparer avec Hobbes.)"}, {"q": "Les lois nous protègent-elles de nous-mêmes ?", "c": "Les lois sont-elles le remède aux passions humaines ?"}], "theme": "La justice"}, {"id": "justice-rawls", "label": "Rawls : l’intuitionnisme en matière de justice", "auteur": "Rawls", "oeuvre": "Théorie de la justice", "fiche": "justice-rawls.html", "lignes": ["J’envisagerai l’intuitionnisme d’une manière plus", "générale que d’ordinaire, comme la doctrine selon", "laquelle il y a une famille irréductible de principes", "premiers que nous devons mettre en balance les uns par", "rapport aux autres en nous demandant, par un jugement", "mûrement réfléchi, quel équilibre est le plus juste.", "Une fois atteint un certain niveau de généralité,", "l’intuitionniste adéquate l’importance relative des", "principes de justice concurrents. Comme la complexité", "des faits moraux nécessite un grand nombre de", "principes distincts, il n’y a pas de critère unique", "pour en rendre compte ou leur attribuer l’important", "qu’ils méritent. Les théories intuitionnistes ont deux", "caractéristiques ; tout d’abord, elles consistent en", "une pluralité de principes premiers qui peuvent entrer", "en conflit et donner des directives contraires dans", "certains types de cas ; ensuite, elles ne comprennent", "aucune méthode explicite, aucune règle de priorité", "pour mettre en balance ces principes les uns par", "rapport aux autres : nous devons simplement découvrir", "un équilibre par intuition, d’après ce qui nous semble", "le plus proche du juste. […]", "De ce point de vue, il y a donc de nombreuses formes", "d’intuitionnisme. Non seulement nos idées quotidiennes", "sont de ce type, mais peut-être aussi la plupart des", "doctrines philosophiques. Le niveau de généralité de", "leurs principes est un moyen de distinguer entre les", "différentes versions de l’intuitionnisme.", "L’intuitionnisme du sens commun prend la forme de", "groupes de préceptes assez spécifiques, chaque groupe", "s’appliquant à un problème particulier de justice."], "notion": "La justice", "q": "Y a-t-il un critère unique pour décider ce qui est juste ?", "opinion": "Qu’il existerait un critère unique, un principe, pour décider de ce qui est juste.", "enjeu": "Le texte expose une doctrine que Rawls va ensuite critiquer : il faut donc distinguer ce qu’il décrit de ce qu’il en pense.", "th": "Selon l’intuitionnisme, il existe une pluralité de principes premiers irréductibles et aucune règle de priorité : l’équilibre se trouve par un jugement réfléchi. Rawls y voit une doctrine fréquente, mais insuffisante.", "etapes": [{"l": "1-13", "idee": "Une définition large ; Pas de critère unique.", "args": "L’intuitionnisme est la doctrine selon laquelle il y a une famille irréductible de principes premiers, à mettre en balance par un jugement mûrement réfléchi. La complexité des faits moraux exige beaucoup de principes distincts : aucun critère unique ne les départage.", "lien": "Après avoir défini l’intuitionnisme largement, Rawls en dégage les deux caractéristiques : pluralité des principes et absence de règle de priorité."}, {"l": "13-24", "idee": "Deux caractéristiques ; L’équilibre par intuition.", "args": "Une pluralité de principes premiers qui peuvent entrer en conflit ; aucune méthode explicite ni règle de priorité. On doit simplement découvrir un équilibre d’après ce qui semble le plus proche du juste.", "lien": "Faute de règle de priorité, l’équilibre se trouve par un jugement réfléchi ; reste à voir que cette doctrine est répandue."}, {"l": "24-31", "idee": "Une doctrine répandue.", "args": "Nos idées quotidiennes sont de ce type, et peut-être la plupart des doctrines philosophiques. Elles diffèrent par leur niveau de généralité.", "lien": "Cette doctrine répandue est pourtant insuffisante, selon Rawls : c’est ce qui oriente la suite de son livre."}], "concepts": [{"c": "Intuitionnisme", "s": "Doctrine qui s’en remet à l’intuition pour équilibrer des principes de justice."}, {"c": "Principes premiers", "s": "Principes irréductibles les uns aux autres, qui peuvent entrer en conflit."}, {"c": "Règle de priorité", "s": "Méthode qui dit quel principe l’emporte en cas de conflit."}], "A": [{"q": "une famille irréductible de principes premiers", "l": "3-4", "e": 0}, {"q": "aucune règle de priorité pour mettre en balance ces principes", "l": "18-19", "e": 1}, {"q": "L’intuitionnisme du sens commun prend la forme de groupes de préceptes assez spécifiques", "l": "29-30", "e": 2}], "CQ": [{"q": "L’intuition suffit-elle ?", "c": "Sans règle de priorité, comment se mettre d’accord ? Rawls proposera des principes ordonnés. (À comparer avec Hobbes.)"}, {"q": "Pluralité des valeurs. Peut-on réduire les valeurs (liberté, égalité…) à un principe unique ?", "c": ""}], "theme": "La justice"}, {"id": "justice-smith", "label": "Smith : la justice et la négligence", "auteur": "Smith", "oeuvre": "Théorie des sentiments moraux", "fiche": "justice-smith.html", "lignes": ["Il est un degré de négligence qui paraîtrait mériter", "une punition quoique cette négligence n’occasionne", "aucun dommage à personne. Si une personne jetait une", "grosse pierre dans une voie publique du haut d’un mur", "sans en avertir les passants, et sans regarder où elle", "pourrait tomber, elle mériterait certainement une", "punition. Une police vraiment exacte châtierait une", "action si absurde, même si elle n’avait fait aucun", "mal. La personne qui s’en rend coupable fait preuve", "d’un mépris insolent envers le bonheur et la sécurité", "des autres. Il y a une injustice réelle dans cette", "conduite. Cette personne expose inconsidérément son", "prochain à ce qu’aucun homme de bon sens ne voudrait", "risquer ; de toute évidence elle manque du sens de ce", "qui est dû à ses semblables, et qui est la base de la", "justice et de la société.", "Une négligence grossière est donc, selon la loi,", "presque l’équivalent d’un dessein malveillant. Quand", "des conséquences malheureuses découlent d’une telle", "insouciance, la personne qui en est coupable est", "souvent châtiée comme si ces conséquences avaient", "réellement été dans son intention ; sa conduite qui", "était seulement insouciante et insolente, et qui", "méritait punition, est considérée comme atroce et", "passible du châtiment le plus sévère. Si une personne", "en tue accidentellement une autre par l’action", "imprudente mentionnée ci-dessus, elle est, selon les", "lois de nombreux pays, et notamment selon la vieille", "loi d’Écosse, passible du châtiment suprême.", "Bien que ce soit sans nul doute excessivement sévère,", "ce n’est pas du tout contraire à nos sentiments", "naturels. Notre juste indignation contre la folie et", "l’inhumanité de cette conduite est renforcée par notre", "sympathie avec l’infortuné qui en souffre. Rien,", "pourtant, ne choquerait plus notre sens naturel de la", "justice que de mener un homme à l’échafaud simplement", "pour avoir jeté avec insouciance une pierre dans la", "rue, sans faire de mal à personne."], "notion": "La justice", "q": "Sur quoi repose le jugement de justice : l’intention ou les conséquences ?", "opinion": "Que seule l’intention déciderait de la justice d’un acte.", "enjeu": "Cette thèse est nuancée : elle admet à la fois l’intention et les conséquences, et il faut montrer comment elle les concilie.", "th": "La négligence grossière est presque l’équivalent d’un dessein malveillant, car elle révèle l’absence de sens de ce qui est dû à autrui. Mais nos sentiments naturels jugent aussi selon les conséquences.", "etapes": [{"l": "1-17", "idee": "Une négligence qui mérite punition ; Un mépris envers la sécurité d’autrui ; Négligence et malveillance.", "args": "Jeter une grosse pierre dans la rue sans avertir mériterait punition, même sans dommage. Cette personne expose son prochain à un risque qu’aucun homme de bon sens ne courrait : elle manque du sens de ce qui est dû à ses semblables. Une négligence grossière équivaut presque à un dessein malveillant.", "lien": "Après avoir montré qu’une négligence grossière mérite punition parce qu’elle révèle un mépris de la sécurité d’autrui, Smith ajoute que les conséquences changent la peine."}, {"l": "18-29", "idee": "Les conséquences changent la peine.", "args": "Si la pierre tue quelqu’un, le coupable est souvent puni comme si le meurtre avait été voulu : il est passible du châtiment suprême.", "lien": "Si les conséquences changent la peine, la loi paraît parfois excessive, mais elle suit nos sentiments naturels."}, {"l": "30-38", "idee": "Un excès conforme au sentiment.", "args": "Cette sévérité est excessive mais ne contredit pas nos sentiments naturels. En revanche, envoyer à l’échafaud pour une pierre sans dégât choquerait notre sens de la justice.", "lien": "L’excès de sévérité est ainsi conforme au sentiment : nos jugements tiennent compte des conséquences autant que de l’intention."}], "concepts": [{"c": "Négligence", "s": "Manque de soin envers autrui qui crée un risque."}, {"c": "Dessein malveillant", "s": "Intention de nuire."}, {"c": "Sentiments naturels", "s": "Réactions morales spontanées, comme l’indignation ou la sympathie."}], "A": [{"q": "Une police vraiment exacte châtierait une action si absurde, même si elle n’avait fait aucun mal", "l": "7-9", "e": 0}, {"q": "Une négligence grossière est donc, selon la loi, presque l’équivalent d’un dessein malveillant", "l": "17-18", "e": 1}, {"q": "Rien, pourtant, ne choquerait plus notre sens naturel de la justice", "l": "34-36", "e": 2}], "CQ": [{"q": "Intention ou conséquences ?", "c": "Un accident involontaire doit-il être puni comme un crime ? (À comparer avec Kant sur la valeur morale de l’intention.)"}, {"q": "Le rôle des sentiments dans la justice. Smith s’appuie sur les sentiments naturels. Les sentiments sont-ils un bon guide en matière de justice ?", "c": ""}], "theme": "La justice"}, {"id": "conscience-sartre", "label": "Sartre : condamné à être libre", "auteur": "Sartre", "oeuvre": "L'existentialisme est un humanisme", "fiche": "conscience-sartre.html", "lignes": ["Dostoïevski avait écrit : « Si Dieu n'existait pas,", "tout serait permis ». C'est là le point de départ de", "l'existentialisme. En effet, tout est permis si Dieu", "n'existe pas, et par conséquent l'homme est délaissé,", "parce qu'il ne trouve ni en lui, ni hors de lui une", "possibilité de s'accrocher. Il ne trouve d'abord pas", "d'excuses. Si, en effet, l'existence précède", "l'essence, on ne pourra jamais expliquer par référence", "à une nature humaine donnée et figée ; autrement dit,", "il n'y a pas de déterminisme, l'homme est libre,", "l'homme est liberté. Si, d'autre part, Dieu n'existe", "pas, nous ne trouvons pas en face de nous des valeurs", "ou des ordres qui légitimeront notre conduite. Ainsi,", "nous n'avons ni derrière nous, ni devant nous, dans le", "domaine lumineux des valeurs, des justifications ou", "des excuses. Nous sommes seuls, sans excuses.", "C'est ce que j'exprimerai en disant que l'homme est", "condamné à être libre. Condamné, parce qu'il ne s'est", "pas créé lui-même, et par ailleurs cependant libre,", "parce qu'une fois jeté dans le monde, il est", "responsable de tout ce qu'il fait. L'existentialiste", "ne croit pas à la puissance de la passion. Il ne", "pensera jamais qu'une belle passion est un torrent", "dévastateur qui conduit fatalement l'homme à certains", "actes, et qui, par conséquent, est une excuse. Il", "pense que l'homme est responsable de ses désirs.", "L'existentialiste ne pensera pas non plus que l'homme", "peut trouver un secours dans un signe donné, sur", "terre, qui l’orientera ; car il pense que l'homme", "déchiffre lui-même le signe comme il lui plaît. Il", "pense donc que l'homme, sans aucun appui et sans aucun", "secours, est condamné à chaque instant à inventer", "l'homme."], "notion": "La liberté", "q": "L'homme peut-il se justifier par autre chose que lui-même ?", "opinion": "", "enjeu": "", "th": "L'homme n'a ni nature, ni Dieu, ni passion, ni signe qui puisse lui servir d'excuse : il est libre, donc entièrement responsable de ce qu'il fait et de ce qu'il est. Cette liberté est une condamnation, car elle est imposée et sans appui.", "etapes": [{"l": "1-16", "idee": "Sans Dieu, l'homme est délaissé : il n'a aucun appui ni en lui ni hors de lui.", "args": "Dostoïevski : « tout est permis » ; l'existence précède l'essence, donc pas de nature humaine ni de déterminisme ; pas de valeurs données ; l'homme est seul, sans excuses.", "lien": "On passe de la situation (le délaissement) à sa formule : comment dire en un mot cette liberté sans appui ?"}, {"l": "17-21", "idee": "La formule : l'homme est « condamné à être libre ».", "args": "Condamné, car il ne s'est pas créé lui-même ; libre, car une fois jeté dans le monde, il est responsable de tout ce qu'il fait.", "lien": "De la formule générale à ses conséquences concrètes : quelles excuses cette liberté retire-t-elle ?"}, {"l": "21-33", "idee": "Ni la passion ni les signes ne sont des excuses : l'homme doit inventer l'homme.", "args": "La passion n'est pas un torrent qui conduit fatalement à l'acte ; l'homme est responsable de ses désirs ; il déchiffre lui-même les signes.", "lien": "Avec la thèse : la liberté est totale, y compris à l'égard de nos passions et des signes qui paraissent nous guider."}], "concepts": [{"c": "Délaissement", "s": "Situation de l'homme sans Dieu ni appui, ni en lui ni hors de lui. Importance : elle est le point de départ du raisonnement."}, {"c": "L'existence précède l'essence / déterminisme", "s": "L'homme existe d'abord et se définit ensuite par ses actes : il n'y a pas de nature humaine figée qui expliquerait ce qu'il fait. Importance : c'est ce qui exclut le déterminisme et fonde l'absence d'excuses."}, {"c": "Condamné à être libre / responsabilité", "s": "La liberté n'est pas un privilège mais une charge imposée : on ne peut pas ne pas choisir, et on répond de tout ce que l'on fait. Importance : c'est le paradoxe central du texte."}], "A": [{"q": "tout est permis si Dieu n'existe pas, et par conséquent l'homme est délaissé", "l": "3-4", "e": 0}, {"q": "l'homme est condamné à être libre", "l": "17-18", "e": 1}, {"q": "est condamné à chaque instant à inventer l'homme", "l": "32-33", "e": 2}], "CQ": [{"q": "L’homme est-il maître de ses passions ?", "c": "Sartre refuse que la passion soit une excuse : l’homme est responsable de ses désirs. Spinoza ou Freud contesteraient que l’homme soit maître de ses passions."}, {"q": "Sommes-nous condamnés à être libres ?", "c": "Si Dieu n’existe pas, aucune valeur ne légitime notre conduite : la liberté devient un fardeau. Est-elle pour autant une condamnation, ou aussi une chance de créer des valeurs ?"}], "theme": "La liberté"}, {"id": "spinoza-lettre-a-schuller", "label": "Spinoza : l’ignorance des causes déterminantes", "auteur": "Spinoza", "oeuvre": "Lettre à Schuller", "fiche": "spinoza-lettre-a-schuller.html", "lignes": ["Pour rendre cela [la thèse de Spinoza] clair et", "intelligible, concevons une chose très simple : une", "pierre par exemple reçoit d’une cause extérieure qui", "la pousse, une certaine quantité de mouvement et,", "l’impulsion de la cause extérieure venant à cesser,", "elle continuera à se mouvoir nécessairement. Cette", "persistance de la pierre dans le mouvement est une", "contrainte, non parce qu’elle est nécessaire, mais", "parce qu’elle doit être définie par l’impulsion d’une", "cause extérieure.", "Et ce qui est vrai de la pierre il faut l’entendre de", "toute chose singulière, […], parce que toute chose", "singulière est nécessairement déterminée par une cause", "extérieure à exister et à agir d’une certaine manière", "déterminée. Concevez maintenant, si vous voulez bien,", "que la pierre, tandis qu’elle continue de se mouvoir,", "pense et sache qu’elle fait effort, autant qu’elle", "peut, pour se mouvoir. Cette pierre assurément,", "puisqu’elle a conscience de son effort seulement et", "qu’elle n’est en aucune façon indifférente, croira", "qu’elle est très libre et qu’elle ne persévère dans", "son mouvement que parce qu’elle le veut.", "Telle est cette liberté humaine que tous se vantent de", "posséder et qui consiste en cela seul que les hommes", "ont conscience de leurs appétits et ignorent les", "causes qui les déterminent."], "notion": "La liberté", "q": "Sommes-nous libres, ou croyons-nous seulement l’être ?", "opinion": "Que nous serions libres parce que nous avons conscience de vouloir ce que nous faisons.", "enjeu": "Cette thèse est choquante : comment nier une liberté dont nous avons l’expérience immédiate ? Il faut montrer comment l’analogie de la pierre l’établit.", "th": "Tout est déterminé par des causes extérieures. La liberté humaine est une illusion : nous avons conscience de nos désirs mais nous ignorons les causes qui les déterminent, comme une pierre qui, si elle pensait, se croirait libre.", "etapes": [{"l": "1-11", "idee": "La pierre poussée.", "args": "Une pierre qui reçoit d’une cause extérieure une certaine quantité de mouvement continue à se mouvoir nécessairement : sa persistance est une contrainte, définie par une cause extérieure.", "lien": "Après avoir montré que la pierre mue par une cause extérieure est contrainte, Spinoza généralise : toute chose est déterminée de l’extérieur à exister et à agir."}, {"l": "12-23", "idee": "Toute chose singulière ; Une pierre consciente.", "args": "Ce qui est vrai de la pierre l’est de toute chose singulière : elle est nécessairement déterminée par une cause extérieure à exister et à agir. Si la pierre pensait et savait qu’elle fait effort pour se mouvoir, elle se croirait très libre et ne persévérerait, croirait-elle, que parce qu’elle le veut.", "lien": "Si toute chose est déterminée, une pierre qui prendrait conscience de son effort se croirait libre : elle ignorerait la cause qui la meut."}, {"l": "24-26", "idee": "La liberté humaine.", "args": "Telle est la liberté dont les hommes se vantent : ils ont conscience de leurs appétits et ignorent les causes qui les déterminent.", "lien": "Telle est la liberté humaine : conscience de nos désirs, ignorance de leurs causes."}], "concepts": [{"c": "Déterminisme", "s": "Thèse selon laquelle tout ce qui existe et agit est déterminé par des causes."}, {"c": "Contrainte", "s": "Ici : fait d’être défini à exister et à agir par une cause extérieure."}, {"c": "Illusion de liberté", "s": "Se croire libre parce qu’on a conscience de ses désirs, sans connaître leurs causes."}], "A": [{"q": "une pierre par exemple reçoit d’une cause extérieure qui la pousse, une certaine quantité de mouvement", "l": "2-4", "e": 0}, {"q": "croira qu’elle est très libre et qu’elle ne persévère dans son mouvement que parce qu’elle le veut", "l": "20-22", "e": 1}, {"q": "les hommes ont conscience de leurs appétits et ignorent les causes qui les déterminent", "l": "24-26", "e": 2}], "CQ": [{"q": "Une liberté illusoire ?", "c": "Si nos choix sont déterminés, que devient la responsabilité ? (À comparer avec Sartre.)"}, {"q": "Se sentir libre, est-ce l’être ?", "c": "Spinoza dit que la conscience de nos appétits ne prouve pas que nous soyons libres. L’expérience intime de choisir est-elle un simple effet de notre ignorance des causes ?"}], "theme": "La liberté"}, {"id": "epictete", "label": "Épictète : ce qui dépend de nous", "auteur": "Épictète", "oeuvre": "Manuel", "fiche": "epictete.html", "lignes": ["1 Parmi les choses qui existent, certaines dépendent", "de nous, d’autres non. De nous, dépendent la pensée,", "l’impulsion, le désir, l’aversion, bref, tout ce en", "quoi c’est nous qui agissons ; ne dépendent pas de", "nous le corps, l’argent, la réputation, les charges", "publiques, tout ce en quoi ce n’est pas nous qui", "agissons.", "2 Ce qui dépend de nous est libre naturellement, ne", "connaît ni obstacles ni entraves ; ce qui n’en dépend", "pas est faible, esclave, exposé aux obstacles et nous", "est étranger.", "3 Donc, rappelle-toi que si tu tiens pour libre ce qui", "est naturellement esclave et pour un bien propre ce", "qui t’est étranger, tu vivras contrarié, chagriné,", "tourmenté ; tu en voudras aux hommes comme aux dieux ;", "mais si tu ne juges tien que ce qui l’est vraiment –", "et tout le reste étranger –, jamais personne ne saura", "te contraindre ni te barrer la route ; tu ne t’en", "prendras à personne, n’accuseras personne, ne feras", "jamais rien contre ton gré, personne ne pourra te", "faire de mal et tu n’auras pas d’ennemis puisqu’on ne", "t’obligera jamais à rien qui soit mauvais pour toi."], "notion": "La liberté", "q": "Qu’est-ce qui dépend de nous, et comment être libre ?", "opinion": "Que nous serions libres lorsque nous possédons la santé, les biens et la réputation.", "enjeu": "Cette thèse n’est pas évidente : si le corps et la réputation ne dépendent pas de nous, peut-on encore être heureux face à ce qui nous arrive ?", "th": "Certaines choses dépendent de nous (pensée, désir, aversion), d’autres non (corps, argent, réputation). Seules les premières sont libres : les confondre rend malheureux, les distinguer rend invulnérable à toute contrainte.", "etapes": [{"l": "1-7", "idee": "Deux sortes de choses.", "args": "Certaines choses dépendent de nous (pensée, impulsion, désir, aversion), d’autres non (corps, argent, réputation, charges publiques).", "lien": "Après avoir distingué ce qui dépend de nous de ce qui n’en dépend pas, Épictète donne le statut de chacun : les premières choses sont libres, les autres esclaves."}, {"l": "8-11", "idee": "Libre ou esclave.", "args": "Ce qui dépend de nous est libre, sans obstacle ni entrave ; le reste est faible, esclave et nous est étranger.", "lien": "Si seul ce qui dépend de nous est libre, confondre les deux est source de malheur ; il en faut tirer la conséquence pratique."}, {"l": "12-22", "idee": "Le malheur de la confusion ; La liberté de la distinction.", "args": "Tenir pour libre ce qui est esclave rend contrarié, chagriné, tourmenté : on en veut aux hommes comme aux dieux. Qui ne tient pour sien que ce qui l’est vraiment ne peut être contraint, n’a pas d’ennemis et ne fait rien contre son gré.", "lien": "Celui qui ne tient pour sien que ce qui l’est vraiment ne peut être contraint : c’est la thèse."}], "concepts": [{"c": "Ce qui dépend de nous", "s": "La pensée, l’impulsion, le désir, l’aversion : tout ce en quoi c’est nous qui agissons."}, {"c": "Ce qui ne dépend pas de nous", "s": "Le corps, l’argent, la réputation, les charges publiques."}, {"c": "Liberté stoïcienne", "s": "Ne pas être entravé ni contraint, en ne tenant pour sien que ce qui dépend de nous."}], "A": [{"q": "certaines dépendent de nous, d’autres non", "l": "1-2", "e": 0}, {"q": "ce qui n’en dépend pas est faible, esclave, exposé aux obstacles et nous est étranger", "l": "9-11", "e": 1}, {"q": "jamais personne ne saura te contraindre ni te barrer la route", "l": "17-18", "e": 2}], "CQ": [{"q": "Peut-on être libre en ne maîtrisant que sa pensée ?", "c": "Le corps, la santé ou la réputation comptent pourtant pour nous. Peut-on s’en détacher sans cesser d’agir dans le monde ?"}, {"q": "Faut-il se détacher de tout ce qui ne dépend pas de nous ?", "c": "Épictète conseille de juger « étranger » ce qui ne dépend pas de nous. Un tel détachement est-il possible, et souhaitable, face à l’injustice ou à la souffrance des autres ?"}], "theme": "La liberté"}, {"id": "nature-aristote", "label": "Aristote : voix, parole et langage animal", "auteur": "Aristote", "oeuvre": "La Politique", "fiche": "nature-aristote.html", "lignes": ["Que l'homme soit un animal politique à un plus haut", "degré qu'une abeille quelconque ou tout autre animal", "vivant à l'état grégaire, cela est évident. La nature,", "en effet, selon nous, ne fait rien en vain ; et", "l'homme, seul de tous les animaux, possède la parole.", "Or, tandis que la voix ne sert qu'à indiquer la joie", "et la peine, et appartient pour ce motif aux autres", "animaux également (car leur nature va jusqu'à éprouver", "les sensations de plaisir et de douleur, et à se les", "signifier les uns aux autres), le discours (logos)", "sert à exprimer l'utile et le nuisible, et, par suite", "aussi, le juste et l'injuste: car c'est le caractère", "propre de l'homme par rapport aux autres animaux", "d'être le seul à avoir le sentiment du bien et du mal,", "du juste et de l'injuste, et des autres notions", "morales, et c'est la communauté de ces sentiments qui", "engendre famille et cité."], "notion": "La nature", "q": "Qu’est-ce qui rend l’homme plus politique que les autres animaux sociables ?", "opinion": "Que l’homme ne serait qu’un animal social parmi d’autres, comme l’abeille.", "enjeu": "Cette thèse n’est pas évidente : en quoi le discours distingue-t-il l’homme de l’abeille ?", "th": "L’homme est un animal politique à un plus haut degré que l’abeille, car il possède le discours. Ce dernier exprime le juste et l’injuste, et la communauté de ces sentiments engendre famille et cité.", "etapes": [{"l": "1-5", "idee": "L’homme, plus politique que l’abeille ; La nature ne fait rien en vain.", "args": "Aristote affirme qu’il est évident que l’homme est un animal politique à un plus haut degré que les abeilles ou les autres animaux vivant en troupeau. Il s’appuie sur un principe : la nature est finalisée. Si l’homme est le seul à posséder la parole, c’est qu’elle a une fonction.", "lien": "Après avoir posé que l’homme est plus politique que l’abeille, Aristote donne la raison : la nature ne fait rien en vain, et elle a donné le discours à l’homme seul."}, {"l": "6-17", "idee": "La voix exprime plaisir et douleur ; Le discours exprime l’utile et le juste ; La communauté de ces sentiments fonde la cité.", "args": "Les autres animaux ont une voix pour indiquer la joie et la peine, car ils ressentent plaisir et douleur et peuvent se les signifier. Le logos sert à exprimer l’utile et le nuisible, et par suite le juste et l’injuste. L’homme est le seul à avoir le sentiment du bien et du mal. Leur partage engendre famille et cité.", "lien": "Le discours, qui exprime l’utile, le juste et l’injuste, fonde la communauté : c’est la thèse."}], "concepts": [{"c": "Animal politique", "s": "Être qui vit naturellement en cité. La politique n’est pas artificielle : elle est conforme à la nature de l’homme."}, {"c": "Voix (phônè)", "s": "Son qui exprime des sensations, comme le plaisir et la douleur. Les animaux en disposent aussi."}, {"c": "Discours (logos)", "s": "Parole raisonnée, qui permet de dire ce qui est utile, nuisible, juste ou injuste."}], "A": [{"q": "La nature, en effet, selon nous, ne fait rien en vain", "l": "3-4", "e": 0}, {"q": "la voix ne sert qu'à indiquer la joie et la peine", "l": "6-7", "e": 1}, {"q": "c'est la communauté de ces sentiments qui engendre famille et cité", "l": "16-17", "e": 1}], "CQ": [{"q": "Les animaux ont-ils un langage ?", "c": "Aristote réserve le logos à l’homme. Les recherches actuelles sur la communication animale remettent-elles cette frontière en question ?"}, {"q": "Une finalité de la nature. « La nature ne fait rien en vain » : peut-on encore l’affirmer ? Jacob refuse ce principe explicatif en biologie.", "c": ""}], "theme": "La nature"}, {"id": "nature-descartes", "label": "Descartes : maîtres et possesseurs de la nature", "auteur": "Descartes", "oeuvre": "Discours de la méthode (VIe partie)", "fiche": "nature-descartes.html", "lignes": ["Sitôt que j’ai eu acquis quelques notions générales", "touchant la physique, et que commençant à les éprouver", "en diverses difficultés particulières, j’ai remarqué", "jusques où elles peuvent conduire, et combien elles", "diffèrent des principes dont on s’est servi jusqu’à", "présent, j’ai cru que je ne pouvais les tenir cachées", "sans pécher grandement contre la loi qui nous oblige à", "procurer, autant qu’il est en nous, le bien général de", "tous les hommes. Car elles m’ont fait voir qu’il est", "possible de parvenir à des connaissances qui soient", "fort utiles à la vie, et qu’au lieu de cette", "philosophie spéculative, qu’on enseigne dans les", "écoles, on peut en trouver une pratique, par laquelle", "connaissant la force et les actions du feu, de l’eau,", "de l’air, des astres, des cieux et de tous les autres", "corps qui nous environnent, aussi distinctement que", "nous connaissons les divers métiers de nos artisans,", "nous les pourrions employer en même façon à tous les", "usages auxquels ils sont propres et ainsi nous rendre", "comme maîtres et possesseurs de la nature.", "Ce qui n’est pas seulement à désirer pour l’invention", "d’une infinité d’artifices, qui feraient qu’on", "jouirait, sans aucune peine, des fruits de la terre et", "de toutes les commodités qui s’y trouvent, mais", "principalement aussi pour la conservation de la santé,", "laquelle est sans doute le premier bien et le", "fondement de tous les autres biens de cette vie ; car", "même l’esprit dépend si fort du tempérament, et de la", "disposition des organes du corps que, s’il est", "possible de trouver quelque moyen qui rende", "communément les hommes plus sages et plus habiles", "qu’ils n’ont été jusque ici, je crois que c’est dans", "la médecine qu’on doit le chercher."], "notion": "La nature", "q": "À quoi doit servir la connaissance de la nature ?", "opinion": "Que la connaissance de la nature serait purement spéculative, sans lien avec nos usages.", "enjeu": "Cette thèse est ambiguë : que veut dire « maîtres et possesseurs » ? Il faut l’interpréter à partir du contexte, notamment de la santé.", "th": "La physique ne doit pas rester une philosophie purement spéculative : en connaissant les corps comme les artisans connaissent leurs métiers, nous pouvons les employer à nos usages, et d’abord conserver la santé.", "etapes": [{"l": "1-9", "idee": "Un devoir de partager ses découvertes.", "args": "Dès qu’il a acquis quelques notions de physique, Descartes juge qu’il ne peut les tenir cachées : la loi oblige à procurer le bien général des hommes.", "lien": "Après avoir rappelé le devoir de partager ses découvertes, Descartes oppose la philosophie spéculative à une philosophie pratique, qui connaît la nature comme les artisans leurs métiers."}, {"l": "9-20", "idee": "Une philosophie pratique plutôt que spéculative ; Connaître la nature comme les artisans leurs métiers ; Maîtres et possesseurs.", "args": "Ses notions diffèrent des principes de l’école. Elles mènent à des connaissances très utiles à la vie. Si l’on connaît la force du feu, de l’eau, de l’air et des astres aussi distinctement que les métiers des artisans, on peut les employer à tous leurs usages. Le but est de nous rendre « comme maîtres et possesseurs de la nature » : inventer des artifices, jouir sans peine des fruits de la terre.", "lien": "Si l’on connaît les corps comme les artisans leurs métiers, on peut les employer : devenir maîtres et possesseurs de la nature."}, {"l": "21-33", "idee": "Le premier bien : la santé.", "args": "La santé est le fondement de tous les autres biens. Comme l’esprit dépend du corps, c’est dans la médecine qu’on peut chercher à rendre les hommes plus sages et plus habiles.", "lien": "Ce pouvoir a un but premier : la conservation de la santé, premier bien de la vie."}], "concepts": [{"c": "Philosophie spéculative", "s": "Savoir purement théorique, qui cherche à comprendre sans chercher d’application."}, {"c": "Philosophie pratique", "s": "Savoir fondé sur la connaissance des corps et destiné à servir la vie humaine."}, {"c": "Maîtres et possesseurs", "s": "Formule qui exprime l’idée de commander à la nature et de l’utiliser, comme on dispose de ce qui nous appartient. Le « comme » indique une maîtrise par la connaissance."}], "A": [{"q": "contre la loi qui nous oblige à procurer, autant qu’il est en nous, le bien général de tous les hommes", "l": "7-9", "e": 0}, {"q": "nous rendre comme maîtres et possesseurs de la nature", "l": "19-20", "e": 1}, {"q": "la conservation de la santé, laquelle est sans doute le premier bien et le fondement de tous les autres biens de cette vie", "l": "25-27", "e": 2}], "CQ": [{"q": "Une maîtrise sans mesure ?", "c": "« Comme » maîtres : Descartes pense à la santé et aux commodités de la vie. Mais à quoi doit-on fixer la limite de cette maîtrise ? (À comparer avec Heidegger ou Mill.)"}, {"q": "Un modèle fondé sur l’artisan. La nature est pensée comme un ensemble de corps que l’on peut connaître et employer. Est-ce la voir comme un simple outil ?", "c": ""}], "theme": "La nature"}, {"id": "nature-descola", "label": "Descola : la nature des Modernes", "auteur": "Descola", "oeuvre": "Par-delà nature et culture", "fiche": "nature-descola.html", "lignes": ["Pour que la nature des Modernes accède à l’existence,", "il fallait donc une deuxième opération de", "purification1, il fallait que les humains deviennent", "extérieurs et supérieurs à la nature. C’est au", "christianisme que l’on doit ce second bouleversement,", "avec sa double idée d’une transcendance de l’homme et", "d’un univers tiré du néant par la volonté divine. La", "Création porte témoignage de l’existence de Dieu, de", "sa bonté et de sa perfection, mais ses œuvres ne", "doivent pas être confondues avec Lui ni les beautés de", "la nature appréciées pour elles-mêmes : elles", "procèdent de Dieu, mais Dieu n’y est pas présent.", "L’homme étant lui aussi créé, il tire sa signification", "de cet évènement fondateur.", "Il n’a donc pas sa place dans la nature comme un", "élément parmi d’autres, il n’est pas « par nature »", "comme les plantes et les animaux, il est devenu", "transcendant au monde physique ; son essence et son", "devenir relèvent désormais de la grâce, qui est au-", "delà de la nature. De cette origine surnaturelle,", "l’homme tire le droit et la mission d’administrer la", "terre, Dieu l’ayant formé au dernier jour de la genèse", "pour qu’il exerce son contrôle sur la Création, pour", "qu’il l’organise et l’aménage selon ses besoins. De", "même qu’Adam, en recevant le pouvoir de nommer les", "animaux, fut autorisé à introduire son ordre dans la", "nature, de même ses descendants, en se multipliant sur", "la face de la terre, réalisent l’intention divine de", "porter en tout lieu la maîtrise de la Création.", "Pourtant la nature est confiée aux hommes à bail", "temporaire. Car le monde a désormais une origine et un", "terme, étrange notion que le christianisme hérite de", "la tradition juive et qui tranche avec les conceptions", "de l’Antiquité païenne, mais aussi avec la plupart des", "cosmologies que l’ethnographie et l’histoire ont", "inventoriées. La Création est une scène provisoire", "pour une pièce qui se poursuivra après que les décors", "auront disparu, lorsque la nature n’existera plus et", "que seuls demeureront les protagonistes principaux :", "Dieu et les âmes, c’est-à-dire les hommes sous un", "autre avatar."], "notion": "La nature", "q": "Comment la nature, telle que les Modernes la conçoivent, est-elle apparue ?", "opinion": "Que la nature serait une réalité évidente, que tous les peuples auraient toujours distinguée de la culture.", "enjeu": "Cette thèse n’est pas évidente : comment une idée qui paraît naturelle peut-elle avoir une origine historique, et religieuse ?", "th": "La nature des Modernes suppose que les humains soient extérieurs et supérieurs à elle. C’est le christianisme qui produit cette séparation, par l’idée d’une Création et d’un homme transcendant.", "etapes": [{"l": "1-12", "idee": "Une seconde opération de « purification » ; Une Création qui n’est pas Dieu.", "args": "Pour que la nature des Modernes existe, il faut que les humains deviennent extérieurs et supérieurs à elle. Le texte l’attribue au christianisme. Le monde est tiré du néant par la volonté divine. Il témoigne de Dieu, mais Dieu n’y est pas présent : la nature est mise à distance du divin.", "lien": "Après avoir montré que la nature des Modernes suppose une seconde opération de « purification » (le christianisme), Descola en tire que l’homme n’est plus dans la nature."}, {"l": "13-29", "idee": "L’homme n’est plus « par nature » ; De cette origine, un droit et une mission.", "args": "Créé lui aussi, l’homme tire sa signification de l’événement fondateur. Il n’est plus un élément parmi d’autres : son essence relève de la grâce, au-delà de la nature. L’homme reçoit le droit d’administrer la terre. Comme Adam nommait les animaux, ses descendants introduisent leur ordre dans la nature.", "lien": "De cette origine surnaturelle, l’homme tire le droit et la mission de dominer la nature, mais celle-ci ne lui est confiée qu’à titre provisoire."}, {"l": "30-41", "idee": "Une nature « à bail temporaire ».", "args": "Le monde a une origine et un terme. La Création est une scène provisoire, qui disparaîtra pour laisser Dieu et les âmes.", "lien": "La nature est donc « à bail temporaire » : une scène provisoire pour une pièce qui se joue entre Dieu et les âmes."}], "concepts": [{"c": "Les Modernes", "s": "Ceux qui pensent le monde selon la séparation entre nature et culture. Pour Descola, cette séparation est propre à l’Occident."}, {"c": "Transcendance", "s": "Le fait d’être au-dessus et au-delà de quelque chose. L’homme est ici supérieur au monde physique."}, {"c": "Grâce", "s": "Don divin qui ne dépend pas de la nature. L’homme y trouve son essence et son devenir."}], "A": [{"q": "il fallait que les humains deviennent extérieurs et supérieurs à la nature", "l": "3-4", "e": 0}, {"q": "il n’est pas « par nature » comme les plantes et les animaux", "l": "16-17", "e": 1}, {"q": "la nature est confiée aux hommes à bail temporaire", "l": "30-31", "e": 2}], "CQ": [{"q": "Une nature inventée ?", "c": "Si la nature des Modernes est une construction historique, d’autres peuples ne la pensent pas ainsi. La nature est-elle un fait ou une idée ?"}, {"q": "L’origine de la domination. Descola relie la maîtrise de la nature à la religion. Descartes, lui, s’appuie sur la science. Les deux explications sont-elles compatibles ? (À comparer avec la Genèse.)", "c": ""}], "theme": "La nature"}, {"id": "nature-galilee", "label": "Galilée : l’univers, un livre écrit en langue mathématique", "auteur": "Galilée", "oeuvre": "L’Essayeur", "fiche": "nature-galilee.html", "lignes": ["La philoso
