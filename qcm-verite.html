<script type="application/json" id="quizdata">[{"q":"Dans le mythe de la caverne, que prennent les prisonniers pour la réalité ?","a":["Des ombres projetées sur la paroi","Le soleil qui éclaire l’extérieur","Les idées qu’ils contemplent par la raison","Les paroles de celui qui revient les libérer"],"e":"Enchaînés, les prisonniers ne voient que des ombres. Platon précise : « Ils nous sont semblables. »"},{"q":"Que montre le retour du prisonnier libéré dans la caverne ?","a":["Celui qui dit le vrai risque d’être rejeté","Que la vérité est toujours accueillie avec joie par tous","Que les ombres étaient en fait la vraie réalité","Qu’il suffit de voir le soleil une fois pour tout savoir"],"e":"Chercher la vérité demande du courage : on peut être rejeté par ceux qui préfèrent leurs illusions."},{"q":"Pourquoi Descartes doute-t-il même des mathématiques ?","a":["Il imagine un mauvais génie trompeur","Il a découvert une erreur dans un de ses calculs","Les mathématiques reposent sur les sens","Il pense que seule l’expérience est sûre"],"e":"L’hypothèse du mauvais génie pousse le doute jusqu’aux vérités les plus évidentes."},{"q":"Quelle est la première certitude que Descartes trouve au bout du doute ?","a":["« Je pense, donc je suis »","« Le soleil se lèvera demain »","« Dieu est mort »","« Dire faux n’est mentir que par l’intention de tromper »"],"e":"Même si je me trompe sur tout, il faut que je sois pour me tromper : douter, c’est penser."},{"q":"Pour Hume, pourquoi « le soleil ne se lèvera pas demain » n’est-il pas contradictoire ?","a":["Le contraire d’un fait reste pensable","Parce que le soleil pourrait réellement s’éteindre cette nuit","Parce que nos sens nous trompent toujours","Parce que la proposition est absurde"],"e":"Les vérités de fait ne se démontrent pas comme les vérités logiques : on peut toujours concevoir leur contraire."},{"q":"D’où vient, selon Hume, notre connaissance de la cause et de l’effet ?","a":["De l’expérience de leur conjonction constante","D’un raisonnement a priori, sans aucune expérience","D’une révélation divine","De la cohérence logique des idées"],"e":"Nous voyons deux objets toujours ensemble (le feu et la chaleur) : c’est l’expérience, non la raison, qui fonde ce lien."},{"q":"Pour Pascal, comment connaît-on les premiers principes ?","a":["Par le cœur, qui les sent","Par la raison, qui les démontre","Par les sens, qui les observent","Par l’habitude, qui les répète"],"e":"Le cœur sent les premiers principes ; la raison démontre ensuite. Les deux donnent la certitude."},{"q":"Selon Rousseau, qu’est-ce qui fait d’une parole fausse un mensonge ?","a":["L’intention de tromper","Le fait que la parole soit fausse","Le dommage causé à autrui","Le fait de parler en public"],"e":"« Dire faux n’est mentir que par l’intention de tromper. » Mentir sans profit ni préjudice pour personne, c’est une fiction."},{"q":"Pour Kant, peut-on mentir à un meurtrier pour sauver un ami ?","a":["Non : dire vrai est un devoir sans exception","Oui : sauver une vie justifie toujours le mensonge","Oui, si le mensonge n’est pas découvert","Cela dépend des conséquences prévisibles"],"e":"Pour Kant, le menteur répond de toutes les conséquences de son mensonge, même imprévisibles : aucune exception n’est possible."},{"q":"Quel point commun relie Platon et Descartes ?","a":["Il faut se détourner des apparences sensibles","La vérité se trouve dans l’expérience répétée des sens","Le mensonge est parfois permis","La vérité est ce qui est utile pour agir"],"e":"Les ombres de la caverne et le doute sur les sens : chez les deux auteurs, les sens ne suffisent pas, c’est l’esprit qui conduit au vrai."},{"q":"Quel point commun relie Hume et Pascal ?","a":["Nos certitudes premières ne viennent pas d’une démonstration de la raison","La raison peut tout démontrer, même les premiers principes","Les sens ne nous trompent jamais","La vérité est un devoir moral"],"e":"Pour Hume, c’est l’expérience qui fonde nos croyances sur les faits ; pour Pascal, c’est le cœur qui sent les premiers principes."},{"q":"Sur quel point Rousseau et Kant s’opposent-ils ?","a":["Rousseau admet des exceptions ; Kant, aucune","Rousseau interdit toute fiction ; Kant autorise le mensonge par humanité","Kant définit le mensonge par l’intention ; Rousseau par les conséquences","Ils ne parlent pas du mensonge"],"e":"Pour Rousseau, la fiction n’est pas un mensonge ; pour Kant, dire la vérité est un devoir sans exception, même face à un meurtrier."},{"q":"Les prisonniers de la caverne sont certains de voir la réalité. Que montre cet exemple ?","a":["Être certain ne suffit pas pour connaître","Que la certitude est toujours une connaissance vraie","Les prisonniers ont raison de croire ce qu’ils voient","La vérité dépend de chacun"],"e":"La certitude est l’état de celui qui ne doute plus : elle peut être seulement subjective. Connaître, c’est pouvoir justifier ce que l’on tient pour vrai."},{"q":"Quel lien peut-on faire entre Hume et James ?","a":["Une croyance non démontrée peut guider l’action","La vérité ne se trouve que dans des idées éternelles","Il ne faut jamais rien croire","Toute croyance utile est forcément fausse"],"e":"Hume montre que nos croyances sur les faits ne se démontrent pas mais guident la vie ; James fait de cette réussite dans l’action la définition même du vrai."},{"q":"Peut-on atteindre la vérité ? Que permettent de répondre les fiches ?","a":["Oui, mais difficilement, et souvent par croyance","Oui, facilement : il suffit d’ouvrir les yeux sur le monde","Non : aucune vérité n’est jamais possible","Oui : ce que la majorité pense est vrai"],"e":"Platon décrit une ascension douloureuse, Descartes trouve une certitude au bout du doute, Hume montre que les faits ne donnent qu’une croyance raisonnable."}]</script>

(function(){var r=document.documentElement,K='texte-seul',KL='mode-lecture';
var btn=document.getElementById('a11y-btn'),menu=document.getElementById('a11y-menu'),opts=menu.querySelectorAll('.a11y-opt'),closed=[],shown=[],skipped=[];
function apply(m){
  var ts=m==='ts',lc=m==='lect',was=r.classList.contains('lect');
  r.classList.toggle('ts',ts);r.classList.toggle('lect',lc);
  if(lc&&!was){closed=[];shown=[];skipped=[];
    document.querySelectorAll('main details').forEach(function(d){if(!d.open){closed.push(d);d.open=true}});
    document.querySelectorAll('main [hidden]').forEach(function(x){if(!x.closest('[aria-labelledby="h-video"]')&&!x.matches('video,[role="tablist"]')){shown.push(x);x.hidden=false}});
    document.querySelectorAll('main section').forEach(function(sc){var h=sc.querySelector('h2');
      if(sc.querySelector('input,select,textarea')||(h&&/^(Exercice|Faites le tri|En vid)/i.test(h.textContent.trim()))){sc.classList.add('lc-skip');skipped.push(sc)}});}
  if(!lc&&was){closed.forEach(function(d){d.open=false});shown.forEach(function(x){x.hidden=true});skipped.forEach(function(s){s.classList.remove('lc-skip')});closed=[];shown=[];skipped=[]}
  opts.forEach(function(o){o.setAttribute('aria-checked',o.getAttribute('data-mode')===m?'true':'false')});
  try{localStorage.setItem(K,ts?'1':'0');localStorage.setItem(KL,lc?'1':'0')}catch(e){}
}
function open(on){menu.hidden=!on;btn.setAttribute('aria-expanded',on?'true':'false')}
btn.addEventListener('click',function(e){e.stopPropagation();open(menu.hidden)});
opts.forEach(function(o){o.addEventListener('click',function(){apply(o.getAttribute('data-mode'));open(false);btn.focus()})});
document.addEventListener('click',function(e){if(!menu.hidden&&!menu.contains(e.target)&&e.target!==btn)open(false)});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!menu.hidden){open(false);btn.focus()}});
var v='orig';try{if(localStorage.getItem(KL)==='1')v='lect';else if(localStorage.getItem(K)==='1'&&menu.querySelector('[data-mode="ts"]'))v='ts'}catch(e){}
if(v==='ts')apply('ts');
if(v==='lect')window.addEventListener('load',function(){apply('lect')});
})();
</script>
