e ? Marx vise surtout la société qui rend la religion nécessaire. La croyance disparaît-elle avec la misère ? (À comparer avec Nietzsche.)"]}, {"id": "religion-nietzsche", "label": "Nietzsche : la mort de Dieu", "theme": "La religion", "auteur": "Nietzsche", "oeuvre": "Ainsi parlait Zarathoustra", "fiche": "religion-nietzsche.html", "lignes": ["Hommes supérieurs, apprenez de moi ceci : sur la place", "publique personne ne croit à l’homme supérieur. Et si", "vous voulez parler sur la place publique, à votre", "guise ! Mais la populace cligne de l’œil : « Nous", "sommes tous égaux. »", "« Hommes supérieurs, – ainsi cligne de l’œil la", "populace, – il n’y a pas d’hommes supérieurs, nous", "sommes tous égaux, un homme vaut un homme, devant Dieu", "– nous sommes tous égaux ! »", "Devant Dieu ! – Mais maintenant ce Dieu est mort.", "Devant la populace, cependant, nous ne voulons pas", "être égaux. Hommes supérieurs, éloignez-vous de la", "place publique !", "Devant Dieu ! – Mais maintenant ce Dieu est mort !", "Hommes supérieurs, ce Dieu a été votre plus grand", "danger.", "Vous n’êtes ressuscites que depuis qu’il gît dans la", "tombe. C’est maintenant seulement que revient le grand", "Midi, maintenant l’homme supérieur devient – maître !", "Avez-vous compris cette parole, ô mes frères ? Vous", "êtes effrayés : votre cœur est-il pris de vertige ?", "L’abîme s’ouvre-t-il ici pour vous ? Le chien de", "l’enfer aboie-t-il contre vous ?", "Eh bien ! Allons ! Hommes supérieurs ! Maintenant", "seulement la montagne de l’avenir humain va enfanter.", "Dieu est mort : maintenant nous voulons – que le", "surhomme vive."], "mots": "Mots-clés : Mort de Dieu, Homme supérieur, Surhomme.", "lire": "<p><b>Objet du texte.</b> Quelles conséquences la mort de Dieu a-t-elle pour l’homme ? <b>Notion du programme.</b> La religion.</p><p><b>Connecteurs repérés.</b> « si… » (l.2), « mais » (l.4), « ainsi » (l.6), « cependant » (l.11). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Mort de Dieu</i> : fin de la croyance au Dieu chrétien comme fondement des valeurs, constat historique plus que simple athéisme. ; <i>Homme supérieur</i> : celui qui cherche à se dépasser et refuse le nivellement de la foule. ; <i>Surhomme</i> : figure de l’homme qui crée ses propres valeurs après la mort de Dieu.</p>", "these": "<p><b>Thèse.</b> Dieu est mort : l’égalité « devant Dieu » ne tient plus, et l’homme supérieur est libéré d’un danger. La mort de Dieu ouvre l’avenir du surhomme.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « L’homme supérieur n’est pas reconnu » ; « L’égalité devant Dieu » ; « Mais ce Dieu est mort » ; « Dieu était le plus grand danger » ; « Un vertige et une promesse ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-9", "idee": "L’homme supérieur n’est pas reconnu ; L’égalité devant Dieu.", "args": "Sur la place publique, personne ne croit à l’homme supérieur. La populace clignote : « nous sommes tous égaux ». Cette égalité est fondée sur Dieu : « un homme vaut un homme, devant Dieu ».", "lien": "Après avoir montré que la populace invoque l’égalité devant Dieu, Nietzsche rappelle que ce Dieu est mort."}, {"l": "10-19", "idee": "Mais ce Dieu est mort ; Dieu était le plus grand danger.", "args": "Devant la populace, nous ne voulons pas être égaux. Le Dieu qui garantissait l’égalité est mort. Les hommes supérieurs ne sont « ressuscités » que depuis qu’il gît dans la tombe. Vient le grand Midi.", "lien": "Si Dieu est mort, il n’est plus un danger pour l’homme supérieur : c’est lui qui le tenait enchaîné."}, {"l": "20-27", "idee": "Un vertige et une promesse.", "args": "La parole effraie : l’abîme s’ouvre. Mais maintenant la montagne de l’avenir humain va enfanter : « que le surhomme vive ».", "lien": "Cette libération est à la fois un vertige et une promesse : la montagne de l’avenir humain va enfanter."}], "concepts": [{"c": "Mort de Dieu", "s": "Fin de la croyance au Dieu chrétien comme fondement des valeurs, constat historique plus que simple athéisme."}, {"c": "Homme supérieur", "s": "Celui qui cherche à se dépasser et refuse le nivellement de la foule."}, {"c": "Surhomme", "s": "Figure de l’homme qui crée ses propres valeurs après la mort de Dieu."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que Dieu garantirait l’égalité et le sens, et que sa disparition serait une perte.</p><p><b>Le problème.</b> Quelles conséquences la mort de Dieu a-t-elle pour l’homme ?</p><p><b>L’enjeu.</b> Cette thèse est paradoxale : comment la mort de Dieu peut-elle être une libération, et pas seulement un vertige ?</p><p><b>Formule.</b> « On dit souvent que Dieu garantirait l’égalité et le sens, et que sa disparition serait une perte, mais Nietzsche soutient : Dieu est mort : l’égalité « devant Dieu » ne tient plus, et l’homme supérieur est libéré d’un danger. »</p><p><b>Discussion.</b> Un constat ou un souhait ? Nietzsche constate la mort de Dieu et appelle le surhomme. Y a-t-il de l’espoir ou de l’élitisme dans ce texte ? (À comparer avec Kant.)</p>", "intro": ["On croit souvent que la disparition de Dieu serait une perte catastrophique, car il garantirait l’égalité des hommes et le sens de la vie. Dans <i>Ainsi parlait Zarathoustra</i>, Nietzsche annonce au contraire que la mort de Dieu libère l’homme supérieur.", "Nietzsche soutient la thèse suivante : Dieu est mort : l’égalité « devant Dieu » ne tient plus, et l’homme supérieur est libéré d’un danger. La mort de Dieu ouvre l’avenir du surhomme. Cette thèse est paradoxale : comment la mort de Dieu peut-elle être une libération, et pas seulement un vertige ?", "Le texte avance en trois temps. Des lignes 1 à 9 : « L’homme supérieur n’est pas reconnu » ; « L’égalité devant Dieu ». Des lignes 10 à 19 : « Mais ce Dieu est mort » ; « Dieu était le plus grand danger ». Des lignes 20 à 27 : « Un vertige et une promesse »."], "dev": [{"l": "1-9", "obj": "L’homme supérieur n’est pas reconnu ; L’égalité devant Dieu.", "sp": ["<b>L’homme supérieur n’est pas reconnu.</b> Sur la place publique, personne ne croit à l’homme supérieur. La populace clignote : « nous sommes tous égaux ».", "<b>L’égalité devant Dieu.</b> Cette égalité est fondée sur Dieu : « un homme vaut un homme, devant Dieu »."], "tr": "Après avoir montré que la populace invoque l’égalité devant Dieu, Nietzsche rappelle que ce Dieu est mort."}, {"l": "10-19", "obj": "Mais ce Dieu est mort ; Dieu était le plus grand danger.", "sp": ["<b>Mais ce Dieu est mort.</b> Devant la populace, nous ne voulons pas être égaux. Le Dieu qui garantissait l’égalité est mort.", "<b>Dieu était le plus grand danger.</b> Les hommes supérieurs ne sont « ressuscités » que depuis qu’il gît dans la tombe. Vient le grand Midi."], "tr": "Si Dieu est mort, il n’est plus un danger pour l’homme supérieur : c’est lui qui le tenait enchaîné."}, {"l": "20-27", "obj": "Un vertige et une promesse.", "sp": ["<b>Un vertige et une promesse.</b> La parole effraie : l’abîme s’ouvre. Mais maintenant la montagne de l’avenir humain va enfanter : « que le surhomme vive »."], "tr": ""}], "concl": ["Le texte se demande : « Quelles conséquences la mort de Dieu a-t-elle pour l’homme ? » Nietzsche répond ainsi : Dieu est mort : l’égalité « devant Dieu » ne tient plus, et l’homme supérieur est libéré d’un danger. La mort de Dieu ouvre l’avenir du surhomme.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « L’homme supérieur n’est pas reconnu ; L’égalité devant Dieu » puis « Mais ce Dieu est mort ; Dieu était le plus grand danger » puis « Un vertige et une promesse ».", "On peut enfin discuter cette thèse. Un constat ou un souhait ? Nietzsche constate la mort de Dieu et appelle le surhomme. Y a-t-il de l’espoir ou de l’élitisme dans ce texte ? (À comparer avec Kant.)"]}, {"id": "technique-arendt", "label": "Arendt : animal laborans et homo faber", "theme": "La technique", "auteur": "Hannah Arendt", "oeuvre": "Condition de l'homme moderne", "fiche": "technique-arendt.html", "lignes": ["Au point de vue de l'homo faber, qui compte", "entièrement sur les outils primordiaux de ses mains,", "l'homme, comme disait Benjamin Franklin, est un", "fabricant d'outils. Les mêmes instruments qui ne font", "qu'alléger le fardeau et mécaniser le travail de", "l'animal laborans, l'homo faber les invente et les", "destine à l'édification d'un monde d'objets, et leur", "commodité, leur précision sont dictées par les buts «", "objectifs » qu'il invente à son gré, plutôt que par", "des désirs et besoins subjectifs. Outils et", "instruments sont si bien objets du monde qu'ils", "peuvent servir de critères pour classer des", "civilisations entières. Mais leur caractère d'objets", "du monde n'est jamais plus manifeste que lorsqu'on les", "emploie dans les processus du travail, où ils sont", "vraiment tout ce qui survit de tangible au travail", "comme au processus de consommation. Ainsi pour", "l'animal laborans, en tant que soumis et constamment", "occupé aux processus dévorants de la vie, la", "durabilité, la stabilité du monde sont représentées", "avant tout par les outils et instruments dont il se", "sert, et dans une société de travailleurs, les outils", "risquent fort d'acquérir des caractères ou des", "fonctions qui dépassent la simple instrumentalité. On", "déplore souvent la perversion des fins et des moyens", "dans la société moderne, où les hommes deviennent les", "esclaves des machines qu'ils ont inventées et «", "s'adaptent » aux exigences de ces machines au lieu de", "les mettre au service des besoins humains : c'est se", "plaindre de la situation de fait de l'activité de", "travail. Dans cette situation, où la production", "consiste avant tout en une préparation à la", "consommation, la distinction même de la fin et des", "moyens, si nettement caractéristique des activités de", "l'homo faber, n'a tout simplement aucun sens ; et les", "instruments que l'homo faber a inventés et avec", "lesquels il vient en aide au travail de l'animal", "laborans perdent ainsi leur caractère instrumental dès", "que ce dernier les emploie. Au sein du processus", "vital, dont l'activité de travail fait intégralement", "partie et qu'elle ne transcende jamais, il est vain de", "soulever les questions qui supposent la catégorie de", "la fin et des moyens, comme de savoir si les hommes", "vivent et consomment afin d'avoir la force de", "travailler, ou s'ils travaillent afin d'avoir les", "moyens de consommer."], "mots": "Mots-clés : Homo faber, Animal laborans, Instrumentalité.", "lire": "<p><b>Objet du texte.</b> Pourquoi, dans la société moderne, les hommes paraissent-ils devenir « esclaves des machines » ? La faute en revient-elle aux outils ? <b>Notion du programme.</b> La technique.</p><p><b>Connecteurs repérés.</b> « si… » (l.11), « mais » (l.13), « ainsi » (l.17). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Homo faber</i> : l’homme qui fabrique : il produit des objets durables, qui composent un monde stable, en choisissant des fins et en employant des moyens. ; <i>Animal laborans</i> : l’homme en tant que travailleur soumis aux besoins de la vie : il produit pour consommer, dans un cycle qui recommence sans cesse. ; <i>Instrumentalité</i> : le fait d’être un moyen au service d’une fin. L’outil est instrumental tant qu’il sert un but extérieur à lui.</p>", "these": "<p><b>Thèse.</b> Ce n’est pas l’outil qui pervertit les fins et les moyens, mais la situation de l’animal laborans, enfermé dans le cycle de la vie : produire pour consommer, consommer pour pouvoir produire.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « L’homo faber fabrique des outils » ; « Les mêmes outils servent l’animal laborans » ; « Dans une société de travailleurs, les outils changent de statut » ; « La plainte habituelle » ; « Le diagnostic d’Arendt » ; « Une question sans réponse ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-12", "idee": "L’homo faber fabrique des outils.", "args": "Il invente les outils pour édifier « un monde d’objets ». Leur commodité et leur précision sont dictées par des buts objectifs, non par des désirs ou des besoins subjectifs.", "lien": "Ces outils inventés par l’homo faber passent entre les mains de l’animal laborans, où leur statut change."}, {"l": "13-24", "idee": "Les mêmes outils servent l’animal laborans ; Dans une société de travailleurs, les outils changent de statut.", "args": "L’animal laborans les utilise pour alléger le fardeau et mécaniser son travail. Pour lui, soumis aux processus « dévorants » de la vie, les outils représentent la durabilité du monde. Ils risquent d’acquérir des fonctions qui dépassent la simple instrumentalité : de moyens, ils tendent à devenir des fins.", "lien": "Ce changement permet de comprendre la plainte habituelle contre les machines, et de la déplacer."}, {"l": "25-46", "idee": "La plainte habituelle ; Le diagnostic d’Arendt ; Une question sans réponse.", "args": "On déplore la perversion des fins et des moyens : les hommes s’adaptent aux exigences des machines au lieu de les mettre au service de leurs besoins. Se plaindre ainsi, c’est se plaindre de la situation de fait de l’activité de travail. Dans le processus vital, produire, c’est se préparer à consommer : la distinction entre fin et moyens n’a plus de sens. Vit-on et consomme-t-on pour avoir la force de travailler, ou travaille-t-on pour pouvoir consommer ? Dans le cycle de la vie, la question est « vaine » : il n’y a pas de fin extérieure au cycle.", "lien": "Cette dernière étape donne la thèse : le problème tient au cycle du travail, non à l’outil."}], "concepts": [{"c": "Homo faber", "s": "L’homme qui fabrique : il produit des objets durables, qui composent un monde stable, en choisissant des fins et en employant des moyens."}, {"c": "Animal laborans", "s": "L’homme en tant que travailleur soumis aux besoins de la vie : il produit pour consommer, dans un cycle qui recommence sans cesse."}, {"c": "Instrumentalité", "s": "Le fait d’être un moyen au service d’une fin. L’outil est instrumental tant qu’il sert un but extérieur à lui."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que les hommes seraient devenus les esclaves des machines par la faute des outils.</p><p><b>Le problème.</b> Pourquoi, dans la société moderne, les hommes paraissent-ils devenir « esclaves des machines » ? La faute en revient-elle aux outils ?</p><p><b>L’enjeu.</b> Cette thèse n’est pas évidente : si ce n’est pas l’outil qui est en cause, pourquoi les fins et les moyens semblent-ils se confondre ?</p><p><b>Formule.</b> « On dit souvent que les hommes seraient devenus les esclaves des machines par la faute des outils, mais Hannah Arendt soutient : Ce n’est pas l’outil qui pervertit les fins et les moyens, mais la situation de l’animal laborans, enfermé dans le cycle de la vie : produire pour consommer, consommer pour pouvoir produire. »</p><p><b>Discussion.</b> Une défense de la technique ? Arendt n’accuse pas l’outil : elle replace le problème dans le mode de vie. Cela rejoint-il l’idée que la technique est « neutre » et que tout dépend de l’usage ?</p>", "intro": ["On déplore souvent que les hommes soient devenus les esclaves des machines qu’ils ont inventées. Dans <i>Condition de l’homme moderne</i>, Arendt se demande si la faute revient vraiment aux outils.", "Hannah Arendt soutient la thèse suivante : Ce n’est pas l’outil qui pervertit les fins et les moyens, mais la situation de l’animal laborans, enfermé dans le cycle de la vie : produire pour consommer, consommer pour pouvoir produire. Cette thèse n’est pas évidente : si ce n’est pas l’outil qui est en cause, pourquoi les fins et les moyens semblent-ils se confondre ?", "Le texte avance en trois temps. Des lignes 1 à 12 : « L’homo faber fabrique des outils ». Des lignes 13 à 24 : « Les mêmes outils servent l’animal laborans » ; « Dans une société de travailleurs, les outils changent de statut ». Des lignes 25 à 46 : « La plainte habituelle » ; « Le diagnostic d’Arendt » ; « Une question sans réponse »."], "dev": [{"l": "1-12", "obj": "L’homo faber fabrique des outils.", "sp": ["<b>L’homo faber fabrique des outils.</b> Il invente les outils pour édifier « un monde d’objets ». Leur commodité et leur précision sont dictées par des buts objectifs, non par des désirs ou des besoins subjectifs."], "tr": "Ces outils inventés par l’homo faber passent entre les mains de l’animal laborans, où leur statut change."}, {"l": "13-24", "obj": "Les mêmes outils servent l’animal laborans ; Dans une société de travailleurs, les outils changent de statut.", "sp": ["<b>Les mêmes outils servent l’animal laborans.</b> L’animal laborans les utilise pour alléger le fardeau et mécaniser son travail. Pour lui, soumis aux processus « dévorants » de la vie, les outils représentent la durabilité du monde.", "<b>Dans une société de travailleurs, les outils changent de statut.</b> Ils risquent d’acquérir des fonctions qui dépassent la simple instrumentalité : de moyens, ils tendent à devenir des fins."], "tr": "Ce changement permet de comprendre la plainte habituelle contre les machines, et de la déplacer."}, {"l": "25-46", "obj": "La plainte habituelle ; Le diagnostic d’Arendt ; Une question sans réponse.", "sp": ["<b>La plainte habituelle.</b> On déplore la perversion des fins et des moyens : les hommes s’adaptent aux exigences des machines au lieu de les mettre au service de leurs besoins.", "<b>Le diagnostic d’Arendt.</b> Se plaindre ainsi, c’est se plaindre de la situation de fait de l’activité de travail. Dans le processus vital, produire, c’est se préparer à consommer : la distinction entre fin et moyens n’a plus de sens.", "<b>Une question sans réponse.</b> Vit-on et consomme-t-on pour avoir la force de travailler, ou travaille-t-on pour pouvoir consommer ? Dans le cycle de la vie, la question est « vaine » : il n’y a pas de fin extérieure au cycle."], "tr": ""}], "concl": ["Le texte se demande : « Pourquoi, dans la société moderne, les hommes paraissent-ils devenir « esclaves des machines » ? La faute en revient-elle aux outils ? » Hannah Arendt répond ainsi : Ce n’est pas l’outil qui pervertit les fins et les moyens, mais la situation de l’animal laborans, enfermé dans le cycle de la vie : produire pour consommer, consommer pour pouvoir produire.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « L’homo faber fabrique des outils » puis « Les mêmes outils servent l’animal laborans ; Dans une société de travailleurs, les outils changent de statut » puis « La plainte habituelle ; Le diagnostic d’Arendt ; Une question sans réponse ».", "On peut enfin discuter cette thèse. Une défense de la technique ? Arendt n’accuse pas l’outil : elle replace le problème dans le mode de vie. Cela rejoint-il l’idée que la technique est « neutre » et que tout dépend de l’usage ?"]}, {"id": "technique-bacon", "label": "Bacon : vaincre la nature en lui obéissant", "theme": "La technique", "auteur": "Bacon", "oeuvre": "Novum organum", "fiche": "technique-bacon.html", "lignes": ["L’homme, interprète et ministre de la nature, n’étend", "ses connaissances et son action qu’à mesure qu’il", "découvre l’ordre naturel des choses, soit par", "l’observation, soit par la réflexion ; il ne sait et", "ne peut rien de plus.", "La main seule et l’entendement abandonné à lui-même", "n’ont qu’un pouvoir très limité ; ce sont les", "instruments et les autres genres de secours qui font", "presque tout, secours et instruments non moins", "nécessaires à l’esprit qu’à la main ; et de même que", "les instruments de la main excitent ou règlent son", "mouvement, les instruments de l’esprit l’aident à", "saisir la vérité ou à éviter l’erreur.", "La science et la puissance humaine se correspondent", "dans tous les points et vont au même but ; c’est", "l’ignorance où nous sommes de la cause qui nous prive", "de l’effet ; car on ne peut vaincre la nature qu’en", "lui obéissant et ce qui était principe, effet ou cause", "dans la théorie, devient règle, but ou moyen dans la", "pratique."], "mots": "Mots-clés : Ministre et interprète de la nature, Instrument, Cause et effet.", "lire": "<p><b>Objet du texte.</b> Qu’est-ce qui donne à l’homme son pouvoir sur la nature, et quel rapport a-t-il avec elle ? <b>Notion du programme.</b> La technique.</p><p><b>Connecteurs repérés.</b> « car » (l.17). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Ministre et interprète de la nature</i> : le ministre est un serviteur, l’interprète est celui qui lit et traduit. L’homme ne commande pas à la nature : il la lit et la sert pour agir. ; <i>Instrument</i> : ce qui prolonge ou règle l’action de la main (outil) ou de l’esprit (méthode, expérience, raisonnement bien conduit). ; <i>Cause et effet</i> : la cause explique l’effet. Connaître la cause permet de la reproduire, donc de produire l’effet voulu : c’est le cœur de la technique fondée sur la science.</p>", "these": "<p><b>Thèse.</b> Le pouvoir de l’homme est borné par sa connaissance de l’ordre naturel. Savoir les causes, c’est pouvoir produire les effets : la science est la source de la technique.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « L’homme est « ministre et interprète de la nature » » ; « La main nue et l’esprit seul sont faibles » ; « Des instruments pour la main, des instruments pour l’esprit » ; « Science et puissance coïncident » ; « Obéir pour vaincre ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-5", "idee": "L’homme est « ministre et interprète de la nature ».", "args": "Il n’étend son savoir et son action qu’à mesure qu’il découvre l’ordre naturel des choses, par l’observation ou par la réflexion. Hors de là, « il ne sait et ne peut rien de plus ».", "lien": "Si le pouvoir dépend du savoir, il faut dire par quoi l’homme l’exerce : les instruments."}, {"l": "5-13", "idee": "La main nue et l’esprit seul sont faibles ; Des instruments pour la main, des instruments pour l’esprit.", "args": "La main seule et l’entendement « abandonné à lui-même » ont un pouvoir très limité. Ce sont les instruments et les secours de toute sorte qui font presque tout. Les instruments de la main excitent ou règlent son mouvement ; ceux de l’esprit l’aident à saisir la vérité ou à éviter l’erreur. La technique est donc aussi une affaire de méthode.", "lien": "Les instruments aident la main et l’esprit : on peut alors énoncer le lien entre savoir et pouvoir."}, {"l": "14-20", "idee": "Science et puissance coïncident ; Obéir pour vaincre.", "args": "Ignorer la cause nous prive de l’effet. Connaître la cause, c’est ce qui nous rend capables de produire l’effet. Ce qui était principe, effet ou cause dans la théorie devient règle, but ou moyen dans la pratique : la maîtrise passe par le respect des lois naturelles.", "lien": "Cette dernière étape donne la thèse : science et puissance coïncident, et l’on ne vainc la nature qu’en lui obéissant."}], "concepts": [{"c": "Ministre et interprète de la nature", "s": "Le ministre est un serviteur, l’interprète est celui qui lit et traduit. L’homme ne commande pas à la nature : il la lit et la sert pour agir."}, {"c": "Instrument", "s": "Ce qui prolonge ou règle l’action de la main (outil) ou de l’esprit (méthode, expérience, raisonnement bien conduit)."}, {"c": "Cause et effet", "s": "La cause explique l’effet. Connaître la cause permet de la reproduire, donc de produire l’effet voulu : c’est le cœur de la technique fondée sur la science."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que l’homme pourrait dominer la nature par sa seule volonté, sans la connaître.</p><p><b>Le problème.</b> Qu’est-ce qui donne à l’homme son pouvoir sur la nature, et quel rapport a-t-il avec elle ?</p><p><b>L’enjeu.</b> Cette thèse n’est pas évidente : comment peut-on vaincre la nature en lui obéissant ?</p><p><b>Formule.</b> « On dit souvent que l’homme pourrait dominer la nature par sa seule volonté, sans la connaître, mais Bacon soutient : Le pouvoir de l’homme est borné par sa connaissance de l’ordre naturel. »</p><p><b>Discussion.</b> Une maîtrise sans limite ? Si le pouvoir croît avec le savoir, rien ne l’arrête. Faut-il en conclure que tout ce que la science permet est souhaitable ? (À comparer avec Heidegger et Lévinas.)</p>", "intro": ["On pense volontiers que maîtriser la nature, c’est la plier à sa volonté. Dans le <i>Novum organum</i>, Bacon montre que le pouvoir de l’homme dépend de sa connaissance de la nature.", "Bacon soutient la thèse suivante : Le pouvoir de l’homme est borné par sa connaissance de l’ordre naturel. Savoir les causes, c’est pouvoir produire les effets : la science est la source de la technique. Cette thèse n’est pas évidente : comment peut-on vaincre la nature en lui obéissant ?", "Le texte avance en trois temps. Des lignes 1 à 5 : « L’homme est « ministre et interprète de la nature » ». Des lignes 5 à 13 : « La main nue et l’esprit seul sont faibles » ; « Des instruments pour la main, des instruments pour l’esprit ». Des lignes 14 à 20 : « Science et puissance coïncident » ; « Obéir pour vaincre »."], "dev": [{"l": "1-5", "obj": "L’homme est « ministre et interprète de la nature ».", "sp": ["<b>L’homme est « ministre et interprète de la nature ».</b> Il n’étend son savoir et son action qu’à mesure qu’il découvre l’ordre naturel des choses, par l’observation ou par la réflexion. Hors de là, « il ne sait et ne peut rien de plus »."], "tr": "Si le pouvoir dépend du savoir, il faut dire par quoi l’homme l’exerce : les instruments."}, {"l": "5-13", "obj": "La main nue et l’esprit seul sont faibles ; Des instruments pour la main, des instruments pour l’esprit.", "sp": ["<b>La main nue et l’esprit seul sont faibles.</b> La main seule et l’entendement « abandonné à lui-même » ont un pouvoir très limité. Ce sont les instruments et les secours de toute sorte qui font presque tout.", "<b>Des instruments pour la main, des instruments pour l’esprit.</b> Les instruments de la main excitent ou règlent son mouvement ; ceux de l’esprit l’aident à saisir la vérité ou à éviter l’erreur. La technique est donc aussi une affaire de méthode."], "tr": "Les instruments aident la main et l’esprit : on peut alors énoncer le lien entre savoir et pouvoir."}, {"l": "14-20", "obj": "Science et puissance coïncident ; Obéir pour vaincre.", "sp": ["<b>Science et puissance coïncident.</b> Ignorer la cause nous prive de l’effet. Connaître la cause, c’est ce qui nous rend capables de produire l’effet.", "<b>Obéir pour vaincre.</b> Ce qui était principe, effet ou cause dans la théorie devient règle, but ou moyen dans la pratique : la maîtrise passe par le respect des lois naturelles."], "tr": ""}], "concl": ["Le texte se demande : « Qu’est-ce qui donne à l’homme son pouvoir sur la nature, et quel rapport a-t-il avec elle ? » Bacon répond ainsi : Le pouvoir de l’homme est borné par sa connaissance de l’ordre naturel. Savoir les causes, c’est pouvoir produire les effets : la science est la source de la technique.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « L’homme est « ministre et interprète de la nature » » puis « La main nue et l’esprit seul sont faibles ; Des instruments pour la main, des instruments pour l’esprit » puis « Science et puissance coïncident ; Obéir pour vaincre ».", "On peut enfin discuter cette thèse. Une maîtrise sans limite ? Si le pouvoir croît avec le savoir, rien ne l’arrête. Faut-il en conclure que tout ce que la science permet est souhaitable ? (À comparer avec Heidegger et Lévinas.)"]}, {"id": "technique-heidegger", "label": "Heidegger : le Rhin, de fleuve à ressource", "theme": "La technique", "auteur": "Heidegger", "oeuvre": "« La question de la technique », Essais et conférences", "fiche": "technique-heidegger.html", "lignes": ["La centrale électrique est mise en place dans le Rhin.", "Elle le somme de livrer sa pression hydraulique, qui", "somme à son tour les turbines de tourner. Ce mouvement", "fait tourner la machine dont le mécanisme produit le", "courant électrique, pour lequel la centrale régionale", "et son réseau sont commis aux fins de transmission.", "Dans le domaine de ces conséquences s’enchaînant l’une", "à l’autre à partir de la mise en place de l’énergie", "électrique, le fleuve du Rhin apparaît, lui aussi,", "comme quelque chose de commis. La centrale n’est pas", "construite dans le courant du Rhin comme le vieux pont", "de bois qui depuis des siècles unit une rive à", "l’autre. C’est bien plutôt le fleuve qui est muré dans", "la centrale. Ce qu’il est aujourd’hui comme fleuve, à", "savoir fournisseur de pression hydraulique, il l’est", "par l’essence de la centrale. Afin de voir et de", "mesurer, ne fût-ce que de loin, l’élément monstrueux", "qui domine ici, arrêtons-nous un instant sur", "l’opposition qui apparaît entre les deux intitulés : «", "Le Rhin », muré dans l’usine d’énergie, et « Le Rhin", "», tiré de cette œuvre d’art qu’est un hymne de", "Hölderlin. Mais le Rhin, répondra-t-on, demeure de", "toute façon le fleuve du paysage. Soit, mais comment", "le demeure-t-il ? Pas autrement que comme un objet", "pour lequel on passe une commande, l’objet d’une", "visite organisée par une agence de voyage, laquelle a", "constitué là-bas une industrie de vacances."], "mots": "Mots-clés : Commis, mise en demeure, Arraisonnement, Technique ancienne et moderne.", "lire": "<p><b>Objet du texte.</b> Que change la technique moderne dans notre rapport à la nature ? Est-elle seulement un ensemble d’outils neutres ? <b>Notion du programme.</b> La technique.</p><p><b>Connecteurs repérés.</b> « mais » (l.22). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Commis, mise en demeure</i> : le fleuve est « sommé » de livrer de l’énergie. Il est mis à disposition et dépend d’une commande, comme un produit qu’on exige. ; <i>Arraisonnement</i> : notion que Heidegger développe dans le même essai (hors de cet extrait) : la technique moderne place le réel devant l’homme comme un stock à exploiter. L’extrait en offre l’illustration. ; <i>Technique ancienne et moderne</i> : le pont de bois s’accorde au fleuve ; la centrale le soumet à sa logique. La différence tient moins aux outils qu’au rapport à la nature.</p>", "these": "<p><b>Thèse.</b> La technique moderne n’est pas qu’un moyen : elle est une manière de considérer le réel, qui réduit la nature à un stock d’énergie disponible, « commis » à la production.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « La centrale « met en place » le Rhin » ; « Le fleuve devient un élément de la chaîne » ; « Le vieux pont et la centrale » ; « Deux « Rhin » opposés » ; « Même le paysage est commandé ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-10", "idee": "La centrale « met en place » le Rhin ; Le fleuve devient un élément de la chaîne.", "args": "Elle le somme de livrer sa pression hydraulique, qui fait tourner les turbines, puis la machine, puis le courant électrique, transmis par un réseau. Tout s’enchaîne. Le Rhin lui-même apparaît comme « quelque chose de commis ». Il n’existe plus que pour fournir de l’énergie.", "lien": "Après avoir montré le fleuve devenu élément d’une chaîne, Heidegger l’oppose à un ancien ouvrage : le pont de bois."}, {"l": "10-16", "idee": "Le vieux pont et la centrale.", "args": "Le vieux pont de bois unit les rives en respectant le fleuve ; il est « construit dans » le Rhin. La centrale, elle, ne s’y insère pas : c’est le fleuve qui est « muré » en elle.", "lien": "La différence entre pont et centrale conduit à opposer deux manières de parler du Rhin."}, {"l": "17-27", "idee": "Deux « Rhin » opposés ; Même le paysage est commandé.", "args": "Le Rhin de la centrale n’est pas celui de l’hymne de Hölderlin, œuvre d’art. L’un est une ressource, l’autre un fleuve vivant, chanté. On objectera que le Rhin reste le fleuve du paysage. Soit, répond Heidegger, mais comme objet d’une visite organisée par une agence de voyage, au sein d’une « industrie de vacances ».", "lien": "Cette dernière étape donne la thèse : la technique moderne réduit la nature à une ressource commandée."}], "concepts": [{"c": "Commis, mise en demeure", "s": "Le fleuve est « sommé » de livrer de l’énergie. Il est mis à disposition et dépend d’une commande, comme un produit qu’on exige."}, {"c": "Arraisonnement", "s": "Notion que Heidegger développe dans le même essai (hors de cet extrait) : la technique moderne place le réel devant l’homme comme un stock à exploiter. L’extrait en offre l’illustration."}, {"c": "Technique ancienne et moderne", "s": "Le pont de bois s’accorde au fleuve ; la centrale le soumet à sa logique. La différence tient moins aux outils qu’au rapport à la nature."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que la technique ne serait qu’un ensemble d’outils neutres, au service de l’homme.</p><p><b>Le problème.</b> Que change la technique moderne dans notre rapport à la nature ? Est-elle seulement un ensemble d’outils neutres ?</p><p><b>L’enjeu.</b> Cette thèse n’est pas évidente : comment la technique peut-elle être autre chose qu’un ensemble d’outils ?</p><p><b>Formule.</b> « On dit souvent que la technique ne serait qu’un ensemble d’outils neutres, au service de l’homme, mais Heidegger soutient : La technique moderne n’est pas qu’un moyen : elle est une manière de considérer le réel, qui réduit la nature à un stock d’énergie disponible, « commis » à la production. »</p><p><b>Discussion.</b> Nostalgie ? Heidegger oppose un ancien rapport à la nature à la technique moderne. N’idéalise-t-il pas le passé ? Lévinas lui reproche en substance d’être attaché à l’enracinement.</p>", "intro": ["On croit souvent que la technique est un simple moyen, neutre. Dans <i>La question de la technique</i>, Heidegger prend l’exemple d’une centrale installée sur le Rhin pour montrer qu’elle change notre rapport à la nature.", "Heidegger soutient la thèse suivante : La technique moderne n’est pas qu’un moyen : elle est une manière de considérer le réel, qui réduit la nature à un stock d’énergie disponible, « commis » à la production. Cette thèse n’est pas évidente : comment la technique peut-elle être autre chose qu’un ensemble d’outils ?", "Le texte avance en trois temps. Des lignes 1 à 10 : « La centrale « met en place » le Rhin » ; « Le fleuve devient un élément de la chaîne ». Des lignes 10 à 16 : « Le vieux pont et la centrale ». Des lignes 17 à 27 : « Deux « Rhin » opposés » ; « Même le paysage est commandé »."], "dev": [{"l": "1-10", "obj": "La centrale « met en place » le Rhin ; Le fleuve devient un élément de la chaîne.", "sp": ["<b>La centrale « met en place » le Rhin.</b> Elle le somme de livrer sa pression hydraulique, qui fait tourner les turbines, puis la machine, puis le courant électrique, transmis par un réseau. Tout s’enchaîne.", "<b>Le fleuve devient un élément de la chaîne.</b> Le Rhin lui-même apparaît comme « quelque chose de commis ». Il n’existe plus que pour fournir de l’énergie."], "tr": "Après avoir montré le fleuve devenu élément d’une chaîne, Heidegger l’oppose à un ancien ouvrage : le pont de bois."}, {"l": "10-16", "obj": "Le vieux pont et la centrale.", "sp": ["<b>Le vieux pont et la centrale.</b> Le vieux pont de bois unit les rives en respectant le fleuve ; il est « construit dans » le Rhin. La centrale, elle, ne s’y insère pas : c’est le fleuve qui est « muré » en elle."], "tr": "La différence entre pont et centrale conduit à opposer deux manières de parler du Rhin."}, {"l": "17-27", "obj": "Deux « Rhin » opposés ; Même le paysage est commandé.", "sp": ["<b>Deux « Rhin » opposés.</b> Le Rhin de la centrale n’est pas celui de l’hymne de Hölderlin, œuvre d’art. L’un est une ressource, l’autre un fleuve vivant, chanté.", "<b>Même le paysage est commandé.</b> On objectera que le Rhin reste le fleuve du paysage. Soit, répond Heidegger, mais comme objet d’une visite organisée par une agence de voyage, au sein d’une « industrie de vacances »."], "tr": ""}], "concl": ["Le texte se demande : « Que change la technique moderne dans notre rapport à la nature ? Est-elle seulement un ensemble d’outils neutres ? » Heidegger répond ainsi : La technique moderne n’est pas qu’un moyen : elle est une manière de considérer le réel, qui réduit la nature à un stock d’énergie disponible, « commis » à la production.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « La centrale « met en place » le Rhin ; Le fleuve devient un élément de la chaîne » puis « Le vieux pont et la centrale » puis « Deux « Rhin » opposés ; Même le paysage est commandé ».", "On peut enfin discuter cette thèse. Nostalgie ? Heidegger oppose un ancien rapport à la nature à la technique moderne. N’idéalise-t-il pas le passé ? Lévinas lui reproche en substance d’être attaché à l’enracinement."]}, {"id": "technique-levinas", "label": "Lévinas : défendre l’homme contre la technique ?", "theme": "La technique", "auteur": "Lévinas", "oeuvre": "Difficile liberté", "fiche": "technique-levinas.html", "lignes": ["Il serait urgent de défendre l'homme contre la", "technologie de notre siècle. L'homme y aurait perdu", "son identité pour entrer comme un rouage dans une", "immense machinerie où tournent choses et êtres.", "Désormais, exister équivaudrait à exploiter la nature", "; mais dans le tourbillon de cette entreprise qui se", "dévore elle-même, ne se maintiendrait aucun point", "fixe. Le promeneur solitaire qui flâne à la campagne", "avec la certitude de s'appartenir ne serait, en fait,", "que le client d'une industrie hôtelière et touristique", "livré, à son insu, aux calculs, aux statistiques, aux", "planifications. Personne n'existerait pour soi. Il y a", "du vrai dans cette déclamation. La technique est", "dangereuse. Elle ne menace pas seulement l'identité", "des personnes. Elle risque de faire éclater la", "planète. Mais les ennemis de la société industrielle", "sont la plupart du temps des réactionnaires. Ils", "oublient ou détestent les grands espoirs de notre", "époque. Car jamais la foi en la libération de l'homme", "n'était plus forte dans les âmes. Elle ne tient pas", "aux facilités que les machines et les sources", "nouvelles d'énergie offrent à l'enfantin instinct de", "la vitesse ; elle ne tient pas aux beaux jouets", "mécaniques qui tentent la puérilité éternelle des", "adultes. Elle ne fait qu'un avec l'ébranlement des", "civilisations sédentaires, avec l'effritement des", "lourdes épaisseurs du passé, avec le palissement des", "couleurs locales, avec les fissures qui lézardent", "toujours ces choses encombrantes et obtuses auxquelles", "s'adossent les particularismes humains. Il faut être", "sous-développé pour les revendiquer comme raisons", "d'être et lutter en leur nom pour une place dans le", "monde moderne. Le développement de la technique n'est", "pas la cause - il est déjà l'effet de cet allègement", "de la substance humaine, se vidant de ses nocturnes", "pesanteurs."], "mots": "Mots-clés : Réactionnaire, Civilisations sédentaires, Allègement de la substance humaine.", "lire": "<p><b>Objet du texte.</b> La technique menace-t-elle l’identité de l’homme ? Faut-il s’y opposer au nom d’un monde plus authentique ? <b>Notion du programme.</b> La technique.</p><p><b>Connecteurs repérés.</b> « mais » (l.6), « car » (l.19). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Réactionnaire</i> : qui s’oppose au changement au nom d’un passé idéalisé. Lévinas range ici dans cette catégorie bien des critiques de la technique. ; <i>Civilisations sédentaires</i> : les cultures liées à un sol, à des racines, à des couleurs locales. Lévinas y voit des « pesanteurs » dont la technique libère. ; <i>Allègement de la substance humaine</i> : l’homme s’allège de ce qui le fixait : lieux, traditions, particularismes. La technique prolonge ce mouvement plus qu’elle ne le provoque.</p>", "these": "<p><b>Thèse.</b> La technique est réellement dangereuse, mais la dénoncer au nom des racines et des particularismes oublie ce qu’elle apporte : une libération de l’homme, allégé des « pesanteurs » du passé.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « Le discours qu’il rapporte » ; « Une part de vérité » ; « Mais un procès suspect » ; « La foi en la libération de l’homme » ; « La technique, effet plus que cause ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-12", "idee": "Le discours qu’il rapporte.", "args": "Il serait urgent de défendre l’homme contre la technologie : il y perdrait son identité, devenu rouage d’une machinerie. Même le promeneur serait « client d’une industrie hôtelière et touristique ».", "lien": "Après avoir rapporté le discours critique, Lévinas y reconnaît une part de vérité, puis le met en cause."}, {"l": "12-19", "idee": "Une part de vérité ; Mais un procès suspect.", "args": "« Il y a du vrai dans cette déclamation » : la technique est dangereuse. Elle menace l’identité des personnes et peut « faire éclater la planète ». Les ennemis de la société industrielle sont, dit-il, la plupart du temps des « réactionnaires » : ils oublient ou détestent les grands espoirs de l’époque.", "lien": "Il faut maintenant dire d’où vient la foi en la libération de l’homme que ces critiques oublient."}, {"l": "20-36", "idee": "La foi en la libération de l’homme ; La technique, effet plus que cause.", "args": "Elle ne tient ni aux facilités des machines, ni aux « jouets mécaniques ». Elle va avec l’ébranlement des civilisations sédentaires et l’effritement des « lourdes épaisseurs du passé ». Le développement de la technique n’est pas la cause mais l’effet de cet « allègement de la substance humaine ». Revendiquer les particularismes, c’est être « sous-développé ».", "lien": "Cette dernière étape donne la thèse : la technique prolonge un allègement de l’homme qu’elle n’a pas créé."}], "concepts": [{"c": "Réactionnaire", "s": "Qui s’oppose au changement au nom d’un passé idéalisé. Lévinas range ici dans cette catégorie bien des critiques de la technique."}, {"c": "Civilisations sédentaires", "s": "Les cultures liées à un sol, à des racines, à des couleurs locales. Lévinas y voit des « pesanteurs » dont la technique libère."}, {"c": "Allègement de la substance humaine", "s": "L’homme s’allège de ce qui le fixait : lieux, traditions, particularismes. La technique prolonge ce mouvement plus qu’elle ne le provoque."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que la technique menacerait l’identité de l’homme et qu’il faudrait s’y opposer au nom d’un monde plus authentique.</p><p><b>Le problème.</b> La technique menace-t-elle l’identité de l’homme ? Faut-il s’y opposer au nom d’un monde plus authentique ?</p><p><b>L’enjeu.</b> Cette thèse n’est pas évidente : comment la technique peut-elle être à la fois dangereuse et libératrice ?</p><p><b>Formule.</b> « On dit souvent que la technique menacerait l’identité de l’homme et qu’il faudrait s’y opposer au nom d’un monde plus authentique, mais Lévinas soutient : La technique est réellement dangereuse, mais la dénoncer au nom des racines et des particularismes oublie ce qu’elle apporte : une libération de l’homme, allégé des « pesanteurs » du passé. »</p><p><b>Discussion.</b> Une position ambiguë. Lévinas reconnaît le danger de la technique tout en rejetant ses critiques. Peut-on tenir ensemble les deux ?</p>", "intro": ["On dénonce souvent la technique comme une menace pour l’identité de l’homme. Dans <i>Difficile liberté</i>, Lévinas reconnaît une part de vérité à cette critique, mais la juge suspecte.", "Lévinas soutient la thèse suivante : La technique est réellement dangereuse, mais la dénoncer au nom des racines et des particularismes oublie ce qu’elle apporte : une libération de l’homme, allégé des « pesanteurs » du passé. Cette thèse n’est pas évidente : comment la technique peut-elle être à la fois dangereuse et libératrice ?", "Le texte avance en trois temps. Des lignes 1 à 12 : « Le discours qu’il rapporte ». Des lignes 12 à 19 : « Une part de vérité » ; « Mais un procès suspect ». Des lignes 20 à 36 : « La foi en la libération de l’homme » ; « La technique, effet plus que cause »."], "dev": [{"l": "1-12", "obj": "Le discours qu’il rapporte.", "sp": ["<b>Le discours qu’il rapporte.</b> Il serait urgent de défendre l’homme contre la technologie : il y perdrait son identité, devenu rouage d’une machinerie. Même le promeneur serait « client d’une industrie hôtelière et touristique »."], "tr": "Après avoir rapporté le discours critique, Lévinas y reconnaît une part de vérité, puis le met en cause."}, {"l": "12-19", "obj": "Une part de vérité ; Mais un procès suspect.", "sp": ["<b>Une part de vérité.</b> « Il y a du vrai dans cette déclamation » : la technique est dangereuse. Elle menace l’identité des personnes et peut « faire éclater la planète ».", "<b>Mais un procès suspect.</b> Les ennemis de la société industrielle sont, dit-il, la plupart du temps des « réactionnaires » : ils oublient ou détestent les grands espoirs de l’époque."], "tr": "Il faut maintenant dire d’où vient la foi en la libération de l’homme que ces critiques oublient."}, {"l": "20-36", "obj": "La foi en la libération de l’homme ; La technique, effet plus que cause.", "sp": ["<b>La foi en la libération de l’homme.</b> Elle ne tient ni aux facilités des machines, ni aux « jouets mécaniques ». Elle va avec l’ébranlement des civilisations sédentaires et l’effritement des « lourdes épaisseurs du passé ».", "<b>La technique, effet plus que cause.</b> Le développement de la technique n’est pas la cause mais l’effet de cet « allègement de la substance humaine ». Revendiquer les particularismes, c’est être « sous-développé »."], "tr": ""}], "concl": ["Le texte se demande : « La technique menace-t-elle l’identité de l’homme ? Faut-il s’y opposer au nom d’un monde plus authentique ? » Lévinas répond ainsi : La technique est réellement dangereuse, mais la dénoncer au nom des racines et des particularismes oublie ce qu’elle apporte : une libération de l’homme, allégé des « pesanteurs » du passé.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « Le discours qu’il rapporte » puis « Une part de vérité ; Mais un procès suspect » puis « La foi en la libération de l’homme ; La technique, effet plus que cause ».", "On peut enfin discuter cette thèse. Une position ambiguë. Lévinas reconnaît le danger de la technique tout en rejetant ses critiques. Peut-on tenir ensemble les deux ?"]}, {"id": "temps-bergson", "label": "Bergson : l’exemple de l’eau sucrée", "theme": "Le temps", "auteur": "Bergson", "oeuvre": "L’Évolution créatrice", "fiche": "temps-bergson.html", "lignes": ["Si je veux me préparer un verre d’eau sucrée, j’ai", "beau faire, je dois attendre que le sucre fonde. Ce", "petit fait est gros d’enseignements. Car le temps que", "j’ai à attendre n’est plus ce temps mathématique qui", "s’appliquerait aussi bien le long de l’histoire", "entière du monde matériel, lors même qu’elle serait", "étalée tout d’un coup dans l’espace. Il coïncide avec", "mon impatience, c’est-à-dire avec une certaine portion", "de ma durée à moi, qui n’est pas allongeable ni", "rétrécissable à volonté. Ce n’est plus du pensé, c’est", "du vécu. Ce n’est plus une relation, c’est de", "l’absolu. Qu’est-ce à dire, sinon que le verre d’eau,", "le sucre, et le processus de dissolution du sucre dans", "l’eau sont sans doute des abstractions, et que le Tout", "dans lequel ils ont été découpés par mes sens et mon", "entendement progresse peut-être à la manière d’une", "conscience ?"], "mots": "Mots-clés : Temps mathématique, Durée, Pensé / vécu.", "lire": "<p><b>Objet du texte.</b> Le temps est-il d’abord un temps mesuré ou un temps vécu ? <b>Notion du programme.</b> Le temps.</p><p><b>Connecteurs repérés.</b> « si… » (l.1), « car » (l.3). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Temps mathématique</i> : temps abstrait, mesurable, composé d’instants égaux, que l’on peut étaler dans l’espace. ; <i>Durée</i> : temps vécu par la conscience, continu et qualitatif. Elle ne se règle pas à volonté. ; <i>Pensé / vécu</i> : le pensé est construit par l’intelligence ; le vécu est éprouvé directement.</p>", "these": "<p><b>Thèse.</b> Le temps que j’attends coïncide avec mon impatience : c’est ma durée, vécue et absolue, et non le temps mathématique, abstrait et relatif. Le Tout progresse peut-être à la manière d’une conscience.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « Un petit fait riche d’enseignements » ; « Ce n’est pas le temps mathématique » ; « Il coïncide avec mon impatience » ; « Du pensé au vécu, du relatif à l’absolu » ; « Une hypothèse sur le Tout ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-3", "idee": "Un petit fait riche d’enseignements.", "args": "Pour boire de l’eau sucrée, je dois attendre que le sucre fonde, « j’ai beau faire ».", "lien": "Après avoir posé le petit fait de l’eau sucrée, Bergson montre que le temps à attendre n’est pas le temps mathématique : il coïncide avec mon impatience."}, {"l": "3-12", "idee": "Ce n’est pas le temps mathématique ; Il coïncide avec mon impatience ; Du pensé au vécu, du relatif à l’absolu.", "args": "Le temps d’attente n’est pas ce temps mathématique qui s’appliquerait aussi bien à toute l’histoire du monde matériel, étalée d’un coup dans l’espace. Il est une portion de ma durée à moi, qui n’est « pas allongeable ni rétrécissable à volonté ». Ce temps n’est plus une relation entre des instants que l’on pense, mais quelque chose de vécu et d’absolu.", "lien": "Si ce temps est vécu et absolu, on peut aller plus loin : en faire l’hypothèse d’une durée du Tout."}, {"l": "12-17", "idee": "Une hypothèse sur le Tout.", "args": "Le verre, le sucre et la dissolution sont peut-être des abstractions découpées par mes sens et mon entendement. Le Tout progresse peut-être à la manière d’une conscience.", "lien": "Cette hypothèse élargit la thèse : le Tout progresse peut-être à la manière d’une conscience."}], "concepts": [{"c": "Temps mathématique", "s": "Temps abstrait, mesurable, composé d’instants égaux, que l’on peut étaler dans l’espace."}, {"c": "Durée", "s": "Temps vécu par la conscience, continu et qualitatif. Elle ne se règle pas à volonté."}, {"c": "Pensé / vécu", "s": "Le pensé est construit par l’intelligence ; le vécu est éprouvé directement."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que le temps serait d’abord celui des horloges, mesuré et identique pour tous.</p><p><b>Le problème.</b> Le temps est-il d’abord un temps mesuré ou un temps vécu ?</p><p><b>L’enjeu.</b> Cette thèse n’est pas évidente : comment un petit fait quotidien peut-il être « gros d’enseignements » sur la nature du temps ?</p><p><b>Formule.</b> « On dit souvent que le temps serait d’abord celui des horloges, mesuré et identique pour tous, mais Bergson soutient : Le temps que j’attends coïncide avec mon impatience : c’est ma durée, vécue et absolue, et non le temps mathématique, abstrait et relatif. »</p><p><b>Discussion.</b> Le temps de la conscience est-il le seul réel ? Bergson privilégie la durée vécue sur le temps mesuré. Que devient alors la science du temps ? (À comparer avec Einstein.)</p>", "intro": ["On pense souvent que le temps est avant tout celui des horloges, mesuré et identique pour tous. Dans <i>L’Évolution créatrice</i>, Bergson part d’un petit fait, attendre que le sucre fonde dans un verre d’eau, pour montrer qu’il existe un temps vécu.", "Bergson soutient la thèse suivante : Le temps que j’attends coïncide avec mon impatience : c’est ma durée, vécue et absolue, et non le temps mathématique, abstrait et relatif. Le Tout progresse peut-être à la manière d’une conscience. Cette thèse n’est pas évidente : comment un petit fait quotidien peut-il être « gros d’enseignements » sur la nature du temps ?", "Le texte avance en trois temps. Des lignes 1 à 3 : « Un petit fait riche d’enseignements ». Des lignes 3 à 12 : « Ce n’est pas le temps mathématique » ; « Il coïncide avec mon impatience » ; « Du pensé au vécu, du relatif à l’absolu ». Des lignes 12 à 17 : « Une hypothèse sur le Tout »."], "dev": [{"l": "1-3", "obj": "Un petit fait riche d’enseignements.", "sp": ["<b>Un petit fait riche d’enseignements.</b> Pour boire de l’eau sucrée, je dois attendre que le sucre fonde, « j’ai beau faire »."], "tr": "Après avoir posé le petit fait de l’eau sucrée, Bergson montre que le temps à attendre n’est pas le temps mathématique : il coïncide avec mon impatience."}, {"l": "3-12", "obj": "Ce n’est pas le temps mathématique ; Il coïncide avec mon impatience ; Du pensé au vécu, du relatif à l’absolu.", "sp": ["<b>Ce n’est pas le temps mathématique.</b> Le temps d’attente n’est pas ce temps mathématique qui s’appliquerait aussi bien à toute l’histoire du monde matériel, étalée d’un coup dans l’espace.", "<b>Il coïncide avec mon impatience.</b> Il est une portion de ma durée à moi, qui n’est « pas allongeable ni rétrécissable à volonté ».", "<b>Du pensé au vécu, du relatif à l’absolu.</b> Ce temps n’est plus une relation entre des instants que l’on pense, mais quelque chose de vécu et d’absolu."], "tr": "Si ce temps est vécu et absolu, on peut aller plus loin : en faire l’hypothèse d’une durée du Tout."}, {"l": "12-17", "obj": "Une hypothèse sur le Tout.", "sp": ["<b>Une hypothèse sur le Tout.</b> Le verre, le sucre et la dissolution sont peut-être des abstractions découpées par mes sens et mon entendement. Le Tout progresse peut-être à la manière d’une conscience."], "tr": ""}], "concl": ["Le texte se demande : « Le temps est-il d’abord un temps mesuré ou un temps vécu ? » Bergson répond ainsi : Le temps que j’attends coïncide avec mon impatience : c’est ma durée, vécue et absolue, et non le temps mathématique, abstrait et relatif. Le Tout progresse peut-être à la manière d’une conscience.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « Un petit fait riche d’enseignements » puis « Ce n’est pas le temps mathématique ; Il coïncide avec mon impatience ; Du pensé au vécu, du relatif à l’absolu » puis « Une hypothèse sur le Tout ».", "On peut enfin discuter cette thèse. Le temps de la conscience est-il le seul réel ? Bergson privilégie la durée vécue sur le temps mesuré. Que devient alors la science du temps ? (À comparer avec Einstein.)"]}, {"id": "temps-einstein", "label": "Einstein : temps du physicien et temps psychologique", "theme": "Le temps", "auteur": "Einstein", "oeuvre": "Débat avec Bergson (Société française de philosophie)", "fiche": "temps-einstein.html", "lignes": ["EINSTEIN : - La question de pose ainsi : Le temps du", "philosophe est-il le même que celui du physicien ? Le", "temps du philosophe, je crois, est un temps", "psychologique et physique à la fois ; or le temps", "physique peut être dérivé du temps de la conscience.", "Primitivement les individus ont la notion de la", "simultanéité de perception ; ils purent alors", "s'entendre entre et convenir de quelque chose sur ce", "qu'ils percevaient ; c'était là une première étape", "vers la réalité objective. Mais il y a des événements", "objectifs indépendants des individus, et de la", "simultanéité des perceptions on est passé à celle des", "événements eux-mêmes. Et, en fait, cette simultanéité", "n'a pendant longtemps conduit à aucune contradiction à", "cause de la grande vitesse de propagation de la", "lumière. Le concept de simultanéité a donc pu passer", "des perceptions aux objets. De là à déduire un ordre", "temporel dans les événements il n'y avait pas loin, et", "l'instinct l'a fait. Mais rien dans notre conscience", "ne nous permet de conclure à la simultanéité des", "événements, car ceux-ci ne sont que des constructions", "mentales, des êtres logiques. Il n'y a donc pas un", "temps des philosophes ; il n'y a qu'un temps", "psychologique différent du temps du physicien."], "mots": "Mots-clés : Simultanéité, Temps psychologique, Réalité objective.", "lire": "<p><b>Objet du texte.</b> Existe-t-il un temps propre au philosophe, distinct du temps du physicien ? <b>Notion du programme.</b> Le temps.</p><p><b>Connecteurs repérés.</b> « ainsi » (l.1), « or » (l.4), « alors » (l.7), « mais » (l.10), « donc » (l.16), « car » (l.21). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Simultanéité</i> : fait que deux événements se produisent en même temps. Pour Einstein, elle n’est pas donnée dans la conscience. ; <i>Temps psychologique</i> : temps tel qu’il est vécu par l’individu. ; <i>Réalité objective</i> : ce qui est indépendant des individus et sur quoi on peut s’entendre.</p>", "these": "<p><b>Thèse.</b> Il n’y a pas de temps du philosophe. Il n’y a qu’un temps psychologique, différent du temps du physicien, car la simultanéité des événements est une construction mentale qui ne se déduit pas de la conscience.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « La question posée » ; « Du temps de la conscience au temps physique » ; « De la perception aux événements » ; « Une simultanéité longtemps sans contradiction » ; « Une construction mentale ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-5", "idee": "La question posée ; Du temps de la conscience au temps physique.", "args": "Le temps du philosophe est-il le même que celui du physicien ? Einstein le dit à la fois psychologique et physique. Les individus ont d’abord la notion de simultanéité des perceptions. Ils s’entendent sur ce qu’ils perçoivent : une première étape vers la réalité objective.", "lien": "Après avoir posé la question (le temps du philosophe est-il le même que celui du physicien ?), Einstein montre comment on passe de la simultanéité perçue à celle des événements objectifs."}, {"l": "6-19", "idee": "De la perception aux événements ; Une simultanéité longtemps sans contradiction.", "args": "On passe de la simultanéité des perceptions à celle des événements eux-mêmes, indépendants des individus. La grande vitesse de propagation de la lumière explique qu’elle n’ait conduit à aucune contradiction. L’instinct déduit un ordre temporel des événements.", "lien": "Cette simultanéité n’a longtemps conduit à aucune contradiction ; mais rien dans la conscience ne permet d’en déduire un ordre temporel objectif."}, {"l": "19-24", "idee": "Une construction mentale.", "args": "Rien dans notre conscience ne permet de conclure à la simultanéité des événements : ce sont des constructions mentales, des êtres logiques.", "lien": "La simultanéité est donc une construction mentale : il n’y a pas de temps du philosophe, seulement un temps psychologique."}], "concepts": [{"c": "Simultanéité", "s": "Fait que deux événements se produisent en même temps. Pour Einstein, elle n’est pas donnée dans la conscience."}, {"c": "Temps psychologique", "s": "Temps tel qu’il est vécu par l’individu."}, {"c": "Réalité objective", "s": "Ce qui est indépendant des individus et sur quoi on peut s’entendre."}], "probleme": "<p><b>L’opinion remise en cause.</b> Qu’il y aurait un temps propre au philosophe, plus profond que celui du physicien.</p><p><b>Le problème.</b> Existe-t-il un temps propre au philosophe, distinct du temps du physicien ?</p><p><b>L’enjeu.</b> Cette thèse n’est pas évidente : s’il n’y a qu’un temps psychologique et un temps physique, d’où vient la notion de simultanéité ?</p><p><b>Formule.</b> « On dit souvent qu’il y aurait un temps propre au philosophe, plus profond que celui du physicien, mais Einstein soutient : Il n’y a pas de temps du philosophe. »</p><p><b>Discussion.</b> Deux temps irréconciliables ? Einstein sépare le temps de la conscience du temps de la physique. Bergson résiste : la durée est-elle plus réelle ? (À comparer avec Bergson.)</p>", "intro": ["On croit souvent que le philosophe a son propre temps, plus profond que celui du physicien : le temps vécu contre le temps des horloges. Dans cet échange avec Bergson à la Société française de philosophie, Einstein soutient qu’il n’y a pas de temps du philosophe.", "Einstein soutient la thèse suivante : Il n’y a pas de temps du philosophe. Il n’y a qu’un temps psychologique, différent du temps du physicien, car la simultanéité des événements est une construction mentale qui ne se déduit pas de la conscience. Cette thèse n’est pas évidente : s’il n’y a qu’un temps psychologique et un temps physique, d’où vient la notion de simultanéité ?", "Le texte avance en trois temps. Des lignes 1 à 5 : « La question posée » ; « Du temps de la conscience au temps physique ». Des lignes 6 à 19 : « De la perception aux événements » ; « Une simultanéité longtemps sans contradiction ». Des lignes 19 à 24 : « Une construction mentale »."], "dev": [{"l": "1-5", "obj": "La question posée ; Du temps de la conscience au temps physique.", "sp": ["<b>La question posée.</b> Le temps du philosophe est-il le même que celui du physicien ? Einstein le dit à la fois psychologique et physique.", "<b>Du temps de la conscience au temps physique.</b> Les individus ont d’abord la notion de simultanéité des perceptions. Ils s’entendent sur ce qu’ils perçoivent : une première étape vers la réalité objective."], "tr": "Après avoir posé la question (le temps du philosophe est-il le même que celui du physicien ?), Einstein montre comment on passe de la simultanéité perçue à celle des événements objectifs."}, {"l": "6-19", "obj": "De la perception aux événements ; Une simultanéité longtemps sans contradiction.", "sp": ["<b>De la perception aux événements.</b> On passe de la simultanéité des perceptions à celle des événements eux-mêmes, indépendants des individus.", "<b>Une simultanéité longtemps sans contradiction.</b> La grande vitesse de propagation de la lumière explique qu’elle n’ait conduit à aucune contradiction. L’instinct déduit un ordre temporel des événements."], "tr": "Cette simultanéité n’a longtemps conduit à aucune contradiction ; mais rien dans la conscience ne permet d’en déduire un ordre temporel objectif."}, {"l": "19-24", "obj": "Une construction mentale.", "sp": ["<b>Une construction mentale.</b> Rien dans notre conscience ne permet de conclure à la simultanéité des événements : ce sont des constructions mentales, des êtres logiques."], "tr": ""}], "concl": ["Le texte se demande : « Existe-t-il un temps propre au philosophe, distinct du temps du physicien ? » Einstein répond ainsi : Il n’y a pas de temps du philosophe. Il n’y a qu’un temps psychologique, différent du temps du physicien, car la simultanéité des événements est une construction mentale qui ne se déduit pas de la conscience.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « La question posée ; Du temps de la conscience au temps physique » puis « De la perception aux événements ; Une simultanéité longtemps sans contradiction » puis « Une construction mentale ».", "On peut enfin discuter cette thèse. Deux temps irréconciliables ? Einstein sépare le temps de la conscience du temps de la physique. Bergson résiste : la durée est-elle plus réelle ? (À comparer avec Bergson.)"]}, {"id": "temps-proust", "label": "Proust : l’extra-temporalité", "theme": "Le temps", "auteur": "Proust", "oeuvre": "À la recherche du temps perdu", "fiche": "temps-proust.html", "lignes": ["Je glissais rapidement sur tout cela, plus", "impérieusement sollicité que j'étais de chercher la", "cause de cette félicité, du caractère de certitude", "avec lequel elle s'imposait, recherche ajournée", "autrefois. Or, cette cause, je la devinais en", "comparant entre elles ces diverses impressions", "bienheureuses et qui avaient entre elles ceci de", "commun que je les éprouvais à la fois dans le moment", "actuel et dans un moment éloigné où le bruit de la", "cuiller sur l'assiette, l'inégalité des dalles, le", "goût de la madeleine allaient jusqu'à faire empiéter", "le passé sur le présent, à me faire hésiter à savoir", "dans lequel des deux je me trouvais ; au vrai, l'être", "qui alors goûtait en moi cette impression la goûtait", "en ce qu'elle avait de commun dans un jour ancien et", "maintenant, dans ce qu'elle avait d'extra-temporel, un", "être qui n'apparaissait que quand, par une de ces", "identités entre le présent et le passé, il pouvait se", "trouver dans le seul milieu où il pût vivre, jouir de", "l'essence des choses, c'est-à-dire en dehors du temps.", "Cela expliquait que mes inquiétudes au sujet de ma", "mort eussent cessé au moment où j'avais reconnu,", "inconsciemment, le goût de la petite madeleine,", "puisqu'à ce moment-là l'être que j'avais été était un", "être extra-temporel, par conséquent insoucieux des", "vicissitudes de l'avenir. Cet être-là n'était jamais", "venu à moi, ne s'était jamais manifesté qu'en dehors", "de l'action, de la jouissance immédiate, chaque fois", "que le miracle d'une analogie m'avait fait échapper au", "présent. Seul il avait le pouvoir de me faire", "retrouver les jours anciens, le Temps Perdu, devant", "quoi les efforts de ma mémoire et de mon intelligence", "échouaient toujours."], "mots": "Mots-clés : Extra-temporel, Analogie, Mémoire volontaire.", "lire": "<p><b>Objet du texte.</b> Peut-on échapper au temps, et par quel moyen retrouver le passé ? <b>Notion du programme.</b> Le temps.</p><p><b>Connecteurs repérés.</b> « or » (l.5), « alors » (l.14), « par conséquent » (l.25). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Extra-temporel</i> : qui est en dehors du temps. L’essence des choses n’est pas soumise au temps. ; <i>Analogie</i> : ressemblance entre une impression présente et une impression passée. Elle fait « échapper au présent ». ; <i>Mémoire volontaire</i> : ici : les efforts de la mémoire et de l’intelligence, qui échouent à retrouver le passé.</p>", "these": "<p><b>Thèse.</b> Par une analogie entre le présent et le passé, une sensation fait vivre un être extra-temporel, insoucieux de la mort. Seul ce pouvoir fait retrouver le temps perdu, là où la mémoire et l’intelligence échouent.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « Une félicité à expliquer » ; « Ce que les impressions ont en commun » ; « Le passé empiète sur le présent » ; « Un être extra-temporel » ; « Conséquence : l’oubli de la mort ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-20", "idee": "Une félicité à expliquer ; Ce que les impressions ont en commun.", "args": "Le narrateur cherche la cause de la félicité certaine que lui donnent certaines impressions, recherche longtemps ajournée. Il les éprouve à la fois dans le moment actuel et dans un moment éloigné : bruit de la cuiller, dalles inégales, goût de la madeleine.", "lien": "Après avoir cherché la cause de sa félicité en comparant des impressions, le narrateur découvre ce qu’elles ont en commun : le passé empiète sur le présent."}, {"l": "21-30", "idee": "Le passé empiète sur le présent ; Un être extra-temporel.", "args": "Le passé s’invite dans le présent au point qu’il hésite à savoir dans lequel il se trouve. L’être qui goûte cette impression la goûte dans ce qu’elle a de commun entre hier et aujourd’hui, c’est-à-dire en dehors du temps. Il jouit de l’essence des choses.", "lien": "Cet empiètement fait vivre un être extra-temporel, qui échappe au temps."}, {"l": "30-33", "idee": "Conséquence : l’oubli de la mort.", "args": "Ses inquiétudes sur sa mort ont cessé : cet être est insoucieux de l’avenir. Lui seul peut retrouver le Temps Perdu, quand mémoire et intelligence échouent.", "lien": "Cet être est insoucieux de la mort : seul il peut retrouver le temps perdu."}], "concepts": [{"c": "Extra-temporel", "s": "Qui est en dehors du temps. L’essence des choses n’est pas soumise au temps."}, {"c": "Analogie", "s": "Ressemblance entre une impression présente et une impression passée. Elle fait « échapper au présent »."}, {"c": "Mémoire volontaire", "s": "Ici : les efforts de la mémoire et de l’intelligence, qui échouent à retrouver le passé."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que le passé serait perdu à jamais, et que seules la mémoire et l’intelligence pourraient le retrouver.</p><p><b>Le problème.</b> Peut-on échapper au temps, et par quel moyen retrouver le passé ?</p><p><b>L’enjeu.</b> Cette thèse n’est pas évidente : comment une simple sensation peut-elle abolir le temps et rendre insoucieux de la mort ?</p><p><b>Formule.</b> « On dit souvent que le passé serait perdu à jamais, et que seules la mémoire et l’intelligence pourraient le retrouver, mais Proust soutient : Par une analogie entre le présent et le passé, une sensation fait vivre un être extra-temporel, insoucieux de la mort. »</p><p><b>Discussion.</b> Le passé se retrouve-t-il par la volonté ? Pour Proust, le passé revient par hasard, par une sensation. La mémoire est-elle plus fidèle quand elle est involontaire ?</p>", "intro": ["On croit souvent que le passé est définitivement perdu, et que seules la mémoire et l’intelligence permettent de le retrouver. Dans <i>À la recherche du temps perdu</i>, Proust décrit une félicité qui lui révèle un être extra-temporel.", "Proust soutient la thèse suivante : Par une analogie entre le présent et le passé, une sensation fait vivre un être extra-temporel, insoucieux de la mort. Seul ce pouvoir fait retrouver le temps perdu, là où la mémoire et l’intelligence échouent. Cette thèse n’est pas évidente : comment une simple sensation peut-elle abolir le temps et rendre insoucieux de la mort ?", "Le texte avance en trois temps. Des lignes 1 à 20 : « Une félicité à expliquer » ; « Ce que les impressions ont en commun ». Des lignes 21 à 30 : « Le passé empiète sur le présent » ; « Un être extra-temporel ». Des lignes 30 à 33 : « Conséquence : l’oubli de la mort »."], "dev": [{"l": "1-20", "obj": "Une félicité à expliquer ; Ce que les impressions ont en commun.", "sp": ["<b>Une félicité à expliquer.</b> Le narrateur cherche la cause de la félicité certaine que lui donnent certaines impressions, recherche longtemps ajournée.", "<b>Ce que les impressions ont en commun.</b> Il les éprouve à la fois dans le moment actuel et dans un moment éloigné : bruit de la cuiller, dalles inégales, goût de la madeleine."], "tr": "Après avoir cherché la cause de sa félicité en comparant des impressions, le narrateur découvre ce qu’elles ont en commun : le passé empiète sur le présent."}, {"l": "21-30", "obj": "Le passé empiète sur le présent ; Un être extra-temporel.", "sp": ["<b>Le passé empiète sur le présent.</b> Le passé s’invite dans le présent au point qu’il hésite à savoir dans lequel il se trouve.", "<b>Un être extra-temporel.</b> L’être qui goûte cette impression la goûte dans ce qu’elle a de commun entre hier et aujourd’hui, c’est-à-dire en dehors du temps. Il jouit de l’essence des choses."], "tr": "Cet empiètement fait vivre un être extra-temporel, qui échappe au temps."}, {"l": "30-33", "obj": "Conséquence : l’oubli de la mort.", "sp": ["<b>Conséquence : l’oubli de la mort.</b> Ses inquiétudes sur sa mort ont cessé : cet être est insoucieux de l’avenir. Lui seul peut retrouver le Temps Perdu, quand mémoire et intelligence échouent."], "tr": ""}], "concl": ["Le texte se demande : « Peut-on échapper au temps, et par quel moyen retrouver le passé ? » Proust répond ainsi : Par une analogie entre le présent et le passé, une sensation fait vivre un être extra-temporel, insoucieux de la mort. Seul ce pouvoir fait retrouver le temps perdu, là où la mémoire et l’intelligence échouent.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « Une félicité à expliquer ; Ce que les impressions ont en commun » puis « Le passé empiète sur le présent ; Un être extra-temporel » puis « Conséquence : l’oubli de la mort ».", "On peut enfin discuter cette thèse. Le passé se retrouve-t-il par la volonté ? Pour Proust, le passé revient par hasard, par une sensation. La mémoire est-elle plus fidèle quand elle est involontaire ?"]}, {"id": "temps-sartre", "label": "Sartre : passé et présent", "theme": "Le temps", "auteur": "Sartre", "oeuvre": "L’Être et le Néant", "fiche": "temps-sartre.html", "lignes": ["La signification du passé est étroitement dépendante", "de mon projet présent. Cela ne signifie nullement que", "je puis faire varier au gré de mes caprices le sens de", "mes actes antérieurs ; mais, bien au contraire, que le", "projet fondamental que je suis décide absolument de la", "signification que peut avoir pour moi et pour les", "autres le passé que j'ai à être. Moi seul en effet", "peut décider à chaque moment de la portée du passé :", "non pas en discutant, en délibérant et en appréciant", "en chaque cas l'importance de tel ou tel événement", "antérieur, mais en me projetant vers mes buts, je", "sauve le passé avec moi et je décide par l'action de", "sa signification. […] Ainsi tout mon passé est là,", "pressant, urgent, impérieux, mais je choisis son sens", "et les ordres qu'il me donne par le projet même de ma", "fin."], "mots": "Mots-clés : Projet, Signification, Passé que j’ai à être.", "lire": "<p><b>Objet du texte.</b> Dans quelle mesure le passé détermine-t-il le présent ? <b>Notion du programme.</b> Le temps.</p><p><b>Connecteurs repérés.</b> « mais » (l.4), « en effet » (l.7), « non pas… mais » (l.9), « ainsi » (l.13). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Projet</i> : visée par laquelle l’homme se tourne vers l’avenir et se définit par ses buts. ; <i>Signification</i> : sens que prend un événement pour moi, selon ce que je veux être. ; <i>Passé que j’ai à être</i> : le passé n’est pas derrière moi comme une chose : je continue à l’être en le portant.</p>", "these": "<p><b>Thèse.</b> La signification du passé dépend de mon projet présent. Je ne change pas les faits à mon gré, mais je décide de leur portée en me projetant vers mes buts.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « Le sens du passé dépend du projet » ; « Mais pas selon mes caprices » ; « Le projet fondamental décide » ; « Décider par l’action » ; « Le passé presse, mais je choisis son sens ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-7", "idee": "Le sens du passé dépend du projet ; Mais pas selon mes caprices.", "args": "La signification du passé est « étroitement dépendante » de mon projet présent. Cela ne signifie pas que je puisse varier le sens de mes actes antérieurs à ma guise.", "lien": "Après avoir posé que la signification du passé dépend du projet, Sartre précise que cela ne signifie pas que je puisse le faire varier à mon gré."}, {"l": "7-13", "idee": "Le projet fondamental décide ; Décider par l’action.", "args": "Le projet fondamental que je suis décide absolument de la signification que peut avoir le passé que j’ai à être, pour moi et pour les autres. Je ne décide pas en délibérant sur chaque événement, mais en me projetant vers mes buts : je sauve le passé avec moi.", "lien": "Si le projet fondamental décide du sens du passé, je le décide par l’action, à chaque moment."}, {"l": "13-16", "idee": "Le passé presse, mais je choisis son sens.", "args": "Tout mon passé est là, « pressant, urgent, impérieux », mais je choisis son sens et ses ordres par mon projet.", "lien": "Le passé est donc pressant, mais c’est moi qui choisis son sens : voilà la réponse à la question."}], "concepts": [{"c": "Projet", "s": "Visée par laquelle l’homme se tourne vers l’avenir et se définit par ses buts."}, {"c": "Signification", "s": "Sens que prend un événement pour moi, selon ce que je veux être."}, {"c": "Passé que j’ai à être", "s": "Le passé n’est pas derrière moi comme une chose : je continue à l’être en le portant."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que le passé déterminerait entièrement le présent.</p><p><b>Le problème.</b> Dans quelle mesure le passé détermine-t-il le présent ?</p><p><b>L’enjeu.</b> Cette thèse n’est pas évidente : si je décide du sens de mon passé, puis-je pour autant le changer à ma guise ?</p><p><b>Formule.</b> « On dit souvent que le passé déterminerait entièrement le présent, mais Sartre soutient : La signification du passé dépend de mon projet présent. »</p><p><b>Discussion.</b> Un passé libre ? Si je décide du sens du passé, suis-je responsable de ce que j’ai été ? (À comparer avec Freud.)</p>", "intro": ["On dit souvent que le passé détermine le présent : nous serions le produit de ce que nous avons vécu. Dans <i>L’Être et le Néant</i>, Sartre soutient que la signification du passé dépend de mon projet présent.", "Sartre soutient la thèse suivante : La signification du passé dépend de mon projet présent. Je ne change pas les faits à mon gré, mais je décide de leur portée en me projetant vers mes buts. Cette thèse n’est pas évidente : si je décide du sens de mon passé, puis-je pour autant le changer à ma guise ?", "Le texte avance en trois temps. Des lignes 1 à 7 : « Le sens du passé dépend du projet » ; « Mais pas selon mes caprices ». Des lignes 7 à 13 : « Le projet fondamental décide » ; « Décider par l’action ». Des lignes 13 à 16 : « Le passé presse, mais je choisis son sens »."], "dev": [{"l": "1-7", "obj": "Le sens du passé dépend du projet ; Mais pas selon mes caprices.", "sp": ["<b>Le sens du passé dépend du projet.</b> La signification du passé est « étroitement dépendante » de mon projet présent.", "<b>Mais pas selon mes caprices.</b> Cela ne signifie pas que je puisse varier le sens de mes actes antérieurs à ma guise."], "tr": "Après avoir posé que la signification du passé dépend du projet, Sartre précise que cela ne signifie pas que je puisse le faire varier à mon gré."}, {"l": "7-13", "obj": "Le projet fondamental décide ; Décider par l’action.", "sp": ["<b>Le projet fondamental décide.</b> Le projet fondamental que je suis décide absolument de la signification que peut avoir le passé que j’ai à être, pour moi et pour les autres.", "<b>Décider par l’action.</b> Je ne décide pas en délibérant sur chaque événement, mais en me projetant vers mes buts : je sauve le passé avec moi."], "tr": "Si le projet fondamental décide du sens du passé, je le décide par l’action, à chaque moment."}, {"l": "13-16", "obj": "Le passé presse, mais je choisis son sens.", "sp": ["<b>Le passé presse, mais je choisis son sens.</b> Tout mon passé est là, « pressant, urgent, impérieux », mais je choisis son sens et ses ordres par mon projet."], "tr": ""}], "concl": ["Le texte se demande : « Dans quelle mesure le passé détermine-t-il le présent ? » Sartre répond ainsi : La signification du passé dépend de mon projet présent. Je ne change pas les faits à mon gré, mais je décide de leur portée en me projetant vers mes buts.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « Le sens du passé dépend du projet ; Mais pas selon mes caprices » puis « Le projet fondamental décide ; Décider par l’action » pui
