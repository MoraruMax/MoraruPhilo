s « Le passé presse, mais je choisis son sens ».", "On peut enfin discuter cette thèse. Un passé libre ? Si je décide du sens du passé, suis-je responsable de ce que j’ai été ? (À comparer avec Freud.)"]}, {"id": "travail-aristote", "label": "Aristote : citoyen et travail", "theme": "Le travail", "auteur": "Aristote", "oeuvre": "La Politique, livre III", "fiche": "travail-aristote.html", "lignes": ["Mais il est certain qu'on ne doit pas élever au rang", "de citoyens tous les individus dont l'Etat a cependant", "nécessairement besoin. Ainsi, les enfants ne sont pas", "citoyens comme les hommes : ceux-ci le sont d'une", "manière absolue ; ceux-là le sont en espérance,", "citoyens sans doute, mais citoyens imparfaits. Jadis,", "dans quelques Etats, tous les ouvriers étaient ou des", "esclaves ou des étrangers ; et dans la plupart, il en", "est encore de même aujourd'hui. Mais la constitution", "parfaite n'admettra jamais l'artisan parmi les", "citoyens. Si de l'artisan aussi l'on veut faire un", "citoyen, dès lors la vertu du citoyen, telle que nous", "l'avons définie, doit s'entendre, non pas de tous les", "hommes de la cité, non pas même de tous ceux qui ne", "sont que libres, elle doit s'entendre de ceux-là", "seulement qui n'ont point à travailler nécessairement", "pour vivre."], "mots": "Mots-clés : Citoyen, Vertu du citoyen, Loisir (scholè).", "lire": "<p><b>Objet du texte.</b> Le travail est-il compatible avec la citoyenneté ? <b>Notion du programme.</b> Le travail.</p><p><b>Connecteurs repérés.</b> « mais » (l.1), « cependant » (l.2), « ainsi » (l.3), « si… » (l.11), « non pas… mais » (l.13). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Citoyen</i> : membre de la cité qui participe à sa vie politique. Pour Aristote, il doit disposer de loisir. ; <i>Vertu du citoyen</i> : qualité qui permet de bien gouverner et d’être gouverné. Elle suppose du temps libre. ; <i>Loisir (scholè)</i> : temps libéré de la nécessité de travailler, consacré à la politique et à la réflexion.</p>", "these": "<p><b>Thèse.</b> Les travailleurs sont nécessaires à l’État, mais ils ne sont pas des citoyens à part entière : seuls les hommes libérés de la nécessité de travailler peuvent exercer la vertu du citoyen.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « Nécessaire n’est pas citoyen » ; « Des citoyens imparfaits : les enfants » ; « Les ouvriers sont esclaves ou étrangers » ; « L’artisan hors de la cité parfaite » ; « La vertu du citoyen exige le loisir ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-6", "idee": "Nécessaire n’est pas citoyen ; Des citoyens imparfaits : les enfants.", "args": "Tous ceux dont l’État a besoin ne doivent pas être élevés au rang de citoyens. Les enfants sont citoyens « en espérance » : ce sont des citoyens imparfaits. Le texte distingue donc des degrés de citoyenneté.", "lien": "Après avoir posé que ce qui est nécessaire à l’État n’est pas citoyen, Aristote distingue des citoyens imparfaits, comme les enfants, puis les ouvriers."}, {"l": "6-11", "idee": "Les ouvriers sont esclaves ou étrangers ; L’artisan hors de la cité parfaite.", "args": "Dans beaucoup d’États, tous les ouvriers étaient esclaves ou étrangers, comme aujourd’hui encore dans la plupart. La constitution parfaite n’admet jamais l’artisan parmi les citoyens.", "lien": "Si les ouvriers et artisans ne sont pas citoyens dans la cité parfaite, il faut en donner la raison : la vertu du citoyen exige le loisir."}, {"l": "11-17", "idee": "La vertu du citoyen exige le loisir.", "args": "Si l’on veut en faire un citoyen, la vertu du citoyen ne doit concerner que ceux « qui n’ont point à travailler nécessairement pour vivre ».", "lien": "Cette exigence de loisir fonde la thèse : seuls les hommes libérés de la nécessité de travailler peuvent exercer la vertu du citoyen."}], "concepts": [{"c": "Citoyen", "s": "Membre de la cité qui participe à sa vie politique. Pour Aristote, il doit disposer de loisir."}, {"c": "Vertu du citoyen", "s": "Qualité qui permet de bien gouverner et d’être gouverné. Elle suppose du temps libre."}, {"c": "Loisir (scholè)", "s": "Temps libéré de la nécessité de travailler, consacré à la politique et à la réflexion."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que ceux qui contribuent par leur travail à la cité en seraient pleinement citoyens.</p><p><b>Le problème.</b> Le travail est-il compatible avec la citoyenneté ?</p><p><b>L’enjeu.</b> Cette thèse nous heurte aujourd’hui : il faut la comprendre à partir de l’idée antique de la vertu du citoyen, qui exige du loisir.</p><p><b>Formule.</b> « On dit souvent que ceux qui contribuent par leur travail à la cité en seraient pleinement citoyens, mais Aristote soutient : Les travailleurs sont nécessaires à l’État, mais ils ne sont pas des citoyens à part entière : seuls les hommes libérés de la nécessité de travailler peuvent exercer la vertu du citoyen. »</p><p><b>Discussion.</b> Une conception aristocratique. Aristote justifie une société où certains travaillent pour que d’autres soient libres. Cette thèse est-elle encore défendable ? (À comparer avec Russell.)</p>", "intro": ["On croit souvent que ceux qui contribuent par leur travail à la vie de la cité en sont pleinement citoyens. Dans <i>La Politique</i>, Aristote soutient que les travailleurs, nécessaires à l’État, ne sont pas des citoyens à part entière.", "Aristote soutient la thèse suivante : Les travailleurs sont nécessaires à l’État, mais ils ne sont pas des citoyens à part entière : seuls les hommes libérés de la nécessité de travailler peuvent exercer la vertu du citoyen. Cette thèse nous heurte aujourd’hui : il faut la comprendre à partir de l’idée antique de la vertu du citoyen, qui exige du loisir.", "Le texte avance en trois temps. Des lignes 1 à 6 : « Nécessaire n’est pas citoyen » ; « Des citoyens imparfaits : les enfants ». Des lignes 6 à 11 : « Les ouvriers sont esclaves ou étrangers » ; « L’artisan hors de la cité parfaite ». Des lignes 11 à 17 : « La vertu du citoyen exige le loisir »."], "dev": [{"l": "1-6", "obj": "Nécessaire n’est pas citoyen ; Des citoyens imparfaits : les enfants.", "sp": ["<b>Nécessaire n’est pas citoyen.</b> Tous ceux dont l’État a besoin ne doivent pas être élevés au rang de citoyens.", "<b>Des citoyens imparfaits : les enfants.</b> Les enfants sont citoyens « en espérance » : ce sont des citoyens imparfaits. Le texte distingue donc des degrés de citoyenneté."], "tr": "Après avoir posé que ce qui est nécessaire à l’État n’est pas citoyen, Aristote distingue des citoyens imparfaits, comme les enfants, puis les ouvriers."}, {"l": "6-11", "obj": "Les ouvriers sont esclaves ou étrangers ; L’artisan hors de la cité parfaite.", "sp": ["<b>Les ouvriers sont esclaves ou étrangers.</b> Dans beaucoup d’États, tous les ouvriers étaient esclaves ou étrangers, comme aujourd’hui encore dans la plupart.", "<b>L’artisan hors de la cité parfaite.</b> La constitution parfaite n’admet jamais l’artisan parmi les citoyens."], "tr": "Si les ouvriers et artisans ne sont pas citoyens dans la cité parfaite, il faut en donner la raison : la vertu du citoyen exige le loisir."}, {"l": "11-17", "obj": "La vertu du citoyen exige le loisir.", "sp": ["<b>La vertu du citoyen exige le loisir.</b> Si l’on veut en faire un citoyen, la vertu du citoyen ne doit concerner que ceux « qui n’ont point à travailler nécessairement pour vivre »."], "tr": ""}], "concl": ["Le texte se demande : « Le travail est-il compatible avec la citoyenneté ? » Aristote répond ainsi : Les travailleurs sont nécessaires à l’État, mais ils ne sont pas des citoyens à part entière : seuls les hommes libérés de la nécessité de travailler peuvent exercer la vertu du citoyen.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « Nécessaire n’est pas citoyen ; Des citoyens imparfaits : les enfants » puis « Les ouvriers sont esclaves ou étrangers ; L’artisan hors de la cité parfaite » puis « La vertu du citoyen exige le loisir ».", "On peut enfin discuter cette thèse. Une conception aristocratique. Aristote justifie une société où certains travaillent pour que d’autres soient libres. Cette thèse est-elle encore défendable ? (À comparer avec Russell.)"]}, {"id": "travail-genese", "label": "Genèse 3 : le travail comme punition", "theme": "Le travail", "auteur": "La Bible", "oeuvre": "Genèse, chapitre 3", "fiche": "travail-genese.html", "lignes": ["Le serpent était le plus rusé de tous les animaux des", "champs que le Seigneur Dieu avait faits. Il dit à la", "femme : « Alors, Dieu vous a vraiment dit : “Vous ne", "mangerez d’aucun arbre du jardin” ? »", "La femme répondit au serpent : « Nous mangeons les", "fruits des arbres du jardin.", "Mais, pour le fruit de l’arbre qui est au milieu du", "jardin, Dieu a dit : “Vous n’en mangerez pas, vous n’y", "toucherez pas, sinon vous mourrez.” »", "Le serpent dit à la femme : « Pas du tout ! Vous ne", "mourrez pas !", "Mais Dieu sait que, le jour où vous en mangerez, vos", "yeux s’ouvriront, et vous serez comme des dieux,", "connaissant le bien et le mal. »", "La femme s’aperçut que le fruit de l’arbre devait être", "savoureux, qu’il était agréable à regarder et qu’il", "était désirable, cet arbre, puisqu’il donnait", "l’intelligence. Elle prit de son fruit, et en mangea.", "Elle en donna aussi à son mari, et il en mangea.", "Alors leurs yeux à tous deux s’ouvrirent et ils se", "rendirent compte qu’ils étaient nus. Ils attachèrent", "les unes aux autres des feuilles de figuier, et ils", "s’en firent des pagnes.", "Ils entendirent la voix du Seigneur Dieu qui se", "promenait dans le jardin à la brise du jour. L’homme", "et sa femme allèrent se cacher aux regards du Seigneur", "Dieu parmi les arbres du jardin.", "Le Seigneur Dieu appela l’homme et lui dit : « Où es-", "tu donc ? »", "Il répondit : « J’ai entendu ta voix dans le jardin,", "j’ai pris peur parce que je suis nu, et je me suis", "caché. »", "Le Seigneur reprit : « Qui donc t’a dit que tu étais", "nu ? Aurais-tu mangé de l’arbre dont je t’avais", "interdit de manger ? »", "L’homme répondit : « La femme que tu m’as donnée,", "c’est elle qui m’a donné du fruit de l’arbre, et j’en", "ai mangé. »", "Le Seigneur Dieu dit à la femme : « Qu’as-tu fait là ?", "» La femme répondit : « Le serpent m’a trompée, et", "j’ai mangé. »", "Alors le Seigneur Dieu dit au serpent : « Parce que tu", "as fait cela, tu seras maudit parmi tous les animaux", "et toutes les bêtes des champs. Tu ramperas sur le", "ventre et tu mangeras de la poussière tous les jours", "de ta vie.", "Je mettrai une hostilité entre toi et la femme, entre", "ta descendance et sa descendance : celle-ci te", "meurtrira la tête, et toi, tu lui meurtriras le talon.", "»", "Le Seigneur Dieu dit ensuite à la femme : « Je", "multiplierai la peine de tes grossesses ; c’est dans", "la peine que tu enfanteras des fils. Ton désir te", "portera vers ton mari, et celui-ci dominera sur toi. »", "Il dit enfin à l’homme : « Parce que tu as écouté la", "voix de ta femme, et que tu as mangé le fruit de", "l’arbre que je t’avais interdit de manger : maudit", "soit le sol à cause de toi ! C’est dans la peine que", "tu en tireras ta nourriture, tous les jours de ta vie.", "De lui-même, il te donnera épines et chardons, mais tu", "auras ta nourriture en cultivant les champs.", "C’est à la sueur de ton visage que tu gagneras ton", "pain, jusqu’à ce que tu retournes à la terre dont tu", "proviens ; car tu es poussière, et à la poussière tu", "retourneras. »"], "mots": "Mots-clés : Punition, Sueur, Nécessité.", "lire": "<p><b>Objet du texte.</b> Le travail est-il une condition heureuse ou une peine pour l’homme ? <b>Notion du programme.</b> Le travail.</p><p><b>Connecteurs repérés.</b> « alors » (l.3), « mais » (l.7), « donc » (l.29), « parce que » (l.31), « car » (l.64). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Punition</i> : peine infligée à la suite d’une faute. Ici, la peine est liée à la désobéissance à l’interdit divin. ; <i>Sueur</i> : image de la fatigue physique : le travail se fait au prix de l’effort et de la peine. ; <i>Nécessité</i> : ce qui s’impose sans choix possible. L’homme doit travailler pour vivre.</p>", "these": "<p><b>Thèse.</b> Le travail est présenté comme une punition consécutive à la faute : il est pénible, il est lié à la finitude de l’homme, qui retourne à la poussière dont il vient.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « Une faute précède la peine » ; « Le sol est maudit à cause de l’homme » ; « La peine accompagne le travail » ; « Le travail est une nécessité vitale » ; « Le travail est lié à la mort ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-54", "idee": "Une faute précède la peine.", "args": "Parce que l’homme a mangé le fruit que Dieu avait interdit, Dieu le condamne. Le travail n’existe pas dans la situation originelle du jardin.", "lien": "Après avoir raconté la faute (la désobéissance à l’interdit), le texte montre le jugement : le sol est maudit à cause de l’homme et le travail devient peine."}, {"l": "55-61", "idee": "Le sol est maudit à cause de l’homme ; La peine accompagne le travail.", "args": "« Maudit soit le sol à cause de toi » : la terre ne donne plus spontanément ses fruits, elle produit « épines et chardons ». L’homme tirera sa nourriture « dans la peine », tous les jours de sa vie. Le travail est lié à la souffrance.", "lien": "Si la peine accompagne le travail, il devient une nécessité vitale : l’homme doit tirer sa nourriture à la sueur de son visage."}, {"l": "62-65", "idee": "Le travail est une nécessité vitale ; Le travail est lié à la mort.", "args": "La nourriture s’obtient « en cultivant les champs » : l’homme doit travailler pour survivre. Il durera « jusqu’à ce que tu retournes à la terre ». La peine du travail rappelle la condition mortelle de l’homme : « tu es poussière ».", "lien": "Ce travail est lié à la finitude : l’homme retournera à la poussière dont il vient."}], "concepts": [{"c": "Punition", "s": "Peine infligée à la suite d’une faute. Ici, la peine est liée à la désobéissance à l’interdit divin."}, {"c": "Sueur", "s": "Image de la fatigue physique : le travail se fait au prix de l’effort et de la peine."}, {"c": "Nécessité", "s": "Ce qui s’impose sans choix possible. L’homme doit travailler pour vivre."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que le travail serait une condition naturelle et heureuse de l’homme.</p><p><b>Le problème.</b> Le travail est-il une condition heureuse ou une peine pour l’homme ?</p><p><b>L’enjeu.</b> Le texte est un récit : il faut comprendre ce qu’il dit de la condition humaine au-delà de l’histoire racontée.</p><p><b>Formule.</b> « On dit souvent que le travail serait une condition naturelle et heureuse de l’homme, mais La Bible soutient : Le travail est présenté comme une punition consécutive à la faute : il est pénible, il est lié à la finitude de l’homme, qui retourne à la poussière dont il vient. »</p><p><b>Discussion.</b> Une vision du travail comme fatalité. L’étymologie latine du mot travail (tripalium, instrument de torture) va dans le même sens. Mais le travail n’est-il que peine ? (À comparer avec Hegel.)</p>", "intro": ["On croit souvent que le travail est une condition naturelle de l’homme, ou même une source de bonheur. Dans ce récit de la <i>Genèse</i> (chapitre 3), il apparaît comme la conséquence d’une punition.", "La Bible soutient la thèse suivante : Le travail est présenté comme une punition consécutive à la faute : il est pénible, il est lié à la finitude de l’homme, qui retourne à la poussière dont il vient. Le texte est un récit : il faut comprendre ce qu’il dit de la condition humaine au-delà de l’histoire racontée.", "Le texte avance en trois temps. Des lignes 1 à 54 : « Une faute précède la peine ». Des lignes 55 à 61 : « Le sol est maudit à cause de l’homme » ; « La peine accompagne le travail ». Des lignes 62 à 65 : « Le travail est une nécessité vitale » ; « Le travail est lié à la mort »."], "dev": [{"l": "1-54", "obj": "Une faute précède la peine.", "sp": ["<b>Une faute précède la peine.</b> Parce que l’homme a mangé le fruit que Dieu avait interdit, Dieu le condamne. Le travail n’existe pas dans la situation originelle du jardin."], "tr": "Après avoir raconté la faute (la désobéissance à l’interdit), le texte montre le jugement : le sol est maudit à cause de l’homme et le travail devient peine."}, {"l": "55-61", "obj": "Le sol est maudit à cause de l’homme ; La peine accompagne le travail.", "sp": ["<b>Le sol est maudit à cause de l’homme.</b> « Maudit soit le sol à cause de toi » : la terre ne donne plus spontanément ses fruits, elle produit « épines et chardons ».", "<b>La peine accompagne le travail.</b> L’homme tirera sa nourriture « dans la peine », tous les jours de sa vie. Le travail est lié à la souffrance."], "tr": "Si la peine accompagne le travail, il devient une nécessité vitale : l’homme doit tirer sa nourriture à la sueur de son visage."}, {"l": "62-65", "obj": "Le travail est une nécessité vitale ; Le travail est lié à la mort.", "sp": ["<b>Le travail est une nécessité vitale.</b> La nourriture s’obtient « en cultivant les champs » : l’homme doit travailler pour survivre.", "<b>Le travail est lié à la mort.</b> Il durera « jusqu’à ce que tu retournes à la terre ». La peine du travail rappelle la condition mortelle de l’homme : « tu es poussière »."], "tr": ""}], "concl": ["Le texte se demande : « Le travail est-il une condition heureuse ou une peine pour l’homme ? » La Bible répond ainsi : Le travail est présenté comme une punition consécutive à la faute : il est pénible, il est lié à la finitude de l’homme, qui retourne à la poussière dont il vient.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « Une faute précède la peine » puis « Le sol est maudit à cause de l’homme ; La peine accompagne le travail » puis « Le travail est une nécessité vitale ; Le travail est lié à la mort ».", "On peut enfin discuter cette thèse. Une vision du travail comme fatalité. L’étymologie latine du mot travail (tripalium, instrument de torture) va dans le même sens. Mais le travail n’est-il que peine ? (À comparer avec Hegel.)"]}, {"id": "travail-hegel", "label": "Hegel : le maître et le serviteur", "theme": "Le travail", "auteur": "Hegel", "oeuvre": "Phénoménologie de l’esprit", "fiche": "travail-hegel.html", "lignes": ["Il semblait que, dans et par le travail, l'Esclave est", "asservi à la Nature, à la chose, à la « matière", "première », tandis que le Maître, qui se contente de", "consommer la chose préparée par l'Esclave et d'en", "jouir, est parfaitement libre vis-à-vis d'elle. Mais", "en fait il n'en est rien. Certes, le Désir du Maître", "s'est réservé le pur acte-de-nier l'objet en le", "consommant, et il s'est réservé - par cela même - le", "sentiment de-soi-et-de-sa-dignité non mélangé éprouvé", "dans la jouissance. Mais pour la même raison cette", "satisfaction n'est elle-même qu'un évanouissement ;", "car il lui manque l'aspect objectif-ou-chosiste,", "c'est-à-dire le maintien-stable.", "Le Maître, qui ne travaille pas, ne produit rien de", "stable en dehors de soi. Il détruit seulement les", "produits du travail de l'Esclave. Sa jouissance et sa", "satisfaction restent ainsi purement subjectives :", "elles n'intéressent que lui et ne peuvent donc être", "reconnues que par lui ; elles n'ont pas de « vérité »,", "de réalité objective révélée à tous. Aussi, cette «", "consommation », cette jouissance oisive de Maître, qui", "résulte de la satisfaction « immédiate » du désir,", "peut tout au plus procurer quelque plaisir à l'homme ;", "elle ne peut jamais lui donner la satisfaction", "complète et définitive. Le travail est par contre un", "Désir refoulé, un évanouissement arrêté ; ou en", "d’autres termes, il forme et éduque.", "Le travail transforme le Monde et civilise, éduque", "l'Homme. L'homme qui veut - ou doit - travailler, doit", "refouler son instinct qui le pousse à « consommer » «", "immédiatement » l'objet « brut ».", "Et l'esclave ne peut travailler pour le Maître, c'est-", "à-dire pour un autre que lui, qu'en refoulant ses", "propres désirs. Il se transcende donc en travaillant ;", "ou si l'on préfère, il s'éduque, il « cultive », il «", "sublime » ses instincts en les refoulant. D'autre", "part, il ne détruit pas la chose telle qu'elle est", "donnée. Il diffère la destruction de la chose en la", "transformant d’abord par le travail ; il la prépare", "pour la consommation ; c'est-à-dire il la « forme ».", "Dans le travail, il transforme les choses et se", "transforme en même temps lui-même : il forme les", "choses et le monde en se transformant, en s'éduquant", "soi-même ; et il s'éduque, il se forme, en", "transformant des choses et le Monde."], "mots": "Mots-clés : Désir refoulé, Jouissance immédiate, Sublimer.", "lire": "<p><b>Objet du texte.</b> Qui est libre, du maître qui jouit ou du serviteur qui travaille ? <b>Notion du programme.</b> Le travail.</p><p><b>Connecteurs repérés.</b> « mais » (l.5), « car » (l.12), « ainsi » (l.17), « donc » (l.18), « si… » (l.35). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Désir refoulé</i> : désir retenu au lieu d’être satisfait immédiatement. C’est ce qui, dans le travail, discipline et éduque. ; <i>Jouissance immédiate</i> : satisfaction qui consiste à consommer sans transformer. Elle ne laisse rien de durable. ; <i>Sublimer</i> : transformer un instinct en activité plus élevée, ici par la contrainte du travail.</p>", "these": "<p><b>Thèse.</b> Le maître, qui consomme sans produire, ne parvient qu’à une satisfaction éphémère. Le serviteur, en travaillant, refoule ses désirs, transforme le monde et se forme lui-même : le travail est éducation et libération.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « Une apparence trompeuse » ; « La jouissance du maître est évanescente » ; « Une satisfaction non reconnue » ; « Le travail, désir refoulé » ; « Transformer le monde, se transformer soi-même ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-13", "idee": "Une apparence trompeuse ; La jouissance du maître est évanescente.", "args": "Il semble que l’esclave soit asservi à la nature et à la matière, alors que le maître, qui jouit du produit, serait libre. Mais « il n’en est rien ». Le maître ne produit rien de stable. Il détruit les produits du travail. Sa satisfaction, purement subjective, ne dure pas.", "lien": "Après avoir montré que la jouissance du maître est évanescente, Hegel précise que sa satisfaction n’est pas reconnue."}, {"l": "14-25", "idee": "Une satisfaction non reconnue.", "args": "Elle n’a pas de réalité objective : elle n’intéresse que lui. Elle ne peut jamais être complète et définitive.", "lien": "Si le maître ne produit rien et détruit seulement les produits du serviteur, il reste dans une jouissance oisive ; le travail, au contraire, est un désir refoulé."}, {"l": "25-45", "idee": "Le travail, désir refoulé ; Transformer le monde, se transformer soi-même.", "args": "L’esclave doit refouler ses désirs pour travailler pour un autre. Il se discipline, il « sublime » ses instincts. Il ne détruit pas la chose, il la forme. Ce faisant, il s’éduque : le travail civilise.", "lien": "Le travail transforme le monde et le serviteur lui-même : il est éducation et libération."}], "concepts": [{"c": "Désir refoulé", "s": "Désir retenu au lieu d’être satisfait immédiatement. C’est ce qui, dans le travail, discipline et éduque."}, {"c": "Jouissance immédiate", "s": "Satisfaction qui consiste à consommer sans transformer. Elle ne laisse rien de durable."}, {"c": "Sublimer", "s": "Transformer un instinct en activité plus élevée, ici par la contrainte du travail."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que le maître, qui jouit sans travailler, serait libre, et le serviteur, qui travaille, dépendant.</p><p><b>Le problème.</b> Qui est libre, du maître qui jouit ou du serviteur qui travaille ?</p><p><b>L’enjeu.</b> Cette thèse est paradoxale : comment celui qui obéit et peine peut-il être plus libre que celui qui commande et jouit ?</p><p><b>Formule.</b> « On dit souvent que le maître, qui jouit sans travailler, serait libre, et le serviteur, qui travaille, dépendant, mais Hegel soutient : Le maître, qui consomme sans produire, ne parvient qu’à une satisfaction éphémère. »</p><p><b>Discussion.</b> Une servitude qui libère ? Hegel renverse l’idée commune : le travail éduque. Tout travail éduque-t-il, y compris le travail répétitif ? (À comparer avec Marx.)</p>", "intro": ["On croit volontiers que le maître, qui jouit sans travailler, est libre, et que le serviteur, qui travaille, est dépendant. Dans la <i>Phénoménologie de l’esprit</i>, Hegel soutient que c’est l’inverse.", "Hegel soutient la thèse suivante : Le maître, qui consomme sans produire, ne parvient qu’à une satisfaction éphémère. Le serviteur, en travaillant, refoule ses désirs, transforme le monde et se forme lui-même : le travail est éducation et libération. Cette thèse est paradoxale : comment celui qui obéit et peine peut-il être plus libre que celui qui commande et jouit ?", "Le texte avance en trois temps. Des lignes 1 à 13 : « Une apparence trompeuse » ; « La jouissance du maître est évanescente ». Des lignes 14 à 25 : « Une satisfaction non reconnue ». Des lignes 25 à 45 : « Le travail, désir refoulé » ; « Transformer le monde, se transformer soi-même »."], "dev": [{"l": "1-13", "obj": "Une apparence trompeuse ; La jouissance du maître est évanescente.", "sp": ["<b>Une apparence trompeuse.</b> Il semble que l’esclave soit asservi à la nature et à la matière, alors que le maître, qui jouit du produit, serait libre. Mais « il n’en est rien ».", "<b>La jouissance du maître est évanescente.</b> Le maître ne produit rien de stable. Il détruit les produits du travail. Sa satisfaction, purement subjective, ne dure pas."], "tr": "Après avoir montré que la jouissance du maître est évanescente, Hegel précise que sa satisfaction n’est pas reconnue."}, {"l": "14-25", "obj": "Une satisfaction non reconnue.", "sp": ["<b>Une satisfaction non reconnue.</b> Elle n’a pas de réalité objective : elle n’intéresse que lui. Elle ne peut jamais être complète et définitive."], "tr": "Si le maître ne produit rien et détruit seulement les produits du serviteur, il reste dans une jouissance oisive ; le travail, au contraire, est un désir refoulé."}, {"l": "25-45", "obj": "Le travail, désir refoulé ; Transformer le monde, se transformer soi-même.", "sp": ["<b>Le travail, désir refoulé.</b> L’esclave doit refouler ses désirs pour travailler pour un autre. Il se discipline, il « sublime » ses instincts.", "<b>Transformer le monde, se transformer soi-même.</b> Il ne détruit pas la chose, il la forme. Ce faisant, il s’éduque : le travail civilise."], "tr": ""}], "concl": ["Le texte se demande : « Qui est libre, du maître qui jouit ou du serviteur qui travaille ? » Hegel répond ainsi : Le maître, qui consomme sans produire, ne parvient qu’à une satisfaction éphémère. Le serviteur, en travaillant, refoule ses désirs, transforme le monde et se forme lui-même : le travail est éducation et libération.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « Une apparence trompeuse ; La jouissance du maître est évanescente » puis « Une satisfaction non reconnue » puis « Le travail, désir refoulé ; Transformer le monde, se transformer soi-même ».", "On peut enfin discuter cette thèse. Une servitude qui libère ? Hegel renverse l’idée commune : le travail éduque. Tout travail éduque-t-il, y compris le travail répétitif ? (À comparer avec Marx.)"]}, {"id": "travail-marx-specificite", "label": "Marx : la spécificité du travail humain", "theme": "Le travail", "auteur": "Marx", "oeuvre": "Le Capital", "fiche": "travail-marx-specificite.html", "lignes": ["Notre point de départ, c’est le travail sous une forme", "qui appartient exclusivement à l’homme. Une araignée", "fait des opérations qui ressemblent à celle du", "tisserand, et l’abeille confond par la structure de", "ses cellules l’habileté de plus d’un architecte.", "Mais ce qui distingue dès l’abord le plus mauvais", "architecte de l’abeille la plus experte, c’est qu’il a", "construit la cellule dans sa tête avant de la", "construire dans la ruche. Le résultat auquel le", "travail aboutit préexiste idéalement dans", "l’imagination du travailleur. Ce n’est pas qu’il opère", "seulement un changement de forme dans les matières", "naturelles ; il y réalise du même coup son propre but", "dont il a conscience, qui détermine comme loi son mode", "d’action, et auquel il doit subordonner sa volonté. Et", "cette subordination n’est pas momentanée. L’œuvre", "exige pendant toute sa durée, outre l’effort des", "organes qui agissent, une attention soutenue, laquelle", "ne peut elle-même résulter que d’une tension constante", "de la volonté. Elle l’exige d’autant plus que, par son", "objet et son mode d’exécution, le travail enchaîne", "moins le travailleur, qu’il se fait moins sentir à lui", "comme le libre jeu de ses forces corporelles et", "intellectuelles ; en un mot, qu’il est moins", "attrayant."], "mots": "Mots-clés : Imagination, But conscient, Subordonner sa volonté.", "lire": "<p><b>Objet du texte.</b> Qu’est-ce qui distingue le travail humain de l’activité animale ? <b>Notion du programme.</b> Le travail.</p><p><b>Connecteurs repérés.</b> « mais » (l.6). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Imagination</i> : faculté de se représenter ce qui n’existe pas encore. Le plan précède la réalisation. ; <i>But conscient</i> : fin que l’on se représente et que l’on poursuit volontairement. ; <i>Subordonner sa volonté</i> : soumettre sa volonté à un but, pendant toute la durée du travail.</p>", "these": "<p><b>Thèse.</b> Le travail humain réalise un but conscient, présent d’abord dans l’imagination. Ce but détermine comme une loi la manière d’agir et exige une tension constante de la volonté.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « Un travail exclusivement humain » ; « Les animaux font des opérations semblables » ; « Le but préexiste dans la tête » ; « Le but est une loi pour la volonté » ; « Une attention soutenue, un effort ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-5", "idee": "Un travail exclusivement humain ; Les animaux font des opérations semblables.", "args": "Marx part du travail « sous une forme qui appartient exclusivement à l’homme ». L’araignée ressemble au tisserand, l’abeille « confond » l’habileté d’un architecte par ses cellules.", "lien": "Après avoir isolé le travail sous sa forme exclusivement humaine, Marx le compare aux opérations de l’araignée ou de l’abeille, qui lui ressemblent."}, {"l": "6-16", "idee": "Le but préexiste dans la tête ; Le but est une loi pour la volonté.", "args": "Le plus mauvais architecte a construit la cellule dans sa tête avant de la construire. Le résultat existe d’abord de façon idéale dans l’imagination. Le travailleur ne fait pas que changer la forme de la matière : il réalise un but conscient auquel il subordonne sa volonté.", "lien": "Ce qui distingue le travail humain, c’est que le but préexiste dans la tête ; il détermine comme une loi la manière d’agir."}, {"l": "16-25", "idee": "Une attention soutenue, un effort.", "args": "Le travail exige une tension constante de la volonté, d’autant plus que son objet le rend moins attrayant.", "lien": "Cette subordination à un but exige une attention soutenue : un effort de la volonté pendant toute la durée du travail."}], "concepts": [{"c": "Imagination", "s": "Faculté de se représenter ce qui n’existe pas encore. Le plan précède la réalisation."}, {"c": "But conscient", "s": "Fin que l’on se représente et que l’on poursuit volontairement."}, {"c": "Subordonner sa volonté", "s": "Soumettre sa volonté à un but, pendant toute la durée du travail."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que l’animal travaillerait comme l’homme : l’araignée ou l’abeille accompliraient des opérations semblables.</p><p><b>Le problème.</b> Qu’est-ce qui distingue le travail humain de l’activité animale ?</p><p><b>L’enjeu.</b> Cette thèse n’est pas évidente : si les opérations sont semblables, en quoi le travail humain est-il différent ?</p><p><b>Formule.</b> « On dit souvent que l’animal travaillerait comme l’homme : l’araignée ou l’abeille accompliraient des opérations semblables, mais Marx soutient : Le travail humain réalise un but conscient, présent d’abord dans l’imagination. »</p><p><b>Discussion.</b> L’animal pense-t-il ? Marx tranche nettement : l’animal n’a pas de projet. Les recherches sur l’intelligence animale remettent-elles ce critère en cause ? (À comparer avec Pascal.)</p>", "intro": ["On dit souvent que les animaux travaillent comme les hommes : l’araignée tisse, l’abeille construit. Dans <i>Le Capital</i>, Marx soutient que le travail humain est spécifique.", "Marx soutient la thèse suivante : Le travail humain réalise un but conscient, présent d’abord dans l’imagination. Ce but détermine comme une loi la manière d’agir et exige une tension constante de la volonté. Cette thèse n’est pas évidente : si les opérations sont semblables, en quoi le travail humain est-il différent ?", "Le texte avance en trois temps. Des lignes 1 à 5 : « Un travail exclusivement humain » ; « Les animaux font des opérations semblables ». Des lignes 6 à 16 : « Le but préexiste dans la tête » ; « Le but est une loi pour la volonté ». Des lignes 16 à 25 : « Une attention soutenue, un effort »."], "dev": [{"l": "1-5", "obj": "Un travail exclusivement humain ; Les animaux font des opérations semblables.", "sp": ["<b>Un travail exclusivement humain.</b> Marx part du travail « sous une forme qui appartient exclusivement à l’homme ».", "<b>Les animaux font des opérations semblables.</b> L’araignée ressemble au tisserand, l’abeille « confond » l’habileté d’un architecte par ses cellules."], "tr": "Après avoir isolé le travail sous sa forme exclusivement humaine, Marx le compare aux opérations de l’araignée ou de l’abeille, qui lui ressemblent."}, {"l": "6-16", "obj": "Le but préexiste dans la tête ; Le but est une loi pour la volonté.", "sp": ["<b>Le but préexiste dans la tête.</b> Le plus mauvais architecte a construit la cellule dans sa tête avant de la construire. Le résultat existe d’abord de façon idéale dans l’imagination.", "<b>Le but est une loi pour la volonté.</b> Le travailleur ne fait pas que changer la forme de la matière : il réalise un but conscient auquel il subordonne sa volonté."], "tr": "Ce qui distingue le travail humain, c’est que le but préexiste dans la tête ; il détermine comme une loi la manière d’agir."}, {"l": "16-25", "obj": "Une attention soutenue, un effort.", "sp": ["<b>Une attention soutenue, un effort.</b> Le travail exige une tension constante de la volonté, d’autant plus que son objet le rend moins attrayant."], "tr": ""}], "concl": ["Le texte se demande : « Qu’est-ce qui distingue le travail humain de l’activité animale ? » Marx répond ainsi : Le travail humain réalise un but conscient, présent d’abord dans l’imagination. Ce but détermine comme une loi la manière d’agir et exige une tension constante de la volonté.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « Un travail exclusivement humain ; Les animaux font des opérations semblables » puis « Le but préexiste dans la tête ; Le but est une loi pour la volonté » puis « Une attention soutenue, un effort ».", "On peut enfin discuter cette thèse. L’animal pense-t-il ? Marx tranche nettement : l’animal n’a pas de projet. Les recherches sur l’intelligence animale remettent-elles ce critère en cause ? (À comparer avec Pascal.)"]}, {"id": "travail-marx-alienation", "label": "Marx : l’aliénation par le travail", "theme": "Le travail", "auteur": "Marx", "oeuvre": "Manuscrits de 1844", "fiche": "travail-marx-alienation.html", "lignes": ["Nous partons d’un fait économique actuel.", "L’ouvrier devient d’autant plus pauvre qu’il produit", "plus de richesse, que sa production croît en puissance", "et en volume. L’ouvrier devient une marchandise", "d’autant plus vile qu’il crée plus de marchandises. La", "dépréciation du monde des hommes augmente en raison", "directe de la mise en valeur du monde des choses. Le", "travail ne produit pas que des marchandises ; il se", "produit lui-même et produit l’ouvrier en tant que", "marchandise, et cela dans la mesure où il produit des", "marchandises en général.", "Ce fait n’exprime rien d’autre que ceci : l’objet que", "le travail produit, son produit, l’affronte comme un", "être étranger, comme une puissance indépendante du", "producteur. Le produit du travail est le travail qui", "s’est fixé, concrétisé dans un objet, il est", "l’objectivation du travail. L’actualisation du travail", "est son objectivation. Au stade de l’économie, cette", "actualisation du travail apparaît comme la perte pour", "l’ouvrier de sa réalité, l’objectivation comme la", "perte de l’objet ou l’asservissement à celui-ci,", "l’appropriation comme l’aliénation, le", "dessaisissement.", "Toutes ces conséquences se trouvent dans cette", "détermination : l’ouvrier est à l’égard du produit de", "son travail dans le même rapport qu’à l’égard d’un", "objet étranger. Car ceci est évident par hypothèse :", "plus l’ouvrier s’extériorise dans son travail, plus le", "monde étranger, objectif, qu’il crée en face de lui,", "devient puissant, plus il s’appauvrit lui-même et plus", "son monde intérieur devient pauvre, moins il possède", "en propre. Il en va de même dans la religion. Plus", "l’homme met de choses en Dieu, moins il en garde en", "lui-même. L’ouvrier met sa vie dans l’objet. Mais", "alors, celle-ci ne lui appartient plus, elle", "appartient à l’objet. Donc plus cette activité est", "grande, plus l’ouvrier est sans objet. Il n’est pas ce", "qu’est le produit de son travail. Donc, plus ce", "produit est grand, moins il est lui-même. L’aliénation", "de l’ouvrier dans son produit signifie non seulement", "que son travail devient un objet, une existence", "extérieure, mais que son travail existe en dehors de", "lui, indépendamment de lui, étranger à lui, et devient", "une puissance autonome vis-à-vis de lui, que la vie", "qu’il a prêtée à l’objet s’oppose à lui, hostile et", "étrangère."], "mots": "Mots-clés : Aliénation, Objectivation, Marchandise.", "lire": "<p><b>Objet du texte.</b> Pourquoi le travail devient-il, pour l’ouvrier, une perte de lui-même ? <b>Notion du programme.</b> Le travail.</p><p><b>Connecteurs repérés.</b> « car » (l.27), « mais » (l.34), « alors » (l.35), « donc » (l.36). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Aliénation</i> : dépossession : ce qui devrait appartenir à l’homme lui devient étranger et se retourne contre lui. ; <i>Objectivation</i> : passage du travail dans un objet. Elle devrait être une réalisation, mais devient une perte. ; <i>Marchandise</i> : objet destiné à être vendu. L’ouvrier lui-même est réduit à cela.</p>", "these": "<p><b>Thèse.</b> Le produit du travail échappe à l’ouvrier et s’oppose à lui comme une puissance étrangère : plus il s’extériorise dans son travail, plus il s’appauvrit. C’est l’aliénation.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « Un fait économique actuel » ; « L’ouvrier devient une marchandise » ; « Le produit affronte le producteur » ; « Plus il s’extériorise, plus il s’appauvrit » ; « Le parallèle avec la religion ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-17", "idee": "Un fait économique actuel ; L’ouvrier devient une marchandise ; Le produit affronte le producteur.", "args": "Marx part d’un constat : l’ouvrier est d’autant plus pauvre qu’il produit plus de richesse. Il devient une marchandise d’autant plus vile qu’il crée plus de marchandises : le travail produit aussi l’ouvrier comme marchandise. Le produit est le travail objectivé. Mais il se dresse devant l’ouvrier comme un être étranger et indépendant.", "lien": "Après avoir parti d’un fait économique (l’ouvrier s’appauvrit en produisant), Marx l’explique : le produit du travail s’oppose au producteur comme une puissance étrangère."}, {"l": "18-32", "idee": "Plus il s’extériorise, plus il s’appauvrit.", "args": "La vie que l’ouvrier met dans l’objet ne lui appartient plus. Son monde intérieur devient pauvre.", "lien": "Plus l’ouvrier s’extériorise dans son travail, plus il s’appauvrit : Marx en tire la loi de l’aliénation."}, {"l": "32-46", "idee": "Le parallèle avec la religion.", "args": "« Plus l’homme met de choses en Dieu, moins il en garde en lui-même » : l’ouvrier se vide dans son produit comme le croyant dans son Dieu.", "lien": "Le parallèle avec la religion éclaire cette loi : plus l’homme met en Dieu, moins il garde en lui ; l’ouvrier met sa vie dans l’objet, qui ne lui appartient plus."}], "concepts": [{"c": "Aliénation", "s": "Dépossession : ce qui devrait appartenir à l’homme lui devient étranger et se retourne contre lui."}, {"c": "Objectivation", "s": "Passage du travail dans un objet. Elle devrait être une réalisation, mais devient une perte."}, {"c": "Marchandise", "s": "Objet destiné à être vendu. L’ouvrier lui-même est réduit à cela."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que le travail serait pour l’ouvrier une réalisation de soi.</p><p><b>Le problème.</b> Pourquoi le travail devient-il, pour l’ouvrier, une perte de lui-même ?</p><p><b>L’enjeu.</b> Cette thèse est paradoxale : comment le travail, qui crée des objets, peut-il appauvrir celui qui l’accomplit ?</p><p><b>Formule.</b> « On dit souvent que le travail serait pour l’ouvrier une réalisation de soi, mais Marx soutient : Le produit du travail échappe à l’ouvrier et s’oppose à lui comme une puissance étrangère : plus il s’extériorise dans son travail, plus il s’appauvrit. »</p><p><b>Discussion.</b> Aliénation du travail et organisation du travail. L’ouvrier qui ne possède pas ce qu’il produit est-il le seul concerné ? Qu’en est-il des travailleurs d’aujourd’hui ? (À comparer avec Hegel.)</p>", "intro": ["On croit souvent que le travail permet à l’homme de se réaliser en produisant des objets. Dans les <i>Manuscrits de 1844</i>, Marx montre que, dans l’économie capitaliste, le travail devient pour l’ouvrier une perte de lui-même.", "Marx soutient la thèse suivante : Le produit du travail échappe à l’ouvrier et s’oppose à lui comme une puissance étrangère : plus il s’extériorise dans son travail, plus il s’appauvrit. C’est l’aliénation. Cette thèse est paradoxale : comment le travail, qui crée des objets, peut-il appauvrir celui qui l’accomplit ?", "Le texte avance en trois temps. Des lignes 1 à 17 : « Un fait économique actuel » ; « L’ouvrier devient une marchandise » ; « Le produit affronte le producteur ». Des lignes 18 à 32 : « Plus il s’extériorise, plus il s’appauvrit ». Des lignes 32 à 46 : « Le parallèle avec la religion »."], "dev": [{"l": "1-17", "obj": "Un fait économique actuel ; L’ouvrier devient une marchandise ; Le produit affronte le producteur.", "sp": ["<b>Un fait économique actuel.</b> Marx part d’un constat : l’ouvrier est d’autant plus pauvre qu’il produit plus de richesse.", "<b>L’ouvrier devient une marchandise.</b> Il devient une marchandise d’autant plus vile qu’il crée plus de marchandises : le travail produit aussi l’ouvrier comme marchandise.", "<b>Le produit affronte le producteur.</b> Le produit est le travail objectivé. Mais il se dresse devant l’ouvrier comme un être étranger et indépendant."], "tr": "Après avoir parti d’un fait économique (l’ouvrier s’appauvrit en produisant), Marx l’explique : le produit du travail s’oppose au producteur comme une puissance étrangère."}, {"l": "18-32", "obj": "Plus il s’extériorise, plus il s’appauvrit.", "sp": ["<b>Plus il s’extériorise, plus il s’appauvrit.</b> La vie que l’ouvrier met dans l’objet ne lui appartient plus. Son monde intérieur devient pauvre."], "tr": "Plus l’ouvrier s’extériorise dans son travail, plus il s’appauvrit : Marx en tire la loi de l’aliénation."}, {"l": "32-46", "obj": "Le parallèle avec la religion.", "sp": ["<b>Le parallèle avec la religion.</b> « Plus l’homme met de choses en Dieu, moins il en garde en lui-même » : l’ouvrier se vide dans son produit comme le croyant dans son Dieu."], "tr": ""}], "concl": ["Le texte se demande : « Pourquoi le travail devient-il, pour l’ouvrier, une perte de lui-même ? » Marx répond ainsi : Le produit du travail échappe à l’ouvrier et s’oppose à lui comme une puissance étrangère : plus il s’extériorise dans son travail, plus il s’appauvrit. C’est l’aliénation.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « Un fait économique actuel ; L’ouvrier devient une marchandise ; Le produit affronte le producteur » puis « Plus il s’extériorise, plus il s’appauvrit » puis « Le parallèle avec la religion ».", "On peut enfin discuter cette thèse. Aliénation du travail et organisation du travail. L’ouvrier qui ne possède pas ce qu’il produit est-il le seul concerné ? Qu’en est-il des travailleurs d’aujourd’hui ? (À comparer avec Hegel.)"]}, {"id": "travail-russell", "label": "Russell : éloge de l’oisiveté", "theme": "Le travail", "auteur": "Russell", "oeuvre": "Éloge de l’oisiveté", "fiche": "travail-russell.html", "lignes": ["Lorsque je suggère qu’il faudrait ramener à quatre les", "heures de travail, cela n’implique pas, à mon sens,", "que tout le temps restant doive nécessairement être", "passé en pures futilités. Je veux dire que travailler", "quatre heures par jour devrait donner le droit à", "chacun de jouir des nécessités et des commodités", "élémentaires de la vie, et que le temps restant serait", "employé par chacun comme il l’entend. Dans un tel", "système social il est essentiel que l’éducation soit", "plus ambitieuse qu’elle ne l’est ordinairement", "aujourd’hui. Elle devrait en partie viser à développer", "des goûts permettant à l’individu d’employer ses", "loisirs intelligemment. […] Autrefois, il y avait une", "classe de loisir plus restreinte et une classe", "laborieuse plus étendue.", "La classe de loisir jouissait de privilèges sans", "fondement du point de vue de la justice sociale ; ce", "qui lui conférait nécessairement une inclination à", "l’oppression, mais pas à la compassion, et l’obligeait", "à bâtir des théories pour justifier ses privilèges.", "Nonobstant ces faits qui atténuent considérablement", "son éclat, c’est à cette classe que nous devons la", "quasi-totalité de ce que nous appelons la", "civilisation. Elle cultiva les arts et découvrit les", "sciences ;elle écrivit les livres, inventa les", "philosophies, et affina les relations sociales. Même", "la libération des opprimés est en général partie d’en", "haut. Sans la classe de loisir, le genre humain ne", "serait jamais sorti de la barbarie.", "La bonté est, de toutes les qualités morales, celle", "dont le monde a le plus besoin, or la bonté est la", "conséquence du bien-être et de la sérénité, et non", "d’une vie de lutte acharnée. Les méthodes de", "production modernes nous ont donné la possibilité", "d’offrir à tous bien-être et sérénité. Nous avons", "choisi, à la place, le surmenage pour les uns et la", "misère pour les autres. Jusqu’à présent nous avons", "continué à nous agiter comme nous le faisions avant", "d’avoir des machines ; en cela nous nous sommes", "montrés bien bêtes, mais il n’y a aucune raison de", "nous entêter dans cette voie."], "mots": "Mots-clés : Oisiveté, Classe de loisir, Justice sociale.", "lire": "<p><b>Objet du texte.</b> Faut-il réduire le temps de travail, et pour quoi faire ? <b>Notion du programme.</b> Le travail.</p><p><b>Connecteurs repérés.</b> « mais » (l.19), « or » (l.31). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Oisiveté</i> : ici : le fait de disposer de temps libre, non au sens de paresse, mais de loisir cultivé. ; <i>Classe de loisir</i> : groupe social dispensé de travailler, dont les privilèges étaient injustes mais qui a fait avancer la civilisation. ; <i>Justice sociale</i> : répartition équitable des biens et des charges. Les privilèges de la classe de loisir en étaient dépourvus.</p>", "these": "<p><b>Thèse.</b> Grâce aux machines, quatre heures de travail suffiraient. Le temps libre, bien employé grâce à l’éducation, permettrait à tous ce que seule la classe de loisir a accompli : civilisation, bonté, sérénité.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « Quatre heures de travail » ; « Un temps libre bien employé » ; « L’héritage de la classe de loisir » ; « La bonté vient du bien-être » ; « Un choix absurde ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-13", "idee": "Quatre heures de travail ; Un temps libre bien employé.", "args": "Russell propose de ramener le travail à quatre heures par jour, suffisantes pour jouir des nécessités et des commodités élémentaires. Le temps restant ne sera pas forcément passé en futilités. Il faut une éducation plus ambitieuse pour développer des goûts.", "lien": "Après avoir proposé de ramener le travail à quatre heures, Russell dit comment employer le temps libre : par l’éducation, qui développe des goûts."}, {"l": "13-29", "idee": "L’héritage de la classe de loisir.", "args": "Autrefois, une classe de loisir jouissait de privilèges injustes et justifiait ses privilèges. Mais c’est à elle que nous devons arts, sciences, philosophies.", "lien": "Si le temps libre est bien employé, il permet ce que seule la classe de loisir a accompli : arts, sciences, civilisation."}, {"l": "30-41", "idee": "La bonté vient du bien-être ; Un choix absurde.", "args": "La bonté est la qualité dont le monde a le plus besoin, et elle est la conséquence du bien-être et de la sérénité, non d’une vie de lutte acharnée. Les machines permettent d’offrir à tous bien-être et sérénité. Nous avons choisi le surmenage pour les uns et la misère pour les autres.", "lien": "La bonté vient du bien-être : les machines nous en ont donné les moyens, et nous avons choisi le surmenage, choix absurde."}], "concepts": [{"c": "Oisiveté", "s": "Ici : le fait de disposer de temps libre, non au sens de paresse, mais de loisir cultivé."}, {"c": "Classe de loisir", "s": "Groupe social dispensé de travailler, dont les privilèges étaient injustes mais qui a fait avancer la civilisation."}, {"c": "Justice sociale", "s": "Répartition équitable des biens et des charges. Les privilèges de la classe de loisir en étaient dépourvus."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que le travail serait une vertu en soi, et qu’il faudrait travailler le plus possible.</p><p><b>Le problème.</b> Faut-il réduire le temps de travail, et pour quoi faire ?</p><p><b>L’enjeu.</b> Cette thèse n’est pas évidente : à quoi servirait ce temps libre, et pourquoi ne serait-il pas gaspillé ?</p><p><b>Formule.</b> « On dit souvent que le travail serait une vertu en soi, et qu’il faudrait travailler le plus possible, mais Russell soutient : Grâce aux machines, quatre heures de travail suffiraient. »</p><p><b>Discussion.</b> Un loisir pour tous ? Aristote réservait le loisir à quelques-uns. Russell veut l’étendre à tous. Est-ce réaliste dans nos sociétés ? (À comparer avec Aristote.)</p>", "intro": ["On croit souvent que le travail est une vertu en soi, et qu’il faut travailler le plus possible. Dans <i>Éloge de l’oisiveté</i>, Russell soutient qu’il faudrait réduire à quatre heures le temps de travail quotidien.", "Russell soutient la thèse suivante : Grâce aux machines, quatre heures de travail suffiraient. Le temps libre, bien employé grâce à l’éducation, permettrait à tous ce que seule la classe de loisir a accompli : civilisation, bonté, sérénité. Cette thèse n’est pas évidente : à quoi servirait ce temps libre, et pourquoi ne serait-il pas gaspillé ?", "Le texte avance en trois temps. Des lignes 1 à 13 : « Quatre heures de travail » ; « Un temps libre bien employé ». Des lignes 13 à 29 : « L’héritage de la classe de loisir ». Des lignes 30 à 41 : « La bonté vient du bien-être » ; « Un choix absurde »."], "dev": [{"l": "1-13", "obj": "Quatre heures de travail ; Un temps libre bien employé.", "sp": ["<b>Quatre heures de travail.</b> Russell propose de ramener le travail à quatre heures par jour, suffisantes pour jouir des nécessités et des commodités élémentaires.", "<b>Un temps libre bien employé.</b> Le temps restant ne sera pas forcément passé en futilités. Il faut une éducation plus ambitieuse pour développer des goûts."], "tr": "Après avoir proposé de ramener le travail à quatre heures, Russell dit comment employer le temps libre : par l’éducation, qui développe des goûts."}, {"l": "13-29", "obj": "L’héritage de la classe de loisir.", "sp": ["<b>L’héritage de la classe de loisir.</b> Autrefois, une classe de loisir jouissait de privilèges injustes et justifiait ses privilèges. Mais c’est à elle que nous devons arts, sciences, philosophies."], "tr": "Si le temps libre est bien employé, il permet ce que seule la classe de loisir a accompli : arts, sciences, civilisation."}, {"l": "30-41", "obj": "La bonté vient du bien-être ; Un choix absurde.", "sp": ["<b>La bonté vient du bien-être.</b> La bonté est la qualité dont le monde a le plus besoin, et elle est la conséquence du bien-être et de la sérénité, non d’une vie de lutte acharnée.", "<b>Un choix absurde.</b> Les machines permettent d’offrir à tous bien-être et sérénité. Nous avons choisi le surmenage pour les uns et la misère pour les autres."], "tr": ""}], "concl": ["Le texte se demande : « Faut-il réduire le temps de travail, et pour quoi faire ? » Russell répond ainsi : Grâce aux machines, quatre heures de travail suffiraient. Le temps libre, bien employé grâce à l’éducation, permettrait à tous ce que seule la classe de loisir a accompli : civilisation, bonté, sérénité.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « Quatre heures de travail ; Un temps libre bien employé » puis « L’héritage de la classe de loisir » puis « La bonté vient du bien-être ; Un choix absurde ».", "On peut enfin discuter cette thèse. Un loisir pour tous ? Aristote réservait le loisir à quelques-uns. Russell veut l’étendre à tous. Est-ce réaliste dans nos sociétés ? (À comparer avec Aristote.)"]}, {"id": "verite-hume", "label": "Hume : croyance raisonnable", "theme": "La vérité", "auteur": "Hume", "oeuvre": "Enquête sur l'entendement humain", "fiche": "verite-hume.html", "lignes": ["Le soleil ne se lèvera pas demain, cette proposition", "n'est pas moins intelligible et elle n'implique pas", "plus contradiction que l'affirmation : il se lèvera.", "Nous tenterions donc en vain d'en démontrer la", "fausseté. Si elle était démonstrativement fausse, elle", "impliquerait contradiction et l'esprit ne pourrait", "jamais la concevoir distinctement.", "C'est donc peut-être un sujet digne d'éveiller la", "curiosité que de rechercher quelle est la nature de", "cette évidence qui nous assure de la réalité d'une", "existence et d'un fait au-delà du témoignage actuel de", "nos sens ou des rapports de notre mémoire. […]", "Tous les raisonnements sur les faits paraissent se", "fonder sur la relation de la cause à l'effet. C'est au", "moyen de cette seule relation que nous dépassons", "l'évidence de notre mémoire et de nos sens. Si vous", "demandiez à quelqu'un pourquoi il croit à la réalité", "d'un fait qu'il ne constate pas effectivement, par", "exemple que son ami est à la campagne ou en France, il", "vous donnerait une raison ; cette raison serait un", "autre fait : une lettre qu'il a reçue ou la", "connaissance de ses résolutions antérieures et de ses", "promesses. […]", "Si donc nous désirons nous satisfaire au sujet de la", "nature de l'évidence qui nous donne la certitude des", "faits, il faut que nous recherchions comment nous", "arrivons à la connaissance de la cause et de l'effet.", "J'oserai affirmer, comme une proposition générale qui", "n'admet pas d'exception, que la connaissance de cette", "relation ne s'obtient, en aucun cas, par des", "raisonnements a priori ; mais qu'elle naît entièrement", "de l'expérience quand nous trouvons que des objets", "particuliers sont en conjonction constante l'un avec", "l'autre."], "mots": "Mots-clés : Contradiction, A priori / expérience, Conjonction constante.", "lire": "<p><b>Objet du texte.</b> Sur quoi se fonde notre certitude des faits qui dépassent ce que nous percevons ou ce dont nous nous souvenons ? <b>Notion du programme.</b> La vérité.</p><p><b>Connecteurs repérés.</b> « donc » (l.4), « si… » (l.5), « pourquoi » (l.17), « mais » (l.31). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Contradiction</i> : une proposition contradictoire ne peut pas être conçue clairement (un cercle carré). Les faits, eux, sont toujours pensables autrement : leur contraire n’est pas contradictoire. ; <i>A priori / expérience</i> : connaissance a priori : indépendante de l’expérience, par la seule raison. Hume soutient que la relation de cause à effet vient de l’expérience. ; <i>Conjonction constante</i> : deux objets toujours observés ensemble (feu et chaleur). C’est ce qui fait croire que l’un est la cause de l’autre.</p>", "these": "<p><b>Thèse.</b> Tous les raisonnements sur les faits reposent sur la relation de cause à effet, et celle-ci ne s’obtient jamais a priori : elle naît de l’expérience, de la conjonction constante des objets.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « Un fait futur n’est pas contradictoire » ; « On ne peut pas démontrer sa fausseté » ; « La question de l’évidence » ; « La cause et l’effet » ; « L’origine de cette relation ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-12", "idee": "Un fait futur n’est pas contradictoire ; On ne peut pas démontrer sa fausseté ; La question de l’évidence.", "args": "« Le soleil ne se lèvera pas demain » n’est pas moins intelligible que « il se lèvera », et n’implique pas plus contradiction. Si cette proposition était démonstrativement fausse, elle impliquerait contradiction et l’esprit ne pourrait la concevoir distinctement. Or il la conçoit. Quelle est la nature de l’évidence qui nous assure de la réalité d’un fait au-delà du témoignage actuel des sens ou de la mémoire ?", "lien": "Après avoir montré que la certitude des faits ne se démontre pas, Hume cherche sur quoi elle repose : la relation de cause à effet."}, {"l": "13-27", "idee": "La cause et l’effet.", "args": "Tous les raisonnements sur les faits se fondent sur la relation de cause à effet. Exemple : croire que son ami est en France, c’est s’appuyer sur un autre fait, une lettre reçue ou des promesses antérieures.", "lien": "Si tous les raisonnements sur les faits reposent sur cette relation, il reste à savoir d’où nous la tenons."}, {"l": "28-34", "idee": "L’origine de cette relation.", "args": "Hume l’affirme sans exception : la connaissance de la cause et de l’effet ne s’obtient jamais par des raisonnements a priori, mais de l’expérience, quand des objets sont « en conjonction constante ».", "lien": "Cette dernière étape donne la thèse : la relation de cause à effet vient de l’expérience, non d’un raisonnement a priori."}], "concepts": [{"c": "Contradiction", "s": "Une proposition contradictoire ne peut pas être conçue clairement (un cercle carré). Les faits, eux, sont toujours pensables autrement : leur contraire n’est pas contradictoire."}, {"c": "A priori / expérience", "s": "Connaissance a priori : indépendante de l’expérience, par la seule raison. Hume soutient que la relation de cause à effet vient de l’expérience."}, {"c": "Conjonction constante", "s": "Deux objets toujours observés ensemble (feu et chaleur). C’est ce qui fait croire que l’un est la cause de l’autre."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que l’on pourrait démontrer par la raison que le monde continuera comme jusqu’ici.</p><p><b>Le problème.</b> Sur quoi se fonde notre certitude des faits qui dépassent ce que nous percevons ou ce dont nous nous souvenons ?</p><p><b>L’enjeu.</b> Cette thèse n’est pas évidente : elle semble priver de fondement rationnel tout ce que nous croyons savoir de l’avenir.</p><p><b>Formule.</b> « On dit souvent que l’on pourrait démontrer par la raison que le monde continuera comme jusqu’ici, mais Hume soutient : Tous les raisonnements sur les faits reposent sur la relation de cause à effet, et celle-ci ne s’obtient jamais a priori : elle naît de l’expérience, de la conjonction constante des objets. »</p><p><b>Discussion.</b> Un scepticisme ? Si l’on ne peut démontrer ce que sera demain, que vaut la science ? Hume ne nie pas nos croyances : il montre leur nature.</p>", "intro": ["On croit volontiers que le soleil se lèvera demain avec certitude, voire qu’on peut le démontrer. Dans l’<i>Enquête sur l’entendement humain</i>, Hume se demande sur quoi repose réellement une telle certitude.", "Hume soutient la thèse suivante : Tous les raisonnements sur les faits reposent sur la relation de cause à effet, et celle-ci ne s’obtient jamais a priori : elle naît de l’expérience, de la conjonction constante des objets. Cette thèse n’est pas évidente : elle semble priver de fondement rationnel tout ce que nous croyons savoir de l’avenir.", "Le texte avance en trois temps. Des lignes 1 à 12 : « Un fait futur n’est pas contradictoire » ; « On ne peut pas démontrer sa fausseté » ; « La question de l’évidence ». Des lignes 13 à 27 : « La cause et l’effet ». Des lignes 28 à 34 : « L’origine de cette relation »."], "dev": [{"l": "1-12", "obj": "Un fait futur n’est pas contradictoire ; On ne peut pas démontrer sa fausseté ; La question de l’évidence.", "sp": ["<b>Un fait futur n’est pas contradictoire.</b> « Le soleil ne se lèvera pas demain » n’est pas moins intelligible que « il se lèvera », et n’implique pas plus contradiction.", "<b>On ne peut pas démontrer sa fausseté.</b> Si cette proposition était démonstrativement fausse, elle impliquerait contradiction et l’esprit ne pourrait la concevoir distinctement. Or il la conçoit.", "<b>La question de l’évidence.</b> Quelle est la nature de l’évidence qui nous assure de la réalité d’un fait au-delà du témoignage actuel des sens ou de la mémoire ?"], "tr": "Après avoir montré que la certitude des faits ne se démontre pas, Hume cherche sur quoi elle repose : la relation de cause à effet."}, {"l": "13-27", "obj": "La cause et l’effet.", "sp": ["<b>La cause et l’effet.</b> Tous les raisonnements sur les faits se fondent sur la relation de cause à effet. Exemple : croire que son ami est en France, c’est s’appuyer sur un autre fait, une lettre reçue ou des promesses antérieures."], "tr": "Si tous les raisonnements sur les faits reposent sur cette relation, il reste à savoir d’où nous la tenons."}, {"l": "28-34", "obj": "L’origine de cette relation.", "sp": ["<b>L’origine de cette relation.</b> Hume l’affirme sans exception : la connaissance de la cause et de l’effet ne s’obtient jamais par des raisonnements a priori, mais de l’expérience, quand des objets sont « en conjonction constante »."], "tr": ""}], "concl": ["Le texte se demande : « Sur quoi se fonde notre certitude des faits qui dépassent ce que nous percevons ou ce dont nous nous souvenons ? » Hume répond ainsi : Tous les raisonnements sur les faits reposent sur la relation de cause à effet, et celle-ci ne s’obtient jamais a priori : elle naît de l’expérience, de la conjonction constante des objets.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « Un fait futur n’est pas contradictoire ; On ne peut pas démontrer sa fausseté ; La question de l’évidence » puis « La cause et l’effet » puis « L’origine de cette relation ».", "On peut enfin discuter cette thèse. Un scepticisme ? Si l’on ne peut démontrer ce que sera demain, que vaut la science ? Hume ne nie pas nos croyances : il montre leur nature."]}, {"id": "verite-kant", "label": "Kant : mensonge et devoir", "theme": "La vérité", "auteur": "Kant", "oeuvre": "Sur un prétendu droit de mentir par humanité", "fiche": "verite-kant.html", "lignes": ["Si tu as, par exemple, empêché d'agir par un mensonge", "quelqu'un qui se trouvait avoir alors des intentions", "meurtrières, tu es responsable d'un point de vue", "juridique de toutes les conséquences qui pourraient en", "résulter. Mais si tu t'en es tenu strictement à la", "vérité, la justice publique ne peut rien te faire", "quelles que soient les conséquences imprévues. Il peut", "toutefois se produire qu'après que tu as honnêtement", "répondu oui au meurtrier qui te demandait si celui", "qu'il voulait tuer était chez toi, celui-ci soit", "cependant sorti sans être remarqué et qu'ainsi il ait", "échappé au meurtrier, que le crime alors n'ait pas eu", "lieu ; mais supposons que tu aies menti et dit qu'il", "n'était pas chez toi, et qu'il soit réellement sorti", "(bien qu'à ton insu) ; si le meurtrier le rencontrant", "en train de sortir, accomplissait son crime, tu peux", "alors être à bon droit accusé d'être la cause de sa", "mort. (...). Par conséquent celui qui ment, quelque", "bien intentionné qu'il puisse être, doit répondre des", "conséquences de son mensonge (...) et en payer le", "prix, quel que soit leur caractère imprévisible. Car", "dire la vérité constitue un devoir qui doit être", "considéré comme la base de tous les devoirs qui sont à", "fonder sur un contrat, et dont la loi, si on y tolère", "ne serait-ce que la plus petite exception, est rendue", "chancelante et vaine."], "mots": "Mots-clés : Devoir absolu, Responsabilité juridique, Contrat.", "lire": "<p><b>Objet du texte.</b> Existe-t-il des circonstances où mentir est permis, voire obligatoire, par exemple pour sauver une vie ? <b>Notion du programme.</b> La vérité.</p><p><b>Connecteurs repérés.</b> « si… » (l.1), « alors » (l.2), « mais » (l.5), « ainsi » (l.11), « cependant » (l.11), « par conséquent » (l.18). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Devoir absolu</i> : un devoir qui vaut sans exception, quelles que soient les circonstances et les intentions : c’est l’idée de Kant (voir la fiche « Le devoir »). ; <i>Responsabilité juridique</i> : être tenu de répondre devant la justice des conséquences de ses actes. Kant l’invoque pour distinguer celui qui ment de celui qui dit la vérité. ; <i>Contrat</i> : engagement entre personnes, qui suppose qu’on puisse se fier à la parole donnée. Sans exigence de vérité, aucun contrat n’est possible.</p>", "these": "<p><b>Thèse.</b> Dire la vérité est un devoir sans exception. Celui qui ment, même avec de bonnes intentions, répond de toutes les conséquences de son mensonge, y compris imprévisibles.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « Un meurtrier à la porte » ; « S’en tenir à la vérité » ; « Deux scénarios » ; « Le menteur répond des conséquences » ; « Le fondement : le contrat ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-7", "idee": "Un meurtrier à la porte ; S’en tenir à la vérité.", "args": "Un homme aux intentions meurtrières demande si sa victime est chez toi. Si tu l’as empêché d’agir par un mensonge, tu es juridiquement responsable de toutes les conséquences qui en résultent. Si tu t’en tiens strictement à la vérité, la justice publique ne peut rien te faire, quelles que soient les conséquences imprévues.", "lien": "Ce principe est mis à l’épreuve d’un exemple : deux conduites possibles face au meurtrier."}, {"l": "7-17", "idee": "Deux scénarios.", "args": "Tu dis la vérité (« oui ») : la victime a pu sortir sans que personne le remarque, et échapper au meurtrier. Tu mens (« non ») : elle sort à ton insu, croise le meurtrier et meurt ; tu peux alors être accusé d’être la cause de sa mort.", "lien": "L’exemple montre que l’intention de bien faire ne protège pas des conséquences : il reste à en tirer la règle."}, {"l": "18-26", "idee": "Le menteur répond des conséquences ; Le fondement : le contrat.", "args": "Celui qui ment, quelque bien intentionné qu’il soit, doit répondre des conséquences, même imprévisibles, et « en payer le prix ». Dire la vérité est le fondement de tous les devoirs fondés sur un contrat. Si l’on tolère « la plus petite exception », la loi devient « chancelante et vaine ».", "lien": "Cette dernière étape donne la thèse : dire la vérité est un devoir sans exception, fondement de tous les devoirs contractuels."}], "concepts": [{"c": "Devoir absolu", "s": "Un devoir qui vaut sans exception, quelles que soient les circonstances et les intentions : c’est l’idée de Kant (voir la fiche « Le devoir »)."}, {"c": "Responsabilité juridique", "s": "Être tenu de répondre devant la justice des conséquences de ses actes. Kant l’invoque pour distinguer celui qui ment de celui qui dit la vérité."}, {"c": "Contrat", "s": "Engagement entre personnes, qui suppose qu’on puisse se fier à la parole donnée. Sans exigence de vérité, aucun contrat n’est possible."}], "probleme": "<p><b>L’opinion remise en cause.</b> Qu’il serait permis, voire obligatoire, de mentir pour sauver une vie.</p><p><b>Le problème.</b> Existe-t-il des circonstances où mentir est permis, voire obligatoire, par exemple pour sauver une vie ?</p><p><b>L’enjeu.</b> Cette thèse n’est pas évidente : comment un devoir sans exception peut-il valoir même quand il paraît condamner un innocent ?</p><p><b>Formule.</b> « On dit souvent qu’il serait permis, voire obligatoire, de mentir pour sauver une vie, mais Kant soutient : Dire la vérité est un devoir sans exception. »</p><p><b>Discussion.</b> Objection. Faut-il vraiment dire à un meurtrier où se trouve sa victime ? Ce cas, jugé extrême, est le plus discuté de la philosophie morale.</p>", "intro": ["On pense volontiers qu’il vaut mieux mentir à un meurtrier pour sauver sa victime. Dans <i>Sur un prétendu droit de mentir par humanité</i>, Kant soutient le contraire.", "Kant soutient la thèse suivante : Dire la vérité est un devoir sans exception. Celui qui ment, même avec de bonnes intentions, répond de toutes les conséquences de son mensonge, y compris imprévisibles. Cette thèse n’est pas évidente : comment un devoir sans exception peut-il valoir même quand il paraît condamner un innocent ?", "Le texte avance en trois temps. Des lignes 1 à 7 : « Un meurtrier à la porte » ; « S’en tenir à la vérité ». Des lignes 7 à 17 : « Deux scénarios ». Des lignes 18 à 26 : « Le menteur répond des conséquences » ; « Le fondement : le contrat »."], "dev": [{"l": "1-7", "obj": "Un meurtrier à la porte ; S’en tenir à la vérité.", "sp": ["<b>Un meurtrier à la porte.</b> Un homme aux intentions meurtrières demande si sa victime est chez toi. Si tu l’as empêché d’agir par un mensonge, tu es juridiquement responsable de toutes les conséquences qui en résultent.", "<b>S’en tenir à la vérité.</b> Si tu t’en tiens strictement à la vérité, la justice publique ne peut rien te faire, quelles que soient les conséquences imprévues."], "tr": "Ce principe est mis à l’épreuve d’un exemple : deux conduites possibles face au meurtrier."}, {"l": "7-17", "obj": "Deux scénarios.", "sp": ["<b>Deux scénarios.</b> Tu dis la vérité (« oui ») : la victime a pu sortir sans que personne le remarque, et échapper au meurtrier. Tu mens (« non ») : elle sort à ton insu, croise le meurtrier et meurt ; tu peux alors être accusé d’être la cause de sa mort."], "tr": "L’exemple montre que l’intention de bien faire ne protège pas des conséquences : il reste à en tirer la règle."}, {"l": "18-26", "obj": "Le menteur répond des conséquences ; Le fondement : le contrat.", "sp": ["<b>Le menteur répond des conséquences.</b> Celui qui ment, quelque bien intentionné qu’il soit, doit répondre des conséquences, même imprévisibles, et « en payer le prix ».", "<b>Le fondement : le contrat.</b> Dire la vérité est le fondement de tous les devoirs fondés sur un contrat. Si l’on tolère « la plus petite exception », la loi devient « chancelante et vaine »."], "tr": ""}], "concl": ["Le texte se demande : « Existe-t-il des circonstances où mentir est permis, voire obligatoire, par exemple pour sauver une vie ? » Kant répond ainsi : Dire la vérité est un devoir sans exception. Celui qui ment, même avec de bonnes intentions, répond de toutes les conséquences de son mensonge, y compris imprévisibles.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « Un meurtrier à la porte ; S’en tenir à la vérité » puis « Deux scénarios » puis « Le menteur répond des conséquences ; Le fondement : le contrat ».", "On peut enfin discuter cette thèse. Objection. Faut-il vraiment dire à un meurtrier où se trouve sa victime ? Ce cas, jugé extrême, est le plus discuté de la philosophie morale."]}, {"id": "verite-platon", "label": "Platon : le mythe de la caverne", "theme": "La vérité", "auteur": "Platon", "oeuvre": "La République, VII", "fiche": "verite-platon.html", "lignes": ["Socrate. - Apprends à découvrir dans la nature des", "choses qui vont être dites une vue sur l'essence de la", "formation et sur celle de la non-formation qui", "ensemble concernent le fondement de la condition", "humaine. Considère ceci : des hommes séjournant sous", "terre dans une demeure en forme de caverne.", "Celle-ci possède en guise d'entrée un long passage", "menant vers la lumière du jour, en direction duquel", "toute la caverne se rassemble.", "Les hommes sont dans la caverne depuis leur enfance,", "enchaînés par le cou et par les cuisses.", "C'est pourquoi ils demeurent tous au même endroit, ne", "pouvant se mouvoir ni voir autre chose que ce qui se", "montre à eux : étant enchaînés ils sont hors d'état de", "tourner la tête.", "Une lumière cependant leur est accordée : elle vient", "d'un feu qui brûle au loin, derrière eux et au-dessus", "d'eux.", "Entre le feu et les hommes enchaînés (dans leur dos", "par conséquent) un chemin s'élève.", "Imagine-toi que le long de ce chemin une murette a été", "dressée, semblable à celles au-dessus desquelles les", "saltimbanques montrent leurs merveilles aux", "spectateurs.", "Glaucon. - Je vois.", "- Imagine donc comment, le long de ce petit mur, des", "hommes passent, portant toutes sortes de choses", "visibles au-dessus du mur : statues, figures de pierre", "ou de bois, bref, toutes sortes de choses fabriquées", "par la main de l'homme.", "Comme on peut s'y attendre, de ces porteurs, les uns", "parlent entre eux et les autres se taisent.", "- Tu nous présentes là un tableau extraordinaire et", "des prisonniers extraordinaires.", "- Il nous sont semblables.", "Réfléchis bien : jamais encore de tels hommes n'ont", "déjà vu, soit par leurs propres yeux, soit par les", "yeux d'autrui, autre chose que les ombres projetées", "sans cesse par le feu sur la paroi de la caverne qui", "leur fait face.", "- Comment en serait-il autrement s'ils sont contraints", "de conserver toute leur vie la tête immobile ?", "- Or que voient-ils des choses qui sont transportées", "et qui passent derrière eux ? Ne voient-ils pas", "justement rien d'autre que les ombres ?", "- Effectivement.", "- Maintenant s'ils pouvaient parler entre eux de ce", "qu'ils voient, ne penses-tu pas que ce qu'ils voient", "ils le prendraient pour ce qui est ?", "- Nécessairement.", "- Qu'en serait-il alors si cette prison avait en outre", "un écho venant de la paroi qui leur fait face et qui", "est la seule chose qu'ils puissent voir ? Chaque fois", "que l'un des porteurs qui passent derrière eux dirait", "un mot, crois-tu que les prisonniers attribueraient ce", "mot à autre chose qu'à l'ombre qui passe devant eux ?", "- A rien d'autre, ma foi !", "- Donc, pour les hommes ainsi enchaînés, les ombres", "des choses seraient la vérité même et ils ne la", "verraient absolument que dans les ombres.", "- De toute nécessité.", "- Considère alors la manière dont ils pourraient être", "délivrés et guérir de leur égarement : que", "deviendraient-ils s'il leur arrivait ce que je vais", "dire ?", "Chaque fois que l'un d'eux serait libéré de ses", "chaînes et obligé tout d'un coup de se lever, de", "tourner la tête, de se mettre en marche et de regarder", "la lumière, tous ces actes le feraient souffrir et", "l'éclat de la lumière l'empêcherait de voir les choses", "dont il observait jusque-là les ombres.", "Si tout cela lui arrivait, que répondrait-il, à ton", "avis, si quelqu'un lui affirmait qu'il n'avait vu", "jusqu'alors que des formes sans être, vides de tout", "contenu, et qu'il était maintenant beaucoup plus près", "de ce qui est, et que tourné désormais vers des choses", "ayant plus d'être, il voyait aussi d'une façon plus", "exacte ?", "Et si quelqu'un lui montrait alors chacune des choses", "transportées et lui demandait ce que c'est, ne crois-", "tu pas qu'il serait troublé et qu'il estimerait que ce", "qu'il voyait auparavant de ses propres yeux était plus", "vrai que ce qu'on lui montrerait à présent ?", "- Je le crois, certes, fermement.", "- Et si on l'obligeait à regarder le feu lui-même,", "est-ce que les yeux ne lui feraient pas mal et ne", "voudrait-il pas s'en détourner pour revenir à ce qu'il", "est dans ses forces de regarder ?", "Et ne jugerait-il pas que ce qui est pour lui", "immédiatement visible est en fait plus clair que ce", "qu'on veut lui montrer.", "- Il en serait ainsi", "- Si maintenant on le tirait de force sur le chemin", "difficile qui s'élève hors de la caverne et qu'on ne", "le lâchât pas avant d'être à la lumière du soleil, ne", "serait-il pas rempli de douleur et d'indignation ?", "Une fois parvenu à la lumière du jour, les yeux pleins", "de son éclat, ne lui serait-il pas impossible de rien", "voir des objets qu'on lui présenterait maintenant", "comme véritables ?", "- Il ne le pourrait aucunement, du moins pas tout de", "suite.", "- Il est clair, à mon avis, qu'une accoutumance serait", "nécessaire s'il devait parvenir à voir, hors de la", "caverne, ce qui est à la lumière du jour. Et, cette", "accoutumance une fois acquise, ce qu'il pourrait", "regarder le plus facilement, ce serait d'abord les", "ombres, et, après elles, les images reflétées dans", "l'eau des hommes et des autres choses, et seulement", "plus tard les hommes et les choses elles-mêmes, c'est-", "à-dire enfin ce qui est au lieu de reflets affaiblis.", "Et parmi celles-ci, il contemplerait sans doute plus", "facilement pendant la nuit, les choses du ciel et le", "ciel lui-même, en tournant son regard vers la lumière", "des astres et de la lune, qu'il ne le ferait pendant", "le jour du soleil et de son éclat.", "- Sans aucun doute.", "- Mais je pense aussi qu'au bout d'un certain temps il", "se trouverait en état de regarder le soleil lui-même.", "Non pas son reflet dans l'eau ou dans d'autres", "milieux, mais le soleil tel qu'il est, où il est, afin", "de considérer comment il est.", "- Il en serait
