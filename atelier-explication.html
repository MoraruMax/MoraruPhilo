ne doit pas rester une philosophie purement spéculative : en connaissant les corps comme les artisans connaissent leurs métiers, nous pouvons les employer à nos usages, et d’abord conserver la santé.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « Un devoir de partager ses découvertes » ; « Une philosophie pratique plutôt que spéculative » ; « Connaître la nature comme les artisans leurs métiers » ; « Maîtres et possesseurs » ; « Le premier bien : la santé ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-9", "idee": "Un devoir de partager ses découvertes.", "args": "Dès qu’il a acquis quelques notions de physique, Descartes juge qu’il ne peut les tenir cachées : la loi oblige à procurer le bien général des hommes.", "lien": "Après avoir rappelé le devoir de partager ses découvertes, Descartes oppose la philosophie spéculative à une philosophie pratique, qui connaît la nature comme les artisans leurs métiers."}, {"l": "9-20", "idee": "Une philosophie pratique plutôt que spéculative ; Connaître la nature comme les artisans leurs métiers ; Maîtres et possesseurs.", "args": "Ses notions diffèrent des principes de l’école. Elles mènent à des connaissances très utiles à la vie. Si l’on connaît la force du feu, de l’eau, de l’air et des astres aussi distinctement que les métiers des artisans, on peut les employer à tous leurs usages. Le but est de nous rendre « comme maîtres et possesseurs de la nature » : inventer des artifices, jouir sans peine des fruits de la terre.", "lien": "Si l’on connaît les corps comme les artisans leurs métiers, on peut les employer : devenir maîtres et possesseurs de la nature."}, {"l": "21-33", "idee": "Le premier bien : la santé.", "args": "La santé est le fondement de tous les autres biens. Comme l’esprit dépend du corps, c’est dans la médecine qu’on peut chercher à rendre les hommes plus sages et plus habiles.", "lien": "Ce pouvoir a un but premier : la conservation de la santé, premier bien de la vie."}], "concepts": [{"c": "Philosophie spéculative", "s": "Savoir purement théorique, qui cherche à comprendre sans chercher d’application."}, {"c": "Philosophie pratique", "s": "Savoir fondé sur la connaissance des corps et destiné à servir la vie humaine."}, {"c": "Maîtres et possesseurs", "s": "Formule qui exprime l’idée de commander à la nature et de l’utiliser, comme on dispose de ce qui nous appartient. Le « comme » indique une maîtrise par la connaissance."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que la connaissance de la nature serait purement spéculative, sans lien avec nos usages.</p><p><b>Le problème.</b> À quoi doit servir la connaissance de la nature ?</p><p><b>L’enjeu.</b> Cette thèse est ambiguë : que veut dire « maîtres et possesseurs » ? Il faut l’interpréter à partir du contexte, notamment de la santé.</p><p><b>Formule.</b> « On dit souvent que la connaissance de la nature serait purement spéculative, sans lien avec nos usages, mais Descartes soutient : La physique ne doit pas rester une philosophie purement spéculative : en connaissant les corps comme les artisans connaissent leurs métiers, nous pouvons les employer à nos usages, et d’abord conserver la santé. »</p><p><b>Discussion.</b> Une maîtrise sans mesure ? « Comme » maîtres : Descartes pense à la santé et aux commodités de la vie. Mais à quoi doit-on fixer la limite de cette maîtrise ? (À comparer avec Heidegger ou Mill.)</p>", "intro": ["On croit souvent que connaître la nature est une activité purement théorique, sans lien avec nos usages. Dans le <i>Discours de la méthode</i>, Descartes soutient que la physique doit être pratique et nous rendre « comme maîtres et possesseurs de la nature ».", "Descartes soutient la thèse suivante : La physique ne doit pas rester une philosophie purement spéculative : en connaissant les corps comme les artisans connaissent leurs métiers, nous pouvons les employer à nos usages, et d’abord conserver la santé. Cette thèse est ambiguë : que veut dire « maîtres et possesseurs » ? Il faut l’interpréter à partir du contexte, notamment de la santé.", "Le texte avance en trois temps. Des lignes 1 à 9 : « Un devoir de partager ses découvertes ». Des lignes 9 à 20 : « Une philosophie pratique plutôt que spéculative » ; « Connaître la nature comme les artisans leurs métiers » ; « Maîtres et possesseurs ». Des lignes 21 à 33 : « Le premier bien : la santé »."], "dev": [{"l": "1-9", "obj": "Un devoir de partager ses découvertes.", "sp": ["<b>Un devoir de partager ses découvertes.</b> Dès qu’il a acquis quelques notions de physique, Descartes juge qu’il ne peut les tenir cachées : la loi oblige à procurer le bien général des hommes."], "tr": "Après avoir rappelé le devoir de partager ses découvertes, Descartes oppose la philosophie spéculative à une philosophie pratique, qui connaît la nature comme les artisans leurs métiers."}, {"l": "9-20", "obj": "Une philosophie pratique plutôt que spéculative ; Connaître la nature comme les artisans leurs métiers ; Maîtres et possesseurs.", "sp": ["<b>Une philosophie pratique plutôt que spéculative.</b> Ses notions diffèrent des principes de l’école. Elles mènent à des connaissances très utiles à la vie.", "<b>Connaître la nature comme les artisans leurs métiers.</b> Si l’on connaît la force du feu, de l’eau, de l’air et des astres aussi distinctement que les métiers des artisans, on peut les employer à tous leurs usages.", "<b>Maîtres et possesseurs.</b> Le but est de nous rendre « comme maîtres et possesseurs de la nature » : inventer des artifices, jouir sans peine des fruits de la terre."], "tr": "Si l’on connaît les corps comme les artisans leurs métiers, on peut les employer : devenir maîtres et possesseurs de la nature."}, {"l": "21-33", "obj": "Le premier bien : la santé.", "sp": ["<b>Le premier bien : la santé.</b> La santé est le fondement de tous les autres biens. Comme l’esprit dépend du corps, c’est dans la médecine qu’on peut chercher à rendre les hommes plus sages et plus habiles."], "tr": ""}], "concl": ["Le texte se demande : « À quoi doit servir la connaissance de la nature ? » Descartes répond ainsi : La physique ne doit pas rester une philosophie purement spéculative : en connaissant les corps comme les artisans connaissent leurs métiers, nous pouvons les employer à nos usages, et d’abord conserver la santé.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « Un devoir de partager ses découvertes » puis « Une philosophie pratique plutôt que spéculative ; Connaître la nature comme les artisans leurs métiers ; Maîtres et possesseurs » puis « Le premier bien : la santé ».", "On peut enfin discuter cette thèse. Une maîtrise sans mesure ? « Comme » maîtres : Descartes pense à la santé et aux commodités de la vie. Mais à quoi doit-on fixer la limite de cette maîtrise ? (À comparer avec Heidegger ou Mill.)"]}, {"id": "nature-descola", "label": "Descola : la nature des Modernes", "theme": "La nature", "auteur": "Descola", "oeuvre": "Par-delà nature et culture", "fiche": "nature-descola.html", "lignes": ["Pour que la nature des Modernes accède à l’existence,", "il fallait donc une deuxième opération de", "purification1, il fallait que les humains deviennent", "extérieurs et supérieurs à la nature. C’est au", "christianisme que l’on doit ce second bouleversement,", "avec sa double idée d’une transcendance de l’homme et", "d’un univers tiré du néant par la volonté divine. La", "Création porte témoignage de l’existence de Dieu, de", "sa bonté et de sa perfection, mais ses œuvres ne", "doivent pas être confondues avec Lui ni les beautés de", "la nature appréciées pour elles-mêmes : elles", "procèdent de Dieu, mais Dieu n’y est pas présent.", "L’homme étant lui aussi créé, il tire sa signification", "de cet évènement fondateur.", "Il n’a donc pas sa place dans la nature comme un", "élément parmi d’autres, il n’est pas « par nature »", "comme les plantes et les animaux, il est devenu", "transcendant au monde physique ; son essence et son", "devenir relèvent désormais de la grâce, qui est au-", "delà de la nature. De cette origine surnaturelle,", "l’homme tire le droit et la mission d’administrer la", "terre, Dieu l’ayant formé au dernier jour de la genèse", "pour qu’il exerce son contrôle sur la Création, pour", "qu’il l’organise et l’aménage selon ses besoins. De", "même qu’Adam, en recevant le pouvoir de nommer les", "animaux, fut autorisé à introduire son ordre dans la", "nature, de même ses descendants, en se multipliant sur", "la face de la terre, réalisent l’intention divine de", "porter en tout lieu la maîtrise de la Création.", "Pourtant la nature est confiée aux hommes à bail", "temporaire. Car le monde a désormais une origine et un", "terme, étrange notion que le christianisme hérite de", "la tradition juive et qui tranche avec les conceptions", "de l’Antiquité païenne, mais aussi avec la plupart des", "cosmologies que l’ethnographie et l’histoire ont", "inventoriées. La Création est une scène provisoire", "pour une pièce qui se poursuivra après que les décors", "auront disparu, lorsque la nature n’existera plus et", "que seuls demeureront les protagonistes principaux :", "Dieu et les âmes, c’est-à-dire les hommes sous un", "autre avatar."], "mots": "Mots-clés : Les Modernes, Transcendance, Grâce.", "lire": "<p><b>Objet du texte.</b> Comment la nature, telle que les Modernes la conçoivent, est-elle apparue ? <b>Notion du programme.</b> La nature.</p><p><b>Connecteurs repérés.</b> « donc » (l.2), « mais » (l.9), « pourtant » (l.30), « car » (l.31). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Les Modernes</i> : ceux qui pensent le monde selon la séparation entre nature et culture. Pour Descola, cette séparation est propre à l’Occident. ; <i>Transcendance</i> : le fait d’être au-dessus et au-delà de quelque chose. L’homme est ici supérieur au monde physique. ; <i>Grâce</i> : don divin qui ne dépend pas de la nature. L’homme y trouve son essence et son devenir.</p>", "these": "<p><b>Thèse.</b> La nature des Modernes suppose que les humains soient extérieurs et supérieurs à elle. C’est le christianisme qui produit cette séparation, par l’idée d’une Création et d’un homme transcendant.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « Une seconde opération de « purification » » ; « Une Création qui n’est pas Dieu » ; « L’homme n’est plus « par nature » » ; « De cette origine, un droit et une mission » ; « Une nature « à bail temporaire » ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-12", "idee": "Une seconde opération de « purification » ; Une Création qui n’est pas Dieu.", "args": "Pour que la nature des Modernes existe, il faut que les humains deviennent extérieurs et supérieurs à elle. Le texte l’attribue au christianisme. Le monde est tiré du néant par la volonté divine. Il témoigne de Dieu, mais Dieu n’y est pas présent : la nature est mise à distance du divin.", "lien": "Après avoir montré que la nature des Modernes suppose une seconde opération de « purification » (le christianisme), Descola en tire que l’homme n’est plus dans la nature."}, {"l": "13-29", "idee": "L’homme n’est plus « par nature » ; De cette origine, un droit et une mission.", "args": "Créé lui aussi, l’homme tire sa signification de l’événement fondateur. Il n’est plus un élément parmi d’autres : son essence relève de la grâce, au-delà de la nature. L’homme reçoit le droit d’administrer la terre. Comme Adam nommait les animaux, ses descendants introduisent leur ordre dans la nature.", "lien": "De cette origine surnaturelle, l’homme tire le droit et la mission de dominer la nature, mais celle-ci ne lui est confiée qu’à titre provisoire."}, {"l": "30-41", "idee": "Une nature « à bail temporaire ».", "args": "Le monde a une origine et un terme. La Création est une scène provisoire, qui disparaîtra pour laisser Dieu et les âmes.", "lien": "La nature est donc « à bail temporaire » : une scène provisoire pour une pièce qui se joue entre Dieu et les âmes."}], "concepts": [{"c": "Les Modernes", "s": "Ceux qui pensent le monde selon la séparation entre nature et culture. Pour Descola, cette séparation est propre à l’Occident."}, {"c": "Transcendance", "s": "Le fait d’être au-dessus et au-delà de quelque chose. L’homme est ici supérieur au monde physique."}, {"c": "Grâce", "s": "Don divin qui ne dépend pas de la nature. L’homme y trouve son essence et son devenir."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que la nature serait une réalité évidente, que tous les peuples auraient toujours distinguée de la culture.</p><p><b>Le problème.</b> Comment la nature, telle que les Modernes la conçoivent, est-elle apparue ?</p><p><b>L’enjeu.</b> Cette thèse n’est pas évidente : comment une idée qui paraît naturelle peut-elle avoir une origine historique, et religieuse ?</p><p><b>Formule.</b> « On dit souvent que la nature serait une réalité évidente, que tous les peuples auraient toujours distinguée de la culture, mais Descola soutient : La nature des Modernes suppose que les humains soient extérieurs et supérieurs à elle. »</p><p><b>Discussion.</b> Une nature inventée ? Si la nature des Modernes est une construction historique, d’autres peuples ne la pensent pas ainsi. La nature est-elle un fait ou une idée ?</p>", "intro": ["On croit souvent que la nature est une réalité évidente, que tous les peuples ont toujours distinguée de l’homme et de la culture. Dans <i>Par-delà nature et culture</i>, Descola montre que la nature des Modernes est apparue à une époque donnée.", "Descola soutient la thèse suivante : La nature des Modernes suppose que les humains soient extérieurs et supérieurs à elle. C’est le christianisme qui produit cette séparation, par l’idée d’une Création et d’un homme transcendant. Cette thèse n’est pas évidente : comment une idée qui paraît naturelle peut-elle avoir une origine historique, et religieuse ?", "Le texte avance en trois temps. Des lignes 1 à 12 : « Une seconde opération de « purification » » ; « Une Création qui n’est pas Dieu ». Des lignes 13 à 29 : « L’homme n’est plus « par nature » » ; « De cette origine, un droit et une mission ». Des lignes 30 à 41 : « Une nature « à bail temporaire » »."], "dev": [{"l": "1-12", "obj": "Une seconde opération de « purification » ; Une Création qui n’est pas Dieu.", "sp": ["<b>Une seconde opération de « purification ».</b> Pour que la nature des Modernes existe, il faut que les humains deviennent extérieurs et supérieurs à elle. Le texte l’attribue au christianisme.", "<b>Une Création qui n’est pas Dieu.</b> Le monde est tiré du néant par la volonté divine. Il témoigne de Dieu, mais Dieu n’y est pas présent : la nature est mise à distance du divin."], "tr": "Après avoir montré que la nature des Modernes suppose une seconde opération de « purification » (le christianisme), Descola en tire que l’homme n’est plus dans la nature."}, {"l": "13-29", "obj": "L’homme n’est plus « par nature » ; De cette origine, un droit et une mission.", "sp": ["<b>L’homme n’est plus « par nature ».</b> Créé lui aussi, l’homme tire sa signification de l’événement fondateur. Il n’est plus un élément parmi d’autres : son essence relève de la grâce, au-delà de la nature.", "<b>De cette origine, un droit et une mission.</b> L’homme reçoit le droit d’administrer la terre. Comme Adam nommait les animaux, ses descendants introduisent leur ordre dans la nature."], "tr": "De cette origine surnaturelle, l’homme tire le droit et la mission de dominer la nature, mais celle-ci ne lui est confiée qu’à titre provisoire."}, {"l": "30-41", "obj": "Une nature « à bail temporaire ».", "sp": ["<b>Une nature « à bail temporaire ».</b> Le monde a une origine et un terme. La Création est une scène provisoire, qui disparaîtra pour laisser Dieu et les âmes."], "tr": ""}], "concl": ["Le texte se demande : « Comment la nature, telle que les Modernes la conçoivent, est-elle apparue ? » Descola répond ainsi : La nature des Modernes suppose que les humains soient extérieurs et supérieurs à elle. C’est le christianisme qui produit cette séparation, par l’idée d’une Création et d’un homme transcendant.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « Une seconde opération de « purification » ; Une Création qui n’est pas Dieu » puis « L’homme n’est plus « par nature » ; De cette origine, un droit et une mission » puis « Une nature « à bail temporaire » ».", "On peut enfin discuter cette thèse. Une nature inventée ? Si la nature des Modernes est une construction historique, d’autres peuples ne la pensent pas ainsi. La nature est-elle un fait ou une idée ?"]}, {"id": "nature-galilee", "label": "Galilée : l’univers, un livre écrit en langue mathématique", "theme": "La nature", "auteur": "Galilée", "oeuvre": "L’Essayeur", "fiche": "nature-galilee.html", "lignes": ["La philosophie est écrite dans cet immense livre qui", "se tient toujours ouvert devant nos yeux, je veux dire", "l’Univers, mais on ne peut le comprendre si l’on ne", "s’applique pas d’abord à en comprendre la langue et à", "connaître les caractères avec lesquels il est écrit.", "Il est écrit dans la langue mathématique et ses", "caractères sont des triangles, des cercles et autres", "figures géométriques, sans le moyen desquels il est", "humainement impossible d’en comprendre un mot. Sans", "eux, c’est une errance vaine dans un labyrinthe", "obscur."], "mots": "Mots-clés : Métaphore du livre, Langue mathématique, Philosophie (naturelle).", "lire": "<p><b>Objet du texte.</b> Comment connaître la nature ? <b>Notion du programme.</b> La nature.</p><p><b>Connecteurs repérés.</b> « mais » (l.3), « si… » (l.3). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Métaphore du livre</i> : l’Univers est comparé à un livre : il a un sens qu’on peut déchiffrer. ; <i>Langue mathématique</i> : les relations entre les phénomènes s’expriment par des figures et des quantités, non par des qualités sensibles. ; <i>Philosophie (naturelle)</i> : au XVIIe siècle, ce mot désigne la connaissance de la nature, c’est-à-dire ce que l’on appellera la physique.</p>", "these": "<p><b>Thèse.</b> La nature est intelligible, car elle est écrite en langue mathématique. Sans la géométrie, il est impossible d’y comprendre quoi que ce soit.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « Un livre toujours ouvert » ; « Il faut d’abord apprendre la langue » ; « Cette langue est mathématique » ; « Sans les mathématiques, aucune compréhension » ; « Une errance dans un labyrinthe ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-5", "idee": "Un livre toujours ouvert ; Il faut d’abord apprendre la langue.", "args": "La philosophie est écrite dans l’Univers, « immense livre » qui se tient sans cesse devant nos yeux : la nature est accessible à tous. On ne peut comprendre ce livre sans s’appliquer à en comprendre la langue et les caractères.", "lien": "Après avoir comparé l’univers à un livre toujours ouvert, Galilée dit qu’il faut en apprendre la langue."}, {"l": "6-9", "idee": "Cette langue est mathématique.", "args": "Ses caractères sont des triangles, des cercles et d’autres figures géométriques : la nature a une structure mathématique.", "lien": "Cette langue est celle des mathématiques ; sans elle, on ne peut rien comprendre à la nature."}, {"l": "9-11", "idee": "Sans les mathématiques, aucune compréhension ; Une errance dans un labyrinthe.", "args": "Sans eux, il est « humainement impossible » d’en comprendre un mot. Se passer des mathématiques revient à errer en vain dans un labyrinthe obscur.", "lien": "Sans les mathématiques, on erre dans un labyrinthe : c’est la thèse."}], "concepts": [{"c": "Métaphore du livre", "s": "L’Univers est comparé à un livre : il a un sens qu’on peut déchiffrer."}, {"c": "Langue mathématique", "s": "Les relations entre les phénomènes s’expriment par des figures et des quantités, non par des qualités sensibles."}, {"c": "Philosophie (naturelle)", "s": "Au XVIIe siècle, ce mot désigne la connaissance de la nature, c’est-à-dire ce que l’on appellera la physique."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que l’on connaîtrait la nature en lisant les livres des philosophes, ou qu’elle resterait incompréhensible.</p><p><b>Le problème.</b> Comment connaître la nature ?</p><p><b>L’enjeu.</b> Cette thèse repose sur une métaphore : il faut expliquer en quel sens la nature est un « livre » et pourquoi sa langue est mathématique.</p><p><b>Formule.</b> « On dit souvent que l’on connaîtrait la nature en lisant les livres des philosophes, ou qu’elle resterait incompréhensible, mais Galilée soutient : La nature est intelligible, car elle est écrite en langue mathématique. »</p><p><b>Discussion.</b> La nature est-elle vraiment mathématique ? Les mathématiques sont-elles dans la nature, ou une manière dont l’esprit la décrit ? Que devient alors ce que l’on ne peut pas mesurer ?</p>", "intro": ["On croit souvent que l’on connaît la nature en lisant les philosophes, ou qu’elle reste incompréhensible. Dans <i>L’Essayeur</i>, Galilée soutient qu’elle est un livre écrit en langue mathématique.", "Galilée soutient la thèse suivante : La nature est intelligible, car elle est écrite en langue mathématique. Sans la géométrie, il est impossible d’y comprendre quoi que ce soit. Cette thèse repose sur une métaphore : il faut expliquer en quel sens la nature est un « livre » et pourquoi sa langue est mathématique.", "Le texte avance en trois temps. Des lignes 1 à 5 : « Un livre toujours ouvert » ; « Il faut d’abord apprendre la langue ». Des lignes 6 à 9 : « Cette langue est mathématique ». Des lignes 9 à 11 : « Sans les mathématiques, aucune compréhension » ; « Une errance dans un labyrinthe »."], "dev": [{"l": "1-5", "obj": "Un livre toujours ouvert ; Il faut d’abord apprendre la langue.", "sp": ["<b>Un livre toujours ouvert.</b> La philosophie est écrite dans l’Univers, « immense livre » qui se tient sans cesse devant nos yeux : la nature est accessible à tous.", "<b>Il faut d’abord apprendre la langue.</b> On ne peut comprendre ce livre sans s’appliquer à en comprendre la langue et les caractères."], "tr": "Après avoir comparé l’univers à un livre toujours ouvert, Galilée dit qu’il faut en apprendre la langue."}, {"l": "6-9", "obj": "Cette langue est mathématique.", "sp": ["<b>Cette langue est mathématique.</b> Ses caractères sont des triangles, des cercles et d’autres figures géométriques : la nature a une structure mathématique."], "tr": "Cette langue est celle des mathématiques ; sans elle, on ne peut rien comprendre à la nature."}, {"l": "9-11", "obj": "Sans les mathématiques, aucune compréhension ; Une errance dans un labyrinthe.", "sp": ["<b>Sans les mathématiques, aucune compréhension.</b> Sans eux, il est « humainement impossible » d’en comprendre un mot.", "<b>Une errance dans un labyrinthe.</b> Se passer des mathématiques revient à errer en vain dans un labyrinthe obscur."], "tr": ""}], "concl": ["Le texte se demande : « Comment connaître la nature ? » Galilée répond ainsi : La nature est intelligible, car elle est écrite en langue mathématique. Sans la géométrie, il est impossible d’y comprendre quoi que ce soit.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « Un livre toujours ouvert ; Il faut d’abord apprendre la langue » puis « Cette langue est mathématique » puis « Sans les mathématiques, aucune compréhension ; Une errance dans un labyrinthe ».", "On peut enfin discuter cette thèse. La nature est-elle vraiment mathématique ? Les mathématiques sont-elles dans la nature, ou une manière dont l’esprit la décrit ? Que devient alors ce que l’on ne peut pas mesurer ?"]}, {"id": "nature-genese", "label": "Genèse : la domination de l’homme sur la nature", "theme": "La nature", "auteur": "La Bible", "oeuvre": "Genèse, chapitre 1", "fiche": "nature-genese.html", "lignes": ["Puis Dieu dit : Faisons l'homme à notre image, selon", "notre ressemblance, et qu'il domine sur les poissons", "de la mer, sur les oiseaux du ciel, sur le bétail, sur", "toute la terre, et sur tous les reptiles qui rampent", "sur la terre.", "Dieu créa l'homme à son image, il le créa à l'image de", "Dieu, il créa l'homme et la femme.", "Dieu les bénit, et Dieu leur dit : Soyez féconds,", "multipliez, remplissez la terre, et l'assujettissez ;", "et dominez sur les poissons de la mer, sur les oiseaux", "du ciel, et sur tout animal qui se meut sur la terre."], "mots": "Mots-clés : Image et ressemblance, Créer, Dominer / assujettir.", "lire": "<p><b>Objet du texte.</b> L’homme a-t-il une place particulière dans la nature, et quel pouvoir en découle ? <b>Notion du programme.</b> La nature.</p><p><b>Vocabulaire à éclaircir.</b> <i>Image et ressemblance</i> : l’homme est dit semblable à Dieu : il se distingue par là des autres créatures, qui ne reçoivent pas cette marque. ; <i>Créer</i> : faire exister à partir de rien, par un acte de volonté. La nature est ici une œuvre, non un principe autonome. ; <i>Dominer / assujettir</i> : exercer un pouvoir sur quelque chose et le soumettre. Le texte emploie deux verbes pour dire que la nature est soumise à l’homme.</p>", "these": "<p><b>Thèse.</b> Créé « à l’image » de Dieu, l’homme se distingue des autres créatures. Cette ressemblance divine fonde sa domination sur les animaux et sur la terre entière.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « Dieu décide de créer l’homme à sa ressemblance » ; « La ressemblance divine s’accompagne d’une domination » ; « L’homme et la femme sont tous deux créés à cette image » ; « La bénédiction est un commandement » ; « Le pouvoir s’étend à tout animal ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-7", "idee": "Dieu décide de créer l’homme à sa ressemblance ; La ressemblance divine s’accompagne d’une domination ; L’homme et la femme sont tous deux créés à cette image.", "args": "Avant même de le créer, Dieu annonce son projet : « Faisons l’homme à notre image, selon notre ressemblance ». L’homme est présenté comme une créature singulière. La même phrase ajoute qu’il « domine » sur les poissons, les oiseaux, le bétail, la terre et les reptiles. Être à l’image de Dieu, c’est partager quelque chose de son pouvoir. Le verset 27 répète trois fois le verbe créer. La ressemblance concerne l’humanité entière, « l’homme et la femme ».", "lien": "Après avoir décidé de créer l’homme à sa ressemblance, Dieu le crée, homme et femme, à son image : cette ressemblance le distingue."}, {"l": "8-11", "idee": "La bénédiction est un commandement ; Le pouvoir s’étend à tout animal.", "args": "Dieu les bénit et leur dit d’être féconds, de remplir la terre et de « l’assujettir ». La domination est confiée à l’humanité comme une mission. La domination est répétée : elle porte sur les poissons, les oiseaux et « tout animal qui se meut sur la terre ». Aucune espèce n’est exclue.", "lien": "La bénédiction est un commandement : l’homme doit remplir la terre et l’assujettir, ce qui étend son pouvoir à tout animal."}], "concepts": [{"c": "Image et ressemblance", "s": "L’homme est dit semblable à Dieu : il se distingue par là des autres créatures, qui ne reçoivent pas cette marque."}, {"c": "Créer", "s": "Faire exister à partir de rien, par un acte de volonté. La nature est ici une œuvre, non un principe autonome."}, {"c": "Dominer / assujettir", "s": "Exercer un pouvoir sur quelque chose et le soumettre. Le texte emploie deux verbes pour dire que la nature est soumise à l’homme."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que l’homme ne serait qu’un animal parmi d’autres, sans place particulière dans la nature.</p><p><b>Le problème.</b> L’homme a-t-il une place particulière dans la nature, et quel pouvoir en découle ?</p><p><b>L’enjeu.</b> Cette thèse n’est pas évidente : que signifie être créé « à l’image » de Dieu, et pourquoi un pouvoir en découlerait-il ?</p><p><b>Formule.</b> « On dit souvent que l’homme ne serait qu’un animal parmi d’autres, sans place particulière dans la nature, mais La Bible soutient : Créé « à l’image » de Dieu, l’homme se distingue des autres créatures. »</p><p><b>Discussion.</b> Un droit ou une responsabilité ? Dominer, est-ce exploiter, ou prendre soin ? Le texte n’emploie que des verbes de pouvoir, mais certains lecteurs y voient une charge de gardien. Qu’en pensez-vous ? (À comparer avec Descola.)</p>", "intro": ["On dit souvent que l’homme n’est qu’un animal parmi d’autres, sans place particulière dans la nature. Dans ce passage du premier chapitre de la <i>Genèse</i>, l’homme est créé à l’image de Dieu et reçoit la domination sur la terre.", "La Bible soutient la thèse suivante : Créé « à l’image » de Dieu, l’homme se distingue des autres créatures. Cette ressemblance divine fonde sa domination sur les animaux et sur la terre entière. Cette thèse n’est pas évidente : que signifie être créé « à l’image » de Dieu, et pourquoi un pouvoir en découlerait-il ?", "Le texte avance en deux temps. Des lignes 1 à 7 : « Dieu décide de créer l’homme à sa ressemblance » ; « La ressemblance divine s’accompagne d’une domination » ; « L’homme et la femme sont tous deux créés à cette image ». Des lignes 8 à 11 : « La bénédiction est un commandement » ; « Le pouvoir s’étend à tout animal »."], "dev": [{"l": "1-7", "obj": "Dieu décide de créer l’homme à sa ressemblance ; La ressemblance divine s’accompagne d’une domination ; L’homme et la femme sont tous deux créés à cette image.", "sp": ["<b>Dieu décide de créer l’homme à sa ressemblance.</b> Avant même de le créer, Dieu annonce son projet : « Faisons l’homme à notre image, selon notre ressemblance ». L’homme est présenté comme une créature singulière.", "<b>La ressemblance divine s’accompagne d’une domination.</b> La même phrase ajoute qu’il « domine » sur les poissons, les oiseaux, le bétail, la terre et les reptiles. Être à l’image de Dieu, c’est partager quelque chose de son pouvoir.", "<b>L’homme et la femme sont tous deux créés à cette image.</b> Le verset 27 répète trois fois le verbe créer. La ressemblance concerne l’humanité entière, « l’homme et la femme »."], "tr": "Après avoir décidé de créer l’homme à sa ressemblance, Dieu le crée, homme et femme, à son image : cette ressemblance le distingue."}, {"l": "8-11", "obj": "La bénédiction est un commandement ; Le pouvoir s’étend à tout animal.", "sp": ["<b>La bénédiction est un commandement.</b> Dieu les bénit et leur dit d’être féconds, de remplir la terre et de « l’assujettir ». La domination est confiée à l’humanité comme une mission.", "<b>Le pouvoir s’étend à tout animal.</b> La domination est répétée : elle porte sur les poissons, les oiseaux et « tout animal qui se meut sur la terre ». Aucune espèce n’est exclue."], "tr": ""}], "concl": ["Le texte se demande : « L’homme a-t-il une place particulière dans la nature, et quel pouvoir en découle ? » La Bible répond ainsi : Créé « à l’image » de Dieu, l’homme se distingue des autres créatures. Cette ressemblance divine fonde sa domination sur les animaux et sur la terre entière.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « Dieu décide de créer l’homme à sa ressemblance ; La ressemblance divine s’accompagne d’une domination ; L’homme et la femme sont tous deux créés à cette image » puis « La bénédiction est un commandement ; Le pouvoir s’étend à tout animal ».", "On peut enfin discuter cette thèse. Un droit ou une responsabilité ? Dominer, est-ce exploiter, ou prendre soin ? Le texte n’emploie que des verbes de pouvoir, mais certains lecteurs y voient une charge de gardien. Qu’en pensez-vous ? (À comparer avec Descola.)"]}, {"id": "nature-jacob", "label": "Jacob : le refus de la finalité comme principe explicatif", "theme": "La nature", "auteur": "Jacob", "oeuvre": "Le Jeu des possibles", "fiche": "nature-jacob.html", "lignes": ["Il a sans cesse fallu lutter, dans les sciences de la", "nature, pour se débarrasser de l’anthropomorphisme,", "pour éviter d’attribuer des qualités humaines à des", "entités variées.", "En particulier, la finalité qui caractérise beaucoup", "d’activités humaines a longtemps servi de modèle", "universel pour expliquer tout ce qui, dans la nature,", "paraît orienté vers un but. C’est le cas notamment des", "êtres vivants dont toutes les structures, les", "propriétés, le comportement semblent à l’évidence", "répondre à un dessein. Le monde vivant a donc", "constitué la cible favorite des causes finales. De", "fait, la principale « preuve » de l’existence de Dieu", "a longtemps été « l’argument d’intention ». Développé", "notamment par Paley [pasteur anglican et théologien]", "dans sa Théologie naturelle [1802], publiée quelques", "années seulement avant l’Origine des Espèces [Darwin,", "1859], cet argument est le suivant. Si vous trouvez", "une montre, vous ne doutez pas qu’elle a été fabriquée", "par un horloger. De même, si vous considérez un", "organisme un peu complexe, avec l’évidente finalité de", "tous ses organes, comment ne pas conclure qu’il a été", "produit par la volonté d’un Créateur ? Car il serait", "simplement absurde, dit Paley, de supposer que l’œil", "d’un mammifère, par exemple, avec la précision de son", "optique et sa géométrie, aurait pu se former par pur", "hasard.", "Il y a deux niveaux d’explication, bien distincts mais", "trop souvent confondus, pour rendre compte de", "l’apparente finalité dans le monde vivant.", "Le premier correspond à l’individu, à l’organisme dont", "la plupart des propriétés, tant de structure que de", "fonctions ou de comportement, semblent bien dirigées", "vers un but. C’est le cas, par exemple, des", "différentes phases de la reproduction, du", "développement embryonnaire, de la respiration, de la", "digestion, de la recherche de nourriture, de la fuite", "devant le prédateur, de la migration, etc. Ce genre de", "dessein préétabli, qui se manifeste dans chaque être", "vivant, ne se retrouve pas dans le monde inanimé.", "D’où, pendant longtemps, le recours à un agent", "particulier, à une force vitale échappant aux lois de", "la physique. C’est seulement au cours de ce siècle [20", "ème] qu’à disparu l’opposition entre, d’un côté,", "l’interprétation mécaniste donnée aux activités d’un", "être vivant et, de l’autre, ses propriétés et son", "comportement. En particulier, le paradoxe s’est résolu", "quand la biologie moléculaire a emprunté à la théorie", "de l’information le concept et le terme de programme", "pour désigner l’information génétique d’un organisme.", "Selon cette manière de voir, les chromosomes d’un œuf", "fécondé contiennent, inscrits dans l’ADN, les plans", "qui régissent le développement du futur organisme, ses", "activités, son comportement.", "Le second niveau d’explication correspond, non plus à", "l’organisme, mais à l’ensemble du monde vivant. C’est", "là qu’a été détruite par Darwin l’idée de création", "particulière, l’idée que chaque espèce a été", "individuellement conçue et exécutée par un créateur.", "Contre l’argument d’intention, Darwin montra que la", "combinaison de certains mécanismes simples peut", "simuler un dessein préétabli. Trois conditions doivent", "être remplies : il faut que les structures varient ;", "que ces variations soient héréditaires ; que la", "reproduction de certains variants soit favorisée par", "les conditions de milieu. A l’époque de Darwin, les", "mécanismes qui sous-tendent l’hérédité étaient encore", "inconnus. Depuis lors, la génétique classique, puis la", "biologie moléculaire ont donné des bases génétiques et", "biochimiques à la reproduction et à la variation. Peu", "à peu, les biologistes ont ainsi élaboré une", "représentation raisonnable, quoiqu’encore incomplète,", "de ce qui est considéré comme le principal moteur de", "l’évolution du vivant : la sélection naturelle."], "mots": "Mots-clés : Anthropomorphisme, Cause finale, Programme génétique.", "lire": "<p><b>Objet du texte.</b> Comment expliquer scientifiquement l’apparente finalité du vivant ? <b>Notion du programme.</b> La nature.</p><p><b>Connecteurs repérés.</b> « donc » (l.11), « si… » (l.18), « car » (l.23), « mais » (l.28), « d’où » (l.41), « ainsi » (l.71). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Anthropomorphisme</i> : fait d’attribuer des caractères humains à ce qui n’est pas humain. ; <i>Cause finale</i> : explication d’un phénomène par le but qu’il poursuit, et non par ce qui le produit. ; <i>Programme génétique</i> : information inscrite dans l’ADN, qui règle le développement et le comportement de l’organisme.</p>", "these": "<p><b>Thèse.</b> L’apparente finalité du vivant ne suppose ni force vitale ni Créateur. Elle s’explique par le programme génétique de l’organisme et par la sélection naturelle, qui simule un dessein préétabli.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « Se débarrasser de l’anthropomorphisme » ; « Le vivant, cible des causes finales » ; « Premier niveau : l’organisme » ; « Second niveau : l’ensemble du monde vivant » ; « Trois conditions de la sélection naturelle ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-27", "idee": "Se débarrasser de l’anthropomorphisme ; Le vivant, cible des causes finales.", "args": "Les sciences de la nature ont dû éviter d’attribuer des qualités humaines à des entités variées. La finalité humaine servait de modèle universel. Les êtres vivants paraissent répondre à un dessein. De là l’« argument d’intention » de Paley : la montre suppose un horloger, l’organisme un Créateur.", "lien": "Après avoir montré pourquoi le vivant a été la cible favorite des causes finales (l’argument de la montre de Paley), Jacob distingue deux niveaux d’explication : l’organisme d’abord."}, {"l": "28-54", "idee": "Premier niveau : l’organisme.", "args": "Reproduction, développement, digestion semblent poursuivre un but. On a longtemps invoqué une force vitale. La biologie moléculaire résout le paradoxe avec le concept de programme génétique.", "lien": "Le programme génétique explique la finalité de l’organisme ; reste à expliquer celle de l’ensemble du monde vivant."}, {"l": "55-74", "idee": "Second niveau : l’ensemble du monde vivant ; Trois conditions de la sélection naturelle.", "args": "Darwin détruit l’idée de création particulière de chaque espèce, en montrant que des mécanismes simples peuvent simuler un dessein. Il faut que les structures varient, que ces variations soient héréditaires, et que la reproduction de certains variants soit favorisée par le milieu.", "lien": "Au second niveau, la sélection naturelle (Darwin) simule un dessein : sans force vitale ni Créateur."}], "concepts": [{"c": "Anthropomorphisme", "s": "Fait d’attribuer des caractères humains à ce qui n’est pas humain."}, {"c": "Cause finale", "s": "Explication d’un phénomène par le but qu’il poursuit, et non par ce qui le produit."}, {"c": "Programme génétique", "s": "Information inscrite dans l’ADN, qui règle le développement et le comportement de l’organisme."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que la finalité du vivant prouverait un dessein : un Créateur ou une force vitale.</p><p><b>Le problème.</b> Comment expliquer scientifiquement l’apparente finalité du vivant ?</p><p><b>L’enjeu.</b> Cette thèse n’est pas évidente : comment expliquer sans dessein ce qui semble si bien conçu ?</p><p><b>Formule.</b> « On dit souvent que la finalité du vivant prouverait un dessein : un Créateur ou une force vitale, mais Jacob soutient : L’apparente finalité du vivant ne suppose ni force vitale ni Créateur. »</p><p><b>Discussion.</b> Le vivant a-t-il un sens ? Si la finalité n’est qu’apparente, que reste-t-il de l’idée de fonction ou de but dans le vivant ? Est-ce une simple métaphore ?</p>", "intro": ["On croit souvent que l’organisation du vivant, si bien adaptée à ses fonctions, prouve un dessein : un Créateur ou une force vitale. Dans <i>Le Jeu des possibles</i>, Jacob montre que cette finalité apparente s’explique scientifiquement.", "Jacob soutient la thèse suivante : L’apparente finalité du vivant ne suppose ni force vitale ni Créateur. Elle s’explique par le programme génétique de l’organisme et par la sélection naturelle, qui simule un dessein préétabli. Cette thèse n’est pas évidente : comment expliquer sans dessein ce qui semble si bien conçu ?", "Le texte avance en trois temps. Des lignes 1 à 27 : « Se débarrasser de l’anthropomorphisme » ; « Le vivant, cible des causes finales ». Des lignes 28 à 54 : « Premier niveau : l’organisme ». Des lignes 55 à 74 : « Second niveau : l’ensemble du monde vivant » ; « Trois conditions de la sélection naturelle »."], "dev": [{"l": "1-27", "obj": "Se débarrasser de l’anthropomorphisme ; Le vivant, cible des causes finales.", "sp": ["<b>Se débarrasser de l’anthropomorphisme.</b> Les sciences de la nature ont dû éviter d’attribuer des qualités humaines à des entités variées. La finalité humaine servait de modèle universel.", "<b>Le vivant, cible des causes finales.</b> Les êtres vivants paraissent répondre à un dessein. De là l’« argument d’intention » de Paley : la montre suppose un horloger, l’organisme un Créateur."], "tr": "Après avoir montré pourquoi le vivant a été la cible favorite des causes finales (l’argument de la montre de Paley), Jacob distingue deux niveaux d’explication : l’organisme d’abord."}, {"l": "28-54", "obj": "Premier niveau : l’organisme.", "sp": ["<b>Premier niveau : l’organisme.</b> Reproduction, développement, digestion semblent poursuivre un but. On a longtemps invoqué une force vitale. La biologie moléculaire résout le paradoxe avec le concept de programme génétique."], "tr": "Le programme génétique explique la finalité de l’organisme ; reste à expliquer celle de l’ensemble du monde vivant."}, {"l": "55-74", "obj": "Second niveau : l’ensemble du monde vivant ; Trois conditions de la sélection naturelle.", "sp": ["<b>Second niveau : l’ensemble du monde vivant.</b> Darwin détruit l’idée de création particulière de chaque espèce, en montrant que des mécanismes simples peuvent simuler un dessein.", "<b>Trois conditions de la sélection naturelle.</b> Il faut que les structures varient, que ces variations soient héréditaires, et que la reproduction de certains variants soit favorisée par le milieu."], "tr": ""}], "concl": ["Le texte se demande : « Comment expliquer scientifiquement l’apparente finalité du vivant ? » Jacob répond ainsi : L’apparente finalité du vivant ne suppose ni force vitale ni Créateur. Elle s’explique par le programme génétique de l’organisme et par la sélection naturelle, qui simule un dessein préétabli.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « Se débarrasser de l’anthropomorphisme ; Le vivant, cible des causes finales » puis « Premier niveau : l’organisme » puis « Second niveau : l’ensemble du monde vivant ; Trois conditions de la sélection naturelle ».", "On peut enfin discuter cette thèse. Le vivant a-t-il un sens ? Si la finalité n’est qu’apparente, que reste-t-il de l’idée de fonction ou de but dans le vivant ? Est-ce une simple métaphore ?"]}, {"id": "nature-mill", "label": "Mill : faut-il suivre la nature ?", "theme": "La nature", "auteur": "Mill", "oeuvre": "La Nature", "fiche": "nature-mill.html", "lignes": ["Le mot Nature a deux sens principaux : il désigne soit", "le système entier des choses, avec l’ensemble de leurs", "propriétés, soit les choses telles qu’elles seraient", "en l’absence d’intervention humaine.", "Dans le premier sens, la doctrine selon laquelle", "l’homme devrait suivre la nature est absurde, car", "l’homme ne peut rien faire d’autre que suivre la", "nature, puisque toutes ses actions reposent sur une ou", "plusieurs lois naturelles physiques ou mentales, et", "obéissent à ces lois.", "Dans le second sens du mot, la doctrine selon laquelle", "l’homme devrait suivre la nature ou, en d’autres", "termes, devrait prendre le cours spontané des choses", "pour modèle de ses actions volontaires, est à la fois", "immorale et irrationnelle.", "Irrationnelle, parce que toute action humaine consiste", "à altérer le cours spontané de la nature, et toute", "action utile à l’améliorer.", "Immorale, parce que le cours des phénomènes naturels", "étant rempli de tous les événements qui, lorsqu’ils", "résultent de l’action humaine méritent le plus", "d’inspirer la répulsion, quiconque s’efforcerait par", "ses actes d’imiter le cours naturel des choses serait", "universellement considéré comme le plus mauvais des", "hommes.", "Le plan de la Nature, considéré dans son ensemble, ne", "peut avoir eu pour seul, ni même pour principal objet", "le bien des humains ou des autres êtres sensibles. Le", "bien qu’il leur procure résulte principalement de", "leurs propres efforts. Tout ce qui dans la nature", "indique une intention tournée vers le bien, prouve que", "cette bonté n’est armée que d’un pouvoir limité.", "Le devoir de l’homme est de coopérer avec les pouvoirs", "bienfaisants, non pas en imitant le cours de la", "nature, mais en s’efforçant sans cesse de le corriger,", "et de rendre cette part de la nature sur laquelle il", "peut exercer un contrôle plus conforme à une norme", "élevée de justice et de bonté."], "mots": "Mots-clés : Nature (premier sens), Nature (second sens), Irrationnel / immoral.", "lire": "<p><b>Objet du texte.</b> L’homme doit-il prendre la nature pour modèle ? <b>Notion du programme.</b> La nature.</p><p><b>Connecteurs repérés.</b> « car » (l.6), « puisque » (l.8), « parce que » (l.16), « non pas… mais » (l.34), « mais » (l.35). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Nature (premier sens)</i> : le système entier des choses et de leurs propriétés, y compris l’homme et ses actions. ; <i>Nature (second sens)</i> : ce qui arrive sans intervention humaine : le cours spontané des choses. ; <i>Irrationnel / immoral</i> : irrationnel : contraire à la raison, car agir c’est modifier. Immoral : contraire au bien, car la nature est cruelle.</p>", "these": "<p><b>Thèse.</b> Suivre la nature est une maxime absurde si la nature est le tout, et irrationnelle et immorale si elle est le cours spontané des choses. L’homme doit corriger la nature, selon une norme de justice et de bonté.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « Deux sens du mot « nature » » ; « Premier sens : une maxime absurde » ; « Second sens : irrationnelle » ; « Second sens : immorale » ; « Un devoir de correction ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-10", "idee": "Deux sens du mot « nature » ; Premier sens : une maxime absurde.", "args": "Le système entier des choses avec leurs propriétés, ou les choses telles qu’elles seraient sans intervention humaine. Si la nature est le tout, l’homme ne peut rien faire d’autre que la suivre, car toutes ses actions obéissent à des lois naturelles.", "lien": "Après avoir distingué deux sens du mot « nature », Mill examine le premier : si la nature est le tout, suivre la nature est une maxime absurde."}, {"l": "11-32", "idee": "Second sens : irrationnelle ; Second sens : immorale.", "args": "Toute action humaine altère le cours spontané de la nature, et toute action utile l’améliore. Prendre ce cours pour modèle contredit l’action. Le cours naturel est rempli d’événements qui, venant de l’homme, inspireraient la répulsion. Imiter la nature ferait de lui le plus mauvais des hommes.", "lien": "Dans le second sens (le cours spontané des choses), la maxime est irrationnelle et immorale."}, {"l": "33-38", "idee": "Un devoir de correction.", "args": "Le plan de la nature ne vise pas seulement le bien des êtres sensibles. L’homme doit corriger la part de la nature qu’il contrôle, selon une norme élevée de justice et de bonté.", "lien": "Si la nature ne peut servir de modèle, l’homme doit la corriger : c’est son devoir."}], "concepts": [{"c": "Nature (premier sens)", "s": "Le système entier des choses et de leurs propriétés, y compris l’homme et ses actions."}, {"c": "Nature (second sens)", "s": "Ce qui arrive sans intervention humaine : le cours spontané des choses."}, {"c": "Irrationnel / immoral", "s": "Irrationnel : contraire à la raison, car agir c’est modifier. Immoral : contraire au bien, car la nature est cruelle."}], "probleme": "<p><b>L’opinion remise en cause.</b> Qu’il faudrait suivre la nature, la prendre pour modèle de conduite.</p><p><b>Le problème.</b> L’homme doit-il prendre la nature pour modèle ?</p><p><b>L’enjeu.</b> Cette thèse repose sur une distinction : il faut identifier les deux sens du mot « nature » pour comprendre pourquoi la maxime est rejetée dans les deux cas.</p><p><b>Formule.</b> « On dit souvent qu’il faudrait suivre la nature, la prendre pour modèle de conduite, mais Mill soutient : Suivre la nature est une maxime absurde si la nature est le tout, et irrationnelle et immorale si elle est le cours spontané des choses. »</p><p><b>Discussion.</b> La nature est-elle une norme ? Mill refuse que la nature fonde le bien. Faut-il alors admettre que la morale vient de l’homme seul ? (À comparer avec Aristote.)</p>", "intro": ["On dit souvent qu’il faut vivre « selon la nature », comme si la nature était un modèle. Dans <i>La Nature</i>, Mill soutient que cette maxime est absurde, ou irrationnelle et immorale, selon le sens que l’on donne au mot.", "Mill soutient la thèse suivante : Suivre la nature est une maxime absurde si la nature est le tout, et irrationnelle et immorale si elle est le cours spontané des choses. L’homme doit corriger la nature, selon une norme de justice et de bonté. Cette thèse repose sur une distinction : il faut identifier les deux sens du mot « nature » pour comprendre pourquoi la maxime est rejetée dans les deux cas.", "Le texte avance en trois temps. Des lignes 1 à 10 : « Deux sens du mot « nature » » ; « Premier sens : une maxime absurde ». Des lignes 11 à 32 : « Second sens : irrationnelle » ; « Second sens : immorale ». Des lignes 33 à 38 : « Un devoir de correction »."], "dev": [{"l": "1-10", "obj": "Deux sens du mot « nature » ; Premier sens : une maxime absurde.", "sp": ["<b>Deux sens du mot « nature ».</b> Le système entier des choses avec leurs propriétés, ou les choses telles qu’elles seraient sans intervention humaine.", "<b>Premier sens : une maxime absurde.</b> Si la nature est le tout, l’homme ne peut rien faire d’autre que la suivre, car toutes ses actions obéissent à des lois naturelles."], "tr": "Après avoir distingué deux sens du mot « nature », Mill examine le premier : si la nature est le tout, suivre la nature est une maxime absurde."}, {"l": "11-32", "obj": "Second sens : irrationnelle ; Second sens : immorale.", "sp": ["<b>Second sens : irrationnelle.</b> Toute action humaine altère le cours spontané de la nature, et toute action utile l’améliore. Prendre ce cours pour modèle contredit l’action.", "<b>Second sens : immorale.</b> Le cours naturel est rempli d’événements qui, venant de l’homme, inspireraient la répulsion. Imiter la nature ferait de lui le plus mauvais des hommes."], "tr": "Dans le second sens (le cours spontané des choses), la maxime est irrationnelle et immorale."}, {"l": "33-38", "obj": "Un devoir de correction.", "sp": ["<b>Un devoir de correction.</b> Le plan de la nature ne vise pas seulement le bien des êtres sensibles. L’homme doit corriger la part de la nature qu’il contrôle, selon une norme élevée de justice et de bonté."], "tr": ""}], "concl": ["Le texte se demande : « L’homme doit-il prendre la nature pour modèle ? » Mill répond ainsi : Suivre la nature est une maxime absurde si la nature est le tout, et irrationnelle et immorale si elle est le cours spontané des choses. L’homme doit corriger la nature, selon une norme de justice et de bonté.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « Deux sens du mot « nature » ; Premier sens : une maxime absurde » puis « Second sens : irrationnelle ; Second sens : immorale » puis « Un devoir de correction ».", "On peut enfin discuter cette thèse. La nature est-elle une norme ? Mill refuse que la nature fonde le bien. Faut-il alors admettre que la morale vient de l’homme seul ? (À comparer avec Aristote.)"]}, {"id": "nature-pascal", "label": "Pascal : ruches et hommes", "theme": "La nature", "auteur": "Pascal", "oeuvre": "Préface du Traité du vide", "fiche": "nature-pascal.html", "lignes": ["Les ruches des abeilles étaient aussi bien mesurées il", "y a mille ans qu’aujourd’hui, et chacune d’elle forme", "cet hexagone aussi exactement la première fois que la", "dernière. Il en est de même de tout ce que les animaux", "produisent par ce mouvement occulte. La nature les", "instruit à mesure que la nécessité les presse ; mais", "cette science fragile se perd avec les besoins qu’ils", "en ont : comme ils la reçoivent sans étude, ils n’ont", "pas le bonheur de la conserver ; et toutes les fois", "qu’elle leur est donnée, elle leur est nouvelle,", "puisque, la nature n’ayant pour objet que de maintenir", "les animaux dans un ordre de perfection bornée, elle", "leur inspire cette science nécessaire, toujours égale,", "de peur qu’ils ne tombent dans le dépérissement, et ne", "permet pas qu’ils y ajoutent, de peur qu’ils ne", "passent les limites qu’elle leur a prescrites.", "Il n’en est pas de même de l’homme, qui n’est produit", "que pour l’infinité. Il est dans l’ignorance au", "premier âge de sa vie ; mais il s’instruit sans cesse", "dans son progrès : car il tire avantage non seulement", "de sa propre expérience, mais encore de celle de ses", "prédécesseurs, parce qu’il garde toujours dans sa", "mémoire les connaissances qu’il s’est une fois", "acquises, et que celle des anciens lui sont toujours", "présentes dans les livres qu’ils en ont laissés."], "mots": "Mots-clés : Instinct, Perfection bornée, Progrès.", "lire": "<p><b>Objet du texte.</b> Qu’est-ce qui distingue l’homme de l’animal ? <b>Notion du programme.</b> La nature.</p><p><b>Connecteurs repérés.</b> « mais » (l.6), « puisque » (l.11), « car » (l.20). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Instinct</i> : savoir inné, identique chez tous les individus d’une espèce, qui ne varie pas. Pascal parle d’un « mouvement occulte ». ; <i>Perfection bornée</i> : l’animal est parfait dans ce qu’il fait, mais il ne peut pas aller au-delà. ; <i>Progrès</i> : amélioration continue des connaissances. Il suppose la mémoire et la transmission.</p>", "these": "<p><b>Thèse.</b> L’animal est limité par la nature, qui l’instruit sans lui permettre de progresser. L’homme, produit pour l’infinité, s’instruit par sa propre expérience et par celle de ses prédécesseurs.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « Les ruches sont toujours les mêmes » ; « Un savoir reçu sans étude, et perdu » ; « Une perfection bornée » ; « L’homme, lui, est « produit pour l’infinité » » ; « Une mémoire des savoirs ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-16", "idee": "Les ruches sont toujours les mêmes ; Un savoir reçu sans étude, et perdu ; Une perfection bornée.", "args": "Elles étaient aussi bien mesurées il y a mille ans qu’aujourd’hui : chacune forme son hexagone aussi exactement la première fois que la dernière. La nature instruit l’animal selon ses besoins. Comme il reçoit ce savoir sans étude, il n’a pas le bonheur de le conserver. La nature veut maintenir les animaux dans un ordre de perfection bornée : elle ne les laisse ni dépérir, ni progresser.", "lien": "Après avoir montré que l’animal reste toujours le même, borné par la nature qui l’instruit, Pascal passe à l’homme."}, {"l": "17-25", "idee": "L’homme, lui, est « produit pour l’infinité » ; Une mémoire des savoirs.", "args": "Ignorant au premier âge, il s’instruit sans cesse. Il n’est pas limité par un instinct. Il tire avantage de sa propre expérience et de celle de ses prédécesseurs, qu’il garde en mémoire et dans les livres des anciens.", "lien": "L’homme, lui, est produit pour l’infinité : il s’instruit par sa propre expérience et par celle de ses prédécesseurs."}], "concepts": [{"c": "Instinct", "s": "Savoir inné, identique chez tous les individus d’une espèce, qui ne varie pas. Pascal parle d’un « mouvement occulte »."}, {"c": "Perfection bornée", "s": "L’animal est parfait dans ce qu’il fait, mais il ne peut pas aller au-delà."}, {"c": "Progrès", "s": "Amélioration continue des connaissances. Il suppose la mémoire et la transmission."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que l’homme et l’animal seraient semblables, ou que l’animal progresserait comme l’homme.</p><p><b>Le problème.</b> Qu’est-ce qui distingue l’homme de l’animal ?</p><p><b>L’enjeu.</b> Cette thèse n’est pas évidente : l’animal instruit par la nature n’est-il pas parfait, et l’homme, ignorant à sa naissance, plus démuni ?</p><p><b>Formule.</b> « On dit souvent que l’homme et l’animal seraient semblables, ou que l’animal progresserait comme l’homme, mais Pascal soutient : L’animal est limité par la nature, qui l’instruit sans lui permettre de progresser. »</p><p><b>Discussion.</b> L’homme est-il tout à fait sans instinct ? Pascal oppose un animal fixe à un homme perfectible. Les sciences contemporaines nuancent-elles cette idée ?</p>", "intro": ["On compare souvent l’homme et l’animal, comme si la ruche des abeilles était un progrès comparable à celui des sociétés humaines. Dans la <i>Préface du Traité du vide</i>, Pascal soutient que ce qui distingue l’homme est qu’il est « produit pour l’infinité ».", "Pascal soutient la thèse suivante : L’animal est limité par la nature, qui l’instruit sans lui permettre de progresser. L’homme, produit pour l’infinité, s’instruit par sa propre expérience et par celle de ses prédécesseurs. Cette thèse n’est pas évidente : l’animal instruit par la nature n’est-il pas parfait, et l’homme, ignorant à sa naissance, plus démuni ?", "Le texte avance en deux temps. Des lignes 1 à 16 : « Les ruches sont toujours les mêmes » ; « Un savoir reçu sans étude, et perdu » ; « Une perfection bornée ». Des lignes 17 à 25 : « L’homme, lui, est « produit pour l’infinité » » ; « Une mémoire des savoirs »."], "dev": [{"l": "1-16", "obj": "Les ruches sont toujours les mêmes ; Un savoir reçu sans étude, et perdu ; Une perfection bornée.", "sp": ["<b>Les ruches sont toujours les mêmes.</b> Elles étaient aussi bien mesurées il y a mille ans qu’aujourd’hui : chacune forme son hexagone aussi exactement la première fois que la dernière.", "<b>Un savoir reçu sans étude, et perdu.</b> La nature instruit l’animal selon ses besoins. Comme il reçoit ce savoir sans étude, il n’a pas le bonheur de le conserver.", "<b>Une perfection bornée.</b> La nature veut maintenir les animaux dans un ordre de perfection bornée : elle ne les laisse ni dépérir, ni progresser."], "tr": "Après avoir montré que l’animal reste toujours le même, borné par la nature qui l’instruit, Pascal passe à l’homme."}, {"l": "17-25", "obj": "L’homme, lui, est « produit pour l’infinité » ; Une mémoire des savoirs.", "sp": ["<b>L’homme, lui, est « produit pour l’infinité ».</b> Ignorant au premier âge, il s’instruit sans cesse. Il n’est pas limité par un instinct.", "<b>Une mémoire des savoirs.</b> Il tire avantage de sa propre expérience et de celle de ses prédécesseurs, qu’il garde en mémoire et dans les livres des anciens."], "tr": ""}], "concl": ["Le texte se demande : « Qu’est-ce qui distingue l’homme de l’animal ? » Pascal répond ainsi : L’animal est limité par la nature, qui l’instruit sans lui permettre de progresser. L’homme, produit pour l’infinité, s’instruit par sa propre expérience et par celle de ses prédécesseurs.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « Les ruches sont toujours les mêmes ; Un savoir reçu sans étude, et perdu ; Une perfection bornée » puis « L’homme, lui, est « produit pour l’infinité » ; Une mémoire des savoirs ».", "On peut enfin discuter cette thèse. L’homme est-il tout à fait sans instinct ? Pascal oppose un animal fixe à un homme perfectible. Les sciences contemporaines nuancent-elles cette idée ?"]}, {"id": "religion-kant", "label": "Kant : l’existence de Dieu comme nécessité morale", "theme": "La religion", "auteur": "Kant", "oeuvre": "Critique de la raison pratique", "fiche": "religion-kant.html", "lignes": ["Le bonheur est l’état dans le monde d’un être", "raisonnable, à qui, dans tout le cours de son", "existence, tout arrive suivant son souhait et sa", "volonté ; il repose donc sur l’accord de la nature", "avec le but tout entier qu’il poursuit, et aussi avec", "le principe essentiel de détermination de sa volonté.", "Or la loi morale, comme une loi de la liberté, ordonne", "par des principes déterminants qui doivent être tout à", "fait indépendants de la nature et de l’accord de cette", "dernière avec notre faculté de désirer (comme", "mobiles). Mais l’être raisonnable, qui agit dans le", "monde, n’est pas cependant en même temps cause du", "monde et de la nature elle-même. Donc, dans la loi", "morale, il n’y a pas le moindre principe pour une", "connexion nécessaire entre la moralité et le bonheur", "qui lui est proportionné, chez un être appartenant", "comme partie au monde et par conséquent en dépendant,", "qui justement pour cela, ne peut, par sa volonté, être", "cause de cette nature et ne peut, quant à son bonheur,", "la mettre par ses propres forces complètement d’accord", "avec ses principes pratiques.", "Cependant dans le problème pratique de la raison pure,", "c’est-à-dire dans la poursuite nécessaire du souverain", "bien, on postule une telle connexion comme nécessaire", ": nous devons chercher à réaliser le souverain bien", "(qui doit donc être possible). Ainsi on postule aussi", "l’existence d’une cause de toute la nature, distincte", "de la nature et contenant le principe de cette", "connexion, c’est-à-dire de l’harmonie exacte du", "bonheur et de la moralité. Mais cette cause suprême", "doit renfermer le principe de l’accord de la nature,", "non seulement avec une loi de la volonté des êtres", "raisonnables, mais aussi avec la représentation de", "cette loi en tant que ceux-ci en font le principe", "suprême de détermination de leur volonté ; partant non", "seulement avec les mœurs d’après la forme, mais aussi", "avec leur moralité comme principe déterminant, c’est-", "à-dire avec leur intention morale.", "Le souverain bien n’est donc possible dans le monde", "qu’en tant qu’on admet une cause suprême de la nature", "qui a une causalité conforme à l’intention morale. Or", "un être qui est capable d’agir d’après la", "représentation de lois est une intelligence (un être", "raisonnable), et la causalité d’un tel être, d’après", "cette représentation des lois, est sa volonté. Donc la", "cause suprême de la nature, en tant qu’elle doit être", "supposée pour le souverain bien, est un être qui, par", "l’entendement et la volonté, est la cause, partant", "l’auteur de la nature, c’est-à-dire Dieu. Par", "conséquent le postulat de la possibilité du souverain", "bien dérivé (du meilleur monde) est en même temps le", "postulat de la réalité d’un souverain bien primitif, à", "savoir de l’existence de Dieu.", "Or, c’était un devoir pour nous de réaliser le", "souverain bien, partant non seulement un droit, mais", "aussi une nécessité liée comme besoin avec le devoir,", "de supposer la possibilité de ce souverain bien, qui,", "puisqu’il n’est possible que sous la condition de", "l’existence de Dieu, lie inséparablement la", "supposition de cette existence avec le devoir, c’est-", "à-dire qu’il est moralement nécessaire d’admettre", "l’existence de Dieu."], "mots": "Mots-clés : Souverain bien, Postulat, Raison pratique.", "lire": "<p><b>Objet du texte.</b> Comment l’existence de Dieu peut-elle être exigée par la morale, et non démontrée par la théorie ? <b>Notion du programme.</b> La religion.</p><p><b>Connecteurs repérés.</b> « donc » (l.4), « or » (l.7), « mais » (l.11), « cependant » (l.12), « par conséquent » (l.17), « ainsi » (l.26). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Souverain bien</i> : accord parfait de la vertu et du bonheur, que le devoir nous demande de réaliser. ; <i>Postulat</i> : proposition qu’on admet comme condition nécessaire à la pratique morale, sans pouvoir la démontrer. ; <i>Raison pratique</i> : raison en tant qu’elle détermine la volonté et l’action.</p>", "these": "<p><b>Thèse.</b> La loi morale ne garantit pas l’accord entre moralité et bonheur. Or nous devons réaliser le souverain bien. Il faut donc postuler une cause suprême de la nature, c’est-à-dire Dieu, comme condition de sa possibilité.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « Bonheur et loi morale sont distincts » ; « Aucun lien nécessaire dans la loi morale » ; « Pourtant, nous devons poursuivre le souverain bien » ; « Il faut postuler une cause suprême » ; « Cette cause est Dieu ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-21", "idee": "Bonheur et loi morale sont distincts ; Aucun lien nécessaire dans la loi morale.", "args": "Le bonheur suppose l’accord de la nature avec nos souhaits. La loi morale, elle, est une loi de la liberté, indépendante de la nature. L’être raisonnable n’est pas cause de la nature : rien dans la loi morale ne garantit un bonheur proportionné à la moralité.", "lien": "Après avoir distingué le bonheur de la loi morale (aucun lien nécessaire), Kant rappelle que nous devons pourtant poursuivre le souverain bien, qui les unit."}, {"l": "22-41", "idee": "Pourtant, nous devons poursuivre le souverain bien ; Il faut postuler une cause suprême.", "args": "La raison pratique exige de réaliser le souverain bien, harmonie de la moralité et du bonheur. Il doit donc être possible. Cette connexion suppose une cause de la nature, distincte d’elle, qui accorde le bonheur à l’intention morale.", "lien": "Si nous devons réaliser le souverain bien, il faut en postuler la possibilité, donc une cause suprême de la nature."}, {"l": "41-62", "idee": "Cette cause est Dieu.", "args": "Cette cause est une intelligence et une volonté, auteur de la nature. Il est donc moralement nécessaire d’admettre l’existence de Dieu.", "lien": "Cette cause suprême est Dieu : c’est le postulat de la raison pratique."}], "concepts": [{"c": "Souverain bien", "s": "Accord parfait de la vertu et du bonheur, que le devoir nous demande de réaliser."}, {"c": "Postulat", "s": "Proposition qu’on admet comme condition nécessaire à la pratique morale, sans pouvoir la démontrer."}, {"c": "Raison pratique", "s": "Raison en tant qu’elle détermine la volonté et l’action."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que l’existence de Dieu devrait se démontrer par la raison théorique, ou qu’elle ne serait qu’une croyance arbitraire.</p><p><b>Le problème.</b> Comment l’existence de Dieu peut-elle être exigée par la morale, et non démontrée par la théorie ?</p><p><b>L’enjeu.</b> Cette thèse n’est pas évidente : comment une exigence morale peut-elle fonder la croyance en Dieu sans prétendre le démontrer ?</p><p><b>Formule.</b> « On dit souvent que l’existence de Dieu devrait se démontrer par la raison théorique, ou qu’elle ne serait qu’une croyance arbitraire, mais Kant soutient : La loi morale ne garantit pas l’accord entre moralité et bonheur. »</p><p><b>Discussion.</b> Une preuve ou une exigence ? Kant ne prouve pas Dieu : il le postule. Est-ce une raison suffisante de croire ? (À comparer avec Nietzsche.)</p>", "intro": ["On croit souvent que l’existence de Dieu devrait se démontrer, ou qu’elle ne relève que d’une croyance arbitraire. Dans la <i>Critique de la raison pratique</i>, Kant soutient que la morale exige de postuler l’existence de Dieu.", "Kant soutient la thèse suivante : La loi morale ne garantit pas l’accord entre moralité et bonheur. Or nous devons réaliser le souverain bien. Il faut donc postuler une cause suprême de la nature, c’est-à-dire Dieu, comme condition de sa possibilité. Cette thèse n’est pas évidente : comment une exigence morale peut-elle fonder la croyance en Dieu sans prétendre le démontrer ?", "Le texte avance en trois temps. Des lignes 1 à 21 : « Bonheur et loi morale sont distincts » ; « Aucun lien nécessaire dans la loi morale ». Des lignes 22 à 41 : « Pourtant, nous devons poursuivre le souverain bien » ; « Il faut postuler une cause suprême ». Des lignes 41 à 62 : « Cette cause est Dieu »."], "dev": [{"l": "1-21", "obj": "Bonheur et loi morale sont distincts ; Aucun lien nécessaire dans la loi morale.", "sp": ["<b>Bonheur et loi morale sont distincts.</b> Le bonheur suppose l’accord de la nature avec nos souhaits. La loi morale, elle, est une loi de la liberté, indépendante de la nature.", "<b>Aucun lien nécessaire dans la loi morale.</b> L’être raisonnable n’est pas cause de la nature : rien dans la loi morale ne garantit un bonheur proportionné à la moralité."], "tr": "Après avoir distingué le bonheur de la loi morale (aucun lien nécessaire), Kant rappelle que nous devons pourtant poursuivre le souverain bien, qui les unit."}, {"l": "22-41", "obj": "Pourtant, nous devons poursuivre le souverain bien ; Il faut postuler une cause suprême.", "sp": ["<b>Pourtant, nous devons poursuivre le souverain bien.</b> La raison pratique exige de réaliser le souverain bien, harmonie de la moralité et du bonheur. Il doit donc être possible.", "<b>Il faut postuler une cause suprême.</b> Cette connexion suppose une cause de la nature, distincte d’elle, qui accorde le bonheur à l’intention morale."], "tr": "Si nous devons réaliser le souverain bien, il faut en postuler la possibilité, donc une cause suprême de la nature."}, {"l": "41-62", "obj": "Cette cause est Dieu.", "sp": ["<b>Cette cause est Dieu.</b> Cette cause est une intelligence et une volonté, auteur de la nature. Il est donc moralement nécessaire d’admettre l’existence de Dieu."], "tr": ""}], "concl": ["Le texte se demande : « Comment l’existence de Dieu peut-elle être exigée par la morale, et non démontrée par la théorie ? » Kant répond ainsi : La loi morale ne garantit pas l’accord entre moralité et bonheur. Or nous devons réaliser le souverain bien. Il faut donc postuler une cause suprême de la nature, c’est-à-dire Dieu, comme condition de sa possibilité.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « Bonheur et loi morale sont distincts ; Aucun lien nécessaire dans la loi morale » puis « Pourtant, nous devons poursuivre le souverain bien ; Il faut postuler une cause suprême » puis « Cette cause est Dieu ».", "On peut enfin discuter cette thèse. Une preuve ou une exigence ? Kant ne prouve pas Dieu : il le postule. Est-ce une raison suffisante de croire ? (À comparer avec Nietzsche.)"]}, {"id": "religion-marx", "label": "Marx : la religion est l’opium du peuple", "theme": "La religion", "auteur": "Marx", "oeuvre": "Critique de la philosophie du droit de Hegel", "fiche": "religion-marx.html", "lignes": ["La religion est la théorie générale de ce monde, sa", "somme encyclopédique, sa logique sous forme populaire,", "son point d’honneur spirituel, son enthousiasme, sa", "sanction morale, son complément solennel, sa", "consolation et sa justification universelles. Elle est", "la réalisation fantasmagorique de l’essence humaine,", "parce que l’essence humaine ne possède pas de vraie", "réalité. Lutter contre la religion, c’est donc", "indirectement lutter contre ce monde-là dont la", "religion est l’arôme spirituel.", "La détresse religieuse est, pour une part,", "l’expression de la détresse réelle, et, pour une", "autre, la protestation contre la détresse réelle. La", "religion est le soupir de la créature opprimée, l’âme", "d’un monde sans cœur, comme elle est l’esprit de", "conditions sociales d’où l’esprit est exclu. Elle est", "l’opium du peuple.", "L’abolition de la religion en tant que bonheur", "illusoire du peuple est l’exigence que formule son", "bonheur réel. Exiger qu’il renonce aux illusions sur", "sa situation, c’est exiger qu’il renonce à une", "situation qui a besoin d’illusions. La critique de la", "religion est donc en germe la critique de cette vallée", "de larmes dont la religion est l’auréole."], "mots": "Mots-clés : Opium, Illusion, Détresse réelle.", "lire": "<p><b>Objet du texte.</b> Quelle est la fonction de la religion dans un monde de détresse ? <b>Notion du programme.</b> La religion.</p><p><b>Connecteurs repérés.</b> « parce que » (l.7), « donc » (l.8), « d’où » (l.16). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Opium</i> : drogue qui calme la douleur sans soigner. Image d’un remède qui anesthésie. ; <i>Illusion</i> : croyance fausse qui console. Elle masque la réalité de l’oppression. ; <i>Détresse réelle</i> : la misère sociale et matérielle dont la religion est le reflet.</p>", "these": "<p><b>Thèse.</b> La religion est à la fois expression et protestation contre la détresse réelle ; consolation, elle procure un bonheur illusoire. Sa critique est le germe de la critique du monde social qui a besoin d’illusions.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « La religion, théorie de ce monde » ; « Une réalisation fantasmagorique de l’homme » ; « Détresse exprimée et contestée » ; « Soupir, âme, opium » ; « Renoncer aux illusions, changer la situation ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-10", "idee": "La religion, théorie de ce monde ; Une réalisation fantasmagorique de l’homme.", "args": "Elle est sa théorie générale, sa logique populaire, sa consolation et sa justification universelles. Elle réalise de façon illusoire l’essence humaine, parce que celle-ci ne possède pas de vraie réalité.", "lien": "Après avoir défini la religion comme théorie de ce monde et réalisation illusoire de l’essence humaine, Marx dit ce qu’elle exprime : la détresse réelle, et la protestation contre elle."}, {"l": "11-17", "idee": "Détresse exprimée et contestée ; Soupir, âme, opium.", "args": "La détresse religieuse exprime la détresse réelle, et en est aussi la protestation. La religion est le soupir de la créature opprimée, l’âme d’un monde sans cœur, l’opium du peuple : elle soulage sans guérir.", "lien": "Si la religion est un soupir mais aussi un opium, il faut en tirer la conséquence : renoncer aux illusions, c’est exiger de changer la situation."}, {"l": "18-24", "idee": "Renoncer aux illusions, changer la situation.", "args": "Abolir le bonheur illusoire, c’est exiger le bonheur réel : renoncer aux illusions, c’est renoncer à une situation qui en a besoin.", "lien": "La critique de la religion est ainsi le germe de la critique du monde social qui a besoin d’illusions."}], "concepts": [{"c": "Opium", "s": "Drogue qui calme la douleur sans soigner. Image d’un remède qui anesthésie."}, {"c": "Illusion", "s": "Croyance fausse qui console. Elle masque la réalité de l’oppression."}, {"c": "Détresse réelle", "s": "La misère sociale et matérielle dont la religion est le reflet."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que la religion ne serait qu’une erreur ou une superstition, sans fonction.</p><p><b>Le problème.</b> Quelle est la fonction de la religion dans un monde de détresse ?</p><p><b>L’enjeu.</b> Cette thèse est ambivalente : la religion est à la fois l’expression de la détresse, une consolation illusoire et une protestation.</p><p><b>Formule.</b> « On dit souvent que la religion ne serait qu’une erreur ou une superstition, sans fonction, mais Marx soutient : La religion est à la fois expression et protestation contre la détresse réelle ; consolation, elle procure un bonheur illusoire. »</p><p><b>Discussion.</b> Une critique de la religion ou du monde ? Marx vise surtout la société qui rend la religion nécessaire. La croyance disparaît-elle avec la misère ? (À comparer avec Nietzsche.)</p>", "intro": ["On dit souvent que la religion n’est qu’une erreur ou une superstition. Dans sa <i>Critique de la philosophie du droit de Hegel</i>, Marx lui donne une fonction dans un monde de détresse.", "Marx soutient la thèse suivante : La religion est à la fois expression et protestation contre la détresse réelle ; consolation, elle procure un bonheur illusoire. Sa critique est le germe de la critique du monde social qui a besoin d’illusions. Cette thèse est ambivalente : la religion est à la fois l’expression de la détresse, une consolation illusoire et une protestation.", "Le texte avance en trois temps. Des lignes 1 à 10 : « La religion, théorie de ce monde » ; « Une réalisation fantasmagorique de l’homme ». Des lignes 11 à 17 : « Détresse exprimée et contestée » ; « Soupir, âme, opium ». Des lignes 18 à 24 : « Renoncer aux illusions, changer la situation »."], "dev": [{"l": "1-10", "obj": "La religion, théorie de ce monde ; Une réalisation fantasmagorique de l’homme.", "sp": ["<b>La religion, théorie de ce monde.</b> Elle est sa théorie générale, sa logique populaire, sa consolation et sa justification universelles.", "<b>Une réalisation fantasmagorique de l’homme.</b> Elle réalise de façon illusoire l’essence humaine, parce que celle-ci ne possède pas de vraie réalité."], "tr": "Après avoir défini la religion comme théorie de ce monde et réalisation illusoire de l’essence humaine, Marx dit ce qu’elle exprime : la détresse réelle, et la protestation contre elle."}, {"l": "11-17", "obj": "Détresse exprimée et contestée ; Soupir, âme, opium.", "sp": ["<b>Détresse exprimée et contestée.</b> La détresse religieuse exprime la détresse réelle, et en est aussi la protestation.", "<b>Soupir, âme, opium.</b> La religion est le soupir de la créature opprimée, l’âme d’un monde sans cœur, l’opium du peuple : elle soulage sans guérir."], "tr": "Si la religion est un soupir mais aussi un opium, il faut en tirer la conséquence : renoncer aux illusions, c’est exiger de changer la situation."}, {"l": "18-24", "obj": "Renoncer aux illusions, changer la situation.", "sp": ["<b>Renoncer aux illusions, changer la situation.</b> Abolir le bonheur illusoire, c’est exiger le bonheur réel : renoncer aux illusions, c’est renoncer à une situation qui en a besoin."], "tr": ""}], "concl": ["Le texte se demande : « Quelle est la fonction de la religion dans un monde de détresse ? » Marx répond ainsi : La religion est à la fois expression et protestation contre la détresse réelle ; consolation, elle procure un bonheur illusoire. Sa critique est le germe de la critique du monde social qui a besoin d’illusions.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « La religion, théorie de ce monde ; Une réalisation fantasmagorique de l’homme » puis « Détresse exprimée et contestée ; Soupir, âme, opium » puis « Renoncer aux illusions, changer la situation ».", "On peut enfin discuter cette thèse. Une critique de la religion ou du mond
