e majorité qui use sans limite de sa toute-puissance.</p>", "these": "<p><b>Thèse.</b> La majorité est l’origine des pouvoirs, mais elle n’a pas le droit de tout faire : la justice limite la souveraineté du peuple.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « L’objection » ; « Une loi supérieure : la justice » ; « Un jury de la société universelle » ; « Une majorité n’est qu’un individu ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-11", "idee": "L’objection ; Une loi supérieure : la justice.", "args": "Refuser à la majorité le droit de tout faire tout en plaçant dans ses volontés l’origine des pouvoirs, est-ce se contredire ? Non. Il existe une loi supérieure, la justice, adoptée par la majorité de tous les hommes : elle borne le droit de chaque peuple.", "lien": "Après avoir répondu à l’objection par l’existence d’une loi supérieure, la justice, Tocqueville montre ce que cela change : un peuple est comme un jury représentant la société universelle."}, {"l": "12-19", "idee": "Un jury de la société universelle.", "args": "Un peuple est comme un jury qui représente la société universelle : refuser une loi injuste, c’est en appeler de la souveraineté du peuple à celle du genre humain.", "lien": "Si un peuple est un jury, refuser une loi injuste n’est pas nier la souveraineté du peuple : c’est en appeler au genre humain ; il reste à montrer pourquoi on ne peut confier à la majorité un pouvoir illimité."}, {"l": "20-32", "idee": "Une majorité n’est qu’un individu.", "args": "Une majorité n’est qu’un individu collectif : si la toute-puissance d’un seul est dangereuse, celle de plusieurs l’est aussi.", "lien": "Une majorité n’est qu’un individu collectif : la toute-puissance de plusieurs est aussi dangereuse que celle d’un seul."}], "concepts": [{"c": "Souveraineté du peuple", "s": "Principe selon lequel le pouvoir appartient au peuple, ou à sa majorité."}, {"c": "Justice", "s": "Loi supérieure qui borne le droit de chaque peuple."}, {"c": "Tyrannie de la majorité", "s": "Danger d’une majorité qui use sans limite de sa toute-puissance."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que la majorité aurait le droit de tout faire, parce qu’elle exprime la volonté du peuple.</p><p><b>Le problème.</b> La souveraineté du peuple est-elle illimitée ?</p><p><b>L’enjeu.</b> Cette thèse paraît contradictoire : comment placer dans les volontés du peuple l’origine des pouvoirs tout en lui refusant le droit de tout faire ?</p><p><b>Formule.</b> « On dit souvent que la majorité aurait le droit de tout faire, parce qu’elle exprime la volonté du peuple, mais Tocqueville soutient : La majorité est l’origine des pouvoirs, mais elle n’a pas le droit de tout faire : la justice limite la souveraineté du peuple. »</p><p><b>Discussion.</b> Qui juge de la justice ? Si la justice limite la majorité, qui décide de ce qui est juste ? (À comparer avec Hobbes.)</p>", "intro": ["On pense souvent que ce que décide la majorité est juste, puisqu’elle exprime la volonté du peuple. Dans <i>De la démocratie en Amérique</i>, Tocqueville refuse à la majorité le droit de tout faire.", "Tocqueville soutient la thèse suivante : La majorité est l’origine des pouvoirs, mais elle n’a pas le droit de tout faire : la justice limite la souveraineté du peuple. Cette thèse paraît contradictoire : comment placer dans les volontés du peuple l’origine des pouvoirs tout en lui refusant le droit de tout faire ?", "Le texte avance en trois temps. Des lignes 1 à 11 : « L’objection » ; « Une loi supérieure : la justice ». Des lignes 12 à 19 : « Un jury de la société universelle ». Des lignes 20 à 32 : « Une majorité n’est qu’un individu »."], "dev": [{"l": "1-11", "obj": "L’objection ; Une loi supérieure : la justice.", "sp": ["<b>L’objection.</b> Refuser à la majorité le droit de tout faire tout en plaçant dans ses volontés l’origine des pouvoirs, est-ce se contredire ? Non.", "<b>Une loi supérieure : la justice.</b> Il existe une loi supérieure, la justice, adoptée par la majorité de tous les hommes : elle borne le droit de chaque peuple."], "tr": "Après avoir répondu à l’objection par l’existence d’une loi supérieure, la justice, Tocqueville montre ce que cela change : un peuple est comme un jury représentant la société universelle."}, {"l": "12-19", "obj": "Un jury de la société universelle.", "sp": ["<b>Un jury de la société universelle.</b> Un peuple est comme un jury qui représente la société universelle : refuser une loi injuste, c’est en appeler de la souveraineté du peuple à celle du genre humain."], "tr": "Si un peuple est un jury, refuser une loi injuste n’est pas nier la souveraineté du peuple : c’est en appeler au genre humain ; il reste à montrer pourquoi on ne peut confier à la majorité un pouvoir illimité."}, {"l": "20-32", "obj": "Une majorité n’est qu’un individu.", "sp": ["<b>Une majorité n’est qu’un individu.</b> Une majorité n’est qu’un individu collectif : si la toute-puissance d’un seul est dangereuse, celle de plusieurs l’est aussi."], "tr": ""}], "concl": ["Le texte se demande : « La souveraineté du peuple est-elle illimitée ? » Tocqueville répond ainsi : La majorité est l’origine des pouvoirs, mais elle n’a pas le droit de tout faire : la justice limite la souveraineté du peuple.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « L’objection ; Une loi supérieure : la justice » puis « Un jury de la société universelle » puis « Une majorité n’est qu’un individu ».", "On peut enfin discuter cette thèse. Qui juge de la justice ? Si la justice limite la majorité, qui décide de ce qui est juste ? (À comparer avec Hobbes.)"]}, {"id": "dem-tocqueville2", "label": "Tocqueville, De la démocratie en Amérique (2) (le despotisme doux)", "theme": "La démocratie", "auteur": "Tocqueville", "oeuvre": "De la démocratie en Amérique", "fiche": "textes-democratie.html", "lignes": ["Je veux imaginer sous quels traits nouveaux le", "despotisme pourrait se produire dans le monde : je", "vois une foule innombrable d’hommes semblables et", "égaux qui tournent sans repos sur eux-mêmes pour se", "procurer de petits et vulgaires plaisirs, dont ils", "emplissent leur âme. Chacun d’eux, retiré à l’écart,", "est comme étranger à la destinée de tous les autres :", "ses enfants et ses amis particuliers forment pour lui", "toute l’espèce humaine ; quant au demeurant de ses", "concitoyens, il est à côté d’eux, mais il ne les voit", "pas ; il les touche et ne les sent point ; il n’existe", "qu’en lui-même et pour lui seul, et, s’il lui reste", "encore une famille, on peut dire du moins qu’il n’a", "plus de patrie.", "Au-dessus de ceux-là s’élève un pouvoir immense et", "tutélaire, qui se charge seul d’assurer leur", "jouissance et de veiller sur leur sort. Il est absolu,", "prévoyant, régulier et doux. Il ressemblerait à la", "puissance paternelle si, comme elle, il avait pour", "objet de préparer les hommes à l’âge viril ; mais il", "ne cherche, au contraire, qu’à les fixer", "irrévocablement dans l’enfance ; il aime que les", "citoyens se réjouissent pourvu qu’ils ne songent qu’à", "se réjouir. Il travaille volontiers à leur bonheur ;", "mais il veut en être l’unique agent et le seul arbitre", "; il pourvoit à leur sécurité, prévoit et assure leurs", "besoins, facilite leurs plaisirs, conduit leurs", "principales affaires, dirige leur industrie, règle", "leurs successions, divise leurs héritages ; que ne", "peut-il leur ôter entièrement le trouble de penser et", "la peine de vivre ?"], "mots": "Mots-clés : Despotisme, Pouvoir tutélaire, Égalité des conditions.", "lire": "<p><b>Objet du texte.</b> Quel nouveau despotisme menace les démocraties ? <b>Notion du programme.</b> La démocratie.</p><p><b>Connecteurs repérés.</b> « mais » (l.10), « si… » (l.19). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Despotisme</i> : pouvoir absolu d’un seul ou d’une instance, sans limite. ; <i>Pouvoir tutélaire</i> : pouvoir qui se charge du bonheur des citoyens, comme un tuteur. ; <i>Égalité des conditions</i> : situation de citoyens semblables, sans distinction de rang héréditaire.</p>", "these": "<p><b>Thèse.</b> Tocqueville imagine un despotisme nouveau, doux et tutélaire, qui menacerait des citoyens égaux mais repliés sur eux-mêmes.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « Des citoyens égaux et repliés » ; « Un pouvoir immense et tutélaire » ; « Une puissance paternelle » ; « L’ôter l’effort de penser ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-14", "idee": "Des citoyens égaux et repliés.", "args": "Des hommes semblables et égaux tournent sur eux-mêmes pour de petits plaisirs, étrangers à la destinée des autres : ils n’ont plus de patrie.", "lien": "Après avoir décrit des citoyens égaux, repliés sur leurs petits plaisirs, Tocqueville montre le pouvoir qui s’élève au-dessus d’eux : immense, absolu et doux."}, {"l": "15-24", "idee": "Un pouvoir immense et tutélaire ; Une puissance paternelle.", "args": "Au-dessus d’eux, un pouvoir immense se charge seul de leur jouissance et de leur sort : il est absolu, prévoyant, régulier et doux. Il ressemblerait à une puissance paternelle, mais il cherche à les maintenir dans l’enfance et veut être l’unique agent et arbitre de leur bonheur.", "lien": "Ce pouvoir, qui ressemble à une puissance paternelle, cherche pourtant à maintenir les citoyens dans l’enfance ; il en tire la conséquence ultime."}, {"l": "24-31", "idee": "L’ôter l’effort de penser.", "args": "Il conduit leurs affaires et assure leurs besoins : il voudrait même leur ôter l’effort de penser et de vivre.", "lien": "Il conduit leurs affaires et voudrait leur ôter la peine de penser et de vivre : c’est ce qui en fait un despotisme."}], "concepts": [{"c": "Despotisme", "s": "Pouvoir absolu d’un seul ou d’une instance, sans limite."}, {"c": "Pouvoir tutélaire", "s": "Pouvoir qui se charge du bonheur des citoyens, comme un tuteur."}, {"c": "Égalité des conditions", "s": "Situation de citoyens semblables, sans distinction de rang héréditaire."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que le despotisme serait un pouvoir violent, qui s’impose par la force et la peur.</p><p><b>Le problème.</b> Quel nouveau despotisme menace les démocraties ?</p><p><b>L’enjeu.</b> Cette thèse est paradoxale : comment un pouvoir doux, qui travaille à notre bonheur, peut-il être un despotisme ?</p><p><b>Formule.</b> « On dit souvent que le despotisme serait un pouvoir violent, qui s’impose par la force et la peur, mais Tocqueville soutient : Tocqueville imagine un despotisme nouveau, doux et tutélaire, qui menacerait des citoyens égaux mais repliés sur eux-mêmes. »</p><p><b>Discussion.</b> L’État providence est-il un despotisme doux ? Où passe la limite entre protéger les citoyens et les infantiliser ? (À comparer avec Alain.)</p>", "intro": ["On croit souvent que le despotisme est un pouvoir violent, qui s’impose par la peur. Dans <i>De la démocratie en Amérique</i>, Tocqueville imagine un despotisme d’un genre nouveau, qui menacerait les démocraties.", "Tocqueville soutient la thèse suivante : Tocqueville imagine un despotisme nouveau, doux et tutélaire, qui menacerait des citoyens égaux mais repliés sur eux-mêmes. Cette thèse est paradoxale : comment un pouvoir doux, qui travaille à notre bonheur, peut-il être un despotisme ?", "Le texte avance en trois temps. Des lignes 1 à 14 : « Des citoyens égaux et repliés ». Des lignes 15 à 24 : « Un pouvoir immense et tutélaire » ; « Une puissance paternelle ». Des lignes 24 à 31 : « L’ôter l’effort de penser »."], "dev": [{"l": "1-14", "obj": "Des citoyens égaux et repliés.", "sp": ["<b>Des citoyens égaux et repliés.</b> Des hommes semblables et égaux tournent sur eux-mêmes pour de petits plaisirs, étrangers à la destinée des autres : ils n’ont plus de patrie."], "tr": "Après avoir décrit des citoyens égaux, repliés sur leurs petits plaisirs, Tocqueville montre le pouvoir qui s’élève au-dessus d’eux : immense, absolu et doux."}, {"l": "15-24", "obj": "Un pouvoir immense et tutélaire ; Une puissance paternelle.", "sp": ["<b>Un pouvoir immense et tutélaire.</b> Au-dessus d’eux, un pouvoir immense se charge seul de leur jouissance et de leur sort : il est absolu, prévoyant, régulier et doux.", "<b>Une puissance paternelle.</b> Il ressemblerait à une puissance paternelle, mais il cherche à les maintenir dans l’enfance et veut être l’unique agent et arbitre de leur bonheur."], "tr": "Ce pouvoir, qui ressemble à une puissance paternelle, cherche pourtant à maintenir les citoyens dans l’enfance ; il en tire la conséquence ultime."}, {"l": "24-31", "obj": "L’ôter l’effort de penser.", "sp": ["<b>L’ôter l’effort de penser.</b> Il conduit leurs affaires et assure leurs besoins : il voudrait même leur ôter l’effort de penser et de vivre."], "tr": ""}], "concl": ["Le texte se demande : « Quel nouveau despotisme menace les démocraties ? » Tocqueville répond ainsi : Tocqueville imagine un despotisme nouveau, doux et tutélaire, qui menacerait des citoyens égaux mais repliés sur eux-mêmes.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « Des citoyens égaux et repliés » puis « Un pouvoir immense et tutélaire ; Une puissance paternelle » puis « L’ôter l’effort de penser ».", "On peut enfin discuter cette thèse. L’État providence est-il un despotisme doux ? Où passe la limite entre protéger les citoyens et les infantiliser ? (À comparer avec Alain.)"]}, {"id": "justice-hobbes", "label": "Hobbes : qu’est-ce qu’une bonne loi ?", "theme": "La justice", "auteur": "Hobbes", "oeuvre": "Léviathan", "fiche": "justice-hobbes.html", "lignes": ["Qu’est-ce qu’une bonne loi ? Par bonne loi, je", "n’entends pas une loi juste, car aucune loi ne peut", "être injuste. La loi est faite par le pouvoir", "souverain, et tout ce qui est fait par ce pouvoir est", "approuvé et reconnu pour sien par chaque membre du", "peuple : et ce que chacun veut ne saurait être dit", "injuste par personne. Il en est des lois de la", "République comme des lois des jeux : ce sur quoi les", "joueurs se sont accordés n’est pour aucun d’eux une", "injustice. Une bonne loi se caractérise par le fait", "qu’elle est, en même temps, nécessaire au bien du", "peuple et claire. En effet, le rôle des lois, qui ne", "sont que des règles revêtues d’une autorité, n’est pas", "d’entraver toute action volontaire, mais seulement de", "diriger et de contenir les mouvements des gens, de", "manière à éviter qu’emportés par la violence de leurs", "désirs, leur précipitation ou leur manque de", "discernement, ils ne se fassent de mal : ce sont comme", "des haies disposées non pour arrêter les voyageurs,", "mais pour les maintenir sur le chemin.", "C’est pourquoi si une loi n’est pas nécessaire et que", "la vraie fin de toute loi lui fasse défaut, elle n’est", "pas bonne. On peut croire qu’une loi est bonne quand", "elle apporte un avantage au souverain sans pourtant", "être nécessaire au peuple ; mais cela n’est pas. En", "effet, le bien du souverain et celui du peuple ne", "sauraient être séparés."], "mots": "Mots-clés : Souverain, Bonne loi, Justice légale.", "lire": "<p><b>Objet du texte.</b> Qu’est-ce qui fait la qualité d’une loi : sa justice, ou son utilité ? <b>Notion du programme.</b> La justice.</p><p><b>Connecteurs repérés.</b> « car » (l.2), « en effet » (l.12), « mais » (l.14), « c’est pourquoi » (l.21), « pourquoi » (l.21), « si… » (l.21). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Souverain</i> : pouvoir qui fait les lois, auquel chacun a consenti. ; <i>Bonne loi</i> : loi nécessaire au bien du peuple et claire, qui accomplit la fin de toute loi. ; <i>Justice légale</i> : chez Hobbes, est juste ce qui est conforme à la loi établie par le souverain.</p>", "these": "<p><b>Thèse.</b> Aucune loi ne peut être injuste puisque chacun l’a approuvée. Une bonne loi est celle qui est nécessaire au bien du peuple et claire : elle dirige les hommes sans les entraver, comme des haies le long d’un chemin.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « Aucune loi n’est injuste » ; « Comme les lois d’un jeu » ; « Une bonne loi est nécessaire et claire » ; « Le rôle des lois : des haies » ; « Pas de bien du souverain séparé ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-10", "idee": "Aucune loi n’est injuste ; Comme les lois d’un jeu.", "args": "La loi est faite par le souverain, et ce qu’il fait est reconnu pour sien par chaque membre du peuple. Ce sur quoi les joueurs se sont accordés n’est une injustice pour aucun d’eux.", "lien": "Après avoir posé qu’aucune loi n’est injuste puisque chacun l’a approuvée, Hobbes définit ce qu’est une bonne loi : nécessaire et claire."}, {"l": "10-20", "idee": "Une bonne loi est nécessaire et claire ; Le rôle des lois : des haies.", "args": "Elle sert le bien du peuple, et elle est compréhensible. Elles n’entravent pas l’action volontaire, mais contiennent les gens pour qu’ils ne se fassent pas de mal : « des haies disposées non pour arrêter les voyageurs, mais pour les maintenir sur le chemin ».", "lien": "Si la loi sert à diriger les hommes sans les entraver, il faut conclure que le bien du souverain et celui du peuple ne sont pas séparés."}, {"l": "21-27", "idee": "Pas de bien du souverain séparé.", "args": "Une loi qui avantage le souverain sans être nécessaire au peuple n’est pas bonne : leurs biens ne sont pas séparables.", "lien": "Cette dernière étape précise le critère de la bonne loi : elle sert le bien du peuple."}], "concepts": [{"c": "Souverain", "s": "Pouvoir qui fait les lois, auquel chacun a consenti."}, {"c": "Bonne loi", "s": "Loi nécessaire au bien du peuple et claire, qui accomplit la fin de toute loi."}, {"c": "Justice légale", "s": "Chez Hobbes, est juste ce qui est conforme à la loi établie par le souverain."}], "probleme": "<p><b>L’opinion remise en cause.</b> Qu’une bonne loi serait avant tout une loi juste.</p><p><b>Le problème.</b> Qu’est-ce qui fait la qualité d’une loi : sa justice, ou son utilité ?</p><p><b>L’enjeu.</b> Cette thèse n’est pas évidente : si aucune loi n’est injuste, comment juger qu’une loi est bonne ?</p><p><b>Formule.</b> « On dit souvent qu’une bonne loi serait avant tout une loi juste, mais Hobbes soutient : Aucune loi ne peut être injuste puisque chacun l’a approuvée. »</p><p><b>Discussion.</b> Une loi peut-elle être injuste ? Pour Hobbes, non. Mais l’histoire montre des lois iniques. Une loi est-elle juste parce qu’elle est la loi ? (À comparer avec Platon.)</p>", "intro": ["On croit souvent qu’une bonne loi est avant tout une loi juste. Dans le <i>Léviathan</i>, Hobbes soutient qu’aucune loi ne peut être injuste, et qu’une bonne loi est une loi nécessaire et claire.", "Hobbes soutient la thèse suivante : Aucune loi ne peut être injuste puisque chacun l’a approuvée. Une bonne loi est celle qui est nécessaire au bien du peuple et claire : elle dirige les hommes sans les entraver, comme des haies le long d’un chemin. Cette thèse n’est pas évidente : si aucune loi n’est injuste, comment juger qu’une loi est bonne ?", "Le texte avance en trois temps. Des lignes 1 à 10 : « Aucune loi n’est injuste » ; « Comme les lois d’un jeu ». Des lignes 10 à 20 : « Une bonne loi est nécessaire et claire » ; « Le rôle des lois : des haies ». Des lignes 21 à 27 : « Pas de bien du souverain séparé »."], "dev": [{"l": "1-10", "obj": "Aucune loi n’est injuste ; Comme les lois d’un jeu.", "sp": ["<b>Aucune loi n’est injuste.</b> La loi est faite par le souverain, et ce qu’il fait est reconnu pour sien par chaque membre du peuple.", "<b>Comme les lois d’un jeu.</b> Ce sur quoi les joueurs se sont accordés n’est une injustice pour aucun d’eux."], "tr": "Après avoir posé qu’aucune loi n’est injuste puisque chacun l’a approuvée, Hobbes définit ce qu’est une bonne loi : nécessaire et claire."}, {"l": "10-20", "obj": "Une bonne loi est nécessaire et claire ; Le rôle des lois : des haies.", "sp": ["<b>Une bonne loi est nécessaire et claire.</b> Elle sert le bien du peuple, et elle est compréhensible.", "<b>Le rôle des lois : des haies.</b> Elles n’entravent pas l’action volontaire, mais contiennent les gens pour qu’ils ne se fassent pas de mal : « des haies disposées non pour arrêter les voyageurs, mais pour les maintenir sur le chemin »."], "tr": "Si la loi sert à diriger les hommes sans les entraver, il faut conclure que le bien du souverain et celui du peuple ne sont pas séparés."}, {"l": "21-27", "obj": "Pas de bien du souverain séparé.", "sp": ["<b>Pas de bien du souverain séparé.</b> Une loi qui avantage le souverain sans être nécessaire au peuple n’est pas bonne : leurs biens ne sont pas séparables."], "tr": ""}], "concl": ["Le texte se demande : « Qu’est-ce qui fait la qualité d’une loi : sa justice, ou son utilité ? » Hobbes répond ainsi : Aucune loi ne peut être injuste puisque chacun l’a approuvée. Une bonne loi est celle qui est nécessaire au bien du peuple et claire : elle dirige les hommes sans les entraver, comme des haies le long d’un chemin.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « Aucune loi n’est injuste ; Comme les lois d’un jeu » puis « Une bonne loi est nécessaire et claire ; Le rôle des lois : des haies » puis « Pas de bien du souverain séparé ».", "On peut enfin discuter cette thèse. Une loi peut-elle être injuste ? Pour Hobbes, non. Mais l’histoire montre des lois iniques. Une loi est-elle juste parce qu’elle est la loi ? (À comparer avec Platon.)"]}, {"id": "justice-platon-gyges", "label": "Platon : le mythe de l’anneau de Gygès", "theme": "La justice", "auteur": "Platon", "oeuvre": "La République", "fiche": "justice-platon-gyges.html", "lignes": ["Cet homme [Gygès] était berger au service du roi qui", "gouvernait alors la Lydie. Un jour, au cours d'un", "violent orage accompagné d'un séisme, le sol se fendit", "et il se forma une ouverture béante près de l'endroit", "où il faisait paître son troupeau. Plein d'étonnement,", "il y descendit, et, entre autres merveilles que la", "fable énumère, il vit un cheval d'airain creux, percé", "de petites portes ; s'étant penché vers l'intérieur,", "il y aperçut un cadavre de taille plus grande,", "semblait-il, que celle d'un homme, et qui avait à la", "main un anneau d'or, dont il s'empara ; puis il partit", "sans prendre autre chose. Or, à l'assemblée habituelle", "des bergers qui se tenait chaque mois pour informer le", "roi de l'état de ses troupeaux, il se rendit portant", "au doigt cet anneau.", "Ayant pris place au milieu des autres, il tourna par", "hasard le chaton de la bague vers l'intérieur de sa", "main ; aussitôt il devint invisible à ses voisins qui", "parlèrent de lui comme s'il était parti. Etonné, il", "mania de nouveau la bague en tâtonnant, tourna le", "chaton en dehors et, ce faisant, redevint visible.", "S'étant rendu compte de cela, il répéta l'expérience", "pour voir si l'anneau avait bien ce pouvoir ; le même", "prodige se reproduisit : en tournant le chaton en", "dedans il devenait invisible, en dehors visible. Dès", "qu'il fut sûr de son fait, il fit en sorte d'être au", "nombre des messagers qui se rendaient auprès du roi.", "Arrivé au palais, il séduisit la reine, complota avec", "elle la mort du roi, le tua, et obtint ainsi le", "pouvoir."], "mots": "Mots-clés : Impunité, Justice par crainte, Invisibilité.", "lire": "<p><b>Objet du texte.</b> Les hommes sont-ils justes par choix ou par crainte d’être punis ? <b>Notion du programme.</b> La justice.</p><p><b>Connecteurs repérés.</b> « alors » (l.2), « or » (l.11), « si… » (l.23), « ainsi » (l.29). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Impunité</i> : fait de ne pas risquer de sanction. L’anneau supprime la crainte d’être vu et puni. ; <i>Justice par crainte</i> : idée que l’on est juste par peur du châtiment ou de la réputation, non par conviction. ; <i>Invisibilité</i> : pouvoir d’agir sans témoin : épreuve des motifs réels d’une action.</p>", "these": "<p><b>Thèse.</b> Le mythe pose une épreuve : celui qui peut agir sans être vu, et sans risquer de sanction, que fait-il ? Gygès use de l’impunité pour commettre l’injustice et satisfaire son ambition.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « Un berger et un séisme » ; « La découverte de l’anneau » ; « Le pouvoir de l’anneau » ; « Il vérifie, puis il agit » ; « L’usage de l’impunité ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-15", "idee": "Un berger et un séisme ; La découverte de l’anneau.", "args": "Gygès, berger du roi de Lydie, descend dans une ouverture ouverte dans le sol après un orage et un séisme. Il y voit un cheval d’airain et un cadavre qui porte un anneau d’or. Il le prend et s’en va.", "lien": "Après avoir raconté comment Gygès découvre l’anneau, le récit en montre le pouvoir : l’invisibilité."}, {"l": "16-27", "idee": "Le pouvoir de l’anneau ; Il vérifie, puis il agit.", "args": "Lors de l’assemblée des bergers, il tourne par hasard le chaton vers l’intérieur : il devient invisible. Il répète l’expérience pour en être sûr, puis il se fait envoyer comme messager auprès du roi.", "lien": "Dès qu’il est sûr de son pouvoir, Gygès passe à l’acte : séduction de la reine, complot, prise du pouvoir."}, {"l": "28-30", "idee": "L’usage de l’impunité.", "args": "Arrivé au palais, il séduit la reine, complote avec elle la mort du roi, le tue et prend le pouvoir.", "lien": "L’usage de l’impunité confirme l’épreuve : celui qui peut agir sans être vu commet l’injustice."}], "concepts": [{"c": "Impunité", "s": "Fait de ne pas risquer de sanction. L’anneau supprime la crainte d’être vu et puni."}, {"c": "Justice par crainte", "s": "Idée que l’on est juste par peur du châtiment ou de la réputation, non par conviction."}, {"c": "Invisibilité", "s": "Pouvoir d’agir sans témoin : épreuve des motifs réels d’une action."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que les hommes seraient justes par choix, pour le bien lui-même.</p><p><b>Le problème.</b> Les hommes sont-ils justes par choix ou par crainte d’être punis ?</p><p><b>L’enjeu.</b> Le texte est un récit : il faut dégager la question qu’il pose (que ferait-on sans risque d’être puni ?) et la réponse qu’il suggère.</p><p><b>Formule.</b> « On dit souvent que les hommes seraient justes par choix, pour le bien lui-même, mais Platon soutient : Le mythe pose une épreuve : celui qui peut agir sans être vu, et sans risquer de sanction, que fait-il ? »</p><p><b>Discussion.</b> Qui serait juste sans témoin ? Ce mythe est raconté par Glaucon, qui veut montrer que personne n’est juste volontairement. Est-ce convaincant ? (À comparer avec Hobbes.)</p>", "intro": ["On croit volontiers que les hommes sont justes par choix, parce qu’ils aiment le bien. Dans <i>La République</i>, Platon raconte le mythe de Gygès pour mettre cette idée à l’épreuve.", "Platon soutient la thèse suivante : Le mythe pose une épreuve : celui qui peut agir sans être vu, et sans risquer de sanction, que fait-il ? Gygès use de l’impunité pour commettre l’injustice et satisfaire son ambition. Le texte est un récit : il faut dégager la question qu’il pose (que ferait-on sans risque d’être puni ?) et la réponse qu’il suggère.", "Le texte avance en trois temps. Des lignes 1 à 15 : « Un berger et un séisme » ; « La découverte de l’anneau ». Des lignes 16 à 27 : « Le pouvoir de l’anneau » ; « Il vérifie, puis il agit ». Des lignes 28 à 30 : « L’usage de l’impunité »."], "dev": [{"l": "1-15", "obj": "Un berger et un séisme ; La découverte de l’anneau.", "sp": ["<b>Un berger et un séisme.</b> Gygès, berger du roi de Lydie, descend dans une ouverture ouverte dans le sol après un orage et un séisme.", "<b>La découverte de l’anneau.</b> Il y voit un cheval d’airain et un cadavre qui porte un anneau d’or. Il le prend et s’en va."], "tr": "Après avoir raconté comment Gygès découvre l’anneau, le récit en montre le pouvoir : l’invisibilité."}, {"l": "16-27", "obj": "Le pouvoir de l’anneau ; Il vérifie, puis il agit.", "sp": ["<b>Le pouvoir de l’anneau.</b> Lors de l’assemblée des bergers, il tourne par hasard le chaton vers l’intérieur : il devient invisible.", "<b>Il vérifie, puis il agit.</b> Il répète l’expérience pour en être sûr, puis il se fait envoyer comme messager auprès du roi."], "tr": "Dès qu’il est sûr de son pouvoir, Gygès passe à l’acte : séduction de la reine, complot, prise du pouvoir."}, {"l": "28-30", "obj": "L’usage de l’impunité.", "sp": ["<b>L’usage de l’impunité.</b> Arrivé au palais, il séduit la reine, complote avec elle la mort du roi, le tue et prend le pouvoir."], "tr": ""}], "concl": ["Le texte se demande : « Les hommes sont-ils justes par choix ou par crainte d’être punis ? » Platon répond ainsi : Le mythe pose une épreuve : celui qui peut agir sans être vu, et sans risquer de sanction, que fait-il ? Gygès use de l’impunité pour commettre l’injustice et satisfaire son ambition.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « Un berger et un séisme ; La découverte de l’anneau » puis « Le pouvoir de l’anneau ; Il vérifie, puis il agit » puis « L’usage de l’impunité ».", "On peut enfin discuter cette thèse. Qui serait juste sans témoin ? Ce mythe est raconté par Glaucon, qui veut montrer que personne n’est juste volontairement. Est-ce convaincant ? (À comparer avec Hobbes.)"]}, {"id": "justice-platon-lois", "label": "Platon : pourquoi avoir des lois ?", "theme": "La justice", "auteur": "Platon", "oeuvre": "Les Lois", "fiche": "justice-platon-lois.html", "lignes": ["Il est nécessaire aux hommes de se donner des lois et", "de vivre conformément à ces lois, sous peine de ne", "différer en rien des bêtes les plus sauvages. Voici", "quelle en est la raison : aucun homme ne naît avec une", "aptitude naturelle à savoir ce qui est profitable pour", "la vie humaine en société et, même s’il le savait, à", "pouvoir toujours faire et souhaiter le meilleur. Car", "en premier lieu il est difficile de comprendre que", "l’art politique véritable doit prendre soin, non du", "bien particulier, mais du bien général – car le bien", "général rassemble, tandis que le bien particulier", "déchire les sociétés ; et le bien commun tout autant", "que le bien particulier gagnent même tous les deux à", "ce que le premier plutôt que le second soit assuré de", "façon convenable.", "En second lieu, même si l’on était assez habile pour", "se rendre compte que telle est la nature des choses,", "et qu’on ait à gouverner un État avec un pouvoir", "absolu et sans rendre aucun compte, on ne pourrait pas", "rester fidèle à ce principe et faire passer pendant", "toute sa vie le bien commun de la société au premier", "rang et le bien particulier au deuxième. En fait la", "nature mortelle de l’homme le portera toujours à", "vouloir plus que les autres et à s’occuper de son bien", "particulier, parce qu’elle fuit la douleur et poursuit", "le plaisir sans tenir compte de la raison, qu’elle les", "fera passer l’une et l’autre avant le plus juste et le", "meilleur, et, s’aveuglant elle-même, elle finira par", "se remplir, elle et toute la société, de toutes sortes", "de maux."], "mots": "Mots-clés : Bien général / particulier, Art politique, Pouvoir absolu.", "lire": "<p><b>Objet du texte.</b> Pourquoi les hommes ont-ils besoin de lois ? <b>Notion du programme.</b> La justice.</p><p><b>Connecteurs repérés.</b> « car » (l.7), « mais » (l.10), « si… » (l.16). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Bien général / particulier</i> : le bien de tous contre le bien d’un seul. Le premier unit, le second divise. ; <i>Art politique</i> : savoir de gouverner, qui vise le bien commun. ; <i>Pouvoir absolu</i> : pouvoir sans contrôle. Même lui ne garantit pas la vertu.</p>", "these": "<p><b>Thèse.</b> Sans lois, les hommes ne différeraient pas des bêtes sauvages. Nul ne connaît naturellement le bien commun, et même s’il le connaissait, sa nature mortelle le porterait à préférer son intérêt particulier.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « Les lois sont nécessaires » ; « Personne ne sait naturellement ce qui est bon » ; « Le bien général passe avant le bien particulier » ; « Même le plus habile faillirait » ; « La nature mortelle de l’homme ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-7", "idee": "Les lois sont nécessaires ; Personne ne sait naturellement ce qui est bon.", "args": "Sans elles, les hommes ne diffèrent en rien des bêtes les plus sauvages. Aucun homme n’a une aptitude naturelle à savoir ce qui est profitable à la vie en société, ni à toujours le vouloir.", "lien": "Après avoir posé que les lois sont nécessaires parce que personne ne sait naturellement ce qui est bon, Platon avance que le bien général passe avant le bien particulier."}, {"l": "7-22", "idee": "Le bien général passe avant le bien particulier ; Même le plus habile faillirait.", "args": "L’art politique véritable doit prendre soin du bien général, qui rassemble, plutôt que du bien particulier, qui déchire. Même qui gouvernerait avec un pouvoir absolu ne resterait pas fidèle à ce principe.", "lien": "Même celui qui connaîtrait le bien commun ne le suivrait pas toujours : sa nature l’en détournerait."}, {"l": "22-30", "idee": "La nature mortelle de l’homme.", "args": "Elle fuit la douleur et poursuit le plaisir, veut toujours plus que les autres, et remplit la société de maux.", "lien": "La nature mortelle de l’homme donne la raison dernière : les lois sont nécessaires."}], "concepts": [{"c": "Bien général / particulier", "s": "Le bien de tous contre le bien d’un seul. Le premier unit, le second divise."}, {"c": "Art politique", "s": "Savoir de gouverner, qui vise le bien commun."}, {"c": "Pouvoir absolu", "s": "Pouvoir sans contrôle. Même lui ne garantit pas la vertu."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que l’on pourrait vivre sans lois, chacun suivant le bien qu’il connaît.</p><p><b>Le problème.</b> Pourquoi les hommes ont-ils besoin de lois ?</p><p><b>L’enjeu.</b> Cette thèse n’est pas évidente : si l’on connaissait le bien, pourquoi aurait-on encore besoin de lois ?</p><p><b>Formule.</b> « On dit souvent que l’on pourrait vivre sans lois, chacun suivant le bien qu’il connaît, mais Platon soutient : Sans lois, les hommes ne différeraient pas des bêtes sauvages. »</p><p><b>Discussion.</b> Un gouvernant éclairé suffit-il ? Platon, ailleurs, rêve du philosophe-roi. Ici il doute de tout pouvoir absolu. Pourquoi ? (À comparer avec Hobbes.)</p>", "intro": ["On croit souvent que chacun sait ce qui est bon et pourrait vivre sans lois. Dans <i>Les Lois</i>, Platon soutient que les hommes ont besoin de lois, sans quoi ils ne différeraient pas des bêtes sauvages.", "Platon soutient la thèse suivante : Sans lois, les hommes ne différeraient pas des bêtes sauvages. Nul ne connaît naturellement le bien commun, et même s’il le connaissait, sa nature mortelle le porterait à préférer son intérêt particulier. Cette thèse n’est pas évidente : si l’on connaissait le bien, pourquoi aurait-on encore besoin de lois ?", "Le texte avance en trois temps. Des lignes 1 à 7 : « Les lois sont nécessaires » ; « Personne ne sait naturellement ce qui est bon ». Des lignes 7 à 22 : « Le bien général passe avant le bien particulier » ; « Même le plus habile faillirait ». Des lignes 22 à 30 : « La nature mortelle de l’homme »."], "dev": [{"l": "1-7", "obj": "Les lois sont nécessaires ; Personne ne sait naturellement ce qui est bon.", "sp": ["<b>Les lois sont nécessaires.</b> Sans elles, les hommes ne diffèrent en rien des bêtes les plus sauvages.", "<b>Personne ne sait naturellement ce qui est bon.</b> Aucun homme n’a une aptitude naturelle à savoir ce qui est profitable à la vie en société, ni à toujours le vouloir."], "tr": "Après avoir posé que les lois sont nécessaires parce que personne ne sait naturellement ce qui est bon, Platon avance que le bien général passe avant le bien particulier."}, {"l": "7-22", "obj": "Le bien général passe avant le bien particulier ; Même le plus habile faillirait.", "sp": ["<b>Le bien général passe avant le bien particulier.</b> L’art politique véritable doit prendre soin du bien général, qui rassemble, plutôt que du bien particulier, qui déchire.", "<b>Même le plus habile faillirait.</b> Même qui gouvernerait avec un pouvoir absolu ne resterait pas fidèle à ce principe."], "tr": "Même celui qui connaîtrait le bien commun ne le suivrait pas toujours : sa nature l’en détournerait."}, {"l": "22-30", "obj": "La nature mortelle de l’homme.", "sp": ["<b>La nature mortelle de l’homme.</b> Elle fuit la douleur et poursuit le plaisir, veut toujours plus que les autres, et remplit la société de maux."], "tr": ""}], "concl": ["Le texte se demande : « Pourquoi les hommes ont-ils besoin de lois ? » Platon répond ainsi : Sans lois, les hommes ne différeraient pas des bêtes sauvages. Nul ne connaît naturellement le bien commun, et même s’il le connaissait, sa nature mortelle le porterait à préférer son intérêt particulier.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « Les lois sont nécessaires ; Personne ne sait naturellement ce qui est bon » puis « Le bien général passe avant le bien particulier ; Même le plus habile faillirait » puis « La nature mortelle de l’homme ».", "On peut enfin discuter cette thèse. Un gouvernant éclairé suffit-il ? Platon, ailleurs, rêve du philosophe-roi. Ici il doute de tout pouvoir absolu. Pourquoi ? (À comparer avec Hobbes.)"]}, {"id": "justice-rawls", "label": "Rawls : l’intuitionnisme en matière de justice", "theme": "La justice", "auteur": "Rawls", "oeuvre": "Théorie de la justice", "fiche": "justice-rawls.html", "lignes": ["J’envisagerai l’intuitionnisme d’une manière plus", "générale que d’ordinaire, comme la doctrine selon", "laquelle il y a une famille irréductible de principes", "premiers que nous devons mettre en balance les uns par", "rapport aux autres en nous demandant, par un jugement", "mûrement réfléchi, quel équilibre est le plus juste.", "Une fois atteint un certain niveau de généralité,", "l’intuitionniste adéquate l’importance relative des", "principes de justice concurrents. Comme la complexité", "des faits moraux nécessite un grand nombre de", "principes distincts, il n’y a pas de critère unique", "pour en rendre compte ou leur attribuer l’important", "qu’ils méritent. Les théories intuitionnistes ont deux", "caractéristiques ; tout d’abord, elles consistent en", "une pluralité de principes premiers qui peuvent entrer", "en conflit et donner des directives contraires dans", "certains types de cas ; ensuite, elles ne comprennent", "aucune méthode explicite, aucune règle de priorité", "pour mettre en balance ces principes les uns par", "rapport aux autres : nous devons simplement découvrir", "un équilibre par intuition, d’après ce qui nous semble", "le plus proche du juste. […]", "De ce point de vue, il y a donc de nombreuses formes", "d’intuitionnisme. Non seulement nos idées quotidiennes", "sont de ce type, mais peut-être aussi la plupart des", "doctrines philosophiques. Le niveau de généralité de", "leurs principes est un moyen de distinguer entre les", "différentes versions de l’intuitionnisme.", "L’intuitionnisme du sens commun prend la forme de", "groupes de préceptes assez spécifiques, chaque groupe", "s’appliquant à un problème particulier de justice."], "mots": "Mots-clés : Intuitionnisme, Principes premiers, Règle de priorité.", "lire": "<p><b>Objet du texte.</b> Y a-t-il un critère unique pour décider ce qui est juste ? <b>Notion du programme.</b> La justice.</p><p><b>Connecteurs repérés.</b> « donc » (l.23), « mais » (l.25). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Intuitionnisme</i> : doctrine qui s’en remet à l’intuition pour équilibrer des principes de justice. ; <i>Principes premiers</i> : principes irréductibles les uns aux autres, qui peuvent entrer en conflit. ; <i>Règle de priorité</i> : méthode qui dit quel principe l’emporte en cas de conflit.</p>", "these": "<p><b>Thèse.</b> Selon l’intuitionnisme, il existe une pluralité de principes premiers irréductibles et aucune règle de priorité : l’équilibre se trouve par un jugement réfléchi. Rawls y voit une doctrine fréquente, mais insuffisante.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « Une définition large » ; « Pas de critère unique » ; « Deux caractéristiques » ; « L’équilibre par intuition » ; « Une doctrine répandue ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-13", "idee": "Une définition large ; Pas de critère unique.", "args": "L’intuitionnisme est la doctrine selon laquelle il y a une famille irréductible de principes premiers, à mettre en balance par un jugement mûrement réfléchi. La complexité des faits moraux exige beaucoup de principes distincts : aucun critère unique ne les départage.", "lien": "Après avoir défini l’intuitionnisme largement, Rawls en dégage les deux caractéristiques : pluralité des principes et absence de règle de priorité."}, {"l": "13-24", "idee": "Deux caractéristiques ; L’équilibre par intuition.", "args": "Une pluralité de principes premiers qui peuvent entrer en conflit ; aucune méthode explicite ni règle de priorité. On doit simplement découvrir un équilibre d’après ce qui semble le plus proche du juste.", "lien": "Faute de règle de priorité, l’équilibre se trouve par un jugement réfléchi ; reste à voir que cette doctrine est répandue."}, {"l": "24-31", "idee": "Une doctrine répandue.", "args": "Nos idées quotidiennes sont de ce type, et peut-être la plupart des doctrines philosophiques. Elles diffèrent par leur niveau de généralité.", "lien": "Cette doctrine répandue est pourtant insuffisante, selon Rawls : c’est ce qui oriente la suite de son livre."}], "concepts": [{"c": "Intuitionnisme", "s": "Doctrine qui s’en remet à l’intuition pour équilibrer des principes de justice."}, {"c": "Principes premiers", "s": "Principes irréductibles les uns aux autres, qui peuvent entrer en conflit."}, {"c": "Règle de priorité", "s": "Méthode qui dit quel principe l’emporte en cas de conflit."}], "probleme": "<p><b>L’opinion remise en cause.</b> Qu’il existerait un critère unique, un principe, pour décider de ce qui est juste.</p><p><b>Le problème.</b> Y a-t-il un critère unique pour décider ce qui est juste ?</p><p><b>L’enjeu.</b> Le texte expose une doctrine que Rawls va ensuite critiquer : il faut donc distinguer ce qu’il décrit de ce qu’il en pense.</p><p><b>Formule.</b> « On dit souvent qu’il existerait un critère unique, un principe, pour décider de ce qui est juste, mais Rawls soutient : Selon l’intuitionnisme, il existe une pluralité de principes premiers irréductibles et aucune règle de priorité : l’équilibre se trouve par un jugement réfléchi. »</p><p><b>Discussion.</b> L’intuition suffit-elle ? Sans règle de priorité, comment se mettre d’accord ? Rawls proposera des principes ordonnés. (À comparer avec Hobbes.)</p>", "intro": ["On croit souvent qu’un principe unique, comme l’utilité, permettrait de décider de ce qui est juste. Dans la <i>Théorie de la justice</i>, Rawls présente l’intuitionnisme, selon lequel il n’existe pas de critère unique.", "Rawls soutient la thèse suivante : Selon l’intuitionnisme, il existe une pluralité de principes premiers irréductibles et aucune règle de priorité : l’équilibre se trouve par un jugement réfléchi. Rawls y voit une doctrine fréquente, mais insuffisante. Le texte expose une doctrine que Rawls va ensuite critiquer : il faut donc distinguer ce qu’il décrit de ce qu’il en pense.", "Le texte avance en trois temps. Des lignes 1 à 13 : « Une définition large » ; « Pas de critère unique ». Des lignes 13 à 24 : « Deux caractéristiques » ; « L’équilibre par intuition ». Des lignes 24 à 31 : « Une doctrine répandue »."], "dev": [{"l": "1-13", "obj": "Une définition large ; Pas de critère unique.", "sp": ["<b>Une définition large.</b> L’intuitionnisme est la doctrine selon laquelle il y a une famille irréductible de principes premiers, à mettre en balance par un jugement mûrement réfléchi.", "<b>Pas de critère unique.</b> La complexité des faits moraux exige beaucoup de principes distincts : aucun critère unique ne les départage."], "tr": "Après avoir défini l’intuitionnisme largement, Rawls en dégage les deux caractéristiques : pluralité des principes et absence de règle de priorité."}, {"l": "13-24", "obj": "Deux caractéristiques ; L’équilibre par intuition.", "sp": ["<b>Deux caractéristiques.</b> Une pluralité de principes premiers qui peuvent entrer en conflit ; aucune méthode explicite ni règle de priorité.", "<b>L’équilibre par intuition.</b> On doit simplement découvrir un équilibre d’après ce qui semble le plus proche du juste."], "tr": "Faute de règle de priorité, l’équilibre se trouve par un jugement réfléchi ; reste à voir que cette doctrine est répandue."}, {"l": "24-31", "obj": "Une doctrine répandue.", "sp": ["<b>Une doctrine répandue.</b> Nos idées quotidiennes sont de ce type, et peut-être la plupart des doctrines philosophiques. Elles diffèrent par leur niveau de généralité."], "tr": ""}], "concl": ["Le texte se demande : « Y a-t-il un critère unique pour décider ce qui est juste ? » Rawls répond ainsi : Selon l’intuitionnisme, il existe une pluralité de principes premiers irréductibles et aucune règle de priorité : l’équilibre se trouve par un jugement réfléchi. Rawls y voit une doctrine fréquente, mais insuffisante.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « Une définition large ; Pas de critère unique » puis « Deux caractéristiques ; L’équilibre par intuition » puis « Une doctrine répandue ».", "On peut enfin discuter cette thèse. L’intuition suffit-elle ? Sans règle de priorité, comment se mettre d’accord ? Rawls proposera des principes ordonnés. (À comparer avec Hobbes.)"]}, {"id": "justice-smith", "label": "Smith : la justice et la négligence", "theme": "La justice", "auteur": "Smith", "oeuvre": "Théorie des sentiments moraux", "fiche": "justice-smith.html", "lignes": ["Il est un degré de négligence qui paraîtrait mériter", "une punition quoique cette négligence n’occasionne", "aucun dommage à personne. Si une personne jetait une", "grosse pierre dans une voie publique du haut d’un mur", "sans en avertir les passants, et sans regarder où elle", "pourrait tomber, elle mériterait certainement une", "punition. Une police vraiment exacte châtierait une", "action si absurde, même si elle n’avait fait aucun", "mal. La personne qui s’en rend coupable fait preuve", "d’un mépris insolent envers le bonheur et la sécurité", "des autres. Il y a une injustice réelle dans cette", "conduite. Cette personne expose inconsidérément son", "prochain à ce qu’aucun homme de bon sens ne voudrait", "risquer ; de toute évidence elle manque du sens de ce", "qui est dû à ses semblables, et qui est la base de la", "justice et de la société.", "Une négligence grossière est donc, selon la loi,", "presque l’équivalent d’un dessein malveillant. Quand", "des conséquences malheureuses découlent d’une telle", "insouciance, la personne qui en est coupable est", "souvent châtiée comme si ces conséquences avaient", "réellement été dans son intention ; sa conduite qui", "était seulement insouciante et insolente, et qui", "méritait punition, est considérée comme atroce et", "passible du châtiment le plus sévère. Si une personne", "en tue accidentellement une autre par l’action", "imprudente mentionnée ci-dessus, elle est, selon les", "lois de nombreux pays, et notamment selon la vieille", "loi d’Écosse, passible du châtiment suprême.", "Bien que ce soit sans nul doute excessivement sévère,", "ce n’est pas du tout contraire à nos sentiments", "naturels. Notre juste indignation contre la folie et", "l’inhumanité de cette conduite est renforcée par notre", "sympathie avec l’infortuné qui en souffre. Rien,", "pourtant, ne choquerait plus notre sens naturel de la", "justice que de mener un homme à l’échafaud simplement", "pour avoir jeté avec insouciance une pierre dans la", "rue, sans faire de mal à personne."], "mots": "Mots-clés : Négligence, Dessein malveillant, Sentiments naturels.", "lire": "<p><b>Objet du texte.</b> Sur quoi repose le jugement de justice : l’intention ou les conséquences ? <b>Notion du programme.</b> La justice.</p><p><b>Connecteurs repérés.</b> « si… » (l.3), « donc » (l.17), « pourtant » (l.35). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Négligence</i> : manque de soin envers autrui qui crée un risque. ; <i>Dessein malveillant</i> : intention de nuire. ; <i>Sentiments naturels</i> : réactions morales spontanées, comme l’indignation ou la sympathie.</p>", "these": "<p><b>Thèse.</b> La négligence grossière est presque l’équivalent d’un dessein malveillant, car elle révèle l’absence de sens de ce qui est dû à autrui. Mais nos sentiments naturels jugent aussi selon les conséquences.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « Une négligence qui mérite punition » ; « Un mépris envers la sécurité d’autrui » ; « Négligence et malveillance » ; « Les conséquences changent la peine » ; « Un excès conforme au sentiment ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-17", "idee": "Une négligence qui mérite punition ; Un mépris envers la sécurité d’autrui ; Négligence et malveillance.", "args": "Jeter une grosse pierre dans la rue sans avertir mériterait punition, même sans dommage. Cette personne expose son prochain à un risque qu’aucun homme de bon sens ne courrait : elle manque du sens de ce qui est dû à ses semblables. Une négligence grossière équivaut presque à un dessein malveillant.", "lien": "Après avoir montré qu’une négligence grossière mérite punition parce qu’elle révèle un mépris de la sécurité d’autrui, Smith ajoute que les conséquences changent la peine."}, {"l": "18-29", "idee": "Les conséquences changent la peine.", "args": "Si la pierre tue quelqu’un, le coupable est souvent puni comme si le meurtre avait été voulu : il est passible du châtiment suprême.", "lien": "Si les conséquences changent la peine, la loi paraît parfois excessive, mais elle suit nos sentiments naturels."}, {"l": "30-38", "idee": "Un excès conforme au sentiment.", "args": "Cette sévérité est excessive mais ne contredit pas nos sentiments naturels. En revanche, envoyer à l’échafaud pour une pierre sans dégât choquerait notre sens de la justice.", "lien": "L’excès de sévérité est ainsi conforme au sentiment : nos jugements tiennent compte des conséquences autant que de l’intention."}], "concepts": [{"c": "Négligence", "s": "Manque de soin envers autrui qui crée un risque."}, {"c": "Dessein malveillant", "s": "Intention de nuire."}, {"c": "Sentiments naturels", "s": "Réactions morales spontanées, comme l’indignation ou la sympathie."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que seule l’intention déciderait de la justice d’un acte.</p><p><b>Le problème.</b> Sur quoi repose le jugement de justice : l’intention ou les conséquences ?</p><p><b>L’enjeu.</b> Cette thèse est nuancée : elle admet à la fois l’intention et les conséquences, et il faut montrer comment elle les concilie.</p><p><b>Formule.</b> « On dit souvent que seule l’intention déciderait de la justice d’un acte, mais Smith soutient : La négligence grossière est presque l’équivalent d’un dessein malveillant, car elle révèle l’absence de sens de ce qui est dû à autrui. »</p><p><b>Discussion.</b> Intention ou conséquences ? Un accident involontaire doit-il être puni comme un crime ? (À comparer avec Kant sur la valeur morale de l’intention.)</p>", "intro": ["On dit souvent que seule l’intention compte pour juger si un acte est juste ou injuste : sans volonté de nuire, pas de faute. Dans la <i>Théorie des sentiments moraux</i>, Smith montre qu’une négligence grossière est presque l’équivalent d’une malveillance.", "Smith soutient la thèse suivante : La négligence grossière est presque l’équivalent d’un dessein malveillant, car elle révèle l’absence de sens de ce qui est dû à autrui. Mais nos sentiments naturels jugent aussi selon les conséquences. Cette thèse est nuancée : elle admet à la fois l’intention et les conséquences, et il faut montrer comment elle les concilie.", "Le texte avance en trois temps. Des lignes 1 à 17 : « Une négligence qui mérite punition » ; « Un mépris envers la sécurité d’autrui » ; « Négligence et malveillance ». Des lignes 18 à 29 : « Les conséquences changent la peine ». Des lignes 30 à 38 : « Un excès conforme au sentiment »."], "dev": [{"l": "1-17", "obj": "Une négligence qui mérite punition ; Un mépris envers la sécurité d’autrui ; Négligence et malveillance.", "sp": ["<b>Une négligence qui mérite punition.</b> Jeter une grosse pierre dans la rue sans avertir mériterait punition, même sans dommage.", "<b>Un mépris envers la sécurité d’autrui.</b> Cette personne expose son prochain à un risque qu’aucun homme de bon sens ne courrait : elle manque du sens de ce qui est dû à ses semblables.", "<b>Négligence et malveillance.</b> Une négligence grossière équivaut presque à un dessein malveillant."], "tr": "Après avoir montré qu’une négligence grossière mérite punition parce qu’elle révèle un mépris de la sécurité d’autrui, Smith ajoute que les conséquences changent la peine."}, {"l": "18-29", "obj": "Les conséquences changent la peine.", "sp": ["<b>Les conséquences changent la peine.</b> Si la pierre tue quelqu’un, le coupable est souvent puni comme si le meurtre avait été voulu : il est passible du châtiment suprême."], "tr": "Si les conséquences changent la peine, la loi paraît parfois excessive, mais elle suit nos sentiments naturels."}, {"l": "30-38", "obj": "Un excès conforme au sentiment.", "sp": ["<b>Un excès conforme au sentiment.</b> Cette sévérité est excessive mais ne contredit pas nos sentiments naturels. En revanche, envoyer à l’échafaud pour une pierre sans dégât choquerait notre sens de la justice."], "tr": ""}], "concl": ["Le texte se demande : « Sur quoi repose le jugement de justice : l’intention ou les conséquences ? » Smith répond ainsi : La négligence grossière est presque l’équivalent d’un dessein malveillant, car elle révèle l’absence de sens de ce qui est dû à autrui. Mais nos sentiments naturels jugent aussi selon les conséquences.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « Une négligence qui mérite punition ; Un mépris envers la sécurité d’autrui ; Négligence et malveillance » puis « Les conséquences changent la peine » puis « Un excès conforme au sentiment ».", "On peut enfin discuter cette thèse. Intention ou conséquences ? Un accident involontaire doit-il être puni comme un crime ? (À comparer avec Kant sur la valeur morale de l’intention.)"]}, {"id": "spinoza-lettre-a-schuller", "label": "Spinoza : l’ignorance des causes déterminantes", "theme": "La liberté", "auteur": "Spinoza", "oeuvre": "Lettre à Schuller", "fiche": "spinoza-lettre-a-schuller.html", "lignes": ["Pour rendre cela [la thèse de Spinoza] clair et", "intelligible, concevons une chose très simple : une", "pierre par exemple reçoit d’une cause extérieure qui", "la pousse, une certaine quantité de mouvement et,", "l’impulsion de la cause extérieure venant à cesser,", "elle continuera à se mouvoir nécessairement. Cette", "persistance de la pierre dans le mouvement est une", "contrainte, non parce qu’elle est nécessaire, mais", "parce qu’elle doit être définie par l’impulsion d’une", "cause extérieure.", "Et ce qui est vrai de la pierre il faut l’entendre de", "toute chose singulière, […], parce que toute chose", "singulière est nécessairement déterminée par une cause", "extérieure à exister et à agir d’une certaine manière", "déterminée. Concevez maintenant, si vous voulez bien,", "que la pierre, tandis qu’elle continue de se mouvoir,", "pense et sache qu’elle fait effort, autant qu’elle", "peut, pour se mouvoir. Cette pierre assurément,", "puisqu’elle a conscience de son effort seulement et", "qu’elle n’est en aucune façon indifférente, croira", "qu’elle est très libre et qu’elle ne persévère dans", "son mouvement que parce qu’elle le veut.", "Telle est cette liberté humaine que tous se vantent de", "posséder et qui consiste en cela seul que les hommes", "ont conscience de leurs appétits et ignorent les", "causes qui les déterminent."], "mots": "Mots-clés : Déterminisme, Contrainte, Illusion de liberté.", "lire": "<p><b>Objet du texte.</b> Sommes-nous libres, ou croyons-nous seulement l’être ? <b>Notion du programme.</b> La liberté.</p><p><b>Connecteurs repérés.</b> « mais » (l.8), « parce que » (l.12), « si… » (l.15). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Déterminisme</i> : thèse selon laquelle tout ce qui existe et agit est déterminé par des causes. ; <i>Contrainte</i> : ici : fait d’être défini à exister et à agir par une cause extérieure. ; <i>Illusion de liberté</i> : se croire libre parce qu’on a conscience de ses désirs, sans connaître leurs causes.</p>", "these": "<p><b>Thèse.</b> Tout est déterminé par des causes extérieures. La liberté humaine est une illusion : nous avons conscience de nos désirs mais nous ignorons les causes qui les déterminent, comme une pierre qui, si elle pensait, se croirait libre.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « La pierre poussée » ; « Toute chose singulière » ; « Une pierre consciente » ; « La liberté humaine ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-11", "idee": "La pierre poussée.", "args": "Une pierre qui reçoit d’une cause extérieure une certaine quantité de mouvement continue à se mouvoir nécessairement : sa persistance est une contrainte, définie par une cause extérieure.", "lien": "Après avoir montré que la pierre mue par une cause extérieure est contrainte, Spinoza généralise : toute chose est déterminée de l’extérieur à exister et à agir."}, {"l": "12-23", "idee": "Toute chose singulière ; Une pierre consciente.", "args": "Ce qui est vrai de la pierre l’est de toute chose singulière : elle est nécessairement déterminée par une cause extérieure à exister et à agir. Si la pierre pensait et savait qu’elle fait effort pour se mouvoir, elle se croirait très libre et ne persévérerait, croirait-elle, que parce qu’elle le veut.", "lien": "Si toute chose est déterminée, une pierre qui prendrait conscience de son effort se croirait libre : elle ignorerait la cause qui la meut."}, {"l": "24-26", "idee": "La liberté humaine.", "args": "Telle est la liberté dont les hommes se vantent : ils ont conscience de leurs appétits et ignorent les causes qui les déterminent.", "lien": "Telle est la liberté humaine : conscience de nos désirs, ignorance de leurs causes."}], "concepts": [{"c": "Déterminisme", "s": "Thèse selon laquelle tout ce qui existe et agit est déterminé par des causes."}, {"c": "Contrainte", "s": "Ici : fait d’être défini à exister et à agir par une cause extérieure."}, {"c": "Illusion de liberté", "s": "Se croire libre parce qu’on a conscience de ses désirs, sans connaître leurs causes."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que nous serions libres parce que nous avons conscience de vouloir ce que nous faisons.</p><p><b>Le problème.</b> Sommes-nous libres, ou croyons-nous seulement l’être ?</p><p><b>L’enjeu.</b> Cette thèse est choquante : comment nier une liberté dont nous avons l’expérience immédiate ? Il faut montrer comment l’analogie de la pierre l’établit.</p><p><b>Formule.</b> « On dit souvent que nous serions libres parce que nous avons conscience de vouloir ce que nous faisons, mais Spinoza soutient : Tout est déterminé par des causes extérieures. »</p><p><b>Discussion.</b> Une liberté illusoire ? Si nos choix sont déterminés, que devient la responsabilité ? (À comparer avec Sartre.)</p>", "intro": ["On croit souvent que nous sommes libres parce que nous avons conscience de vouloir ce que nous faisons. Dans sa <i>Lettre à Schuller</i>, Spinoza soutient que cette liberté est une illusion, qu’il illustre par l’image d’une pierre.", "Spinoza soutient la thèse suivante : Tout est déterminé par des causes extérieures. La liberté humaine est une illusion : nous avons conscience de nos désirs mais nous ignorons les causes qui les déterminent, comme une pierre qui, si elle pensait, se croirait libre. Cette thèse est choquante : comment nier une liberté dont nous avons l’expérience immédiate ? Il faut montrer comment l’analogie de la pierre l’établit.", "Le texte avance en trois temps. Des lignes 1 à 11 : « La pierre poussée ». Des lignes 12 à 23 : « Toute chose singulière » ; « Une pierre consciente ». Des lignes 24 à 26 : « La liberté humaine »."], "dev": [{"l": "1-11", "obj": "La pierre poussée.", "sp": ["<b>La pierre poussée.</b> Une pierre qui reçoit d’une cause extérieure une certaine quantité de mouvement continue à se mouvoir nécessairement : sa persistance est une contrainte, définie par une cause extérieure."], "tr": "Après avoir montré que la pierre mue par une cause extérieure est contrainte, Spinoza généralise : toute chose est déterminée de l’extérieur à exister et à agir."}, {"l": "12-23", "obj": "Toute chose singulière ; Une pierre consciente.", "sp": ["<b>Toute chose singulière.</b> Ce qui est vrai de la pierre l’est de toute chose singulière : elle est nécessairement déterminée par une cause extérieure à exister et à agir.", "<b>Une pierre consciente.</b> Si la pierre pensait et savait qu’elle fait effort pour se mouvoir, elle se croirait très libre et ne persévérerait, croirait-elle, que parce qu’elle le veut."], "tr": "Si toute chose est déterminée, une pierre qui prendrait conscience de son effort se croirait libre : elle ignorerait la cause qui la meut."}, {"l": "24-26", "obj": "La liberté humaine.", "sp": ["<b>La liberté humaine.</b> Telle est la liberté dont les hommes se vantent : ils ont conscience de leurs appétits et ignorent les causes qui les déterminent."], "tr": ""}], "concl": ["Le texte se demande : « Sommes-nous libres, ou croyons-nous seulement l’être ? » Spinoza répond ainsi : Tout est déterminé par des causes extérieures. La liberté humaine est une illusion : nous avons conscience de nos désirs mais nous ignorons les causes qui les déterminent, comme une pierre qui, si elle pensait, se croirait libre.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « La pierre poussée » puis « Toute chose singulière ; Une pierre consciente » puis « La liberté humaine ».", "On peut enfin discuter cette thèse. Une liberté illusoire ? Si nos choix sont déterminés, que devient la responsabilité ? (À comparer avec Sartre.)"]}, {"id": "epictete", "label": "Épictète : ce qui dépend de nous", "theme": "La liberté", "auteur": "Épictète", "oeuvre": "Manuel", "fiche": "epictete.html", "lignes": ["1 Parmi les choses qui existent, certaines dépendent", "de nous, d’autres non. De nous, dépendent la pensée,", "l’impulsion, le désir, l’aversion, bref, tout ce en", "quoi c’est nous qui agissons ; ne dépendent pas de", "nous le corps, l’argent, la réputation, les charges", "publiques, tout ce en quoi ce n’est pas nous qui", "agissons.", "2 Ce qui dépend de nous est libre naturellement, ne", "connaît ni obstacles ni entraves ; ce qui n’en dépend", "pas est faible, esclave, exposé aux obstacles et nous", "est étranger.", "3 Donc, rappelle-toi que si tu tiens pour libre ce qui", "est naturellement esclave et pour un bien propre ce", "qui t’est étranger, tu vivras contrarié, chagriné,", "tourmenté ; tu en voudras aux hommes comme aux dieux ;", "mais si tu ne juges tien que ce qui l’est vraiment –", "et tout le reste étranger –, jamais personne ne saura", "te contraindre ni te barrer la route ; tu ne t’en", "prendras à personne, n’accuseras personne, ne feras", "jamais rien contre ton gré, personne ne pourra te", "faire de mal et tu n’auras pas d’ennemis puisqu’on ne", "t’obligera jamais à rien qui soit mauvais pour toi."], "mots": "Mots-clés : Ce qui dépend de nous, Ce qui ne dépend pas de nous, Liberté stoïcienne.", "lire": "<p><b>Objet du texte.</b> Qu’est-ce qui dépend de nous, et comment être libre ? <b>Notion du programme.</b> La liberté.</p><p><b>Connecteurs repérés.</b> « donc » (l.12), « si… » (l.12), « mais » (l.16). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Ce qui dépend de nous</i> : la pensée, l’impulsion, le désir, l’aversion : tout ce en quoi c’est nous qui agissons. ; <i>Ce qui ne dépend pas de nous</i> : le corps, l’argent, la réputation, les charges publiques. ; <i>Liberté stoïcienne</i> : ne pas être entravé ni contraint, en ne tenant pour sien que ce qui dépend de nous.</p>", "these": "<p><b>Thèse.</b> Certaines choses dépendent de nous (pensée, désir, aversion), d’autres non (corps, argent, réputation). Seules les premières sont libres : les confondre rend malheureux, les distinguer rend invulnérable à toute contrainte.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « Deux sortes de choses » ; « Libre ou esclave » ; « Le malheur de la confusion » ; « La liberté de la distinction ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-7", "idee": "Deux sortes de choses.", "args": "Certaines choses dépendent de nous (pensée, impulsion, désir, aversion), d’autres non (corps, argent, réputation, charges publiques).", "lien": "Après avoir distingué ce qui dépend de nous de ce qui n’en dépend pas, Épictète donne le statut de chacun : les premières choses sont libres, les autres esclaves."}, {"l": "8-11", "idee": "Libre ou esclave.", "args": "Ce qui dépend de nous est libre, sans obstacle ni entrave ; le reste est faible, esclave et nous est étranger.", "lien": "Si seul ce qui dépend de nous est libre, confondre les deux est source de malheur ; il en faut tirer la conséquence pratique."}, {"l": "12-22", "idee": "Le malheur de la confusion ; La liberté de la distinction.", "args": "Tenir pour libre ce qui est esclave rend contrarié, chagriné, tourmenté : on en veut aux hommes comme aux dieux. Qui ne tient pour sien que ce qui l’est vraiment ne peut être contraint, n’a pas d’ennemis et ne fait rien contre son gré.", "lien": "Celui qui ne tient pour sien que ce qui l’est vraiment ne peut être contraint : c’est la thèse."}], "concepts": [{"c": "Ce qui dépend de nous", "s": "La pensée, l’impulsion, le désir, l’aversion : tout ce en quoi c’est nous qui agissons."}, {"c": "Ce qui ne dépend pas de nous", "s": "Le corps, l’argent, la réputation, les charges publiques."}, {"c": "Liberté stoïcienne", "s": "Ne pas être entravé ni contraint, en ne tenant pour sien que ce qui dépend de nous."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que nous serions libres lorsque nous possédons la santé, les biens et la réputation.</p><p><b>Le problème.</b> Qu’est-ce qui dépend de nous, et comment être libre ?</p><p><b>L’enjeu.</b> Cette thèse n’est pas évidente : si le corps et la réputation ne dépendent pas de nous, peut-on encore être heureux face à ce qui nous arrive ?</p><p><b>Formule.</b> « On dit souvent que nous serions libres lorsque nous possédons la santé, les biens et la réputation, mais Épictète soutient : Certaines choses dépendent de nous (pensée, désir, aversion), d’autres non (corps, argent, réputation). »</p><p><b>Discussion.</b> Peut-on être libre en ne maîtrisant que sa pensée ? Le corps, la santé ou la réputation comptent pourtant pour le bonheur : cette sagesse n’est-elle pas trop exigeante ? (À comparer avec Épicure et Descartes.)</p>", "intro": ["On croit souvent que la liberté et le bonheur dépendent de ce que l’on possède : santé, richesse, réputation. Dans le <i>Manuel</i>, Épictète soutient que seule la pensée, et ce qui en dépend, est vraiment à nous.", "Épictète soutient la thèse suivante : Certaines choses dépendent de nous (pensée, désir, aversion), d’autres non (corps, argent, réputation). Seules les premières sont libres : les confondre rend malheureux, les distinguer rend invulnérable à toute contrainte. Cette thèse n’est pas évidente : si le corps et la réputation ne dépendent pas de nous, peut-on encore être heureux face à ce qui nous arrive ?", "Le texte avance en trois temps. Des lignes 1 à 7 : « Deux sortes de choses ». Des lignes 8 à 11 : « Libre ou esclave ». Des lignes 12 à 22 : « Le malheur de la confusion » ; « La liberté de la distinction »."], "dev": [{"l": "1-7", "obj": "Deux sortes de choses.", "sp": ["<b>Deux sortes de choses.</b> Certaines choses dépendent de nous (pensée, impulsion, désir, aversion), d’autres non (corps, argent, réputation, charges publiques)."], "tr": "Après avoir distingué ce qui dépend de nous de ce qui n’en dépend pas, Épictète donne le statut de chacun : les premières choses sont libres, les autres esclaves."}, {"l": "8-11", "obj": "Libre ou esclave.", "sp": ["<b>Libre ou esclave.</b> Ce qui dépend de nous est libre, sans obstacle ni entrave ; le reste est faible, esclave et nous est étranger."], "tr": "Si seul ce qui dépend de nous est libre, confondre les deux est source de malheur ; il en faut tirer la conséquence pratique."}, {"l": "12-22", "obj": "Le malheur de la confusion ; La liberté de la distinction.", "sp": ["<b>Le malheur de la confusion.</b> Tenir pour libre ce qui est esclave rend contrarié, chagriné, tourmenté : on en veut aux hommes comme aux dieux.", "<b>La liberté de la distinction.</b> Qui ne tient pour sien que ce qui l’est vraiment ne peut être contraint, n’a pas d’ennemis et ne fait rien contre son gré."], "tr": ""}], "concl": ["Le texte se demande : « Qu’est-ce qui dépend de nous, et comment être libre ? » Épictète répond ainsi : Certaines choses dépendent de nous (pensée, désir, aversion), d’autres non (corps, argent, réputation). Seules les premières sont libres : les confondre rend malheureux, les distinguer rend invulnérable à toute contrainte.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « Deux sortes de choses » puis « Libre ou esclave » puis « Le malheur de la confusion ; La liberté de la distinction ».", "On peut enfin discuter cette thèse. Peut-on être libre en ne maîtrisant que sa pensée ? Le corps, la santé ou la réputation comptent pourtant pour le bonheur : cette sagesse n’est-elle pas trop exigeante ? (À comparer avec Épicure et Descartes.)"]}, {"id": "inconscient-freud-elisabeth", "label": "Freud : le cas d’Élisabeth", "theme": "L’inconscient", "auteur": "Freud et Breuer", "oeuvre": "Études sur l’hystérie", "fiche": "inconscient-freud-elisabeth.html", "lignes": ["Freud commence donc ses analyses et les relate dans", "ses manuscrits. Nous trouverons ici un des exemples :", "le cas d’Élisabeth.", "(Élisabeth s'appelait en réalité Ilona Weiss.", "Hongroise d'origine, cette jeune fille âgée de 29 ans", "vient consulter Freud en 1892. Elle souffre de", "douleurs aux jambes que Freud attribue à des causes", "sexuelles. C'est l'occasion pour lui de proposer une", "méthode d'analyse nouvelle qui deviendra bientôt « la", "psychanalyse ».)", "Je l'interrogeai donc sur les circonstances et les", "causes de la première apparition des douleurs. Ses", "pensées s'attachèrent alors à des vacances dans la", "ville d'eaux où elle était allée avant son voyage à", "Gastein et certaines scènes surgirent, que nous avions", "déjà plus superficiellement traitées auparavant. Elle", "parla de son état d'âme à cette époque, de sa", "lassitude après tous les soucis que lui avaient causés", "la maladie ophtalmique de sa mère et les soins qu'elle", "lui avait donnés à l'époque de l'opération ; elle", "parla enfin de son découragement final en pensant", "qu'il lui faudrait, vieille fille solitaire, renoncer", "à profiter de l'existence et à réaliser quelque chose", "dans la vie. Jusqu'alors, elle s'était trouvée assez", "forte pour se passer de l'aide d'un homme ;", "maintenant, le sentiment de sa faiblesse féminine", "l'avait envahie, ainsi que le besoin d'amour, et", "alors, suivant ses propres paroles, son être figé", "commença à fondre.", "En proie à un pareil état d'âme, l'heureux mariage de", "sa sœur cadette fit sur elle la plus grande impression", "; elle fut témoin de tous les tendres soins dont le", "beau-frère entourait sa femme, de la façon dont ils se", "comprenaient d'un seul regard, de leur confiance", "mutuelle. On pouvait évidemment regretter que la", "deuxième grossesse succédât aussi rapidement à la", "première, mais sa sœur qui savait que c'était là la", "cause de sa maladie supportait allègrement son mal en", "pensant que l'être aimé en était la cause. Au moment", "de la promenade qui était étroitement liée aux", "douleurs d'Elisabeth, le beau-frère avait tout d'abord", "refusé de sortir, préférant rester auprès de sa femme", "malade, mais un regard de celle-ci, pensant", "qu'Elisabeth s'en réjouirait, le décida à faire cette", "excursion.", "La jeune fille resta tout le temps en compagnie de son", "beau-frère, ils parlèrent d'une foule de choses", "intimes et tout ce qu'il lui dit correspondait si bien", "à ses propres sentiments qu'un désir l'envahit alors :", "celui de posséder un mari ressemblant à celui-là. Puis", "ce fut le matin qui suivit le départ de la sur et du", "beau-frère qu'elle se rendit à ce site, promenade", "préférée de ceux qui venaient de partir. Là, elle", "s'assit sur une pierre, et rêva à nouveau d'une vie", "heureuse comme celle de sa sœur, et d'un homme, comme", "son beau-frère, qui saurait capter son cœur. En se", "relevant, elle ressentit une douleur qui disparut", "cette fois-là encore, et ce ne fut que dans l'après-", "midi qui suivit un bain chaud pris dans cet endroit", "que les douleurs réapparurent pour ne plus la quitter.", "J'essayai de savoir quelles pensées l'avaient", "préoccupée dans son bain ; je ne pus apprendre qu'une", "seule chose, c'est que l'établissement de bains", "l'avait fait se souvenir de ce que le jeune ménage y", "avait habité. J'avais compris depuis longtemps de quoi", "il s'agissait. La malade, plongée dans ses souvenirs à", "la fois doux et amers, paraissait ne pas saisir la", "sorte d'explication qu'elle me suggérait, et", "continuait à rapporter ses réminiscences. Elle", "dépeignait son séjour à Gastein et l'état d'anxiété où", "la plongeait l'arrivée de chacune des lettres; enfin", "lui parvint la nouvelle de l'état alarmant de sa sœur,", "et Elisabeth décrivit la longue attente, le départ du", "train, le voyage fait dans une angoissante", "incertitude, la nuit sans sommeil, tout cela", "accompagné d'une violente recrudescence des douleurs.", "Je lui demandai si elle s'était représentée pendant le", "trajet la tragique possibilité qu'elle trouva réalisée", "à son arrivée. Elle me dit avoir fait l'impossible", "pour chasser cette idée, mais sa mère, croyait-elle,", "s'était dès le début attendue au pire. Suivit le récit", "de son arrivée à Vienne. Elle décrivit l'impression", "causée par les parents qui les attendaient à la gare,", "le petit trajet de Vienne à la proche banlieue où", "habitait sa sur, l'arrivée le soir, la traversée", "rapide du jardin jusqu'à la porte du petit pavillon,", "la maison silencieuse et plongée dans une angoissante", "obscurité, le fait que le beau-frère ne vint pas à", "leur rencontre. Puis l'entrée dans la chambre où", "reposait la morte, et tout d'un coup, l'horrible", "certitude que cette sur bien aimée était partie sans", "leur dire adieu, sans que leurs soins eussent pu", "alléger ses derniers moments.", "Au même instant une autre pensée avait traversé", "l'esprit d'Élisabeth, une pensée qui, à la manière", "d'un éclair rapide, avait traversé les ténèbres :", "l'idée qu'il était redevenu libre, et qu'elle pourrait", "l'épouser. Tout s'éclairait. Les efforts de l'analyste", "étaient couronnés de succès. À cette minute, ce que", "j'avais supposé se confirmait à mes yeux, l'idée du «", "rejet » d'une représentation insupportable,", "l'apparition des symptômes hystériques par conversion", "d'une excitation psychique en symptômes somatiques, la", "formation - par un acte volontaire aboutissant à une", "défense d'un groupe psychique isolé. C'était ainsi et", "non autrement que les choses s'étaient ici passées.", "Cette jeune fille avait éprouvé pour son beau-frère", "une tendre inclination, mais toute sa personne morale", "révoltée avait refusé de prendre conscience de ce", "sentiment. Enfin, lorsque cette certitude s'était", "imposée à elle (pendant la promenade faite avec lui,", "pendant sa rêverie matinale, au bain et devant le lit", "de sa sœur), elle s'était créé des douleurs par une", "conversion réussie de psychique en somatique.", "À l'époque où j'entrepris son traitement, l'isolement", "du groupe d'associations relatives à cet amour était", "déjà fait accompli ; sans cela, je crois qu'elle ne se", "serait jamais prêtée au traitement, la résistance", "qu'elle opposa maintes fois à la reproduction des", "scènes traumatisantes correspondant réellement à", "l'énergie mise en œuvre pour rejeter hors des", "associations l'idée intenable. Toutefois, le", "thérapeute4 fut en proie à bien des difficultés dans", "le temps qui suivit. Pour cette pauvre enfant, l'effet", "de la prise de conscience d'une représentation", "refoulée fut bouleversante. Elle poussa les hauts", "cris, lorsqu'en termes précis, je lui exposai les", "faits en lui montrant que depuis longtemps, elle était", "amoureuse de son beau-frère. À cet instant, elle se", "plaignit des plus affreuses douleurs et fit encore un", "effort désespéré pour rejeter mes explications : « Ce", "n'était pas vrai, c'était moi qui le lui avais", "suggéré, c'était impossible, elle n'était pas capable", "de tant de vilenies, ce serait impardonnable, etc. »", "Il ne fut pas difficile de lui démontrer que ses", "propres paroles ne laissaient place à aucune autre", "interprétation, mais il me fallut longtemps pour lui", "faire accepter mes deux arguments consolateurs, à", "savoir que l'on n'est pas responsable de ses", "sentiments et que, dans ces circonstances, son", "comportement, son attitude, sa maladie, témoignaient", "suffisamment de sa haute moralité."], "mots": "Mots-clés : Conversion, Refoulement, Résistance.", "lire": "<p><b>Objet du texte.</b> Comment un désir refoulé peut-il produire un symptôme corporel ? <b>Notion du programme.</b> L’inconscient.</p><p><b>Connecteurs repérés.</b> « donc » (l.1), « alors » (l.13), « ainsi » (l.27), « mais » (l.37), « si… » (l.48). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Conversion</i> : transformation d’une excitation psychique en symptôme corporel. ; <i>Refoulement</i> : rejet hors de la conscience d’une représentation insupportable. ; <i>Résistance</i> : opposition du patient à la prise de conscience du refoulé.</p>", "these": "<
