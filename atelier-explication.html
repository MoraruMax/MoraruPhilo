ainsi nécessairement.", "- Et après toutes ces épreuves, il pourrait enfin", "aussi rassembler toutes ces pensées au sujet du soleil", "et se rendre compte que c'est lui qui accorde saisons", "et années, qui gouverne tout ce qui se trouve dans le", "monde à la lumière du jour et qui est encore la cause", "de tout ce qui est dans la caverne.", "- Manifestement, il ne parviendrait à ces pensées sur", "le soleil et sur tout ce qu'il éclaire et fait vivre", "qu'après les avoir distinguées de ce qui n'est", "qu'ombre ou reflet.", "- Maintenant, s'il parvenait à se rappeler le \"savoir\"", "qui avait cours au fond de la caverne, et ses", "compagnons enchaînés comme lui alors, ne crois-tu pas", "qu'il se féliciterait du changement qui s'est opéré en", "lui et qu'il aurait pitié d'eux ?", "- Certes, et dans une grande mesure.", "- Suppose maintenant qu'on ait institué dans la", "caverne des récompenses et des honneurs pour ceux qui", "reconnaîtraient le mieux parmi les ombres qui défilent", "celles qui arrivent chaque jour, mémoriseraient celles", "d'entre elles qui se présentent habituellement les", "premières, ou à la suite, ou ensemble et qui", "pourraient ainsi prédire l'ordre même de leurs", "apparitions. Crois-tu que notre homme les envierait et", "voudrait rivaliser avec les plus forts d'entre eux ?", "Ne préférerait-il pas prendre sur lui, comme dit", "Homère, d'être un vrai valet de labour au service d'un", "étranger sans fortune, plutôt que devenir un faux-", "maître de vérité, et ne supporterait-il pas n'importe", "quoi plutôt que se mettre à la mode de la caverne.", "- Je crois qu'il souffrirait tous les maux plutôt que", "d'être un homme comme on l'est là-bas.", "- Et maintenant considère enfin ceci : si l'homme", "ainsi élevé redescendait dans la caverne et regagnait", "son ancienne place, est-ce que ses yeux, à lui qui", "vient de quitter le soleil, ne se rempliraient pas de", "ténèbres ?", "- Absolument.", "- S'il devait maintenant entrer en compétition avec", "les prisonniers quant à l'appréciation de ce qu'il", "faut penser des ombres, et cela alors que ses yeux ne", "se sont pas encore réaccoutumés à l'obscurité (ce qui", "ne demande pas peu de temps) ne serait-il pas rendu", "ridicule et ne lui ferait-on pas comprendre que son", "voyage vers les régions supérieures ne lui a rapporté", "rien d'autre que la ruine de ses yeux (la seule", "richesse qu'il possédait) et qu'il ne vaut donc pas la", "peine de chercher à s'élever sur le chemin ?", "Et s'il entreprenait de délivrer les prisonniers de", "leurs chaînes et de les conduire voir ce qui est, ne", "crois-tu pas qu'ils le tueraient ?", "- Sans aucun doute."], "mots": "Mots-clés : Ombre et opinion, Conversion du regard, Le soleil.", "lire": "<p><b>Objet du texte.</b> Comment passer de l’ignorance à la connaissance ? Pourquoi est-il si difficile de renoncer à ce que l’on croit voir ? <b>Notion du programme.</b> La vérité.</p><p><b>Connecteurs repérés.</b> « pourquoi » (l.12), « cependant » (l.16), « par conséquent » (l.20), « donc » (l.26), « or » (l.43), « alors » (l.51). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Ombre et opinion</i> : les ombres figurent ce que nous croyons voir : apparences, opinions reçues. Le texte montre que celui qui n’a connu qu’elles les prend pour la réalité. ; <i>Conversion du regard</i> : platon commence par parler de l’éducation (« formation et non-formation »). Éduquer, ce n’est pas remplir un esprit, c’est détourner le regard des ombres vers ce qui est vrai : un travail difficile et progressif. ; <i>Le soleil</i> : dans le passage, il éclaire tout et cause ce qui est dans la caverne. Ailleurs dans La République (hors extrait), Platon l’interprète comme l’image de l’Idée du Bien.</p>", "these": "<p><b>Thèse.</b> Les hommes prennent pour la vérité les ombres qu’ils voient. S’en libérer est douloureux et progressif ; et celui qui revient annoncer la vérité risque d’être rejeté, voire tué.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « Des prisonniers dans la caverne » ; « Le feu, le chemin, la murette » ; « Les ombres sont « la vérité même » » ; « La libération est une épreuve » ; « Une accoutumance progressive » ; « Le prisonnier libéré prend pitié » ; « Le retour et le rejet ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-62", "idee": "Des prisonniers dans la caverne ; Le feu, le chemin, la murette ; Les ombres sont « la vérité même ».", "args": "Depuis l’enfance, des hommes sont enchaînés par le cou et les cuisses, face à la paroi : ils ne peuvent ni bouger ni tourner la tête. Derrière eux, un feu brûle ; entre le feu et eux, des hommes portent au-dessus d’une murette des objets fabriqués. Les prisonniers ne voient que les ombres projetées, et croient que les voix des porteurs viennent de ces ombres. Faute d’avoir jamais rien vu d’autre, les prisonniers prennent les ombres pour ce qui est.", "lien": "Une fois établi que les prisonniers prennent les ombres pour le vrai, on suppose que l’un d’eux est libéré."}, {"l": "63-155", "idee": "La libération est une épreuve ; Une accoutumance progressive ; Le prisonnier libéré prend pitié.", "args": "Libéré, forcé de se lever et de regarder la lumière, le prisonnier souffre, est ébloui, et juge plus vrai ce qu’il voyait avant. Tiré de force vers la sortie, il est « rempli de douleur et d’indignation ». Hors de la caverne, il voit d’abord les ombres, puis les reflets dans l’eau, puis les choses elles-mêmes, la nuit les astres, enfin le soleil « tel qu’il est ». Il comprend alors que le soleil gouverne le monde visible et cause tout ce qui est dans la caverne. Se rappelant la caverne, il se féliciterait de son changement et aurait pitié de ses compagnons. Il refuserait les honneurs décernés à ceux qui prédisent le mieux les ombres : mieux vaut être valet de labour qu’un « faux-maître de vérité ».", "lien": "Le chemin vers la lumière est long et douloureux : il reste à envisager ce qui arrive quand le libéré revient."}, {"l": "156-175", "idee": "Le retour et le rejet.", "args": "Redescendu, ses yeux sont pleins de ténèbres : il paraît ridicule et on lui dit que son voyage n’a fait que ruiner ses yeux. S’il voulait délivrer les prisonniers, « ils le tueraient ».", "lien": "Cette dernière étape donne la thèse : celui qui sort de l’opinion et veut en délivrer les autres risque d’être rejeté."}], "concepts": [{"c": "Ombre et opinion", "s": "Les ombres figurent ce que nous croyons voir : apparences, opinions reçues. Le texte montre que celui qui n’a connu qu’elles les prend pour la réalité."}, {"c": "Conversion du regard", "s": "Platon commence par parler de l’éducation (« formation et non-formation »). Éduquer, ce n’est pas remplir un esprit, c’est détourner le regard des ombres vers ce qui est vrai : un travail difficile et progressif."}, {"c": "Le soleil", "s": "Dans le passage, il éclaire tout et cause ce qui est dans la caverne. Ailleurs dans La République (hors extrait), Platon l’interprète comme l’image de l’Idée du Bien."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que ce que nous voyons serait toujours la réalité, ou que passer de l’ignorance à la connaissance serait facile.</p><p><b>Le problème.</b> Comment passer de l’ignorance à la connaissance ? Pourquoi est-il si difficile de renoncer à ce que l’on croit voir ?</p><p><b>L’enjeu.</b> Cette thèse n’est pas évidente : si les ombres sont tout ce que nous voyons, comment savoir que ce ne sont que des ombres ?</p><p><b>Formule.</b> « On dit souvent que ce que nous voyons serait toujours la réalité, ou que passer de l’ignorance à la connaissance serait facile, mais Platon soutient : Les hommes prennent pour la vérité les ombres qu’ils voient. »</p><p><b>Discussion.</b> Libérer de force ? Le prisonnier est « tiré de force » vers la lumière. Peut-on ou doit-on contraindre quelqu’un à la vérité ? Qui décide de ce qui est vrai ?</p>", "intro": ["On croit d’ordinaire que ce que l’on voit est la réalité, et qu’apprendre est un chemin agréable. Dans <i>La République</i>, Platon raconte au contraire l’histoire de prisonniers qui prennent des ombres pour le réel.", "Platon soutient la thèse suivante : Les hommes prennent pour la vérité les ombres qu’ils voient. S’en libérer est douloureux et progressif ; et celui qui revient annoncer la vérité risque d’être rejeté, voire tué. Cette thèse n’est pas évidente : si les ombres sont tout ce que nous voyons, comment savoir que ce ne sont que des ombres ?", "Le texte avance en trois temps. Des lignes 1 à 62 : « Des prisonniers dans la caverne » ; « Le feu, le chemin, la murette » ; « Les ombres sont « la vérité même » ». Des lignes 63 à 155 : « La libération est une épreuve » ; « Une accoutumance progressive » ; « Le prisonnier libéré prend pitié ». Des lignes 156 à 175 : « Le retour et le rejet »."], "dev": [{"l": "1-62", "obj": "Des prisonniers dans la caverne ; Le feu, le chemin, la murette ; Les ombres sont « la vérité même ».", "sp": ["<b>Des prisonniers dans la caverne.</b> Depuis l’enfance, des hommes sont enchaînés par le cou et les cuisses, face à la paroi : ils ne peuvent ni bouger ni tourner la tête.", "<b>Le feu, le chemin, la murette.</b> Derrière eux, un feu brûle ; entre le feu et eux, des hommes portent au-dessus d’une murette des objets fabriqués. Les prisonniers ne voient que les ombres projetées, et croient que les voix des porteurs viennent de ces ombres.", "<b>Les ombres sont « la vérité même ».</b> Faute d’avoir jamais rien vu d’autre, les prisonniers prennent les ombres pour ce qui est."], "tr": "Une fois établi que les prisonniers prennent les ombres pour le vrai, on suppose que l’un d’eux est libéré."}, {"l": "63-155", "obj": "La libération est une épreuve ; Une accoutumance progressive ; Le prisonnier libéré prend pitié.", "sp": ["<b>La libération est une épreuve.</b> Libéré, forcé de se lever et de regarder la lumière, le prisonnier souffre, est ébloui, et juge plus vrai ce qu’il voyait avant. Tiré de force vers la sortie, il est « rempli de douleur et d’indignation ».", "<b>Une accoutumance progressive.</b> Hors de la caverne, il voit d’abord les ombres, puis les reflets dans l’eau, puis les choses elles-mêmes, la nuit les astres, enfin le soleil « tel qu’il est ». Il comprend alors que le soleil gouverne le monde visible et cause tout ce qui est dans la caverne.", "<b>Le prisonnier libéré prend pitié.</b> Se rappelant la caverne, il se féliciterait de son changement et aurait pitié de ses compagnons. Il refuserait les honneurs décernés à ceux qui prédisent le mieux les ombres : mieux vaut être valet de labour qu’un « faux-maître de vérité »."], "tr": "Le chemin vers la lumière est long et douloureux : il reste à envisager ce qui arrive quand le libéré revient."}, {"l": "156-175", "obj": "Le retour et le rejet.", "sp": ["<b>Le retour et le rejet.</b> Redescendu, ses yeux sont pleins de ténèbres : il paraît ridicule et on lui dit que son voyage n’a fait que ruiner ses yeux. S’il voulait délivrer les prisonniers, « ils le tueraient »."], "tr": ""}], "concl": ["Le texte se demande : « Comment passer de l’ignorance à la connaissance ? Pourquoi est-il si difficile de renoncer à ce que l’on croit voir ? » Platon répond ainsi : Les hommes prennent pour la vérité les ombres qu’ils voient. S’en libérer est douloureux et progressif ; et celui qui revient annoncer la vérité risque d’être rejeté, voire tué.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « Des prisonniers dans la caverne ; Le feu, le chemin, la murette ; Les ombres sont « la vérité même » » puis « La libération est une épreuve ; Une accoutumance progressive ; Le prisonnier libéré prend pitié » puis « Le retour et le rejet ».", "On peut enfin discuter cette thèse. Libérer de force ? Le prisonnier est « tiré de force » vers la lumière. Peut-on ou doit-on contraindre quelqu’un à la vérité ? Qui décide de ce qui est vrai ?"]}, {"id": "verite-rousseau", "label": "Rousseau : dire faux et mentir", "theme": "La vérité", "auteur": "Rousseau", "oeuvre": "Les rêveries du promeneur solitaire", "fiche": "verite-rousseau.html", "lignes": ["Dire faux n’est mentir que par l’intention de tromper,", "et l’intention même de tromper loin d’être toujours", "jointe avec celle de nuire a quelquefois un but tout", "contraire. Mais pour rendre un mensonge innocent, il", "ne suffit pas que l’intention de nuire ne soit pas", "expresse, il faut de plus la certitude que l’erreur", "dans laquelle on jette ceux à qui l’on parle ne peut", "nuire à eux ni à personne en quelque façon que ce", "soit. Il est rare et difficile qu’on puisse avoir", "cette certitude ; aussi est-il difficile et rare qu’un", "mensonge soit parfaitement innocent. Mentir pour son", "avantage à soi-même est imposture, mentir pour", "l’avantage d’autrui est fraude, mentir pour nuire est", "calomnie ; c’est la pire espèce de mensonge. Mentir", "sans profit ni préjudice de soi ni d’autrui n’est pas", "mentir : ce n’est pas mensonge, c’est fiction."], "mots": "Mots-clés : Intention de tromper, Imposture, fraude, calomnie, Mensonge innocent.", "lire": "<p><b>Objet du texte.</b> Qu’est-ce qui fait qu’une parole fausse est un mensonge ? Tous les mensonges se valent-ils ? <b>Notion du programme.</b> La vérité.</p><p><b>Connecteurs repérés.</b> « mais » (l.4). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Intention de tromper</i> : vouloir qu’autrui croie une chose fausse. C’est ce qui distingue le mensonge d’une simple erreur. ; <i>Imposture, fraude, calomnie</i> : imposture : tromper pour son avantage. Fraude : pour celui d’autrui. Calomnie : pour nuire. ; <i>Mensonge innocent</i> : mensonge sans aucun préjudice possible. Rousseau le juge difficile à garantir.</p>", "these": "<p><b>Thèse.</b> Le mensonge suppose l’intention de tromper. Il est rarement parfaitement innocent ; on distingue imposture, fraude, calomnie, et la fiction, qui n’est pas un mensonge.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « Mentir, c’est vouloir tromper » ; « Tromper n’est pas toujours nuire » ; « Le mensonge innocent est rare » ; « Trois sortes de mensonges » ; « La fiction ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-4", "idee": "Mentir, c’est vouloir tromper ; Tromper n’est pas toujours nuire.", "args": "Dire faux n’est mentir que par l’intention de tromper. Une erreur involontaire n’est pas un mensonge. L’intention de tromper n’est pas toujours jointe à celle de nuire : elle peut même avoir un but tout contraire.", "lien": "Après avoir défini le mensonge par l’intention de tromper, Rousseau se demande à quelle condition il est innocent."}, {"l": "4-11", "idee": "Le mensonge innocent est rare.", "args": "Pour qu’un mensonge soit innocent, il ne suffit pas de ne pas vouloir nuire : il faut la certitude que l’erreur ne peut nuire à personne. Cette certitude est rare et difficile.", "lien": "Puisqu’un mensonge parfaitement innocent est rare, on peut distinguer plusieurs espèces de mensonges."}, {"l": "11-16", "idee": "Trois sortes de mensonges ; La fiction.", "args": "Mentir pour son avantage, c’est l’imposture ; pour l’avantage d’autrui, la fraude ; pour nuire, la calomnie, « la pire espèce de mensonge ». Mentir sans profit ni préjudice, ni pour soi ni pour autrui, ce n’est pas mentir : c’est de la fiction.", "lien": "Cette dernière étape donne la thèse : le mensonge suppose l’intention de tromper et tous les mensonges ne se valent pas, la fiction n’en étant pas un."}], "concepts": [{"c": "Intention de tromper", "s": "Vouloir qu’autrui croie une chose fausse. C’est ce qui distingue le mensonge d’une simple erreur."}, {"c": "Imposture, fraude, calomnie", "s": "Imposture : tromper pour son avantage. Fraude : pour celui d’autrui. Calomnie : pour nuire."}, {"c": "Mensonge innocent", "s": "Mensonge sans aucun préjudice possible. Rousseau le juge difficile à garantir."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que tous les mensonges se vaudraient, ou que dire faux suffirait à mentir.</p><p><b>Le problème.</b> Qu’est-ce qui fait qu’une parole fausse est un mensonge ? Tous les mensonges se valent-ils ?</p><p><b>L’enjeu.</b> Cette thèse n’est pas évidente : si l’on peut dire faux sans mentir, et mentir sans nuire, où passe la frontière du mensonge ?</p><p><b>Formule.</b> « On dit souvent que tous les mensonges se vaudraient, ou que dire faux suffirait à mentir, mais Rousseau soutient : Le mensonge suppose l’intention de tromper. »</p><p><b>Discussion.</b> Face à Kant. Kant juge qu’il ne faut jamais mentir ; Rousseau pèse l’intention et le préjudice. Quelle position vous paraît la plus tenable ?</p>", "intro": ["On dit volontiers que mentir, c’est dire quelque chose de faux, et que tous les mensonges se valent. Dans <i>Les rêveries du promeneur solitaire</i>, Rousseau précise ce qui fait un mensonge.", "Rousseau soutient la thèse suivante : Le mensonge suppose l’intention de tromper. Il est rarement parfaitement innocent ; on distingue imposture, fraude, calomnie, et la fiction, qui n’est pas un mensonge. Cette thèse n’est pas évidente : si l’on peut dire faux sans mentir, et mentir sans nuire, où passe la frontière du mensonge ?", "Le texte avance en trois temps. Des lignes 1 à 4 : « Mentir, c’est vouloir tromper » ; « Tromper n’est pas toujours nuire ». Des lignes 4 à 11 : « Le mensonge innocent est rare ». Des lignes 11 à 16 : « Trois sortes de mensonges » ; « La fiction »."], "dev": [{"l": "1-4", "obj": "Mentir, c’est vouloir tromper ; Tromper n’est pas toujours nuire.", "sp": ["<b>Mentir, c’est vouloir tromper.</b> Dire faux n’est mentir que par l’intention de tromper. Une erreur involontaire n’est pas un mensonge.", "<b>Tromper n’est pas toujours nuire.</b> L’intention de tromper n’est pas toujours jointe à celle de nuire : elle peut même avoir un but tout contraire."], "tr": "Après avoir défini le mensonge par l’intention de tromper, Rousseau se demande à quelle condition il est innocent."}, {"l": "4-11", "obj": "Le mensonge innocent est rare.", "sp": ["<b>Le mensonge innocent est rare.</b> Pour qu’un mensonge soit innocent, il ne suffit pas de ne pas vouloir nuire : il faut la certitude que l’erreur ne peut nuire à personne. Cette certitude est rare et difficile."], "tr": "Puisqu’un mensonge parfaitement innocent est rare, on peut distinguer plusieurs espèces de mensonges."}, {"l": "11-16", "obj": "Trois sortes de mensonges ; La fiction.", "sp": ["<b>Trois sortes de mensonges.</b> Mentir pour son avantage, c’est l’imposture ; pour l’avantage d’autrui, la fraude ; pour nuire, la calomnie, « la pire espèce de mensonge ».", "<b>La fiction.</b> Mentir sans profit ni préjudice, ni pour soi ni pour autrui, ce n’est pas mentir : c’est de la fiction."], "tr": ""}], "concl": ["Le texte se demande : « Qu’est-ce qui fait qu’une parole fausse est un mensonge ? Tous les mensonges se valent-ils ? » Rousseau répond ainsi : Le mensonge suppose l’intention de tromper. Il est rarement parfaitement innocent ; on distingue imposture, fraude, calomnie, et la fiction, qui n’est pas un mensonge.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « Mentir, c’est vouloir tromper ; Tromper n’est pas toujours nuire » puis « Le mensonge innocent est rare » puis « Trois sortes de mensonges ; La fiction ».", "On peut enfin discuter cette thèse. Face à Kant. Kant juge qu’il ne faut jamais mentir ; Rousseau pèse l’intention et le préjudice. Quelle position vous paraît la plus tenable ?"]}];

      field("t_these","La thèse du texte, en une ou deux phrases","",3)+

      `<label class="checkrow"><input type="checkbox" data-chk="t_rel" ${d.t_rel?"checked":""}> Je me suis demandé, en relisant l'ensemble du texte, si ma formulation de la thèse se confirme ou doit être précisée.</label>`+
      `<label class="checkrow"><input type="checkbox" data-chk="t_coh" ${d.t_coh?"checked":""}> Tous les moments et toutes les idées du texte prennent sens par rapport à cette thèse, de manière cohérente.</label>`+

      `<div class="lrow">${input("c"+j+"n","Concept "+(j+1),"")}${field("c"+j+"s","Son sens dans le texte et son importance","",3)}</div>`).join("")+
      corr("concepts",t.concepts.map((c,j)=>`<div class="cpart"><div class="cl">Concept ${j+1} : ${c.c}</div><p>${c.s}</p></div>`).join("")));
  }
  if(S.k==="probleme"){
    h+=box("À faire au brouillon",
      field("p_op","L'opinion que le texte remet en cause, ou ce qu'il a de paradoxal","",3)+
      field("p_pb","Le problème : la question à laquelle la thèse répond","",2)+
      field("p_en","L'enjeu et l'intérêt philosophique du texte","",3)+
      field("p_fo","Une formule pour commencer","(« On dit souvent que …, mais … »)",2)+
      field("p_di","La thèse appelle-t-elle une discussion ou une réserve ?","",3)+corr("probleme",t.probleme));
  }
  if(S.k==="intro"){
    h+=box("À faire au brouillon",
      field("i1","§ 1. Ce qui justifie de lire et d'expliquer le texte","(l'objet du texte et le problème à partir duquel il prend son sens)",4)+
      field("i2","§ 2. La thèse du texte, et en quoi elle n'est pas forcément évidente","(paradoxale, susceptible de plusieurs interprétations, donc à expliquer)",4)+
      field("i3","§ 3. Les étapes du texte, avec les lignes","(un cheminement logique, non une succession d'idées)",4)+
      corr("intro",t.intro.map((p,j)=>`<div class="cpart"><div class="cl">§ ${j+1}</div><p>${p}</p></div>`).join("")));

    h+=`<div class="q">`+corr("dev",t.dev.map((p,j)=>`<div class="cpart"><div class="cl">Partie ${j+1} (l.${p.l}) ${lnk(p.l)}</div><p><b>Objet.</b> ${p.obj}</p>${ul(p.sp)}${p.tr?`<p><b>Transition.</b> ${p.tr}</p>`:""}</div>`).join(""))+`</div>`;
  }
  if(S.k==="concl"){
    h+=box("À faire au brouillon",
      field("k1","Je rappelle le problème auquel le texte se confronte et la thèse qu'il soutient","",3)+
      field("k2","Je montre en quoi l'analyse a permis de préciser le sens et les nuances de la thèse","",3)+
      field("k3","J'éclaire l'originalité de la thèse et ses enjeux","(même s'il s'agit de formuler d'éventuelles critiques ou de discuter la portée du texte)",3)+
      corr("concl",t.concl.map((p,j)=>`<div class="cpart"><p>${p}</p></div>`).join("")));
  }
  if(S.k==="red"){
    const ck=d.red||[];
    h+=box("Avant de rendre la copie",REDAC.map((b,j)=>`<label class="checkrow"><input type="checkbox" data-red="${j}" ${ck[j]?"checked":""}> ${b}</label>`).join("")+
      `<p class="bilan-links" style="margin:14px 0 10px"><a href="methode-explication-texte.html">Relire la méthode</a> · <a href="auto-evaluation-explication.html">Auto-évaluation</a></p><div class="actions"><button class="btn" type="button" data-pdf="1">Enregistrer en PDF</button><a class="btn primary depot" href="https://framaforms.org/explication-de-texte-1792421291" target="_blank" rel="noopener noreferrer">Déposer mon travail ↗</a></div><p class="depot-note">Pour rendre votre travail, et ce uniquement si vous souhaitez que je vous corrige : enregistrez-le en PDF, puis cliquez sur « Déposer mon travail ». N’oubliez pas d’indiquer votre prénom et nom sur le Framaform.</p>`);
  }
  const last=i===STEPS.length-1;
  if(!lect) h+=`<div class="actions">${i>0?`<button class="btn" data-go="${i-1}">← Précédent</button>`:""}<span class="spacer"></span>${last?"":`<button class="btn primary" data-go="${i+1}">Étape suivante →</button>`}</div>`;
  root.innerHTML=h;
}

function init(){
  try{ const h=decodeURIComponent((location.hash||"").slice(1)); if(h && TEXTS.some(t=>t.id===h)){ store.tid=h; store.step=0; } }catch(e){}
  const groups=[]; TEXTS.forEach(t=>{ let g=groups.find(x=>x.n===t.theme); if(!g){g={n:t.theme,l:[]};groups.push(g);} g.l.push(t); });
  $("#pick").innerHTML=groups.map(g=>`<optgroup label="${esc(g.n)}">`+g.l.map(t=>`<option value="${t.id}" ${t.id===store.tid?"selected":""}>${esc(t.label)}</option>`).join("")+`</optgroup>`).join("");
  $("#pick").addEventListener("change",e=>{store.tid=e.target.value;store.step=0;shown.clear();save();renderText();rerender();setFocus(null);});
  document.addEventListener("input",e=>{ const k=e.target.dataset&&e.target.dataset.k; if(k){D()[k]=e.target.value;save();} });
  document.addEventListener("change",e=>{ const x=e.target.dataset||{}; const d=D();
    if(x.red!=null){d.red=d.red||[];d.red[+x.red]=e.target.checked;save();}
    if(x.chk){d[x.chk]=e.target.checked;save();} });
  document.addEventListener("focusin",e=>{ const q=e.target.closest&&e.target.closest("[data-l]"); if(q){const [a,b]=q.dataset.l.split("-").map(Number);setFocus(a,b);} });
  document.addEventListener("click",e=>{
    if(e.target.closest("[data-pdf]")){ savePdf(); return; }
    const g=e.target.closest("[data-go]"); if(g){store.step=+g.dataset.go;save();renderStep();setFocus(null);window.scrollTo({top:0,behavior:"smooth"});return;}
    const c=e.target.closest("[data-corr]"); if(c){const id=c.dataset.corr; shown.has(id)?shown.delete(id):shown.add(id); const y=window.scrollY; rerender(); window.scrollTo(0,y); return;}
    const h=e.target.closest("[data-hl]"); if(h){const [a,b]=h.dataset.hl.split("-").map(Number);setFocus(a,b);const m=$("#mobtx"); if(m&&m.offsetParent){m.open=true;} return;}
    const sw=e.target.closest("[data-col]"); if(sw){store.col=+sw.dataset.col; $$(".sw").forEach(x=>{const on=+x.dataset.col===store.col; x.classList.toggle("on",on); x.setAttribute("aria-pressed",on);}); save(); return;}
    const ln=e.target.closest(".ln"); if(ln){const n=+ln.dataset.n; let m=store.mine[store.tid]; if(!m||Array.isArray(m)) m=store.mine[store.tid]={}; const on=m[n]===store.col; if(on) delete m[n]; else m[n]=store.col; $$(".ln[data-n='"+n+"']").forEach(el=>{el.className=el.className.replace(/\s*\b(mine|c\d)\b/g,""); if(!on) el.classList.add("mine","c"+store.col);}); save();}
  });
  renderText(); renderStep();
}
const HW = [278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];
const WIN = {"’":0x92,"‘":0x91,"“":0x93,"”":0x94,"…":0x85,"–":0x96,"—":0x97,"œ":0x9C,"Œ":0x8C,"€":0x80,"•":0x95};
function pdfChar(ch){
  if(WIN[ch]) return WIN[ch];
  const c = ch.charCodeAt(0);
  if(c>=32 && c<127) return c;
  if(c>=0xA0 && c<=0xFF) return c;
  return 63;
}
function pdfWidth(code){
  if(code>=32 && code<127) return HW[code-32];
  if(code===0x92||code===0x91) return 222;
  if(code===0x93||code===0x94||code===0xAB||code===0xBB) return 333;
  if(code===0x85) return 1000;
  if(code===0x96) return 556;
  if(code===0x97) return 1000;
  if(code===0x9C) return 944;
  if(code===0x8C) return 1000;
  if(code>=0xC0 && code<=0xFF){
    const base = String.fromCharCode(code).normalize("NFD").charAt(0).charCodeAt(0);
    if(base>=32 && base<127) return HW[base-32];
  }
  return 556;
}
function toWin(str){ return Array.from(str.normalize("NFC")).map(pdfChar); }
function wrapLine(codes, size, maxW, bold){
  const k = size/1000*(bold?1.06:1), words = []; let cur = [];
  codes.forEach(c=>{ if(c===32){ words.push(cur); cur=[]; } else cur.push(c); }); words.push(cur);
  const lines = []; let line = [], w = 0;
  words.forEach(wd=>{
    const ww = wd.reduce((a,c)=>a+pdfWidth(c)*k,0), sp = pdfWidth(32)*k;
    if(line.length && w+sp+ww>maxW){ lines.push(line); line=[]; w=0; }
    if(line.length){ line = line.concat([32]); w+=sp; }
    line = line.concat(wd); w+=ww;
  });
  lines.push(line); return lines;
}
function buildPdf(blocks){
  /* blocks : [{t:texte, size, bold, before}] ; texte avec \n = paragraphes */
  const W=595, H=842, M=56, maxW=W-2*M, pages=[]; let ops=[], y=H-M;
  const newPage=()=>{ pages.push(ops.join("\n")); ops=[]; y=H-M; };
  const esc1=codes=>codes.map(c=>(c===40||c===41||c===92)?"\\"+String.fromCharCode(c):(c<32?"?":String.fromCharCode(c))).join("");
  blocks.forEach(bl=>{
    const lead = bl.size*1.4; y -= (bl.before||0);
    bl.t.split("\n").forEach(par=>{
      wrapLine(toWin(par), bl.size, maxW, bl.bold).forEach(line=>{
        if(y-lead < M) newPage();
        y -= lead;
        if(line.length) ops.push(`BT /${bl.bold?"F2":"F1"} ${bl.size} Tf ${M} ${y.toFixed(1)} Td (${esc1(line)}) Tj ET`);
      });
    });
  });
  pages.push(ops.join("\n"));
  const objs = [];
  const n = pages.length;
  objs[1] = "<< /Type /Catalog /Pages 2 0 R >>";
  objs[2] = `<< /Type /Pages /Kids [${pages.map((_,i)=>(5+i*2)+" 0 R").join(" ")}] /Count ${n} >>`;
  objs[3] = "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>";
  objs[4] = "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>";
  pages.forEach((c,i)=>{
    objs[5+i*2] = `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${6+i*2} 0 R >>`;
    objs[6+i*2] = `<< /Length ${c.length} >>\nstream\n${c}\nendstream`;
  });
  let out = "%PDF-1.4\n"; const off = [];
  for(let i=1;i<objs.length;i++){ off[i]=out.length; out += `${i} 0 obj\n${objs[i]}\nendobj\n`; }
  const xr = out.length;
  out += `xref\n0 ${objs.length}\n0000000000 65535 f \n` + off.slice(1).map(o=>String(o).padStart(10,"0")+" 00000 n \n").join("") + `trailer\n<< /Size ${objs.length} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`;
  const u = new Uint8Array(out.length); for(let i=0;i<out.length;i++) u[i]=out.charCodeAt(i)&255;
  return u;
}

const PDF_FIELDS = {
  lire:[["l_obj","Auteur, œuvre, objet du texte"],["l_not","Notion du programme"],["l_voc","Vocabulaire à éclaircir"],["l_dif","Difficultés repérées"]],
  these:[["t_these","La thèse"],["t_arg","L’argumentation qui s’y rattache"]],
  etapes:[0,1,2].flatMap(j=>[["e"+j+"l","Étape "+(j+1)+" : lignes"],["e"+j+"i","Étape "+(j+1)+" : idée"],["e"+j+"a","Étape "+(j+1)+" : arguments et exemples"],["e"+j+"x","Étape "+(j+1)+" : lien logique"]]),
  concepts:[0,1,2].flatMap(j=>[["c"+j+"n","Concept "+(j+1)],["c"+j+"s","Sens et importance"]]),
  probleme:[["p_op","Opinion remise en cause"],["p_pb","Le problème"],["p_en","L’enjeu"],["p_fo","Formule"],["p_di","Discussion ou réserve"]],
  intro:[["i1","Introduction, § 1"],["i2","Introduction, § 2"],["i3","Introduction, § 3"]],
  dev:[0,1,2].flatMap(j=>[["d"+j+"l","Partie "+(j+1)+" : lignes"],["d"+j+"o","Partie "+(j+1)+" : objet"],["d"+j+"s","Partie "+(j+1)+" : sous-parties"],["d"+j+"t","Partie "+(j+1)+" : transition"]]),
  concl:[["k1","Rappel du problème et de la thèse"],["k2","Ce que l’analyse a précisé"],["k3","Originalité, enjeux, discussion"]]
};
function stepPdfText(k){
  const d=D();
  return (PDF_FIELDS[k]||[]).map(([key,lab])=>d[key]&&d[key].trim()?lab+" : "+d[key].trim():"").filter(Boolean).join("\n");
}
function pdfBlocks(){
  const t=cur();
  const bl=[{t:"Explication de texte", size:19, bold:true},{t:"Texte : "+t.auteur+(t.oeuvre?", "+t.oeuvre:""), size:12, bold:true, before:10}];
  STEPS.slice(0,-1).forEach((x,j)=>{
    bl.push({t:(j+1)+". "+x.lbl, size:13, bold:true, before:14});
    bl.push({t:stepPdfText(x.k)||"(non rempli)", size:11, before:3});
  });
  return bl;
}
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,2600); }
function savePdf(){
  try{
    const bytes=buildPdf(pdfBlocks());
    const url=URL.createObjectURL(new Blob([bytes],{type:"application/pdf"}));
    const a=document.createElement("a"); a.href=url; a.download="explication-de-texte.pdf";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    toast("PDF enregistré");
  }catch(e){ toast("Impossible de créer le PDF ici"); }
}

/* ---------- Accessibilité : page d'origine / mode lecture ---------- */
(function(){
  const btn=$("#a11y-btn"), menu=$("#a11y-menu"), opts=menu.querySelectorAll(".a11y-opt"), r=document.documentElement, K="atelier-lecture";
  function set(m){
    const on=m==="lect", was=r.classList.contains("lect");
    opts.forEach(o=>o.setAttribute("aria-checked",o.dataset.mode===m?"true":"false"));
    if(on===was) return;
    r.classList.toggle("lect",on);
    if(on){ $("#sheet").innerHTML=""; renderLecture(); const m=$("#mobtx"); if(m) m.open=true; } else { $("#lecture").innerHTML=""; renderStep(); }
    try{localStorage.setItem(K,on?"1":"0")}catch(e){}
  }
  function open(on){ menu.hidden=!on; btn.setAttribute("aria-expanded",on?"true":"false"); }
  btn.addEventListener("click",e=>{ e.stopPropagation(); open(menu.hidden); });
  opts.forEach(o=>o.addEventListener("click",()=>{ set(o.dataset.mode); open(false); btn.focus(); }));
  document.addEventListener("click",e=>{ if(!menu.hidden && !menu.contains(e.target) && e.target!==btn) open(false); });
  document.addEventListener("keydown",e=>{ if(e.key==="Escape" && !menu.hidden){ open(false); btn.focus(); } });
  let v=false; try{v=localStorage.getItem(K)==="1"}catch(e){}
  if(v) set("lect");
})();
