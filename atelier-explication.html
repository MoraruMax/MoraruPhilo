"Le texte se demande : « Comment décider quand deux devoirs s’opposent ? » Sartre répond ainsi : Le dilemme du jeune homme oppose une morale de la sympathie, concrète mais limitée à un individu, et une morale plus large mais d’efficacité contestable. Aucune règle générale ne peut trancher à sa place.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « Deux choix ; Une mère qui ne vit que par lui » puis « Une action concrète ou ambiguë ; Individu ou collectivité » puis « Deux types de morale ».", "On peut enfin discuter cette thèse. Qui peut aider à choisir ? La suite du texte répond : personne, ni la morale chrétienne, ni Kant. Le choix est libre et responsable. (À comparer avec Kant.)"]}, {"id": "etat-chapoutot", "label": "Chapoutot : les nazis, ennemis de l’État ?", "theme": "L’État", "auteur": "Chapoutot", "oeuvre": "Libres d’obéir", "fiche": "etat-chapoutot.html", "lignes": ["Idéologues et juristes du IIIe Reich sont parfaitement", "d’accord : l’État n’existait pas chez les Germains des", "origines, qui étaient organisés en tribus, en familles", "respectueuses des lois de la nature et de la vie.", "L’État est une création du droit romain tardif,", "contemporain de la dégénérescence raciale de la Rome", "antique et de la rédaction des premiers codes de loi", "(le Code justinien), qui ont fixé la norme sur un", "parchemin, une norme abstraite et écrite, alors que le", "droit originel était pur instinct et pulsion vitale.", "Le droit germanique des origines a cédé la place à la", "loi juive (les Juifs ne sont-ils pas le peuple de la", "Loi par excellence ?), dont un État statique et ses", "institutions ont été les garants. Parallèlement,", "l’Église, autre État, s’est érigée en gardienne d’un", "dogme mortel pour la race germanique (égalité des", "hommes et universalité de la norme), tout en étouffant", "et détruisant les cultes naturels sains des Germains,", "forcés à la conversion par des missionnaires", "(judéo-)chrétiens aussi sournois que violents. […]", "La théorie est donc claire : à notre grand étonnement,", "les nazis se révèlent des anti-étatistes convaincus.", "La pratique est plus explicite encore. […] Alors que", "le IIIe Reich se donnait les apparences de l’ordre le", "plus strict qui fût, son fonctionnement évoquait plus", "un système instable et chaotique que les chorégraphies", "impeccables des défilés. L’image que projetait le", "nouveau régime était architectonique : la rigueur", "hiératique de l’architecture néoclassique se", "dupliquait dans les mouvements maîtrisés des «", "colonnes » humaines, cette architecture de chair qui", "reproduisait la régularité géométrique de la pierre.", "Les actualités cinématographiques, comme les films de", "Leni Riefenstahl, consacrent avec insistance cette", "image d’un ordre implacable : au désordre de la", "République de Weimar, au chaos de la démocratie,", "succède la géométrie ordonnée d’une nouvelle", "Allemagne, unifiée et réunie par la volonté du Führer,", "interprète des lois de la nature et de la volonté", "profonde du peuple allemand. L’essence allemande, par", "rapport à la dissipation latine, aux transes noires ou", "à l’anarchie juive, est toute d’ordre et d’unité : Ein", "Volk, ein Reich, ein Führer (on remarque au passage", "qu’il n’est pas question de « ein Staat »)."], "mots": "Mots-clés : Anti-étatisme, Führer, Ein Volk, ein Reich, ein Führer.", "lire": "<p><b>Objet du texte.</b> Le nazisme est-il un étatisme ? <b>Notion du programme.</b> L’État.</p><p><b>Connecteurs repérés.</b> « alors » (l.9), « donc » (l.21). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Anti-étatisme</i> : hostilité à l’État comme institution distincte du peuple. ; <i>Führer</i> : chef charismatique censé incarner la volonté profonde du peuple. ; <i>Ein Volk, ein Reich, ein Führer</i> : un peuple, un empire, un chef : slogan sans mention de l’État.</p>", "these": "<p><b>Thèse.</b> La théorie nazie est anti-étatiste : l’État serait une invention romaine et juive, contraire à l’instinct de la communauté germanique. L’ordre apparent du régime masque un fonctionnement chaotique ; la volonté du Führer remplace l’État.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « Un accord des juristes du Reich » ; « Une création du droit romain tardif » ; « Une idéologie antisémite et antichrétienne » ; « Des anti-étatistes convaincus » ; « Une image d’ordre ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-22", "idee": "Un accord des juristes du Reich ; Une création du droit romain tardif ; Une idéologie antisémite et antichrétienne.", "args": "L’État n’existait pas chez les Germains, organisés en tribus respectueuses des lois de la nature et de la vie. Il est lié à la « dégénérescence » de Rome et à la norme écrite, abstraite, opposée au droit originel, instinct et pulsion vitale. Le texte rapporte que l’idéologie nazie rattachait l’État à la « loi juive » et à l’Église. Chapoutot présente ces thèses pour les analyser, non pour les approuver.", "lien": "Après avoir exposé la théorie nazie de l’État (création du droit romain, contraire à l’instinct germanique), Chapoutot en montre la mise en pratique : des anti-étatistes convaincus."}, {"l": "23-27", "idee": "Des anti-étatistes convaincus.", "args": "Les nazis sont, en théorie comme en pratique, hostiles à l’État. Le régime fonctionne comme un système instable et chaotique.", "lien": "Si les nazis sont anti-étatistes, il faut expliquer pourquoi le régime donnait une image d’ordre."}, {"l": "27-44", "idee": "Une image d’ordre.", "args": "Défilés, architecture néoclassique, films de Leni Riefenstahl : l’ordre implacable remplace le chaos de Weimar. Le Führer est l’interprète des lois de la nature et de la volonté du peuple.", "lien": "Cette image d’ordre masque un fonctionnement chaotique : la volonté du Führer remplace l’État."}], "concepts": [{"c": "Anti-étatisme", "s": "Hostilité à l’État comme institution distincte du peuple."}, {"c": "Führer", "s": "Chef charismatique censé incarner la volonté profonde du peuple."}, {"c": "Ein Volk, ein Reich, ein Führer", "s": "Un peuple, un empire, un chef : slogan sans mention de l’État."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que le nazisme serait un régime d’État fort, un étatisme.</p><p><b>Le problème.</b> Le nazisme est-il un étatisme ?</p><p><b>L’enjeu.</b> Cette thèse est paradoxale : comment un régime d’apparence si ordonnée peut-il être contre l’État ?</p><p><b>Formule.</b> « On dit souvent que le nazisme serait un régime d’État fort, un étatisme, mais Chapoutot soutient : La théorie nazie est anti-étatiste : l’État serait une invention romaine et juive, contraire à l’instinct de la communauté germanique. »</p><p><b>Discussion.</b> Ordre apparent, désordre réel. Un régime peut-il paraître fort tout en étant instable ? (À comparer avec Hobbes.)</p>", "intro": ["On croit souvent que le régime nazi est l’exemple d’un État tout-puissant et ordonné. Dans <i>Libres d’obéir</i>, Chapoutot soutient au contraire que la théorie nazie est anti-étatiste.", "Chapoutot soutient la thèse suivante : La théorie nazie est anti-étatiste : l’État serait une invention romaine et juive, contraire à l’instinct de la communauté germanique. L’ordre apparent du régime masque un fonctionnement chaotique ; la volonté du Führer remplace l’État. Cette thèse est paradoxale : comment un régime d’apparence si ordonnée peut-il être contre l’État ?", "Le texte avance en trois temps. Des lignes 1 à 22 : « Un accord des juristes du Reich » ; « Une création du droit romain tardif » ; « Une idéologie antisémite et antichrétienne ». Des lignes 23 à 27 : « Des anti-étatistes convaincus ». Des lignes 27 à 44 : « Une image d’ordre »."], "dev": [{"l": "1-22", "obj": "Un accord des juristes du Reich ; Une création du droit romain tardif ; Une idéologie antisémite et antichrétienne.", "sp": ["<b>Un accord des juristes du Reich.</b> L’État n’existait pas chez les Germains, organisés en tribus respectueuses des lois de la nature et de la vie.", "<b>Une création du droit romain tardif.</b> Il est lié à la « dégénérescence » de Rome et à la norme écrite, abstraite, opposée au droit originel, instinct et pulsion vitale.", "<b>Une idéologie antisémite et antichrétienne.</b> Le texte rapporte que l’idéologie nazie rattachait l’État à la « loi juive » et à l’Église. Chapoutot présente ces thèses pour les analyser, non pour les approuver."], "tr": "Après avoir exposé la théorie nazie de l’État (création du droit romain, contraire à l’instinct germanique), Chapoutot en montre la mise en pratique : des anti-étatistes convaincus."}, {"l": "23-27", "obj": "Des anti-étatistes convaincus.", "sp": ["<b>Des anti-étatistes convaincus.</b> Les nazis sont, en théorie comme en pratique, hostiles à l’État. Le régime fonctionne comme un système instable et chaotique."], "tr": "Si les nazis sont anti-étatistes, il faut expliquer pourquoi le régime donnait une image d’ordre."}, {"l": "27-44", "obj": "Une image d’ordre.", "sp": ["<b>Une image d’ordre.</b> Défilés, architecture néoclassique, films de Leni Riefenstahl : l’ordre implacable remplace le chaos de Weimar. Le Führer est l’interprète des lois de la nature et de la volonté du peuple."], "tr": ""}], "concl": ["Le texte se demande : « Le nazisme est-il un étatisme ? » Chapoutot répond ainsi : La théorie nazie est anti-étatiste : l’État serait une invention romaine et juive, contraire à l’instinct de la communauté germanique. L’ordre apparent du régime masque un fonctionnement chaotique ; la volonté du Führer remplace l’État.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « Un accord des juristes du Reich ; Une création du droit romain tardif ; Une idéologie antisémite et antichrétienne » puis « Des anti-étatistes convaincus » puis « Une image d’ordre ».", "On peut enfin discuter cette thèse. Ordre apparent, désordre réel. Un régime peut-il paraître fort tout en étant instable ? (À comparer avec Hobbes.)"]}, {"id": "etat-hobbes", "label": "Hobbes : l’état de nature, guerre de tous contre tous", "theme": "L’État", "auteur": "Hobbes", "oeuvre": "Léviathan, chapitre XIII", "fiche": "etat-hobbes.html", "lignes": ["La Nature a fait les hommes si égaux pour ce qui est", "des facultés du corps et de l’esprit que, quoiqu’on", "puisse trouver parfois un homme manifestement plus", "fort corporellement, ou d’un esprit plus vif,", "cependant, tout compte fait, globalement, la", "différence entre un homme et un homme n’est pas si", "considérable qu’un homme particulier puisse de là", "revendiquer pour lui-même un avantage auquel un autre", "ne puisse prétendre aussi bien que lui. Car, pour ce", "qui est de la force du corps, le plus faible a assez", "de force pour tuer le plus fort, soit par une", "machination secrète, soit en s’unissant à d’autres qui", "sont menacés du même danger que lui-même. Et encore,", "pour ce qui est des facultés de l’esprit, sans compter", "les arts fondés sur des mots, et surtout cette", "compétence qui consiste à procéder selon des règles", "générales et infaillibles, appelée science, que très", "peu possèdent, et seulement sur peu de choses, qui", "n’est ni une faculté innée née avec nous, ni une", "faculté acquise en s’occupant de quelque chose", "d’autre, comme la prudence, je trouve une plus grande", "égalité entre les hommes que l’égalité de force.", "Car la prudence n’est que de l’expérience qui, en des", "temps égaux, est également donnée à tous les hommes", "sur les choses auxquelles ils s’appliquent également.", "Ce qui, peut-être, fait que les hommes ne croient pas", "à une telle égalité, ce n’est que la conception", "vaniteuse que chacun a de sa propre sagesse, [sagesse]", "que presque tous les hommes se figurent posséder à un", "degré plus élevé que le vulgaire, c’est-à-dire tous", "[les autres] sauf eux-mêmes, et une minorité d’autres", "qu’ils approuvent, soit à cause de leur renommée, soit", "parce qu’ils partagent leur opinion. Car telle est la", "nature des hommes que, quoiqu’ils reconnaissent que", "nombreux sont ceux qui ont plus d’esprit [qu’eux-", "mêmes], qui sont plus éloquents ou plus savants,", "pourtant ils ne croiront guère que nombreux sont ceux", "qui sont aussi sages qu’eux-mêmes ; car ils voient", "leur propre esprit de près, et celui des autres hommes", "de loin.", "Mais cela prouve que les hommes sont plutôt égaux", "qu’inégaux sur ce point. Car, ordinairement, il", "n’existe pas un plus grand signe de la distribution", "égale de quelque chose que le fait que chaque homme", "soit satisfait de son lot. De cette égalité de", "capacité résulte une égalité d’espoir d’atteindre nos", "fins. Et c’est pourquoi si deux hommes désirent la", "même chose, dont ils ne peuvent cependant jouir tous", "les deux, ils deviennent ennemis ; et, pour atteindre", "leur but (principalement leur propre conservation, et", "quelquefois le seul plaisir qu’ils savourent), ils", "s’efforcent de se détruire ou de subjuguer l’un", "l’autre. Et de là vient que, là où un envahisseur n’a", "plus à craindre que la puissance individuelle d’un", "autre homme, si quelqu’un plante, sème, construit, ou", "possède un endroit commode, on peut s’attendre à ce", "que d’autres, probablement, arrivent, s’étant préparés", "en unissant leurs forces, pour le déposséder et le", "priver, non seulement du fruit de son travail, mais", "aussi de sa vie ou de sa liberté.", "Et l’envahisseur, à son tour, est exposé au même", "danger venant d’un autre. Et de cette défiance de l’un", "envers l’autre, [il résulte qu’] il n’existe aucun", "moyen pour un homme de se mettre en sécurité aussi", "raisonnable que d’anticiper, c’est-à-dire de se rendre", "maître, par la force ou la ruse de la personne du plus", "grand nombre possible d’hommes, jusqu’à ce qu’il ne", "voit plus une autre puissance assez importante pour le", "mettre en danger ; et ce n’est là rien de plus que ce", "que sa conservation exige, et ce qu’on permet", "généralement. Aussi, parce qu’il y en a certains qui,", "prenant plaisir à contempler leur propre puissance", "dans les actes de conquête, qu’ils poursuivent au-delà", "de ce que leur sécurité requiert, si d’autres, qui", "autrement seraient contents d’être tranquilles à", "l’intérieur de limites modestes, n’augmentaient pas", "leur puissance par invasion, ils ne pourraient pas", "subsister longtemps, en se tenant seulement sur la", "défensive.", "Et par conséquent, une telle augmentation de la", "domination sur les hommes étant nécessaire à la", "conservation de l’homme, elle doit être permise. De", "plus, les hommes n’ont aucun plaisir (mais au", "contraire, beaucoup de déplaisir) à être ensemble là", "où n’existe pas de pouvoir capable de les dominer tous", "par la peur. Car tout homme escompte que son compagnon", "l’estime au niveau où il se place lui-même, et, au", "moindre signe de mépris ou de sous-estimation, il", "s’efforce, pour autant qu’il l’ose (ce qui est", "largement suffisant pour faire que ceux qui n’ont pas", "de pouvoir commun qui les garde en paix se détruisent", "l’un l’autre), d’arracher une plus haute valeur à ceux", "qui le méprisent, en leur nuisant, et aux autres, par", "l’exemple.", "De sorte que nous trouvons dans la nature humaine", "trois principales causes de querelle : premièrement,", "la rivalité; deuxièmement, la défiance ; et", "troisièmement la fierté. La première fait que les", "hommes attaquent pour le gain, la seconde pour la", "sécurité, et la troisième pour la réputation. Dans le", "premier cas, ils usent de violence pour se rendre", "maîtres de la personne d’autres hommes, femmes,", "enfants, et du bétail; dans le second cas, pour les", "défendre ; et dans le troisième cas, pour des", "bagatelles, comme un mot, un sourire, une opinion", "différente, et tout autre signe de sous-estimation,", "[qui atteint] soit directement leur personne, soit,", "indirectement leurs parents, leurs amis, leur nation,", "leur profession, ou leur nom.", "Par là, il est manifeste que pendant le temps où les", "hommes vivent sans un pouvoir commun qui les", "maintienne tous dans la peur, ils sont dans cette", "condition qu’on appelle guerre, et cette guerre est", "telle qu’elle est celle de tout homme contre homme.", "Car la GUERRE ne consiste pas seulement dans la", "bataille, ou dans l’acte de se battre, mais dans un", "espace de temps où la volonté de combattre est", "suffisamment connue ; et c’est pourquoi, pour la", "nature de la guerre, il faut prendre en considération", "la notion de temps, comme on le fait pour le temps", "qu’il fait. Car, tout comme la nature du mauvais temps", "ne réside pas dans une ou deux averses, mais dans une", "tendance au mauvais temps durant de nombreux jours, la", "nature de la guerre ne consiste pas en un combat", "effectif, mais en une disposition connue au combat,", "pendant tout le temps où il n’y a aucune assurance du", "contraire.", "Tout autre temps est PAIX. Par conséquent, tout ce qui", "résulte d’un temps de guerre, où tout homme est", "l’ennemi de tout homme, résulte aussi d’un temps où", "les hommes vivent sans autre sécurité que celle que", "leur propre force et leur propre capacité d’invention", "leur donneront. Dans un tel état, il n’y a aucune", "place pour une activité laborieuse, parce que son", "fruit est incertain ; et par conséquent aucune culture", "de la terre, aucune navigation, aucun usage de", "marchandises importées par mer, aucune construction", "convenable, aucun engin pour déplacer ou soulever des", "choses telles qu’elles requièrent beaucoup de force ;", "aucune connaissance de la surface de la terre, aucune", "mesure du temps ; pas d’arts, pas de lettres, pas de", "société, et, ce qui le pire de tout, la crainte", "permanente, et le danger de mort violente ; et la vie", "de l’homme est solitaire, indigente, dégoûtante,", "animale et brève.", "Il peut sembler étrange, à celui qui n’a pas bien pesé", "ces choses, que la Nature doive ainsi dissocier les", "hommes et les porter à s’attaquer et à se détruire les", "uns les autres ; et il est par conséquent possible", "que, ne se fiant pas à cette inférence faire à partir", "des passions, cet homme désire que la même chose soit", "confirmée par l’expérience. Qu’il s’observe donc lui-", "même quand, partant en voyage, il s’arme et cherche à", "être bien accompagné, quand, allant se coucher, il", "ferme ses portes à clef, quand même dans sa maison, il", "verrouille ses coffres ; et cela alors qu’il sait", "qu’il y a des lois et des agents de police armés pour", "venger tout tort qui lui sera fait.", "Quelle opinion a-t-il de ces compatriotes, quand il se", "promène armé, de ses concitoyens, quand il ferme ses", "portes à clef, de ses enfants et de ses domestiques,", "quand il verrouille ses coffres ? N’accuse-t-il pas là", "le genre humain autant que je le fais par des mots ?", "Mais aucun de nous deux n’accuse la nature de l’homme", "en cela. Les désirs et les autres passions de l’homme", "ne sont pas en eux-mêmes des péchés. Pas plus que ne", "le sont les actions qui procèdent de ces passions,", "jusqu’à ce qu’ils connaissent une loi qui les", "interdise, et ils ne peuvent pas connaître les lois", "tant qu’elles ne sont pas faites, et aucune loi ne", "peut être faite tant que les hommes ne se sont pas mis", "d’accord sur la personne qui la fera.", "Peut-être peut-on penser qu’il n’y a jamais eu une", "telle période, un état de guerre tel que celui-ci ; et", "je crois aussi que, de manière générale, il n’en a", "jamais été ainsi dans le monde entier. Mais il y a", "beaucoup d’endroits où les hommes vivent aujourd’hui", "ainsi. En effet, en de nombreux endroits de", "l’Amérique, les sauvages, à l’exception du", "gouvernement de petites familles, dont la concorde", "dépend de la concupiscence naturelle, n’ont pas du", "tout de gouvernement et vivent à ce jour d’une manière", "animale, comme je l’ai dit plus haut. Quoi qu’il en", "soit, on peut se rendre compte de ce que serait le", "genre de vie, s’il n’y avait pas de pouvoir commun à", "craindre, par celui où tombent ordinairement, lors", "d’une guerre civile, ceux qui ont précédemment vécu", "sous un gouvernement pacifique.", "Mais, bien qu’il n’y ait jamais eu un temps où les", "particuliers fussent en un état de guerre de chacun", "contre chacun, cependant, à tout moment, les rois et", "les personnes qui possèdent l’autorité souveraine, à", "cause de leur indépendance, se jalousent de façon", "permanente, et sont dans l’état et la position des", "gladiateurs, ayant leurs armes pointées, les yeux de", "chacun fixés sur l’autre, c’est-à-dire avec leurs", "forts, leurs garnisons, leurs canons aux frontières de", "leurs royaumes et leurs espions à demeure chez les", "voisins, ce qui est [là] une attitude de guerre. Mais,", "parce que, par là, ils protègent l’activité laborieuse", "de leurs sujets, il n’en découle pas cette misère qui", "accompagne la liberté des particuliers.", "De cette guerre de tout homme contre tout homme", "résulte aussi que rien ne peut être injuste. Les", "notions de bien et de mal, justice et injustice, n’ont", "pas leur place ici. Là où n’existe aucun pouvoir", "commun, il n’y a pas de loi. Là où n’existe pas de", "loi, il n’y a aucune injustice. La force et la ruse", "sont en temps de guerre les deux vertus cardinales. La", "justice et l’injustice ne sont aucunement des facultés", "du corps ou de l’esprit. Si elles l’étaient, elles", "pourraient se trouver en un homme qui serait seul dans", "le monde, aussi bien que ses sensations et ses", "passions. Ce sont des qualités relatives aux hommes en", "société, non dans la solitude.", "Il résulte aussi de ce même état qu’il ne s’y trouve", "pas de propriété, de domination, de distinction du", "mien et du tien, mais qu’il n’y a que ce que chaque", "homme peut obtenir, et aussi longtemps qu’il peut le", "conserver. Et en voilà assez pour le malheureux état", "où l’homme se trouve placé par simple nature,", "quoiqu’avec une possibilité d’en sortir, qui consiste", "en partie dans les passions, en partie dans sa raison.", "Les passions qui inclinent les hommes à la paix sont", "la crainte de la mort, le désir des choses nécessaires", "à une existence confortable, et un espoir de les", "obtenir par leur activité. Et la raison suggère les", "clauses de paix qui conviennent, sur lesquelles on", "peut amener les hommes à se mettre d’accord.", "Ces clauses sont celles qu’on appelle d’une autre", "manière les lois de nature, dont je vais parler plus", "particulièrement dans les deux chapitres suivants."], "mots": "Mots-clés : État de nature, Guerre de tous contre tous, Pouvoir commun.", "lire": "<p><b>Objet du texte.</b> Pourquoi l’État est-il nécessaire ? <b>Notion du programme.</b> L’État.</p><p><b>Connecteurs repérés.</b> « si… » (l.1), « cependant » (l.5), « car » (l.9), « pourtant » (l.37), « mais » (l.41), « c’est pourquoi » (l.47). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>État de nature</i> : condition des hommes sans pouvoir commun. ; <i>Guerre de tous contre tous</i> : disposition permanente au combat, même sans bataille. ; <i>Pouvoir commun</i> : autorité capable de tenir tous les hommes en respect : l’État.</p>", "these": "<p><b>Thèse.</b> Par nature, les hommes sont égaux et par conséquent rivaux, défiants et orgueilleux. Sans pouvoir commun, c’est la guerre de tous contre tous, et rien n’y est injuste. L’État s’impose pour sortir de cette condition.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « L’égalité naturelle » ; « D’où la rivalité » ; « Trois causes de querelle » ; « La guerre de tous contre tous » ; « Les conséquences » ; « Une issue ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-47", "idee": "L’égalité naturelle.", "args": "La nature a fait les hommes si égaux que le plus faible peut tuer le plus fort. De cette égalité résulte l’égalité d’espoir d’atteindre ses fins.", "lien": "Après avoir établi que les hommes sont naturellement égaux, Hobbes en tire les causes de la querelle : rivalité, défiance, fierté."}, {"l": "47-109", "idee": "D’où la rivalité ; Trois causes de querelle.", "args": "Deux hommes qui désirent la même chose deviennent ennemis. La défiance pousse à anticiper et à dominer le plus grand nombre possible. La rivalité (le gain), la défiance (la sécurité), la fierté (la réputation).", "lien": "Si ces trois causes jouent sans pouvoir commun, c’est la guerre de tous contre tous, avec ses conséquences : ni société, ni justice."}, {"l": "110-232", "idee": "La guerre de tous contre tous ; Les conséquences ; Une issue.", "args": "Sans pouvoir commun qui les maintienne dans la crainte, les hommes sont en guerre. La guerre est une disposition connue au combat, comme le mauvais temps. Pas de travail, pas de culture, pas d’arts, pas de société : la crainte permanente et la vie « solitaire, indigente, dégoûtante, animale et brève ». Rien n’est injuste : sans loi, pas d’injustice. Les passions (crainte de la mort, désir de confort) et la raison, qui suggère les lois de nature, inclinent à la paix.", "lien": "Cette condition misérable permet de comprendre la nécessité de l’État, vers lequel inclinent les passions et la raison."}], "concepts": [{"c": "État de nature", "s": "Condition des hommes sans pouvoir commun."}, {"c": "Guerre de tous contre tous", "s": "Disposition permanente au combat, même sans bataille."}, {"c": "Pouvoir commun", "s": "Autorité capable de tenir tous les hommes en respect : l’État."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que l’homme serait naturellement sociable, et que l’État ne serait qu’une contrainte ajoutée.</p><p><b>Le problème.</b> Pourquoi l’État est-il nécessaire ?</p><p><b>L’enjeu.</b> Cette thèse n’est pas évidente : comment des hommes égaux peuvent-ils devenir ennemis, et pourquoi cette guerre est-elle permanente même sans combat ?</p><p><b>Formule.</b> « On dit souvent que l’homme serait naturellement sociable, et que l’État ne serait qu’une contrainte ajoutée, mais Hobbes soutient : Par nature, les hommes sont égaux et par conséquent rivaux, défiants et orgueilleux. »</p><p><b>Discussion.</b> L’homme est-il un loup pour l’homme ? Hobbes décrit une nature humaine violente. Est-ce un fait ou une hypothèse ? (À comparer avec Nietzsche : l’État comme monstre.)</p>", "intro": ["On croit souvent que les hommes vivraient naturellement en paix, et que l’État ne serait qu’une contrainte ajoutée. Dans le <i>Léviathan</i>, Hobbes soutient au contraire que, sans pouvoir commun, c’est la guerre de tous contre tous.", "Hobbes soutient la thèse suivante : Par nature, les hommes sont égaux et par conséquent rivaux, défiants et orgueilleux. Sans pouvoir commun, c’est la guerre de tous contre tous, et rien n’y est injuste. L’État s’impose pour sortir de cette condition. Cette thèse n’est pas évidente : comment des hommes égaux peuvent-ils devenir ennemis, et pourquoi cette guerre est-elle permanente même sans combat ?", "Le texte avance en trois temps. Des lignes 1 à 47 : « L’égalité naturelle ». Des lignes 47 à 109 : « D’où la rivalité » ; « Trois causes de querelle ». Des lignes 110 à 232 : « La guerre de tous contre tous » ; « Les conséquences » ; « Une issue »."], "dev": [{"l": "1-47", "obj": "L’égalité naturelle.", "sp": ["<b>L’égalité naturelle.</b> La nature a fait les hommes si égaux que le plus faible peut tuer le plus fort. De cette égalité résulte l’égalité d’espoir d’atteindre ses fins."], "tr": "Après avoir établi que les hommes sont naturellement égaux, Hobbes en tire les causes de la querelle : rivalité, défiance, fierté."}, {"l": "47-109", "obj": "D’où la rivalité ; Trois causes de querelle.", "sp": ["<b>D’où la rivalité.</b> Deux hommes qui désirent la même chose deviennent ennemis. La défiance pousse à anticiper et à dominer le plus grand nombre possible.", "<b>Trois causes de querelle.</b> La rivalité (le gain), la défiance (la sécurité), la fierté (la réputation)."], "tr": "Si ces trois causes jouent sans pouvoir commun, c’est la guerre de tous contre tous, avec ses conséquences : ni société, ni justice."}, {"l": "110-232", "obj": "La guerre de tous contre tous ; Les conséquences ; Une issue.", "sp": ["<b>La guerre de tous contre tous.</b> Sans pouvoir commun qui les maintienne dans la crainte, les hommes sont en guerre. La guerre est une disposition connue au combat, comme le mauvais temps.", "<b>Les conséquences.</b> Pas de travail, pas de culture, pas d’arts, pas de société : la crainte permanente et la vie « solitaire, indigente, dégoûtante, animale et brève ». Rien n’est injuste : sans loi, pas d’injustice.", "<b>Une issue.</b> Les passions (crainte de la mort, désir de confort) et la raison, qui suggère les lois de nature, inclinent à la paix."], "tr": ""}], "concl": ["Le texte se demande : « Pourquoi l’État est-il nécessaire ? » Hobbes répond ainsi : Par nature, les hommes sont égaux et par conséquent rivaux, défiants et orgueilleux. Sans pouvoir commun, c’est la guerre de tous contre tous, et rien n’y est injuste. L’État s’impose pour sortir de cette condition.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « L’égalité naturelle » puis « D’où la rivalité ; Trois causes de querelle » puis « La guerre de tous contre tous ; Les conséquences ; Une issue ».", "On peut enfin discuter cette thèse. L’homme est-il un loup pour l’homme ? Hobbes décrit une nature humaine violente. Est-ce un fait ou une hypothèse ? (À comparer avec Nietzsche : l’État comme monstre.)"]}, {"id": "etat-nietzsche", "label": "Nietzsche : l’État, le plus froid des monstres froids", "theme": "L’État", "auteur": "Nietzsche", "oeuvre": "Ainsi parlait Zarathoustra", "fiche": "etat-nietzsche.html", "lignes": ["Il y a quelque part encore des peuples et des", "troupeaux, mais ce n’est pas chez nous, mes frères :", "chez nous, il y a des Etats.", "Etat ? Qu’est-ce, cela ? Allons ! Ouvrez les oreilles,", "je vais vous parler de la mort des peuples.", "L’Etat, c’est le plus froid de tous les monstres", "froids : il ment froidement et voici le mensonge qui", "rampe de sa bouche : « Moi, l’Etat, je suis le Peuple.", "»", "C’est un mensonge ! Ils étaient des créateurs, ceux", "qui créèrent les peuples et qui suspendirent au-dessus", "des peuples une foi et un amour : ainsi ils servaient", "la vie.", "Ce sont des destructeurs, ceux qui tendent des pièges", "au grand nombre et qui appellent cela un Etat : ils", "suspendent au-dessus d’eux un glaive et cent appétits.", "Partout où il y a encore du peuple, il ne comprend pas", "l’Etat et il le déteste comme le mauvais œil et une", "atteinte aux coutumes et aux lois.", "Je vous donne ce signe : chaque peuple a son langage", "du bien et du mal : son voisin ne le comprend pas. Il", "s’est inventé ce langage pour ses coutumes et ses", "lois.", "Mais l’Etat ment dans toutes les langues du bien et du", "mal ; et, dans tout ce qu’il dit, il ment – et tout ce", "qu’il a, il l’a volé.", "Tout en lui est faux ; il mord avec des dents volées,", "le hargneux. Fausses sont même ses entrailles."], "mots": "Mots-clés : Monstre froid, Peuple, Mensonge de l’État.", "lire": "<p><b>Objet du texte.</b> L’État exprime-t-il le peuple ? <b>Notion du programme.</b> L’État.</p><p><b>Connecteurs repérés.</b> « mais » (l.2), « ainsi » (l.12). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Monstre froid</i> : image d’un pouvoir impersonnel, sans amour. ; <i>Peuple</i> : communauté créée par une foi, des coutumes et un langage du bien et du mal. ; <i>Mensonge de l’État</i> : prétention de se confondre avec le peuple.</p>", "these": "<p><b>Thèse.</b> L’État est un mensonge : il se dit le peuple alors qu’il le détruit. Les peuples naissent d’une foi et d’un amour créateurs ; l’État est un piège tendu au grand nombre, qui ment dans toutes les langues du bien et du mal.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « Peuples et États » ; « Le monstre froid qui ment » ; « Créateurs et destructeurs » ; « Un peuple ne comprend pas l’État » ; « Un langage du bien et du mal ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-10", "idee": "Peuples et États ; Le monstre froid qui ment.", "args": "Il y a encore des peuples et des troupeaux ailleurs, mais chez nous il y a des États : l’État, c’est la mort des peuples. « Moi, l’État, je suis le Peuple » : voilà son mensonge.", "lien": "Après avoir opposé les peuples à l’État, Nietzsche montre qui crée le peuple et qui le détruit."}, {"l": "10-19", "idee": "Créateurs et destructeurs ; Un peuple ne comprend pas l’État.", "args": "Les créateurs ont fondé les peuples par une foi et un amour au service de la vie ; les destructeurs tendent des pièges au grand nombre et l’appellent État. Là où il y a encore du peuple, il déteste l’État comme une atteinte à ses coutumes et à ses lois.", "lien": "Si les créateurs et les destructeurs s’opposent, un peuple ne reconnaît pas l’État : il a son propre langage du bien et du mal."}, {"l": "20-28", "idee": "Un langage du bien et du mal.", "args": "Chaque peuple a son langage propre pour ses coutumes ; l’État ment dans toutes les langues et tout ce qu’il a, il l’a volé.", "lien": "L’État ment dans toutes les langues du bien et du mal : tout en lui est faux."}], "concepts": [{"c": "Monstre froid", "s": "Image d’un pouvoir impersonnel, sans amour."}, {"c": "Peuple", "s": "Communauté créée par une foi, des coutumes et un langage du bien et du mal."}, {"c": "Mensonge de l’État", "s": "Prétention de se confondre avec le peuple."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que l’État exprimerait le peuple et en serait le représentant.</p><p><b>Le problème.</b> L’État exprime-t-il le peuple ?</p><p><b>L’enjeu.</b> Le texte est un discours poétique : il faut en dégager l’argument sous les images (monstre froid, pièges, langues).</p><p><b>Formule.</b> « On dit souvent que l’État exprimerait le peuple et en serait le représentant, mais Nietzsche soutient : L’État est un mensonge : il se dit le peuple alors qu’il le détruit. »</p><p><b>Discussion.</b> Contre Hobbes ? Pour Hobbes l’État sauve de la guerre ; pour Nietzsche, il tue les peuples. Qui a raison ?</p>", "intro": ["On dit volontiers que l’État est l’expression du peuple, qu’il le représente et le protège. Dans <i>Ainsi parlait Zarathoustra</i>, Nietzsche soutient que l’État est un mensonge.", "Nietzsche soutient la thèse suivante : L’État est un mensonge : il se dit le peuple alors qu’il le détruit. Les peuples naissent d’une foi et d’un amour créateurs ; l’État est un piège tendu au grand nombre, qui ment dans toutes les langues du bien et du mal. Le texte est un discours poétique : il faut en dégager l’argument sous les images (monstre froid, pièges, langues).", "Le texte avance en trois temps. Des lignes 1 à 10 : « Peuples et États » ; « Le monstre froid qui ment ». Des lignes 10 à 19 : « Créateurs et destructeurs » ; « Un peuple ne comprend pas l’État ». Des lignes 20 à 28 : « Un langage du bien et du mal »."], "dev": [{"l": "1-10", "obj": "Peuples et États ; Le monstre froid qui ment.", "sp": ["<b>Peuples et États.</b> Il y a encore des peuples et des troupeaux ailleurs, mais chez nous il y a des États : l’État, c’est la mort des peuples.", "<b>Le monstre froid qui ment.</b> « Moi, l’État, je suis le Peuple » : voilà son mensonge."], "tr": "Après avoir opposé les peuples à l’État, Nietzsche montre qui crée le peuple et qui le détruit."}, {"l": "10-19", "obj": "Créateurs et destructeurs ; Un peuple ne comprend pas l’État.", "sp": ["<b>Créateurs et destructeurs.</b> Les créateurs ont fondé les peuples par une foi et un amour au service de la vie ; les destructeurs tendent des pièges au grand nombre et l’appellent État.", "<b>Un peuple ne comprend pas l’État.</b> Là où il y a encore du peuple, il déteste l’État comme une atteinte à ses coutumes et à ses lois."], "tr": "Si les créateurs et les destructeurs s’opposent, un peuple ne reconnaît pas l’État : il a son propre langage du bien et du mal."}, {"l": "20-28", "obj": "Un langage du bien et du mal.", "sp": ["<b>Un langage du bien et du mal.</b> Chaque peuple a son langage propre pour ses coutumes ; l’État ment dans toutes les langues et tout ce qu’il a, il l’a volé."], "tr": ""}], "concl": ["Le texte se demande : « L’État exprime-t-il le peuple ? » Nietzsche répond ainsi : L’État est un mensonge : il se dit le peuple alors qu’il le détruit. Les peuples naissent d’une foi et d’un amour créateurs ; l’État est un piège tendu au grand nombre, qui ment dans toutes les langues du bien et du mal.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « Peuples et États ; Le monstre froid qui ment » puis « Créateurs et destructeurs ; Un peuple ne comprend pas l’État » puis « Un langage du bien et du mal ».", "On peut enfin discuter cette thèse. Contre Hobbes ? Pour Hobbes l’État sauve de la guerre ; pour Nietzsche, il tue les peuples. Qui a raison ?"]}, {"id": "dem-alain", "label": "Alain, Propos (les citoyens contre le pouvoir)", "theme": "La démocratie", "auteur": "Alain", "oeuvre": "Propos, « Les citoyens contre le pouvoir »", "fiche": "textes-democratie.html", "lignes": ["Voter, ce n’est pas précisément un des droits de", "l’Homme ; on vivrait très bien sans voter, si l’on", "avait la sûreté, l’égalité, la liberté. Le vote n’est", "qu’un moyen de conserver tous ces biens. L’expérience", "a fait voir cent fois qu’une élite gouvernante,", "qu’elle gouverne d’après l’hérédité, ou par la science", "acquise, arrive très vite à priver les citoyens de", "toute liberté, si le peuple n’exerce pas un pouvoir de", "contrôle, de blâme et enfin de renvoi. Quand je vote,", "je n’exerce pas un droit, je défends tous mes droits.", "Il ne s’agit donc pas de savoir si mon vote est perdu", "ou non, mais bien de savoir si le résultat cherché est", "atteint, c’est-à-dire si les pouvoirs sont contrôlés,", "blâmés et enfin détrônés dès qu’ils méconnaissent les", "droits des citoyens.", "On conçoit très bien un système politique, par exemple", "le plébiscite, où chaque citoyen votera une fois", "librement, sans que ses droits soient pour cela bien", "gardés. Aussi je ne tiens pas tant à choisir", "effectivement, et pour ma part, tel ou tel maître,", "qu’à être assuré que le maître n’est pas le maître,", "mais seulement le serviteur du peuple. C’est dire que", "je ne changerai pas mes droits réels pour un droit", "fictif."], "mots": "Mots-clés : Droits de l’homme, Contrôle des pouvoirs, Plébiscite.", "lire": "<p><b>Objet du texte.</b> À quoi sert de voter ? <b>Notion du programme.</b> La démocratie.</p><p><b>Connecteurs repérés.</b> « si… » (l.2), « donc » (l.11), « mais » (l.12). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Droits de l’homme</i> : sûreté, égalité, liberté que le vote sert à défendre. ; <i>Contrôle des pouvoirs</i> : faculté de blâmer et de détrôner un pouvoir qui méconnaît les droits. ; <i>Plébiscite</i> : vote par oui ou par non sur un homme ou un projet, sans contrôle ultérieur.</p>", "these": "<p><b>Thèse.</b> Voter n’est pas un droit parmi d’autres : c’est le moyen de défendre tous ses droits en contrôlant les pouvoirs.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « Le vote, simple moyen » ; « L’élite qui prive de liberté » ; « L’enjeu : le contrôle des pouvoirs » ; « Le plébiscite et le droit fictif ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-9", "idee": "Le vote, simple moyen ; L’élite qui prive de liberté.", "args": "Le vote n’est qu’un moyen de conserver la sûreté, l’égalité et la liberté : on pourrait vivre sans voter si on les avait. Une élite gouvernante, héréditaire ou savante, prive vite les citoyens de liberté si le peuple ne peut contrôler, blâmer et renvoyer.", "lien": "Après avoir posé que le vote n’est qu’un moyen, et que l’absence de contrôle livre aux élites, Alain précise l’enjeu : que les pouvoirs soient contrôlés."}, {"l": "9-15", "idee": "L’enjeu : le contrôle des pouvoirs.", "args": "L’enjeu n’est pas qu’un vote soit « perdu » ou non, mais que les pouvoirs soient contrôlés et détrônés dès qu’ils méconnaissent les droits.", "lien": "Si l’enjeu est le contrôle des pouvoirs, un vote libre peut ne pas suffire : c’est le cas du plébiscite."}, {"l": "16-24", "idee": "Le plébiscite et le droit fictif.", "args": "Un système comme le plébiscite peut laisser voter librement sans garder les droits : mieux vaut être assuré que le maître est le serviteur du peuple que choisir son maître.", "lien": "Mieux vaut être assuré que le maître n’est que le serviteur du peuple que choisir son maître : c’est la thèse."}], "concepts": [{"c": "Droits de l’homme", "s": "Sûreté, égalité, liberté que le vote sert à défendre."}, {"c": "Contrôle des pouvoirs", "s": "Faculté de blâmer et de détrôner un pouvoir qui méconnaît les droits."}, {"c": "Plébiscite", "s": "Vote par oui ou par non sur un homme ou un projet, sans contrôle ultérieur."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que voter serait un droit comme un autre, qu’il faudrait exercer pour choisir ses maîtres.</p><p><b>Le problème.</b> À quoi sert de voter ?</p><p><b>L’enjeu.</b> Cette thèse n’est pas évidente : si voter n’est qu’un moyen, que devient la valeur du vote lui-même ?</p><p><b>Formule.</b> « On dit souvent que voter serait un droit comme un autre, qu’il faudrait exercer pour choisir ses maîtres, mais Alain soutient : Voter n’est pas un droit parmi d’autres : c’est le moyen de défendre tous ses droits en contrôlant les pouvoirs. »</p><p><b>Discussion.</b> Le vote suffit-il à contrôler le pouvoir ? Voter tous les cinq ans fait-il du citoyen le contrôleur de ses gouvernants ? (À comparer avec Tocqueville.)</p>", "intro": ["On dit souvent que voter est un droit, ou un devoir, par lequel on choisit ses dirigeants. Dans ses <i>Propos</i>, Alain soutient que voter n’est pas un droit parmi d’autres : c’est le moyen de défendre tous les autres.", "Alain soutient la thèse suivante : Voter n’est pas un droit parmi d’autres : c’est le moyen de défendre tous ses droits en contrôlant les pouvoirs. Cette thèse n’est pas évidente : si voter n’est qu’un moyen, que devient la valeur du vote lui-même ?", "Le texte avance en trois temps. Des lignes 1 à 9 : « Le vote, simple moyen » ; « L’élite qui prive de liberté ». Des lignes 9 à 15 : « L’enjeu : le contrôle des pouvoirs ». Des lignes 16 à 24 : « Le plébiscite et le droit fictif »."], "dev": [{"l": "1-9", "obj": "Le vote, simple moyen ; L’élite qui prive de liberté.", "sp": ["<b>Le vote, simple moyen.</b> Le vote n’est qu’un moyen de conserver la sûreté, l’égalité et la liberté : on pourrait vivre sans voter si on les avait.", "<b>L’élite qui prive de liberté.</b> Une élite gouvernante, héréditaire ou savante, prive vite les citoyens de liberté si le peuple ne peut contrôler, blâmer et renvoyer."], "tr": "Après avoir posé que le vote n’est qu’un moyen, et que l’absence de contrôle livre aux élites, Alain précise l’enjeu : que les pouvoirs soient contrôlés."}, {"l": "9-15", "obj": "L’enjeu : le contrôle des pouvoirs.", "sp": ["<b>L’enjeu : le contrôle des pouvoirs.</b> L’enjeu n’est pas qu’un vote soit « perdu » ou non, mais que les pouvoirs soient contrôlés et détrônés dès qu’ils méconnaissent les droits."], "tr": "Si l’enjeu est le contrôle des pouvoirs, un vote libre peut ne pas suffire : c’est le cas du plébiscite."}, {"l": "16-24", "obj": "Le plébiscite et le droit fictif.", "sp": ["<b>Le plébiscite et le droit fictif.</b> Un système comme le plébiscite peut laisser voter librement sans garder les droits : mieux vaut être assuré que le maître est le serviteur du peuple que choisir son maître."], "tr": ""}], "concl": ["Le texte se demande : « À quoi sert de voter ? » Alain répond ainsi : Voter n’est pas un droit parmi d’autres : c’est le moyen de défendre tous ses droits en contrôlant les pouvoirs.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « Le vote, simple moyen ; L’élite qui prive de liberté » puis « L’enjeu : le contrôle des pouvoirs » puis « Le plébiscite et le droit fictif ».", "On peut enfin discuter cette thèse. Le vote suffit-il à contrôler le pouvoir ? Voter tous les cinq ans fait-il du citoyen le contrôleur de ses gouvernants ? (À comparer avec Tocqueville.)"]}, {"id": "dem-aristote", "label": "Aristote, Les Politiques (principes de la démocratie)", "theme": "La démocratie", "auteur": "Aristote", "oeuvre": "Les Politiques", "fiche": "textes-democratie.html", "lignes": ["Le principe de base de la constitution démocratique,", "c’est la liberté (c’est, en effet, ce qu’on a coutume", "de dire, parce que c’est seulement dans une telle", "constitution que les citoyens ont la liberté en", "partage ; c’est à cela, en effet, que tend, dit-on,", "toute démocratie), et l’une des formes de la liberté,", "c’est d’être tour à tour gouverné et gouvernant. En", "effet, le juste selon la constitution démocratique,", "c’est que chacun ait une part égale numériquement et", "non selon son mérite, et avec une telle conception du", "juste, il est nécessaire que la masse soit souveraine,", "et ce qui semble bon à la majorité sera quelque chose", "d’indépassable, et c’est cela qui sera le juste, car", "ils disent qu’il faut que chaque citoyen ait une part", "égale. De sorte que dans les démocraties il se trouve", "que les gens modestes ont la souveraineté sur les gens", "aisés; ils sont en effet plus nombreux, et c’est", "l’opinion de la majorité qui est souveraine. [...] Ces", "bases étant posées, c’est-à-dire le principe de la", "démocratie étant celui que l’on vient de dire, voici", "les traits caractéristiques du régime populaire :", "choix de tous les magistrats parmi tous les citoyens ;", "gouvernement de chacun par tous et de tous par chacun", "à tour de rôle ; tirage au sort des magistratures,", "soit de toutes, soit de toutes celles qui ne demandent", "ni expérience ni savoir ; magistratures ne dépendant", "d’aucun cens ou d’un cens très petit ; impossibilité", "pour un même citoyen d’exercer en dehors des fonctions", "militaires, deux fois la même magistrature, ou", "seulement un petit nombre de fois et pour toutes", "celles pour lesquelles c’est possible ; fonctions", "judiciaires ouvertes à tous, tous jugeant de tout, ou", "des causes les plus nombreuses, les plus importantes", "et les plus décisives, par exemple la vérification des", "comptes, les affaires politiques, les contrats privés", "; souveraineté de l’assemblée dans tous les domaines,", "aucune magistrature ne l’emportant en aucun domaine,", "ou seulement en très peu de domaines, ou souveraineté", "de l’assemblée sur les affaires les plus importantes.", "[...] Telles sont donc les caractéristiques communes", "aux démocraties."], "mots": "Mots-clés : Liberté démocratique, Justice démocratique, Tirage au sort.", "lire": "<p><b>Objet du texte.</b> Sur quels principes repose la démocratie ? <b>Notion du programme.</b> La démocratie.</p><p><b>Connecteurs repérés.</b> « en effet » (l.2), « parce que » (l.3), « car » (l.13), « donc » (l.40). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Liberté démocratique</i> : être tour à tour gouverné et gouvernant. ; <i>Justice démocratique</i> : une part égale numériquement, et non selon le mérite. ; <i>Tirage au sort</i> : procédé de désignation des magistrats ouvert à tous les citoyens.</p>", "these": "<p><b>Thèse.</b> Aristote pose la liberté comme principe de la démocratie, en déduit sa conception du juste, puis les institutions qui en découlent.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « Le principe : la liberté » ; « La conception du juste » ; « La conséquence : le pouvoir de la majorité » ; « Les institutions ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-7", "idee": "Le principe : la liberté.", "args": "La liberté, dont l’une des formes est d’être tour à tour gouverné et gouvernant.", "lien": "Après avoir posé la liberté comme principe de la démocratie, Aristote en déduit la conception du juste (égalité numérique) et le pouvoir de la majorité."}, {"l": "7-18", "idee": "La conception du juste ; La conséquence : le pouvoir de la majorité.", "args": "Chacun a une part égale numériquement, et non selon son mérite. La masse est souveraine et l’opinion de la majorité fait loi, si bien que les gens modestes, plus nombreux, l’emportent sur les gens aisés.", "lien": "De ce principe et de cette conception découlent des institutions précises : magistrats tirés au sort, tribunaux et assemblée."}, {"l": "18-41", "idee": "Les institutions.", "args": "Magistrats choisis parmi tous les citoyens, souvent tirés au sort, sans condition de cens, tribunaux ouverts à tous et assemblée souveraine.", "lien": "Les institutions démocratiques sont ainsi la mise en œuvre de la liberté comme principe."}], "concepts": [{"c": "Liberté démocratique", "s": "Être tour à tour gouverné et gouvernant."}, {"c": "Justice démocratique", "s": "Une part égale numériquement, et non selon le mérite."}, {"c": "Tirage au sort", "s": "Procédé de désignation des magistrats ouvert à tous les citoyens."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que la démocratie se définirait seulement par le vote ou le gouvernement du peuple.</p><p><b>Le problème.</b> Sur quels principes repose la démocratie ?</p><p><b>L’enjeu.</b> Le texte expose plus qu’il ne défend : il faut montrer comment Aristote déduit les institutions d’un principe unique, la liberté.</p><p><b>Formule.</b> « On dit souvent que la démocratie se définirait seulement par le vote ou le gouvernement du peuple, mais Aristote soutient : Aristote pose la liberté comme principe de la démocratie, en déduit sa conception du juste, puis les institutions qui en découlent. »</p><p><b>Discussion.</b> Égalité arithmétique ou selon le mérite ? Faut-il traiter tous les citoyens de la même façon, ou selon leurs mérites ? (À comparer avec Platon.)</p>", "intro": ["On définit souvent la démocratie comme le gouvernement du peuple, sans se demander sur quel principe elle repose. Dans <i>Les Politiques</i>, Aristote expose ce principe et ses conséquences.", "Aristote soutient la thèse suivante : Aristote pose la liberté comme principe de la démocratie, en déduit sa conception du juste, puis les institutions qui en découlent. Le texte expose plus qu’il ne défend : il faut montrer comment Aristote déduit les institutions d’un principe unique, la liberté.", "Le texte avance en trois temps. Des lignes 1 à 7 : « Le principe : la liberté ». Des lignes 7 à 18 : « La conception du juste » ; « La conséquence : le pouvoir de la majorité ». Des lignes 18 à 41 : « Les institutions »."], "dev": [{"l": "1-7", "obj": "Le principe : la liberté.", "sp": ["<b>Le principe : la liberté.</b> La liberté, dont l’une des formes est d’être tour à tour gouverné et gouvernant."], "tr": "Après avoir posé la liberté comme principe de la démocratie, Aristote en déduit la conception du juste (égalité numérique) et le pouvoir de la majorité."}, {"l": "7-18", "obj": "La conception du juste ; La conséquence : le pouvoir de la majorité.", "sp": ["<b>La conception du juste.</b> Chacun a une part égale numériquement, et non selon son mérite.", "<b>La conséquence : le pouvoir de la majorité.</b> La masse est souveraine et l’opinion de la majorité fait loi, si bien que les gens modestes, plus nombreux, l’emportent sur les gens aisés."], "tr": "De ce principe et de cette conception découlent des institutions précises : magistrats tirés au sort, tribunaux et assemblée."}, {"l": "18-41", "obj": "Les institutions.", "sp": ["<b>Les institutions.</b> Magistrats choisis parmi tous les citoyens, souvent tirés au sort, sans condition de cens, tribunaux ouverts à tous et assemblée souveraine."], "tr": ""}], "concl": ["Le texte se demande : « Sur quels principes repose la démocratie ? » Aristote répond ainsi : Aristote pose la liberté comme principe de la démocratie, en déduit sa conception du juste, puis les institutions qui en découlent.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « Le principe : la liberté » puis « La conception du juste ; La conséquence : le pouvoir de la majorité » puis « Les institutions ».", "On peut enfin discuter cette thèse. Égalité arithmétique ou selon le mérite ? Faut-il traiter tous les citoyens de la même façon, ou selon leurs mérites ? (À comparer avec Platon.)"]}, {"id": "dem-bergson", "label": "Bergson, Les deux sources de la morale et de la religion (la démocratie)", "theme": "La démocratie", "auteur": "Bergson", "oeuvre": "Les deux sources de la morale et de la religion", "fiche": "textes-democratie.html", "lignes": ["On comprend donc que l’humanité ne soit venue à la", "démocratie que sur le tard (car ce furent de fausses", "démocraties que les cités antiques, bâties sur", "l’esclavage, débarrassées par cette iniquité", "fondamentale des plus gros et des plus angoissants", "problèmes). De toutes les conceptions politiques c’est", "en effet la plus éloignée de la nature, la seule qui", "transcende, en intention au moins, les conditions de", "la « société close ». Elle attribue à l’homme des", "droits inviolables. Ces droits, pour rester inviolés,", "exigent de la part de tous une fidélité inaltérable au", "devoir. Elle prend donc pour matière un homme idéal,", "respectueux des autres comme de lui-même, s’insérant", "dans des obligations qu’il tient pour absolues,", "coïncidant si bien avec cet absolu qu’on ne peut plus", "dire si c’est le devoir qui confère le droit ou le", "droit qui impose le devoir. Le citoyen ainsi défini", "est à la fois « législateur et sujet », pour parler", "comme Kant. L’ensemble des citoyens, c’est-à-dire le", "peuple, est donc souverain. Telle est la démocratie", "théorique. Elle proclame la liberté, réclame", "l’égalité, et réconcilie ces deux sœurs ennemies en", "leur rappelant qu’elles sont sœurs, en mettant au-", "dessus de tout la fraternité. Qu’on prenne de ce biais", "la devise républicaine, on trouvera que le troisième", "terme lève la contradiction si souvent signalée entre", "les deux autres, et que la fraternité est l’essentiel", ": ce qui permettrait de dire que la démocratie est", "d’essence évangélique, et qu’elle a pour moteur", "l’amour."], "mots": "Mots-clés : Société close, Législateur et sujet, Fraternité.", "lire": "<p><b>Objet du texte.</b> Qu’est-ce qui fait la nature de la démocratie ? <b>Notion du programme.</b> La démocratie.</p><p><b>Connecteurs repérés.</b> « donc » (l.1), « car » (l.2), « en effet » (l.7), « si… » (l.15), « ainsi » (l.17). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Société close</i> : société fermée sur elle-même, fondée sur la nature et l’habitude. ; <i>Législateur et sujet</i> : le citoyen fait la loi et s’y soumet. ; <i>Fraternité</i> : ce qui réconcilie liberté et égalité, selon Bergson.</p>", "these": "<p><b>Thèse.</b> La démocratie est la plus éloignée de la nature : un idéal d’hommes libres et égaux, réconciliés par la fraternité, qui a pour moteur l’amour.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « Venue tard » ; « Elle transcende la société close » ; « Un homme idéal » ; « Liberté, égalité, fraternité ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-9", "idee": "Venue tard ; Elle transcende la société close.", "args": "Elle est venue tard : les cités antiques, bâties sur l’esclavage, étaient de fausses démocraties. Elle transcende, au moins en intention, la « société close » : elle donne à l’homme des droits inviolables, qui exigent de tous une fidélité au devoir.", "lien": "Après avoir montré que la démocratie est venue tard et qu’elle transcende la société close, Bergson décrit l’homme idéal qu’elle suppose."}, {"l": "9-20", "idee": "Un homme idéal.", "args": "Elle suppose un homme idéal, respectueux des autres comme de lui-même : le citoyen est « législateur et sujet », et le peuple est souverain.", "lien": "Cet homme idéal, à la fois législateur et sujet, justifie la souveraineté du peuple ; il reste à montrer comment la démocratie concilie liberté et égalité."}, {"l": "20-30", "idee": "Liberté, égalité, fraternité.", "args": "Elle proclame la liberté, réclame l’égalité et les réconcilie par la fraternité, qui est l’essentiel : d’où son essence « évangélique ».", "lien": "Elle les réconcilie par la fraternité : son essence est évangélique et son moteur l’amour."}], "concepts": [{"c": "Société close", "s": "Société fermée sur elle-même, fondée sur la nature et l’habitude."}, {"c": "Législateur et sujet", "s": "Le citoyen fait la loi et s’y soumet."}, {"c": "Fraternité", "s": "Ce qui réconcilie liberté et égalité, selon Bergson."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que la démocratie serait un régime naturel, qui s’imposerait par simple raison.</p><p><b>Le problème.</b> Qu’est-ce qui fait la nature de la démocratie ?</p><p><b>L’enjeu.</b> Cette thèse est paradoxale : comment un régime fondé sur l’égalité peut-il avoir pour moteur l’amour ?</p><p><b>Formule.</b> « On dit souvent que la démocratie serait un régime naturel, qui s’imposerait par simple raison, mais Bergson soutient : La démocratie est la plus éloignée de la nature : un idéal d’hommes libres et égaux, réconciliés par la fraternité, qui a pour moteur l’amour. »</p><p><b>Discussion.</b> La démocratie est-elle un idéal ou un régime réel ? Le texte décrit une « démocratie théorique » : quel écart avec les démocraties existantes ? (À comparer avec Platon et Tocqueville.)</p>", "intro": ["On croit souvent que la démocratie est un régime naturel, qui s’impose par la raison. Dans <i>Les deux sources de la morale et de la religion</i>, Bergson soutient au contraire qu’elle est la plus éloignée de la nature.", "Bergson soutient la thèse suivante : La démocratie est la plus éloignée de la nature : un idéal d’hommes libres et égaux, réconciliés par la fraternité, qui a pour moteur l’amour. Cette thèse est paradoxale : comment un régime fondé sur l’égalité peut-il avoir pour moteur l’amour ?", "Le texte avance en trois temps. Des lignes 1 à 9 : « Venue tard » ; « Elle transcende la société close ». Des lignes 9 à 20 : « Un homme idéal ». Des lignes 20 à 30 : « Liberté, égalité, fraternité »."], "dev": [{"l": "1-9", "obj": "Venue tard ; Elle transcende la société close.", "sp": ["<b>Venue tard.</b> Elle est venue tard : les cités antiques, bâties sur l’esclavage, étaient de fausses démocraties.", "<b>Elle transcende la société close.</b> Elle transcende, au moins en intention, la « société close » : elle donne à l’homme des droits inviolables, qui exigent de tous une fidélité au devoir."], "tr": "Après avoir montré que la démocratie est venue tard et qu’elle transcende la société close, Bergson décrit l’homme idéal qu’elle suppose."}, {"l": "9-20", "obj": "Un homme idéal.", "sp": ["<b>Un homme idéal.</b> Elle suppose un homme idéal, respectueux des autres comme de lui-même : le citoyen est « législateur et sujet », et le peuple est souverain."], "tr": "Cet homme idéal, à la fois législateur et sujet, justifie la souveraineté du peuple ; il reste à montrer comment la démocratie concilie liberté et égalité."}, {"l": "20-30", "obj": "Liberté, égalité, fraternité.", "sp": ["<b>Liberté, égalité, fraternité.</b> Elle proclame la liberté, réclame l’égalité et les réconcilie par la fraternité, qui est l’essentiel : d’où son essence « évangélique »."], "tr": ""}], "concl": ["Le texte se demande : « Qu’est-ce qui fait la nature de la démocratie ? » Bergson répond ainsi : La démocratie est la plus éloignée de la nature : un idéal d’hommes libres et égaux, réconciliés par la fraternité, qui a pour moteur l’amour.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « Venue tard ; Elle transcende la société close » puis « Un homme idéal » puis « Liberté, égalité, fraternité ».", "On peut enfin discuter cette thèse. La démocratie est-elle un idéal ou un régime réel ? Le texte décrit une « démocratie théorique » : quel écart avec les démocraties existantes ? (À comparer avec Platon et Tocqueville.)"]}, {"id": "dem-herodote", "label": "Hérodote, Histoire (la démocratie contre la monarchie)", "theme": "La démocratie", "auteur": "Hérodote", "oeuvre": "Histoire, III", "fiche": "textes-democratie.html", "lignes": ["Otanès [nom attribué régulièrement par Hérodote]", "exhorta les Perses à mettre l’autorité en commun.", "« Je crois, dit-il, que l’on ne doit plus désormais", "confier l’administration de l’État à un seul homme, le", "gouvernement monarchique n’étant ni agréable ni bon.", "Vous savez à quel point d’insolence en était venu", "Cambyse [roi perse et pharaon d’Egypte, successeur de", "Cyrus le Grand, 6ème siècle avant JC] , et vous avez", "éprouvé vous-mêmes celle du mage. Comment, en effet,", "la monarchie pourrait-elle être un bon gouvernement ?", "Le monarque fait ce qu’il veut, sans rendre compte de", "sa conduite. L’homme le plus vertueux, élevé à cette", "haute dignité, perdrait bientôt toutes ses bonnes", "qualités. Car l’envie naît avec tous les hommes, et", "les avantages dont jouit un monarque le portent à", "l’insolence. Or, quiconque a ces deux vices a tous les", "vices ensemble : tantôt il commet, dans l’ivresse de", "l’insolence, les actions les plus atroces, et tantôt", "par envie. Un roi devrait être exempt d’envie, du", "moins parce qu’il jouit de toutes sortes de biens ;", "mais c’est tout le contraire, et ses sujets ne le", "savent que trop par expérience. Il hait les plus", "honnêtes gens, et semble chagrin de ce qu’ils existent", "encore. Il n’est bien qu’avec les plus méchants. Il", "prête volontiers l’oreille à la calomnie ; il", "accueille les délateurs : mais ce qu’il y a de plus", "bizarre, si on le loue modestement, il s’en offense ;", "si, au contraire, on le recherche avec empressement,", "il en est pareillement blessé, et ne l’impute qu’à la", "plus basse flatterie ; enfin, et c’est le plus", "terrible de tous les inconvénients, il renverse les", "lois de la patrie, il attaque l’honneur des femmes, et", "fait mourir qui bon lui semble, sans observer aucune", "formalité. Il n’en est pas de même du gouvernement", "démocratique. Premièrement on l’appelle isonomie ;", "c’est le plus beau de tous les noms : secondement, il", "ne s’y commet aucun de ces désordres qui sont", "inséparables de l’État monarchique. Le magistrat s’y", "élit au sort ; il est comptable de son administration,", "et toutes les délibérations s’y font en commun. Je", "suis donc d’avis d’abolir le gouvernement monarchique,", "et d’établir le démocratique, parce que tout se trouve", "dans le peuple. » Telle fut l’opinion d’Otanès."], "mots": "Mots-clés : Monarchie, Isonomie, Comptable.", "lire": "<p><b>Objet du texte.</b> Pourquoi préférer la démocratie à la monarchie ? <b>Notion du programme.</b> La démocratie.</p><p><b>Connecteurs repérés.</b> « en effet » (l.9), « car » (l.14), « or » (l.16), « mais » (l.21), « si… » (l.27), « donc » (l.41). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Monarchie</i> : gouvernement d’un seul. ; <i>Isonomie</i> : égalité de tous devant la loi : les magistrats sont tirés au sort et comptables de leur administration. ; <i>Comptable</i> : qui doit rendre compte de sa conduite.</p>", "these": "<p><b>Thèse.</b> Otanès propose d’abolir la monarchie pour établir la démocratie : le pouvoir d’un seul n’est soumis à aucun contrôle et corrompt.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « Le monarque sans contrôle » ; « Le pouvoir corrompt » ; « Un danger pour ses sujets » ; « L’isonomie ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-34", "idee": "Le monarque sans contrôle ; Le pouvoir corrompt ; Un danger pour ses sujets.", "args": "Le monarque fait ce qu’il veut, sans rendre de comptes à personne. Le pouvoir corrompt même le plus vertueux : les avantages du roi nourrissent l’insolence et l’envie, d’où naissent tous les vices. Le roi hait les honnêtes gens, écoute les délateurs, renverse les lois et fait mourir qui il veut, sans formalité.", "lien": "Après avoir montré que le monarque, sans contrôle, se corrompt et devient dangereux pour ses sujets, Otanès présente le régime qu’il propose."}, {"l": "34-43", "idee": "L’isonomie.", "args": "La démocratie tire les magistrats au sort, les rend comptables de leur administration et délibère en commun : « tout se trouve dans le peuple ».", "lien": "Cette démocratie, ou isonomie, est la conséquence du raisonnement : le pouvoir doit rendre des comptes, et tout se trouve dans le peuple."}], "concepts": [{"c": "Monarchie", "s": "Gouvernement d’un seul."}, {"c": "Isonomie", "s": "Égalité de tous devant la loi : les magistrats sont tirés au sort et comptables de leur administration."}, {"c": "Comptable", "s": "Qui doit rendre compte de sa conduite."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que la monarchie serait un bon gouvernement, car un seul homme vertueux gouvernerait mieux.</p><p><b>Le problème.</b> Pourquoi préférer la démocratie à la monarchie ?</p><p><b>L’enjeu.</b> Cette thèse n’est pas évidente : pourquoi un seul homme vertueux serait-il un danger, et pourquoi le gouvernement du peuple serait-il préférable ?</p><p><b>Formule.</b> « On dit souvent que la monarchie serait un bon gouvernement, car un seul homme vertueux gouvernerait mieux, mais Hérodote soutient : Otanès propose d’abolir la monarchie pour établir la démocratie : le pouvoir d’un seul n’est soumis à aucun contrôle et corrompt. »</p><p><b>Discussion.</b> Le peuple est-il incorruptible ? Le pouvoir collectif échappe-t-il à l’insolence et à l’envie ? (À comparer avec Platon et Tocqueville.)</p>", "intro": ["On croit souvent qu’un seul homme, s’il est vertueux, gouvernerait mieux qu’une assemblée. Dans l’<i>Histoire</i> d’Hérodote, Otanès soutient au contraire qu’il faut abolir la monarchie et établir la démocratie.", "Hérodote soutient la thèse suivante : Otanès propose d’abolir la monarchie pour établir la démocratie : le pouvoir d’un seul n’est soumis à aucun contrôle et corrompt. Cette thèse n’est pas évidente : pourquoi un seul homme vertueux serait-il un danger, et pourquoi le gouvernement du peuple serait-il préférable ?", "Le texte avance en deux temps. Des lignes 1 à 34 : « Le monarque sans contrôle » ; « Le pouvoir corrompt » ; « Un danger pour ses sujets ». Des lignes 34 à 43 : « L’isonomie »."], "dev": [{"l": "1-34", "obj": "Le monarque sans contrôle ; Le pouvoir corrompt ; Un danger pour ses sujets.", "sp": ["<b>Le monarque sans contrôle.</b> Le monarque fait ce qu’il veut, sans rendre de comptes à personne.", "<b>Le pouvoir corrompt.</b> Le pouvoir corrompt même le plus vertueux : les avantages du roi nourrissent l’insolence et l’envie, d’où naissent tous les vices.", "<b>Un danger pour ses sujets.</b> Le roi hait les honnêtes gens, écoute les délateurs, renverse les lois et fait mourir qui il veut, sans formalité."], "tr": "Après avoir montré que le monarque, sans contrôle, se corrompt et devient dangereux pour ses sujets, Otanès présente le régime qu’il propose."}, {"l": "34-43", "obj": "L’isonomie.", "sp": ["<b>L’isonomie.</b> La démocratie tire les magistrats au sort, les rend comptables de leur administration et délibère en commun : « tout se trouve dans le peuple »."], "tr": ""}], "concl": ["Le texte se demande : « Pourquoi préférer la démocratie à la monarchie ? » Hérodote répond ainsi : Otanès propose d’abolir la monarchie pour établir la démocratie : le pouvoir d’un seul n’est soumis à aucun contrôle et corrompt.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « Le monarque sans contrôle ; Le pouvoir corrompt ; Un danger pour ses sujets » puis « L’isonomie ».", "On peut enfin discuter cette thèse. Le peuple est-il incorruptible ? Le pouvoir collectif échappe-t-il à l’insolence et à l’envie ? (À comparer avec Platon et Tocqueville.)"]}, {"id": "dem-platon", "label": "Platon, La République (le régime démocratique)", "theme": "La démocratie", "auteur": "Platon", "oeuvre": "La République, VIII", "fiche": "textes-democratie.html", "lignes": ["Eh bien ! A mon avis, la démocratie apparaît lorsque", "les pauvres, ayant emporté la victoire sur les riches,", "massacrent les uns, bannissent les autres, et", "partagent également avec ceux qui restent le", "gouvernement et les charges publiques ; et le plus", "souvent ces charges sont tirées au sort. (…)", "Maintenant, voyons de quelle manière ces gens-là", "s’administrent, et ce que peut être une telle", "constitution. Aussi bien est-il que l’individu qui lui", "ressemble nous découvrira les traits de l’homme", "démocratique. En premier lieu, n’est-il pas vrai", "qu’ils sont libres, que la cité déborde de liberté et", "de franc-parler, et qu’on y a licence de faire tout ce", "qu’on veut ? Or il est clair que partout où règne", "cette licence chacun organise sa vie comme il lui", "plaît. On trouvera donc, j’imagine, des hommes de", "toute sorte dans ce gouvernement plus que dans aucun", "autre. Ainsi, il y a chance qu’il soit le plus beau de", "tous. Comme un vêtement bigarré qui offre toute la", "variété des couleurs, offrant toute la variété des", "caractères, il pourra paraître d’une beauté achevée.", "Et peut-être beaucoup de gens, pareils aux enfants et", "aux femmes qui admirent les bigarrures, décideront-ils", "qu’il est le plus beau. Et c’est là qu’il est commode", "de chercher une constitution, parce qu’on les y trouve", "toutes, grâce à la licence qui y règne ; et il semble", "que celui qui veut fonder une cité, ce que nous", "faisions tout à l’heure, soit obligé de se rendre dans", "un Etat démocratique, comme dans un bazar de", "constitutions, pour choisir celle qu’il préfère, et", "d’après ce modèle, réaliser ensuite son projet. Dans", "cet Etat, on n’est pas contraint de commander si l’on", "en est capable, ni d’obéir si l’on ne veut pas, non", "plus que de faire la guerre quand les autres la font,", "ni de rester en paix quand les autres y restent, si", "l’on ne désire point la paix ; d’autre part, la loi", "vous interdit-elle d’être magistrat ou juge, vous n’en", "pouvez pas moins exercer ces fonctions, si la", "fantaisie vous en prend. N’est-ce pas une condition", "divine et délicieuse au premier abord ? (…) Tels sont", "les avantages de la démocratie. C’est un gouvernement", "agréable, anarchique et bigarré, qui dispense une", "sorte d’égalité aussi bien à ce qui est inégal qu’à ce", "qui est égal"], "mots": "Mots-clés : Démocratie (selon Platon), Licence, Ironie.", "lire": "<p><b>Objet du texte.</b> Que vaut la démocratie, régime de la liberté ? <b>Notion du programme.</b> La démocratie.</p><p><b>Connecteurs repérés.</b> « or » (l.14), « donc » (l.16), « ainsi » (l.18), « si… » (l.32). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Démocratie (selon Platon)</i> : régime né de la victoire des pauvres sur les riches. ; <i>Licence</i> : liberté sans limite, de faire ce que l’on veut. ; <i>Ironie</i> : dire le contraire de ce que l’on pense : ici, les « avantages » sont des défauts.</p>", "these": "<p><b>Thèse.</b> Platon décrit un régime né de la victoire des pauvres, séduisant par sa liberté et sa variété, mais anarchique et sans règle.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « L’origine » ; « Une liberté sans limite » ; « Un régime bigarré » ; « Sans contrainte ni vraie égalité ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-9", "idee": "L’origine.", "args": "La démocratie apparaît quand les pauvres l’emportent sur les riches, massacrent ou bannissent, puis partagent également le gouvernement, souvent par tirage au sort.", "lien": "Après avoir décrit l’origine de la démocratie (la victoire des pauvres), Platon en décrit les caractères : liberté sans limite et diversité."}, {"l": "9-31", "idee": "Une liberté sans limite ; Un régime bigarré.", "args": "Liberté de parole et licence de faire ce que l’on veut : chacun organise sa vie comme il lui plaît. Tous les caractères s’y trouvent, comme dans un vêtement bigarré que beaucoup jugent très beau ; on peut y choisir une constitution comme dans un bazar.", "lien": "Cette liberté et cette diversité ont une conséquence : nul n’est contraint ni d’obéir ni de commander, et l’égalité n’a plus de mesure."}, {"l": "31-44", "idee": "Sans contrainte ni vraie égalité.", "args": "Nul n’est obligé de commander ni d’obéir, et l’égalité est donnée aussi bien à ce qui est inégal qu’à ce qui est égal. Le ton est ironique.", "lien": "Cette absence de règle donne la thèse : un gouvernement agréable, anarchique et bigarré."}], "concepts": [{"c": "Démocratie (selon Platon)", "s": "Régime né de la victoire des pauvres sur les riches."}, {"c": "Licence", "s": "Liberté sans limite, de faire ce que l’on veut."}, {"c": "Ironie", "s": "Dire le contraire de ce que l’on pense : ici, les « avantages » sont des défauts."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que la démocratie serait le meilleur régime, parce qu’elle laisse chacun libre.</p><p><b>Le problème.</b> Que vaut la démocratie, régime de la liberté ?</p><p><b>L’enjeu.</b> Le ton est ironique : les prétendus « avantages » de la démocratie sont présentés comme des défauts, ce qui demande d’interpréter le texte avec attention.</p><p><b>Formule.</b> « On dit souvent que la démocratie serait le meilleur régime, parce qu’elle laisse chacun libre, mais Platon soutient : Platon décrit un régime né de la victoire des pauvres, séduisant par sa liberté et sa variété, mais anarchique et sans règle. »</p><p><b>Discussion.</b> La liberté sans règle est-elle encore une liberté ? Platon décrit-il la démocratie ou sa caricature ? (À comparer avec Aristote.)</p>", "intro": ["On dit souvent que la démocratie est le meilleur régime parce qu’elle laisse chacun libre de vivre comme il l’entend. Dans <i>La République</i> (livre VIII), Platon décrit cette liberté et montre qu’elle est aussi le défaut du régime.", "Platon soutient la thèse suivante : Platon décrit un régime né de la victoire des pauvres, séduisant par sa liberté et sa variété, mais anarchique et sans règle. Le ton est ironique : les prétendus « avantages » de la démocratie sont présentés comme des défauts, ce qui demande d’interpréter le texte avec attention.", "Le texte avance en trois temps. Des lignes 1 à 9 : « L’origine ». Des lignes 9 à 31 : « Une liberté sans limite » ; « Un régime bigarré ». Des lignes 31 à 44 : « Sans contrainte ni vraie égalité »."], "dev": [{"l": "1-9", "obj": "L’origine.", "sp": ["<b>L’origine.</b> La démocratie apparaît quand les pauvres l’emportent sur les riches, massacrent ou bannissent, puis partagent également le gouvernement, souvent par tirage au sort."], "tr": "Après avoir décrit l’origine de la démocratie (la victoire des pauvres), Platon en décrit les caractères : liberté sans limite et diversité."}, {"l": "9-31", "obj": "Une liberté sans limite ; Un régime bigarré.", "sp": ["<b>Une liberté sans limite.</b> Liberté de parole et licence de faire ce que l’on veut : chacun organise sa vie comme il lui plaît.", "<b>Un régime bigarré.</b> Tous les caractères s’y trouvent, comme dans un vêtement bigarré que beaucoup jugent très beau ; on peut y choisir une constitution comme dans un bazar."], "tr": "Cette liberté et cette diversité ont une conséquence : nul n’est contraint ni d’obéir ni de commander, et l’égalité n’a plus de mesure."}, {"l": "31-44", "obj": "Sans contrainte ni vraie égalité.", "sp": ["<b>Sans contrainte ni vraie égalité.</b> Nul n’est obligé de commander ni d’obéir, et l’égalité est donnée aussi bien à ce qui est inégal qu’à ce qui est égal. Le ton est ironique."], "tr": ""}], "concl": ["Le texte se demande : « Que vaut la démocratie, régime de la liberté ? » Platon répond ainsi : Platon décrit un régime né de la victoire des pauvres, séduisant par sa liberté et sa variété, mais anarchique et sans règle.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « L’origine » puis « Une liberté sans limite ; Un régime bigarré » puis « Sans contrainte ni vraie égalité ».", "On peut enfin discuter cette thèse. La liberté sans règle est-elle encore une liberté ? Platon décrit-il la démocratie ou sa caricature ? (À comparer avec Aristote.)"]}, {"id": "dem-tocqueville1", "label": "Tocqueville, De la démocratie en Amérique (1) (les limites de la majorité)", "theme": "La démocratie", "auteur": "Tocqueville", "oeuvre": "De la démocratie en Amérique", "fiche": "textes-democratie.html", "lignes": ["Je regarde comme […] détestable cette maxime, qu’en", "matière de gouvernement la majorité d’un peuple a le", "droit de tout faire, et pourtant je place dans les", "volontés de la majorité l’origine de tous les", "pouvoirs. Suis-je en contradiction avec moi-même ?", "Il existe une loi générale qui a été faite ou du moins", "adoptée, non pas seulement par la majorité de tel ou", "tel peuple, mais par la majorité de tous les hommes.", "Cette loi, c’est la justice.", "La justice forme donc la borne du droit de chaque", "peuple.", "Une nation est comme un jury chargé de représenter la", "société universelle et d’appliquer la justice, qui est", "sa loi. Le jury, qui représente la société, doit-il", "avoir plus de puissance que la société elle-même dont", "il applique les lois ?", "Quand donc je refuse d’obéir à une loi injuste, je ne", "dénie point à la majorité le droit de commander ; j’en", "appelle seulement de la souveraineté du peuple à la", "souveraineté du genre humain. […]", "Qu’est-ce donc qu’une majorité prise collectivement,", "sinon un individu qui a des opinions et le plus", "souvent des intérêts contraires à un autre individu", "qu’on nomme la minorité ? Or, si vous admettez qu’un", "homme revêtu de la toute-puissance peut en abuser", "contre ses adversaires, pourquoi n’admettez-vous pas", "la même chose pour une majorité ? Les hommes, en se", "réunissant, ont-ils changé de caractère ? Sont-ils", "devenus plus patients dans les obstacles en devenant", "plus forts ? Pour moi, je ne saurais le croire ; et le", "pouvoir de tout faire, que je refuse à un seul de mes", "semblables, je ne l’accorderai jamais à plusieurs."], "mots": "Mots-clés : Souveraineté du peuple, Justice, Tyrannie de la majorité.", "lire": "<p><b>Objet du texte.</b> La souveraineté du peuple est-elle illimitée ? <b>Notion du programme.</b> La démocratie.</p><p><b>Connecteurs repérés.</b> « pourtant » (l.3), « non pas… mais » (l.7), « mais » (l.8), « donc » (l.10), « or » (l.24), « si… » (l.24). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Souveraineté du peuple</i> : principe selon lequel le pouvoir appartient au peuple, ou à sa majorité. ; <i>Justice</i> : loi supérieure qui borne le droit de chaque peuple. ; <i>Tyrannie de la majorité</i> : danger d’un
