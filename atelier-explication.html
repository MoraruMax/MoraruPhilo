p><b>Thèse.</b> Élisabeth a refoulé un désir moralement insupportable (aimer son beau-frère). L’excitation psychique s’est convertie en douleurs. La prise de conscience provoque une résistance violente, ce qui confirme le refoulement.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « Une patiente et ses douleurs » ; « Naissance du désir » ; « Les douleurs reviennent » ; « Le rejet du désir illicite » ; « Conversion et résistance ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-45", "idee": "Une patiente et ses douleurs ; Naissance du désir.", "args": "Une jeune femme de 29 ans souffre de douleurs aux jambes. Freud l’interroge sur la première apparition des douleurs. Elle assiste au bonheur de sa sœur cadette et de son beau-frère. Une promenade avec lui éveille le désir d’un mari semblable à lui.", "lien": "Après avoir présenté la patiente, ses douleurs et la naissance de son désir, le texte montre comment les douleurs reviennent et comment le désir illicite est rejeté."}, {"l": "46-114", "idee": "Les douleurs reviennent ; Le rejet du désir illicite.", "args": "Les douleurs liées à ces scènes (promenade, bain) réapparaissent pour ne plus la quitter. À la mort de sa sœur, une pensée la traverse comme un éclair : il est libre, elle pourrait l’épouser. Son moi moral la rejette aussitôt.", "lien": "Quand le désir refoulé est identifié, la prise de conscience provoque la résistance de la patiente."}, {"l": "115-142", "idee": "Conversion et résistance.", "args": "Freud conclut à une conversion hystérique. Quand il le lui dit, elle proteste violemment : c’est la résistance. Il la rassure : on n’est pas responsable de ses sentiments.", "lien": "Cette résistance violente confirme le refoulement : c’est la preuve cherchée."}], "concepts": [{"c": "Conversion", "s": "Transformation d’une excitation psychique en symptôme corporel."}, {"c": "Refoulement", "s": "Rejet hors de la conscience d’une représentation insupportable."}, {"c": "Résistance", "s": "Opposition du patient à la prise de conscience du refoulé."}], "probleme": "<p><b>L’opinion remise en cause.</b> Qu’une douleur du corps aurait nécessairement une cause physique.</p><p><b>Le problème.</b> Comment un désir refoulé peut-il produire un symptôme corporel ?</p><p><b>L’enjeu.</b> Cette thèse n’est pas évidente : comment un désir dont on n’a pas conscience peut-il provoquer une douleur, et que prouve la résistance de la patiente ?</p><p><b>Formule.</b> « On dit souvent qu’une douleur du corps aurait nécessairement une cause physique, mais Freud et Breuer soutient : Élisabeth a refoulé un désir moralement insupportable (aimer son beau-frère). »</p><p><b>Discussion.</b> Guérir en comprenant ? La prise de conscience suffit-elle à soulager le symptôme ? (À comparer avec Sartre.)</p>", "intro": ["On croit souvent qu’une douleur du corps a forcément une cause physique. Dans les <i>Études sur l’hystérie</i>, Freud et Breuer montrent, par le cas d’Élisabeth, qu’un désir refoulé peut produire un symptôme corporel.", "Freud et Breuer soutient la thèse suivante : Élisabeth a refoulé un désir moralement insupportable (aimer son beau-frère). L’excitation psychique s’est convertie en douleurs. La prise de conscience provoque une résistance violente, ce qui confirme le refoulement. Cette thèse n’est pas évidente : comment un désir dont on n’a pas conscience peut-il provoquer une douleur, et que prouve la résistance de la patiente ?", "Le texte avance en trois temps. Des lignes 1 à 45 : « Une patiente et ses douleurs » ; « Naissance du désir ». Des lignes 46 à 114 : « Les douleurs reviennent » ; « Le rejet du désir illicite ». Des lignes 115 à 142 : « Conversion et résistance »."], "dev": [{"l": "1-45", "obj": "Une patiente et ses douleurs ; Naissance du désir.", "sp": ["<b>Une patiente et ses douleurs.</b> Une jeune femme de 29 ans souffre de douleurs aux jambes. Freud l’interroge sur la première apparition des douleurs.", "<b>Naissance du désir.</b> Elle assiste au bonheur de sa sœur cadette et de son beau-frère. Une promenade avec lui éveille le désir d’un mari semblable à lui."], "tr": "Après avoir présenté la patiente, ses douleurs et la naissance de son désir, le texte montre comment les douleurs reviennent et comment le désir illicite est rejeté."}, {"l": "46-114", "obj": "Les douleurs reviennent ; Le rejet du désir illicite.", "sp": ["<b>Les douleurs reviennent.</b> Les douleurs liées à ces scènes (promenade, bain) réapparaissent pour ne plus la quitter.", "<b>Le rejet du désir illicite.</b> À la mort de sa sœur, une pensée la traverse comme un éclair : il est libre, elle pourrait l’épouser. Son moi moral la rejette aussitôt."], "tr": "Quand le désir refoulé est identifié, la prise de conscience provoque la résistance de la patiente."}, {"l": "115-142", "obj": "Conversion et résistance.", "sp": ["<b>Conversion et résistance.</b> Freud conclut à une conversion hystérique. Quand il le lui dit, elle proteste violemment : c’est la résistance. Il la rassure : on n’est pas responsable de ses sentiments."], "tr": ""}], "concl": ["Le texte se demande : « Comment un désir refoulé peut-il produire un symptôme corporel ? » Freud et Breuer répond ainsi : Élisabeth a refoulé un désir moralement insupportable (aimer son beau-frère). L’excitation psychique s’est convertie en douleurs. La prise de conscience provoque une résistance violente, ce qui confirme le refoulement.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « Une patiente et ses douleurs ; Naissance du désir » puis « Les douleurs reviennent ; Le rejet du désir illicite » puis « Conversion et résistance ».", "On peut enfin discuter cette thèse. Guérir en comprenant ? La prise de conscience suffit-elle à soulager le symptôme ? (À comparer avec Sartre.)"]}, {"id": "inconscient-freud", "label": "Freud : l’hypothèse de l’inconscient", "theme": "L’inconscient", "auteur": "Freud", "oeuvre": "Essais de psychanalyse / Métapsychologie", "fiche": "inconscient-freud.html", "lignes": ["De divers côtés on nous conteste le droit de postuler", "l’existence d’un psychisme inconscient et de", "travailler scientifiquement à l’aide de cette donnée.", "Nous répondrons que l’hypothèse de l’inconscient est", "nécessaire et légitime et que l’existence de", "l’inconscient est prouvée de maintes façons. Elle est", "nécessaire parce que les renseignements que fournit le", "conscient sont pleins de lacunes ; tant chez les êtres", "normaux que chez les malades on observe souvent des", "actes psychiques qui, pour être compris, présupposent", "d’autres actes dont le conscient cependant ne sait", "rien témoigner. Il ne s’agit pas seulement ici des", "actes manqués, des rêves faits par les normaux, de", "tout ce qu’on appelle symptômes psychiques et", "phénomènes obsessionnels chez les malades, mais notre", "expérience journalière personnelle nous permet", "d’observer des idées dont l’origine nous reste", "inconnue et des résultats de pensée dont l’élaboration", "nous demeure mystérieuse.", "Tous ces actes conscients resteraient incohérents et", "incompréhensibles si nous persistions à soutenir que", "le conscient suffit à nous révéler tous les actes", "psychiques qui se passent en nous. Par contre, ils", "deviennent d’une évidente cohérence lorsque nous", "interpolons les actes inconscients auxquels nous avons", "conclu. Le gain en signification et en cohérence est", "cependant un motif bien fondé, susceptible de nous", "mener au-delà de l’expérience immédiate. Et s’il est", "prouvé que l’hypothèse de l’inconscient permet de", "baser sur elle un procédé fertile en résultats et", "grâce auquel nous pouvons utilement influencer le", "cours des processus conscients, cet heureux résultat", "sera la preuve inattaquable du bien-fondé de notre", "hypothèse.", "Il faut alors considérer que c’est une prétention", "insoutenable d’exiger que tout ce qui se passe dans le", "psychisme doive être connu du conscient. On peut aller", "plus loin, et avancer, pour étayer la thèse d’un état", "psychique inconscient, que la conscience ne comporte à", "chaque moment qu’un contenu minime si bien que, mis à", "part celui-ci, la plus grande partie de ce que nous", "nommons connaissance consciente se trouve", "nécessairement, pendant les plus longues périodes en", "état de latence, donc dans un état d’inconscience", "psychique. Si l’on tenait compte de l’existence de", "tous nos souvenirs latents, il deviendrait", "parfaitement inconcevable de contester l’inconscient .", "(…) Mais l’hypothèse de l’inconscient est aussi tout à", "fait légitime, du fait que rien, en elle, ne dévie de", "notre mode de pensée considéré comme correct.", "Le conscient ne permet à chacun de nous de connaître", "que ses propres états psychiques. Si nous admettons", "que notre prochain possède un conscient, c’est en", "procédant par analogie, et cette conclusion se fonde", "sur les manifestations perceptibles dudit prochain, et", "nous permet de comprendre son comportement. (Du point", "de vue psychologique, il serait d’ailleurs plus exact", "de dire que, sans avoir besoin d’y spécialement", "réfléchir, nous prêtons à toute personne notre propre", "constitution, donc notre conscience, et que cette", "identification est la condition préliminaire de notre", "compréhension.) »", "Freud, Métapsychologie, 1912", "La psychanalyse se refuse à considérer la conscience", "comme formant l'essence même de la vie psychique, mais", "voit dans la conscience une simple qualité de celle-", "ci, pouvant coexister avec d'autres qualités ou faire", "défaut […]. « Être conscient » est avant tout une", "expression purement descriptive et se rapporte à la", "perception la plus immédiate et la plus certaine. Mais", "l'expérience nous montre qu'un élément psychique, une", "représentation par exemple, n'est jamais conscient", "d'une façon permanente. Ce qui caractérise plutôt les", "éléments psychiques, c'est la disparition rapide de", "leur état conscient. Une représentation consciente à", "un moment donné, ne l'est plus au moment suivant, mais", "peut le redevenir dans certaines conditions faciles à", "réaliser.", "Dans l'intervalle nous ignorons ce qu'elle est ; nous", "pouvons dire qu'elle est latente, entendant par là", "qu'elle est capable à tout instant de devenir", "consciente. En disant qu'une représentation est", "restée, dans l'intervalle, inconsciente, nous", "formulons encore une définition correcte, cet état", "inconscient coïncidant avec l'état latent et", "l'aptitude à revenir à la conscience […] Mais nous", "avons obtenu le terme ou la notion de l'inconscient en", "suivant une autre voie et notamment en utilisant des", "expériences dans lesquelles intervient le dynamisme", "psychique. Nous avons appris ou, plutôt, nous avons", "été obligés d'admettre, qu'il existe d'intenses", "processus psychiques, ou représentations capables de", "se manifester par des effets semblables à ceux", "produits par d'autres représentations, voire par des", "effets qui, prenant à leur tour la forme de", "représentations, sont susceptibles de devenir", "conscients sans que les processus eux-mêmes qui les", "ont produits le deviennent [...].", "C'est en ce point qu'intervient la théorie", "psychanalytique, pour déclarer que si certaines", "représentations sont incapables de devenir", "conscientes, c'est à cause d'une certaine force qui", "s'y oppose ; que sans cette force elles pourraient", "bien devenir conscientes, ce qui nous permettrait de", "constater combien peu elles diffèrent d'autres", "éléments psychiques, officiellement reconnus comme", "tels. Ce qui rend cette théorie irréfutable, c'est", "qu'elle a trouvé dans la technique psychanalytique un", "moyen qui permet de vaincre la force d'opposition et", "d'amener à la conscience ces représentations", "inconscientes. À l'état dans lequel se trouvent ces", "représentations avant qu'elles soient amenées à la", "conscience nous avons donné le nom de refoulement ; et", "quant à la force qui produit et maintient le", "refoulement, nous disons que nous la ressentons,", "pendant le travail analytique, sous la forme d'une", "résistance.", "Notre notion de l'inconscient se trouve ainsi déduite", "de la théorie du refoulement. Ce qui est refoulé est", "pour nous le prototype de l'inconscient. Nous savons", "cependant qu'il existe deux variétés d'inconscient :", "les faits psychiques latents, mais susceptibles de", "devenir conscients, et les faits psychiques refoulés", "qui comme tels et livrés à eux-mêmes, sont incapables", "d'arriver à la conscience [...]. Les faits psychiques", "latents, c'est-à-dire inconscients au sens descriptif,", "mais non dynamique, du mot sont des faits", "préconscients, et nous réservons le nom d'inconscients", "aux faits psychiques refoulés c'est-à-dire", "dynamiquement inconscients. Nous sommes ainsi en", "possession de trois termes : conscient, préconscient", "et inconscient, dont la signification n'est plus", "purement descriptive."], "mots": "Mots-clés : Inconscient, Latent / préconscient, Refoulement.", "lire": "<p><b>Objet du texte.</b> Sur quoi fonder l’existence de l’inconscient ? <b>Notion du programme.</b> L’inconscient.</p><p><b>Connecteurs repérés.</b> « parce que » (l.7), « cependant » (l.11), « mais » (l.15), « si… » (l.21), « alors » (l.35), « donc » (l.44). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Inconscient</i> : ensemble des processus psychiques refoulés, qui n’accèdent pas à la conscience. ; <i>Latent / préconscient</i> : ce qui n’est pas conscient actuellement mais peut le redevenir. ; <i>Refoulement</i> : mise à l’écart de la conscience de représentations insupportables.</p>", "these": "<p><b>Thèse.</b> L’inconscient est nécessaire (le conscient est plein de lacunes) et légitime (nous procédons de même pour la conscience d’autrui). Il se distingue du simple latent par le refoulement.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « Une hypothèse contestée » ; « Nécessaire : les lacunes du conscient » ; « Un gain de cohérence » ; « Légitime : le raisonnement par analogie » ; « Latent ou refoulé ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-47", "idee": "Une hypothèse contestée ; Nécessaire : les lacunes du conscient ; Un gain de cohérence.", "args": "On conteste le droit de postuler un psychisme inconscient. Freud répond qu’elle est nécessaire et légitime. Actes manqués, rêves, symptômes, idées d’origine inconnue : tout resterait incompréhensible si le conscient suffisait. En interpolant les actes inconscients, tout devient cohérent. Une hypothèse fertile en résultats est inattaquable.", "lien": "Après avoir montré que l’inconscient est nécessaire (les lacunes du conscient), Freud montre qu’il est légitime : nous raisonnons de la même façon pour la conscience d’autrui."}, {"l": "48-62", "idee": "Légitime : le raisonnement par analogie.", "args": "Nous attribuons une conscience à autrui par analogie. Supposer un inconscient ne dévie pas de notre mode de pensée.", "lien": "Nécessaire et légitime : reste à dire de quoi l’on parle, et à distinguer l’inconscient latent de l’inconscient refoulé."}, {"l": "63-133", "idee": "Latent ou refoulé.", "args": "Le conscient n’est qu’une qualité. Le latent (préconscient) peut redevenir conscient ; le refoulé est maintenu hors de la conscience par une force : la résistance.", "lien": "Cette distinction donne la thèse : le refoulement distingue le véritable inconscient du simplement latent."}], "concepts": [{"c": "Inconscient", "s": "Ensemble des processus psychiques refoulés, qui n’accèdent pas à la conscience."}, {"c": "Latent / préconscient", "s": "Ce qui n’est pas conscient actuellement mais peut le redevenir."}, {"c": "Refoulement", "s": "Mise à l’écart de la conscience de représentations insupportables."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que le psychique se réduirait au conscient.</p><p><b>Le problème.</b> Sur quoi fonder l’existence de l’inconscient ?</p><p><b>L’enjeu.</b> Cette thèse n’est pas évidente : comment prouver l’existence de ce qui, par définition, échappe à la conscience ?</p><p><b>Formule.</b> « On dit souvent que le psychique se réduirait au conscient, mais Freud soutient : L’inconscient est nécessaire (le conscient est plein de lacunes) et légitime (nous procédons de même pour la conscience d’autrui). »</p><p><b>Discussion.</b> Une hypothèse scientifique ? L’inconscient est-il réfutable ? Freud en fait la preuve par ses effets thérapeutiques. (À comparer avec Leibniz.)</p>", "intro": ["On croit souvent que le psychisme se réduit à ce dont on est conscient : être conscient et penser seraient la même chose. Dans ces textes d’<i>Essais de psychanalyse</i> et de <i>Métapsychologie</i>, Freud défend l’existence de l’inconscient.", "Freud soutient la thèse suivante : L’inconscient est nécessaire (le conscient est plein de lacunes) et légitime (nous procédons de même pour la conscience d’autrui). Il se distingue du simple latent par le refoulement. Cette thèse n’est pas évidente : comment prouver l’existence de ce qui, par définition, échappe à la conscience ?", "Le texte avance en trois temps. Des lignes 1 à 47 : « Une hypothèse contestée » ; « Nécessaire : les lacunes du conscient » ; « Un gain de cohérence ». Des lignes 48 à 62 : « Légitime : le raisonnement par analogie ». Des lignes 63 à 133 : « Latent ou refoulé »."], "dev": [{"l": "1-47", "obj": "Une hypothèse contestée ; Nécessaire : les lacunes du conscient ; Un gain de cohérence.", "sp": ["<b>Une hypothèse contestée.</b> On conteste le droit de postuler un psychisme inconscient. Freud répond qu’elle est nécessaire et légitime.", "<b>Nécessaire : les lacunes du conscient.</b> Actes manqués, rêves, symptômes, idées d’origine inconnue : tout resterait incompréhensible si le conscient suffisait.", "<b>Un gain de cohérence.</b> En interpolant les actes inconscients, tout devient cohérent. Une hypothèse fertile en résultats est inattaquable."], "tr": "Après avoir montré que l’inconscient est nécessaire (les lacunes du conscient), Freud montre qu’il est légitime : nous raisonnons de la même façon pour la conscience d’autrui."}, {"l": "48-62", "obj": "Légitime : le raisonnement par analogie.", "sp": ["<b>Légitime : le raisonnement par analogie.</b> Nous attribuons une conscience à autrui par analogie. Supposer un inconscient ne dévie pas de notre mode de pensée."], "tr": "Nécessaire et légitime : reste à dire de quoi l’on parle, et à distinguer l’inconscient latent de l’inconscient refoulé."}, {"l": "63-133", "obj": "Latent ou refoulé.", "sp": ["<b>Latent ou refoulé.</b> Le conscient n’est qu’une qualité. Le latent (préconscient) peut redevenir conscient ; le refoulé est maintenu hors de la conscience par une force : la résistance."], "tr": ""}], "concl": ["Le texte se demande : « Sur quoi fonder l’existence de l’inconscient ? » Freud répond ainsi : L’inconscient est nécessaire (le conscient est plein de lacunes) et légitime (nous procédons de même pour la conscience d’autrui). Il se distingue du simple latent par le refoulement.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « Une hypothèse contestée ; Nécessaire : les lacunes du conscient ; Un gain de cohérence » puis « Légitime : le raisonnement par analogie » puis « Latent ou refoulé ».", "On peut enfin discuter cette thèse. Une hypothèse scientifique ? L’inconscient est-il réfutable ? Freud en fait la preuve par ses effets thérapeutiques. (À comparer avec Leibniz.)"]}, {"id": "inconscient-leibniz", "label": "Leibniz : les petites perceptions", "theme": "L’inconscient", "auteur": "Leibniz", "oeuvre": "Nouveaux essais sur l’entendement humain", "fiche": "inconscient-leibniz.html", "lignes": ["Et pour juger encore mieux des petites perceptions que", "nous ne saurions distinguer dans la foule, j’ai", "coutume de me servir de l’exemple du mugissement ou du", "bruit de la mer, dont on est frappé quand on est au", "rivage. Pour entendre ce bruit, comme l’on fait, il", "faut bien qu’on entende les parties qui composent ce", "tout, c'est-à-dire les bruits de chaque vague, quoique", "chacun de ces petits bruits ne se fasse connaître que", "dans l’assemblage confus de tous les autres ensemble,", "c'est-à-dire dans ce mugissement même, et ne se", "remarquerait pas, si cette vague, qui le fait, était", "seule. Car il faut qu’on soit affecté un peu par le", "mouvement de cette vague, et qu’on ait quelque", "perception de chacun de ces bruits, quelque petits", "qu’ils soient ; autrement, on n’aurait pas celle de", "cent mille vagues, puisque cent mille riens ne", "sauraient faire quelque chose.", "On ne dort jamais si profondément qu’on n’ait quelque", "sentiment faible et confus ; et on ne serait jamais", "éveillé par le plus grand bruit du monde, si on", "n’avait quelque perception de son commencement, qui", "est petit ; comme on ne romprait jamais une corde par", "le plus grand effort du monde, si elle n’était tendue", "et allongée un peu par de moindres efforts, quoique", "cette petite extension qu’ils font ne paraisse pas.", "Ces petites perceptions sont donc de plus grande", "efficace par leurs suites qu’on ne pense. Ce sont", "elles qui forment ce je ne sais quoi, ces goûts, ces", "images des qualités des sens, claires dans", "l’assemblage mais confuses dans les parties, ces", "impressions que des corps environnants font sur nous,", "qui enveloppent l’infini ; cette liaison que chaque", "être a avec tout le reste de l’univers.", "On peut même dire qu’en conséquence de ces petites", "perceptions, le présent est gros de l’avenir et chargé", "du passé, que tout est conspirant, et que, dans la", "moindre des substances, des yeux aussi perçants que", "ceux de Dieu pourraient lire toute la suite des choses", "de l’univers :", "Quae sint, quae fuerint, quae mox futura trahentur. 1", "Ces perceptions insensibles marquent encore et", "constituent le même individu, qui est caractérisé, par", "les traces ou expressions qu’elles conservent des", "états précédents de cet individu, en faisant la", "connexion avec son état présent.", "Celles qui sont, celles qui furent, celles qui sont", "sur le point d’être. (Virgile, Géorgiques IV)"], "mots": "Mots-clés : Petite perception, Confus, Aperception.", "lire": "<p><b>Objet du texte.</b> Existe-t-il en nous des perceptions dont nous ne sommes pas conscients ? <b>Notion du programme.</b> L’inconscient.</p><p><b>Connecteurs repérés.</b> « si… » (l.11), « car » (l.12), « puisque » (l.16), « donc » (l.26), « mais » (l.30). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Petite perception</i> : perception trop faible ou confuse pour être consciente, mais réelle. ; <i>Confus</i> : qui n’est pas distingué en parties claires. ; <i>Aperception</i> : perception consciente, qui se remarque (terme de Leibniz).</p>", "these": "<p><b>Thèse.</b> Il y a des « petites perceptions » confuses et insensibles. Elles composent nos perceptions conscientes, forment nos goûts et notre identité, et rattachent chaque être à l’univers entier.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « Le bruit de la mer » ; « Cent mille riens ne font pas quelque chose » ; « Jamais de sommeil sans sentiment » ; « Une efficace par leurs suites » ; « Le présent gros de l’avenir ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-17", "idee": "Le bruit de la mer ; Cent mille riens ne font pas quelque chose.", "args": "Pour entendre le mugissement, il faut entendre chaque vague, mais aucune ne se remarque seule. Si chaque petit bruit n’était pas perçu, on ne percevrait pas cent mille vagues.", "lien": "Après avoir montré par le bruit de la mer que de petites perceptions composent les perceptions conscientes, Leibniz en tire que l’on ne dort jamais sans quelque sentiment."}, {"l": "18-33", "idee": "Jamais de sommeil sans sentiment ; Une efficace par leurs suites.", "args": "On ne dort jamais si profondément qu’on n’ait quelque sentiment faible et confus. On n’est éveillé que parce qu’on perçoit le début du bruit, comme une corde tendue petit à petit. Ces petites perceptions forment ce « je ne sais quoi », nos goûts, nos impressions des corps environnants.", "lien": "Si ces petites perceptions existent toujours, elles ont des effets : elles forment nos goûts et notre identité."}, {"l": "34-47", "idee": "Le présent gros de l’avenir.", "args": "Le présent est chargé du passé et gros de l’avenir. Ces perceptions insensibles constituent l’identité de l’individu.", "lien": "Elles rattachent enfin chaque être à l’univers entier : le présent est gros de l’avenir."}], "concepts": [{"c": "Petite perception", "s": "Perception trop faible ou confuse pour être consciente, mais réelle."}, {"c": "Confus", "s": "Qui n’est pas distingué en parties claires."}, {"c": "Aperception", "s": "Perception consciente, qui se remarque (terme de Leibniz)."}], "probleme": "<p><b>L’opinion remise en cause.</b> Qu’il n’y aurait rien dans l’esprit dont nous ne soyons conscients.</p><p><b>Le problème.</b> Existe-t-il en nous des perceptions dont nous ne sommes pas conscients ?</p><p><b>L’enjeu.</b> Cette thèse n’est pas évidente : comment percevoir sans en avoir conscience, et comment de telles perceptions auraient-elles des effets ?</p><p><b>Formule.</b> « On dit souvent qu’il n’y aurait rien dans l’esprit dont nous ne soyons conscients, mais Leibniz soutient : Il y a des « petites perceptions » confuses et insensibles. »</p><p><b>Discussion.</b> L’inconscient avant Freud ? Leibniz parle de perceptions non conscientes mais sans conflit ni refoulement. Est-ce déjà l’inconscient ? (À comparer avec Freud.)</p>", "intro": ["On croit souvent que tout ce qui se passe dans notre esprit est conscient : percevoir, ce serait avoir conscience de percevoir. Dans les <i>Nouveaux essais sur l’entendement humain</i>, Leibniz soutient qu’il existe des « petites perceptions » dont nous ne sommes pas conscients.", "Leibniz soutient la thèse suivante : Il y a des « petites perceptions » confuses et insensibles. Elles composent nos perceptions conscientes, forment nos goûts et notre identité, et rattachent chaque être à l’univers entier. Cette thèse n’est pas évidente : comment percevoir sans en avoir conscience, et comment de telles perceptions auraient-elles des effets ?", "Le texte avance en trois temps. Des lignes 1 à 17 : « Le bruit de la mer » ; « Cent mille riens ne font pas quelque chose ». Des lignes 18 à 33 : « Jamais de sommeil sans sentiment » ; « Une efficace par leurs suites ». Des lignes 34 à 47 : « Le présent gros de l’avenir »."], "dev": [{"l": "1-17", "obj": "Le bruit de la mer ; Cent mille riens ne font pas quelque chose.", "sp": ["<b>Le bruit de la mer.</b> Pour entendre le mugissement, il faut entendre chaque vague, mais aucune ne se remarque seule.", "<b>Cent mille riens ne font pas quelque chose.</b> Si chaque petit bruit n’était pas perçu, on ne percevrait pas cent mille vagues."], "tr": "Après avoir montré par le bruit de la mer que de petites perceptions composent les perceptions conscientes, Leibniz en tire que l’on ne dort jamais sans quelque sentiment."}, {"l": "18-33", "obj": "Jamais de sommeil sans sentiment ; Une efficace par leurs suites.", "sp": ["<b>Jamais de sommeil sans sentiment.</b> On ne dort jamais si profondément qu’on n’ait quelque sentiment faible et confus. On n’est éveillé que parce qu’on perçoit le début du bruit, comme une corde tendue petit à petit.", "<b>Une efficace par leurs suites.</b> Ces petites perceptions forment ce « je ne sais quoi », nos goûts, nos impressions des corps environnants."], "tr": "Si ces petites perceptions existent toujours, elles ont des effets : elles forment nos goûts et notre identité."}, {"l": "34-47", "obj": "Le présent gros de l’avenir.", "sp": ["<b>Le présent gros de l’avenir.</b> Le présent est chargé du passé et gros de l’avenir. Ces perceptions insensibles constituent l’identité de l’individu."], "tr": ""}], "concl": ["Le texte se demande : « Existe-t-il en nous des perceptions dont nous ne sommes pas conscients ? » Leibniz répond ainsi : Il y a des « petites perceptions » confuses et insensibles. Elles composent nos perceptions conscientes, forment nos goûts et notre identité, et rattachent chaque être à l’univers entier.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « Le bruit de la mer ; Cent mille riens ne font pas quelque chose » puis « Jamais de sommeil sans sentiment ; Une efficace par leurs suites » puis « Le présent gros de l’avenir ».", "On peut enfin discuter cette thèse. L’inconscient avant Freud ? Leibniz parle de perceptions non conscientes mais sans conflit ni refoulement. Est-ce déjà l’inconscient ? (À comparer avec Freud.)"]}, {"id": "langage-austin", "label": "Austin : la performativité", "theme": "Le langage", "auteur": "Austin", "oeuvre": "Quand dire, c’est faire", "fiche": "langage-austin.html", "lignes": ["Exemples :", "(E. A) « Oui [je le veux] (c’est-à-dire je prends", "cette femme comme épouse légitime) » - ce « oui »", "étant prononcé au cours de la cérémonie du mariage.", "(E. B) « Je baptise ce bateau le Queen Elizabeth » -", "comme on dit lorsqu’on brise une bouteille contre la", "coque.", "(E. C) « Je donne et lègue ma montre à mon frère » -", "comme on peut le lire dans un testament. [...]", "Pour ces exemples, il semble clair qu’énoncer la", "phrase (dans les circonstances appropriées,", "évidemment), ce n’est ni décrire ce qu’il faut bien", "reconnaître que je suis en train de faire en parlant", "ainsi, ni affirmer ce que je fais : c’est le faire.", "[...]", "Quel nom donner à une phrase ou à une énonciation de", "ce type ? Je propose de l’appeler une phrase", "performative ou une énonciation performative ou – par", "souci de brièveté - un « performatif »."], "mots": "Mots-clés : Performatif, Constatif, Circonstances appropriées.", "lire": "<p><b>Objet du texte.</b> Parler, est-ce seulement décrire le monde ? <b>Notion du programme.</b> Le langage.</p><p><b>Connecteurs repérés.</b> « ainsi » (l.14). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Performatif</i> : énoncé qui accomplit une action en étant prononcé. ; <i>Constatif</i> : énoncé qui décrit ou affirme un fait, vrai ou faux. ; <i>Circonstances appropriées</i> : conditions qui rendent l’énoncé valide : contexte, personne habilitée.</p>", "these": "<p><b>Thèse.</b> Certaines phrases ne décrivent pas : elles font ce qu’elles disent. Austin les appelle des énoncés performatifs.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « Trois exemples » ; « Ce ne sont pas des descriptions » ; « Ni des affirmations » ; « C’est l’action elle-même » ; « Un nom : le performatif ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-9", "idee": "Trois exemples.", "args": "Le « oui » du mariage, « je baptise ce bateau », « je donne et lègue ma montre à mon frère » dans un testament.", "lien": "Après avoir donné trois exemples, Austin montre que ce ne sont pas des descriptions : énoncer la phrase, c’est accomplir l’action."}, {"l": "9-14", "idee": "Ce ne sont pas des descriptions ; Ni des affirmations ; C’est l’action elle-même.", "args": "Énoncer ces phrases n’est pas décrire ce que je suis en train de faire. Ce n’est pas non plus affirmer ce que je fais. Énoncer la phrase, dans les circonstances appropriées, c’est faire l’action.", "lien": "Si énoncer la phrase est l’action elle-même, il faut lui donner un nom."}, {"l": "15-19", "idee": "Un nom : le performatif.", "args": "Austin propose de les appeler phrases ou énonciations performatives, ou « performatifs ».", "lien": "Ce nom est le « performatif » : la thèse est qu’il existe des phrases qui font ce qu’elles disent."}], "concepts": [{"c": "Performatif", "s": "Énoncé qui accomplit une action en étant prononcé."}, {"c": "Constatif", "s": "Énoncé qui décrit ou affirme un fait, vrai ou faux."}, {"c": "Circonstances appropriées", "s": "Conditions qui rendent l’énoncé valide : contexte, personne habilitée."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que parler consisterait toujours à décrire le monde, en disant quelque chose de vrai ou de faux.</p><p><b>Le problème.</b> Parler, est-ce seulement décrire le monde ?</p><p><b>L’enjeu.</b> Cette thèse n’est pas évidente : comment peut-on faire quelque chose simplement en le disant ?</p><p><b>Formule.</b> « On dit souvent que parler consisterait toujours à décrire le monde, en disant quelque chose de vrai ou de faux, mais Austin soutient : Certaines phrases ne décrivent pas : elles font ce qu’elles disent. »</p><p><b>Discussion.</b> Parler, est-ce agir ? Les performatifs montrent que le langage agit. Tout langage est-il action ? (À comparer avec Klemperer.)</p>", "intro": ["On croit souvent que parler consiste à décrire le monde, et qu’une phrase est toujours vraie ou fausse. Dans <i>Quand dire, c’est faire</i>, Austin donne des exemples de phrases qui ne décrivent rien.", "Austin soutient la thèse suivante : Certaines phrases ne décrivent pas : elles font ce qu’elles disent. Austin les appelle des énoncés performatifs. Cette thèse n’est pas évidente : comment peut-on faire quelque chose simplement en le disant ?", "Le texte avance en trois temps. Des lignes 1 à 9 : « Trois exemples ». Des lignes 9 à 14 : « Ce ne sont pas des descriptions » ; « Ni des affirmations » ; « C’est l’action elle-même ». Des lignes 15 à 19 : « Un nom : le performatif »."], "dev": [{"l": "1-9", "obj": "Trois exemples.", "sp": ["<b>Trois exemples.</b> Le « oui » du mariage, « je baptise ce bateau », « je donne et lègue ma montre à mon frère » dans un testament."], "tr": "Après avoir donné trois exemples, Austin montre que ce ne sont pas des descriptions : énoncer la phrase, c’est accomplir l’action."}, {"l": "9-14", "obj": "Ce ne sont pas des descriptions ; Ni des affirmations ; C’est l’action elle-même.", "sp": ["<b>Ce ne sont pas des descriptions.</b> Énoncer ces phrases n’est pas décrire ce que je suis en train de faire.", "<b>Ni des affirmations.</b> Ce n’est pas non plus affirmer ce que je fais.", "<b>C’est l’action elle-même.</b> Énoncer la phrase, dans les circonstances appropriées, c’est faire l’action."], "tr": "Si énoncer la phrase est l’action elle-même, il faut lui donner un nom."}, {"l": "15-19", "obj": "Un nom : le performatif.", "sp": ["<b>Un nom : le performatif.</b> Austin propose de les appeler phrases ou énonciations performatives, ou « performatifs »."], "tr": ""}], "concl": ["Le texte se demande : « Parler, est-ce seulement décrire le monde ? » Austin répond ainsi : Certaines phrases ne décrivent pas : elles font ce qu’elles disent. Austin les appelle des énoncés performatifs.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « Trois exemples » puis « Ce ne sont pas des descriptions ; Ni des affirmations ; C’est l’action elle-même » puis « Un nom : le performatif ».", "On peut enfin discuter cette thèse. Parler, est-ce agir ? Les performatifs montrent que le langage agit. Tout langage est-il action ? (À comparer avec Klemperer.)"]}, {"id": "langage-descartes", "label": "Descartes : le langage, propre de l’homme", "theme": "Le langage", "auteur": "Descartes", "oeuvre": "Lettre au marquis de Newcastle", "fiche": "langage-descartes.html", "lignes": ["Bien que Montaigne et Charon aient dit qu’il y a plus", "de différence d’homme à homme que d’homme à bête, il", "ne s’est toutefois jamais trouvé une bête si parfaite,", "qu’elle ait usé de quelque signe, pour faire entendre", "à d’autres animaux quelque chose qui n’eût point de", "rapport à ses passions ; et il n’y a point d’homme si", "imparfait, qu’il n’en use ; en sorte que ceux qui sont", "sourds et muets inventent des signes particuliers, par", "lesquels ils expriment leurs pensées.", "Ce qui me semble un très fort argument pour prouver", "que ce qui fait que les bêtes ne parlent point comme", "nous est qu’elles n’ont aucune pensée, et non points", "que les organes leur manquent. Et on ne peut dire", "qu’elles parlent entre elles, mais que nous ne les", "entendons pas ; car, comme les chiens et quelques", "autres animaux nous expriment leurs passions, ils nous", "exprimeraient aussi bien leurs pensées, s’ils en", "avaient."], "mots": "Mots-clés : Signe, Passions, Pensée.", "lire": "<p><b>Objet du texte.</b> Pourquoi les animaux ne parlent-ils pas comme nous ? <b>Notion du programme.</b> Le langage.</p><p><b>Connecteurs repérés.</b> « si… » (l.3), « mais » (l.14), « car » (l.15). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Signe</i> : ce qui est utilisé pour renvoyer à autre chose. Chez l’homme, il exprime une pensée. ; <i>Passions</i> : états affectifs (peur, joie, faim) que les animaux expriment naturellement. ; <i>Pensée</i> : activité de l’âme qui se distingue de la simple réaction : propre à l’homme chez Descartes.</p>", "these": "<p><b>Thèse.</b> Le langage est le propre de l’homme. Il manque aux animaux non pas les organes de la parole, mais la pensée : ils expriment leurs passions, pas leurs pensées.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « La différence homme-bête » ; « Aucune bête n’a usé de signes sans rapport à ses passions » ; « Tout homme invente des signes » ; « Ce n’est pas une question d’organes » ; « Pas de langage animal incompris ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-9", "idee": "La différence homme-bête ; Aucune bête n’a usé de signes sans rapport à ses passions.", "args": "Montaigne et Charron disent qu’il y a plus de différence d’homme à homme que d’homme à bête. Descartes conteste. Aucun animal ne s’est servi d’un signe pour faire entendre à d’autres quelque chose qui n’ait pas de rapport à ses passions.", "lien": "Après avoir posé que la différence entre l’homme et la bête tient au langage, Descartes précise : tout homme invente des signes, aucune bête n’en use sans rapport à ses passions."}, {"l": "10-13", "idee": "Tout homme invente des signes ; Ce n’est pas une question d’organes.", "args": "Même le plus imparfait, comme le sourd et muet, invente des signes pour exprimer ses pensées. La raison est que les bêtes « n’ont aucune pensée », non que les organes leur manquent.", "lien": "Si cette différence ne tient pas aux organes, c’est qu’elle tient à la pensée."}, {"l": "13-18", "idee": "Pas de langage animal incompris.", "args": "Les animaux nous expriment leurs passions. S’ils avaient des pensées, ils nous les exprimeraient aussi.", "lien": "On ne peut donc pas dire que les animaux parlent entre eux sans que nous les comprenions : ils n’ont pas de pensée à exprimer."}], "concepts": [{"c": "Signe", "s": "Ce qui est utilisé pour renvoyer à autre chose. Chez l’homme, il exprime une pensée."}, {"c": "Passions", "s": "États affectifs (peur, joie, faim) que les animaux expriment naturellement."}, {"c": "Pensée", "s": "Activité de l’âme qui se distingue de la simple réaction : propre à l’homme chez Descartes."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que les animaux parleraient à leur manière, ou qu’il leur manquerait seulement les organes de la parole.</p><p><b>Le problème.</b> Pourquoi les animaux ne parlent-ils pas comme nous ?</p><p><b>L’enjeu.</b> Cette thèse n’est pas évidente : les animaux ne communiquent-ils pas, et en quoi leur voix diffère-t-elle de notre langage ?</p><p><b>Formule.</b> « On dit souvent que les animaux parleraient à leur manière, ou qu’il leur manquerait seulement les organes de la parole, mais Descartes soutient : Le langage est le propre de l’homme. »</p><p><b>Discussion.</b> Les animaux pensent-ils ? Les travaux sur la communication animale remettent-ils en cause Descartes ? (À comparer avec Aristote et Pascal.)</p>", "intro": ["On entend dire que les animaux parlent à leur manière, ou qu’il leur manque seulement les organes de la parole. Dans sa lettre au marquis de Newcastle, Descartes soutient que le langage est le propre de l’homme.", "Descartes soutient la thèse suivante : Le langage est le propre de l’homme. Il manque aux animaux non pas les organes de la parole, mais la pensée : ils expriment leurs passions, pas leurs pensées. Cette thèse n’est pas évidente : les animaux ne communiquent-ils pas, et en quoi leur voix diffère-t-elle de notre langage ?", "Le texte avance en trois temps. Des lignes 1 à 9 : « La différence homme-bête » ; « Aucune bête n’a usé de signes sans rapport à ses passions ». Des lignes 10 à 13 : « Tout homme invente des signes » ; « Ce n’est pas une question d’organes ». Des lignes 13 à 18 : « Pas de langage animal incompris »."], "dev": [{"l": "1-9", "obj": "La différence homme-bête ; Aucune bête n’a usé de signes sans rapport à ses passions.", "sp": ["<b>La différence homme-bête.</b> Montaigne et Charron disent qu’il y a plus de différence d’homme à homme que d’homme à bête. Descartes conteste.", "<b>Aucune bête n’a usé de signes sans rapport à ses passions.</b> Aucun animal ne s’est servi d’un signe pour faire entendre à d’autres quelque chose qui n’ait pas de rapport à ses passions."], "tr": "Après avoir posé que la différence entre l’homme et la bête tient au langage, Descartes précise : tout homme invente des signes, aucune bête n’en use sans rapport à ses passions."}, {"l": "10-13", "obj": "Tout homme invente des signes ; Ce n’est pas une question d’organes.", "sp": ["<b>Tout homme invente des signes.</b> Même le plus imparfait, comme le sourd et muet, invente des signes pour exprimer ses pensées.", "<b>Ce n’est pas une question d’organes.</b> La raison est que les bêtes « n’ont aucune pensée », non que les organes leur manquent."], "tr": "Si cette différence ne tient pas aux organes, c’est qu’elle tient à la pensée."}, {"l": "13-18", "obj": "Pas de langage animal incompris.", "sp": ["<b>Pas de langage animal incompris.</b> Les animaux nous expriment leurs passions. S’ils avaient des pensées, ils nous les exprimeraient aussi."], "tr": ""}], "concl": ["Le texte se demande : « Pourquoi les animaux ne parlent-ils pas comme nous ? » Descartes répond ainsi : Le langage est le propre de l’homme. Il manque aux animaux non pas les organes de la parole, mais la pensée : ils expriment leurs passions, pas leurs pensées.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « La différence homme-bête ; Aucune bête n’a usé de signes sans rapport à ses passions » puis « Tout homme invente des signes ; Ce n’est pas une question d’organes » puis « Pas de langage animal incompris ».", "On peut enfin discuter cette thèse. Les animaux pensent-ils ? Les travaux sur la communication animale remettent-ils en cause Descartes ? (À comparer avec Aristote et Pascal.)"]}, {"id": "langage-klemperer", "label": "Klemperer : la langue du Troisième Reich", "theme": "Le langage", "auteur": "Klemperer", "oeuvre": "LTI, La Langue du Troisième Reich", "fiche": "langage-klemperer.html", "lignes": ["Quel fut le moyen de propagande le plus puissant de", "l'hitlérisme ? Etaient-ce les discours isolés de", "Hitler et de Goebbels, leurs déclarations à tel ou tel", "sujet, leurs propos haineux sur le judaïsme, sur le", "bolchevisme ?", "Non, incontestablement, car beaucoup de choses", "demeuraient incomprises par la masse ou l'ennuyaient,", "du fait de leur éternelle répétition. […] Combien de", "fois à l'usine, pendant l'alerte aérienne, alors que", "les Aryens avaient leur salle à eux et les Juifs", "aussi, et c'était dans la pièce aryenne que se", "trouvait la radio (et le chauffage et la nourriture),", "combien de fois n'ai-je pas entendu le bruit des", "cartes à jouer qui claquaient sur la table et les", "conversations à voix haute au sujet des rations de", "viande et de tabac et sur le cinéma, tandis que le", "Führer ou l'un de ses paladins tenaient de prolixes", "discours, et après on lisait dans les journaux que le", "peuple tout entier les avait écoutés attentivement.", "Non, l'effet le plus puissant ne fut pas produit par", "des discours isolés, ni par des articles ou des", "tracts, ni par des affiches ou des drapeaux, il ne fut", "obtenu par rien de ce que l'on était forcé", "d'enregistrer par la pensée ou la perception.", "Le nazisme s'insinua dans la chair et le sang du grand", "nombre à travers les expressions isolées, des", "tournures, des formes syntaxiques qui s'imposaient à", "des millions d'exemplaires et qui furent adoptées de", "façon mécanique et inconsciente. […] La langue ne se", "contente pas de « poétiser et de penser à ma place »", "[Schiller], elle dirige aussi mes sentiments, elle", "régit tout mon être moral d'autant plus naturellement", "que je m'en remets inconsciemment à elle. Et", "qu'arrive-t-il si cette langue cultivée est constituée", "d'éléments toxiques ou si l'on en fait le vecteur de", "substances toxiques ? Les mots peuvent être comme de", "minuscules doses d'arsenic :on les avale sans y", "prendre garde, ils semblent ne faire aucun effet, et", "voilà qu'après quelque temps l'effet toxique se fait", "sentir.", "Si quelqu'un, au lieu d' « héroïque et vertueux », dit", "pendant assez longtemps « fanatique », il finira", "réellement par croire qu'un fanatique est un héros", "vertueux et que, sans fanatisme, on ne peut pas être", "un héros. Les vocables « fanatique » et « fanatisme »", "n'ont pas été inventés par le Troisième Reich, il n'a", "fait qu'un modifier la valeur et les a employés plus", "fréquemment en un jour que d'autres époques en des", "années. Le Troisième Reich n'a forgé, de son propre", "cru, qu'un petit nombre des mots de sa langue, et", "peut-être même vraisemblablement aucun. […] Mais elle", "change la valeur des mots et leur fréquence, elle", "transforme en bien général ce qui, jadis, appartenait", "à un seul individu ou à un groupuscule, elle", "réquisitionne pour le Parti ce qui, jadis, était le", "bien général et, ce faisant, elle imprègne les mots et", "les formes syntaxiques de son poison, elle assujettit", "la langue à son terrible système, elle gagne avec la", "langue son moyen de propagande le plus puissant, le", "plus public et le plus secret."], "mots": "Mots-clés : Propagande, Inconscient (adoption), Valeur des mots.", "lire": "<p><b>Objet du texte.</b> Comment le langage peut-il servir de moyen de propagande ? <b>Notion du programme.</b> Le langage.</p><p><b>Connecteurs repérés.</b> « car » (l.6), « alors » (l.9), « si… » (l.34), « mais » (l.51). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Propagande</i> : diffusion systématique d’idées pour influencer les esprits. ; <i>Inconscient (adoption)</i> : manière dont on adopte des expressions sans y prendre garde. ; <i>Valeur des mots</i> : charge positive ou négative d’un mot : « fanatique » devient un éloge.</p>", "these": "<p><b>Thèse.</b> Le moyen de propagande le plus puissant n’est pas le discours explicite, mais la langue elle-même : adoptée inconsciemment, elle dirige les sentiments et change la valeur des mots, comme un poison à petites doses.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « Quel fut le moyen le plus puissant ? » ; « Une masse indifférente aux discours » ; « Le nazisme dans la chair et le sang » ; « La langue dirige mes sentiments » ; « Les mots, doses d’arsenic ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-24", "idee": "Quel fut le moyen le plus puissant ? ; Une masse indifférente aux discours.", "args": "Non pas les discours isolés de Hitler et de Goebbels, souvent ennuyeux et répétitifs, ni les déclarations. À l’usine, on jouait aux cartes pendant les discours du Führer : l’effet ne vient pas de ce que l’on est forcé d’enregistrer.", "lien": "Après avoir écarté les discours comme moyen le plus puissant, Klemperer montre que le nazisme s’insinue dans la chair et le sang par la langue, qui dirige les sentiments."}, {"l": "25-35", "idee": "Le nazisme dans la chair et le sang ; La langue dirige mes sentiments.", "args": "Il s’est insinué par des expressions isolées, des tournures, des formes syntaxiques, adoptées de façon mécanique et inconsciente. Elle ne se contente pas de penser à ma place : elle régit tout mon être moral, d’autant plus que je m’en remets inconsciemment à elle.", "lien": "Si la langue dirige nos sentiments, elle agit comme un poison à petites doses : c’est l’image des mots-arsenic."}, {"l": "36-60", "idee": "Les mots, doses d’arsenic.", "args": "Dire « fanatique » au lieu d’« héroïque » pendant assez longtemps finit par changer la croyance. Le Reich change la valeur et la fréquence des mots.", "lien": "Cette dernière étape donne la thèse : la langue, adoptée inconsciemment, change la valeur des mots et dirige la pensée."}], "concepts": [{"c": "Propagande", "s": "Diffusion systématique d’idées pour influencer les esprits."}, {"c": "Inconscient (adoption)", "s": "Manière dont on adopte des expressions sans y prendre garde."}, {"c": "Valeur des mots", "s": "Charge positive ou négative d’un mot : « fanatique » devient un éloge."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que la propagande agirait par les grands discours et les slogans explicites.</p><p><b>Le problème.</b> Comment le langage peut-il servir de moyen de propagande ?</p><p><b>L’enjeu.</b> Cette thèse n’est pas évidente : comment la langue, qu’on emploie sans y penser, peut-elle servir une propagande ?</p><p><b>Formule.</b> « On dit souvent que la propagande agirait par les grands discours et les slogans explicites, mais Klemperer soutient : Le moyen de propagande le plus puissant n’est pas le discours explicite, mais la langue elle-même : adoptée inconsciemment, elle dirige les sentiments et change la valeur des mots, comme un poison à petites doses. »</p><p><b>Discussion.</b> Les mots influencent-ils nos pensées ? Le langage oriente-t-il notre jugement ? Comment s’en défendre ? (À comparer avec Austin et Wittgenstein.)</p>", "intro": ["On croit souvent que la propagande agit par les grands discours et les slogans explicites. Dans <i>LTI</i>, Klemperer, qui a vécu sous le Troisième Reich, soutient que son moyen le plus puissant est la langue elle-même.", "Klemperer soutient la thèse suivante : Le moyen de propagande le plus puissant n’est pas le discours explicite, mais la langue elle-même : adoptée inconsciemment, elle dirige les sentiments et change la valeur des mots, comme un poison à petites doses. Cette thèse n’est pas évidente : comment la langue, qu’on emploie sans y penser, peut-elle servir une propagande ?", "Le texte avance en trois temps. Des lignes 1 à 24 : « Quel fut le moyen le plus puissant ? » ; « Une masse indifférente aux discours ». Des lignes 25 à 35 : « Le nazisme dans la chair et le sang » ; « La langue dirige mes sentiments ». Des lignes 36 à 60 : « Les mots, doses d’arsenic »."], "dev": [{"l": "1-24", "obj": "Quel fut le moyen le plus puissant ? ; Une masse indifférente aux discours.", "sp": ["<b>Quel fut le moyen le plus puissant ?.</b> Non pas les discours isolés de Hitler et de Goebbels, souvent ennuyeux et répétitifs, ni les déclarations.", "<b>Une masse indifférente aux discours.</b> À l’usine, on jouait aux cartes pendant les discours du Führer : l’effet ne vient pas de ce que l’on est forcé d’enregistrer."], "tr": "Après avoir écarté les discours comme moyen le plus puissant, Klemperer montre que le nazisme s’insinue dans la chair et le sang par la langue, qui dirige les sentiments."}, {"l": "25-35", "obj": "Le nazisme dans la chair et le sang ; La langue dirige mes sentiments.", "sp": ["<b>Le nazisme dans la chair et le sang.</b> Il s’est insinué par des expressions isolées, des tournures, des formes syntaxiques, adoptées de façon mécanique et inconsciente.", "<b>La langue dirige mes sentiments.</b> Elle ne se contente pas de penser à ma place : elle régit tout mon être moral, d’autant plus que je m’en remets inconsciemment à elle."], "tr": "Si la langue dirige nos sentiments, elle agit comme un poison à petites doses : c’est l’image des mots-arsenic."}, {"l": "36-60", "obj": "Les mots, doses d’arsenic.", "sp": ["<b>Les mots, doses d’arsenic.</b> Dire « fanatique » au lieu d’« héroïque » pendant assez longtemps finit par changer la croyance. Le Reich change la valeur et la fréquence des mots."], "tr": ""}], "concl": ["Le texte se demande : « Comment le langage peut-il servir de moyen de propagande ? » Klemperer répond ainsi : Le moyen de propagande le plus puissant n’est pas le discours explicite, mais la langue elle-même : adoptée inconsciemment, elle dirige les sentiments et change la valeur des mots, comme un poison à petites doses.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « Quel fut le moyen le plus puissant ? ; Une masse indifférente aux discours » puis « Le nazisme dans la chair et le sang ; La langue dirige mes sentiments » puis « Les mots, doses d’arsenic ».", "On peut enfin discuter cette thèse. Les mots influencent-ils nos pensées ? Le langage oriente-t-il notre jugement ? Comment s’en défendre ? (À comparer avec Austin et Wittgenstein.)"]}, {"id": "langage-saussure", "label": "Saussure : l’arbitraire du signe", "theme": "Le langage", "auteur": "Saussure", "oeuvre": "Cours de linguistique générale", "fiche": "langage-saussure.html", "lignes": ["Par « signifié », nous entendons le concept, la", "représentation mentale, autrement dit ce que nous", "voulons dire. Le « signifiant », à l’inverse, est", "l’expression sonore, linguistique, de ce signifié. Le", "problème tiendrait alors dans l’arbitraire du signe", "linguistique : il n’y a pas de lien naturel entre", "signifié et signifiant. C’est ce que soutient Saussure", ":", "Le lien unissant le signifiant au signifié est", "arbitraire, ou encore, puisque nous entendons par", "signe le total résultant de l’association d’un", "signifiant à un signifié, nous pouvons dire plus", "simplement : le signe linguistique est arbitraire.", "Ainsi l’idée de « sœur » n’est liée par aucun rapport", "intérieur avec la suite de sons s-ö-r, qui lui sert de", "signifiant ; il pourrait être aussi bien représenté", "par n’importe quel autre : à preuve les différences", "entre les langues et l’existence même de langues", "différentes. [...]", "On s’est servi du mot symbole pour désigner le singe", "linguistique, ou, plus exactement, ce que nous", "appelons le signifiant. [...] Le symbole a pour", "caractéristique de n’être jamais tout à fait", "arbitraire ; il n’est pas vide, il y a un rudiment de", "lien naturel entre le signifiant et le signifié. Le", "symbole de la justice, la balance, ne pourrait pas", "être remplacé par n’importe quoi, un char, par", "exemple."], "mots": "Mots-clés : Signifié, Signifiant, Signe linguistique.", "lire": "<p><b>Objet du texte.</b> Le rapport entre un mot et son sens est-il naturel ou conventionnel ? <b>Notion du programme.</b> Le langage.</p><p><b>Connecteurs repérés.</b> « alors » (l.5), « puisque » (l.10), « ainsi » (l.14). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Signifié</i> : le concept, la représentation mentale : ce que l’on veut dire. ; <i>Signifiant</i> : l’expression sonore du signifié : l’image acoustique. ; <i>Signe linguistique</i> : association d’un signifiant et d’un signifié.</p>", "these": "<p><b>Thèse.</b> Le signe linguistique est arbitraire : rien ne lie naturellement le signifiant au signifié. La diversité des langues le prouve. À la différence du symbole, qui garde un lien naturel.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « Signifié et signifiant » ; « Le lien est arbitraire » ; « L’exemple de « sœur » » ; « La preuve : la diversité des langues » ; « Le symbole n’est pas arbitraire ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-8", "idee": "Signifié et signifiant.", "args": "Le signifié est le concept ; le signifiant, son expression sonore.", "lien": "Après avoir défini signifié et signifiant, Saussure pose que le lien qui les unit est arbitraire, ce qu’il prouve par l’exemple de « sœur » et par la diversité des langues."}, {"l": "9-19", "idee": "Le lien est arbitraire ; L’exemple de « sœur » ; La preuve : la diversité des langues.", "args": "Il n’y a pas de lien naturel entre les deux. Le signe, total de leur association, est arbitraire. L’idée de « sœur » n’est liée par aucun rapport intérieur à la suite de sons s-ö-r : elle pourrait être représentée par n’importe quel autre. Les différences entre les langues et l’existence même de langues différentes le montrent.", "lien": "Si le signe est arbitraire, il faut le distinguer du symbole, qui garde un lien naturel."}, {"l": "19-28", "idee": "Le symbole n’est pas arbitraire.", "args": "Il garde un rudiment de lien naturel : la balance, symbole de la justice, ne pourrait pas être remplacée par un char.", "lien": "Le symbole (la balance de la justice) n’est pas arbitraire : cette différence précise la thèse."}], "concepts": [{"c": "Signifié", "s": "Le concept, la représentation mentale : ce que l’on veut dire."}, {"c": "Signifiant", "s": "L’expression sonore du signifié : l’image acoustique."}, {"c": "Signe linguistique", "s": "Association d’un signifiant et d’un signifié."}], "probleme": "<p><b>L’opinion remise en cause.</b> Qu’un mot aurait un lien naturel avec la chose qu’il désigne.</p><p><b>Le problème.</b> Le rapport entre un mot et son sens est-il naturel ou conventionnel ?</p><p><b>L’enjeu.</b> Cette thèse n’est pas évidente : si le lien est arbitraire, comment les mots peuvent-ils servir à se comprendre ?</p><p><b>Formule.</b> « On dit souvent qu’un mot aurait un lien naturel avec la chose qu’il désigne, mais Saussure soutient : Le signe linguistique est arbitraire : rien ne lie naturellement le signifiant au signifié. »</p><p><b>Discussion.</b> Tout est-il arbitraire dans la langue ? Les onomatopées semblent motivées. L’arbitraire est-il absolu ?</p>", "intro": ["On croit souvent qu’un mot a un lien naturel avec ce qu’il désigne, comme si le nom d’une chose lui convenait par nature. Dans le <i>Cours de linguistique générale</i>, Saussure soutient que le signe linguistique est arbitraire.", "Saussure soutient la thèse suivante : Le signe linguistique est arbitraire : rien ne lie naturellement le signifiant au signifié. La diversité des langues le prouve. À la différence du symbole, qui garde un lien naturel. Cette thèse n’est pas évidente : si le lien est arbitraire, comment les mots peuvent-ils servir à se comprendre ?", "Le texte avance en trois temps. Des lignes 1 à 8 : « Signifié et signifiant ». Des lignes 9 à 19 : « Le lien est arbitraire » ; « L’exemple de « sœur » » ; « La preuve : la diversité des langues ». Des lignes 19 à 28 : « Le symbole n’est pas arbitraire »."], "dev": [{"l": "1-8", "obj": "Signifié et signifiant.", "sp": ["<b>Signifié et signifiant.</b> Le signifié est le concept ; le signifiant, son expression sonore."], "tr": "Après avoir défini signifié et signifiant, Saussure pose que le lien qui les unit est arbitraire, ce qu’il prouve par l’exemple de « sœur » et par la diversité des langues."}, {"l": "9-19", "obj": "Le lien est arbitraire ; L’exemple de « sœur » ; La preuve : la diversité des langues.", "sp": ["<b>Le lien est arbitraire.</b> Il n’y a pas de lien naturel entre les deux. Le signe, total de leur association, est arbitraire.", "<b>L’exemple de « sœur ».</b> L’idée de « sœur » n’est liée par aucun rapport intérieur à la suite de sons s-ö-r : elle pourrait être représentée par n’importe quel autre.", "<b>La preuve : la diversité des langues.</b> Les différences entre les langues et l’existence même de langues différentes le montrent."], "tr": "Si le signe est arbitraire, il faut le distinguer du symbole, qui garde un lien naturel."}, {"l": "19-28", "obj": "Le symbole n’est pas arbitraire.", "sp": ["<b>Le symbole n’est pas arbitraire.</b> Il garde un rudiment de lien naturel : la balance, symbole de la justice, ne pourrait pas être remplacée par un char."], "tr": ""}], "concl": ["Le texte se demande : « Le rapport entre un mot et son sens est-il naturel ou conventionnel ? » Saussure répond ainsi : Le signe linguistique est arbitraire : rien ne lie naturellement le signifiant au signifié. La diversité des langues le prouve. À la différence du symbole, qui garde un lien naturel.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « Signifié et signifiant » puis « Le lien est arbitraire ; L’exemple de « sœur » ; La preuve : la diversité des langues » puis « Le symbole n’est pas arbitraire ».", "On peut enfin discuter cette thèse. Tout est-il arbitraire dans la langue ? Les onomatopées semblent motivées. L’arbitraire est-il absolu ?"]}, {"id": "langage-wittgenstein", "label": "Wittgenstein : usage et signification", "theme": "Le langage", "auteur": "Wittgenstein", "oeuvre": "Le Cahier bleu", "fiche": "langage-wittgenstein.html", "lignes": ["Philosopher, dans le sens où nous employons ce terme,", "c’est d’abord lutter contre la fascination qu’exercent", "sur nous certaines formes d’expression.", "N’oubliez jamais que les mots n’ont d’autre", "signification que celle que vous leur avez donnée, et", "ce sens ils le tiennent de nos explications. Je puis", "donner la définition d’un mot et l’utiliser selon les", "termes de cette définition ; ou ceux qui m’apprennent", "l’usage du mot peuvent me donner les explications", "nécessaires. Ou encore nous pouvons entendre par", "explication du mot tout ce que, lorsqu’on nous", "interroge, il nous est possible d’expliquer.", "J’entends, lorsque nous sommes prêts à donner une", "explication, car, dans la plupart des cas, nous ne le", "sommes pas. Ainsi, nombreux sont les mots qui n’ont", "pas un sens très précis. Mais ce n’est pas là un", "défaut. [...]", "Souvenons-nous que c’est nous qui avons donné leur", "sens aux mots, qu’ils ne le tiennent pas d’une", "puissance indépendante. Un mot a le sens qui lui est", "donné par quelqu’un."], "mots": "Mots-clés : Usage, Explication, Fascination.", "lire": "<p><b>Objet du texte.</b> Les mots ont-ils un sens par eux-mêmes ? <b>Notion du programme.</b> Le langage.</p><p><b>Connecteurs repérés.</b> « car » (l.14), « ainsi » (l.15), « mais » (l.16). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Usage</i> : la manière dont on emploie un mot : elle détermine sa signification. ; <i>Explication</i> : ce que l’on peut dire pour clarifier le sens d’un mot lorsqu’on nous interroge. ; <i>Fascination</i> : pouvoir trompeur de certaines expressions, qui nous font croire à des essences.</p>", "these": "<p><b>Thèse.</b> Les mots n’ont pas de sens indépendant : c’est nous qui leur donnons leur signification, par nos définitions et nos explications. Un sens imprécis n’est pas un défaut.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « Philosopher, c’est lutter contre une fascination » ; « Les mots n’ont que le sens qu’on leur donne » ; « Le sens vient de nos explications » ; « Beaucoup de mots sont imprécis » ; « Pas de puissance indépendante ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-6", "idee": "Philosopher, c’est lutter contre une fascination ; Les mots n’ont que le sens qu’on leur donne.", "args": "Contre la fascination qu’exercent certaines formes d’expression. « N’oubliez jamais que les mots n’ont d’autre signification que celle que vous leur avez donnée ».", "lien": "Après avoir posé que les mots n’ont que le sens qu’on leur donne, Wittgenstein montre d’où vient ce sens : de nos définitions et de nos explications."}, {"l": "6-12", "idee": "Le sens vient de nos explications.", "args": "On peut définir un mot, ou être instruit de son usage par d’autres. Le sens est ce que l’on peut expliquer.", "lien": "Si le sens vient de nos explications, beaucoup de mots sont imprécis, mais ce n’est pas un défaut."}, {"l": "13-21", "idee": "Beaucoup de mots sont imprécis ; Pas de puissance indépendante.", "args": "Dans la plupart des cas, nous ne sommes pas prêts à donner une explication. Mais ce n’est pas un défaut. Les mots ne tiennent pas leur sens d’une puissance indépendante : un mot a le sens qui lui est donné par quelqu’un.", "lien": "Aucun mot n’a donc de puissance indépendante : il a le sens qui lui est donné."}], "concepts": [{"c": "Usage", "s": "La manière dont on emploie un mot : elle détermine sa signification."}, {"c": "Explication", "s": "Ce que l’on peut dire pour clarifier le sens d’un mot lorsqu’on nous interroge."}, {"c": "Fascination", "s": "Pouvoir trompeur de certaines expressions, qui nous font croire à des essences."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que les mots auraient un sens par eux-mêmes, une puissance qui leur serait propre.</p><p><b>Le problème.</b> Les mots ont-ils un sens par eux-mêmes ?</p><p><b>L’enjeu.</b> Cette thèse n’est pas évidente : si le sens dépend de nous, comment des mots peuvent-ils être imprécis sans être défectueux ?</p><p><b>Formule.</b> « On dit souvent que les mots auraient un sens par eux-mêmes, une puissance qui leur serait propre, mais Wittgenstein soutient : Les mots n’ont pas de sens indépendant : c’est nous qui leur donnons leur signification, par nos définitions et nos explications. »</p><p><b>Discussion.</b> Qui donne le sens ? Chaque locuteur ? la communauté ? Le sens est-il privé ou partagé ? (À comparer avec Saussure.)</p>", "intro": ["On croit souvent que les mots ont un sens par eux-mêmes, comme une puissance qui leur serait propre. Dans <i>Le Cahier bleu</i>, Wittgenstein soutient que les mots n’ont d’autre signification que celle que nous leur donnons.", "Wittgenstein soutient la thèse suivante : Les mots n’ont pas de sens indépendant : c’est nous qui leur donnons leur signification, par nos définitions et nos explications. Un sens imprécis n’est pas un défaut. Cette thèse n’est pas évidente : si le sens dépend de nous, comment des mots peuvent-ils être imprécis sans être défectueux ?", "Le texte avance en trois temps. Des lignes 1 à 6 : « Philosopher, c’est lutter contre une fascination » ; « Les mots n’ont que le sens qu’on leur donne ». Des lignes 6 à 12 : « Le sens vient de nos explications ». Des lignes 13 à 21 : « Beaucoup de mots sont imprécis » ; « Pas de puissance indépendante »."], "dev": [{"l": "1-6", "obj": "Philosopher, c’est lutter contre une fascination ; Les mots n’ont que le sens qu’on leur donne.", "sp": ["<b>Philosopher, c’est lutter contre une fascination.</b> Contre la fascination qu’exercent certaines formes d’expression.", "<b>Les mots n’ont que le sens qu’on leur donne.</b> « N’oubliez jamais que les mots n’ont d’autre signification que celle que vous leur avez donnée »."], "tr": "Après avoir posé que les mots n’ont que le sens qu’on leur donne, Wittgenstein montre d’où vient ce sens : de nos définitions et de nos explications."}, {"l": "6-12", "obj": "Le sens vient de nos explications.", "sp": ["<b>Le sens vient de nos explications.</b> On peut définir un mot, ou être instruit de son usage par d’autres. Le sens est ce que l’on peut expliquer."], "tr": "Si le sens vient de nos explications, beaucoup de mots sont imprécis, mais ce n’est pas un défaut."}, {"l": "13-21", "obj": "Beaucoup de mots sont imprécis ; Pas de puissance indépendante.", "sp": ["<b>Beaucoup de mots sont imprécis.</b> Dans la plupart des cas, nous ne sommes pas prêts à donner une explication. Mais ce n’est pas un défaut.", "<b>Pas de puissance indépendante.</b> Les mots ne tiennent pas leur sens d’une puissance indépendante : un mot a le sens qui lui est donné par quelqu’un."], "tr": ""}], "concl": ["Le texte se demande : « Les mots ont-ils un sens par eux-mêmes ? » Wittgenstein répond ainsi : Les mots n’ont pas de sens indépendant : c’est nous qui leur donnons leur signification, par nos définitions et nos explications. Un sens imprécis n’est pas un défaut.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « Philosopher, c’est lutter contre une fascination ; Les mots n’ont que le sens qu’on leur donne » puis « Le sens vient de nos explications » puis « Beaucoup de mots sont imprécis ; Pas de puissance indépendante ».", "On peut enfin discuter cette thèse. Qui donne le sens ? Chaque locuteur ? la communauté ? Le sens est-il privé ou partagé ? (À comparer avec Saussure.)"]}, {"id": "nature-aristote", "label": "Aristote : voix, parole et langage animal", "theme": "La nature", "auteur": "Aristote", "oeuvre": "La Politique", "fiche": "nature-aristote.html", "lignes": ["Que l'homme soit un animal politique à un plus haut", "degré qu'une abeille quelconque ou tout autre animal", "vivant à l'état grégaire, cela est évident. La nature,", "en effet, selon nous, ne fait rien en vain ; et", "l'homme, seul de tous les animaux, possède la parole.", "Or, tandis que la voix ne sert qu'à indiquer la joie", "et la peine, et appartient pour ce motif aux autres", "animaux également (car leur nature va jusqu'à éprouver", "les sensations de plaisir et de douleur, et à se les", "signifier les uns aux autres), le discours (logos)", "sert à exprimer l'utile et le nuisible, et, par suite", "aussi, le juste et l'injuste: car c'est le caractère", "propre de l'homme par rapport aux autres animaux", "d'être le seul à avoir le sentiment du bien et du mal,", "du juste et de l'injuste, et des autres notions", "morales, et c'est la communauté de ces sentiments qui", "engendre famille et cité."], "mots": "Mots-clés : Animal politique, Voix (phônè), Discours (logos).", "lire": "<p><b>Objet du texte.</b> Qu’est-ce qui rend l’homme plus politique que les autres animaux sociables ? <b>Notion du programme.</b> La nature.</p><p><b>Connecteurs repérés.</b> « en effet » (l.4), « or » (l.6), « car » (l.8). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Animal politique</i> : être qui vit naturellement en cité. La politique n’est pas artificielle : elle est conforme à la nature de l’homme. ; <i>Voix (phônè)</i> : son qui exprime des sensations, comme le plaisir et la douleur. Les animaux en disposent aussi. ; <i>Discours (logos)</i> : parole raisonnée, qui permet de dire ce qui est utile, nuisible, juste ou injuste.</p>", "these": "<p><b>Thèse.</b> L’homme est un animal politique à un plus haut degré que l’abeille, car il possède le discours. Ce dernier exprime le juste et l’injuste, et la communauté de ces sentiments engendre famille et cité.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « L’homme, plus politique que l’abeille » ; « La nature ne fait rien en vain » ; « La voix exprime plaisir et douleur » ; « Le discours exprime l’utile et le juste » ; « La communauté de ces sentiments fonde la cité ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-5", "idee": "L’homme, plus politique que l’abeille ; La nature ne fait rien en vain.", "args": "Aristote affirme qu’il est évident que l’homme est un animal politique à un plus haut degré que les abeilles ou les autres animaux vivant en troupeau. Il s’appuie sur un principe : la nature est finalisée. Si l’homme est le seul à posséder la parole, c’est qu’elle a une fonction.", "lien": "Après avoir posé que l’homme est plus politique que l’abeille, Aristote donne la raison : la nature ne fait rien en vain, et elle a donné le discours à l’homme seul."}, {"l": "6-17", "idee": "La voix exprime plaisir et douleur ; Le discours exprime l’utile et le juste ; La communauté de ces sentiments fonde la cité.", "args": "Les autres animaux ont une voix pour indiquer la joie et la peine, car ils ressentent plaisir et douleur et peuvent se les signifier. Le logos sert à exprimer l’utile et le nuisible, et par suite le juste et l’injuste. L’homme est le seul à avoir le sentiment du bien et du mal. Leur partage engendre famille et cité.", "lien": "Le discours, qui exprime l’utile, le juste et l’injuste, fonde la communauté : c’est la thèse."}], "concepts": [{"c": "Animal politique", "s": "Être qui vit naturellement en cité. La politique n’est pas artificielle : elle est conforme à la nature de l’homme."}, {"c": "Voix (phônè)", "s": "Son qui exprime des sensations, comme le plaisir et la douleur. Les animaux en disposent aussi."}, {"c": "Discours (logos)", "s": "Parole raisonnée, qui permet de dire ce qui est utile, nuisible, juste ou injuste."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que l’homme ne serait qu’un animal social parmi d’autres, comme l’abeille.</p><p><b>Le problème.</b> Qu’est-ce qui rend l’homme plus politique que les autres animaux sociables ?</p><p><b>L’enjeu.</b> Cette thèse n’est pas évidente : en quoi le discours distingue-t-il l’homme de l’abeille ?</p><p><b>Formule.</b> « On dit souvent que l’homme ne serait qu’un animal social parmi d’autres, comme l’abeille, mais Aristote soutient : L’homme est un animal politique à un plus haut degré que l’abeille, car il possède le discours. »</p><p><b>Discussion.</b> Les animaux ont-ils un langage ? Aristote réserve le logos à l’homme. Les recherches actuelles sur la communication animale remettent-elles cette frontière en question ?</p>", "intro": ["On dit souvent que l’homme n’est qu’un animal social parmi d’autres, comme l’abeille. Dans <i>La Politique</i>, Aristote soutient que l’homme est un animal politique à un plus haut degré, parce qu’il possède le discours.", "Aristote soutient la thèse suivante : L’homme est un animal politique à un plus haut degré que l’abeille, car il possède le discours. Ce dernier exprime le juste et l’injuste, et la communauté de ces sentiments engendre famille et cité. Cette thèse n’est pas évidente : en quoi le discours distingue-t-il l’homme de l’abeille ?", "Le texte avance en deux temps. Des lignes 1 à 5 : « L’homme, plus politique que l’abeille » ; « La nature ne fait rien en vain ». Des lignes 6 à 17 : « La voix exprime plaisir et douleur » ; « Le discours exprime l’utile et le juste » ; « La communauté de ces sentiments fonde la cité »."], "dev": [{"l": "1-5", "obj": "L’homme, plus politique que l’abeille ; La nature ne fait rien en vain.", "sp": ["<b>L’homme, plus politique que l’abeille.</b> Aristote affirme qu’il est évident que l’homme est un animal politique à un plus haut degré que les abeilles ou les autres animaux vivant en troupeau.", "<b>La nature ne fait rien en vain.</b> Il s’appuie sur un principe : la nature est finalisée. Si l’homme est le seul à posséder la parole, c’est qu’elle a une fonction."], "tr": "Après avoir posé que l’homme est plus politique que l’abeille, Aristote donne la raison : la nature ne fait rien en vain, et elle a donné le discours à l’homme seul."}, {"l": "6-17", "obj": "La voix exprime plaisir et douleur ; Le discours exprime l’utile et le juste ; La communauté de ces sentiments fonde la cité.", "sp": ["<b>La voix exprime plaisir et douleur.</b> Les autres animaux ont une voix pour indiquer la joie et la peine, car ils ressentent plaisir et douleur et peuvent se les signifier.", "<b>Le discours exprime l’utile et le juste.</b> Le logos sert à exprimer l’utile et le nuisible, et par suite le juste et l’injuste.", "<b>La communauté de ces sentiments fonde la cité.</b> L’homme est le seul à avoir le sentiment du bien et du mal. Leur partage engendre famille et cité."], "tr": ""}], "concl": ["Le texte se demande : « Qu’est-ce qui rend l’homme plus politique que les autres animaux sociables ? » Aristote répond ainsi : L’homme est un animal politique à un plus haut degré que l’abeille, car il possède le discours. Ce dernier exprime le juste et l’injuste, et la communauté de ces sentiments engendre famille et cité.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « L’homme, plus politique que l’abeille ; La nature ne fait rien en vain » puis « La voix exprime plaisir et douleur ; Le discours exprime l’utile et le juste ; La communauté de ces sentiments fonde la cité ».", "On peut enfin discuter cette thèse. Les animaux ont-ils un langage ? Aristote réserve le logos à l’homme. Les recherches actuelles sur la communication animale remettent-elles cette frontière en question ?"]}, {"id": "nature-descartes", "label": "Descartes : maîtres et possesseurs de la nature", "theme": "La nature", "auteur": "Descartes", "oeuvre": "Discours de la méthode (VIe partie)", "fiche": "nature-descartes.html", "lignes": ["Sitôt que j’ai eu acquis quelques notions générales", "touchant la physique, et que commençant à les éprouver", "en diverses difficultés particulières, j’ai remarqué", "jusques où elles peuvent conduire, et combien elles", "diffèrent des principes dont on s’est servi jusqu’à", "présent, j’ai cru que je ne pouvais les tenir cachées", "sans pécher grandement contre la loi qui nous oblige à", "procurer, autant qu’il est en nous, le bien général de", "tous les hommes. Car elles m’ont fait voir qu’il est", "possible de parvenir à des connaissances qui soient", "fort utiles à la vie, et qu’au lieu de cette", "philosophie spéculative, qu’on enseigne dans les", "écoles, on peut en trouver une pratique, par laquelle", "connaissant la force et les actions du feu, de l’eau,", "de l’air, des astres, des cieux et de tous les autres", "corps qui nous environnent, aussi distinctement que", "nous connaissons les divers métiers de nos artisans,", "nous les pourrions employer en même façon à tous les", "usages auxquels ils sont propres et ainsi nous rendre", "comme maîtres et possesseurs de la nature.", "Ce qui n’est pas seulement à désirer pour l’invention", "d’une infinité d’artifices, qui feraient qu’on", "jouirait, sans aucune peine, des fruits de la terre et", "de toutes les commodités qui s’y trouvent, mais", "principalement aussi pour la conservation de la santé,", "laquelle est sans doute le premier bien et le", "fondement de tous les autres biens de cette vie ; car", "même l’esprit dépend si fort du tempérament, et de la", "disposition des organes du corps que, s’il est", "possible de trouver quelque moyen qui rende", "communément les hommes plus sages et plus habiles", "qu’ils n’ont été jusque ici, je crois que c’est dans", "la médecine qu’on doit le chercher."], "mots": "Mots-clés : Philosophie spéculative, Philosophie pratique, Maîtres et possesseurs.", "lire": "<p><b>Objet du texte.</b> À quoi doit servir la connaissance de la nature ? <b>Notion du programme.</b> La nature.</p><p><b>Connecteurs repérés.</b> « car » (l.9), « ainsi » (l.19), « mais » (l.24), « si… » (l.28). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Philosophie spéculative</i> : savoir purement théorique, qui cherche à comprendre sans chercher d’application. ; <i>Philosophie pratique</i> : savoir fondé sur la connaissance des corps et destiné à servir la vie humaine. ; <i>Maîtres et possesseurs</i> : formule qui exprime l’idée de commander à la nature et de l’utiliser, comme on dispose de ce qui nous appartient. Le « comme » indique une maîtrise par la connaissance.</p>", "these": "<p><b>Thèse.</b> La physique
