s de l’expérience : régime, économie, politesse, réserve. Les impératifs de la prudence sont des conseils, non des commandements. Le bonheur est un idéal de l’imagination.", "lien": "Il n’y a donc pas d’impératif strict du bonheur : la thèse porte sur la possibilité d’en faire un devoir."}], "concepts": [{"c": "Concept indéterminé", "s": "Notion dont on ne peut fixer précisément le contenu."}, {"c": "Conseil empirique", "s": "Recommandation tirée de l’expérience, sans valeur de loi."}, {"c": "Impératif de la prudence", "s": "Règle qui conseille ce qu’il faut faire pour être heureux."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que chacun saurait ce qui le rendrait heureux, et pourrait en faire un but ou un devoir.</p><p><b>Le problème.</b> Peut-on déterminer ce qui rend heureux et en faire un devoir ?</p><p><b>L’enjeu.</b> Cette thèse n’est pas évidente : si nul ne peut dire ce qui le rendrait heureux, peut-on encore chercher le bonheur ?</p><p><b>Formule.</b> « On dit souvent que chacun saurait ce qui le rendrait heureux, et pourrait en faire un but ou un devoir, mais Kant soutient : Le bonheur est un concept indéterminé : aucun être fini ne peut dire avec certitude ce qui le rendrait heureux. »</p><p><b>Discussion.</b> Le bonheur est-il un but raisonnable ? Si on ne sait pas ce qu’on veut, peut-on viser le bonheur ? (À comparer avec Épicure.)</p>", "intro": ["On croit souvent que chacun sait ce qui le rendrait heureux, et que devenir heureux est un but comme un autre. Dans les <i>Fondements de la métaphysique des mœurs</i>, Kant montre que le bonheur est un concept indéterminé.", "Kant soutient la thèse suivante : Le bonheur est un concept indéterminé : aucun être fini ne peut dire avec certitude ce qui le rendrait heureux. On ne peut donc pas agir selon des principes, mais selon des conseils empiriques. Il n’y a pas d’impératif strict du bonheur. Cette thèse n’est pas évidente : si nul ne peut dire ce qui le rendrait heureux, peut-on encore chercher le bonheur ?", "Le texte avance en trois temps. Des lignes 1 à 7 : « Un concept indéterminé ». Des lignes 8 à 25 : « Les exemples » ; « Il faudrait l’omniscience ». Des lignes 25 à 46 : « Des conseils empiriques » ; « Pas d’impératif du bonheur »."], "dev": [{"l": "1-7", "obj": "Un concept indéterminé.", "sp": ["<b>Un concept indéterminé.</b> Tout homme désire être heureux, mais personne ne peut dire en termes précis et cohérents ce qu’il veut."], "tr": "Après avoir posé que le bonheur est indéterminé, Kant le montre par des exemples (richesse, savoir, vie longue, santé) qui peuvent tous mal tourner."}, {"l": "8-25", "obj": "Les exemples ; Il faudrait l’omniscience.", "sp": ["<b>Les exemples.</b> La richesse apporte soucis et envie ; la connaissance, des maux plus visibles ; une longue vie peut être une longue souffrance ; la santé peut conduire à des excès.", "<b>Il faudrait l’omniscience.</b> Il est impossible de déterminer avec certitude ce qui rendrait véritablement heureux : il faudrait tout savoir."], "tr": "Si personne ne peut déterminer ce qui le rendrait heureux, on ne peut suivre que des conseils empiriques, jamais des principes."}, {"l": "25-46", "obj": "Des conseils empiriques ; Pas d’impératif du bonheur.", "sp": ["<b>Des conseils empiriques.</b> On ne peut agir que d’après des conseils tirés de l’expérience : régime, économie, politesse, réserve.", "<b>Pas d’impératif du bonheur.</b> Les impératifs de la prudence sont des conseils, non des commandements. Le bonheur est un idéal de l’imagination."], "tr": ""}], "concl": ["Le texte se demande : « Peut-on déterminer ce qui rend heureux et en faire un devoir ? » Kant répond ainsi : Le bonheur est un concept indéterminé : aucun être fini ne peut dire avec certitude ce qui le rendrait heureux. On ne peut donc pas agir selon des principes, mais selon des conseils empiriques. Il n’y a pas d’impératif strict du bonheur.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « Un concept indéterminé » puis « Les exemples ; Il faudrait l’omniscience » puis « Des conseils empiriques ; Pas d’impératif du bonheur ».", "On peut enfin discuter cette thèse. Le bonheur est-il un but raisonnable ? Si on ne sait pas ce qu’on veut, peut-on viser le bonheur ? (À comparer avec Épicure.)"]}, {"id": "bonheur-kant-digne", "label": "Kant : se rendre digne du bonheur", "theme": "Le bonheur", "auteur": "Kant", "oeuvre": "Critique de la raison pratique", "fiche": "bonheur-kant-digne.html", "lignes": ["La morale n'est donc pas à proprement parler la", "doctrine qui nous enseigne comment nous devons nous", "rendre heureux, mais comment nous devons nous rendre", "dignes du bonheur. C'est seulement lorsque la religion", "s'y ajoute, qu'entre en nous l'espérance de participer", "un jour au bonheur dans la mesure où nous avons essayé", "de n'en être pas indignes.", "Quelqu'un est digne de posséder une chose ou un état,", "quand le fait qu'il la possède est en harmonie avec le", "souverain bien. On peut maintenant voir facilement que", "tout ce qui nous donne la dignité dépend de la", "conduite morale, parce que celle-ci constitue dans le", "concept du souverain bien la condition du reste (& ce", "qui appartient à l'état de la personne), à savoir la", "condition de la participation au bonheur. Il suit donc", "de là qu'on ne doit jamais traiter la morale en soi", "comme une doctrine du bonheur, c'est-à-dire comme une", "doctrine qui nous apprendrait comment devenir heureux,", "car elle n'a exclusivement affaire qu'à la condition", "rationnelle (conditio sine qua non) du bonheur et non", "à un moyen de l'obtenir. Mais quand elle a été exposée", "complètement (elle qui impose simplement des devoirs", "et ne donne pas de règles à des désirs intéressés),", "quand s'est éveillé le désir moral, qui se fonde sur", "une loi, de travailler au souverain bien (de nous", "procurer le royaume de Dieu), désir qui n'a pu", "auparavant naître dans une âme intéressée, quand, pour", "venir en aide à ce désir, le premier pas vers la", "religion a été fait, alors seulement cette doctrine", "morale peut être appelée aussi doctrine du bonheur,", "parce que l'espoir d'obtenir ce bonheur ne commence", "qu'avec la religion."], "mots": "Mots-clés : Digne du bonheur, Souverain bien, Condition rationnelle.", "lire": "<p><b>Objet du texte.</b> Quel rapport y a-t-il entre moralité et bonheur ? <b>Notion du programme.</b> Le bonheur.</p><p><b>Connecteurs repérés.</b> « donc » (l.1), « mais » (l.3), « parce que » (l.12), « car » (l.19), « alors » (l.29). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Digne du bonheur</i> : qui mérite d’être heureux par sa conduite morale. ; <i>Souverain bien</i> : union de la vertu et du bonheur proportionné. ; <i>Condition rationnelle</i> : ce sans quoi le bonheur ne serait pas mérité.</p>", "these": "<p><b>Thèse.</b> La morale n’enseigne pas à devenir heureux mais à se rendre digne du bonheur. Elle est la condition du bonheur, non un moyen. L’espérance d’y participer vient avec la religion, selon le souverain bien.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « Digne, non heureux » ; « L’espérance religieuse » ; « Digne : en harmonie avec le souverain bien » ; « Condition, non moyen » ; « Un désir moral d’abord ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-7", "idee": "Digne, non heureux ; L’espérance religieuse.", "args": "La morale n’est pas la doctrine du bonheur mais de la dignité d’être heureux. C’est lorsque la religion s’y ajoute que naît l’espérance de participer un jour au bonheur, dans la mesure où nous avons essayé de n’en être pas indignes.", "lien": "De la distinction entre devenir heureux et se rendre digne du bonheur, on passe à ce que « digne » veut dire : l’harmonie avec le souverain bien."}, {"l": "8-21", "idee": "Digne : en harmonie avec le souverain bien ; Condition, non moyen.", "args": "Être digne, c’est posséder une chose en harmonie avec le souverain bien. La dignité dépend de la conduite morale. La morale n’a affaire qu’à la condition rationnelle du bonheur, non à un moyen de l’obtenir.", "lien": "Si la morale est la condition et non le moyen du bonheur, elle doit être voulue pour elle-même : le désir moral précède le désir de bonheur."}, {"l": "21-32", "idee": "Un désir moral d’abord.", "args": "Quand s’éveille le désir moral de travailler au souverain bien, alors seulement la morale peut être appelée aussi doctrine du bonheur, car l’espoir ne commence qu’avec la religion.", "lien": "Ce dernier temps fixe la thèse : on doit d’abord vouloir la morale, puis seulement espérer le bonheur."}], "concepts": [{"c": "Digne du bonheur", "s": "Qui mérite d’être heureux par sa conduite morale."}, {"c": "Souverain bien", "s": "Union de la vertu et du bonheur proportionné."}, {"c": "Condition rationnelle", "s": "Ce sans quoi le bonheur ne serait pas mérité."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que la morale serait un moyen de devenir heureux.</p><p><b>Le problème.</b> Quel rapport y a-t-il entre moralité et bonheur ?</p><p><b>L’enjeu.</b> Cette thèse n’est pas évidente : si la morale ne rend pas heureux, pourquoi le bonheur reste-t-il un objet d’espérance ?</p><p><b>Formule.</b> « On dit souvent que la morale serait un moyen de devenir heureux, mais Kant soutient : La morale n’enseigne pas à devenir heureux mais à se rendre digne du bonheur. »</p><p><b>Discussion.</b> Mériter d’être heureux ? Faut-il mériter son bonheur ? Qu’en est-il des innocents malheureux ? (À comparer avec Kant sur la religion.)</p>", "intro": ["On croit souvent que la morale sert à devenir heureux : être honnête finirait par payer. Dans la <i>Critique de la raison pratique</i>, Kant soutient que la morale n’apprend pas à être heureux mais à s’en rendre digne.", "Kant soutient la thèse suivante : La morale n’enseigne pas à devenir heureux mais à se rendre digne du bonheur. Elle est la condition du bonheur, non un moyen. L’espérance d’y participer vient avec la religion, selon le souverain bien. Cette thèse n’est pas évidente : si la morale ne rend pas heureux, pourquoi le bonheur reste-t-il un objet d’espérance ?", "Le texte avance en trois temps. Des lignes 1 à 7 : « Digne, non heureux » ; « L’espérance religieuse ». Des lignes 8 à 21 : « Digne : en harmonie avec le souverain bien » ; « Condition, non moyen ». Des lignes 21 à 32 : « Un désir moral d’abord »."], "dev": [{"l": "1-7", "obj": "Digne, non heureux ; L’espérance religieuse.", "sp": ["<b>Digne, non heureux.</b> La morale n’est pas la doctrine du bonheur mais de la dignité d’être heureux.", "<b>L’espérance religieuse.</b> C’est lorsque la religion s’y ajoute que naît l’espérance de participer un jour au bonheur, dans la mesure où nous avons essayé de n’en être pas indignes."], "tr": "De la distinction entre devenir heureux et se rendre digne du bonheur, on passe à ce que « digne » veut dire : l’harmonie avec le souverain bien."}, {"l": "8-21", "obj": "Digne : en harmonie avec le souverain bien ; Condition, non moyen.", "sp": ["<b>Digne : en harmonie avec le souverain bien.</b> Être digne, c’est posséder une chose en harmonie avec le souverain bien. La dignité dépend de la conduite morale.", "<b>Condition, non moyen.</b> La morale n’a affaire qu’à la condition rationnelle du bonheur, non à un moyen de l’obtenir."], "tr": "Si la morale est la condition et non le moyen du bonheur, elle doit être voulue pour elle-même : le désir moral précède le désir de bonheur."}, {"l": "21-32", "obj": "Un désir moral d’abord.", "sp": ["<b>Un désir moral d’abord.</b> Quand s’éveille le désir moral de travailler au souverain bien, alors seulement la morale peut être appelée aussi doctrine du bonheur, car l’espoir ne commence qu’avec la religion."], "tr": ""}], "concl": ["Le texte se demande : « Quel rapport y a-t-il entre moralité et bonheur ? » Kant répond ainsi : La morale n’enseigne pas à devenir heureux mais à se rendre digne du bonheur. Elle est la condition du bonheur, non un moyen. L’espérance d’y participer vient avec la religion, selon le souverain bien.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « Digne, non heureux ; L’espérance religieuse » puis « Digne : en harmonie avec le souverain bien ; Condition, non moyen » puis « Un désir moral d’abord ».", "On peut enfin discuter cette thèse. Mériter d’être heureux ? Faut-il mériter son bonheur ? Qu’en est-il des innocents malheureux ? (À comparer avec Kant sur la religion.)"]}, {"id": "bonheur-epictete", "label": "Épictète : les opinions troublent les hommes", "theme": "Le bonheur", "auteur": "Épictète", "oeuvre": "Manuel", "fiche": "bonheur-epictete.html", "lignes": ["III. [...] Devant chacune des choses qui te", "divertissent, qui servent à tes besoins, ou que tu", "aimes, n'oublie pas de te dire en toi-même ce qu'elle", "est véritablement. Commence par les plus petites. Si", "tu aimes un pot de terre, dis-toi que tu aimes un pot", "de terre ; et, s'il se casse, tu n'en seras point", "troublé. Si tu aimes ton fils ou ta femme, dis-toi à", "toi-même que tu aimes un être mortel ; et s'il vient à", "mourir, tu n'en seras point troublé. [...]", "V. Ce qui trouble les hommes, ce ne sont pas les", "choses, mais les opinions qu'ils en ont. Par exemple,", "la mort n'est point un mal, car, si elle en était un,", "elle aurait paru telle à Socrate ; mais l'opinion", "qu'on a que la mort est un mal, voilà le mal. Lors", "donc que nous sommes contrariés, troublés ou tristes,", "n'en accusons point d'autres que nous-mêmes, c'est-à-", "dire nos opinions. [...]", "XVI. Quand tu vois quelqu'un qui pleure, soit parce", "qu'il est en deuil, soit parce que son fils est au", "loin, soit parce qu'il a perdu ses biens, prends garde", "que ton imagination ne t'emporte et ne te séduise en", "te persuadant que cet homme est effectivement", "malheureux à cause de ces choses extérieures ; mais", "fais en toi-même cette distinction, que ce qui", "l'afflige, ce n'est point l'accident qui lui est", "arrivé, car un autre n'en est point ému, mais", "l'opinion qu'il en a. Si pourtant c'est nécessaire, ne", "refuse point de pleurer avec lui et de compatir à sa", "douleur par tes discours ; mais prends garde que ta", "compassion ne passe au-dedans et que tu ne sois", "affligé véritablement. [...]", "XX. Souviens-toi que ce n'est ni celui qui te dit des", "injures ni celui qui te frappe, qui t'outrage ; mais", "c'est l'opinion que tu as d'eux, et qui te les fait", "regarder comme des gens dont tu es outragé. Quand", "quelqu'un donc te chagrine et t'irrite, sache que ce", "n'est pas cet homme-là qui t'irrite, mais ton opinion.", "Efforce-toi donc, avant tout, de ne pas te laisser", "emporter par ton imagination ; car, si une fois tu", "gagnes du temps et quelque délai, tu seras plus", "facilement maître de toi-même. [...] XLIII. Chaque", "chose a deux anses : l'une, par où on peut la porter,", "l'autre, par où on ne le peut pas. Si ton frère donc", "te fait une injustice, ne le prends point par le côté", "de l'injustice qu'il te fait, car c'est l'anse par où", "on ne saurait ni le prendre ni le porter ; mais", "prends-le par cet autre côté, qu'il est ton frère, un", "homme qui a été élevé et nourri avec toi, et tu le", "prendras par le bon côté, qui te le rendra", "supportable."], "mots": "Mots-clés : Stoïcisme, Opinion, Imagination (représentation).", "lire": "<p><b>Objet du texte.</b> Comment éviter d’être troublé par ce qui nous arrive ? <b>Notion du programme.</b> Le bonheur.</p><p><b>Connecteurs repérés.</b> « si… » (l.4), « mais » (l.11), « car » (l.12), « donc » (l.15), « parce que » (l.19), « pourtant » (l.27). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Stoïcisme</i> : philosophie qui fait du bonheur la conséquence de ce qui dépend de nous. ; <i>Opinion</i> : jugement porté sur les choses, qui seul nous trouble. ; <i>Imagination (représentation)</i> : impression première que l’on doit examiner avant d’y consentir.</p>", "these": "<p><b>Thèse.</b> Ce n’est pas l’événement qui nous afflige, c’est l’opinion que nous en avons. En examinant ce que sont véritablement les choses, et en distinguant le côté supportable, on se rend maître de soi.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « Dire ce que sont les choses » ; « L’opinion fait le mal » ; « Compatir sans s’affliger » ; « Les injures n’outragent que par l’opinion » ; « Les deux anses ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-9", "idee": "Dire ce que sont les choses.", "args": "Se rappeler que le pot de terre est un pot de terre, et que ceux qu’on aime sont mortels : on ne sera pas troublé à leur perte.", "lien": "Après avoir demandé de dire ce que sont vraiment les choses, Épictète en tire le principe : l’opinion fait le mal, même dans la compassion."}, {"l": "9-31", "idee": "L’opinion fait le mal ; Compatir sans s’affliger.", "args": "La mort n’est pas un mal : si elle en était un, elle aurait paru telle à Socrate. L’opinion que la mort est un mal, voilà le mal. Devant quelqu’un qui pleure, on ne doit pas croire qu’il est malheureux à cause des choses extérieures : c’est son opinion. On peut pleurer avec lui mais sans être véritablement affligé.", "lien": "Si c’est l’opinion qui trouble, les injures aussi n’outragent que par l’opinion : on peut toujours choisir la bonne façon de voir."}, {"l": "32-50", "idee": "Les injures n’outragent que par l’opinion ; Les deux anses.", "args": "Ce n’est pas l’homme qui t’insulte qui t’outrage, mais l’opinion que tu en as. Gagner du temps aide à rester maître de soi. Chaque chose a deux anses. Un frère qui commet une injustice : le prendre par l’injustice est impossible ; le prendre par le fait qu’il est mon frère le rend supportable.", "lien": "Cette dernière étape illustre la thèse : chaque chose a deux anses, on la prend par la bonne et l’on reste maître de soi."}], "concepts": [{"c": "Stoïcisme", "s": "Philosophie qui fait du bonheur la conséquence de ce qui dépend de nous."}, {"c": "Opinion", "s": "Jugement porté sur les choses, qui seul nous trouble."}, {"c": "Imagination (représentation)", "s": "Impression première que l’on doit examiner avant d’y consentir."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que ce sont les événements qui nous rendent heureux ou malheureux.</p><p><b>Le problème.</b> Comment éviter d’être troublé par ce qui nous arrive ?</p><p><b>L’enjeu.</b> Le texte rassemble plusieurs maximes : il faut montrer ce qui les relie et comment elles forment un seul raisonnement.</p><p><b>Formule.</b> « On dit souvent que ce sont les événements qui nous rendent heureux ou malheureux, mais Épictète soutient : Ce n’est pas l’événement qui nous afflige, c’est l’opinion que nous en avons. »</p><p><b>Discussion.</b> Tout est-il affaire d’opinion ? Peut-on changer son jugement sur la douleur ou le deuil ? Le stoïcisme est-il réaliste ? (À comparer avec Descartes.)</p>", "intro": ["On dit souvent que ce sont les événements, ce qui nous arrive, qui nous rendent heureux ou malheureux. Dans ces maximes du <i>Manuel</i>, Épictète soutient que le trouble vient de l’opinion que nous nous faisons des choses.", "Épictète soutient la thèse suivante : Ce n’est pas l’événement qui nous afflige, c’est l’opinion que nous en avons. En examinant ce que sont véritablement les choses, et en distinguant le côté supportable, on se rend maître de soi. Le texte rassemble plusieurs maximes : il faut montrer ce qui les relie et comment elles forment un seul raisonnement.", "Le texte avance en trois temps. Des lignes 1 à 9 : « Dire ce que sont les choses ». Des lignes 9 à 31 : « L’opinion fait le mal » ; « Compatir sans s’affliger ». Des lignes 32 à 50 : « Les injures n’outragent que par l’opinion » ; « Les deux anses »."], "dev": [{"l": "1-9", "obj": "Dire ce que sont les choses.", "sp": ["<b>Dire ce que sont les choses.</b> Se rappeler que le pot de terre est un pot de terre, et que ceux qu’on aime sont mortels : on ne sera pas troublé à leur perte."], "tr": "Après avoir demandé de dire ce que sont vraiment les choses, Épictète en tire le principe : l’opinion fait le mal, même dans la compassion."}, {"l": "9-31", "obj": "L’opinion fait le mal ; Compatir sans s’affliger.", "sp": ["<b>L’opinion fait le mal.</b> La mort n’est pas un mal : si elle en était un, elle aurait paru telle à Socrate. L’opinion que la mort est un mal, voilà le mal.", "<b>Compatir sans s’affliger.</b> Devant quelqu’un qui pleure, on ne doit pas croire qu’il est malheureux à cause des choses extérieures : c’est son opinion. On peut pleurer avec lui mais sans être véritablement affligé."], "tr": "Si c’est l’opinion qui trouble, les injures aussi n’outragent que par l’opinion : on peut toujours choisir la bonne façon de voir."}, {"l": "32-50", "obj": "Les injures n’outragent que par l’opinion ; Les deux anses.", "sp": ["<b>Les injures n’outragent que par l’opinion.</b> Ce n’est pas l’homme qui t’insulte qui t’outrage, mais l’opinion que tu en as. Gagner du temps aide à rester maître de soi.", "<b>Les deux anses.</b> Chaque chose a deux anses. Un frère qui commet une injustice : le prendre par l’injustice est impossible ; le prendre par le fait qu’il est mon frère le rend supportable."], "tr": ""}], "concl": ["Le texte se demande : « Comment éviter d’être troublé par ce qui nous arrive ? » Épictète répond ainsi : Ce n’est pas l’événement qui nous afflige, c’est l’opinion que nous en avons. En examinant ce que sont véritablement les choses, et en distinguant le côté supportable, on se rend maître de soi.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « Dire ce que sont les choses » puis « L’opinion fait le mal ; Compatir sans s’affliger » puis « Les injures n’outragent que par l’opinion ; Les deux anses ».", "On peut enfin discuter cette thèse. Tout est-il affaire d’opinion ? Peut-on changer son jugement sur la douleur ou le deuil ? Le stoïcisme est-il réaliste ? (À comparer avec Descartes.)"]}, {"id": "bonheur-descartes-epictete", "label": "Épictète et Descartes : acceptation et grandeur d’âme", "theme": "Le bonheur", "auteur": "Descartes (et Épictète)", "oeuvre": "Lettre à Élisabeth", "fiche": "bonheur-descartes-epictete.html", "lignes": ["III. [...] Devant chacune des choses qui te", "divertissent, qui servent à tes besoins, ou que tu", "aimes, n'oublie pas de te dire en toi-même ce qu'elle", "est véritablement. Commence par les plus petites. Si", "tu aimes un pot de terre, dis-toi que tu aimes un pot", "de terre ; et, s'il se casse, tu n'en seras point", "troublé. Si tu aimes ton fils ou ta femme, dis-toi à", "toi-même que tu aimes un être mortel ; et s'il vient à", "mourir, tu n'en seras point troublé.", "XLIII. Chaque chose a deux anses : l'une, par où on", "peut la porter, l'autre, par où on ne le peut pas. Si", "ton frère donc te fait une injustice, ne le prends", "point par le côté de l'injustice qu'il te fait, car", "c'est l'anse par où on ne saurait ni le prendre ni le", "porter ; mais prends-le par cet autre côté, qu'il est", "ton frère, un homme qui a été élevé et nourri avec", "toi, et tu le prendras par le bon côté, qui te le", "rendra supportable.", "VIII. Ne cherche pas à ce que les événements arrivent", "comme tu veux, mais veuille que les événements", "arrivent comme ils arrivent, et tu seras heureux.", "Ainsi, ressentant de la douleur en leurs corps [les", "grandes âmes] s’exercent à la supporter patiemment, et", "cette épreuve qu’elles font de leur force, leur est", "agréable ; ainsi, voyant leurs amis en quelque grande", "affliction, elles compatissent à leur mal, et font", "tout leur possible pour les en délivrer, et ne", "craignent pas même de s’exposer à la mort pour ce", "sujet, s’il en est besoin. Mais, cependant, le", "témoignage que leur donne leur conscience, de ce", "qu’elles s’acquittent en cela de leur devoir, et font", "une action louable et vertueuse, les rend plus", "heureuses, que toute la tristesse, que leur donne la", "compassion, ne les afflige."], "mots": "Mots-clés : Acceptation, Grandes âmes, Compassion.", "lire": "<p><b>Objet du texte.</b> Comment être heureux face à la douleur et à la perte ? <b>Notion du programme.</b> Le bonheur.</p><p><b>Connecteurs repérés.</b> « si… » (l.4), « donc » (l.12), « car » (l.13), « mais » (l.15), « ainsi » (l.22), « cependant » (l.29). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Acceptation</i> : fait de vouloir ce qui arrive plutôt que d’exiger qu’il en soit autrement. ; <i>Grandes âmes</i> : âmes fortes, qui supportent la douleur et agissent généreusement. ; <i>Compassion</i> : fait de souffrir avec autrui.</p>", "these": "<p><b>Thèse.</b> Pour Épictète, le bonheur est de vouloir ce qui arrive. Descartes nuance : les grandes âmes s’exercent à supporter la douleur et compatissent à celle des autres, mais le témoignage de leur conscience les rend plus heureuses que la compassion ne les afflige.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « Vouloir ce qui arrive » ; « La douleur du corps » ; « La compassion pour les amis » ; « La conscience du devoir accompli » ; « Deux sagesses ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-21", "idee": "Vouloir ce qui arrive.", "args": "Épictète : ne cherche pas à ce que les événements arrivent comme tu veux, mais veuille qu’ils arrivent comme ils arrivent.", "lien": "Après la sagesse d’Épictète (vouloir ce qui arrive), Descartes montre que les grandes âmes ressentent pourtant la douleur et compatissent à celle de leurs amis."}, {"l": "22-29", "idee": "La douleur du corps ; La compassion pour les amis.", "args": "Chez Descartes, les grandes âmes s’exercent à supporter patiemment la douleur, et cette épreuve de leur force leur est agréable. Elles compatissent à l’affliction de leurs amis, font leur possible pour les en délivrer, et vont jusqu’à s’exposer à la mort s’il le faut.", "lien": "Mais ce ressenti n’empêche pas leur bonheur : le témoignage de leur conscience les rend plus heureuses que la douleur ne les afflige."}, {"l": "29-34", "idee": "La conscience du devoir accompli ; Deux sagesses.", "args": "Le témoignage de leur conscience, qui les assure de faire une action louable et vertueuse, les rend plus heureuses que la tristesse de la compassion ne les afflige. Chez Épictète, ne pas être affecté. Chez Descartes, être affecté mais heureux de bien agir.", "lien": "La conscience du devoir accompli nuance ainsi Épictète : acceptation, mais pas insensibilité."}], "concepts": [{"c": "Acceptation", "s": "Fait de vouloir ce qui arrive plutôt que d’exiger qu’il en soit autrement."}, {"c": "Grandes âmes", "s": "Âmes fortes, qui supportent la douleur et agissent généreusement."}, {"c": "Compassion", "s": "Fait de souffrir avec autrui."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que le bonheur serait de ne rien ressentir devant la douleur et la perte.</p><p><b>Le problème.</b> Comment être heureux face à la douleur et à la perte ?</p><p><b>L’enjeu.</b> Ce texte confronte deux sagesses : il faut comprendre ce que Descartes accorde à Épictète et ce qu’il y ajoute.</p><p><b>Formule.</b> « On dit souvent que le bonheur serait de ne rien ressentir devant la douleur et la perte, mais Descartes (et Épictète) soutient : Pour Épictète, le bonheur est de vouloir ce qui arrive. »</p><p><b>Discussion.</b> Stoïcisme ou action ? Descartes retient du stoïcisme la maîtrise de soi, mais valorise l’action pour autrui. Est-ce compatible ? (À comparer avec Épictète.)</p>", "intro": ["On croit souvent que la sagesse consiste à ne rien ressentir devant la douleur et la perte. Dans sa <i>Lettre à Élisabeth</i>, Descartes confronte Épictète, qui demande de vouloir ce qui arrive, à ce que ressentent réellement les grandes âmes.", "Descartes (et Épictète) soutient la thèse suivante : Pour Épictète, le bonheur est de vouloir ce qui arrive. Descartes nuance : les grandes âmes s’exercent à supporter la douleur et compatissent à celle des autres, mais le témoignage de leur conscience les rend plus heureuses que la compassion ne les afflige. Ce texte confronte deux sagesses : il faut comprendre ce que Descartes accorde à Épictète et ce qu’il y ajoute.", "Le texte avance en trois temps. Des lignes 1 à 21 : « Vouloir ce qui arrive ». Des lignes 22 à 29 : « La douleur du corps » ; « La compassion pour les amis ». Des lignes 29 à 34 : « La conscience du devoir accompli » ; « Deux sagesses »."], "dev": [{"l": "1-21", "obj": "Vouloir ce qui arrive.", "sp": ["<b>Vouloir ce qui arrive.</b> Épictète : ne cherche pas à ce que les événements arrivent comme tu veux, mais veuille qu’ils arrivent comme ils arrivent."], "tr": "Après la sagesse d’Épictète (vouloir ce qui arrive), Descartes montre que les grandes âmes ressentent pourtant la douleur et compatissent à celle de leurs amis."}, {"l": "22-29", "obj": "La douleur du corps ; La compassion pour les amis.", "sp": ["<b>La douleur du corps.</b> Chez Descartes, les grandes âmes s’exercent à supporter patiemment la douleur, et cette épreuve de leur force leur est agréable.", "<b>La compassion pour les amis.</b> Elles compatissent à l’affliction de leurs amis, font leur possible pour les en délivrer, et vont jusqu’à s’exposer à la mort s’il le faut."], "tr": "Mais ce ressenti n’empêche pas leur bonheur : le témoignage de leur conscience les rend plus heureuses que la douleur ne les afflige."}, {"l": "29-34", "obj": "La conscience du devoir accompli ; Deux sagesses.", "sp": ["<b>La conscience du devoir accompli.</b> Le témoignage de leur conscience, qui les assure de faire une action louable et vertueuse, les rend plus heureuses que la tristesse de la compassion ne les afflige.", "<b>Deux sagesses.</b> Chez Épictète, ne pas être affecté. Chez Descartes, être affecté mais heureux de bien agir."], "tr": ""}], "concl": ["Le texte se demande : « Comment être heureux face à la douleur et à la perte ? » Descartes (et Épictète) répond ainsi : Pour Épictète, le bonheur est de vouloir ce qui arrive. Descartes nuance : les grandes âmes s’exercent à supporter la douleur et compatissent à celle des autres, mais le témoignage de leur conscience les rend plus heureuses que la compassion ne les afflige.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « Vouloir ce qui arrive » puis « La douleur du corps ; La compassion pour les amis » puis « La conscience du devoir accompli ; Deux sagesses ».", "On peut enfin discuter cette thèse. Stoïcisme ou action ? Descartes retient du stoïcisme la maîtrise de soi, mais valorise l’action pour autrui. Est-ce compatible ? (À comparer avec Épictète.)"]}, {"id": "bonheur-epicure", "label": "Épicure : les différents désirs", "auteur": "Épicure", "oeuvre": "Lettre à Ménécée", "lignes": ["Il faut se rendre compte que parmi nos désirs les uns", "sont naturels, les autres vains, et que, parmi les", "désirs naturels, les uns sont nécessaires et les", "autres naturels seulement. Parmi les désirs", "nécessaires, les uns sont nécessaires pour le bonheur,", "les autres pour la tranquillité du corps, les autres", "pour la vie même. Et en effet une théorie non erronée", "des désirs doit rapporter tout choix et toute aversion", "à la santé du corps et à l'ataraxie de l'âme, puisque", "c'est là la perfection même de la vie heureuse. Car", "nous faisons tout afin d'éviter la douleur physique et", "le trouble de l'âme. Lorsqu'une fois nous y avons", "réussi, toute l'agitation de l'âme tombe, l'être", "vivant n'ayant plus à s'acheminer vers quelque chose", "qui lui manque ni à chercher autre chose pour parfaire", "le bien-être de l'âme et celui du corps. Nous n'avons", "en effet besoin du plaisir que quand, par suite de son", "absence, nous éprouvons de la douleur ; et quand nous", "n'éprouvons pas de douleur, nous n'avons plus besoin", "du plaisir. […]", "C'est un grand bien à notre avis que de se suffire à", "soi-même, non qu'il faille toujours vivre de peu, mais", "afin que si l'abondance nous manque, nous sachions", "nous contenter du peu que nous aurons, bien persuadés", "que ceux-là jouissent le plus vivement de l'opulence", "qui ont le moins besoin d'elle, et que tout ce qui est", "naturel est aisé à se procurer, et ce qui ne répond", "pas à un désir naturel, malaisé à se procurer. […]", "Quand donc nous disons que le plaisir est le but de la", "vie, nous ne parlons pas des plaisirs de l'homme", "déréglé, ni de ceux qui consistent dans les", "jouissances matérielles, ainsi que l'écrivent des gens", "qui ignorent notre doctrine, ou qui la combattent et", "la prennent dans un mauvais sens. Le plaisir dont nous", "parlons est celui qui consiste, pour le corps à ne pas", "souffrir et, pour l'âme, à être sans trouble."], "mots": "Mots-clés : désirs, plaisir, douleur, besoin, corps/âme, ataraxie.", "lire": "<p><b>Objet du texte.</b> Les désirs et le plaisir, dans la recherche du bonheur. <b>Notion du programme.</b> Le bonheur (et les désirs).</p><p><b>Mots répétés.</b> « Désirs » (l.1-7), « plaisir » (l.17-20, 29-34), « douleur » / « souffrir » (l.11, 18-19, 35), « besoin » (l.16-26), et le couple « corps » / « âme » (l.9, 12, 16, 35-36). Ce sont les notions autour desquelles le texte est construit.</p><p><b>Connecteurs et oppositions.</b> « Et en effet » (l.7), « puisque » (l.9), « Car » (l.10) : le texte justifie ce qu'il avance. « non qu'il faille… mais afin que » (l.22-23) : une précision. « Quand donc » (l.29) : une conclusion qui introduit une mise au point. Oppositions : naturels / vains ; nécessaires / seulement naturels ; plaisir de l'homme déréglé / plaisir véritable.</p><p><b>À chercher.</b> <i>Ataraxie</i> : absence de trouble de l'âme. <i>Aversion</i> : ce que l'on fuit (par opposition au « choix », ce que l'on recherche). <i>Opulence</i> : abondance de richesses.</p>", "these": "<p><b>Thèse.</b> Le bonheur ne consiste pas à accumuler les plaisirs, mais à ne pas souffrir (corps) et à ne pas être troublé (âme) ; on y parvient en triant ses désirs et en se contentant du peu qui est nécessaire.</p><p><b>L'argumentation qui s'y rattache.</b> Prémisse : tout ce que nous faisons vise à éviter la douleur et le trouble (l.10-12). Conséquence : se suffire à soi-même est un grand bien (l.21-28). Nuance : ce plaisir n'est pas celui de l'homme déréglé (l.29-34). Tout n'est pas sur le même plan : la thèse est la définition du plaisir ; le reste l'établit, en tire les conséquences ou la protège d'un contresens.</p>", "etapes": [{"l": "1-20", "idee": "Trier les désirs pour viser le bon but : santé du corps et ataraxie de l'âme.", "args": "Désirs naturels / vains, nécessaires / non nécessaires ; tout choix doit se rapporter au but ; une fois la douleur écartée, plus rien ne manque ; on n'a besoin du plaisir que quand son absence fait souffrir.", "lien": "Si le but est seulement de ne pas souffrir, peu suffit : d'où l'éloge de l'autarcie."}, {"l": "21-28", "idee": "Se suffire à soi-même est un grand bien.", "args": "Non pour vivre toujours de peu, mais pour savoir se contenter du peu ; ceux qui ont le moins besoin de l'abondance en jouissent le plus ; ce qui est naturel est facile à se procurer.", "lien": "Cet éloge du peu, et un plaisir défini comme absence de douleur, peuvent être mal compris : on en fera une doctrine de la débauche ou, à l'inverse, de la privation. D'où la mise au point."}, {"l": "29-36", "idee": "Mise au point : le plaisir, but de la vie, n'est pas celui de l'homme déréglé.", "args": "Ni plaisirs du déréglé, ni jouissances matérielles ; le plaisir consiste à ne pas souffrir (corps) et à être sans trouble (âme).", "lien": "Avec la thèse : cette phrase donne la définition du plaisir, qui reprend les deux termes de la ligne 8-9 et clôt le texte."}], "concepts": [{"c": "Désirs naturels et nécessaires / vains", "s": "Classification : les désirs naturels et nécessaires (manger, boire) doivent être satisfaits ; les désirs vains (luxe, gloire) n'ont pas de fondement dans la nature. Importance : ce tri permet de savoir ce qu'il faut viser pour être heureux."}, {"c": "Ataraxie (et santé du corps)", "s": "Absence de trouble de l'âme, avec l'absence de douleur dans le corps. Importance : c'est le but auquel tout choix doit se rapporter, « la perfection même de la vie heureuse »."}, {"c": "Plaisir", "s": "Défini négativement : ne pas souffrir, être sans trouble. Il n'est pas une jouissance sans mesure. Importance : toute la thèse repose sur ce déplacement du sens du mot."}], "probleme": "<p><b>L'opinion remise en cause.</b> Être heureux, ce serait jouir le plus possible et satisfaire tous ses désirs ; l'épicurisme passerait pour la doctrine de cette vie (Épicure le dit lui-même, l.29-34).</p><p><b>Le problème.</b> Que faut-il désirer pour être heureux ? Le plaisir, but de la vie, est-il jouissance ou tranquillité ?</p><p><b>L'enjeu.</b> Épicure rend le bonheur accessible : il ne dépend pas de la fortune, mais d'un tri de ses désirs.</p><p><b>Formule.</b> « On dit souvent que le bonheur consiste à jouir le plus possible, mais Épicure soutient qu'il consiste d'abord à ne pas souffrir. »</p><p><b>Discussion.</b> On peut se demander si l'absence de souffrance suffit à faire un bonheur (Calliclès, Bergson).</p>", "intro": ["On dit souvent que le bonheur consiste à jouir le plus possible, à satisfaire tous ses désirs, et que l'épicurisme en serait la doctrine. Pourtant, ce texte d'Épicure, extrait de la <i>Lettre à Ménécée</i>, s'oppose à cette idée : il demande ce qu'il faut désirer pour être heureux et ce qu'est vraiment le plaisir.", "Épicure soutient que le bonheur consiste à ne pas souffrir dans son corps et à n'être pas troublé dans son âme, ce que l'on obtient en triant ses désirs et en se contentant de peu. Cette thèse n'est pas évidente : comment le plaisir, but de la vie, peut-il n'être que l'absence de douleur ? Elle demande à être expliquée.", "Le texte avance en trois temps. Des lignes 1 à 20, Épicure trie les désirs et fixe le but de ces choix : la santé du corps et l'ataraxie de l'âme. Des lignes 21 à 28, il en tire une conséquence pratique : se suffire à soi-même. Des lignes 29 à 36, il précise enfin le sens du mot « plaisir » pour écarter un contresens."], "dev": [{"l": "1-20", "obj": "Comment le tri des désirs conduit au but de la vie heureuse.", "sp": ["Les trois sortes de désirs (l.1-7).", "Le critère : la santé du corps et l'ataraxie, car « nous faisons tout afin d'éviter la douleur physique et le trouble de l'âme » (l.7-12).", "Le plaisir comme réponse à un manque : quand on ne souffre plus, on n'en a plus besoin (l.12-20)."], "tr": "Si peu suffit à supprimer la douleur, que doit-on en conclure sur notre rapport à l'abondance ?"}, {"l": "21-28", "obj": "L'autarcie : se contenter du peu.", "sp": ["Se suffire à soi-même n'est pas vivre toujours de peu (l.21-24).", "Un paradoxe : ceux qui ont le moins besoin de l'abondance en jouissent le plus (l.24-26) ; exemple : l'affamé qui apprécie un pain.", "Le naturel est facile à se procurer : le bonheur est à notre portée (l.26-28)."], "tr": "Cet éloge du peu, et du plaisir comme absence de douleur, peut être mal compris. Qu'entend donc Épicure par « plaisir » ?"}, {"l": "29-36", "obj": "Une mise au point sur le sens du mot « plaisir ».", "sp": ["Le contresens que dénonce Épicure : plaisirs du déréglé, jouissances matérielles (l.29-34).", "La définition : ne pas souffrir, être sans trouble ; retour sur la partie 1 (l.34-36).", "Éclairage possible : Calliclès défend à l'inverse des désirs sans limite."], "tr": ""}], "concl": ["Le texte se demande ce qu'il faut désirer pour être heureux, et Épicure répond que le bonheur est l'absence de souffrance du corps et de trouble de l'âme.", "L'analyse a précisé cette thèse : le plaisir n'est pas opposé à la modération, il en est la raison. Se contenter du peu est ce qui permet de ne pas souffrir.", "L'originalité tient à ce que le bonheur devient accessible à tous, indépendamment de la fortune. On peut se demander si l'absence de souffrance suffit à faire un bonheur (Bergson parle de joie)."], "theme": "Le bonheur", "fiche": "bonheur-epicure.html"}, {"id": "conscience-hobbes", "label": "Hobbes : objection au cogito de Descartes", "theme": "La conscience", "auteur": "Hobbes", "oeuvre": "Troisièmes objections aux Méditations métaphysiques", "fiche": "conscience-hobbes.html", "lignes": ["Je suis une chose qui pense. C'est fort bien dit ; car", "de ce que je pense, ou de ce que j'ai une idée, soit", "en veillant, soit en dormant, l'on infère que je suis", "pensant : car ces deux choses, je pense et je suis", "pensant signifient la même chose. De ce que je suis", "pensant, il s'ensuit que je suis, parce que ce qui", "pense n'est pas un rien. Mais où notre auteur ajoute :", "c'est-à-dire un esprit, une âme, un entendement une", "raison, de là naît un doute. Car ce raisonnement ne me", "semble pas bien déduit, de dire : je suis pensant,", "donc je suis une pensée : ou bien je suis intelligent", "donc je suis un entendement. Car de la même façon je", "pourrais dire : je suis promenant, donc je suis une", "promenade.", "Monsieur Descartes, donc prend la chose intelligente", "et l'intellection, qui en est l'acte, pour une même", "chose ; ou du moins il dit que c'est le même que la", "chose qui entend et l'entendement, qui est une", "puissance ou faculté d'une chose intelligente.", "Néanmoins, tous les philosophes distinguent le sujet", "de ses facultés et de ses actes, c'est-à-dire de ses", "propriétés et de ses essences, car c'est autre chose", "que la chose même qui est et autre chose que son", "essence. Il se peut donc faire qu'une chose qui pense", "soit le sujet de l'esprit, de la raison ou de", "l'entendement et partant, que ce soit quelque chose de", "corporel, dont le contraire est pris, ou avancé et", "n'est pas prouvé."], "mots": "Mots-clés : Cogito, Sujet, Faculté / acte.", "lire": "<p><b>Objet du texte.</b> Que prouve exactement le cogito sur la nature du moi ? <b>Notion du programme.</b> La conscience.</p><p><b>Connecteurs repérés.</b> « car » (l.1), « parce que » (l.6), « mais » (l.7), « donc » (l.11). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Cogito</i> : vérité première de Descartes : « je pense, donc je suis ». ; <i>Sujet</i> : ce à quoi se rapportent des actes et des propriétés : la chose même qui pense. ; <i>Faculté / acte</i> : pouvoir (entendement) et son exercice (intellection) : ils ne se confondent pas avec la chose.</p>", "these": "<p><b>Thèse.</b> De « je pense », on peut conclure « je suis », mais pas « je suis une pensée, un esprit ». Descartes confond la chose qui pense avec l’acte de penser. Le sujet pensant pourrait être quelque chose de corporel.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « Ce que Hobbes accorde » ; « Le point de doute » ; « L’analogie de la promenade » ; « Distinguer le sujet de ses actes » ; « Une conclusion corporelle possible ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-9", "idee": "Ce que Hobbes accorde ; Le point de doute.", "args": "De ce que je pense, ou que j’ai une idée, on infère que je suis pensant. Et de ce que je suis pensant il s’ensuit que je suis, car ce qui pense n’est pas un rien. Descartes ajoute : « c’est-à-dire un esprit, une âme, un entendement, une raison ». Ce raisonnement n’est pas bien déduit.", "lien": "Après avoir accordé que je suis une chose qui pense, Hobbes montre sur quoi porte son doute : le passage à « un esprit »."}, {"l": "9-19", "idee": "L’analogie de la promenade.", "args": "Dire « je suis promenant, donc je suis une promenade » serait absurde : on ne passe pas de l’action à la chose.", "lien": "L’analogie de la promenade montre que l’on ne peut pas passer d’un acte (penser) à un sujet de nature particulière (un esprit)."}, {"l": "20-28", "idee": "Distinguer le sujet de ses actes ; Une conclusion corporelle possible.", "args": "Tous les philosophes distinguent le sujet de ses facultés et de ses actes, de ses propriétés et de ses essences. La chose qui pense pourrait être le sujet de l’esprit, de la raison, et donc quelque chose de corporel : le contraire n’est pas prouvé.", "lien": "Si l’on distingue le sujet de ses actes, rien n’interdit que le sujet qui pense soit corporel : voilà la conclusion de l’objection."}], "concepts": [{"c": "Cogito", "s": "Vérité première de Descartes : « je pense, donc je suis »."}, {"c": "Sujet", "s": "Ce à quoi se rapportent des actes et des propriétés : la chose même qui pense."}, {"c": "Faculté / acte", "s": "Pouvoir (entendement) et son exercice (intellection) : ils ne se confondent pas avec la chose."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que le cogito prouverait que je suis un esprit, une chose pensante distincte du corps.</p><p><b>Le problème.</b> Que prouve exactement le cogito sur la nature du moi ?</p><p><b>L’enjeu.</b> Cette objection est subtile : elle accepte la conclusion « je suis » mais refuse ce que Descartes en tire. Il faut montrer où le raisonnement ne tient pas.</p><p><b>Formule.</b> « On dit souvent que le cogito prouverait que je suis un esprit, une chose pensante distincte du corps, mais Hobbes soutient : De « je pense », on peut conclure « je suis », mais pas « je suis une pensée, un esprit ». »</p><p><b>Discussion.</b> Le moi est-il une substance pensante ? Descartes pense que le cogito révèle l’âme. Hobbes y voit une confusion. Qui a raison ? (À comparer avec Hume.)</p>", "intro": ["On lit souvent le cogito comme la preuve que je suis un esprit, distinct du corps. Dans ses objections aux <i>Méditations métaphysiques</i>, Hobbes accorde à Descartes que « je pense, donc je suis », mais refuse qu’on en conclue que je suis un esprit.", "Hobbes soutient la thèse suivante : De « je pense », on peut conclure « je suis », mais pas « je suis une pensée, un esprit ». Descartes confond la chose qui pense avec l’acte de penser. Le sujet pensant pourrait être quelque chose de corporel. Cette objection est subtile : elle accepte la conclusion « je suis » mais refuse ce que Descartes en tire. Il faut montrer où le raisonnement ne tient pas.", "Le texte avance en trois temps. Des lignes 1 à 9 : « Ce que Hobbes accorde » ; « Le point de doute ». Des lignes 9 à 19 : « L’analogie de la promenade ». Des lignes 20 à 28 : « Distinguer le sujet de ses actes » ; « Une conclusion corporelle possible »."], "dev": [{"l": "1-9", "obj": "Ce que Hobbes accorde ; Le point de doute.", "sp": ["<b>Ce que Hobbes accorde.</b> De ce que je pense, ou que j’ai une idée, on infère que je suis pensant. Et de ce que je suis pensant il s’ensuit que je suis, car ce qui pense n’est pas un rien.", "<b>Le point de doute.</b> Descartes ajoute : « c’est-à-dire un esprit, une âme, un entendement, une raison ». Ce raisonnement n’est pas bien déduit."], "tr": "Après avoir accordé que je suis une chose qui pense, Hobbes montre sur quoi porte son doute : le passage à « un esprit »."}, {"l": "9-19", "obj": "L’analogie de la promenade.", "sp": ["<b>L’analogie de la promenade.</b> Dire « je suis promenant, donc je suis une promenade » serait absurde : on ne passe pas de l’action à la chose."], "tr": "L’analogie de la promenade montre que l’on ne peut pas passer d’un acte (penser) à un sujet de nature particulière (un esprit)."}, {"l": "20-28", "obj": "Distinguer le sujet de ses actes ; Une conclusion corporelle possible.", "sp": ["<b>Distinguer le sujet de ses actes.</b> Tous les philosophes distinguent le sujet de ses facultés et de ses actes, de ses propriétés et de ses essences.", "<b>Une conclusion corporelle possible.</b> La chose qui pense pourrait être le sujet de l’esprit, de la raison, et donc quelque chose de corporel : le contraire n’est pas prouvé."], "tr": ""}], "concl": ["Le texte se demande : « Que prouve exactement le cogito sur la nature du moi ? » Hobbes répond ainsi : De « je pense », on peut conclure « je suis », mais pas « je suis une pensée, un esprit ». Descartes confond la chose qui pense avec l’acte de penser. Le sujet pensant pourrait être quelque chose de corporel.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « Ce que Hobbes accorde ; Le point de doute » puis « L’analogie de la promenade » puis « Distinguer le sujet de ses actes ; Une conclusion corporelle possible ».", "On peut enfin discuter cette thèse. Le moi est-il une substance pensante ? Descartes pense que le cogito révèle l’âme. Hobbes y voit une confusion. Qui a raison ? (À comparer avec Hume.)"]}, {"id": "conscience-hume", "label": "Hume : le moi n’est qu’un faisceau de perceptions", "theme": "La conscience", "auteur": "Hume", "oeuvre": "Traité de la nature humaine", "fiche": "conscience-hume.html", "lignes": ["Il y a certains philosophes qui imaginent que nous", "sommes à tout moment intimement conscients de ce que", "nous appelons notre moi, que nous sentons son", "existence et sa continuité d’existence, et que nous", "sommes certains, d’une certitude qui va au-delà de", "l’évidence de la démonstration, aussi bien de sa", "parfaire identité que de sa parfaite simplicité. La", "plus forte sensation et la plus violente passion,", "disent-ils, au lieu de nous distraire de cette vue, ne", "font que l’établir plus intensément, et elles nous", "font considérer leur influence sur le moi, soit par", "leur douleur, soit par leur plaisir. Tente de le", "prouver davantage, ce serait en affaiblir l’évidence,", "puisqu’aucune preuve ne peut être tirée d’aucun fait", "dont nous soyons aussi intimement conscients, et il", "n’est rien dont nous puissions être certains si nous", "doutons de cela.", "Malheureusement, toutes ces assertions positives sont", "contraires à l’expérience même qu’on allègue en leur", "faveur ; et nous n’avons aucune idée du moi, de la", "manière ici expliquée. En effet, de quelle impression", "cette idée pourrait-elle être tirée ? Il est", "impossible de répondre à cette question sans", "contradiction ni absurdités manifestes ; et pourtant,", "c’est une question à laquelle il faut nécessairement", "répondre si nous voulons que l’idée de moi passe pour", "claire et intelligible. Il faut bien qu’il y ait", "quelque impression qui donne naissance à toute idée", "réelle. Mais le moi, ou personne, n’est pas une", "impression, mais c’est ce à quoi sont supposées se", "rattacher nos différentes impressions et idées.", "Si une impression donne naissance à l’idée du moi,", "cette impression doit demeurer invariablement la même", "durant le cours entier de notre vie, puisque le moi", "est supposé exister de cette manière. Mais il n’existe", "aucune impression constante et invariable. Douleur et", "plaisir, chagrin et joie, passions et sensations se", "succèdent les uns aux autres, et ils n’existent jamais", "tous en même temps. Ce ne peut donc être d’aucune de", "ces impressions, ni d’aucune autre que l’idée du moi", "est dérivée, et, par conséquent, une telle idée", "n’existe pas. […] Pour ma part, quand j’entre le plus", "intimement dans ce que j’appelle moi-même, je bute", "toujours sur quelque perception particulière ou sur", "une autre, de chaud ou de froid, de lumière ou", "d’ombre, d’amour ou de haine, de douleur ou de", "plaisir.", "Je ne peux jamais, à aucun moment, me saisir moi-même", "sans une perception, et jamais je ne puis observer", "autre chose que la perception. Quand mes perceptions", "sont supprimées pour un temps, comme par un sommeil", "profond, aussi longtemps que je suis sans conscience", "de moi-même, on peut vraiment dire que je n’existe", "pas. Et si toutes mes perceptions étaient supprimées", "par la mort, et que je ne puisse ni penser, ni sentir,", "ni voir, ni aimer, ni haïr après la dissolution de mon", "corps, je serais entièrement annihilé, et je n’en", "conçois pas ce qu’il faudrait de plus pour faire de", "moi une parfaite non-entité. Si quelqu’un, à partir", "d’une réflexion sérieuse et sans préjugé, pense qu’il", "a une notion différente de lui-même, je dois avouer", "que je ne puis raisonner plus longtemps avec lui.", "Tout ce que je peux lui accorder, c’est qu’il peut", "avoir raison aussi bien que moi, et que nous différons", "essentiellement sur ce point. Il peut peut-être", "percevoir quelque chose de simple et de continu, qu’il", "appelle lui-même, mais je sois certain qu’il n’existe", "pas un tel principe en moi."], "mots": "Mots-clés : Moi, Impression, Introspection.", "lire": "<p><b>Objet du texte.</b> Avons-nous une idée du moi comme identité simple et continue ? <b>Notion du programme.</b> La conscience.</p><p><b>Connecteurs repérés.</b> « si… » (l.16), « en effet » (l.21), « pourtant » (l.24), « mais » (l.29), « puisque » (l.34), « donc » (l.39). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Moi</i> : l’identité personnelle, supposée simple et permanente. ; <i>Impression</i> : perception immédiate et vive, source de toutes nos idées. ; <i>Introspection</i> : observation de soi-même par la conscience.</p>", "these": "<p><b>Thèse.</b> Il n’y a pas d’idée du moi : aucune impression ne demeure invariable pendant toute la vie. En s’observant, on ne rencontre que des perceptions successives. Le moi n’est pas une donnée immédiate de la conscience.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « La thèse des philosophes du moi » ; « Mais d’où viendrait cette idée ? » ; « Le moi n’est pas une impression » ; « L’expérience de l’introspection » ; « Sans perception, je n’existe pas ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-27", "idee": "La thèse des philosophes du moi ; Mais d’où viendrait cette idée ?.", "args": "Certains pensent que nous sommes à tout moment intimement conscients de notre moi, de sa continuité, de son identité et de sa simplicité, avec une certitude supérieure à toute démonstration. Toute idée réelle dérive d’une impression. De quelle impression l’idée du moi serait-elle tirée ?", "lien": "Après avoir exposé la thèse des philosophes du moi, Hume cherche d’où viendrait cette idée : aucune impression ne permet de répondre."}, {"l": "27-42", "idee": "Le moi n’est pas une impression.", "args": "Le moi est ce à quoi se rattachent les impressions. Or aucune impression n’est constante ni invariable : douleur et plaisir, joie et chagrin se succèdent.", "lien": "Si le moi n’est pas une impression, il faut le chercher dans l’expérience même : Hume s’observe."}, {"l": "42-68", "idee": "L’expérience de l’introspection ; Sans perception, je n’existe pas.", "args": "Quand j’entre le plus intimement en moi-même, je bute toujours sur une perception particulière. Je ne peux me saisir sans perception. Dans un sommeil profond ou après la mort, sans perception, je serais une non-entité. Hume admet que d’autres perçoivent peut-être autre chose, mais il n’en trouve pas en lui.", "lien": "L’introspection ne trouve que des perceptions successives : le moi n’est pas une donnée immédiate de la conscience."}], "concepts": [{"c": "Moi", "s": "L’identité personnelle, supposée simple et permanente."}, {"c": "Impression", "s": "Perception immédiate et vive, source de toutes nos idées."}, {"c": "Introspection", "s": "Observation de soi-même par la conscience."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que nous aurions une idée claire du moi, identique et simple, dont la conscience nous donnerait un accès immédiat.</p><p><b>Le problème.</b> Avons-nous une idée du moi comme identité simple et continue ?</p><p><b>L’enjeu.</b> Cette thèse est paradoxale : comment douter du moi, alors que c’est ce que nous croyons connaître le mieux ?</p><p><b>Formule.</b> « On dit souvent que nous aurions une idée claire du moi, identique et simple, dont la conscience nous donnerait un accès immédiat, mais Hume soutient : Il n’y a pas d’idée du moi : aucune impression ne demeure invariable pendant toute la vie. »</p><p><b>Discussion.</b> Le moi est-il une illusion ? Si le moi n’est qu’une suite de perceptions, qu’est-ce qui fait mon identité ? (À comparer avec Descartes et Hobbes.)</p>", "intro": ["On croit généralement que nous sommes sûrs de notre moi, qui resterait le même et dont nous aurions une conscience immédiate. Dans le <i>Traité de la nature humaine</i>, Hume soutient qu’il n’y a pas d’idée du moi.", "Hume soutient la thèse suivante : Il n’y a pas d’idée du moi : aucune impression ne demeure invariable pendant toute la vie. En s’observant, on ne rencontre que des perceptions successives. Le moi n’est pas une donnée immédiate de la conscience. Cette thèse est paradoxale : comment douter du moi, alors que c’est ce que nous croyons connaître le mieux ?", "Le texte avance en trois temps. Des lignes 1 à 27 : « La thèse des philosophes du moi » ; « Mais d’où viendrait cette idée ? ». Des lignes 27 à 42 : « Le moi n’est pas une impression ». Des lignes 42 à 68 : « L’expérience de l’introspection » ; « Sans perception, je n’existe pas »."], "dev": [{"l": "1-27", "obj": "La thèse des philosophes du moi ; Mais d’où viendrait cette idée ?.", "sp": ["<b>La thèse des philosophes du moi.</b> Certains pensent que nous sommes à tout moment intimement conscients de notre moi, de sa continuité, de son identité et de sa simplicité, avec une certitude supérieure à toute démonstration.", "<b>Mais d’où viendrait cette idée ?.</b> Toute idée réelle dérive d’une impression. De quelle impression l’idée du moi serait-elle tirée ?"], "tr": "Après avoir exposé la thèse des philosophes du moi, Hume cherche d’où viendrait cette idée : aucune impression ne permet de répondre."}, {"l": "27-42", "obj": "Le moi n’est pas une impression.", "sp": ["<b>Le moi n’est pas une impression.</b> Le moi est ce à quoi se rattachent les impressions. Or aucune impression n’est constante ni invariable : douleur et plaisir, joie et chagrin se succèdent."], "tr": "Si le moi n’est pas une impression, il faut le chercher dans l’expérience même : Hume s’observe."}, {"l": "42-68", "obj": "L’expérience de l’introspection ; Sans perception, je n’existe pas.", "sp": ["<b>L’expérience de l’introspection.</b> Quand j’entre le plus intimement en moi-même, je bute toujours sur une perception particulière. Je ne peux me saisir sans perception.", "<b>Sans perception, je n’existe pas.</b> Dans un sommeil profond ou après la mort, sans perception, je serais une non-entité. Hume admet que d’autres perçoivent peut-être autre chose, mais il n’en trouve pas en lui."], "tr": ""}], "concl": ["Le texte se demande : « Avons-nous une idée du moi comme identité simple et continue ? » Hume répond ainsi : Il n’y a pas d’idée du moi : aucune impression ne demeure invariable pendant toute la vie. En s’observant, on ne rencontre que des perceptions successives. Le moi n’est pas une donnée immédiate de la conscience.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « La thèse des philosophes du moi ; Mais d’où viendrait cette idée ? » puis « Le moi n’est pas une impression » puis « L’expérience de l’introspection ; Sans perception, je n’existe pas ».", "On peut enfin discuter cette thèse. Le moi est-il une illusion ? Si le moi n’est qu’une suite de perceptions, qu’est-ce qui fait mon identité ? (À comparer avec Descartes et Hobbes.)"]}, {"id": "conscience-sartre", "label": "Sartre : condamné à être libre", "auteur": "Sartre", "oeuvre": "L'existentialisme est un humanisme", "lignes": ["Dostoïevski avait écrit : « Si Dieu n'existait pas,", "tout serait permis ». C'est là le point de départ de", "l'existentialisme. En effet, tout est permis si Dieu", "n'existe pas, et par conséquent l'homme est délaissé,", "parce qu'il ne trouve ni en lui, ni hors de lui une", "possibilité de s'accrocher. Il ne trouve d'abord pas", "d'excuses. Si, en effet, l'existence précède", "l'essence, on ne pourra jamais expliquer par référence", "à une nature humaine donnée et figée ; autrement dit,", "il n'y a pas de déterminisme, l'homme est libre,", "l'homme est liberté. Si, d'autre part, Dieu n'existe", "pas, nous ne trouvons pas en face de nous des valeurs", "ou des ordres qui légitimeront notre conduite. Ainsi,", "nous n'avons ni derrière nous, ni devant nous, dans le", "domaine lumineux des valeurs, des justifications ou", "des excuses. Nous sommes seuls, sans excuses.", "C'est ce que j'exprimerai en disant que l'homme est", "condamné à être libre. Condamné, parce qu'il ne s'est", "pas créé lui-même, et par ailleurs cependant libre,", "parce qu'une fois jeté dans le monde, il est", "responsable de tout ce qu'il fait. L'existentialiste", "ne croit pas à la puissance de la passion. Il ne", "pensera jamais qu'une belle passion est un torrent", "dévastateur qui conduit fatalement l'homme à certains", "actes, et qui, par conséquent, est une excuse. Il", "pense que l'homme est responsable de ses désirs.", "L'existentialiste ne pensera pas non plus que l'homme", "peut trouver un secours dans un signe donné, sur", "terre, qui l’orientera ; car il pense que l'homme", "déchiffre lui-même le signe comme il lui plaît. Il", "pense donc que l'homme, sans aucun appui et sans aucun", "secours, est condamné à chaque instant à inventer", "l'homme."], "mots": "Mots-clés : Dieu, liberté, excuses, responsable, condamné, valeurs.", "lire": "<p><b>Objet du texte.</b> La liberté de l'homme et sa responsabilité quand Dieu n'existe pas. <b>Notion du programme.</b> La liberté (et la conscience).</p><p><b>Mots répétés.</b> « Libre » / « liberté » (l.10-11, 17-19), « excuses » (l.6-7, 15-16), « Dieu » (l.1-4, 11), « responsable » (l.20-26), « condamné » (l.17-18, 31-32). Le texte tourne autour du couple liberté / responsabilité.</p><p><b>Connecteurs et oppositions.</b> Deux hypothèses introduites par « Si » : « Si l'existence précède l'essence » (l.7), « Si, d'autre part, Dieu n'existe pas » (l.11). Puis « Ainsi » (l.13), « C'est ce que j'exprimerai » (l.17), « Condamné… libre » (l.18-19) : une formule qui résume. « ne… pas non plus » (l.27) ajoute une seconde excuse écartée.</p><p><b>À chercher.</b> <i>Délaissé</i> : abandonné, sans soutien. <i>Existence précède essence</i> : l'homme existe d'abord, puis se définit par ses actes. <i>Déterminisme</i> : thèse selon laquelle tout a une cause qui le rend inévitable.</p>", "these": "<p><b>Thèse.</b> L'homme n'a ni nature, ni Dieu, ni passion, ni signe qui puisse lui servir d'excuse : il est libre, donc entièrement responsable de ce qu'il fait et de ce qu'il est. Cette liberté est une condamnation, car elle est imposée et sans appui.</p><p><b>L'argumentation qui s'y rattache.</b> Prémisses : Dieu n'existe pas (l.1-4) et l'existence précède l'essence (l.7-8). Conséquences : l'homme est délaissé, sans excuses (l.6, 16), responsable de ses désirs (l.26), obligé d'inventer l'homme (l.31-33). La formule « condamné à être libre » (l.17-18) concentre l'ensemble.</p>", "etapes": [{"l": "1-16", "idee": "Sans Dieu, l'homme est délaissé : il n'a aucun appui ni en lui ni hors de lui.", "args": "Dostoïevski : « tout est permis » ; l'existence précède l'essence, donc pas de nature humaine ni de déterminisme ; pas de valeurs données ; l'homme est seul, sans excuses.", "lien": "On passe de la situation (le délaissement) à sa formule : comment dire en un mot cette liberté sans appui ?"}, {"l": "17-21", "idee": "La formule : l'homme est « condamné à être libre ».", "args": "Condamné, car il ne s'est pas créé lui-même ; libre, car une fois jeté dans le monde, il est responsable de tout ce qu'il fait.", "lien": "De la formule générale à ses conséquences concrètes : quelles excuses cette liberté retire-t-elle ?"}, {"l": "21-33", "idee": "Ni la passion ni les signes ne sont des excuses : l'homme doit inventer l'homme.", "args": "La passion n'est pas un torrent qui conduit fatalement à l'acte ; l'homme est responsable de ses désirs ; il déchiffre lui-même les signes.", "lien": "Avec la thèse : la liberté est totale, y compris à l'égard de nos passions et des signes qui paraissent nous guider."}], "concepts": [{"c": "Délaissement", "s": "Situation de l'homme sans Dieu ni appui, ni en lui ni hors de lui. Importance : elle est le point de départ du raisonnement."}, {"c": "L'existence précède l'essence / déterminisme", "s": "L'homme existe d'abord et se définit ensuite par ses actes : il n'y a pas de nature humaine figée qui expliquerait ce qu'il fait. Importance : c'est ce qui exclut le déterminisme et fonde l'absence d'excuses."}, {"c": "Condamné à être libre / responsabilité", "s": "La liberté n'est pas un privilège mais une charge imposée : on ne peut pas ne pas choisir, et on répond de tout ce que l'on fait. Importance : c'est le paradoxe central du texte."}], "probleme": "<p><b>L'opinion remise en cause.</b> La liberté serait un bien qui nous soulage ; et nous pourrions excuser nos actes par notre nature, nos passions, la volonté de Dieu ou des signes.</p><p><b>Le problème.</b> L'homme peut-il se justifier par autre chose que lui-même ?</p><p><b>L'enjeu.</b> La responsabilité de chacun : sans excuses, on ne peut plus se défausser sur ce qu'on est ou sur ce qu'on ressent.</p><p><b>Formule.</b> « On croit souvent que la liberté est un bien et que nos passions peuvent excuser nos actes, mais Sartre soutient que l'homme est condamné à être libre. »</p><p><b>Discussion.</b> Spinoza ou Freud contesteraient que l'homme soit maître de ses passions.</p>", "intro": ["On dit volontiers que la liberté est précieuse, et l'on s'abrite, pour excuser nos actes, derrière notre nature, nos passions ou la volonté de Dieu. Dans ce texte, extrait de <i>L'existentialisme est un humanisme</i>, Sartre soutient au contraire que l'homme n'a aucune excuse.", "Sa thèse : l'homme est « condamné à être libre » ; sans nature ni valeurs données, il est entièrement responsable de ce qu'il fait et de ce qu'il est. Cette thèse est paradoxale : comment une liberté peut-elle être une condamnation ? Il faut en expliquer le sens.", "Le texte progresse en trois temps. Des lignes 1 à 16, Sartre déduit du « tout est permis » le délaissement de l'homme : ni nature ni valeurs ne lui servent d'appui. Aux lignes 17 à 21, il condense cela dans la formule « condamné à être libre ». Des lignes 21 à 33, il en tire les conséquences en écartant deux excuses : la passion et les signes."], "dev": [{"l": "1-16", "obj": "Le délaissement de l'homme sans Dieu.", "sp": ["« Tout est permis » : l'absence de Dieu (l.1-6).", "Pas de nature humaine : l'existence précède l'essence, il n'y a pas de déterminisme (l.6-11).", "Pas de valeurs données : l'homme est seul, sans excuses (l.11-16)."], "tr": "Que signifie, pour l'homme, se trouver ainsi seul et sans excuses ?"}, {"l": "17-21", "obj": "La formule « condamné à être libre ».", "sp": ["Condamné : l'homme ne s'est pas créé lui-même (l.18-19).", "Libre : jeté dans le monde, il est responsable de tout ce qu'il fait (l.19-21).", "Le paradoxe : la liberté n'est pas un privilège mais une charge."], "tr": "Concrètement, quelles excuses cette liberté nous retire-t-elle ?"}, {"l": "21-33", "obj": "Les excuses écartées : la passion et les signes.", "sp": ["La passion n'est pas un torrent fatal : l'homme est responsable de ses désirs (l.21-26).", "Les signes : l'homme les déchiffre lui-même (l.27-30).", "La conclusion : inventer l'homme à chaque instant (l.30-33)."], "tr": ""}], "concl": ["Le texte se demande si l'homme peut se justifier par autre chose que lui-même, et Sartre répond que non : l'homme est condamné à être libre.", "L'analyse a précisé cette thèse : la liberté n'est pas un pouvoir agréable mais une charge, qui retire à l'homme toutes ses excuses, y compris la passion.", "L'originalité tient à ce refus de toute excuse, et l'enjeu est la responsabilité totale. On peut discuter cette thèse avec Spinoza ou Freud."], "theme": "La conscience", "fiche": "conscience-sartre.html"}, {"id": "devoir-eichmann", "label": "Arendt : Eichmann et l’impératif catégorique", "theme": "Le devoir", "auteur": "Arendt", "oeuvre": "Eichmann à Jérusalem", "fiche": "devoir-eichmann.html", "lignes": ["Pendant l'interrogatoire de police, on s'aperçut pour", "la première fois qu'Eichmann soupçonnait vaguement que", "l'enjeu de toute cette affaire dépassait largement la", "question du soldat exécutant des ordres clairement", "criminels dans leur nature et leur intention, lorsque,", "avec une insistance marquée, il déclara soudain qu'il", "avait vécu toute sa vie selon les préceptes moraux de", "Kant, et particulièrement selon la définition", "kantienne du devoir. À première vue, c'était faire", "outrage à Kant et c'était aussi incompréhensible, dans", "la mesure où la philosophie de Kant est étroitement", "liée à la faculté humaine de jugement qui exclut", "l'obéissance aveugle.", "L'officier de police n'insista pas, mais le juge", "Raveh, intrigué ou indigné qu'Eichmann ait osé", "invoquer le nom de Kant en liaison avec ses crimes,", "décida d'interroger l'accusé. C'est alors qu'à la", "stupéfaction générale, Eichmann produisit une", "définition approximative, mais correcte, de", "l'impératif catégorique : « Je voulais dire, à propos", "de Kant, que le principe de ma volonté doit toujours", "être tel qu'il puisse devenir le principe des lois", "générales. » (Ce qui n'est pas le cas pour le vol, ou", "le meurtre, par exemple, car il est inconcevable que", "le voleur, ou le meurtrier puissent avoir envie de", "vivre sous un système de lois qui donnerait aux autres", "le droit de le voler ou de l'assassiner.) Interrogé", "plus longuement, il ajouta qu'il avait lu la Critique", "de la raison pratique de Kant.", "Il se mit ensuite à expliquer qu'à partir du moment où", "il avait été chargé de mettre en œuvre la Solution", "finale, il avait cessé de vivre selon les principes de", "Kant ; qu'il le savait, et qu'il s'était consolé en", "pensant qu'il n'était plus « maître de ses actes »,", "qu'il ne pouvait « rien changer ». Ce que, au", "tribunal, il ne parvint pas à discerner est le fait", "qu'à cette « époque de crimes légalisés par l'État »,", "comme il disait maintenant lui-même, il n'avait pas", "simplement écarté la formule kantienne comme n'étant", "plus applicable, il l'avait déformée pour lui faire", "dire maintenant : Agis comme si le principe de tes", "actes était le même que celui du législateur ou des", "lois du pays, ou, selon la formulation de «", "l'impératif catégorique dans le IIIe Reich » donné par", "Hans Frank [gouverneur général de la Pologne occupée]", "et qu'Eichmann connaissait peut-être : « Agis de telle", "manière que le Führer, s'il avait connaissance de ton", "action, l'approuverait. » (Die Technik des Staates,", "1942, p. 15-16).", "Certes Kant n'a jamais rien voulu dire de tel ; pour", "lui au contraire, tout homme est législateur dès qu'il", "commence à agir ; en utilisant sa « raison pratique »,", "l'homme découvre les principes qui peuvent et doivent", "être les principes de la loi. Mais il est vrai que la", "déformation inconsciente d'Eichmann correspond à ce", "qu'il nommait lui-même une adaptation de Kant « à", "l'usage domestique du petit homme ». Dans un tel usage", "domestique, tout ce qui reste de l'esprit kantien est", "l'exigence qu'un homme doit faire plus qu'obéir à la", "loi, qu'il doit aller au-delà du simple impératif", "d'obéissance et identifier sa propre volonté au", "principe qui sous-tend la loi – la source d'où jaillit", "la loi.", "Dans la philosophie de Kant, cette source était la", "raison pratique ; dans l'usage domestique qu'en", "faisait Eichmann, c'était la volonté du Führer."], "mots": "Mots-clés : Impératif catégorique, Raison pratique, Obéissance aveugle.", "lire": "<p><b>Objet du texte.</b> Peut-on invoquer le devoir pour justifier l’obéissance à des ordres criminels ? <b>Notion du programme.</b> Le devoir.</p><p><b>Connecteurs repérés.</b> « mais » (l.14), « alors » (l.17), « car » (l.24), « si… » (l.41). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Impératif catégorique</i> : principe kantien : agir selon une maxime que l’on peut vouloir comme loi universelle. ; <i>Raison pratique</i> : raison qui détermine la volonté et découvre les principes de la loi morale. ; <i>Obéissance aveugle</i> : obéir sans juger : incompatible avec la philosophie de Kant.</p>", "these": "<p><b>Thèse.</b> Eichmann a déformé l’impératif catégorique : au lieu de la raison pratique, source de la loi, il a pris la volonté du Führer. Il a gardé l’exigence d’identifier sa volonté à celle du législateur, mais en la vidant du jugement.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « Eichmann invoque Kant » ; « Une définition correcte de l’impératif catégorique » ; « Il aurait cessé d’être kantien » ; « Une formule déformée » ; « Une source déplacée ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-29", "idee": "Eichmann invoque Kant ; Une définition correcte de l’impératif catégorique.", "args": "Il déclare avoir vécu selon la définition kantienne du devoir, ce qui paraît un outrage à Kant, dont la philosophie exclut l’obéissance aveugle. Interrogé, il l’énonce : le principe de ma volonté doit pouvoir devenir le principe de lois générales.", "lien": "Après avoir montré qu’Eichmann invoque Kant et en donne une définition presque correcte, Arendt montre le moment où il cesse d’être kantien."}, {"l": "30-49", "idee": "Il aurait cessé d’être kantien ; Une formule déformée.", "args": "Chargé de la Solution finale, il avait cessé de vivre selon Kant : il n’était plus « maître de ses actes ». Il l’a transformée en : agis comme si le principe de tes actes était celui du législateur. Hans Frank : « Agis de telle manière que le Führer… l’approuverait ».", "lien": "Si la formule est déformée, on peut situer le changement décisif : la source de la loi."}, {"l": "50-66", "idee": "Une source déplacée.", "args": "Pour Kant, tout homme est législateur par sa raison pratique. Chez Eichmann, la source de la loi est la volonté du Führer.", "lien": "Cette dernière étape donne la thèse : la raison pratique, source de la loi chez Kant, est remplacée par la volonté du Führer."}], "concepts": [{"c": "Impératif catégorique", "s": "Principe kantien : agir selon une maxime que l’on peut vouloir comme loi universelle."}, {"c": "Raison pratique", "s": "Raison qui détermine la volonté et découvre les principes de la loi morale."}, {"c": "Obéissance aveugle", "s": "Obéir sans juger : incompatible avec la philosophie de Kant."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que le devoir justifierait d’obéir aux ordres, même criminels.</p><p><b>Le problème.</b> Peut-on invoquer le devoir pour justifier l’obéissance à des ordres criminels ?</p><p><b>L’enjeu.</b> La thèse n’est pas évidente : Eichmann semble citer correctement Kant, il faut donc montrer précisément où il le déforme.</p><p><b>Formule.</b> « On dit souvent que le devoir justifierait d’obéir aux ordres, même criminels, mais Arendt soutient : Eichmann a déformé l’impératif catégorique : au lieu de la raison pratique, source de la loi, il a pris la volonté du Führer. »</p><p><b>Discussion.</b> L’obéissance excuse-t-elle ? Peut-on se réfugier derrière l’ordre reçu ? Qu’est-ce que juger par soi-même ? (À comparer avec Kant.)</p>", "intro": ["On entend souvent dire qu’il suffit d’obéir aux ordres, au nom du devoir, pour ne pas être responsable de ses actes. Dans <i>Eichmann à Jérusalem</i>, Arendt montre comment Eichmann invoque Kant pour justifier son obéissance, et ce qu’il en a fait.", "Arendt soutient la thèse suivante : Eichmann a déformé l’impératif catégorique : au lieu de la raison pratique, source de la loi, il a pris la volonté du Führer. Il a gardé l’exigence d’identifier sa volonté à celle du législateur, mais en la vidant du jugement. La thèse n’est pas évidente : Eichmann semble citer correctement Kant, il faut donc montrer précisément où il le déforme.", "Le texte avance en trois temps. Des lignes 1 à 29 : « Eichmann invoque Kant » ; « Une définition correcte de l’impératif catégorique ». Des lignes 30 à 49 : « Il aurait cessé d’être kantien » ; « Une formule déformée ». Des lignes 50 à 66 : « Une source déplacée »."], "dev": [{"l": "1-29", "obj": "Eichmann invoque Kant ; Une définition correcte de l’impératif catégorique.", "sp": ["<b>Eichmann invoque Kant.</b> Il déclare avoir vécu selon la définition kantienne du devoir, ce qui paraît un outrage à Kant, dont la philosophie exclut l’obéissance aveugle.", "<b>Une définition correcte de l’impératif catégorique.</b> Interrogé, il l’énonce : le principe de ma volonté doit pouvoir devenir le principe de lois générales."], "tr": "Après avoir montré qu’Eichmann invoque Kant et en donne une définition presque correcte, Arendt montre le moment où il cesse d’être kantien."}, {"l": "30-49", "obj": "Il aurait cessé d’être kantien ; Une formule déformée.", "sp": ["<b>Il aurait cessé d’être kantien.</b> Chargé de la Solution finale, il avait cessé de vivre selon Kant : il n’était plus « maître de ses actes ».", "<b>Une formule déformée.</b> Il l’a transformée en : agis comme si le principe de tes actes était celui du législateur. Hans Frank : « Agis de telle manière que le Führer… l’approuverait »."], "tr": "Si la formule est déformée, on peut situer le changement décisif : la source de la loi."}, {"l": "50-66", "obj": "Une source déplacée.", "sp": ["<b>Une source déplacée.</b> Pour Kant, tout homme est législateur par sa raison pratique. Chez Eichmann, la source de la loi est la volonté du Führer."], "tr": ""}], "concl": ["Le texte se demande : « Peut-on invoquer le devoir pour justifier l’obéissance à des ordres criminels ? » Arendt répond ainsi : Eichmann a déformé l’impératif catégorique : au lieu de la raison pratique, source de la loi, il a pris la volonté du Führer. Il a gardé l’exigence d’identifier sa volonté à celle du législateur, mais en la vidant du jugement.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « Eichmann invoque Kant ; Une définition correcte de l’impératif catégorique » puis « Il aurait cessé d’être kantien ; Une formule déformée » puis « Une source déplacée ».", "On peut enfin discuter cette thèse. L’obéissance excuse-t-elle ? Peut-on se réfugier derrière l’ordre reçu ? Qu’est-ce que juger par soi-même ? (À comparer avec Kant.)"]}, {"id": "devoir-durkheim", "label": "Durkheim : le devoir comme fait social", "theme": "Le devoir", "auteur": "Durkheim", "oeuvre": "De la division du travail social", "fiche": "devoir-durkheim.html", "lignes": ["C’est la société qui, en nous formant moralement, a", "mis en nous ces sentiments qui nous dictent si", "impérativement notre conduite, ou qui régissent avec", "cette énergie, quand nous refusons de déférer à leurs", "injonctions. Notre conscience morale est son œuvre et", "l’exprime ; quand notre conscience parle, c’est la", "société qui parle en nous. Or le ton dont elle nous", "parle est la meilleure preuve de l’autorité", "exceptionnelle dont elle est investie.", "Est moral, peut-on dire, tout ce qui est source de", "solidarité, tout ce qui force l’homme à compter avec", "autrui, à régler ses mouvements sur autre chose que", "les impulsions de son égoïsme, et la moralité est", "d’autant plus solide que ces liens sont plus nombreux", "et plus forts. On voit combien il est inexact de la", "d
