éfinir, comme on a fait souvent, par la liberté ;", "elle consiste bien plutôt dans un état de dépendance.", "Loin qu’elle serve à émanciper l’individu, à le", "dégager du milieu qui l’enveloppe, elle a, au", "contraire, pour fonction essentielle d’en faire la", "partie intégrante d’un tout et, par conséquent, de lui", "enlever quelque chose de la liberté de ses mouvements.", "On rencontre parfois, il est vrai, des âmes qui ne", "sont pas sans noblesse et qui, pourtant, trouvent", "intolérable l’idée de cette dépendance. Mais c’est", "qu’elles n’aperçoivent pas les sources d’où découle", "leur propre moralité, parce que ces sources sont trop", "profondes. La conscience est un mauvais juge de ce qui", "se passe au fond de l’être, parce qu’elle n’y pénètre", "pas. La société n’est donc pas, comme on l’a cru", "souvent, un évènement étranger à la morale ou qui n’a", "sur elle que des répercussions secondaires ; c’en est,", "au contraire, la condition nécessaire. Elle n’est pas", "une simple juxtaposition d’individus qui apportent, en", "y entrant, une moralité intrinsèque ; mais l’homme", "n’est un être moral que parce qu’il vit en société,", "puisque la moralité consiste à être solidaire d’un", "groupe et varie comme cette solidarité.", "Faites évanouir toute vie sociale, et la vie morale", "s’évanouit du même coup, n’ayant plus d’objet où se", "prendre."], "mots": "Mots-clés : Conscience morale, Solidarité, Dépendance.", "lire": "<p><b>Objet du texte.</b> D’où vient la conscience morale ? <b>Notion du programme.</b> Le devoir.</p><p><b>Connecteurs repérés.</b> « si… » (l.2), « or » (l.7), « par conséquent » (l.21), « pourtant » (l.24), « mais » (l.25), « d’où » (l.26). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Conscience morale</i> : ensemble de sentiments qui dictent le devoir, produit de la société. ; <i>Solidarité</i> : lien qui unit les membres d’un groupe. ; <i>Dépendance</i> : fait de ne pas être isolé : la morale nous lie aux autres.</p>", "these": "<p><b>Thèse.</b> La conscience morale est l’œuvre de la société. Est moral ce qui est source de solidarité. La moralité est une dépendance, et la société en est la condition nécessaire.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « La société nous forme moralement » ; « Une autorité exceptionnelle » ; « Moral = ce qui est source de solidarité » ; « La morale n’est pas la liberté » ; « La société, condition de la morale ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-9", "idee": "La société nous forme moralement ; Une autorité exceptionnelle.", "args": "Elle a mis en nous des sentiments qui nous dictent notre conduite avec une énergie impérative. Le ton dont elle parle est la preuve de l’autorité dont elle est investie : notre conscience est son œuvre et l’exprime.", "lien": "Après avoir posé que la société nous forme moralement, Durkheim définit ce qui est moral : ce qui est source de solidarité."}, {"l": "10-25", "idee": "Moral = ce qui est source de solidarité ; La morale n’est pas la liberté.", "args": "Ce qui force à compter avec autrui et à régler ses mouvements sur autre chose que son égoïsme. Elle est un état de dépendance : elle fait de l’individu la partie intégrante d’un tout et lui enlève un peu de sa liberté.", "lien": "Si la morale est solidarité, elle est dépendance et non liberté : la société en est donc la condition."}, {"l": "25-41", "idee": "La société, condition de la morale.", "args": "L’homme n’est un être moral que parce qu’il vit en société. Faites évanouir la vie sociale, et la vie morale s’évanouit.", "lien": "Cette dernière étape donne la thèse : sans vie sociale, plus de vie morale."}], "concepts": [{"c": "Conscience morale", "s": "Ensemble de sentiments qui dictent le devoir, produit de la société."}, {"c": "Solidarité", "s": "Lien qui unit les membres d’un groupe."}, {"c": "Dépendance", "s": "Fait de ne pas être isolé : la morale nous lie aux autres."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que la conscience morale serait une voix intérieure, indépendante de la société.</p><p><b>Le problème.</b> D’où vient la conscience morale ?</p><p><b>L’enjeu.</b> Cette thèse n’est pas évidente : comment une conscience qui paraît si personnelle peut-elle venir de l’extérieur ?</p><p><b>Formule.</b> « On dit souvent que la conscience morale serait une voix intérieure, indépendante de la société, mais Durkheim soutient : La conscience morale est l’œuvre de la société. »</p><p><b>Discussion.</b> Un devoir sans liberté ? Si la morale vient de la société, l’individu peut-il la critiquer ? (À comparer avec Nietzsche et Kropotkine.)</p>", "intro": ["On croit souvent que la conscience morale est une voix intérieure, propre à chacun et indépendante de la société, qui nous émanciperait des conventions. Dans <i>De la division du travail social</i>, Durkheim soutient au contraire qu’elle est l’œuvre de la société.", "Durkheim soutient la thèse suivante : La conscience morale est l’œuvre de la société. Est moral ce qui est source de solidarité. La moralité est une dépendance, et la société en est la condition nécessaire. Cette thèse n’est pas évidente : comment une conscience qui paraît si personnelle peut-elle venir de l’extérieur ?", "Le texte avance en trois temps. Des lignes 1 à 9 : « La société nous forme moralement » ; « Une autorité exceptionnelle ». Des lignes 10 à 25 : « Moral = ce qui est source de solidarité » ; « La morale n’est pas la liberté ». Des lignes 25 à 41 : « La société, condition de la morale »."], "dev": [{"l": "1-9", "obj": "La société nous forme moralement ; Une autorité exceptionnelle.", "sp": ["<b>La société nous forme moralement.</b> Elle a mis en nous des sentiments qui nous dictent notre conduite avec une énergie impérative.", "<b>Une autorité exceptionnelle.</b> Le ton dont elle parle est la preuve de l’autorité dont elle est investie : notre conscience est son œuvre et l’exprime."], "tr": "Après avoir posé que la société nous forme moralement, Durkheim définit ce qui est moral : ce qui est source de solidarité."}, {"l": "10-25", "obj": "Moral = ce qui est source de solidarité ; La morale n’est pas la liberté.", "sp": ["<b>Moral = ce qui est source de solidarité.</b> Ce qui force à compter avec autrui et à régler ses mouvements sur autre chose que son égoïsme.", "<b>La morale n’est pas la liberté.</b> Elle est un état de dépendance : elle fait de l’individu la partie intégrante d’un tout et lui enlève un peu de sa liberté."], "tr": "Si la morale est solidarité, elle est dépendance et non liberté : la société en est donc la condition."}, {"l": "25-41", "obj": "La société, condition de la morale.", "sp": ["<b>La société, condition de la morale.</b> L’homme n’est un être moral que parce qu’il vit en société. Faites évanouir la vie sociale, et la vie morale s’évanouit."], "tr": ""}], "concl": ["Le texte se demande : « D’où vient la conscience morale ? » Durkheim répond ainsi : La conscience morale est l’œuvre de la société. Est moral ce qui est source de solidarité. La moralité est une dépendance, et la société en est la condition nécessaire.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « La société nous forme moralement ; Une autorité exceptionnelle » puis « Moral = ce qui est source de solidarité ; La morale n’est pas la liberté » puis « La société, condition de la morale ».", "On peut enfin discuter cette thèse. Un devoir sans liberté ? Si la morale vient de la société, l’individu peut-il la critiquer ? (À comparer avec Nietzsche et Kropotkine.)"]}, {"id": "devoir-holbach", "label": "D’Holbach : fonder la morale sur la nature", "theme": "Le devoir", "auteur": "D’Holbach", "oeuvre": "Système de la nature", "fiche": "devoir-holbach.html", "lignes": ["La morale n'est point faite pour suivre les caprices", "de l'imagination, des passions, des intérêts de", "l’homme : elle doit être stable, elle doit être la", "même pour tous les individus de la race humaine, elle", "ne doit point varier d'un pays ou d'un temps à un", "autre ; la religion n'est point en droit de faire", "plier ses règles immuables sous les lois changeantes", "de ses dieux. Il n'y a qu'un moyen de donner à la", "morale cette solidité inébranlable ; nous l'avons", "indiqué dans plus d'un endroit de cet ouvrage ; il ne", "s'agit que de la fonder, sur nos devoirs, sur la", "nature de l'homme, sur les rapports subsistants entre", "des êtres intelligents, qui chacun de leur côté sont", "amoureux de leur bonheur, sont occupés à se conserver,", "qui vivent en société afin d'y parvenir plus sûrement.", "En un mot il faut donner pour base à la morale la", "nécessité des choses. En pesant ces principes, puisés", "dans la nature, évidents par eux-mêmes, confirmés par", "des expériences constantes, approuvés par la raison,", "l'on aura une morale certaine et un système de", "conduite qui ne se démentira jamais. On n'aura pas", "besoin de recourir aux chimères théologiques pour", "régler sa conduite dans le monde visible. On sera en", "état de répondre à ceux qui prétendent que sans un", "dieu il ne peut y avoir de morale ; et que ce dieu, en", "vertu de sa puissance et de l'empire souverain qui lui", "appartient sur ses créatures, a seul droit de leur", "imposer des lois, et de les soumettre à des devoirs", "qui les obligent.[…] Quelle que soit la cause qui", "plaça l'homme dans le séjour qu'il habite, et qui lui", "donna ses facultés ; soit qu'on regarde l'espèce", "humaine comme l’ouvrage de la nature, soit qu'on", "suppose qu'elle doit son existence à un être", "intelligent distingué de la nature ; l'existence de", "l'homme, tel qu'il est, est un fait ; nous voyons en", "lui un être qui sent, qui pense, qui a de", "l'intelligence, qui s'aime lui-même, qui tend à se", "conserver, qui dans chaque instant de sa durée", "s'efforce de rendre son existence agréable, qui pour", "satisfaire plus aisément ses besoins et se procurer", "des plaisirs, vit en société avec des êtres semblables", "à lui, que sa conduite peut rendre favorables ou", "indisposer contre lui.", "C'est donc sur ces sentiments universels, inhérents à", "notre nature et qui subsisteront autant que la race", "des mortels, que l'on doit fonder la morale qui n'est", "que la science des devoirs de l'homme vivant en", "société."], "mots": "Mots-clés : Nécessité des choses, Chimères théologiques, Morale universelle.", "lire": "<p><b>Objet du texte.</b> Sur quoi fonder une morale solide et universelle ? <b>Notion du programme.</b> Le devoir.</p><p><b>Connecteurs repérés.</b> « donc » (l.44). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Nécessité des choses</i> : fondement naturel et rationnel de la morale, indépendant de la religion. ; <i>Chimères théologiques</i> : croyances religieuses que D’Holbach juge sans fondement. ; <i>Morale universelle</i> : qui vaut pour tous les hommes en tout temps.</p>", "these": "<p><b>Thèse.</b> La morale ne doit pas dépendre de la religion : elle se fonde sur la nature de l’homme, être sensible, qui tend à se conserver et à être heureux, et qui vit en société. Elle est la science des devoirs de l’homme en société.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « Une morale stable et universelle » ; « La religion ne peut pas la plier » ; « Un seul fondement solide » ; « Pas besoin de chimères théologiques » ; « L’homme est un fait ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-17", "idee": "Une morale stable et universelle ; La religion ne peut pas la plier ; Un seul fondement solide.", "args": "Elle ne doit pas suivre les caprices des passions ni varier d’un pays à l’autre. La religion n’a pas le droit de faire plier des règles immuables sous les lois changeantes de ses dieux. Fonder la morale sur nos devoirs, la nature de l’homme et les rapports entre êtres intelligents qui aiment leur bonheur : « la nécessité des choses ».", "lien": "Après avoir posé qu’une morale doit être stable et universelle, d’Holbach en tire que la religion ne peut pas la fonder : un seul fondement convient, tiré de la nature."}, {"l": "17-43", "idee": "Pas besoin de chimères théologiques.", "args": "On peut répondre à ceux qui disent que sans dieu il n’y a pas de morale.", "lien": "Si la morale se fonde sur la nature, il n’y a pas besoin de chimères théologiques pour la justifier."}, {"l": "44-48", "idee": "L’homme est un fait.", "args": "Quelle que soit son origine, l’homme est un être qui sent, pense, s’aime, tend à se conserver et vit en société : la morale est la science des devoirs de l’homme vivant en société.", "lien": "Ce dernier temps donne le fondement : l’homme est un fait, un être sensible qui veut se conserver, être heureux et vivre en société."}], "concepts": [{"c": "Nécessité des choses", "s": "Fondement naturel et rationnel de la morale, indépendant de la religion."}, {"c": "Chimères théologiques", "s": "Croyances religieuses que D’Holbach juge sans fondement."}, {"c": "Morale universelle", "s": "Qui vaut pour tous les hommes en tout temps."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que la morale aurait besoin de la religion, de Dieu, pour être fondée.</p><p><b>Le problème.</b> Sur quoi fonder une morale solide et universelle ?</p><p><b>L’enjeu.</b> Cette thèse n’est pas évidente : comment une morale peut-elle être solide et universelle sans appui divin ?</p><p><b>Formule.</b> « On dit souvent que la morale aurait besoin de la religion, de Dieu, pour être fondée, mais D’Holbach soutient : La morale ne doit pas dépendre de la religion : elle se fonde sur la nature de l’homme, être sensible, qui tend à se conserver et à être heureux, et qui vit en société. »</p><p><b>Discussion.</b> La nature fonde-t-elle des devoirs ? Du fait que l’homme cherche son bonheur, peut-on déduire ce qu’il doit faire ? (À comparer avec Kant.)</p>", "intro": ["On croit souvent que la morale ne peut se fonder que sur la religion : sans Dieu, rien ne la garantirait. Dans le <i>Système de la nature</i>, d’Holbach soutient qu’elle se fonde sur la nature de l’homme.", "D’Holbach soutient la thèse suivante : La morale ne doit pas dépendre de la religion : elle se fonde sur la nature de l’homme, être sensible, qui tend à se conserver et à être heureux, et qui vit en société. Elle est la science des devoirs de l’homme en société. Cette thèse n’est pas évidente : comment une morale peut-elle être solide et universelle sans appui divin ?", "Le texte avance en trois temps. Des lignes 1 à 17 : « Une morale stable et universelle » ; « La religion ne peut pas la plier » ; « Un seul fondement solide ». Des lignes 17 à 43 : « Pas besoin de chimères théologiques ». Des lignes 44 à 48 : « L’homme est un fait »."], "dev": [{"l": "1-17", "obj": "Une morale stable et universelle ; La religion ne peut pas la plier ; Un seul fondement solide.", "sp": ["<b>Une morale stable et universelle.</b> Elle ne doit pas suivre les caprices des passions ni varier d’un pays à l’autre.", "<b>La religion ne peut pas la plier.</b> La religion n’a pas le droit de faire plier des règles immuables sous les lois changeantes de ses dieux.", "<b>Un seul fondement solide.</b> Fonder la morale sur nos devoirs, la nature de l’homme et les rapports entre êtres intelligents qui aiment leur bonheur : « la nécessité des choses »."], "tr": "Après avoir posé qu’une morale doit être stable et universelle, d’Holbach en tire que la religion ne peut pas la fonder : un seul fondement convient, tiré de la nature."}, {"l": "17-43", "obj": "Pas besoin de chimères théologiques.", "sp": ["<b>Pas besoin de chimères théologiques.</b> On peut répondre à ceux qui disent que sans dieu il n’y a pas de morale."], "tr": "Si la morale se fonde sur la nature, il n’y a pas besoin de chimères théologiques pour la justifier."}, {"l": "44-48", "obj": "L’homme est un fait.", "sp": ["<b>L’homme est un fait.</b> Quelle que soit son origine, l’homme est un être qui sent, pense, s’aime, tend à se conserver et vit en société : la morale est la science des devoirs de l’homme vivant en société."], "tr": ""}], "concl": ["Le texte se demande : « Sur quoi fonder une morale solide et universelle ? » D’Holbach répond ainsi : La morale ne doit pas dépendre de la religion : elle se fonde sur la nature de l’homme, être sensible, qui tend à se conserver et à être heureux, et qui vit en société. Elle est la science des devoirs de l’homme en société.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « Une morale stable et universelle ; La religion ne peut pas la plier ; Un seul fondement solide » puis « Pas besoin de chimères théologiques » puis « L’homme est un fait ».", "On peut enfin discuter cette thèse. La nature fonde-t-elle des devoirs ? Du fait que l’homme cherche son bonheur, peut-on déduire ce qu’il doit faire ? (À comparer avec Kant.)"]}, {"id": "devoir-kant", "label": "Kant : la bonne volonté et le devoir", "theme": "Le devoir", "auteur": "Kant", "oeuvre": "Fondements de la métaphysique des mœurs", "fiche": "devoir-kant.html", "lignes": ["De tout ce qu'il est possible de concevoir dans le", "monde, et même en général en dehors du monde, il n'y a", "qu'une seule chose qu'on puisse tenir pour bonne sans", "restriction, c'est une bonne volonté. L'intelligence,", "la finesse, le jugement, et les talents de l'esprit,", "quelque nom qu'on leur donne, ou le courage, la", "résolution, la persévérance, comme qualités du", "tempérament, sont sans doute choses bonnes et", "désirables à beaucoup d'égards ; mais ces dons de la", "nature peuvent devenir aussi extrêmement mauvais et", "pernicieux, lorsque la volonté, qui doit en faire", "usage, et dont la disposition propre s'appelle pour", "cette raison caractère, n'est pas bonne. Il en est de", "même des dons de la fortune. Le pouvoir, la richesse,", "l'honneur, la santé même, tout le bien-être, et ce", "parfait contentement de son état qu'on appelle le", "bonheur, tout cela nous donne confiance en nous, qui", "dégénère même souvent en présomption, lorsqu'il n'y a", "pas là une bonne volonté pour en redresser l'influence", "sur l'esprit, par là tout le principe de l'action, et", "les rendre universellement conformes à des fins.", "Ajoutez d'ailleurs qu'un spectateur raisonnable et", "impartial ne peut voir avec satisfaction que tout", "réussisse toujours à un être qui n'orne aucun trait de", "pure et bonne volonté.", "Ce qui fait que la bonne volonté est telle, ce ne sont", "pas ses œuvres ou ses succès, ce n'est pas son", "aptitude à atteindre tel ou tel but proposé, c'est", "seulement le vouloir ; c'est-à-dire que c'est en soi", "qu'elle est bonne ; et, considérée en elle-même, elle", "doit sans comparaison être estimée bien supérieure à", "tout ce qui pourrait être accompli par elle uniquement", "en faveur de quelque inclination et même, si l'on", "veut, de la somme de toutes les inclinations. Alors", "même que, par une particulière défaveur du sort, ou", "par l'avare dotation d'une nature marâtre, cette", "volonté serait complètement dépourvue du pouvoir de", "faire aboutir ses desseins ; alors même que dans son", "plus grand effort elle ne réussirait à rien ; alors", "même qu'il ne resterait que la bonne volonté toute", "seule (je comprends par-là, à vrai dire, non pas", "quelque chose comme un simple vœu, mais l'appel à tous", "les moyens dont nous pouvons disposer), elle n'en", "brillerait pas moins, ainsi qu'un joyau, de son éclat", "à elle, comme quelque chose qui a en soi sa valeur", "tout entière. L'utilité ou l'inutilité ne peut en rien", "accroître ou diminuer cette valeur.", "Si nous avons tiré jusqu'ici notre concept du devoir", "de l'usage commun de la raison pratique, il n'en faut", "nullement conclure que nous l'ayons traité comme un", "concept empirique. Loin de là, si nous appliquons", "notre attention à l'expérience de la conduite des", "hommes, nous nous trouvons en présence de plaintes", "continuelles et, nous l'avouons nous-mêmes, légitimes,", "sur ce fait qu'il n'y a point d'exemples certains que", "l'on puisse rapporter de l'intention d'agir par", "devoir, que mainte action peut être réalisée", "conformément à ce que le devoir ordonne, sans qu'il", "cesse pour cela d'être encore douteux qu'elle soit", "réalisée par devoir et ainsi qu'elle ait une valeur", "morale.", "Voilà pourquoi il y a eu en tout temps des philosophes", "qui ont absolument nié la réalité de cette intention", "dans les actions humaines et qui ont tout attribué à", "l'amour-propre plus ou moins raffiné ; ils ne", "mettaient pas en doute pour cela la justesse du", "concept de moralité ; ils parlaient au contraire avec", "une sincère affliction de l'infirmité et de l'impureté", "de la nature humaine, assez noble, il est vrai,", "suivant eux, pour faire sa règle d'une idée si digne", "de respect, mais en même temps trop faible pour la", "suivre, n'usant de la raison qui devrait servir à lui", "donner sa foi que pour prendre souci de l'intérêt des", "inclinations, soit de quelques-unes d'entre elles,", "soit, si l'on met les choses au mieux, de toutes, en", "les conciliant entre elles le mieux possible."], "mots": "Mots-clés : Bonne volonté, Conforme au devoir / par devoir, Inclination.", "lire": "<p><b>Objet du texte.</b> Qu’est-ce qui donne à une action sa valeur morale ? <b>Notion du programme.</b> Le devoir.</p><p><b>Connecteurs repérés.</b> « mais » (l.9), « si… » (l.33), « alors » (l.34), « non pas… mais » (l.41), « ainsi » (l.44), « pourquoi » (l.62). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Bonne volonté</i> : volonté qui veut le bien pour lui-même, par respect de la loi morale. ; <i>Conforme au devoir / par devoir</i> : une action peut être conforme au devoir sans être faite par devoir, si elle vient d’un intérêt. ; <i>Inclination</i> : penchant naturel (désir, goût) qui peut orienter l’action.</p>", "these": "<p><b>Thèse.</b> La bonne volonté est la seule chose bonne sans restriction : elle vaut par le vouloir et non par ses résultats. Mais il est difficile de prouver qu’une action est faite par devoir et non par amour-propre.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « Une seule chose est bonne sans restriction » ; « Les dons de la fortune aussi » ; « Une valeur en soi » ; « Un joyau » ; « La difficulté de l’agir par devoir ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-25", "idee": "Une seule chose est bonne sans restriction ; Les dons de la fortune aussi.", "args": "Intelligence, courage, persévérance sont bons, mais peuvent devenir pernicieux si la volonté n’est pas bonne. Pouvoir, richesse, honneur, santé, bonheur, nourrissent la présomption sans bonne volonté. Un spectateur impartial n’aime pas voir réussir un être sans bonne volonté.", "lien": "Après avoir montré que rien d’autre qu’une bonne volonté n’est bon sans restriction, Kant dit pourquoi : elle a une valeur en soi, indépendante de l’utilité."}, {"l": "26-47", "idee": "Une valeur en soi ; Un joyau.", "args": "La bonne volonté est bonne en soi, non par ses œuvres ni par ses succès. Elle vaut mieux que ce qu’elle accomplirait au profit des inclinations. Même impuissante, elle brille comme un joyau, ayant en soi sa valeur entière. L’utilité ou l’inutilité n’y change rien.", "lien": "Si la valeur tient au vouloir, reste à savoir si une action est faite par devoir ou par intérêt : c’est la difficulté."}, {"l": "48-76", "idee": "La difficulté de l’agir par devoir.", "args": "Il n’y a pas d’exemple certain d’intention d’agir par devoir : une action conforme au devoir peut venir de l’amour-propre. Certains philosophes nient donc la réalité de l’intention morale.", "lien": "Cette difficulté finale nuance la thèse : on ne peut jamais prouver avec certitude qu’une action est faite par pur devoir."}], "concepts": [{"c": "Bonne volonté", "s": "Volonté qui veut le bien pour lui-même, par respect de la loi morale."}, {"c": "Conforme au devoir / par devoir", "s": "Une action peut être conforme au devoir sans être faite par devoir, si elle vient d’un intérêt."}, {"c": "Inclination", "s": "Penchant naturel (désir, goût) qui peut orienter l’action."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que la valeur d’une action tiendrait à ses résultats, ou celle d’une personne à ses talents.</p><p><b>Le problème.</b> Qu’est-ce qui donne à une action sa valeur morale ?</p><p><b>L’enjeu.</b> Cette thèse n’est pas évidente : comment une volonté peut-elle valoir indépendamment de ses résultats, et comment savoir si l’on agit par devoir ?</p><p><b>Formule.</b> « On dit souvent que la valeur d’une action tiendrait à ses résultats, ou celle d’une personne à ses talents, mais Kant soutient : La bonne volonté est la seule chose bonne sans restriction : elle vaut par le vouloir et non par ses résultats. »</p><p><b>Discussion.</b> Un devoir sans conséquence ? Une morale qui ignore les résultats est-elle tenable ? (À comparer avec Sartre : le dilemme.)</p>", "intro": ["On juge souvent une action à ses résultats, et une personne à ses talents ou à son succès. Dans les <i>Fondements de la métaphysique des mœurs</i>, Kant soutient que seule la bonne volonté est bonne sans restriction.", "Kant soutient la thèse suivante : La bonne volonté est la seule chose bonne sans restriction : elle vaut par le vouloir et non par ses résultats. Mais il est difficile de prouver qu’une action est faite par devoir et non par amour-propre. Cette thèse n’est pas évidente : comment une volonté peut-elle valoir indépendamment de ses résultats, et comment savoir si l’on agit par devoir ?", "Le texte avance en trois temps. Des lignes 1 à 25 : « Une seule chose est bonne sans restriction » ; « Les dons de la fortune aussi ». Des lignes 26 à 47 : « Une valeur en soi » ; « Un joyau ». Des lignes 48 à 76 : « La difficulté de l’agir par devoir »."], "dev": [{"l": "1-25", "obj": "Une seule chose est bonne sans restriction ; Les dons de la fortune aussi.", "sp": ["<b>Une seule chose est bonne sans restriction.</b> Intelligence, courage, persévérance sont bons, mais peuvent devenir pernicieux si la volonté n’est pas bonne.", "<b>Les dons de la fortune aussi.</b> Pouvoir, richesse, honneur, santé, bonheur, nourrissent la présomption sans bonne volonté. Un spectateur impartial n’aime pas voir réussir un être sans bonne volonté."], "tr": "Après avoir montré que rien d’autre qu’une bonne volonté n’est bon sans restriction, Kant dit pourquoi : elle a une valeur en soi, indépendante de l’utilité."}, {"l": "26-47", "obj": "Une valeur en soi ; Un joyau.", "sp": ["<b>Une valeur en soi.</b> La bonne volonté est bonne en soi, non par ses œuvres ni par ses succès. Elle vaut mieux que ce qu’elle accomplirait au profit des inclinations.", "<b>Un joyau.</b> Même impuissante, elle brille comme un joyau, ayant en soi sa valeur entière. L’utilité ou l’inutilité n’y change rien."], "tr": "Si la valeur tient au vouloir, reste à savoir si une action est faite par devoir ou par intérêt : c’est la difficulté."}, {"l": "48-76", "obj": "La difficulté de l’agir par devoir.", "sp": ["<b>La difficulté de l’agir par devoir.</b> Il n’y a pas d’exemple certain d’intention d’agir par devoir : une action conforme au devoir peut venir de l’amour-propre. Certains philosophes nient donc la réalité de l’intention morale."], "tr": ""}], "concl": ["Le texte se demande : « Qu’est-ce qui donne à une action sa valeur morale ? » Kant répond ainsi : La bonne volonté est la seule chose bonne sans restriction : elle vaut par le vouloir et non par ses résultats. Mais il est difficile de prouver qu’une action est faite par devoir et non par amour-propre.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « Une seule chose est bonne sans restriction ; Les dons de la fortune aussi » puis « Une valeur en soi ; Un joyau » puis « La difficulté de l’agir par devoir ».", "On peut enfin discuter cette thèse. Un devoir sans conséquence ? Une morale qui ignore les résultats est-elle tenable ? (À comparer avec Sartre : le dilemme.)"]}, {"id": "devoir-kropotkine", "label": "Kropotkine : pourquoi serais-je moral ?", "theme": "Le devoir", "auteur": "Kropotkine", "oeuvre": "La Morale anarchiste", "fiche": "devoir-kropotkine.html", "lignes": ["— « Pourquoi serai-je moral ? » Voilà donc la question", "que se posèrent les rationalistes du douzième siècle,", "les philosophes du seizième siècle, les philosophes et", "les révolutionnaires du dix-huitième siècle. [...]", "— « Je serai immoral », venait dire un jeune nihiliste", "à son ami, traduisant en un acte quelconque les", "pensées qui le tourmentaient. — « Je serai immoral et", "pourquoi ne le serai-je pas ? » — « Parce que la Bible", "le veut ? Mais la Bible n’est qu’une collection de", "traditions babyloniennes et judaïques — traditions", "collectionnées comme le furent les chants d’Homère ou", "comme on le fait encore pour les chants basques ou les", "légendes mongoles ! Dois-je donc revenir à l’état", "d’esprit des peuples à demi barbares de l’Orient ? «", "Le serai-je parce que Kant me parle d’un catégorique", "impératif, d’un ordre mystérieux qui me vient du fond", "de moi-même et qui m’ordonne d’être moral ?", "Mais pourquoi ce « catégorique impératif » aurait-il", "plus de droits sur mes actes que cet autre impératif", "qui, de temps en temps, me donnera l’ordre de me", "soûler ? Un mot, rien qu’un mot, tout comme celui de", "Providence ou de Destin, inventé pour couvrir notre", "ignorance ! — « Ou bien serai-je moral pour faire", "plaisir à Bentham qui veut me faire croire que je", "serai plus heureux si je me noie pour sauver un", "passant tombé dans la rivière que si je le regarde se", "noyer ? — « Ou bien encore, parce que mon éducation", "est telle ? parce que ma mère m’a enseigné la morale ?", "Mais alors, devrai-je aussi m’agenouiller devant la", "peinture d’un christ ou d’une madone, respecter le roi", "ou l’empereur, m’incliner devant le juge que je sais", "être un coquin, seulement parce que ma mère — nos", "mères à nous tous — très bonnes, mais très ignorantes,", "nous ont enseigné un tas de bêtises ?", "« Préjugés, comme tout le reste, je travaillerai à", "m’en défaire. S’il me répugne d’être immoral, je me", "forcerai de l’être, comme, adolescent, je me forçais à", "ne pas craindre l’obscurité, le cimetière, les", "fantômes et les morts, dont on m’avait inspiré la", "crainte. Je le ferai pour briser une arme exploitée", "par les religions ; je le ferai, enfin, ne serait-ce", "que pour protester contre l’hypocrisie que l’on", "prétend nous imposer au nom d’un mot, auquel on a", "donné le nom de moralité. » Voilà le raisonnement que", "la jeunesse russe se faisait au moment où elle rompait", "avec les préjugés du « vieux monde « et arborait ce", "drapeau du nihilisme, ou plutôt de la philosophie", "anarchiste : « Ne se courber devant aucune autorité,", "si respectée qu’elle soit ; n’accepter aucun principe,", "tant qu’il n’est pas établi par la raison. » [Accentué", "par nous]"], "mots": "Mots-clés : Nihilisme, Impératif catégorique, Utilitarisme.", "lire": "<p><b>Objet du texte.</b> Sur quoi peut reposer l’obligation d’être moral ? <b>Notion du programme.</b> Le devoir.</p><p><b>Connecteurs repérés.</b> « donc » (l.1), « pourquoi » (l.1), « parce que » (l.8), « mais » (l.9), « si… » (l.25), « alors » (l.29). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Nihilisme</i> : ici : refus de toutes les valeurs reçues sans examen rationnel. ; <i>Impératif catégorique</i> : ordre moral inconditionnel chez Kant, que le jeune homme juge arbitraire. ; <i>Utilitarisme</i> : morale de Bentham fondée sur le bonheur : le bien est ce qui augmente le bonheur.</p>", "these": "<p><b>Thèse.</b> Le raisonnement du jeune nihiliste écarte tour à tour la religion, l’impératif catégorique, l’utilitarisme et l’éducation. Il fait de la raison la seule autorité : n’accepter aucun principe tant qu’il n’est pas établi par la raison.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « Une question de tout temps » ; « Pas la Bible » ; « Pas Kant, pas Bentham » ; « Pas l’éducation » ; « Le programme du nihilisme ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-9", "idee": "Une question de tout temps.", "args": "« Pourquoi serai-je moral ? » se posent les rationalistes du XIIe siècle, les philosophes du XVIe et du XVIIIe.", "lien": "Après avoir posé la question, le nihiliste examine successivement la Bible, Kant, Bentham et l’éducation, et les rejette."}, {"l": "9-34", "idee": "Pas la Bible ; Pas Kant, pas Bentham ; Pas l’éducation.", "args": "Elle n’est qu’une collection de traditions babyloniennes et judaïques : faut-il revenir à l’esprit de peuples à demi barbares ? L’impératif catégorique est « un mot » comme Providence ou Destin. L’utilitarisme voudrait me faire croire que je serai plus heureux en sauvant un noyé. Faut-il aussi s’agenouiller devant un christ, respecter le roi, s’incliner devant un juge qu’on sait coquin, parce que nos mères nous l’ont appris ?", "lien": "Puisqu’aucun de ces fondements ne tient, il faut tirer le programme du nihilisme : ne reconnaître que la raison."}, {"l": "35-51", "idee": "Le programme du nihilisme.", "args": "Ne se courber devant aucune autorité, n’accepter aucun principe tant qu’il n’est pas établi par la raison : la philosophie anarchiste.", "lien": "Le programme final donne la thèse : ne se courber devant aucune autorité tant qu’elle n’est pas établie par la raison."}], "concepts": [{"c": "Nihilisme", "s": "Ici : refus de toutes les valeurs reçues sans examen rationnel."}, {"c": "Impératif catégorique", "s": "Ordre moral inconditionnel chez Kant, que le jeune homme juge arbitraire."}, {"c": "Utilitarisme", "s": "Morale de Bentham fondée sur le bonheur : le bien est ce qui augmente le bonheur."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que l’on serait moral par habitude, ou par obéissance à une autorité (religion, devoir, éducation).</p><p><b>Le problème.</b> Sur quoi peut reposer l’obligation d’être moral ?</p><p><b>L’enjeu.</b> Le texte est un raisonnement prêté à un jeune nihiliste : il faut distinguer ce que celui-ci soutient et ce que Kropotkine en retient.</p><p><b>Formule.</b> « On dit souvent que l’on serait moral par habitude, ou par obéissance à une autorité (religion, devoir, éducation), mais Kropotkine soutient : Le raisonnement du jeune nihiliste écarte tour à tour la religion, l’impératif catégorique, l’utilitarisme et l’éducation. »</p><p><b>Discussion.</b> Peut-on prouver la morale ? Si aucune autorité n’est valable, qu’est-ce qui reste ? Kropotkine répond ailleurs par l’entraide. (À comparer avec Nietzsche.)</p>", "intro": ["On répond souvent à la question « pourquoi être moral ? » par la religion, le devoir ou l’éducation. Dans <i>La Morale anarchiste</i>, Kropotkine fait raisonner un jeune nihiliste qui écarte tour à tour chacune de ces réponses.", "Kropotkine soutient la thèse suivante : Le raisonnement du jeune nihiliste écarte tour à tour la religion, l’impératif catégorique, l’utilitarisme et l’éducation. Il fait de la raison la seule autorité : n’accepter aucun principe tant qu’il n’est pas établi par la raison. Le texte est un raisonnement prêté à un jeune nihiliste : il faut distinguer ce que celui-ci soutient et ce que Kropotkine en retient.", "Le texte avance en trois temps. Des lignes 1 à 9 : « Une question de tout temps ». Des lignes 9 à 34 : « Pas la Bible » ; « Pas Kant, pas Bentham » ; « Pas l’éducation ». Des lignes 35 à 51 : « Le programme du nihilisme »."], "dev": [{"l": "1-9", "obj": "Une question de tout temps.", "sp": ["<b>Une question de tout temps.</b> « Pourquoi serai-je moral ? » se posent les rationalistes du XIIe siècle, les philosophes du XVIe et du XVIIIe."], "tr": "Après avoir posé la question, le nihiliste examine successivement la Bible, Kant, Bentham et l’éducation, et les rejette."}, {"l": "9-34", "obj": "Pas la Bible ; Pas Kant, pas Bentham ; Pas l’éducation.", "sp": ["<b>Pas la Bible.</b> Elle n’est qu’une collection de traditions babyloniennes et judaïques : faut-il revenir à l’esprit de peuples à demi barbares ?", "<b>Pas Kant, pas Bentham.</b> L’impératif catégorique est « un mot » comme Providence ou Destin. L’utilitarisme voudrait me faire croire que je serai plus heureux en sauvant un noyé.", "<b>Pas l’éducation.</b> Faut-il aussi s’agenouiller devant un christ, respecter le roi, s’incliner devant un juge qu’on sait coquin, parce que nos mères nous l’ont appris ?"], "tr": "Puisqu’aucun de ces fondements ne tient, il faut tirer le programme du nihilisme : ne reconnaître que la raison."}, {"l": "35-51", "obj": "Le programme du nihilisme.", "sp": ["<b>Le programme du nihilisme.</b> Ne se courber devant aucune autorité, n’accepter aucun principe tant qu’il n’est pas établi par la raison : la philosophie anarchiste."], "tr": ""}], "concl": ["Le texte se demande : « Sur quoi peut reposer l’obligation d’être moral ? » Kropotkine répond ainsi : Le raisonnement du jeune nihiliste écarte tour à tour la religion, l’impératif catégorique, l’utilitarisme et l’éducation. Il fait de la raison la seule autorité : n’accepter aucun principe tant qu’il n’est pas établi par la raison.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « Une question de tout temps » puis « Pas la Bible ; Pas Kant, pas Bentham ; Pas l’éducation » puis « Le programme du nihilisme ».", "On peut enfin discuter cette thèse. Peut-on prouver la morale ? Si aucune autorité n’est valable, qu’est-ce qui reste ? Kropotkine répond ailleurs par l’entraide. (À comparer avec Nietzsche.)"]}, {"id": "devoir-nietzsche", "label": "Nietzsche : morale du troupeau et mauvaise conscience", "theme": "Le devoir", "auteur": "Nietzsche", "oeuvre": "Généalogie de la morale", "fiche": "devoir-nietzsche.html", "lignes": ["La morale que sécrète une société est une morale du", "troupeau, qui se fonde sur une pulsion grégaire. Le", "“bien” correspond à̀ ce qui est conforme à la", "normalité, à ce qu'on a l'habitude d'observer. À la", "base du jugement moral, il y a une crainte de ce qui", "sort de l'ordinaire, un besoin de sécurité que", "l'individu trouve dans la fusion avec la masse et dans", "la conformité aux normes communes. Instinct du", "troupeau. — Là où nous rencontrons une morale, nous", "trouvons une appréciation et une hiérarchie des", "pulsions et des actions humaines. Ces appréciations et", "ces hiérarchies sont toujours l’expression des besoins", "d’une communauté et d’un troupeau : ce qui lui est", "utile au premier titre [...], cela est aussi l’étalon", "suprême de la valeur de tous les individus. La morale", "induit l’individu à devenir fonction du troupeau et à", "ne s’attribuer de valeur que comme fonction. [...] La", "moralité est l’instinct du troupeau dans l’individu.", "La moralité n’est rien d’autre (et donc, surtout, rien", "de plus) que l’obéissance aux mœurs, quelles qu’elles", "soient ; or les mœurs sont la façon traditionnelle", "d’agir et d’apprécier. Dans les situations où ne", "s’impose aucune tradition, il n’y a pas de moralité ;", "et moins la vie est déterminée par la tradition, plus", "le domaine de la moralité diminue. L’homme libre est", "immoral parce qu’il veut en tout dépendre de lui-même", "et non d’une tradition : pour toutes les formes de", "l’humanité primitive, “mauvais” est synonyme", "d’“individuel”, “libre”, “arbitraire”, “inhabituel”,", "“imprévu”, “imprévisible”.", "Si le “bien” correspond à ce qui est conforme aux", "normes ordinaires, alors le “mal” se rapporte à tout", "ce qui n'est pas régulier, à tout ce qui est", "imprévisible et sauvage. Dans son opposition au “mal”,", "les mœurs vont ainsi chercher à̀ domestiquer tout ce", "qui relève des pulsions sauvages. Les mœurs sont en ce", "sens une morale du dressage : il va s'agir de", "normaliser l'individu, de lui imposer un comportement", "régulier. L'histoire de la morale est du coup d'abord", "une histoire de la cruauté : le rappel de l'existence", "de la norme se fait par la punition, par la souffrance", "infligée, par un marquage du corps, afin de créer à", "l'homme une mémoire.", "On devinera dès l’abord que l’idée de “conscience”", "[...] a derrière elle une longue histoire, l’évolution", "de ses formes. [...] Comment à l’homme animal faire", "une mémoire ? Comment sur cette intelligence du", "moment, à la fois obtuse et trouble, sur cette", "incarnation de l’oubli, imprime-t-on quelque chose", "assez nettement pour que l’idée en demeure présente", "... Ce problème très ancien, comme bien l’on pense,", "n’a pas été résolu par des moyens précisément doux ;", "peut-être n’y va-t-il même rien de plus terrible et de", "plus inquiétant dans la préhistoire de l’homme que sa", "mnémotechnique. On applique une chose avec un fer", "rouge pour qu’elle reste dans la mémoire : seul ce qui", "ne cesse de faire souffrir reste dans la mémoire —", "c’est là un des principaux axiomes de la plus vieille", "psychologie qu’il y ait eu sur la terre.", "Mais cette mémoire n'a pas encore la forme d'une", "conscience morale à proprement parler : c'est avant", "tout le corps lui-même qui ici est discipliné par des", "dispositifs de contrôle qui s'imposent, de", "l'extérieur, à l'individu. La forme ultime de dressage", "consiste en une intériorisation de ce processus sous", "la forme du remords, de la culpabilité, de la honte :", "l'individu s’autocontrôle et se punit lui-même", "(l'agressivité, la cruauté de l'individu se retournent", "contre lui- même).", "Tous les instincts qui n’ont pas de débouché, que", "quelque force répressive empêche d’éclater au-dehors,", "retournent en dedans — c’est là ce que j’appelle", "l’intériorisation de l’homme : de cette façon se", "développe en lui ce que plus tard on appellera son", "“âme”. Tout le monde intérieur, d’origine mince à", "tenir entre cuir et chair, s’est développé et", "amplifié, a gagné en profondeur, en largeur, en", "hauteur, lorsque l’expansion de l’homme vers", "l’extérieur a été entravée. Ces formidables bastions", "que l’organisation sociale a enlevés pour se protéger", "contre les vieux instincts de liberté — et il faut", "placer le châtiment au premier rang de ces moyens de", "défense — ont réussi à faire se retourner tous les", "instincts de l’homme sauvage, libre et vagabond —", "contre l’homme lui-même.", "La rancune, la cruauté, le besoin de persécution —", "tout cela se dirigeant contre le possesseur de tels", "instincts : c’est là l’origine de la “mauvaise", "conscience”. L’homme qui par suite du manque de", "résistances et d’ennemis extérieurs, serré dans l’étau", "de la régularité des mœurs, impatiemment se déchirait,", "se persécutait, se rongeait, s’épouvantait et se", "maltraitait lui-même, cet animal que l’on veut", "“domestiquer” et qui se heurte jusqu’à se blesser aux", "barreaux de sa cage, cet être que ses privations font", "languir dans la nostalgie du désert et qui fatalement", "devait trouver en lui un champ d’aventures, un jardin", "de supplices, une contrée dangereuse et incertaine, —", "ce fou, ce captif aux aspirations désespérées, devint", "l’inventeur de la “mauvaise conscience”."], "mots": "Mots-clés : Morale du troupeau, Mœurs, Mnémotechnique.", "lire": "<p><b>Objet du texte.</b> Comment s’est formée la morale, et que vaut-elle ? <b>Notion du programme.</b> Le devoir.</p><p><b>Connecteurs repérés.</b> « donc » (l.19), « or » (l.21), « si… » (l.31), « alors » (l.32), « ainsi » (l.35), « mais » (l.60). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Morale du troupeau</i> : morale qui valorise la conformité et l’utilité du groupe. ; <i>Mœurs</i> : façon traditionnelle d’agir et d’apprécier. ; <i>Mnémotechnique</i> : technique pour fixer la mémoire, ici par la douleur.</p>", "these": "<p><b>Thèse.</b> La morale est l’obéissance aux mœurs : une morale du troupeau, qui fait de l’individu une fonction. Elle s’est imposée par le dressage et la cruauté, puis par l’intériorisation des instincts, origine de la mauvaise conscience.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « La morale du troupeau » ; « Moralité = obéissance aux mœurs » ; « Mal = ce qui sort de la règle » ; « Une histoire de cruauté » ; « L’intériorisation : la mauvaise conscience ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-43", "idee": "La morale du troupeau ; Moralité = obéissance aux mœurs ; Mal = ce qui sort de la règle.", "args": "Le « bien » est ce qui est conforme à la normalité, par crainte de l’inhabituel. La morale fait de l’individu une fonction du troupeau. Sans tradition, pas de moralité. L’homme libre est immoral, car il veut dépendre de lui-même. Le « mal » est l’imprévisible et le sauvage. Les mœurs domestiquent les pulsions : c’est une morale de dressage.", "lien": "Après avoir défini la morale comme obéissance aux mœurs, Nietzsche retrace son histoire : comment a-t-on fait obéir l’homme ?"}, {"l": "44-69", "idee": "Une histoire de cruauté.", "args": "Pour faire une mémoire à l’homme, on a usé de la douleur : « seul ce qui ne cesse de faire souffrir reste dans la mémoire ».", "lien": "Le dressage par la cruauté prépare l’étape finale : l’homme intériorise les instincts qu’il ne peut plus décharger."}, {"l": "70-100", "idee": "L’intériorisation : la mauvaise conscience.", "args": "Les instincts qui ne peuvent s’extérioriser se retournent contre l’homme lui-même : remords, culpabilité, « âme ».", "lien": "L’intériorisation donne naissance à la mauvaise conscience : voilà l’origine de la conscience morale."}], "concepts": [{"c": "Morale du troupeau", "s": "Morale qui valorise la conformité et l’utilité du groupe."}, {"c": "Mœurs", "s": "Façon traditionnelle d’agir et d’apprécier."}, {"c": "Mnémotechnique", "s": "Technique pour fixer la mémoire, ici par la douleur."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que la morale serait naturelle et universelle, et la conscience la voix de Dieu ou de la raison.</p><p><b>Le problème.</b> Comment s’est formée la morale, et que vaut-elle ?</p><p><b>L’enjeu.</b> Cette thèse est provocante : si la morale vient du dressage, que vaut-elle ? Il faut suivre le raisonnement généalogique de Nietzsche.</p><p><b>Formule.</b> « On dit souvent que la morale serait naturelle et universelle, et la conscience la voix de Dieu ou de la raison, mais Nietzsche soutient : La morale est l’obéissance aux mœurs : une morale du troupeau, qui fait de l’individu une fonction. »</p><p><b>Discussion.</b> Une généalogie qui disqualifie ? Montrer l’origine violente de la morale, est-ce la rendre mauvaise ? (À comparer avec Durkheim.)</p>", "intro": ["On croit souvent que la morale est naturelle et universelle, et que la conscience est une voix qui vient de Dieu ou de la raison. Dans la <i>Généalogie de la morale</i>, Nietzsche en cherche l’origine et montre qu’elle est l’obéissance aux mœurs du troupeau.", "Nietzsche soutient la thèse suivante : La morale est l’obéissance aux mœurs : une morale du troupeau, qui fait de l’individu une fonction. Elle s’est imposée par le dressage et la cruauté, puis par l’intériorisation des instincts, origine de la mauvaise conscience. Cette thèse est provocante : si la morale vient du dressage, que vaut-elle ? Il faut suivre le raisonnement généalogique de Nietzsche.", "Le texte avance en trois temps. Des lignes 1 à 43 : « La morale du troupeau » ; « Moralité = obéissance aux mœurs » ; « Mal = ce qui sort de la règle ». Des lignes 44 à 69 : « Une histoire de cruauté ». Des lignes 70 à 100 : « L’intériorisation : la mauvaise conscience »."], "dev": [{"l": "1-43", "obj": "La morale du troupeau ; Moralité = obéissance aux mœurs ; Mal = ce qui sort de la règle.", "sp": ["<b>La morale du troupeau.</b> Le « bien » est ce qui est conforme à la normalité, par crainte de l’inhabituel. La morale fait de l’individu une fonction du troupeau.", "<b>Moralité = obéissance aux mœurs.</b> Sans tradition, pas de moralité. L’homme libre est immoral, car il veut dépendre de lui-même.", "<b>Mal = ce qui sort de la règle.</b> Le « mal » est l’imprévisible et le sauvage. Les mœurs domestiquent les pulsions : c’est une morale de dressage."], "tr": "Après avoir défini la morale comme obéissance aux mœurs, Nietzsche retrace son histoire : comment a-t-on fait obéir l’homme ?"}, {"l": "44-69", "obj": "Une histoire de cruauté.", "sp": ["<b>Une histoire de cruauté.</b> Pour faire une mémoire à l’homme, on a usé de la douleur : « seul ce qui ne cesse de faire souffrir reste dans la mémoire »."], "tr": "Le dressage par la cruauté prépare l’étape finale : l’homme intériorise les instincts qu’il ne peut plus décharger."}, {"l": "70-100", "obj": "L’intériorisation : la mauvaise conscience.", "sp": ["<b>L’intériorisation : la mauvaise conscience.</b> Les instincts qui ne peuvent s’extérioriser se retournent contre l’homme lui-même : remords, culpabilité, « âme »."], "tr": ""}], "concl": ["Le texte se demande : « Comment s’est formée la morale, et que vaut-elle ? » Nietzsche répond ainsi : La morale est l’obéissance aux mœurs : une morale du troupeau, qui fait de l’individu une fonction. Elle s’est imposée par le dressage et la cruauté, puis par l’intériorisation des instincts, origine de la mauvaise conscience.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « La morale du troupeau ; Moralité = obéissance aux mœurs ; Mal = ce qui sort de la règle » puis « Une histoire de cruauté » puis « L’intériorisation : la mauvaise conscience ».", "On peut enfin discuter cette thèse. Une généalogie qui disqualifie ? Montrer l’origine violente de la morale, est-ce la rendre mauvaise ? (À comparer avec Durkheim.)"]}, {"id": "devoir-rousseau-conscience", "label": "Rousseau : la conscience, instinct divin", "theme": "Le devoir", "auteur": "Rousseau", "oeuvre": "Émile, livre IV (Profession de foi du vicaire savoyard)", "fiche": "devoir-rousseau-conscience.html", "lignes": ["Conscience ! conscience ! instinct divin, immortelle", "et céleste voix ; guide assuré d’un être ignorant et", "borné, mais intelligent et libre ; juge infaillible du", "bien et du mal, qui rends l’homme semblable à Dieu,", "c’est toi qui fais l’excellence de sa nature et la", "moralité de ses actions ; sans toi je ne sens rien en", "moi qui m’élève au-dessus des bêtes, que le triste", "privilège de m’égarer d’erreur en erreur à l’aide d’un", "entendement sans règle et d’une raison sans principes.", "Grâce au ciel, nous voilà délivrés de tout cet", "effrayant appareil de philosophie : nous pouvons être", "hommes sans être savants ; dispensés de consumer notre", "vie à l’étude de la morale, nous avons à moindres", "frais un guide plus assuré dans ce dédale immense des", "opinions humaines.", "Mais ce n’est pas assez que ce guide existe, il faut", "savoir le reconnaître et le suivre. S’il parle à tous", "les cœurs, pourquoi donc y en a-t-il si peu qui", "l’entendent ? Eh ! c’est qu’il nous parle la langue de", "la nature, que tout nous a fait oublier. La conscience", "est timide, elle aime la retraite et la paix ; le", "monde et le bruit l’épouvantent : les préjugés dont on", "la fait naître sont ses plus cruels ennemis ; elle", "fuit ou se tait devant eux : leur voix bruyante", "étouffe la sienne et l’empêche de se faire entendre ;", "le fanatisme ose la contrefaire, et dicter le crime en", "son nom. Elle se rebute enfin à force d’être éconduite", "; elle ne nous parle plus, elle ne nous répond plus,", "et, après de si longs mépris pour elle, il en coûte", "autant de la rappeler qu’il en coûta de la bannir.", "Combien de fois je me suis lassé dans mes recherches", "de la froideur que je sentais en moi ! Combien de fois", "la tristesse et l’ennui, versant leur poison sur mes", "premières méditations, me les rendirent insupportables", "? Mon cœur aride ne donnait qu’un zèle languissant et", "tiède à l’amour de la vérité. Je me disais : Pourquoi", "me tourmenter à chercher ce qui n’est pas ? Le bien", "moral n’est qu’une chimère ; il n’y a rien de bon que", "les plaisirs des sens. O quand on a une fois perdu le", "goût des plaisirs de l’âme, qu’il est difficile de le", "reprendre ! Qu’il est plus difficile encore de le", "prendre quand on ne l’a jamais eu ! S’il existait un", "homme assez misérable pour n’avoir rien fait en toute", "sa vie dont le souvenir le rendît content de lui-même", "et bien aise d’avoir vécu, cet homme serait incapable", "de jamais se connaître ; et, faute de sentir quelle", "bonté convient à sa nature, il resterait méchant par", "force et serait éternellement malheureux.", "Mais croyez-vous qu’il y ait sur la terre entière un", "seul homme assez dépravé pour n’avoir jamais livré son", "cœur à la tentation de bien faire ? Cette tentation", "est si naturelle et si douce, qu’il est impossible de", "lui résister toujours ; et le souvenir du plaisir", "qu’elle a produit une fois suffit pour la rappeler", "sans cesse. Malheureusement elle est d’abord pénible à", "satisfaire ; on a mille raisons pour se refuser au", "penchant de son cœur ; la fausse prudence le resserre", "dans les bornes du moi humain ; il faut mille efforts", "de courage pour oser les franchir. Se plaire à bien", "faire est le prix d’avoir bien fait, et ce prix ne", "s’obtient qu’après l’avoir mérité.", "Rien n’est plus aimable que la vertu ; mais il en faut", "jouir pour la trouver telle. Quand on la veut", "embrasser, semblable au Protée de la fable, elle prend", "d’abord mille formes effrayantes, et ne se montre", "enfin sous la sienne qu’à ceux qui n’ont point lâché", "prise. Combattu sans cesse par mes sentiments naturels", "qui parlaient pour l’intérêt commun, et par ma raison", "qui rapportait tout à moi, j’aurais flotté toute ma", "vie dans cette continuelle alternative, faisant le", "mal, aimant le bien, et toujours contraire à moi-même,", "si de nouvelles lumières n’eussent éclairé mon cœur,", "si la vérité, qui fixa mes opinions, n’eût encore", "assuré ma conduite et ne m’eût mis d’accord avec moi.", "On a beau vouloir établir la vertu par la raison", "seule, quelle solide base peut-on lui donner ? La", "vertu, disent-ils, est l’amour de l’ordre. Mais cet", "amour peut-il donc et doit-il l’emporter en moi sur", "celui de mon bien-être ? Qu’ils me donnent une raison", "claire et suffisante pour le préférer. Dans le fond", "leur prétendu principe est un pur jeu de mots ; car je", "dis aussi, moi, que le vice est l’amour de l’ordre,", "pris dans un sens différent. Il y a quelque ordre", "moral partout où il y a sentiment et intelligence. La", "différence est que le bon s’ordonne par rapport au", "tout, et que le méchant ordonne le tout par rapport à", "lui. Celui-ci se fait le centre de toutes choses ;", "l’autre mesure son rayon et se tient à la", "circonférence.", "Alors il est ordonné par rapport au centre commun, qui", "est Dieu, et par rapport à tous les cercles", "concentriques, qui sont les créatures. Si la Divinité", "n’est pas, il n’y a que le méchant qui raisonne, le", "bon n’est qu’un insensé. O mon enfant, puissiez-vous", "sentir un jour de quel poids on est soulagé, quand,", "après avoir épuisé la vanité des opinions humaines et", "goûté l’amertume des passions, on trouve enfin si près", "de soi la route de la sagesse, le prix des travaux de", "cette vie, et la source du bonheur dont on a désespéré", "!", "Tous les devoirs de la loi naturelle, presque effacés", "de mon cœur par l’injustice des hommes, s’y retracent", "au nom de l’éternelle justice qui me les impose et qui", "me les voit remplir. Je ne sens plus en moi que", "l’ouvrage et l’instrument du grand Être qui veut le", "bien, qui le fait, qui fera le mien par le concours de", "mes volontés aux siennes et par le bon usage de ma", "liberté : j’acquiesce à l’ordre qu’il établit, sûr de", "jouir moi-même un jour de cet ordre et d’y trouver ma", "félicité ; car quelle félicité plus douce que de se", "sentir ordonné dans un système où tout est bien ? En", "proie à la douleur, je la supporte avec patience, en", "songeant qu’elle est passagère et qu’elle vient d’un", "corps qui n’est point à moi.", "Si je fais une bonne action sans témoin, je sais", "qu’elle est vue, et je prends acte pour l’autre vie de", "ma conduite en celle-ci. En souffrant une injustice,", "je me dis : l’Etre juste qui régit tout saura bien", "m’en dédommager, les besoins de mon corps, les misères", "de ma vie me rendent l’idée de la mort plus", "supportable. Ce seront autant de liens de moins à", "rompre quand il faudra tout quitter. Pourquoi mon âme", "est-elle soumise à mes sens et enchaînée à ce corps", "qui l’asservit et la gêne ? Je n’en sais rien : suis-", "je entré dans les décrets de Dieu ? Mais je puis, sans", "témérité, former de modestes conjectures. Je me dis :", "Si l’esprit de l’homme fût resté libre et pur, quel", "mérite aurait-il d’aimer et suivre l’ordre qu’il", "verrait établi et qu’il n’aurait nul intérêt à", "troubler ?", "Il serait heureux, il est vrai ; mais il manquerait à", "son bonheur le degré le plus sublime, la gloire de la", "vertu et le bon témoignage de soi ; il ne serait que", "comme les anges ; et sans doute l’homme vertueux sera", "plus qu’eux. Unie à un corps mortel par des liens non", "moins puissants qu’incompréhensibles, le soin de la", "conservation de ce corps excite l’âme à rapporter tout", "à lui, et lui donne un intérêt contraire à l’ordre", "général, qu’elle est pourtant capable de voir et", "d’aimer ; c’est alors que le bon usage de sa liberté", "devient à la fois le mérite et la récompense, et", "qu’elle se prépare un bonheur inaltérable en", "combattant ses passions terrestres et se maintenant", "dans sa première volonté."], "mots": "Mots-clés : Conscience morale, Préjugé, Amour de l’ordre.", "lire": "<p><b>Objet du texte.</b> Sur quoi repose la moralité : sur la raison ou sur la conscience ? <b>Notion du programme.</b> Le devoir.</p><p><b>Connecteurs repérés.</b> « mais » (l.3), « donc » (l.18), « pourquoi » (l.18), « si… » (l.18), « car » (l.81), « alors » (l.90). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Conscience morale</i> : faculté de sentir le bien et le mal, antérieure au raisonnement. ; <i>Préjugé</i> : opinion reçue qui couvre la voix de la conscience. ; <i>Amour de l’ordre</i> : définition rationaliste de la vertu, que Rousseau juge insuffisante.</p>", "these": "<p><b>Thèse.</b> La conscience est un instinct divin, juge infaillible du bien et du mal, qui rend l’homme semblable à Dieu. La raison seule ne peut pas fonder la vertu : il faut le sentiment, et la croyance en un ordre divin.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « Un guide sûr » ; « Pas besoin d’être savant » ; « Pourquoi l’entend-on si peu ? » ; « La raison seule ne fonde pas la vertu » ; « Une vertu qui exige Dieu ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-15", "idee": "Un guide sûr ; Pas besoin d’être savant.", "args": "La conscience est un instinct divin, un guide assuré d’un être ignorant et borné, mais intelligent et libre. Grâce à elle, on peut être homme sans être savant, dispensé de l’appareil de la philosophie.", "lien": "Après avoir posé que la conscience est un guide sûr qui n’exige pas d’être savant, Rousseau se demande pourquoi on l’entend si peu et pourquoi la raison ne suffit pas."}, {"l": "16-92", "idee": "Pourquoi l’entend-on si peu ? ; La raison seule ne fonde pas la vertu.", "args": "Elle parle la langue de la nature, qu’on a oubliée. Timide, elle fuit le bruit du monde. Les préjugés, le fanatisme l’étouffent ou la contrefont. Définir la vertu par l’amour de l’ordre est un jeu de mots : le vice aussi. Le bon s’ordonne par rapport au tout, le méchant par rapport à lui.", "lien": "Si la raison seule ne fonde pas la vertu, il faut un autre fondement : la vertu exige l’existence d’un ordre divin."}, {"l": "92-144", "idee": "Une vertu qui exige Dieu.", "args": "Si la Divinité n’est pas, seul le méchant raisonne et le bon est un insensé. Le bon usage de la liberté est à la fois mérite et récompense.", "lien": "Ce dernier temps donne la thèse : la conscience est un instinct divin, et la vertu suppose la croyance en Dieu."}], "concepts": [{"c": "Conscience morale", "s": "Faculté de sentir le bien et le mal, antérieure au raisonnement."}, {"c": "Préjugé", "s": "Opinion reçue qui couvre la voix de la conscience."}, {"c": "Amour de l’ordre", "s": "Définition rationaliste de la vertu, que Rousseau juge insuffisante."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que la morale demanderait de la science et de la raison : il faudrait savoir ce qui est bien pour bien agir.</p><p><b>Le problème.</b> Sur quoi repose la moralité : sur la raison ou sur la conscience ?</p><p><b>L’enjeu.</b> Cette thèse n’est pas évidente : comment un sentiment peut-il juger infailliblement, et pourquoi y aurait-il besoin de Dieu ?</p><p><b>Formule.</b> « On dit souvent que la morale demanderait de la science et de la raison : il faudrait savoir ce qui est bien pour bien agir, mais Rousseau soutient : La conscience est un instinct divin, juge infaillible du bien et du mal, qui rend l’homme semblable à Dieu. »</p><p><b>Discussion.</b> Un instinct moral inné ? La conscience est-elle innée ou produite par l’éducation ? (À comparer avec Durkheim.)</p>", "intro": ["On croit souvent que la morale demande de la science ou de la raison : il faudrait savoir ce qui est bien pour bien agir. Dans la <i>Profession de foi du vicaire savoyard</i> (<i>Émile</i>, livre IV), Rousseau soutient que la conscience est un instinct divin.", "Rousseau soutient la thèse suivante : La conscience est un instinct divin, juge infaillible du bien et du mal, qui rend l’homme semblable à Dieu. La raison seule ne peut pas fonder la vertu : il faut le sentiment, et la croyance en un ordre divin. Cette thèse n’est pas évidente : comment un sentiment peut-il juger infailliblement, et pourquoi y aurait-il besoin de Dieu ?", "Le texte avance en trois temps. Des lignes 1 à 15 : « Un guide sûr » ; « Pas besoin d’être savant ». Des lignes 16 à 92 : « Pourquoi l’entend-on si peu ? » ; « La raison seule ne fonde pas la vertu ». Des lignes 92 à 144 : « Une vertu qui exige Dieu »."], "dev": [{"l": "1-15", "obj": "Un guide sûr ; Pas besoin d’être savant.", "sp": ["<b>Un guide sûr.</b> La conscience est un instinct divin, un guide assuré d’un être ignorant et borné, mais intelligent et libre.", "<b>Pas besoin d’être savant.</b> Grâce à elle, on peut être homme sans être savant, dispensé de l’appareil de la philosophie."], "tr": "Après avoir posé que la conscience est un guide sûr qui n’exige pas d’être savant, Rousseau se demande pourquoi on l’entend si peu et pourquoi la raison ne suffit pas."}, {"l": "16-92", "obj": "Pourquoi l’entend-on si peu ? ; La raison seule ne fonde pas la vertu.", "sp": ["<b>Pourquoi l’entend-on si peu ?.</b> Elle parle la langue de la nature, qu’on a oubliée. Timide, elle fuit le bruit du monde. Les préjugés, le fanatisme l’étouffent ou la contrefont.", "<b>La raison seule ne fonde pas la vertu.</b> Définir la vertu par l’amour de l’ordre est un jeu de mots : le vice aussi. Le bon s’ordonne par rapport au tout, le méchant par rapport à lui."], "tr": "Si la raison seule ne fonde pas la vertu, il faut un autre fondement : la vertu exige l’existence d’un ordre divin."}, {"l": "92-144", "obj": "Une vertu qui exige Dieu.", "sp": ["<b>Une vertu qui exige Dieu.</b> Si la Divinité n’est pas, seul le méchant raisonne et le bon est un insensé. Le bon usage de la liberté est à la fois mérite et récompense."], "tr": ""}], "concl": ["Le texte se demande : « Sur quoi repose la moralité : sur la raison ou sur la conscience ? » Rousseau répond ainsi : La conscience est un instinct divin, juge infaillible du bien et du mal, qui rend l’homme semblable à Dieu. La raison seule ne peut pas fonder la vertu : il faut le sentiment, et la croyance en un ordre divin.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « Un guide sûr ; Pas besoin d’être savant » puis « Pourquoi l’entend-on si peu ? ; La raison seule ne fonde pas la vertu » puis « Une vertu qui exige Dieu ».", "On peut enfin discuter cette thèse. Un instinct moral inné ? La conscience est-elle innée ou produite par l’éducation ? (À comparer avec Durkheim.)"]}, {"id": "devoir-rousseau-pitie", "label": "Rousseau : la pitié, sentiment naturel", "theme": "Le devoir", "auteur": "Rousseau", "oeuvre": "Discours sur l’origine et les fondements de l’inégalité parmi les hommes", "fiche": "devoir-rousseau-pitie.html", "lignes": ["Il est donc bien certain que la pitié est un sentiment", "naturel qui, modérant dans chaque individu l'activité", "de l'amour de soi-même, concourt à la conservation", "mutuelle de toute l'espèce. C'est elle qui nous porte", "sans réflexion au secours de ceux que nous voyons", "souffrir; c'est elle qui, dans l'état de nature, tient", "lieu de lois, de mœurs et de vertu, avec cet avantage", "que nul n'est tenté de désobéir à sa douce voix ;", "c'est elle qui détournera tout sauvage robuste", "d'enlever à un faible enfant ou à un vieillard infirme", "sa subsistance acquise avec peine, si lui-même espère", "pouvoir trouver la sienne ailleurs ; c'est elle qui,", "au lieu de cette maxime sublime de justice raisonnée :", "« Fais à autrui comme tu veux qu'on te fasse »,", "inspire à tous les hommes cette autre maxime de bonté", "naturelle, bien moins parfaite, mais plus utile peut-", "être que la précédente : « Fais ton bien avec le", "moindre mal d'autrui qu'il est possible ». C'est, en", "un mot, dans ce sentiment naturel […] qu'il faut", "chercher la cause de la répugnance que tout homme", "éprouverait à mal faire, même indépendamment des", "maximes de l’éducation.", "Rousseau, Discours sur l'origine et les fondements de", "l'inégalité parmi les"], "mots": "Mots-clés : Pitié, Amour de soi, État de nature.", "lire": "<p><b>Objet du texte.</b> D’où vient la répugnance à faire du mal ? <b>Notion du programme.</b> Le devoir.</p><p><b>Connecteurs repérés.</b> « donc » (l.1), « si… » (l.11), « mais » (l.16). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Pitié</i> : répugnance naturelle à voir souffrir un être sensible. ; <i>Amour de soi</i> : instinct de conservation, légitime, que la pitié modère. ; <i>État de nature</i> : situation hypothétique de l’homme avant la société et les lois.</p>", "these": "<p><b>Thèse.</b> La pitié est un sentiment naturel qui modère l’amour de soi et fonde la répugnance à mal faire, indépendamment de l’éducation. Elle inspire une maxime de bonté naturelle, moins parfaite mais plus utile que la justice raisonnée.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « Un sentiment naturel » ; « Sans réflexion » ; « Elle tient lieu de lois » ; « Un exemple » ; « Deux maximes ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-13", "idee": "Un sentiment naturel ; Sans réflexion ; Elle tient lieu de lois ; Un exemple.", "args": "La pitié est naturelle : elle modère l’amour de soi et concourt à la conservation de l’espèce. Elle nous porte au secours de ceux qui souffrent, sans que nous ayons besoin de raisonner. À l’état de nature, elle remplace lois, mœurs et vertu, et personne n’est tenté de désobéir à sa « douce voix ». Elle détourne le sauvage robuste d’enlever à un enfant ou à un vieillard leur subsistance, s’il peut trouver la sienne ailleurs.", "lien": "Après avoir établi que la pitié est un sentiment naturel qui agit sans réflexion et tient lieu de lois, Rousseau en tire deux maximes."}, {"l": "14-24", "idee": "Deux maximes.", "args": "Elle inspire « Fais ton bien avec le moindre mal d’autrui qu’il est possible », moins parfaite que « Fais à autrui comme tu veux qu’on te fasse » mais plus utile peut-être.", "lien": "Ces maximes montrent que la bonté naturelle, moins parfaite que la justice raisonnée, est plus utile : c’est la thèse."}], "concepts": [{"c": "Pitié", "s": "Répugnance naturelle à voir souffrir un être sensible."}, {"c": "Amour de soi", "s": "Instinct de conservation, légitime, que la pitié modère."}, {"c": "État de nature", "s": "Situation hypothétique de l’homme avant la société et les lois."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que la répugnance à faire du mal viendrait de l’éducation ou d’un raisonnement sur la justice.</p><p><b>Le problème.</b> D’où vient la répugnance à faire du mal ?</p><p><b>L’enjeu.</b> Cette thèse n’est pas évidente : comment un sentiment naturel peut-il fonder une règle de conduite sans raisonnement ?</p><p><b>Formule.</b> « On dit souvent que la répugnance à faire du mal viendrait de l’éducation ou d’un raisonnement sur la justice, mais Rousseau soutient : La pitié est un sentiment naturel qui modère l’amour de soi et fonde la répugnance à mal faire, indépendamment de l’éducation. »</p><p><b>Discussion.</b> La morale est-elle fondée sur le sentiment ? Rousseau privilégie le sentiment sur la raison. Est-ce une base suffisante pour le devoir ? (À comparer avec Kant.)</p>", "intro": ["On croit souvent que la répugnance à faire du mal s’apprend par l’éducation, ou découle d’un raisonnement sur la justice. Dans le <i>Discours sur l’origine et les fondements de l’inégalité parmi les hommes</i>, Rousseau soutient qu’elle vient d’un sentiment naturel : la pitié.", "Rousseau soutient la thèse suivante : La pitié est un sentiment naturel qui modère l’amour de soi et fonde la répugnance à mal faire, indépendamment de l’éducation. Elle inspire une maxime de bonté naturelle, moins parfaite mais plus utile que la justice raisonnée. Cette thèse n’est pas évidente : comment un sentiment naturel peut-il fonder une règle de conduite sans raisonnement ?", "Le texte avance en deux temps. Des lignes 1 à 13 : « Un sentiment naturel » ; « Sans réflexion » ; « Elle tient lieu de lois » ; « Un exemple ». Des lignes 14 à 24 : « Deux maximes »."], "dev": [{"l": "1-13", "obj": "Un sentiment naturel ; Sans réflexion ; Elle tient lieu de lois ; Un exemple.", "sp": ["<b>Un sentiment naturel.</b> La pitié est naturelle : elle modère l’amour de soi et concourt à la conservation de l’espèce.", "<b>Sans réflexion.</b> Elle nous porte au secours de ceux qui souffrent, sans que nous ayons besoin de raisonner.", "<b>Elle tient lieu de lois.</b> À l’état de nature, elle remplace lois, mœurs et vertu, et personne n’est tenté de désobéir à sa « douce voix ».", "<b>Un exemple.</b> Elle détourne le sauvage robuste d’enlever à un enfant ou à un vieillard leur subsistance, s’il peut trouver la sienne ailleurs."], "tr": "Après avoir établi que la pitié est un sentiment naturel qui agit sans réflexion et tient lieu de lois, Rousseau en tire deux maximes."}, {"l": "14-24", "obj": "Deux maximes.", "sp": ["<b>Deux maximes.</b> Elle inspire « Fais ton bien avec le moindre mal d’autrui qu’il est possible », moins parfaite que « Fais à autrui comme tu veux qu’on te fasse » mais plus utile peut-être."], "tr": ""}], "concl": ["Le texte se demande : « D’où vient la répugnance à faire du mal ? » Rousseau répond ainsi : La pitié est un sentiment naturel qui modère l’amour de soi et fonde la répugnance à mal faire, indépendamment de l’éducation. Elle inspire une maxime de bonté naturelle, moins parfaite mais plus utile que la justice raisonnée.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « Un sentiment naturel ; Sans réflexion ; Elle tient lieu de lois ; Un exemple » puis « Deux maximes ».", "On peut enfin discuter cette thèse. La morale est-elle fondée sur le sentiment ? Rousseau privilégie le sentiment sur la raison. Est-ce une base suffisante pour le devoir ? (À comparer avec Kant.)"]}, {"id": "devoir-sartre", "label": "Sartre : le dilemme moral d’un jeune homme", "theme": "Le devoir", "auteur": "Sartre", "oeuvre": "L’existentialisme est un humanisme", "fiche": "devoir-sartre.html", "lignes": ["Ce jeune homme avait le choix, à ce moment-là, entre", "partir pour l’Angleterre et s’engager dans les Forces", "Françaises Libres – c’est-à-dire abandonner sa mère –", "ou demeurer auprès de sa mère, et l’aider à vivre. Il", "se rendait bien compte que cette femme ne vivait que", "par lui et que sa disparition – et peut-être sa mort –", "la plongerait dans le désespoir. Il se rendait aussi", "compte qu’au fond, concrètement, chaque acte qu’il", "faisait à l’égard de sa mère avait son répondant, dans", "ce sens qu’il l’aidait à vivre, au lieu que chaque", "acte qu’il ferait pour partir et combattre était un", "acte ambigu qui pouvait se perdre dans les sables, ne", "servir à rien : par exemple, partant pour", "l’Angleterre, il pouvait rester indéfiniment dans un", "camp espagnol, en passant par l’Espagne ; il pouvait", "arriver en Angleterre ou à Alger et être mis dans un", "bureau pour faire des écritures.", "Par conséquent, il se trouvait en face de deux types", "d’action très différents : une concrète, immédiate,", "mais ne s’adressant qu’à un individu ; ou bien une", "action qui s’adressait à un ensemble infiniment plus", "vaste, une collectivité nationale, mais qui était par", "là même ambiguë, et qui pouvait être interrompue en", "route. Et, en même temps, il hésitait entre deux types", "de morale. D’une part, une morale de la sympathie, du", "dévouement individuel ; et d’autre part, une morale", "plus large, mais d’une efficacité plus contestable. Il", "fallait choisir entre les deux. Qui pouvait l’aider à", "choisir ?"], "mots": "Mots-clés : Dilemme moral, Morale de la sympathie, Engagement.", "lire": "<p><b>Objet du texte.</b> Comment décider quand deux devoirs s’opposent ? <b>Notion du programme.</b> Le devoir.</p><p><b>Connecteurs repérés.</b> « par conséquent » (l.18), « mais » (l.20). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Dilemme moral</i> : situation où deux obligations s’opposent sans solution évidente. ; <i>Morale de la sympathie</i> : morale du dévouement à une personne concrète. ; <i>Engagement</i> : choix d’agir pour une cause, avec ses risques.</p>", "these": "<p><b>Thèse.</b> Le dilemme du jeune homme oppose une morale de la sympathie, concrète mais limitée à un individu, et une morale plus large mais d’efficacité contestable. Aucune règle générale ne peut trancher à sa place.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « Deux choix » ; « Une mère qui ne vit que par lui » ; « Une action concrète ou ambiguë » ; « Individu ou collectivité » ; « Deux types de morale ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-7", "idee": "Deux choix ; Une mère qui ne vit que par lui.", "args": "Partir pour l’Angleterre rejoindre les Forces Françaises Libres, ou rester auprès de sa mère pour l’aider à vivre. Sa disparition, peut-être sa mort, la plongerait dans le désespoir.", "lien": "Après avoir exposé les deux choix et la situation de la mère, Sartre montre leur différence : une action concrète mais limitée, ou une action large mais incertaine."}, {"l": "7-24", "idee": "Une action concrète ou ambiguë ; Individu ou collectivité.", "args": "Chaque acte pour sa mère a un répondant. L’acte de partir peut se perdre dans les sables : camp espagnol, bureau à Alger… Une action concrète et immédiate, mais pour un seul ; ou une action qui s’adresse à toute une nation, mais ambiguë et interruptible.", "lien": "Si les deux devoirs s’opposent comme deux types de morale, il faut se demander qui peut aider à choisir."}, {"l": "24-29", "idee": "Deux types de morale.", "args": "Morale de la sympathie et du dévouement individuel ; morale plus large, d’efficacité plus contestable. Qui pouvait l’aider à choisir ?", "lien": "La question finale donne la thèse : aucune règle générale ne peut trancher à la place du jeune homme."}], "concepts": [{"c": "Dilemme moral", "s": "Situation où deux obligations s’opposent sans solution évidente."}, {"c": "Morale de la sympathie", "s": "Morale du dévouement à une personne concrète."}, {"c": "Engagement", "s": "Choix d’agir pour une cause, avec ses risques."}], "probleme": "<p><b>L’opinion remise en cause.</b> Qu’il suffirait d’appliquer une règle morale générale pour savoir quoi faire.</p><p><b>Le problème.</b> Comment décider quand deux devoirs s’opposent ?</p><p><b>L’enjeu.</b> Le texte expose un dilemme : il faut montrer pourquoi aucune règle ne peut le trancher.</p><p><b>Formule.</b> « On dit souvent qu’il suffirait d’appliquer une règle morale générale pour savoir quoi faire, mais Sartre soutient : Le dilemme du jeune homme oppose une morale de la sympathie, concrète mais limitée à un individu, et une morale plus large mais d’efficacité contestable. »</p><p><b>Discussion.</b> Qui peut aider à choisir ? La suite du texte répond : personne, ni la morale chrétienne, ni Kant. Le choix est libre et responsable. (À comparer avec Kant.)</p>", "intro": ["On croit souvent qu’il suffit d’appliquer une règle morale générale pour savoir ce qu’il faut faire. Dans <i>L’existentialisme est un humanisme</i>, Sartre expose le cas d’un jeune homme qui doit choisir entre deux devoirs.", "Sartre soutient la thèse suivante : Le dilemme du jeune homme oppose une morale de la sympathie, concrète mais limitée à un individu, et une morale plus large mais d’efficacité contestable. Aucune règle générale ne peut trancher à sa place. Le texte expose un dilemme : il faut montrer pourquoi aucune règle ne peut le trancher.", "Le texte avance en trois temps. Des lignes 1 à 7 : « Deux choix » ; « Une mère qui ne vit que par lui ». Des lignes 7 à 24 : « Une action concrète ou ambiguë » ; « Individu ou collectivité ». Des lignes 24 à 29 : « Deux types de morale »."], "dev": [{"l": "1-7", "obj": "Deux choix ; Une mère qui ne vit que par lui.", "sp": ["<b>Deux choix.</b> Partir pour l’Angleterre rejoindre les Forces Françaises Libres, ou rester auprès de sa mère pour l’aider à vivre.", "<b>Une mère qui ne vit que par lui.</b> Sa disparition, peut-être sa mort, la plongerait dans le désespoir."], "tr": "Après avoir exposé les deux choix et la situation de la mère, Sartre montre leur différence : une action concrète mais limitée, ou une action large mais incertaine."}, {"l": "7-24", "obj": "Une action concrète ou ambiguë ; Individu ou collectivité.", "sp": ["<b>Une action concrète ou ambiguë.</b> Chaque acte pour sa mère a un répondant. L’acte de partir peut se perdre dans les sables : camp espagnol, bureau à Alger…", "<b>Individu ou collectivité.</b> Une action concrète et immédiate, mais pour un seul ; ou une action qui s’adresse à toute une nation, mais ambiguë et interruptible."], "tr": "Si les deux devoirs s’opposent comme deux types de morale, il faut se demander qui peut aider à choisir."}, {"l": "24-29", "obj": "Deux types de morale.", "sp": ["<b>Deux types de morale.</b> Morale de la sympathie et du dévouement individuel ; morale plus large, d’efficacité plus contestable. Qui pouvait l’aider à choisir ?"], "tr": ""}], "concl": [
