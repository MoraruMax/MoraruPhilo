.side-note{margin-top:18px;font-size:13.5px;color:var(--ink-soft);border-top:1px solid var(--line);padding-top:14px}
main{min-width:0}

.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--blue)}
.consigne{color:var(--ink-soft);max-width:66ch;margin:4px 0 22px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:16px;min-width:0}
.field>label,.field>.lab{font-weight:700;font-size:14.5px}

textarea{font:inherit;font-size:16px;color:var(--ink);width:100%;resize:vertical;border:0;border-left:2px solid var(--red);

.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 22px}
.term{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr);gap:8px 16px;align-items:start;margin-bottom:14px}
.term input{font-weight:700}
.frame{font-family:var(--f-display);font-size:18px;font-style:italic;color:var(--ink-soft);margin:6px 0}
.part{border:1px solid var(--line);border-radius:8px;margin-bottom:14px;background:var(--paper)}
.part>summary{cursor:pointer;padding:12px 16px;font-weight:700;display:flex;gap:10px;align-items:baseline;list-style:none}
.part>summary::-webkit-details-marker{display:none}
.part>summary::before{content:"▸";color:var(--blue);transition:transform .15s}
.part[open]>summary::before{transform:rotate(90deg)}
.part>summary .num{font-family:var(--f-display);color:var(--blue);font-size:19px}
.part .inner{padding:4px 16px 12px}
.sub{border-top:1px dashed var(--rule-strong);padding-top:12px;margin-top:6px}
.sub h4{margin:0 0 8px;font-size:14px;color:var(--ink-soft);letter-spacing:.04em}
.sub.opt h4::after{content:" (facultative)";font-weight:400}
.trans{background:var(--paper-2);border-radius:6px;padding:12px 14px 2px;margin-top:10px}
.trans textarea{background-color:var(--paper-2)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;align-items:center}
.btn{font:inherit;font-weight:700;font-size:15px;border-radius:8px;padding:10px 16px;cursor:pointer;border:1.5px solid var(--blue);background:var(--paper);color:var(--blue)}
.btn.primary{background:var(--blue);color:var(--paper)}
.btn.red{border-color:var(--red);color:var(--red)}

.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn.ghost{border-color:transparent;color:var(--ink-soft);padding-inline:8px}
.liens{grid-column:1/-1;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 22px}

.liens-aide{margin:10px 0 6px;font-size:14px;color:var(--ink-soft)}
.liens ul{margin:6px 0 4px;padding-left:20px}
.liens li{margin:4px 0}
.liens a{color:var(--blue)}
.btn.depot{display:inline-block;text-decoration:none;line-height:1.2}
.depot-note{margin:12px 0 0;font-size:14px;color:var(--ink-soft)}
.spacer{flex:1}
.pen{margin-top:22px;border-left:3px solid var(--red);background:var(--red-soft);border-radius:0 8px 8px 0;padding:14px 18px}
.pen .who{font-family:var(--f-hand);color:var(--red);font-size:21px;font-weight:700;line-height:1.2;margin-bottom:6px}
.pen p{margin:0 0 10px;max-width:68ch}
.pen ul{margin:0 0 10px;padding-left:20px}
.pen li{margin-bottom:4px}
.pen .muted{color:var(--ink-soft);font-size:14px}
.model{margin-top:22px;border:1.5px solid var(--red);border-radius:8px;padding:16px 20px;background:var(--paper)}
.model .who{font-family:var(--f-hand);color:var(--red);font-size:21px;font-weight:700}
.model .warn{font-size:13.5px;color:var(--ink-soft);margin:0 0 10px}
.model p{max-width:68ch}
.model .mpart{margin:14px 0 6px;font-family:var(--f-display);font-weight:700;font-size:17.5px}
.model .msub{margin:8px 0 8px 14px;font-size:15px}
.model .msub b{color:var(--ink)}
.model dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:2px 12px;margin:4px 0 0}
.model dt{color:var(--ink-soft);font-size:13.5px}
.model dd{margin:0}
.model .mtrans{background:var(--paper-2);border-radius:6px;padding:8px 12px;margin:10px 0 0 14px;font-size:15px}
.grille{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.palier{border:1px solid var(--line);border-radius:8px;padding:12px 16px;display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px}
.palier .lvl{font-family:var(--f-display);font-weight:700;font-size:17px;color:var(--ink-soft);font-variant-numeric:tabular-nums;line-height:1.25}
.palier.reached{border-color:var(--ok)}
.palier.reached .lvl{color:var(--ok)}
.palier label{display:flex;gap:9px;align-items:flex-start;font-size:15px;margin-bottom:5px;cursor:pointer}
.palier input{margin-top:4px;accent-color:var(--blue);width:17px;height:17px;flex:none}
.verdict{margin-top:16px;padding:14px 18px;border-radius:8px;background:var(--blue-soft);color:var(--ink);font-size:16px}
.verdict b{font-family:var(--f-display);font-size:20px;color:var(--blue)}
.valorise{font-size:14.5px;color:var(--ink-soft);max-width:70ch;margin:0 0 14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-weight:700;font-size:14px}
.conseil{margin:18px 0 -6px;font-size:14px;color:var(--ink-soft)}
.copy-fallback{width:100%;min-height:160px;margin-top:10px;font-size:13px;background-image:none;border:1px solid var(--line)}

const TEXTS = [{"id": "art-arendt", "label": "Arendt : l’œuvre d’art", "theme": "L’art", "auteur": "Arendt", "oeuvre": "La crise de la culture", "fiche": "art-arendt.html", "lignes": ["Parmi les choses qu'on ne rencontre pas dans la", "nature, mais seulement dans le monde fabriqué par", "l'homme, on distingue entre objets d'usage et œuvres", "d'art ; tous deux possèdent une certaine permanence", "qui va de la durée ordinaire à une immortalité", "potentielle dans le cas de l'œuvre d'art. […]. Du", "point de vue de la durée pure, les œuvres d'art sont", "clairement supérieures à toutes les autres choses ;", "comme elles durent plus longtemps au monde que", "n'importe quoi d'autre, elles sont les plus mondaines", "des choses. Davantage, elles sont les seules choses à", "n'avoir aucune fonction dans le processus vital de la", "société ; à proprement parler, elles ne sont pas", "fabriquées pour les hommes, mais pour le monde, qui", "est destiné à survivre à la vie limitée des mortels,", "au va-et-vient des générations.", "Non seulement elles ne sont pas consommées comme des", "biens de consommation, ni usées comme des objets", "d'usage : mais elles sont délibérément écartées des", "procès de consommation et d'utilisation, et isolées", "loin de la sphère des nécessités de la vie humaine.", "[…] [On n’a affaire à] un monde, au sens propre du", "terme, que lorsque la totalité des objets fabriqués", "est organisée au point de résister au procès de", "consommation nécessaire à la vie des gens qui y", "demeurent, et, ainsi, de leur survivre. C’est", "seulement là où une telle subsistance est assurée que", "nous parlons de culture ; c’est seulement là où nous", "sommes confrontés à des choses qui existent", "indépendamment de toute référence utilitaire et", "fonctionnelle, et dont la qualité demeure toujours", "semblable à elle-même, que nous parlons d’œuvre d’art."], "mots": "Mots-clés : Objet d’usage, Œuvre d’art, Monde.", "lire": "<p><b>Objet du texte.</b> Qu’est-ce qui fait la spécificité de l’œuvre d’art ? <b>Notion du programme.</b> L’art.</p><p><b>Connecteurs repérés.</b> « mais » (l.2), « ainsi » (l.26). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Objet d’usage</i> : chose fabriquée pour servir, qui s’use. ; <i>Œuvre d’art</i> : chose fabriquée pour durer, sans fonction utilitaire. ; <i>Monde</i> : ensemble d’objets durables qui survivent à la vie des mortels.</p>", "these": "<p><b>Thèse.</b> L’œuvre d’art est l’objet fabriqué qui dure le plus et n’a aucune fonction utilitaire. Elle est écartée de la consommation pour appartenir au monde, qui survit aux mortels : c’est là que naît la culture.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « Dans le monde fabriqué » ; « Les plus durables » ; « Sans fonction vitale » ; « Écartées de la consommation » ; « Monde et culture ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-16", "idee": "Dans le monde fabriqué ; Les plus durables ; Sans fonction vitale.", "args": "Parmi les choses fabriquées par l’homme, on distingue objets d’usage et œuvres d’art. Tous deux ont une certaine permanence. Les œuvres d’art ont une immortalité potentielle : elles sont supérieures par la durée, les plus mondaines des choses. Elles n’ont aucune fonction dans le processus vital de la société : elles sont faites pour le monde, qui survit aux mortels.", "lien": "De la durée et de l’inutilité des œuvres, on passe à leur place dans le monde : puisqu’elles ne servent à rien, elles ne sont pas consommées."}, {"l": "17-21", "idee": "Écartées de la consommation.", "args": "Ni consommées, ni usées : isolées de la sphère des nécessités de la vie humaine.", "lien": "Si les œuvres échappent à la consommation, elles appartiennent à un monde stable, qui survit aux mortels : on peut en conclure que la culture naît là."}, {"l": "22-32", "idee": "Monde et culture.", "args": "Un monde existe quand les objets résistent à la consommation et survivent. La culture et l’œuvre d’art apparaissent quand des choses existent indépendamment de toute référence utilitaire.", "lien": "Cette dernière étape donne la thèse : l’œuvre d’art, durable et inutile, est ce qui fonde un monde commun, donc la culture."}], "concepts": [{"c": "Objet d’usage", "s": "Chose fabriquée pour servir, qui s’use."}, {"c": "Œuvre d’art", "s": "Chose fabriquée pour durer, sans fonction utilitaire."}, {"c": "Monde", "s": "Ensemble d’objets durables qui survivent à la vie des mortels."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que l’œuvre d’art serait un objet de consommation comme un autre, ou qu’elle se justifierait par son utilité.</p><p><b>Le problème.</b> Qu’est-ce qui fait la spécificité de l’œuvre d’art ?</p><p><b>L’enjeu.</b> Cette thèse n’est pas évidente : comment un objet sans aucune utilité peut-il être ce qui fonde la culture ?</p><p><b>Formule.</b> « On dit souvent que l’œuvre d’art serait un objet de consommation comme un autre, ou qu’elle se justifierait par son utilité, mais Arendt soutient : L’œuvre d’art est l’objet fabriqué qui dure le plus et n’a aucune fonction utilitaire. »</p><p><b>Discussion.</b> L’art est-il inutile ? Si l’art n’a aucune fonction, pourquoi nous importe-t-il ? (À comparer avec Bourdieu.)</p>", "intro": ["On croit souvent que l’œuvre d’art est un objet de consommation parmi d’autres, ou qu’elle se justifie par son utilité (distraire, décorer). Dans ce texte de <i>La crise de la culture</i>, Arendt se demande au contraire ce qui fait sa spécificité.", "Arendt soutient la thèse suivante : L’œuvre d’art est l’objet fabriqué qui dure le plus et n’a aucune fonction utilitaire. Elle est écartée de la consommation pour appartenir au monde, qui survit aux mortels : c’est là que naît la culture. Cette thèse n’est pas évidente : comment un objet sans aucune utilité peut-il être ce qui fonde la culture ?", "Le texte avance en trois temps. Des lignes 1 à 16 : « Dans le monde fabriqué » ; « Les plus durables » ; « Sans fonction vitale ». Des lignes 17 à 21 : « Écartées de la consommation ». Des lignes 22 à 32 : « Monde et culture »."], "dev": [{"l": "1-16", "obj": "Dans le monde fabriqué ; Les plus durables ; Sans fonction vitale.", "sp": ["<b>Dans le monde fabriqué.</b> Parmi les choses fabriquées par l’homme, on distingue objets d’usage et œuvres d’art. Tous deux ont une certaine permanence.", "<b>Les plus durables.</b> Les œuvres d’art ont une immortalité potentielle : elles sont supérieures par la durée, les plus mondaines des choses.", "<b>Sans fonction vitale.</b> Elles n’ont aucune fonction dans le processus vital de la société : elles sont faites pour le monde, qui survit aux mortels."], "tr": "De la durée et de l’inutilité des œuvres, on passe à leur place dans le monde : puisqu’elles ne servent à rien, elles ne sont pas consommées."}, {"l": "17-21", "obj": "Écartées de la consommation.", "sp": ["<b>Écartées de la consommation.</b> Ni consommées, ni usées : isolées de la sphère des nécessités de la vie humaine."], "tr": "Si les œuvres échappent à la consommation, elles appartiennent à un monde stable, qui survit aux mortels : on peut en conclure que la culture naît là."}, {"l": "22-32", "obj": "Monde et culture.", "sp": ["<b>Monde et culture.</b> Un monde existe quand les objets résistent à la consommation et survivent. La culture et l’œuvre d’art apparaissent quand des choses existent indépendamment de toute référence utilitaire."], "tr": ""}], "concl": ["Le texte se demande : « Qu’est-ce qui fait la spécificité de l’œuvre d’art ? » Arendt répond ainsi : L’œuvre d’art est l’objet fabriqué qui dure le plus et n’a aucune fonction utilitaire. Elle est écartée de la consommation pour appartenir au monde, qui survit aux mortels : c’est là que naît la culture.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « Dans le monde fabriqué ; Les plus durables ; Sans fonction vitale » puis « Écartées de la consommation » puis « Monde et culture ».", "On peut enfin discuter cette thèse. L’art est-il inutile ? Si l’art n’a aucune fonction, pourquoi nous importe-t-il ? (À comparer avec Bourdieu.)"]}, {"id": "art-bourdieu", "label": "Bourdieu : l’idéologie charismatique", "theme": "L’art", "auteur": "Bourdieu", "oeuvre": "Encyclopædia universalis, « Art – Consommation culturelle »", "fiche": "art-bourdieu.html", "lignes": ["Contre l’idéologie charismatique qui tient les goûts", "en matière de culture légitime pour un don de la", "nature, l’observation scientifique montre que les", "besoins culturels sont le produit de l’éducation :", "l’enquête établit que toutes les pratiques culturelles", "(fréquentation des musées, des concerts, des", "expositions, lecture, etc.) et les préférences", "correspondantes (écrivains, peintres ou musiciens", "préférés par exemple) sont étroitement liés au niveau", "d’instruction (évalué d’après le titre scolaire ou le", "nombre d’années d’étude) et, secondairement, à", "l’origine sociale. Le poids relatif de l’éducation", "proprement scolaire (dont l’efficacité et la durée", "dépendent étroitement de l’origine sociale) et de", "l’éducation familiale varie selon le degré auquel les", "différentes pratiques culturelles sont reconnues et", "préparées par le système scolaire, l’influence de", "l’origine sociale n’étant jamais aussi forte, toutes", "choses étant égales par ailleurs, qu’en matière de «", "culture libre » ou de culture d’avant-garde. À la", "hiérarchie socialement reconnue des arts et, à", "l’intérieur de chacun d’eux, des genres, des écoles ou", "des époques, correspond la hiérarchie sociale des", "consommateurs."], "mots": "Mots-clés : Idéologie charismatique, Culture légitime, Origine sociale.", "lire": "<p><b>Objet du texte.</b> Les goûts en matière de culture sont-ils naturels ou sociaux ? <b>Notion du programme.</b> L’art.</p><p><b>Vocabulaire à éclaircir.</b> <i>Idéologie charismatique</i> : croyance au don naturel, qui masque l’origine sociale des goûts. ; <i>Culture légitime</i> : culture reconnue comme supérieure par la société. ; <i>Origine sociale</i> : milieu familial d’un individu, qui influence son accès à la culture.</p>", "these": "<p><b>Thèse.</b> Le goût n’est pas un don de la nature : les pratiques et préférences culturelles sont liées au niveau d’instruction et à l’origine sociale. À la hiérarchie des arts correspond la hiérarchie sociale des consommateurs.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « Contre l’idéologie charismatique » ; « Une enquête » ; « École et famille » ; « La culture libre dépend plus de l’origine sociale » ; « Deux hiérarchies ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-12", "idee": "Contre l’idéologie charismatique.", "args": "Elle tient les goûts de culture légitime pour un don de la nature. La science montre que ce sont des produits de l’éducation.", "lien": "Après avoir écarté l’idée d’un don naturel, il faut établir ce qui détermine réellement les goûts : l’enquête le montre."}, {"l": "12-20", "idee": "Une enquête ; École et famille ; La culture libre dépend plus de l’origine sociale.", "args": "Toutes les pratiques culturelles (musées, concerts, lecture) et les préférences sont liées au niveau d’instruction et, secondairement, à l’origine sociale. Le poids de l’éducation scolaire et familiale varie selon que les pratiques sont reconnues et préparées par l’école. L’influence de l’origine sociale est la plus forte pour la culture libre ou d’avant-garde.", "lien": "Si l’école et la famille déterminent les pratiques, on peut généraliser : les hiérarchies culturelles recoupent les hiérarchies sociales."}, {"l": "20-24", "idee": "Deux hiérarchies.", "args": "À la hiérarchie des arts correspond la hiérarchie sociale des consommateurs.", "lien": "Cette correspondance confirme la thèse : le goût n’est pas un don de la nature, il est social."}], "concepts": [{"c": "Idéologie charismatique", "s": "Croyance au don naturel, qui masque l’origine sociale des goûts."}, {"c": "Culture légitime", "s": "Culture reconnue comme supérieure par la société."}, {"c": "Origine sociale", "s": "Milieu familial d’un individu, qui influence son accès à la culture."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que le goût serait un don naturel, une sensibilité innée.</p><p><b>Le problème.</b> Les goûts en matière de culture sont-ils naturels ou sociaux ?</p><p><b>L’enjeu.</b> Cette thèse n’est pas évidente : comment un goût que l’on éprouve comme personnel et spontané peut-il dépendre de l’origine sociale ?</p><p><b>Formule.</b> « On dit souvent que le goût serait un don naturel, une sensibilité innée, mais Bourdieu soutient : Le goût n’est pas un don de la nature : les pratiques et préférences culturelles sont liées au niveau d’instruction et à l’origine sociale. »</p><p><b>Discussion.</b> Le goût est-il libre ? Si nos goûts sont socialement déterminés, que reste-t-il de la liberté d’aimer ? (À comparer avec Kant et Hume.)</p>", "intro": ["On dit volontiers que l’amour de l’art est affaire de don : certains auraient du goût, d’autres non. Dans cet article d’<i>Encyclopædia universalis</i>, Bourdieu s’oppose à cette « idéologie charismatique ».", "Bourdieu soutient la thèse suivante : Le goût n’est pas un don de la nature : les pratiques et préférences culturelles sont liées au niveau d’instruction et à l’origine sociale. À la hiérarchie des arts correspond la hiérarchie sociale des consommateurs. Cette thèse n’est pas évidente : comment un goût que l’on éprouve comme personnel et spontané peut-il dépendre de l’origine sociale ?", "Le texte avance en trois temps. Des lignes 1 à 12 : « Contre l’idéologie charismatique ». Des lignes 12 à 20 : « Une enquête » ; « École et famille » ; « La culture libre dépend plus de l’origine sociale ». Des lignes 20 à 24 : « Deux hiérarchies »."], "dev": [{"l": "1-12", "obj": "Contre l’idéologie charismatique.", "sp": ["<b>Contre l’idéologie charismatique.</b> Elle tient les goûts de culture légitime pour un don de la nature. La science montre que ce sont des produits de l’éducation."], "tr": "Après avoir écarté l’idée d’un don naturel, il faut établir ce qui détermine réellement les goûts : l’enquête le montre."}, {"l": "12-20", "obj": "Une enquête ; École et famille ; La culture libre dépend plus de l’origine sociale.", "sp": ["<b>Une enquête.</b> Toutes les pratiques culturelles (musées, concerts, lecture) et les préférences sont liées au niveau d’instruction et, secondairement, à l’origine sociale.", "<b>École et famille.</b> Le poids de l’éducation scolaire et familiale varie selon que les pratiques sont reconnues et préparées par l’école.", "<b>La culture libre dépend plus de l’origine sociale.</b> L’influence de l’origine sociale est la plus forte pour la culture libre ou d’avant-garde."], "tr": "Si l’école et la famille déterminent les pratiques, on peut généraliser : les hiérarchies culturelles recoupent les hiérarchies sociales."}, {"l": "20-24", "obj": "Deux hiérarchies.", "sp": ["<b>Deux hiérarchies.</b> À la hiérarchie des arts correspond la hiérarchie sociale des consommateurs."], "tr": ""}], "concl": ["Le texte se demande : « Les goûts en matière de culture sont-ils naturels ou sociaux ? » Bourdieu répond ainsi : Le goût n’est pas un don de la nature : les pratiques et préférences culturelles sont liées au niveau d’instruction et à l’origine sociale. À la hiérarchie des arts correspond la hiérarchie sociale des consommateurs.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « Contre l’idéologie charismatique » puis « Une enquête ; École et famille ; La culture libre dépend plus de l’origine sociale » puis « Deux hiérarchies ».", "On peut enfin discuter cette thèse. Le goût est-il libre ? Si nos goûts sont socialement déterminés, que reste-t-il de la liberté d’aimer ? (À comparer avec Kant et Hume.)"]}, {"id": "art-hume-delicatesse", "label": "Hume : la délicatesse du goût", "theme": "L’art", "auteur": "Hume", "oeuvre": "Essais esthétiques", "fiche": "art-hume-delicatesse.html", "lignes": ["Deux de mes parents furent une fois appelés pour", "donner leur opinion au sujet d’un fût de vin, supposé", "excellent parce que vieux et de bonne vinée. L’un deux", "le goûte et le juge, et après mûre réflexion, énonce", "que le vin serait bon, n’était-ce ce petit goût de", "cuir qu’il perçoit en lui. L’autre, après avoir pris", "les mêmes précautions, rend aussi un verdict favorable", "au vin, mais sous la réserve d’un goût de fer, qu’il", "pouvait aisément distinguer. Vous ne pouvez imaginer à", "quel point tous deux furent tournées en ridicule pour", "leur jugement. Mais qui rit à la fin ? En vidant le", "tonneau, on trouve en son fond une vieille clé,", "attachée à une courroie de cuir.", "Cervantès, Don Quichotte (cité par Hume dans Essais", "esthétiques)", "Un juge véritable en matière de beaux-arts est un", "caractère si rare, même durant les époques les plus", "policées : un sens fort, uni à un sentiment délicat,", "amélioré par la pratique, rendu parfait par la", "comparaison, et clarifié de tout préjugé, peut seul", "conférer à un critique ce caractère inestimable. Et", "les verdicts réunis de tels hommes, où qu’on puisse", "les trouver, constituent la véritable norme du goût et", "de la beauté."], "mots": "Mots-clés : Délicatesse, Norme du goût, Préjugé.", "lire": "<p><b>Objet du texte.</b> Existe-t-il une norme du goût ? <b>Notion du programme.</b> L’art.</p><p><b>Connecteurs repérés.</b> « parce que » (l.3), « mais » (l.8), « si… » (l.17). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Délicatesse</i> : aptitude à percevoir les moindres nuances. ; <i>Norme du goût</i> : critère partagé auquel on se réfère pour juger les œuvres. ; <i>Préjugé</i> : opinion adoptée sans examen, qui fausse le jugement.</p>", "these": "<p><b>Thèse.</b> Un vrai juge en matière de beaux-arts est rare : il réunit un sens fort, un sentiment délicat, la pratique, la comparaison et l’absence de préjugé. Les verdicts de tels hommes constituent la norme du goût.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « L’histoire du fût de vin » ; « On se moque d’eux » ; « Le fond du tonneau » ; « Un juge véritable est rare » ; « Une norme collective ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-13", "idee": "L’histoire du fût de vin ; On se moque d’eux ; Le fond du tonneau.", "args": "Deux parents goûtent un vin réputé excellent. L’un perçoit un petit goût de cuir, l’autre de fer. On les ridiculise pour leur jugement. Mais qui rit à la fin ? On y trouve une vieille clé attachée à une courroie de cuir : ils avaient raison.", "lien": "L’anecdote montre qu’un goût fin existe ; reste à dire qui en est capable, et à quelles conditions."}, {"l": "14-21", "idee": "Un juge véritable est rare.", "args": "Il faut un sens fort, un sentiment délicat, amélioré par la pratique, perfectionné par la comparaison, et libre de préjugé.", "lien": "Si les vrais juges sont rares, le goût ne peut pas être n’importe lequel : c’est l’accord de leurs verdicts qui fait la norme."}, {"l": "21-24", "idee": "Une norme collective.", "args": "Les verdicts réunis de tels hommes constituent la véritable norme du goût et de la beauté.", "lien": "La norme du goût n’est pas dans l’objet mais dans l’accord des meilleurs juges : c’est la réponse à la question."}], "concepts": [{"c": "Délicatesse", "s": "Aptitude à percevoir les moindres nuances."}, {"c": "Norme du goût", "s": "Critère partagé auquel on se réfère pour juger les œuvres."}, {"c": "Préjugé", "s": "Opinion adoptée sans examen, qui fausse le jugement."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que le goût serait purement personnel : à chacun ses goûts, et l’on ne discute pas des goûts.</p><p><b>Le problème.</b> Existe-t-il une norme du goût ?</p><p><b>L’enjeu.</b> Cette thèse n’est pas évidente : si le goût repose sur un sentiment, comment une norme est-elle possible ?</p><p><b>Formule.</b> « On dit souvent que le goût serait purement personnel : à chacun ses goûts, et l’on ne discute pas des goûts, mais Hume soutient : Un vrai juge en matière de beaux-arts est rare : il réunit un sens fort, un sentiment délicat, la pratique, la comparaison et l’absence de préjugé. »</p><p><b>Discussion.</b> Une norme fondée sur des experts ? Qui désigne les bons juges ? Y a-t-il un risque de cercle ? (À comparer avec Bourdieu.)</p>", "intro": ["On dit souvent que des goûts et des couleurs on ne discute pas : il n’y aurait aucune norme en matière de beauté. Dans ses <i>Essais esthétiques</i>, Hume part pourtant d’une anecdote pour montrer qu’un bon goût existe.", "Hume soutient la thèse suivante : Un vrai juge en matière de beaux-arts est rare : il réunit un sens fort, un sentiment délicat, la pratique, la comparaison et l’absence de préjugé. Les verdicts de tels hommes constituent la norme du goût. Cette thèse n’est pas évidente : si le goût repose sur un sentiment, comment une norme est-elle possible ?", "Le texte avance en trois temps. Des lignes 1 à 13 : « L’histoire du fût de vin » ; « On se moque d’eux » ; « Le fond du tonneau ». Des lignes 14 à 21 : « Un juge véritable est rare ». Des lignes 21 à 24 : « Une norme collective »."], "dev": [{"l": "1-13", "obj": "L’histoire du fût de vin ; On se moque d’eux ; Le fond du tonneau.", "sp": ["<b>L’histoire du fût de vin.</b> Deux parents goûtent un vin réputé excellent. L’un perçoit un petit goût de cuir, l’autre de fer.", "<b>On se moque d’eux.</b> On les ridiculise pour leur jugement. Mais qui rit à la fin ?", "<b>Le fond du tonneau.</b> On y trouve une vieille clé attachée à une courroie de cuir : ils avaient raison."], "tr": "L’anecdote montre qu’un goût fin existe ; reste à dire qui en est capable, et à quelles conditions."}, {"l": "14-21", "obj": "Un juge véritable est rare.", "sp": ["<b>Un juge véritable est rare.</b> Il faut un sens fort, un sentiment délicat, amélioré par la pratique, perfectionné par la comparaison, et libre de préjugé."], "tr": "Si les vrais juges sont rares, le goût ne peut pas être n’importe lequel : c’est l’accord de leurs verdicts qui fait la norme."}, {"l": "21-24", "obj": "Une norme collective.", "sp": ["<b>Une norme collective.</b> Les verdicts réunis de tels hommes constituent la véritable norme du goût et de la beauté."], "tr": ""}], "concl": ["Le texte se demande : « Existe-t-il une norme du goût ? » Hume répond ainsi : Un vrai juge en matière de beaux-arts est rare : il réunit un sens fort, un sentiment délicat, la pratique, la comparaison et l’absence de préjugé. Les verdicts de tels hommes constituent la norme du goût.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « L’histoire du fût de vin ; On se moque d’eux ; Le fond du tonneau » puis « Un juge véritable est rare » puis « Une norme collective ».", "On peut enfin discuter cette thèse. Une norme fondée sur des experts ? Qui désigne les bons juges ? Y a-t-il un risque de cercle ? (À comparer avec Bourdieu.)"]}, {"id": "art-hume-sentiment", "label": "Hume : opinion et sentiment", "theme": "L’art", "auteur": "Hume", "oeuvre": "Essais esthétiques", "fiche": "art-hume-sentiment.html", "lignes": ["Parmi un millier d’opinions différentes que des hommes", "divers entretiennent sur le même sujet, il y en a une,", "et une seulement, qui est juste et vraie. Et la seule", "difficulté est de la déterminer et de la rendre", "certaine. Au contraire, un millier de sentiments", "différents, excités par le même objet, sont justes,", "parce qu’aucun sentiment ne représente ce qui est", "réellement dans l’objet. [...] La beauté n’est pas une", "qualité inhérente aux choses elles-mêmes, elle existe", "seulement dans l’esprit qui la contemple, et chaque", "esprit perçoit une beauté différente. Une personne", "peut même percevoir de la difformité là où un autre", "perçoit de la beauté. Et tout individu devrait être", "d’accord avec son propre sentiment, sans prétendre", "régler ceux des autres."], "mots": "Mots-clés : Opinion, Sentiment, Qualité inhérente.", "lire": "<p><b>Objet du texte.</b> Les jugements de goût peuvent-ils être vrais ou faux ? <b>Notion du programme.</b> L’art.</p><p><b>Vocabulaire à éclaircir.</b> <i>Opinion</i> : jugement sur un fait, qui peut être vrai ou faux. ; <i>Sentiment</i> : réaction affective d’un esprit, ni vraie ni fausse. ; <i>Qualité inhérente</i> : propriété qui appartient à l’objet lui-même.</p>", "these": "<p><b>Thèse.</b> Un sentiment n’est ni vrai ni faux : il exprime l’esprit qui contemple, non une propriété de l’objet. Chacun devrait s’en tenir à son propre sentiment sans prétendre régler celui des autres.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « Une seule opinion est vraie » ; « Tous les sentiments sont justes » ; « La beauté est dans l’esprit » ; « Chaque esprit perçoit une beauté différente » ; « Respecter le sentiment d’autrui ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-5", "idee": "Une seule opinion est vraie.", "args": "Parmi mille opinions sur un même sujet, une seule est vraie : la difficulté est de la déterminer.", "lien": "Après avoir montré qu’une opinion peut être vraie ou fausse, Hume oppose le sentiment : tous sont justes, car aucun ne se rapporte à l’objet."}, {"l": "5-11", "idee": "Tous les sentiments sont justes ; La beauté est dans l’esprit.", "args": "Parmi mille sentiments excités par le même objet, tous sont justes, car aucun ne représente ce qui est dans l’objet. Elle n’est pas une qualité des choses : elle existe seulement dans l’esprit qui la contemple.", "lien": "Si le sentiment exprime l’esprit et non l’objet, chaque esprit perçoit une beauté différente : d’où la conclusion pratique."}, {"l": "11-15", "idee": "Chaque esprit perçoit une beauté différente ; Respecter le sentiment d’autrui.", "args": "Une personne peut voir de la difformité là où un autre voit de la beauté. Chacun devrait s’accorder avec son propre sentiment, sans prétendre régler ceux des autres.", "lien": "Cette conclusion (s’en tenir à son sentiment) confirme la thèse : le goût n’est ni vrai ni faux."}], "concepts": [{"c": "Opinion", "s": "Jugement sur un fait, qui peut être vrai ou faux."}, {"c": "Sentiment", "s": "Réaction affective d’un esprit, ni vraie ni fausse."}, {"c": "Qualité inhérente", "s": "Propriété qui appartient à l’objet lui-même."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que « c’est beau » serait un jugement vrai ou faux, comme un jugement sur un fait.</p><p><b>Le problème.</b> Les jugements de goût peuvent-ils être vrais ou faux ?</p><p><b>L’enjeu.</b> Cette thèse n’est pas évidente : si tous les sentiments sont justes, peut-on encore discuter de la beauté ?</p><p><b>Formule.</b> « On dit souvent que « c’est beau » serait un jugement vrai ou faux, comme un jugement sur un fait, mais Hume soutient : Un sentiment n’est ni vrai ni faux : il exprime l’esprit qui contemple, non une propriété de l’objet. »</p><p><b>Discussion.</b> Tous les goûts se valent-ils ? Si tous les sentiments sont justes, la critique d’art a-t-elle un sens ? Hume y répond dans le texte suivant. (À comparer avec Kant.)</p>", "intro": ["On dit « ce tableau est beau » comme on dit « ce mur est blanc », comme si la beauté était une propriété de l’objet que l’on pourrait constater juste ou fausse. Dans ses <i>Essais esthétiques</i>, Hume soutient l’inverse.", "Hume soutient la thèse suivante : Un sentiment n’est ni vrai ni faux : il exprime l’esprit qui contemple, non une propriété de l’objet. Chacun devrait s’en tenir à son propre sentiment sans prétendre régler celui des autres. Cette thèse n’est pas évidente : si tous les sentiments sont justes, peut-on encore discuter de la beauté ?", "Le texte avance en trois temps. Des lignes 1 à 5 : « Une seule opinion est vraie ». Des lignes 5 à 11 : « Tous les sentiments sont justes » ; « La beauté est dans l’esprit ». Des lignes 11 à 15 : « Chaque esprit perçoit une beauté différente » ; « Respecter le sentiment d’autrui »."], "dev": [{"l": "1-5", "obj": "Une seule opinion est vraie.", "sp": ["<b>Une seule opinion est vraie.</b> Parmi mille opinions sur un même sujet, une seule est vraie : la difficulté est de la déterminer."], "tr": "Après avoir montré qu’une opinion peut être vraie ou fausse, Hume oppose le sentiment : tous sont justes, car aucun ne se rapporte à l’objet."}, {"l": "5-11", "obj": "Tous les sentiments sont justes ; La beauté est dans l’esprit.", "sp": ["<b>Tous les sentiments sont justes.</b> Parmi mille sentiments excités par le même objet, tous sont justes, car aucun ne représente ce qui est dans l’objet.", "<b>La beauté est dans l’esprit.</b> Elle n’est pas une qualité des choses : elle existe seulement dans l’esprit qui la contemple."], "tr": "Si le sentiment exprime l’esprit et non l’objet, chaque esprit perçoit une beauté différente : d’où la conclusion pratique."}, {"l": "11-15", "obj": "Chaque esprit perçoit une beauté différente ; Respecter le sentiment d’autrui.", "sp": ["<b>Chaque esprit perçoit une beauté différente.</b> Une personne peut voir de la difformité là où un autre voit de la beauté.", "<b>Respecter le sentiment d’autrui.</b> Chacun devrait s’accorder avec son propre sentiment, sans prétendre régler ceux des autres."], "tr": ""}], "concl": ["Le texte se demande : « Les jugements de goût peuvent-ils être vrais ou faux ? » Hume répond ainsi : Un sentiment n’est ni vrai ni faux : il exprime l’esprit qui contemple, non une propriété de l’objet. Chacun devrait s’en tenir à son propre sentiment sans prétendre régler celui des autres.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « Une seule opinion est vraie » puis « Tous les sentiments sont justes ; La beauté est dans l’esprit » puis « Chaque esprit perçoit une beauté différente ; Respecter le sentiment d’autrui ».", "On peut enfin discuter cette thèse. Tous les goûts se valent-ils ? Si tous les sentiments sont justes, la critique d’art a-t-elle un sens ? Hume y répond dans le texte suivant. (À comparer avec Kant.)"]}, {"id": "art-kant", "label": "Kant : le jugement de goût", "theme": "L’art", "auteur": "Kant", "oeuvre": "Critique de la faculté de juger", "fiche": "art-kant.html", "lignes": ["Kant, Critique de la faculté de juger", "Le goût est la faculté de juger et d’apprécier un", "objet ou un mode de représentation par une", "satisfaction ou un déplaisir, indépendamment de tout", "intérêt. On appelle beau l’objet d’une telle", "satisfaction.", "L’un aime le son des instruments à vent, l’autre celui", "des instruments à cordes. Discuter là-dessus avec", "l’intention de dénoncer l’erreur du jugement d’autrui", "qui diffère du nôtre, comme s’il lui était logiquement", "opposé, serait pure folie ; le principe : à chacun son", "goût (s’agissant des sens) vaut dans le domaine de", "l’agréable.", "Il serait (tout au contraire) ridicule que quelqu’un", "qui se flatterait d’avoir du goût songeât à en donner", "la preuve en disant : cet objet (l’édifice que nous", "voyons, le vêtement que porte celui-ci, le concert que", "nous entendons, le poème qui est soumis à notre", "appréciation) est beau pour moi. Car ce qui lui plaît", "à lui simplement, il ne doit pas le qualifier de beau.", "[...] Lorsqu’il donne une chose pour belle, il", "attribue aux autres la même satisfaction, il ne juge", "pas simplement pour lui, mais pour quiconque et parle", "alors de la beauté comme si c’était une propriété des", "choses. Aussi dit-il : la chose est belle ; et en", "jugeant de la satisfaction il ne compte pas sur", "l’adhésion d’autrui parce qu’il l’a obtenue en maintes", "occasions, mais il exige d’eux cette adhésion.", "[Le beau est] ce qui plaît universellement sans", "concept.", "[Le beau est] l’objet d’une finalité sans fin.", "[Le jugement de goût doit] donc posséder un principe", "subjectif qui détermine uniquement par sentiment, et", "non par des concepts, mais cependant d’une manière", "universellement valide, ce qui plaît ou déplaît. [...]", "Ce n’est donc qu’à travers la supposition qu’il existe", "un sens commun (par quoi, toutefois, nous n’entendons", "pas un sens externe, mais l’effet résultant du libre", "jeu de nos facultés de connaître), ce n’est, dis-je,", "qu’à travers la supposition d’un tel sens commun que", "le jugement de goût peut être porté."], "mots": "Mots-clés : Désintéressement, Agréable, Universalité sans concept.", "lire": "<p><b>Objet du texte.</b> Le jugement sur le beau est-il purement subjectif ? <b>Notion du programme.</b> L’art.</p><p><b>Connecteurs repérés.</b> « car » (l.19), « mais » (l.23), « alors » (l.24), « si… » (l.24), « donc » (l.32), « cependant » (l.34). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Désintéressement</i> : satisfaction qui ne dépend d’aucun intérêt pour l’existence de l’objet. ; <i>Agréable</i> : ce qui plaît aux sens : affaire de goût personnel. ; <i>Universalité sans concept</i> : le beau prétend valoir pour tous, sans qu’on puisse le démontrer par des concepts.</p>", "these": "<p><b>Thèse.</b> Le jugement de goût est subjectif, car il repose sur le sentiment, mais il exige l’accord de tous, et suppose un sens commun. Il se distingue de l’agréable, qui reste affaire de goût personnel.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « Le goût est désintéressé » ; « L’agréable : à chacun son goût » ; « Mais on ne dit pas « beau pour moi » » ; « Le beau plaît universellement sans concept » ; « Un sens commun ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-6", "idee": "Le goût est désintéressé.", "args": "Le goût juge un objet par une satisfaction ou un déplaisir, indépendamment de tout intérêt. Le beau est l’objet d’une telle satisfaction.", "lien": "Le goût étant désintéressé, il faut le distinguer de l’agréable, qui reste affaire de goût personnel."}, {"l": "7-28", "idee": "L’agréable : à chacun son goût ; Mais on ne dit pas « beau pour moi ».", "args": "L’un aime les instruments à vent, l’autre les cordes. Discuter serait folie : dans l’agréable, chacun a son goût. Celui qui juge un objet beau lui attribue la beauté comme une propriété et attend l’adhésion de tous. Il l’exige.", "lien": "De cette distinction, on déduit que le jugement sur le beau exige l’accord de tous : il suppose donc un principe commun."}, {"l": "29-41", "idee": "Le beau plaît universellement sans concept ; Un sens commun.", "args": "Le beau est ce qui plaît universellement sans concept, et l’objet d’une finalité sans fin. Un tel jugement, fondé sur le sentiment mais valable pour tous, suppose un sens commun : l’effet du libre jeu de nos facultés de connaître.", "lien": "Le sens commun fonde cette prétention à l’universalité : le jugement de goût est subjectif sans être purement personnel."}], "concepts": [{"c": "Désintéressement", "s": "Satisfaction qui ne dépend d’aucun intérêt pour l’existence de l’objet."}, {"c": "Agréable", "s": "Ce qui plaît aux sens : affaire de goût personnel."}, {"c": "Universalité sans concept", "s": "Le beau prétend valoir pour tous, sans qu’on puisse le démontrer par des concepts."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que le beau serait affaire de goût personnel, comme l’agréable.</p><p><b>Le problème.</b> Le jugement sur le beau est-il purement subjectif ?</p><p><b>L’enjeu.</b> Cette thèse est paradoxale : un jugement fondé sur le sentiment peut-il prétendre à l’accord de tous ?</p><p><b>Formule.</b> « On dit souvent que le beau serait affaire de goût personnel, comme l’agréable, mais Kant soutient : Le jugement de goût est subjectif, car il repose sur le sentiment, mais il exige l’accord de tous, et suppose un sens commun. »</p><p><b>Discussion.</b> L’universel sans preuve ? Kant exige l’accord de tous, mais sans possibilité de le prouver. Comment justifier cette exigence ? (À comparer avec Hume.)</p>", "intro": ["On dit souvent que des goûts et des couleurs on ne discute pas : le beau ne serait que ce qui plaît à chacun. Dans ce texte de la <i>Critique de la faculté de juger</i>, Kant montre pourtant que le jugement sur le beau n’est pas un simple goût personnel.", "Kant soutient la thèse suivante : Le jugement de goût est subjectif, car il repose sur le sentiment, mais il exige l’accord de tous, et suppose un sens commun. Il se distingue de l’agréable, qui reste affaire de goût personnel. Cette thèse est paradoxale : un jugement fondé sur le sentiment peut-il prétendre à l’accord de tous ?", "Le texte avance en trois temps. Des lignes 1 à 6 : « Le goût est désintéressé ». Des lignes 7 à 28 : « L’agréable : à chacun son goût » ; « Mais on ne dit pas « beau pour moi » ». Des lignes 29 à 41 : « Le beau plaît universellement sans concept » ; « Un sens commun »."], "dev": [{"l": "1-6", "obj": "Le goût est désintéressé.", "sp": ["<b>Le goût est désintéressé.</b> Le goût juge un objet par une satisfaction ou un déplaisir, indépendamment de tout intérêt. Le beau est l’objet d’une telle satisfaction."], "tr": "Le goût étant désintéressé, il faut le distinguer de l’agréable, qui reste affaire de goût personnel."}, {"l": "7-28", "obj": "L’agréable : à chacun son goût ; Mais on ne dit pas « beau pour moi ».", "sp": ["<b>L’agréable : à chacun son goût.</b> L’un aime les instruments à vent, l’autre les cordes. Discuter serait folie : dans l’agréable, chacun a son goût.", "<b>Mais on ne dit pas « beau pour moi ».</b> Celui qui juge un objet beau lui attribue la beauté comme une propriété et attend l’adhésion de tous. Il l’exige."], "tr": "De cette distinction, on déduit que le jugement sur le beau exige l’accord de tous : il suppose donc un principe commun."}, {"l": "29-41", "obj": "Le beau plaît universellement sans concept ; Un sens commun.", "sp": ["<b>Le beau plaît universellement sans concept.</b> Le beau est ce qui plaît universellement sans concept, et l’objet d’une finalité sans fin.", "<b>Un sens commun.</b> Un tel jugement, fondé sur le sentiment mais valable pour tous, suppose un sens commun : l’effet du libre jeu de nos facultés de connaître."], "tr": ""}], "concl": ["Le texte se demande : « Le jugement sur le beau est-il purement subjectif ? » Kant répond ainsi : Le jugement de goût est subjectif, car il repose sur le sentiment, mais il exige l’accord de tous, et suppose un sens commun. Il se distingue de l’agréable, qui reste affaire de goût personnel.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « Le goût est désintéressé » puis « L’agréable : à chacun son goût ; Mais on ne dit pas « beau pour moi » » puis « Le beau plaît universellement sans concept ; Un sens commun ».", "On peut enfin discuter cette thèse. L’universel sans preuve ? Kant exige l’accord de tous, mais sans possibilité de le prouver. Comment justifier cette exigence ? (À comparer avec Hume.)"]}, {"id": "bonheur-aristophane", "label": "Aristophane : le mythe des moitiés séparées", "theme": "Le bonheur", "auteur": "Platon (Aristophane)", "oeuvre": "Le Banquet", "fiche": "bonheur-aristophane.html", "lignes": ["Jadis notre nature n’était pas ce qu’elle est à", "présent, elle était bien différente.", "D’abord il y avait trois espèces d’hommes, et non", "deux, comme aujourd’hui : le mâle, la femelle et,", "outre ces deux-là, une troisième composée des deux", "autres ; le nom seul en reste aujourd’hui, l’espèce a", "disparu. C’était l’espèce androgyne qui avait la forme", "et le nom des deux autres, mâle et femelle, dont elle", "était formée ; aujourd’hui elle n’existe plus et c’est", "un nom décrié. De plus chaque homme était dans son", "ensemble de forme ronde, avec un dos et des flancs", "arrondis, quatre mains, autant de jambes, deux visages", "tout à fait pareils sur un cou rond, et sur ces deux", "visages opposés une seule tête, quatre oreilles, deux", "organes de la génération et tout le reste à l’avenant.", "Il marchait droit, comme à présent, dans le sens qu’il", "voulait, et, quand il se mettait à courir vite, il", "faisait comme les saltimbanques qui tournent en cercle", "en lançant leurs jambes en l’air ; s’appuyant sur", "leurs membres qui étaient au nombre de huit, ils", "tournaient rapidement sur eux-mêmes. Et ces trois", "espèces étaient ainsi conformées parce que le mâle", "tirait son origine du soleil, la femelle de la terre,", "l’espèce mixte de la lune, qui participe de l’un et de", "l’autre. Ils étaient sphériques et leur démarche", "aussi, parce qu’ils ressemblaient à leurs parents ;", "ils étaient aussi d’une force et d’une vigueur", "extraordinaires, et comme ils avaient de grands", "courages, ils attaquèrent les dieux, et ce qu’Homère", "dit d’Ephialte et d’Otos, on le dit d’eux, à savoir", "qu’ils tentèrent d’escalader le ciel pour combattre", "les dieux.", "Alors Zeus délibéra avec les autres dieux sur le parti", "à prendre. Le cas était embarrassant : ils ne", "pouvaient se décider à tuer les hommes et à détruire", "la race humaine à coups de tonnerre, comme ils avaient", "tué les géants ; car c’était anéantir les hommages et", "le culte que les hommes rendent aux dieux ; d’un autre", "côté, ils ne pouvaient non plus tolérer leur", "insolence. Enfin, Jupiter, ayant trouvé, non sans", "peine, un expédient, prit la parole : « Je crois, dit-", "il, tenir le moyen de conserver les hommes tout en", "mettant un terme à leur licence ; c’est de les rendre", "plus faibles. Je vais immédiatement les couper en deux", "l’un après l’autre ; nous obtiendrons ainsi le double", "résultat de les affaiblir et de tirer d’eux davantage,", "puisqu’ils seront plus nombreux. Ils marcheront droit", "sur leurs deux jambes. S’ils continuent à se montrer", "insolents et ne veulent pas se tenir en repos, je les", "couperai encore une fois en deux, et les réduirai à", "marcher sur une jambe à cloche-pied ».", "Ayant ainsi parlé, il coupa les hommes en deux, comme", "on coupe les alizes pour les sécher ou comme on coupe", "un œuf avec un cheveu ; et chaque fois qu’il en avait", "coupé un, il ordonnait à Apollon de retourner le", "visage et la moitié du cou du côté de la coupure, afin", "qu’en voyant sa coupure l’homme devînt plus modeste,", "et il lui commandait de guérir le reste. Apollon", "retournait donc le visage et, ramassant de partout la", "peau sur ce qu’on appelle à présent le ventre, comme", "on fait des bourses à courroie, il ne laissait qu’un", "orifice et liait la peau au milieu du ventre ; c’est", "ce qu’on appelle le nombril. Puis il polissait la", "plupart des plis et façonnait la poitrine avec un", "instrument pareil à celui dont les cordonniers se", "servent pour polir sur la forme les plis du cuir ;", "mais il laissait quelques plis, ceux qui sont au", "ventre même et au nombril, pour être un souvenir de", "l’antique châtiment.", "Or quand le corps eut été ainsi divisé, chacun,", "regrettant sa moitié, allait à elle ; et, s’embrassant", "et s’enlaçant les uns les autres avec le désir de se", "fondre ensemble, les hommes mouraient de faim et", "d’inaction, parce qu’ils ne voulaient rien faire les", "uns sans les autres ; et quand une moitié était morte", "et que l’autre survivait, celle-ci en cherchait une", "autre et s’enlaçait à elle, soit que ce fût une moitié", "de femme entière –ce qu’on appelle une femme", "aujourd’hui –soit que ce fût une moitié d’homme, et la", "race s’éteignait.", "Alors Zeus, touché de pitié, imagine un autre", "expédient ; il transpose les organes de la génération", "sur le devant ; jusqu’alors ils les portaient", "derrière, et ils engendraient et enfantaient non point", "les uns dans les autres, mais sur la terre, comme les", "cigales. Il plaça donc les organes sur le devant et", "par là fit que les hommes engendrèrent les uns dans", "les autres, c’est-à-dire le mâle dans la femelle.", "Cette disposition était à deux fins : si l’étreinte", "avait lieu entre un homme et une femme, ils", "enfanteraient pour perpétuer la race, et, si elle", "avait lieu entre un mâle et un mâle, la satiété les", "séparerait pour un temps, ils se mettraient au travail", "et pourvoiraient à tous les besoins de l’existence.", "C’est de ce moment que date l’amour inné des hommes", "les uns pour les autres : l’amour recompose l’antique", "nature, s’efforce de fondre deux êtres en un seul, et", "de guérir la nature humaine."], "mots": "Mots-clés : Androgyne, Hybris (insolence), Manque.", "lire": "<p><b>Objet du texte.</b> D’où vient le désir d’aimer ? <b>Notion du programme.</b> Le bonheur.</p><p><b>Connecteurs repérés.</b> « ainsi » (l.22), « parce que » (l.22), « alors » (l.33), « car » (l.37), « donc » (l.59), « mais » (l.67). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Androgyne</i> : dans le mythe, être double composé des deux sexes. ; <i>Hybris (insolence)</i> : excès de force qui défie les dieux et appelle un châtiment. ; <i>Manque</i> : ce qui nous fait désirer : l’être incomplet désire ce qui lui fait défaut.</p>", "these": "<p><b>Thèse.</b> L’amour naît d’un manque : la nature humaine était autrefois complète, elle a été coupée en deux par punition. Aimer, c’est chercher à retrouver sa moitié perdue, à guérir la nature humaine.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « Une nature ancienne différente » ; « Des êtres puissants et insolents » ; « Zeus les coupe en deux » ; « Chacun cherche sa moitié » ; « L’amour, remède ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-32", "idee": "Une nature ancienne différente.", "args": "Il y avait trois espèces d’hommes : mâle, femelle et androgyne, de forme ronde, à quatre bras, quatre jambes et deux visages.", "lien": "Après avoir décrit la nature ancienne (des êtres doubles et puissants), il faut expliquer pourquoi elle a changé : la punition de Zeus."}, {"l": "33-80", "idee": "Des êtres puissants et insolents ; Zeus les coupe en deux.", "args": "Issus du soleil, de la terre et de la lune, ils étaient d’une force extraordinaire et tentèrent d’escalader le ciel pour combattre les dieux. Il ne veut pas les détruire, car il perdrait leurs hommages. Il décide de les affaiblir en les coupant en deux.", "lien": "La division laisse chaque moitié incomplète : elle cherche donc l’autre, et Zeus aménage les corps pour que l’union soit possible."}, {"l": "81-98", "idee": "Chacun cherche sa moitié ; L’amour, remède.", "args": "Les moitiés s’enlaçaient avec le désir de se fondre, au point de mourir de faim et d’inaction. Zeus déplace les organes de la génération : l’étreinte permet l’enfantement ou le repos. Depuis, l’amour recompose l’antique nature et guérit la nature humaine.", "lien": "L’amour est le remède à ce manque : le désir d’aimer vient de la nature humaine coupée en deux."}], "concepts": [{"c": "Androgyne", "s": "Dans le mythe, être double composé des deux sexes."}, {"c": "Hybris (insolence)", "s": "Excès de force qui défie les dieux et appelle un châtiment."}, {"c": "Manque", "s": "Ce qui nous fait désirer : l’être incomplet désire ce qui lui fait défaut."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que l’amour serait une simple recherche du plaisir, ou la rencontre de deux êtres faits l’un pour l’autre par hasard.</p><p><b>Le problème.</b> D’où vient le désir d’aimer ?</p><p><b>L’enjeu.</b> La thèse est exposée sous forme de mythe : il faut comprendre ce que le récit veut dire, sans le prendre à la lettre.</p><p><b>Formule.</b> « On dit souvent que l’amour serait une simple recherche du plaisir, ou la rencontre de deux êtres faits l’un pour l’autre par hasard, mais Platon (Aristophane) soutient : L’amour naît d’un manque : la nature humaine était autrefois complète, elle a été coupée en deux par punition. »</p><p><b>Discussion.</b> Le bonheur dans la fusion ? Le mythe suppose qu’on est heureux uni à son autre moitié. Est-ce réaliste ? (À comparer avec Épictète.)</p>", "intro": ["On dit souvent que l’amour est une simple recherche du plaisir, ou la rencontre fortuite de deux êtres. Dans ce passage du <i>Banquet</i> de Platon, Aristophane lui donne, par un mythe, une autre origine : un manque.", "Platon (Aristophane) soutient la thèse suivante : L’amour naît d’un manque : la nature humaine était autrefois complète, elle a été coupée en deux par punition. Aimer, c’est chercher à retrouver sa moitié perdue, à guérir la nature humaine. La thèse est exposée sous forme de mythe : il faut comprendre ce que le récit veut dire, sans le prendre à la lettre.", "Le texte avance en trois temps. Des lignes 1 à 32 : « Une nature ancienne différente ». Des lignes 33 à 80 : « Des êtres puissants et insolents » ; « Zeus les coupe en deux ». Des lignes 81 à 98 : « Chacun cherche sa moitié » ; « L’amour, remède »."], "dev": [{"l": "1-32", "obj": "Une nature ancienne différente.", "sp": ["<b>Une nature ancienne différente.</b> Il y avait trois espèces d’hommes : mâle, femelle et androgyne, de forme ronde, à quatre bras, quatre jambes et deux visages."], "tr": "Après avoir décrit la nature ancienne (des êtres doubles et puissants), il faut expliquer pourquoi elle a changé : la punition de Zeus."}, {"l": "33-80", "obj": "Des êtres puissants et insolents ; Zeus les coupe en deux.", "sp": ["<b>Des êtres puissants et insolents.</b> Issus du soleil, de la terre et de la lune, ils étaient d’une force extraordinaire et tentèrent d’escalader le ciel pour combattre les dieux.", "<b>Zeus les coupe en deux.</b> Il ne veut pas les détruire, car il perdrait leurs hommages. Il décide de les affaiblir en les coupant en deux."], "tr": "La division laisse chaque moitié incomplète : elle cherche donc l’autre, et Zeus aménage les corps pour que l’union soit possible."}, {"l": "81-98", "obj": "Chacun cherche sa moitié ; L’amour, remède.", "sp": ["<b>Chacun cherche sa moitié.</b> Les moitiés s’enlaçaient avec le désir de se fondre, au point de mourir de faim et d’inaction.", "<b>L’amour, remède.</b> Zeus déplace les organes de la génération : l’étreinte permet l’enfantement ou le repos. Depuis, l’amour recompose l’antique nature et guérit la nature humaine."], "tr": ""}], "concl": ["Le texte se demande : « D’où vient le désir d’aimer ? » Platon (Aristophane) répond ainsi : L’amour naît d’un manque : la nature humaine était autrefois complète, elle a été coupée en deux par punition. Aimer, c’est chercher à retrouver sa moitié perdue, à guérir la nature humaine.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « Une nature ancienne différente » puis « Des êtres puissants et insolents ; Zeus les coupe en deux » puis « Chacun cherche sa moitié ; L’amour, remède ».", "On peut enfin discuter cette thèse. Le bonheur dans la fusion ? Le mythe suppose qu’on est heureux uni à son autre moitié. Est-ce réaliste ? (À comparer avec Épictète.)"]}, {"id": "bonheur-bergson", "label": "Bergson : la joie, signe de la création", "theme": "Le bonheur", "auteur": "Bergson", "oeuvre": "L’énergie spirituelle", "fiche": "bonheur-bergson.html", "lignes": ["Les philosophes qui ont spéculé sur la signification", "de la vie et sur la destinée de l’homme n’ont pas", "assez remarqué que la nature a pris la peine de nous", "renseigner là-dessus elle-même. Elle nous avertit par", "un signe précis que notre destination est atteinte. Ce", "signe est la joie. Je dis la joie, je ne dis pas le", "plaisir. Le plaisir n’est qu’un artifice imaginé par", "la nature pour obtenir de l’être vivant la", "conservation de la vie ; il n’indique pas la direction", "où la vie est lancée. Mais la joie annonce toujours", "que la vie a réussi, qu’elle a gagné du terrain,", "qu’elle a remporté une victoire : toute grande joie a", "un accent triomphal. Or, si nous tenons compte de", "cette indication et si nous suivons cette nouvelle", "ligne de faits, nous trouvons que partout où il y a", "joie, il y a création : plus riche est la création,", "plus profonde est la joie.", "La mère qui regarde son enfant est joyeuse, parce", "qu’elle a conscience de l’avoir créé, physiquement et", "moralement. Le commerçant qui développe ses affaires,", "le chef d’usine qui voit prospérer son industrie, est-", "il joyeux en raison de l’argent qu’il gagne et de la", "notoriété qu’il acquiert ? Richesse et considération", "entrent évidemment pour beaucoup dans la satisfaction", "qu’il ressent, mais elles lui apportent des plaisirs", "plutôt que de la joie, et ce qu’il goûte de joie vraie", "est le sentiment d’avoir monté une entreprise qui", "marche, d’avoir appelé quelque chose à la vie. Prenez", "des joies exceptionnelles, celle de l’artiste qui a", "réalisé sa pensée, celle du savant qui a découvert ou", "inventé.", "Vous entendrez dire que ces hommes travaillent pour la", "gloire et qu’ils tirent leurs joies les plus vives de", "l’admiration qu’ils inspirent. Erreur profonde ! On", "tient à l’éloge et aux honneurs dans l’exacte mesure", "où l’on n’est pas sûr d’avoir réussi. […] Mais celui", "qui est sûr, absolument sûr, d'avoir produit une œuvre", "viable et durable, celui-là n'a plus que faire de", "l'éloge et se sent au-dessus de la gloire, parce qu'il", "est créateur, parce qu'il le sait, et parce que la", "joie qu'il éprouve est une joie divine."], "mots": "Mots-clés : Joie, Plaisir, Création.", "lire": "<p><b>Objet du texte.</b> Qu’est-ce qui indique que nous avons atteint notre destination ? <b>Notion du programme.</b> Le bonheur.</p><p><b>Connecteurs repérés.</b> « mais » (l.10), « or » (l.13), « si… » (l.13), « parce que » (l.40). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Joie</i> : sentiment de la vie qui réussit et crée. ; <i>Plaisir</i> : artifice de la nature pour obtenir la conservation de la vie. ; <i>Création</i> : fait d’appeler quelque chose à la vie : œuvre, enfant, entreprise.</p>", "these": "<p><b>Thèse.</b> La joie, et non le plaisir, est le signe que la vie a atteint sa destination. Elle accompagne la création. Plus la création est riche, plus la joie est profonde. Le créateur sûr de son œuvre n’a plus besoin de gloire.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « La nature nous renseigne » ; « Joie et plaisir » ; « Joie et création » ; « Le commerçant et le chef d’usine » ; « L’artiste, le savant, la gloire ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-17", "idee": "La nature nous renseigne ; Joie et plaisir.", "args": "Elle nous avertit par un signe précis que notre destination est atteinte : la joie. Le plaisir n’est qu’un artifice de la nature pour conserver la vie. La joie annonce que la vie a réussi, gagné du terrain : elle a un accent triomphal.", "lien": "Après avoir distingué la joie du plaisir, Bergson montre ce qui la provoque : la création, qu’il illustre par plusieurs exemples."}, {"l": "18-31", "idee": "Joie et création ; Le commerçant et le chef d’usine.", "args": "Partout où il y a joie, il y a création ; plus la création est riche, plus la joie est profonde. Exemple : la mère qui regarde son enfant. Richesse et considération lui apportent des plaisirs, mais la vraie joie est le sentiment d’avoir monté une entreprise qui marche, d’avoir appelé quelque chose à la vie.", "lien": "Si la joie accompagne la création, on peut en tirer une conséquence : même le créateur n’a pas besoin de gloire."}, {"l": "32-41", "idee": "L’artiste, le savant, la gloire.", "args": "On tient à l’éloge dans la mesure où l’on n’est pas sûr d’avoir réussi. Qui est sûr d’avoir produit une œuvre viable est au-dessus de la gloire : sa joie est divine.", "lien": "Cette dernière étape confirme la thèse : la joie, et non la gloire, est le signe que la vie a atteint sa destination."}], "concepts": [{"c": "Joie", "s": "Sentiment de la vie qui réussit et crée."}, {"c": "Plaisir", "s": "Artifice de la nature pour obtenir la conservation de la vie."}, {"c": "Création", "s": "Fait d’appeler quelque chose à la vie : œuvre, enfant, entreprise."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que nous poursuivrions le plaisir, et que l’artiste ou l’homme d’affaires travaillerait pour la gloire ou la richesse.</p><p><b>Le problème.</b> Qu’est-ce qui indique que nous avons atteint notre destination ?</p><p><b>L’enjeu.</b> Cette thèse n’est pas évidente : la joie se distingue-t-elle vraiment du plaisir, et la gloire ne compte-t-elle pas pour le créateur ?</p><p><b>Formule.</b> « On dit souvent que nous poursuivrions le plaisir, et que l’artiste ou l’homme d’affaires travaillerait pour la gloire ou la richesse, mais Bergson soutient : La joie, et non le plaisir, est le signe que la vie a atteint sa destination. »</p><p><b>Discussion.</b> Le bonheur est-il créateur ? Tous les bonheurs viennent-ils de la création ? Que dire de la joie de contempler ? (À comparer avec Épicure.)</p>", "intro": ["On pense souvent que nous poursuivons le plaisir, et que les artistes ou les hommes d’affaires travaillent pour la gloire ou la richesse. Dans <i>L’énergie spirituelle</i>, Bergson soutient qu’un autre signe nous indique que la vie a atteint son but : la joie.", "Bergson soutient la thèse suivante : La joie, et non le plaisir, est le signe que la vie a atteint sa destination. Elle accompagne la création. Plus la création est riche, plus la joie est profonde. Le créateur sûr de son œuvre n’a plus besoin de gloire. Cette thèse n’est pas évidente : la joie se distingue-t-elle vraiment du plaisir, et la gloire ne compte-t-elle pas pour le créateur ?", "Le texte avance en trois temps. Des lignes 1 à 17 : « La nature nous renseigne » ; « Joie et plaisir ». Des lignes 18 à 31 : « Joie et création » ; « Le commerçant et le chef d’usine ». Des lignes 32 à 41 : « L’artiste, le savant, la gloire »."], "dev": [{"l": "1-17", "obj": "La nature nous renseigne ; Joie et plaisir.", "sp": ["<b>La nature nous renseigne.</b> Elle nous avertit par un signe précis que notre destination est atteinte : la joie.", "<b>Joie et plaisir.</b> Le plaisir n’est qu’un artifice de la nature pour conserver la vie. La joie annonce que la vie a réussi, gagné du terrain : elle a un accent triomphal."], "tr": "Après avoir distingué la joie du plaisir, Bergson montre ce qui la provoque : la création, qu’il illustre par plusieurs exemples."}, {"l": "18-31", "obj": "Joie et création ; Le commerçant et le chef d’usine.", "sp": ["<b>Joie et création.</b> Partout où il y a joie, il y a création ; plus la création est riche, plus la joie est profonde. Exemple : la mère qui regarde son enfant.", "<b>Le commerçant et le chef d’usine.</b> Richesse et considération lui apportent des plaisirs, mais la vraie joie est le sentiment d’avoir monté une entreprise qui marche, d’avoir appelé quelque chose à la vie."], "tr": "Si la joie accompagne la création, on peut en tirer une conséquence : même le créateur n’a pas besoin de gloire."}, {"l": "32-41", "obj": "L’artiste, le savant, la gloire.", "sp": ["<b>L’artiste, le savant, la gloire.</b> On tient à l’éloge dans la mesure où l’on n’est pas sûr d’avoir réussi. Qui est sûr d’avoir produit une œuvre viable est au-dessus de la gloire : sa joie est divine."], "tr": ""}], "concl": ["Le texte se demande : « Qu’est-ce qui indique que nous avons atteint notre destination ? » Bergson répond ainsi : La joie, et non le plaisir, est le signe que la vie a atteint sa destination. Elle accompagne la création. Plus la création est riche, plus la joie est profonde. Le créateur sûr de son œuvre n’a plus besoin de gloire.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « La nature nous renseigne ; Joie et plaisir » puis « Joie et création ; Le commerçant et le chef d’usine » puis « L’artiste, le savant, la gloire ».", "On peut enfin discuter cette thèse. Le bonheur est-il créateur ? Tous les bonheurs viennent-ils de la création ? Que dire de la joie de contempler ? (À comparer avec Épicure.)"]}, {"id": "bonheur-callicles", "label": "Calliclès et Socrate : l’image des tonneaux", "theme": "Le bonheur", "auteur": "Platon", "oeuvre": "Gorgias", "fiche": "bonheur-callicles.html", "lignes": ["Calliclès : Mais voici ce qui est beau et juste", "suivant la nature, je te le dis en toute franchise :", "pour bien vivre, il faut entretenir en soi-même les", "plus fortes passions au lieu de les réprimer, et,", "quand elles ont atteint toute leur force, il faut être", "capable de leur donner satisfaction par son courage et", "son intelligence et de remplir tous ses désirs à", "mesure qu’ils éclosent. (…) [L]e luxe, l’intempérance", "et la liberté, quand ils sont soutenus par la force,", "constituent la vertu et le bonheur.", "Socrate : Considère si tu ne pourrais pas assimiler", "chacune des deux vies, la tempérante et", "l’incontinente, au cas de deux hommes, dont chacun", "posséderait de nombreux tonneaux, l’un des tonneaux en", "bon état et remplis, celui-ci de vin, celui-là de", "miel, un troisième de lait et beaucoup d’autres", "remplis d’autres liqueurs, toutes rares et coûteuses", "et acquises au prix de mille peines et de difficultés", "; mais une fois ses tonneaux remplis, notre homme n’y", "verserait plus rien, ne s’en inquiéterait plus et", "serait tranquille à cet égard. L’autre aurait, comme", "le premier, des liqueurs qu’il pourrait se procurer,", "quoiqu'avec peine, mais n’ayant que des tonneaux", "percés et fêlés, il serait forcé de les remplir jour", "et nuit sans relâche, sous peine des plus grands", "ennuis. Si tu admets que les deux vies sont pareilles", "au cas de ces deux hommes, est-ce que tu soutiendras", "que la vie de l’homme déréglé est plus heureuse que", "celle de l’homme réglé ? Mon allégorie t’amène-t-elle", "à reconnaître que la vie réglée vaut mieux que la vie", "déréglée, ou n’es-tu pas convaincu ?", "Calliclès : Je ne le suis pas, Socrate. L’homme aux", "tonneaux pleins n’a plus aucun plaisir, et c’est cela", "que j’appelais tout à l’heure vivre à la façon d’une", "pierre, puisque, quand il les a remplis, il n’a plus", "ni plaisir ni peine ; mais ce qui fait l’agrément de", "la vie, c’est d’y verser le plus qu’on peut."], "mots": "Mots-clés : Intempérance, Tempérance, Allégorie.", "lire": "<p><b>Objet du texte.</b> Le bonheur consiste-t-il à satisfaire tous ses désirs ? <b>Notion du programme.</b> Le bonheur.</p><p><b>Connecteurs repérés.</b> « mais » (l.1), « si… » (l.11), « puisque » (l.35). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Intempérance</i> : absence de maîtrise de ses désirs. ; <i>Tempérance</i> : maîtrise de ses désirs, qui apporte l’équilibre. ; <i>Allégorie</i> : récit imagé qui représente une idée : ici, les tonneaux.</p>", "these": "<p><b>Thèse.</b> Calliclès soutient que bien vivre, c’est entretenir ses passions et les satisfaire. Socrate objecte qu’une vie réglée vaut mieux que la vie de celui qui remplit sans fin des tonneaux percés. Calliclès rétorque que le plaisir est dans le remplissage.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « La thèse de Calliclès » ; « Deux vies, deux hommes » ; « Le tempérant » ; « L’incontinent » ; « La réponse de Calliclès ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-10", "idee": "La thèse de Calliclès.", "args": "Pour bien vivre, il faut entretenir les plus fortes passions et les satisfaire par courage et intelligence : le luxe, l’intempérance et la liberté, soutenus par la force, sont vertu et bonheur.", "lien": "Après la thèse de Calliclès, Socrate la discute par l’image des deux hommes et de leurs tonneaux."}, {"l": "11-31", "idee": "Deux vies, deux hommes ; Le tempérant ; L’incontinent.", "args": "Socrate compare la vie tempérante et la vie incontinente à deux hommes qui possèdent des tonneaux. Ses tonneaux sont en bon état et remplis (vin, miel, lait). Une fois pleins, il n’a plus à s’en soucier et est tranquille. Ses tonneaux sont percés et fêlés : il doit les remplir jour et nuit sans relâche, sous peine de grands ennuis.", "lien": "Socrate conclut que la vie réglée vaut mieux ; Calliclès rétorque en défendant à nouveau le plaisir."}, {"l": "32-37", "idee": "La réponse de Calliclès.", "args": "L’homme aux tonneaux pleins n’a plus ni plaisir ni peine : il vit « comme une pierre ». L’agrément de la vie, c’est de verser le plus qu’on peut.", "lien": "La réponse de Calliclès montre ce qui sépare les deux hommes : pour lui, le plaisir consiste dans la satisfaction continue des désirs."}], "concepts": [{"c": "Intempérance", "s": "Absence de maîtrise de ses désirs."}, {"c": "Tempérance", "s": "Maîtrise de ses désirs, qui apporte l’équilibre."}, {"c": "Allégorie", "s": "Récit imagé qui représente une idée : ici, les tonneaux."}], "probleme": "<p><b>L’opinion remise en cause.</b> Que bien vivre, ce serait se modérer et mettre de l’ordre dans ses désirs.</p><p><b>Le problème.</b> Le bonheur consiste-t-il à satisfaire tous ses désirs ?</p><p><b>L’enjeu.</b> Ce texte est un dialogue : il oppose deux thèses, et il faut comprendre l’argument de chacun avant de voir ce que le texte donne à penser.</p><p><b>Formule.</b> « On dit souvent que bien vivre, ce serait se modérer et mettre de l’ordre dans ses désirs, mais Platon soutient : Calliclès soutient que bien vivre, c’est entretenir ses passions et les satisfaire. »</p><p><b>Discussion.</b> Qui a raison ? Le plaisir est-il dans la satisfaction du désir ou dans le repos qui suit ? (À comparer avec Épicure.)</p>", "intro": ["On dit souvent que la sagesse consiste à modérer ses désirs pour être heureux. Dans ce dialogue du <i>Gorgias</i>, Platon fait défendre l’inverse à Calliclès, et fait répondre Socrate par une image.", "Platon soutient la thèse suivante : Calliclès soutient que bien vivre, c’est entretenir ses passions et les satisfaire. Socrate objecte qu’une vie réglée vaut mieux que la vie de celui qui remplit sans fin des tonneaux percés. Calliclès rétorque que le plaisir est dans le remplissage. Ce texte est un dialogue : il oppose deux thèses, et il faut comprendre l’argument de chacun avant de voir ce que le texte donne à penser.", "Le texte avance en trois temps. Des lignes 1 à 10 : « La thèse de Calliclès ». Des lignes 11 à 31 : « Deux vies, deux hommes » ; « Le tempérant » ; « L’incontinent ». Des lignes 32 à 37 : « La réponse de Calliclès »."], "dev": [{"l": "1-10", "obj": "La thèse de Calliclès.", "sp": ["<b>La thèse de Calliclès.</b> Pour bien vivre, il faut entretenir les plus fortes passions et les satisfaire par courage et intelligence : le luxe, l’intempérance et la liberté, soutenus par la force, sont vertu et bonheur."], "tr": "Après la thèse de Calliclès, Socrate la discute par l’image des deux hommes et de leurs tonneaux."}, {"l": "11-31", "obj": "Deux vies, deux hommes ; Le tempérant ; L’incontinent.", "sp": ["<b>Deux vies, deux hommes.</b> Socrate compare la vie tempérante et la vie incontinente à deux hommes qui possèdent des tonneaux.", "<b>Le tempérant.</b> Ses tonneaux sont en bon état et remplis (vin, miel, lait). Une fois pleins, il n’a plus à s’en soucier et est tranquille.", "<b>L’incontinent.</b> Ses tonneaux sont percés et fêlés : il doit les remplir jour et nuit sans relâche, sous peine de grands ennuis."], "tr": "Socrate conclut que la vie réglée vaut mieux ; Calliclès rétorque en défendant à nouveau le plaisir."}, {"l": "32-37", "obj": "La réponse de Calliclès.", "sp": ["<b>La réponse de Calliclès.</b> L’homme aux tonneaux pleins n’a plus ni plaisir ni peine : il vit « comme une pierre ». L’agrément de la vie, c’est de verser le plus qu’on peut."], "tr": ""}], "concl": ["Le texte se demande : « Le bonheur consiste-t-il à satisfaire tous ses désirs ? » Platon répond ainsi : Calliclès soutient que bien vivre, c’est entretenir ses passions et les satisfaire. Socrate objecte qu’une vie réglée vaut mieux que la vie de celui qui remplit sans fin des tonneaux percés. Calliclès rétorque que le plaisir est dans le remplissage.", "L’analyse a permis de préciser cette thèse en suivant son cheminement : « La thèse de Calliclès » puis « Deux vies, deux hommes ; Le tempérant ; L’incontinent » puis « La réponse de Calliclès ».", "On peut enfin discuter cette thèse. Qui a raison ? Le plaisir est-il dans la satisfaction du désir ou dans le repos qui suit ? (À comparer avec Épicure.)"]}, {"id": "bonheur-kant-difficulte", "label": "Kant : la difficulté de définir le bonheur", "theme": "Le bonheur", "auteur": "Kant", "oeuvre": "Fondements de la métaphysique des mœurs", "fiche": "bonheur-kant-difficulte.html", "lignes": ["Le concept du bonheur est un concept si indéterminé,", "que, malgré le désir qu’a tout homme d’arriver à être", "heureux, personne ne peut jamais dire en termes précis", "et cohérents ce que véritablement il désire et il", "veut. Il est impossible qu’un être fini, si perspicace", "et en même temps si puissant qu’on le suppose, se", "fasse un concept déterminé de ce qu’il veut ici", "véritablement. Veut-il la richesse ? Que de soucis,", "que d’envie, que de pièces ne peut-il pas par-là", "attirer sur sa tête ! Veut-il beaucoup de connaissance", "et de lumières ? Peut-être cela ne fera-t-il que lui", "donner un regard plus pénétrant pour lui représenter", "d’une manière d’autant plus terrible les maux qui", "jusqu’à présent se dérobent encore à sa vue et qui", "sont pourtant inévitables, ou bien que charger de plus", "de besoins encore ses désirs qu’il a déjà bien assez", "de peine à satisfaire.", "Veut-il une longue vie ? Qui lui répond que ce ne", "serait pas une longue souffrance ? Veut-il du moins la", "santé ? Que de fois l’indisposition du corps a", "détourné d’excès où aurait fait tomber une santé", "parfaite, etc. ! Bref, il est incapable de déterminer", "avec une entière certitude d’après quelque principe ce", "qui le rendrait véritablement heureux : pour cela il", "lui faudrait l’omniscience. On ne peut donc pas agir,", "pour être heureux, d’après des principes déterminés,", "mais seulement d’après des conseils empiriques, qui", "recommandent, par exemple, un régime sévère,", "l’économie, la politesse, la réserve, etc., toutes", "choses qui, selon les enseignements de l’expérience,", "contribuent en thèse générale pour la plus grande part", "au bien-être.", "Il suit de là que les impératifs de la prudence, à", "parler exactement, ne peuvent commander en rien,", "c’est-à-dire représenter des actions d’une manière", "objective comme pratiquement nécessaires, qu’il faut", "les tenir plutôt pour des conseils que pour des", "commandements de la raison ; le problème qui consiste", "à déterminer d’une façon sûre et générale quelle", "action peut favoriser le bonheur d’un être raisonnable", "est un problème tout à fait insoluble ; il n’y a donc", "pas à cet égard d’impératif qui puisse commander, au", "sens strict du mot, de faire ce qui rend heureux,", "parce que le bonheur est un idéal, non de la raison,", "mais de l’imagination. Kant, Fondements de la", "métaphysique des mœurs"], "mots": "Mots-clés : Concept indéterminé, Conseil empirique, Impératif de la prudence.", "lire": "<p><b>Objet du texte.</b> Peut-on déterminer ce qui rend heureux et en faire un devoir ? <b>Notion du programme.</b> Le bonheur.</p><p><b>Connecteurs repérés.</b> « si… » (l.1), « pourtant » (l.15), « donc » (l.25), « mais » (l.27), « parce que » (l.44). Ils marquent l’articulation du raisonnement.</p><p><b>Vocabulaire à éclaircir.</b> <i>Concept indéterminé</i> : notion dont on ne peut fixer précisément le contenu. ; <i>Conseil empirique</i> : recommandation tirée de l’expérience, sans valeur de loi. ; <i>Impératif de la prudence</i> : règle qui conseille ce qu’il faut faire pour être heureux.</p>", "these": "<p><b>Thèse.</b> Le bonheur est un concept indéterminé : aucun être fini ne peut dire avec certitude ce qui le rendrait heureux. On ne peut donc pas agir selon des principes, mais selon des conseils empiriques. Il n’y a pas d’impératif strict du bonheur.</p><p><b>L’argumentation qui s’y rattache.</b> Les moments du texte sont : « Un concept indéterminé » ; « Les exemples » ; « Il faudrait l’omniscience » ; « Des conseils empiriques » ; « Pas d’impératif du bonheur ». Tout n’est pas sur le même plan : la thèse est ce que le texte affirme ; le reste l’établit, en tire les conséquences ou la nuance.</p>", "etapes": [{"l": "1-7", "idee": "Un concept indéterminé.", "args": "Tout homme désire être heureux, mais personne ne peut dire en termes précis et cohérents ce qu’il veut.", "lien": "Après avoir posé que le bonheur est indéterminé, Kant le montre par des exemples (richesse, savoir, vie longue, santé) qui peuvent tous mal tourner."}, {"l": "8-25", "idee": "Les exemples ; Il faudrait l’omniscience.", "args": "La richesse apporte soucis et envie ; la connaissance, des maux plus visibles ; une longue vie peut être une longue souffrance ; la santé peut conduire à des excès. Il est impossible de déterminer avec certitude ce qui rendrait véritablement heureux : il faudrait tout savoir.", "lien": "Si personne ne peut déterminer ce qui le rendrait heureux, on ne peut suivre que des conseils empiriques, jamais des principes."}, {"l": "25-46", "idee": "Des conseils empiriques ; Pas d’impératif du bonheur.", "args": "On ne peut agir que d’après des conseils tiré
